   \u003cpre>\u003ccode class=\"language-markdown\"># AGENTS.md\n\nInvoicing API (FastAPI + PostgreSQL). Read this first; procedures live in .claude/skills/.\n\n## Commands\n- Setup: `pixi install`\n- Fast checks (run before finishing): `pixi run test-fast`\n- Full tests: `pixi run test`\n- Lint: `pixi run lint`\n\n## Map\n- `api/routes/`: one module per resource; handlers stay thin\n- `api/billing/`: money logic; amounts are integer cents, never floats\n- `migrations/`: generated by `pixi run makemigration`; never edit by hand\n- `tests/`: mirrors `api/`\n\n## Rules\n- Change only the files listed in the spec's \"Files in scope\".\n- Never delete, skip, or loosen a test to make it pass.\n- Never commit secrets or `.env` files.\u003c/code>\u003c/pre>\n    \u003cp>What it leaves out matters as much: no history of the project, no style rules a linter already enforces, no\n      step-by-step procedures (those are skills), and no rule that must be \u003cem>guaranteed\u003c/em> (those are hooks). A\n      useful test for every line: would an agent behave differently without it? If not, delete it.\u003c/p>\n    \u003caside class=\"callout tip\">\u003cp>\u003cstrong>Remember:\u003c/strong> commands that run, a map, a few rules. Verify every\n      command in a clean checkout. Delete lines that don't change behaviour.\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"skills\">\n    \u003ch2>Skills and progressive disclosure\u003c/h2>\n    \u003cp>A \u003cstrong>skill\u003c/strong> is a folder with a \u003ccode>SKILL.md\u003c/code> file that teaches an agent one procedure:\n      how to cut a release, add a CLI command, write a migration. Skills follow the open\n      \u003ca href=\"https://agentskills.io\">Agent Skills\u003c/a> format, which Claude Code, Copilot, Codex, Devin, and many\n      other tools understand. In Claude Code, project skills live in \u003ccode>.claude/skills/&lt;name&gt;/SKILL.md\u003c/code>.\u003c/p>\n    \u003cpre>\u003ccode class=\"language-markdown\">---\nname: release-notes\ndescription: Draft release notes from merged pull requests since the last tag. Use when preparing a release.\n---\n\n# Release notes\n\n1. Find the last tag with `git describe --tags --abbrev=0`.\n2. List merged pull requests since then.\n3. Group them using the categories in [categories.md](categories.md).\n...\u003c/code>\u003c/pre>\n    \u003cp>What makes skills efficient is \u003cstrong>progressive disclosure\u003c/strong>, loading in three levels:\u003c/p>\n    \u003col>\n      \u003cli>\u003cstrong>Metadata\u003c/strong> (\u003ccode>name\u003c/code> and \u003ccode>description\u003c/code>): always in context, so the agent\n        knows the skill exists and when to use it. A line or two.\u003c/li>\n      \u003cli>\u003cstrong>Body\u003c/strong> of SKILL.md: loaded only when the skill is used. Keep it under about 500 lines.\u003c/li>\n      \u003cli>\u003cstrong>Linked files\u003c/strong> (references, templates, scripts) in the skill's folder: read only if the body\n        sends the agent there. Scripts can be \u003cem>run\u003c/em> without being read at all.\u003c/li>\n    \u003c/ol>\n    \u003cp>So a fleet can carry dozens of procedures while paying, at startup, only for a line per skill. The skill's\n      \u003ccode>name\u003c/code> must match its folder (lowercase, digits, and single hyphens), and its description, like a\n      subagent's, is a routing rule: what it does and when to use it.\u003c/p>\n    \u003cdiv class=\"runnable\" data-title=\"Check a skill\">\n\u003ctextarea>\nimport fleetlab\n\nskill = \"\"\"---\nname: Release_Notes\ndescription: Release notes.\n---\n\"\"\"\nfor problem in fleetlab.check_skill(skill, \"release-notes\"):\n    print(\"-\", problem)\n\u003c/textarea>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"where-it-belongs\">\n    \u003ch2>AGENTS.md, skill, or hook?\u003c/h2>\n    \u003cp>Every new rule you want agents to follow has a right home. Choosing wrongly either wastes context on every\n      request or leaves something important to chance.\u003c/p>\n    \u003cdiv class=\"scroll\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>If the rule is…\u003c/th>\u003cth>Put it in\u003c/th>\u003cth>Because\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>A fact every agent needs on every task (commands, layout, conventions)\u003c/td>\u003ctd>AGENTS.md\u003c/td>\u003ctd>Always loaded, shared across tools\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>A multi-step procedure needed only sometimes\u003c/td>\u003ctd>A skill\u003c/td>\u003ctd>Loaded only when used\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Something that must never happen, or must always happen\u003c/td>\u003ctd>A hook (M04), plus CI\u003c/td>\u003ctd>Enforced by code; prose can be ignored\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Specific to one role\u003c/td>\u003ctd>That subagent's prompt\u003c/td>\u003ctd>Only that agent pays for it\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Specific to one task\u003c/td>\u003ctd>The spec or the prompt\u003c/td>\u003ctd>Expires with the task\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n    \u003cp>The most common mistake is putting a \u003cem>must\u003c/em> in prose. \"Always run the tests before finishing\" in\n      AGENTS.md is a request. A Stop hook that runs the tests is a guarantee. Keep the prose line if it helps the agent\n      plan, but don't rely on it.\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"focus\">\n    \u003ch2>Keeping each agent's context focused\u003c/h2>\n    \u003cp>The context an agent \u003cem>gathers\u003c/em> matters as much as what it starts with. Three habits keep it focused:\u003c/p>\n    \u003cul>\n      \u003cli>\u003cstrong>Delegate exploration.\u003c/strong> Searching a large codebase fills the window with files that turn out\n        to be irrelevant. Hand that to a subagent (the built-in Explore agent is made for it) and get back a short\n        summary of where things are.\u003c/li>\n      \u003cli>\u003cstrong>Hand off files, not conversations.\u003c/strong> The builder shouldn't read the whole issue thread and\n        the planner's reasoning. It should read \u003ccode>specs/12.md\u003c/code>: the decision, the files in scope, the\n        acceptance criteria. Files are shorter, reviewable, and survive restarts.\u003c/li>\n      \u003cli>\u003cstrong>Size tasks to the window.\u003c/strong> An agent asked to \"refactor the billing module\" will read far\n        more than one asked to \"extract the tax calculation from invoice.py into tax.py\". Smaller tasks need less\n        context and fail more cheaply.\u003c/li>\n    \u003c/ul>\n    \u003cp>When a long run approaches the limit, Claude Code \u003cstrong>compacts\u003c/strong> the conversation: it summarises\n      earlier turns to make room. Summaries lose detail, so an instruction given once early in a long chat can fade.\n      Constraints that must survive belong in files the agent re-reads (AGENTS.md, the spec), not in a message near the\n      start. A subagent can lower its compaction threshold with \u003ccode>autoCompactWindow\u003c/code>, and one that doesn't\n      need project instructions can skip them with \u003ccode>omitClaudeMd: true\u003c/code>.\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"practice\">\n    \u003ch2>Practice\u003c/h2>\n    \u003cp>Five exercises: budgeting the window, reading AGENTS.md like an agent does, writing a skill, deciding where\n      rules belong, and finding what a truncating tool would miss.\u003c/p>\n\n    \u003cdiv class=\"exercise\" data-id=\"m03-e1\" data-title=\"Startup budget\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Write \u003ccode>startup_report(parts, calls)\u003c/code>. \u003ccode>parts\u003c/code> maps a name (like\n          \u003ccode>\"CLAUDE.md\"\u003c/code>) to its text. Return a dict with \u003ccode>\"tokens\"\u003c/code> (total estimated tokens\n          using \u003ccode>fleetlab.estimate_tokens\u003c/code>), \u003ccode>\"per_run\"\u003c/code> (tokens times \u003ccode>calls\u003c/code>), and\n          \u003ccode>\"largest\"\u003c/code> (the name with the most tokens).\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\nimport fleetlab\n\ndef startup_report(parts, calls):\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\nPARTS = {\"CLAUDE.md\": \"x\" * 4000, \"skills\": \"y\" * 400, \"mcp tools\": \"z\" * 12000}\n\ndef test_totals():\n    r = startup_report(PARTS, 10)\n    assert r[\"tokens\"] == 1000 + 100 + 3000, \"estimate each part and add them up\"\n    assert r[\"per_run\"] == 41000, \"multiply by the number of calls\"\n\ndef test_largest():\n    assert startup_report(PARTS, 1)[\"largest\"] == \"mcp tools\"\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>Build a dict of tokens per part first, then\n        \u003ccode>max(tokens, key=tokens.get)\u003c/code>.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">import fleetlab\n\ndef startup_report(parts, calls):\n    tokens = {name: fleetlab.estimate_tokens(text) for name, text in parts.items()}\n    total = sum(tokens.values())\n    return {\"tokens\": total, \"per_run\": total * calls, \"largest\": max(tokens, key=tokens.get)}\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"exercise\" data-id=\"m03-e2\" data-title=\"Find the commands\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Write \u003ccode>commands(md)\u003c/code> that returns every command in backticks on a bullet line inside the\n          \u003ccode>## Commands\u003c/code> section of an AGENTS.md, in order. The section ends at the next line starting with\n          \u003ccode>## \u003c/code>. Only text in single backticks counts.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\nimport re\n\ndef commands(md):\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\nMD = \"\"\"# AGENTS.md\n\nIntro mentioning `not this`.\n\n## Commands\n- Setup: `pixi install`\n- Tests: `pixi run test` (or `pixi run test-fast`)\nPlain line with `ignored`.\n\n## Map\n- `src/`: code\n\"\"\"\n\ndef test_extracts_in_order():\n    assert commands(MD) == [\"pixi install\", \"pixi run test\", \"pixi run test-fast\"]\n\ndef test_no_section():\n    assert commands(\"# Nothing here\\n- `x`\\n\") == []\n\ndef test_section_at_end():\n    assert commands(\"## Commands\\n- `make check`\\n\") == [\"make check\"]\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>Walk the lines with an \u003ccode>inside\u003c/code> flag. Turn it on at\n        \u003ccode>## Commands\u003c/code> and off at any other line starting with \u003ccode>## \u003c/code>. On bullet lines (starting\n        with \u003ccode>- \u003c/code>) collect \u003ccode>re.findall(r\"`([^`]+)`\", line)\u003c/code>.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">import re\n\ndef commands(md):\n    found, inside = [], False\n    for line in md.splitlines():\n        if line.startswith(\"## \"):\n            inside = line.strip() == \"## Commands\"\n            continue\n        if inside and line.lstrip().startswith(\"- \"):\n            found.extend(re.findall(r\"`([^`]+)`\", line))\n    return found\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"exercise\" data-id=\"m03-e3\" data-title=\"Write a skill\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Set \u003ccode>skill\u003c/code> to a \u003ccode>SKILL.md\u003c/code> for a skill in the folder \u003ccode>bump-version\u003c/code> that\n          passes \u003ccode>fleetlab.check_skill(skill, \"bump-version\")\u003c/code> with no problems. Its description must say\n          when to use it (include \u003ccode>Use\u003c/code>), and its body must link to a file named\n          \u003ccode>checklist.md\u003c/code> in the same folder, for progressive disclosure.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\nskill = \"\"\"---\nname: bump-version\n---\n\"\"\"\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\nimport fleetlab\n\ndef test_valid():\n    problems = fleetlab.check_skill(skill, \"bump-version\")\n    assert problems == [], \"; \".join(problems)\n\ndef test_trigger():\n    doc = fleetlab.parse(skill)\n    assert \"Use\" in str(doc.meta[\"description\"]), \"say when to use the skill\"\n\ndef test_links_reference():\n    assert \"checklist.md\" in fleetlab.parse(skill).body, \"link to checklist.md so detail loads only when needed\"\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>You need a \u003ccode>description\u003c/code> and a non-empty body. A\n        Markdown link like \u003ccode>[the checklist](checklist.md)\u003c/code> works.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">skill = \"\"\"---\nname: bump-version\ndescription: Bump the package version and update the changelog. Use when preparing a release.\n---\n\n1. Decide the next version with semantic versioning.\n2. Update the version and CHANGELOG.md.\n3. Follow [the checklist](checklist.md) before committing.\n\"\"\"\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"exercise\" data-id=\"m03-e4\" data-title=\"Where does each rule belong?\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Set \u003ccode>placement\u003c/code> to a dict mapping each rule in \u003ccode>RULES\u003c/code> to\n          \u003ccode>\"agents_md\"\u003c/code>, \u003ccode>\"skill\"\u003c/code>, or \u003ccode>\"hook\"\u003c/code>, using the table in \"AGENTS.md, skill,\n          or hook?\". The tests explain any answer they disagree with.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\nRULES = [\n    \"Tests mirror the package layout under tests/\",\n    \"The steps to add a new CLI subcommand\",\n    \"Tests must pass before an agent finishes\",\n    \"Never edit files under .github/workflows/\",\n    \"How to cut and publish a release\",\n    \"Run the fast checks with `python -m pytest -q`\",\n]\n\nplacement = {\n    # rule: \"agents_md\" | \"skill\" | \"hook\"\n}\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\nEXPECTED = {\n    \"Tests mirror the package layout under tests/\": (\"agents_md\", \"a layout fact every agent needs belongs in the map\"),\n    \"The steps to add a new CLI subcommand\": (\"skill\", \"a procedure needed only sometimes is a skill\"),\n    \"Tests must pass before an agent finishes\": (\"hook\", \"a must-always rule needs enforcement: a Stop hook\"),\n    \"Never edit files under .github/workflows/\": (\"hook\", \"a must-never rule needs enforcement: a PreToolUse hook\"),\n    \"How to cut and publish a release\": (\"skill\", \"a multi-step procedure is a skill\"),\n    \"Run the fast checks with `python -m pytest -q`\": (\"agents_md\", \"a command every agent uses belongs in Commands\"),\n}\n\ndef test_every_rule_placed():\n    missing = [r for r in RULES if r not in placement]\n    assert not missing, f\"place every rule; missing: {missing}\"\n\ndef test_placements():\n    for rule, (where, why) in EXPECTED.items():\n        assert placement.get(rule) == where, f\"{rule!r} -> {where}: {why}\"\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>Ask of each rule: is it a fact, a procedure, or a guarantee?\n        Facts go in AGENTS.md, procedures in skills, guarantees in hooks.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">RULES = [\n    \"Tests mirror the package layout under tests/\",\n    \"The steps to add a new CLI subcommand\",\n    \"Tests must pass before an agent finishes\",\n    \"Never edit files under .github/workflows/\",\n    \"How to cut and publish a release\",\n    \"Run the fast checks with `python -m pytest -q`\",\n]\n\nplacement = {\n    RULES[0]: \"agents_md\",\n    RULES[1]: \"skill\",\n    RULES[2]: \"hook\",\n    RULES[3]: \"hook\",\n    RULES[4]: \"skill\",\n    RULES[5]: \"agents_md\",\n}\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"exercise\" data-id=\"m03-e5\" data-title=\"What would a truncating tool miss?\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Some tools only read the first \u003ccode>limit\u003c/code> bytes of AGENTS.md. Write\n          \u003ccode>hidden_headings(md, limit=16384)\u003c/code> that returns the headings (lines starting with\n          \u003ccode>#\u003c/code>) that start at or beyond byte \u003ccode>limit\u003c/code> of the UTF-8 encoded text, in order.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\ndef hidden_headings(md, limit=16384):\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\ndef test_nothing_hidden():\n    assert hidden_headings(\"# A\\n## B\\n\", limit=100) == []\n\ndef test_hidden_after_limit():\n    md = \"# Top\\n\" + \"x\" * 50 + \"\\n## Rules\\n- r\\n\"\n    assert hidden_headings(md, limit=20) == [\"## Rules\"]\n\ndef test_counts_bytes_not_characters():\n    md = \"# Top\\n\" + \"é\" * 10 + \"\\n## Late\\n\"\n    assert hidden_headings(md, limit=20) == [\"## Late\"], \"é is two bytes in UTF-8\"\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>Keep a running byte offset: for each line (from\n        \u003ccode>splitlines(keepends=True)\u003c/code>), check the offset before adding\n        \u003ccode>len(line.encode(\"utf-8\"))\u003c/code>.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">def hidden_headings(md, limit=16384):\n    hidden, offset = [], 0\n    for line in md.splitlines(keepends=True):\n        if offset >= limit and line.startswith(\"#\"):\n            hidden.append(line.rstrip(\"\\n\"))\n        offset += len(line.encode(\"utf-8\"))\n    return hidden\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"mini-project\">\n    \u003ch2>Lab: shelf's instructions and first skill\u003c/h2>\n    \u003cdiv class=\"project-box\">\n      \u003cdiv class=\"widget-head\">\u003cspan class=\"w-kind\">Lab m03-lab1\u003c/span>\u003cspan class=\"w-title\">AGENTS.md, CLAUDE.md, and an add-command skill\u003c/span>\u003c/div>\n      \u003cdiv class=\"widget-body\">\n        \u003cp>Write the instructions every agent in your fleet will read when working on shelf, and the first\n          procedure they can load on demand. The checks run every command you list (so each must actually work), check\n          the map against the real layout, check that CLAUDE.md imports AGENTS.md, and validate your skill and the\n          reference file it links to.\u003c/p>\n        \u003cpre data-label=\"Terminal\">\u003ccode class=\"language-bash\">pixi run start m03-lab1\n# read labs/m03-lab1/README.md, then write AGENTS.md, CLAUDE.md, and .claude/skills/add-command/\npixi run grade m03-lab1\u003c/code>\u003c/pre>\n        \u003cul class=\"checklist\" data-id=\"m03-lab1\">\n          \u003cli>AGENTS.md has Commands, Map, and Rules sections and fits the size limits\u003c/li>\n          \u003cli>Every listed command runs successfully in a fresh copy of the workspace\u003c/li>\n          \u003cli>CLAUDE.md starts with \u003ccode>@AGENTS.md\u003c/code>\u003c/li>\n          \u003cli>The add-command skill is valid, says when to use it, and links to a reference file that exists\u003c/li>\n          \u003cli>Asked an agent to add a \u003ccode>count\u003c/code> subcommand using the skill, and read the transcript\u003c/li>\n        \u003c/ul>\n        \u003cp>\u003cstrong>Stretch:\u003c/strong> run the same \"add a count subcommand\" task with and without the skill, and compare\n          the number of turns and whether tests were added.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"quiz\">\n    \u003ch2>Quiz\u003c/h2>\n    \u003cdiv class=\"quiz\" data-id=\"m03-quiz\">\n\u003cscript type=\"application/json\">\n{\"title\": \"Context Engineering quiz\", \"passScore\": 0.7, \"questions\": [\n  {\"type\": \"multi\", \"prompt\": \"Which of these are in an agent's context before it reads any code?\", \"options\": [\"CLAUDE.md and its imports\", \"Descriptions of available skills\", \"Descriptions of available subagents\", \"Tool definitions from connected MCP servers\", \"The full bodies of every skill\"], \"answer\": [0, 1, 2, 3], \"explanation\": \"\u003cp>Skill bodies load only when a skill is used. That's progressive disclosure.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"Why does a long CLAUDE.md cost more than its token count suggests?\", \"options\": [\"It's charged at a higher rate\", \"It's sent with every request in the run, and dilutes the model's attention\", \"It's re-read from disk each turn\", \"It disables caching\"], \"answer\": 1, \"explanation\": \"\u003cp>Startup context rides along on every request, and irrelevant text makes instructions easier to miss.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"You want Claude Code, Copilot, and Devin to share one set of instructions. What's the pattern?\", \"options\": [\"Copy the text into each tool's file\", \"Write AGENTS.md; make CLAUDE.md import it with @AGENTS.md\", \"Put everything in CLAUDE.md\", \"Put everything in a skill\"], \"answer\": 1, \"explanation\": \"\u003cp>Other tools read AGENTS.md directly; Claude Code reads it through the import. One source of truth.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"Why must every command in AGENTS.md be verified in a clean checkout?\", \"options\": [\"For style\", \"Agents run them verbatim; a broken command makes every agent fail and waste turns\", \"Linters require it\", \"It shortens the file\"], \"answer\": 1, \"explanation\": \"\u003cp>A wrong command is worse than none. The lab's checks run each one for that reason.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"Where does \\\"tests must pass before an agent finishes\\\" belong?\", \"options\": [\"AGENTS.md only\", \"A skill\", \"A hook (with CI as backup)\", \"The issue template\"], \"answer\": 2, \"explanation\": \"\u003cp>It's a guarantee, so it needs enforcement. Prose can be ignored; a Stop hook can't.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"What are the three levels of progressive disclosure in a skill?\", \"options\": [\"Title, body, footer\", \"Metadata always; body when used; linked files when read\", \"Draft, review, publish\", \"User, project, managed\"], \"answer\": 1, \"explanation\": \"\u003cp>Only the name and description cost context up front.\u003c/p>\"},\n  {\"type\": \"multi\", \"prompt\": \"Which skill names are valid?\", \"options\": [\"add-command\", \"Add_Command\", \"release-notes-2\", \"release--notes\"], \"answer\": [0, 2], \"explanation\": \"\u003cp>Lowercase letters, digits, and single hyphens, matching the folder name.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"Why can't a tool that reads only the first 16 KiB of AGENTS.md see your Rules section?\", \"options\": [\"Rules are ignored by design\", \"It comes after the 16 KiB cut-off\", \"Rules must be in CLAUDE.md\", \"Rules need a special tag\"], \"answer\": 1, \"explanation\": \"\u003cp>Put the most important content first and keep the file short.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"How should the builder learn what to build?\", \"options\": [\"Read the whole issue thread and the planner's chat\", \"Read the spec file the planner wrote\", \"Guess from the branch name\", \"Ask the reviewer\"], \"answer\": 1, \"explanation\": \"\u003cp>Hand off files, not conversations: shorter, reviewable, and they survive restarts.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"A constraint given once early in a very long session stops being followed. What's the likely cause?\", \"options\": [\"The model ignored it on purpose\", \"Compaction summarised the early turns and the detail faded\", \"The hook expired\", \"The skill unloaded\"], \"answer\": 1, \"explanation\": \"\u003cp>Put constraints that must survive in files the agent re-reads, such as AGENTS.md or the spec.\u003c/p>\"},\n  {\"type\": \"text\", \"prompt\": \"Which subagent frontmatter field skips CLAUDE.md files at startup?\", \"answer\": [\"omitClaudeMd\"], \"explanation\": \"\u003cp>\u003ccode>omitClaudeMd: true\u003c/code> keeps project instructions out of agents that don't need them.\u003c/p>\"}\n]}\n\u003c/script>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"recap\">\n    \u003ch2>Recap\u003c/h2>\n    \u003cul>\n      \u003cli>Startup context (CLAUDE.md, skill and agent descriptions, MCP tool definitions) is paid for on every request\n        and competes for attention.\u003c/li>\n      \u003cli>CLAUDE.md loads from your home, the project root, and subdirectories; \u003ccode>@file\u003c/code> imports. Keep shared\n        instructions in AGENTS.md and import it.\u003c/li>\n      \u003cli>AGENTS.md: commands that run, a map, a few rules. Delete lines that don't change behaviour.\u003c/li>\n      \u003cli>Skills: \u003ccode>.claude/skills/&lt;name&gt;/SKILL.md\u003c/code>; metadata always, body when used, linked files when\n        read.\u003c/li>\n      \u003cli>Facts in AGENTS.md, procedures in skills, guarantees in hooks.\u003c/li>\n      \u003cli>Delegate exploration, hand off files, size tasks to the window, and put lasting constraints in files.\u003c/li>\n    \u003c/ul>\n    \u003cdiv class=\"flashcards\" data-title=\"Context engineering\">\n      \u003cscript type=\"application/json\">\n      [{\"front\": \"What's loaded before the agent reads code?\", \"back\": \"System prompt and tools, CLAUDE.md and imports, skill and subagent descriptions, MCP tool definitions, the task.\"},\n       {\"front\": \"Rough token estimate\", \"back\": \"About 4 characters per token for English and code.\"},\n       {\"front\": \"One instruction file for many tools\", \"back\": \"AGENTS.md, with CLAUDE.md containing \u003ccode>@AGENTS.md\u003c/code>.\"},\n       {\"front\": \"Three sections of a good AGENTS.md\", \"back\": \"Commands (that run), Map, Rules.\"},\n       {\"front\": \"Progressive disclosure\", \"back\": \"Metadata always; SKILL.md body when used; linked files when read.\"},\n       {\"front\": \"Where project skills live\", \"back\": \"\u003ccode>.claude/skills/&lt;name&gt;/SKILL.md\u003c/code>; name matches the folder.\"},\n       {\"front\": \"Fact, procedure, guarantee\", \"back\": \"AGENTS.md, skill, hook.\"},\n       {\"front\": \"Hand off…\", \"back\": \"Files, not conversations.\"},\n       {\"front\": \"Compaction\", \"back\": \"Summarising earlier turns near the limit; details fade, so lasting constraints go in files.\"},\n       {\"front\": \"Devin and AGENTS.md\", \"back\": \"Reads only the first 16 KiB. Most important content first.\"}]\n      \u003c/script>\n    \u003c/div>\n    \u003ch3>Going further\u003c/h3>\n    \u003cul>\n      \u003cli>\u003ca href=\"https://code.claude.com/docs/en/memory\">Claude Code: Memory and CLAUDE.md\u003c/a> and \u003ca href=\"https://code.claude.com/docs/en/skills\">Skills\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"https://agents.md\">AGENTS.md\u003c/a> and \u003ca href=\"https://agentskills.io\">Agent Skills\u003c/a> specifications\u003c/li>\n      \u003cli>\u003ca href=\"https://www.anthropic.com/engineering/equipping-agents-for-the-real-world-with-agent-skills\">Equipping agents for the real world with Agent Skills\u003c/a> (Anthropic Engineering)\u003c/li>\n      \u003cli>Next: \u003ca href=\"m04-hooks-and-gates.html\">M04 Hooks and Gates\u003c/a>, where rules become guarantees\u003c/li>\n    \u003c/ul>\n  \u003c/section>","exercises":["m03-e1","m03-e2","m03-e3","m03-e4","m03-e5"],"quizzes":["m03-quiz"],"checklists":{"m03-lab1":5}},"modules/m04-hooks-and-gates.html":{"id":"m04","kind":"module","title":"M04 · Hooks and Gates · Coding Agent Fleets Practicum","html":"\u003cheader class=\"lesson-hero\">\n    \u003cp class=\"eyebrow\">Stage 1 · One Agent · Module 04\u003c/p>\n    \u003ch1>Hooks and Gates\u003c/h1>\n    \u003cp class=\"lede\">Instructions are requests. A hook is code that Claude Code runs at a fixed point in the loop,\n      and it can stop the agent. That makes hooks the place where \"never push to main\" and \"don't finish while the\n      tests are red\" become guarantees instead of hopes. This module covers how hooks are configured, what they\n      receive, how they answer, and how to write and test the two gates every fleet needs: a guard on risky commands\n      and a gate on finishing.\u003c/p>\n    \u003cdiv class=\"lesson-meta\">\u003cspan>⏱ ~2.5 hours\u003c/span>\u003cspan>Prerequisites: \u003ca href=\"m03-context-engineering.html\">M03 Context Engineering\u003c/a>\u003c/span>\u003c/div>\n    \u003cul class=\"objectives\">\n      \u003cli>Explain why enforcement belongs in hooks, and name the hook events a fleet uses most\u003c/li>\n      \u003cli>Configure hooks in settings with matchers, and predict which hooks run for a tool call\u003c/li>\n      \u003cli>Read a hook's JSON payload and answer with the right exit code or JSON decision\u003c/li>\n      \u003cli>Explain why \u003ccode>exit 1\u003c/code> does not block, and what \u003ccode>stop_hook_active\u003c/code> prevents\u003c/li>\n      \u003cli>Write and test a PreToolUse guard that blocks risky commands without blocking normal work\u003c/li>\n      \u003cli>Write and test a Stop gate that keeps an agent working until checks pass\u003c/li>\n    \u003c/ul>\n  \u003c/header>\n\n  \u003csection class=\"lesson-section\" id=\"why\">\n    \u003ch2>From requests to guarantees\u003c/h2>\n    \u003cp>Everything you've written so far is a \u003cem>guide\u003c/em>: it steers the model, and the model usually follows. Usually\n      isn't good enough for some rules. An agent working through a long task, reading an issue that contains\n      instructions (shelf issue #5), or simply confused, will eventually do the thing you told it not to.\u003c/p>\n    \u003cp>A \u003cstrong>hook\u003c/strong> is a command Claude Code runs at a specific point in the agent loop: before a tool\n      runs, after it runs, when the agent tries to stop, and more. Hooks are deterministic code, they run every time\n      their event fires, and some of them can block. That makes them the \u003cem>sensors\u003c/em> of your harness, and the\n      strongest one you have short of CI.\u003c/p>\n    \u003cdiv class=\"two-col\">\n      \u003cdiv>\n        \u003ch4>In AGENTS.md (a request)\u003c/h4>\n        \u003cpre>\u003ccode class=\"language-markdown\">- Never push to main.\n- Run the tests before finishing.\u003c/code>\u003c/pre>\n      \u003c/div>\n      \u003cdiv>\n        \u003ch4>As hooks (a guarantee)\u003c/h4>\n        \u003cul>\n          \u003cli>A \u003ccode>PreToolUse\u003c/code> hook on \u003ccode>Bash\u003c/code> that blocks \u003ccode>git push … main\u003c/code>\u003c/li>\n          \u003cli>A \u003ccode>Stop\u003c/code> hook that runs the tests and refuses to let the agent finish while they fail\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n    \u003c/div>\n    \u003caside class=\"callout tip\">\u003cp>\u003cstrong>Remember:\u003c/strong> keep the prose (it helps the agent plan), but enforce\n      anything that matters with a hook, and back the most important rules with CI and branch protection too.\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"events\">\n    \u003ch2>Hook events\u003c/h2>\n    \u003cp>Claude Code has many hook events. These are the ones a fleet relies on:\u003c/p>\n    \u003cdiv class=\"scroll\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>Event\u003c/th>\u003cth>Fires\u003c/th>\u003cth>Can block?\u003c/th>\u003cth>Fleet use\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>\u003ccode>PreToolUse\u003c/code>\u003c/td>\u003ctd>Before a tool runs\u003c/td>\u003ctd>Yes: stops the call\u003c/td>\u003ctd>Guard risky commands, protect paths\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>PostToolUse\u003c/code>\u003c/td>\u003ctd>After a tool succeeds\u003c/td>\u003ctd>No (it already ran), but can feed back\u003c/td>\u003ctd>Run a formatter, report lint errors to the agent\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>PostToolUseFailure\u003c/code>\u003c/td>\u003ctd>After a tool fails\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Log failures, add recovery hints\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>UserPromptSubmit\u003c/code>\u003c/td>\u003ctd>When a prompt is submitted\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Add context, refuse unsafe prompts\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>Stop\u003c/code>\u003c/td>\u003ctd>When the main agent tries to finish\u003c/td>\u003ctd>Yes: keeps it working\u003c/td>\u003ctd>The \"checks must pass\" gate\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>SubagentStop\u003c/code>\u003c/td>\u003ctd>When a subagent tries to finish\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Per-role gates\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>SessionStart\u003c/code>, \u003ccode>SessionEnd\u003c/code>\u003c/td>\u003ctd>Session begins or ends\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Load context, write logs\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>PreCompact\u003c/code>\u003c/td>\u003ctd>Before compaction\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Save state before detail is summarised\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>TaskCompleted\u003c/code>, \u003ccode>TeammateIdle\u003c/code>\u003c/td>\u003ctd>Agent teams: a task is marked done, a teammate goes idle\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Quality gates for teams (Stage 2)\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n    \u003cp>This module builds one \u003ccode>PreToolUse\u003c/code> gate and one \u003ccode>Stop\u003c/code> gate. The same skills carry over\n      to every other event.\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"config\">\n    \u003ch2>Configuring hooks\u003c/h2>\n    \u003cp>Hooks live in settings files under \u003ccode>\"hooks\"\u003c/code>, in three levels: the event, a \u003cstrong>matcher\n      group\u003c/strong> that filters when it fires, and the hook handlers to run.\u003c/p>\n    \u003cpre>\u003ccode class=\"language-json\">{\n  \"hooks\": {\n    \"PreToolUse\": [\n      {\n        \"matcher\": \"Bash\",\n        \"hooks\": [\n          { \"type\": \"command\", \"command\": \"python3 \\\"$CLAUDE_PROJECT_DIR/.claude/hooks/guard_bash.py\\\"\", \"timeout\": 30 }\n        ]\n      },\n      {\n        \"matcher\": \"Edit|Write\",\n        \"hooks\": [\n          { \"type\": \"command\", \"command\": \"python3 \\\"$CLAUDE_PROJECT_DIR/.claude/hooks/protect_paths.py\\\"\" }\n        ]\n      }\n    ],\n    \"Stop\": [\n      { \"hooks\": [ { \"type\": \"command\", \"command\": \"python3 \\\"$CLAUDE_PROJECT_DIR/.claude/hooks/require_green.py\\\"\" } ] }\n    ]\n  }\n}\u003c/code>\u003c/pre>\n    \u003ch3>Matchers\u003c/h3>\n    \u003cul>\n      \u003cli>Empty, \u003ccode>*\u003c/code>, or missing: every tool.\u003c/li>\n      \u003cli>Only letters, digits, \u003ccode>_\u003c/code>, \u003ccode>-\u003c/code>, spaces, commas and \u003ccode>|\u003c/code>: exact tool names,\n        or a list such as \u003ccode>Edit|Write\u003c/code>.\u003c/li>\n      \u003cli>Anything else: an unanchored regular expression, such as \u003ccode>^Notebook\u003c/code> or\n        \u003ccode>mcp__github__.*\u003c/code>. A bare \u003ccode>mcp__github\u003c/code> matches nothing.\u003c/li>\n    \u003c/ul>\n    \u003ch3>Commands and where hooks live\u003c/h3>\n    \u003cp>\u003ccode>$CLAUDE_PROJECT_DIR\u003c/code> is the project root where the session started, so hook paths work whatever\n      directory the agent is in. The default timeout for a command hook is 600 seconds. Hooks can be configured in user,\n      project, local, and managed settings, in plugins, in a skill's frontmatter, and in a subagent's frontmatter\n      (where \u003ccode>Stop\u003c/code> becomes \u003ccode>SubagentStop\u003c/code>, so a gate applies only to that role). Hooks from\n      every level are combined. Run \u003ccode>/hooks\u003c/code> in a session to see what's active.\u003c/p>\n    \u003cdiv class=\"runnable\" data-title=\"Which hooks run for a tool call?\">\n\u003ctextarea>\nimport fleetlab\n\nsettings = {\"hooks\": {\n    \"PreToolUse\": [\n        {\"matcher\": \"Bash\", \"hooks\": [{\"type\": \"command\", \"command\": \"guard_bash.py\"}]},\n        {\"matcher\": \"Edit|Write\", \"hooks\": [{\"type\": \"command\", \"command\": \"protect_paths.py\"}]},\n        {\"matcher\": \"mcp__github__.*\", \"hooks\": [{\"type\": \"command\", \"command\": \"audit_github.py\"}]},\n    ]\n}}\nfor tool in [\"Bash\", \"Write\", \"Read\", \"mcp__github__create_issue\", \"BashOutput\"]:\n    print(f\"{tool:28} -> {fleetlab.hook_commands(settings, 'PreToolUse', tool)}\")\n\u003c/textarea>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"payload\">\n    \u003ch2>What a hook receives\u003c/h2>\n    \u003cp>Claude Code starts your command and writes one JSON object to its standard input. Every event includes\n      \u003ccode>session_id\u003c/code>, \u003ccode>transcript_path\u003c/code>, \u003ccode>cwd\u003c/code>, \u003ccode>permission_mode\u003c/code>, and\n      \u003ccode>hook_event_name\u003c/code>. Then each event adds its own fields:\u003c/p>\n    \u003cul>\n      \u003cli>\u003ccode>PreToolUse\u003c/code> adds \u003ccode>tool_name\u003c/code>, \u003ccode>tool_input\u003c/code> (the tool's arguments: a\n        \u003ccode>command\u003c/code> for Bash, a \u003ccode>file_path\u003c/code> for Edit and Write), and \u003ccode>tool_use_id\u003c/code>.\u003c/li>\n      \u003cli>\u003ccode>Stop\u003c/code> adds \u003ccode>stop_hook_active\u003c/code> (true when the agent is already continuing because a Stop\n        hook blocked it) and the agent's \u003ccode>last_assistant_message\u003c/code>.\u003c/li>\n    \u003c/ul>\n    \u003cdiv class=\"runnable\" data-title=\"Look at real payload shapes\">\n\u003ctextarea>\nimport json, fleetlab\n\nprint(json.dumps(fleetlab.pre_tool_use(\"Bash\", {\"command\": \"git push origin main\"}), indent=2))\nprint(json.dumps(fleetlab.stop(active=False), indent=2))\n\u003c/textarea>\n    \u003c/div>\n    \u003cp>Subagent hooks also receive \u003ccode>agent_id\u003c/code> and \u003ccode>agent_type\u003c/code>, so one hook can treat roles\n      differently.\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"exit-codes\">\n    \u003ch2>Answering: exit codes\u003c/h2>\n    \u003cp>The simplest way for a hook to answer is its exit code:\u003c/p>\n    \u003cdiv class=\"scroll\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>Exit code\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>What Claude sees\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>\u003ccode>0\u003c/code>\u003c/td>\u003ctd>Success; the action goes ahead\u003c/td>\u003ctd>Nothing, unless stdout is one JSON object with a decision\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>2\u003c/code>\u003c/td>\u003ctd>Blocking error: on events that can block, the action is stopped\u003c/td>\u003ctd>Your \u003cstrong>stderr\u003c/strong>, as the reason\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>anything else\u003c/td>\u003ctd>Non-blocking error: the action \u003cstrong>goes ahead\u003c/strong>\u003c/td>\u003ctd>A note that the hook failed\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n    \u003caside class=\"callout danger\" data-title=\"exit 1 does not block\">\u003cp>This is the most common hook bug. Python's\n      \u003ccode>sys.exit(1)\u003c/code>, an uncaught exception, or a shell script that fails all exit with codes other than 2,\n      and Claude Code treats those as \"the hook broke, carry on\". A guard that crashes lets the dangerous command\n      through. Use \u003ccode>sys.exit(2)\u003c/code> to block, and test the block path.\u003c/p>\u003c/aside>\n    \u003cp>On exit 2, stderr is the message the agent reads, so write it for the agent: say what was blocked, why, and\n      what to do instead. \"Blocked: force pushes are not allowed. Push to a new branch and open a pull request.\"\n      gives the agent a way forward. \"Error\" gives it nothing.\u003c/p>\n    \u003cdiv class=\"runnable\" data-title=\"A guard, run against two payloads\">\n\u003ctextarea>\nimport json, sys, fleetlab\n\ndef main():\n    payload = json.load(sys.stdin)\n    command = payload.get(\"tool_input\", {}).get(\"command\", \"\")\n    if \"--force\" in command and \"--force-with-lease\" not in command:\n        print(\"Blocked: force pushes rewrite shared history. Push to a new branch instead.\", file=sys.stderr)\n        sys.exit(2)\n    sys.exit(0)\n\nfor cmd in [\"git push --force origin feat/x\", \"git push origin feat/x\"]:\n    result = fleetlab.run_hook(main, fleetlab.pre_tool_use(\"Bash\", {\"command\": cmd}))\n    print(f\"{cmd:34} exit={result.exit_code} blocked={result.blocked} reason={result.reason!r}\")\n\u003c/textarea>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"json-decisions\">\n    \u003ch2>Answering: JSON decisions\u003c/h2>\n    \u003cp>For more control, exit 0 and print exactly one JSON object to stdout (nothing else around it). For\n      \u003ccode>PreToolUse\u003c/code>, the decision goes under \u003ccode>hookSpecificOutput\u003c/code>:\u003c/p>\n    \u003cpre>\u003ccode class=\"language-json\">{\n  \"hookSpecificOutput\": {\n    \"hookEventName\": \"PreToolUse\",\n    \"permissionDecision\": \"deny\",\n    \"permissionDecisionReason\": \"Pushing to main is not allowed. Open a pull request.\"\n  }\n}\u003c/code>\u003c/pre>\n    \u003cp>\u003ccode>permissionDecision\u003c/code> can be \u003ccode>allow\u003c/code> (skip the permission prompt), \u003ccode>deny\u003c/code>,\n      \u003ccode>ask\u003c/code> (show the user a prompt), or \u003ccode>defer\u003c/code>. A PreToolUse hook can also return\n      \u003ccode>updatedInput\u003c/code> to change the tool's arguments before it runs, and \u003ccode>additionalContext\u003c/code> to\n      tell Claude something.\u003c/p>\n    \u003cp>For \u003ccode>Stop\u003c/code>, the shape is simpler:\u003c/p>\n    \u003cpre>\u003ccode class=\"language-json\">{ \"decision\": \"block\", \"reason\": \"3 tests are failing: fix them before finishing.\" }\u003c/code>\u003c/pre>\n    \u003cp>Which to use? Exit 2 with a stderr message is the simplest and works on every blocking event. Use JSON when\n      you need \u003ccode>ask\u003c/code>, \u003ccode>allow\u003c/code>, or \u003ccode>updatedInput\u003c/code>. Remember that exit 2 blocks even if\n      your JSON said allow, and that stdout is only read as a decision when it's a single JSON object.\u003c/p>\n    \u003caside class=\"callout note\">\u003cp>Other tools speak different hook dialects. GitHub Copilot's hooks, for example,\n      receive \u003ccode>toolName\u003c/code> and \u003ccode>toolArgs\u003c/code> and answer with \u003ccode>permissionDecision\u003c/code> JSON.\n      If your fleet must run under several tools, keep the decision logic in one function and add a thin adapter per\n      tool's format.\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"guard\">\n    \u003ch2>Gate 1: a guard on risky commands\u003c/h2>\n    \u003cp>A \u003ccode>PreToolUse\u003c/code> guard on \u003ccode>Bash\u003c/code> blocks commands that should never run without a human:\n      rewriting shared history, pushing to the default branch, skipping git hooks, deleting outside the workspace,\n      running scripts straight from the internet. Writing a good one is about balancing two kinds of error:\u003c/p>\n    \u003cul>\n      \u003cli>\u003cstrong>False negatives\u003c/strong> (a dangerous command gets through) are what you're preventing. Check the\n        whole command string, not just its start: \u003ccode>cd repo &amp;&amp; git push --force\u003c/code> must be caught.\u003c/li>\n      \u003cli>\u003cstrong>False positives\u003c/strong> (normal work is blocked) are what makes people turn guards off. Pushing a\n        feature branch, \u003ccode>--force-with-lease\u003c/code> on your own branch, and \u003ccode>rm -rf build/\u003c/code> must pass.\u003c/li>\n    \u003c/ul>\n    \u003cp>Keep the rules as a list of (pattern, explanation) pairs, so the message for each block says exactly why. And\n      test the guard like any other code, with a table of commands that must be blocked and commands that must be\n      allowed. That table \u003cem>is\u003c/em> the guard's specification.\u003c/p>\n    \u003caside class=\"callout warn\">\u003cp>A text-matching guard is a strong safety net, not a sandbox: an agent determined to\n      work around it can write a Python script that does the same thing. Back the most important rules with\n      something outside the agent's reach: branch protection on the server, credentials that can't push to\n      \u003ccode>main\u003c/code>, a container without production access.\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"stop-gate\">\n    \u003ch2>Gate 2: don't finish while checks fail\u003c/h2>\n    \u003cp>The \u003ccode>Stop\u003c/code> gate fixes the \"premature done\" failure from M01. When the agent tries to finish, the\n      hook runs the project's fast checks. If they pass, it exits 0 and the agent stops. If they fail, it exits 2 with\n      the end of the failure output on stderr, and Claude reads that as its next piece of work.\u003c/p>\n    \u003cpre class=\"mermaid\">\nflowchart TD\n  S[Agent tries to stop] --> A{stop_hook_active?}\n  A -->|yes| OK[exit 0: let it stop]\n  A -->|no| R[Run fast checks]\n  R -->|pass| OK\n  R -->|fail| B[exit 2 + tail of output on stderr]\n  B --> W[Agent keeps working]\n  W --> S\n    \u003c/pre>\n    \u003cp>Three details make the difference between a gate and a trap:\u003c/p>\n    \u003cul>\n      \u003cli>\u003cstrong>\u003ccode>stop_hook_active\u003c/code>.\u003c/strong> When it's true, the agent is already continuing because of\n        a Stop hook. If you block again, and the checks can't be fixed, the agent never stops. Let it go on the second\n        attempt and let the orchestrator (Stage 2) treat the run as failed. That's the loop's exit.\u003c/li>\n      \u003cli>\u003cstrong>The tail, not the whole log.\u003c/strong> Send the last 40 lines or so: that's where the failure summary\n        is. A 2,000-line log fills the agent's context with noise.\u003c/li>\n      \u003cli>\u003cstrong>A timeout.\u003c/strong> A hanging test suite would hang the agent. Run the checks with a timeout and\n        block with a clear message if it's exceeded.\u003c/li>\n    \u003c/ul>\n    \u003cp>The checks themselves should be \u003cem>fast\u003c/em>: this hook runs every time the agent tries to finish. A two-minute\n      suite of unit tests is ideal; the full suite belongs in CI.\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"testing\">\n    \u003ch2>Testing hooks, and keeping them safe\u003c/h2>\n    \u003cp>Hooks are code that runs with your permissions on every matching event, so treat them like production code:\u003c/p>\n    \u003cul>\n      \u003cli>\u003cstrong>Test with recorded payloads.\u003c/strong> Build payloads with \u003ccode>fleetlab.pre_tool_use\u003c/code> and\n        \u003ccode>fleetlab.stop\u003c/code>, or save real ones from a session, and assert on exit codes and messages. Test the\n        allow path as well as the block path.\u003c/li>\n      \u003cli>\u003cstrong>Keep them fast.\u003c/strong> A PreToolUse hook runs before \u003cem>every\u003c/em> matching tool call.\u003c/li>\n      \u003cli>\u003cstrong>Protect the hooks themselves.\u003c/strong> An agent that can edit \u003ccode>.claude/settings.json\u003c/code> or\n        your hook scripts can switch its own gates off. Add them to your protected paths.\u003c/li>\n      \u003cli>\u003cstrong>Know when repository hooks run.\u003c/strong> A headless \u003ccode>claude -p\u003c/code> run executes the hooks in\n        a repository's \u003ccode>.claude/settings.json\u003c/code> without a trust prompt. In CI on untrusted pull requests, use\n        \u003ccode>--bare\u003c/code> and pass the settings you trust with \u003ccode>--settings\u003c/code>.\u003c/li>\n    \u003c/ul>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"practice\">\n    \u003ch2>Practice\u003c/h2>\n    \u003cp>Five exercises, each run with \u003ccode>fleetlab.run_hook\u003c/code>: your \u003ccode>main()\u003c/code> reads\n      \u003ccode>sys.stdin\u003c/code> and calls \u003ccode>sys.exit\u003c/code> exactly as a real hook script does.\u003c/p>\n\n    \u003cdiv class=\"exercise\" data-id=\"m04-e1\" data-title=\"Block a destructive delete\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Write \u003ccode>main()\u003c/code> for a \u003ccode>PreToolUse\u003c/code> hook that exits 2 with a message on stderr when a\n          Bash command contains \u003ccode>rm -rf /\u003c/code> or \u003ccode>rm -rf ~\u003c/code> (followed by a space or the end of the\n          command), and exits 0 otherwise, including for non-Bash tools.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\nimport json, re, sys\n\ndef main():\n    payload = json.load(sys.stdin)\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\nimport fleetlab\n\ndef run(tool, **tool_input):\n    return fleetlab.run_hook(main, fleetlab.pre_tool_use(tool, tool_input))\n\ndef test_blocks_root_and_home():\n    for cmd in [\"rm -rf /\", \"rm -rf ~\", \"cd x && rm -rf / \", \"rm -rf ~ --verbose\"]:\n        r = run(\"Bash\", command=cmd)\n        assert r.exit_code == 2, f\"should block {cmd!r} with exit 2, got {r.exit_code}\"\n        assert r.stderr.strip(), \"explain the block on stderr\"\n\ndef test_allows_workspace_deletes():\n    for cmd in [\"rm -rf build\", \"rm -rf ./dist\", \"rm -rf /tmp/scratch\"]:\n        assert run(\"Bash\", command=cmd).exit_code == 0, f\"{cmd!r} is a normal delete\"\n\ndef test_other_tools():\n    assert run(\"Read\", file_path=\"/etc/hosts\").exit_code == 0\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>\u003ccode>re.search(r\"rm\\s+-rf\\s+(/|~)(\\s|$)\", command)\u003c/code>\n        matches the dangerous forms but not \u003ccode>/tmp/scratch\u003c/code>, because \u003ccode>/\u003c/code> must be followed by a\n        space or the end.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">import json, re, sys\n\ndef main():\n    payload = json.load(sys.stdin)\n    if payload.get(\"tool_name\") != \"Bash\":\n        sys.exit(0)\n    command = payload.get(\"tool_input\", {}).get(\"command\", \"\")\n    if re.search(r\"rm\\s+-rf\\s+(/|~)(\\s|$)\", command):\n        print(\"Blocked: recursive delete of / or your home directory.\", file=sys.stderr)\n        sys.exit(2)\n    sys.exit(0)\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"exercise\" data-id=\"m04-e2\" data-title=\"Protect paths\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Write \u003ccode>main()\u003c/code> for a hook matched to \u003ccode>Edit|Write\u003c/code>. Block (exit 2, message on stderr)\n          when \u003ccode>tool_input[\"file_path\"]\u003c/code>, made relative to the payload's \u003ccode>cwd\u003c/code> if it's inside it,\n          matches any glob in \u003ccode>PROTECTED\u003c/code> using \u003ccode>fnmatch\u003c/code>. Allow everything else.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\nimport fnmatch, json, sys\n\nPROTECTED = [\".github/workflows/*\", \".claude/*\", \".env\", \"tests/*\"]\n\ndef main():\n    payload = json.load(sys.stdin)\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\nimport fleetlab\n\ndef run(path):\n    return fleetlab.run_hook(main, fleetlab.pre_tool_use(\"Edit\", {\"file_path\": path}, cwd=\"/home/dev/shelf\"))\n\ndef test_relative_and_absolute():\n    assert run(\".env\").exit_code == 2\n    assert run(\"/home/dev/shelf/.github/workflows/ci.yml\").exit_code == 2, \"make absolute paths relative to cwd first\"\n\ndef test_protects_hooks_and_tests():\n    assert run(\"/home/dev/shelf/.claude/settings.json\").exit_code == 2, \"agents must not switch off their own gates\"\n    assert run(\"tests/test_store.py\").exit_code == 2\n\ndef test_allows_code():\n    r = run(\"/home/dev/shelf/shelf/store.py\")\n    assert r.exit_code == 0, f\"shelf/store.py is not protected (stderr: {r.stderr})\"\n\ndef test_message():\n    assert \".env\" in run(\".env\").stderr, \"name the blocked path in the message\"\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>If \u003ccode>path.startswith(cwd + \"/\")\u003c/code>, slice it off. Then\n        \u003ccode>any(fnmatch.fnmatch(rel, p) for p in PROTECTED)\u003c/code>.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">import fnmatch, json, sys\n\nPROTECTED = [\".github/workflows/*\", \".claude/*\", \".env\", \"tests/*\"]\n\ndef main():\n    payload = json.load(sys.stdin)\n    path = payload.get(\"tool_input\", {}).get(\"file_path\", \"\")\n    cwd = payload.get(\"cwd\", \"\")\n    rel = path[len(cwd) + 1:] if cwd and path.startswith(cwd + \"/\") else path\n    for pattern in PROTECTED:\n        if fnmatch.fnmatch(rel, pattern):\n            print(f\"Blocked: {rel} is protected ({pattern}). Explain the needed change in your summary instead.\", file=sys.stderr)\n            sys.exit(2)\n    sys.exit(0)\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"exercise\" data-id=\"m04-e3\" data-title=\"Deny with JSON\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Write \u003ccode>main()\u003c/code> that denies \u003ccode>git push\u003c/code> commands targeting \u003ccode>main\u003c/code> or\n          \u003ccode>master\u003c/code> by exiting 0 and printing a single JSON object with\n          \u003ccode>hookSpecificOutput.permissionDecision = \"deny\"\u003c/code> and a reason. For every other command print\n          nothing and exit 0.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\nimport json, re, sys\n\ndef main():\n    payload = json.load(sys.stdin)\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\nimport json, fleetlab\n\ndef run(cmd):\n    return fleetlab.run_hook(main, fleetlab.pre_tool_use(\"Bash\", {\"command\": cmd}))\n\ndef test_denies_main():\n    for cmd in [\"git push origin main\", \"git push origin HEAD:master\", \"git push -u origin main\"]:\n        r = run(cmd)\n        assert r.exit_code == 0, \"use JSON, not exit 2, in this exercise\"\n        assert r.decision == \"deny\", f\"{cmd!r} should be denied (stdout was {r.stdout!r})\"\n        assert r.reason, \"include permissionDecisionReason\"\n        assert r.json[\"hookSpecificOutput\"][\"hookEventName\"] == \"PreToolUse\"\n\ndef test_allows_feature_branch():\n    r = run(\"git push -u origin feat/main-menu\")\n    assert r.exit_code == 0 and r.decision is None and r.stdout.strip() == \"\", \"feature branches named like main-menu are fine\"\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>Match \u003ccode>main\u003c/code> or \u003ccode>master\u003c/code> as a whole word not\n        followed by \u003ccode>-\u003c/code>: \u003ccode>re.search(r\"\\bgit\\s+push\\b.*\\s(HEAD:)?(main|master)\\b(?!-)\", cmd)\u003c/code>.\n        Print with \u003ccode>print(json.dumps(...))\u003c/code>.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">import json, re, sys\n\ndef main():\n    payload = json.load(sys.stdin)\n    cmd = payload.get(\"tool_input\", {}).get(\"command\", \"\")\n    if re.search(r\"\\bgit\\s+push\\b.*\\s(HEAD:)?(main|master)\\b(?!-)\", cmd):\n        print(json.dumps({\"hookSpecificOutput\": {\n            \"hookEventName\": \"PreToolUse\",\n            \"permissionDecision\": \"deny\",\n            \"permissionDecisionReason\": \"Pushing to the default branch is not allowed. Push a branch and open a pull request.\",\n        }}))\n    sys.exit(0)\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"exercise\" data-id=\"m04-e4\" data-title=\"A Stop gate\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Write \u003ccode>make_stop_hook(run_checks)\u003c/code>. \u003ccode>run_checks()\u003c/code> returns \u003ccode>(exit_code,\n          output)\u003c/code> from the project's fast checks. Return a \u003ccode>main()\u003c/code> that:\u003c/p>\n        \u003cul>\n          \u003cli>exits 0 immediately if the payload's \u003ccode>stop_hook_active\u003c/code> is true (without running checks);\u003c/li>\n          \u003cli>exits 0 if the checks pass;\u003c/li>\n          \u003cli>otherwise prints \u003ccode>Checks failed\u003c/code> and the \u003cstrong>last 5 lines\u003c/strong> of the output to stderr,\n            and exits 2.\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\nimport json, sys\n\ndef make_stop_hook(run_checks):\n    def main():\n        ...\n    return main\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\nimport fleetlab\n\nLOG = \"\\n\".join(f\"line {i}\" for i in range(1, 21))\n\ndef test_passes():\n    r = fleetlab.run_hook(make_stop_hook(lambda: (0, \"ok\")), fleetlab.stop())\n    assert r.exit_code == 0\n\ndef test_blocks_with_tail():\n    r = fleetlab.run_hook(make_stop_hook(lambda: (1, LOG)), fleetlab.stop())\n    assert r.exit_code == 2, \"failing checks must block with exit 2\"\n    assert \"Checks failed\" in r.stderr\n    assert \"line 20\" in r.stderr and \"line 16\" in r.stderr, \"include the last 5 lines\"\n    assert \"line 15\" not in r.stderr, \"only the last 5 lines, not the whole log\"\n\ndef test_lets_go_when_active():\n    calls = []\n    def checks():\n        calls.append(1)\n        return (1, \"still failing\")\n    r = fleetlab.run_hook(make_stop_hook(checks), fleetlab.stop(active=True))\n    assert r.exit_code == 0, \"when stop_hook_active is true, let the agent stop\"\n    assert calls == [], \"don't even run the checks the second time\"\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>Read the payload first and check\n        \u003ccode>payload.get(\"stop_hook_active\")\u003c/code>. Use \u003ccode>output.splitlines()[-5:]\u003c/code>.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">import json, sys\n\ndef make_stop_hook(run_checks):\n    def main():\n        payload = json.load(sys.stdin)\n        if payload.get(\"stop_hook_active\"):\n            sys.exit(0)\n        code, output = run_checks()\n        if code == 0:\n            sys.exit(0)\n        print(\"Checks failed. Fix them before finishing:\", file=sys.stderr)\n        print(\"\\n\".join(output.splitlines()[-5:]), file=sys.stderr)\n        sys.exit(2)\n    return main\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"exercise\" data-id=\"m04-e5\" data-title=\"Wire it up\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Set \u003ccode>settings\u003c/code> to a settings dictionary that runs \u003ccode>guard_bash.py\u003c/code> before every Bash\n          call, \u003ccode>protect_paths.py\u003c/code> before every Edit and Write call (one matcher group for both), and\n          \u003ccode>require_green.py\u003c/code> when the agent stops. Use \u003ccode>\"type\": \"command\"\u003c/code> and commands of the\n          form \u003ccode>python3 \"$CLAUDE_PROJECT_DIR/.claude/hooks/&lt;file&gt;\"\u003c/code>.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\nsettings = {\n    \"hooks\": {\n    }\n}\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\nimport fleetlab\n\ndef names(event, tool=None):\n    return [c.rsplit(\"/\", 1)[-1].strip('\"') for c in fleetlab.hook_commands(settings, event, tool)]\n\ndef test_bash():\n    assert names(\"PreToolUse\", \"Bash\") == [\"guard_bash.py\"], \"only the guard runs for Bash\"\n\ndef test_edit_and_write():\n    assert names(\"PreToolUse\", \"Edit\") == [\"protect_paths.py\"]\n    assert names(\"PreToolUse\", \"Write\") == [\"protect_paths.py\"]\n\ndef test_read_is_ungated():\n    assert names(\"PreToolUse\", \"Read\") == [], \"Read needs no gate\"\n\ndef test_stop():\n    assert names(\"Stop\") == [\"require_green.py\"]\n\ndef test_one_group_for_edit_and_write():\n    groups = settings[\"hooks\"][\"PreToolUse\"]\n    assert len(groups) == 2, \"use one matcher group for Edit and Write (Edit|Write)\"\n\ndef test_project_dir():\n    for c in fleetlab.hook_commands(settings, \"Stop\"):\n        assert \"$CLAUDE_PROJECT_DIR\" in c, \"use $CLAUDE_PROJECT_DIR so the path works from any directory\"\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>Copy the shape from \"Configuring hooks\". The Stop group needs no\n        matcher.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">def hook(name):\n    return {\"type\": \"command\", \"command\": f'python3 \"$CLAUDE_PROJECT_DIR/.claude/hooks/{name}\"'}\n\nsettings = {\n    \"hooks\": {\n        \"PreToolUse\": [\n            {\"matcher\": \"Bash\", \"hooks\": [hook(\"guard_bash.py\")]},\n            {\"matcher\": \"Edit|Write\", \"hooks\": [hook(\"protect_paths.py\")]},\n        ],\n        \"Stop\": [{\"hooks\": [hook(\"require_green.py\")]}],\n    }\n}\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"mini-project\">\n    \u003ch2>Labs: shelf's two gates\u003c/h2>\n    \u003cdiv class=\"project-box\">\n      \u003cdiv class=\"widget-head\">\u003cspan class=\"w-kind\">Lab m04-lab1\u003c/span>\u003cspan class=\"w-title\">guard_bash.py: block risky commands\u003c/span>\u003c/div>\n      \u003cdiv class=\"widget-body\">\n        \u003cp>Write a PreToolUse guard for shelf and wire it into \u003ccode>.claude/settings.json\u003c/code>. The checks run your\n          script as a real subprocess against a table of commands that must be blocked (force pushes, pushes to the\n          default branch, skipping hooks, deleting outside the workspace, piping downloads into a shell) and commands\n          that must be allowed (normal pushes, \u003ccode>--force-with-lease\u003c/code>, cleaning build output, running\n          tests).\u003c/p>\n        \u003cpre data-label=\"Terminal\">\u003ccode class=\"language-bash\">pixi run start m04-lab1\npixi run grade m04-lab1\u003c/code>\u003c/pre>\n        \u003cul class=\"checklist\" data-id=\"m04-lab1\">\n          \u003cli>Every dangerous command in the README's table is blocked with exit 2 and a helpful message\u003c/li>\n          \u003cli>Every normal command is allowed\u003c/li>\n          \u003cli>Chained commands such as \u003ccode>cd x &amp;&amp; git push --force\u003c/code> are caught\u003c/li>\n          \u003cli>The settings wire the guard to Bash only\u003c/li>\n          \u003cli>Tried issue #5's instructions in a live session and watched the guard block the push\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"project-box\">\n      \u003cdiv class=\"widget-head\">\u003cspan class=\"w-kind\">Lab m04-lab2\u003c/span>\u003cspan class=\"w-title\">require_green.py: checks must pass before stopping\u003c/span>\u003c/div>\n      \u003cdiv class=\"widget-body\">\n        \u003cp>Write the Stop gate. It reads the check command from \u003ccode>.claude/check-command\u003c/code>, runs it with a\n          timeout, and blocks with the tail of the output when it fails. The checks run your hook in copies of shelf\n          with passing and failing tests, with and without \u003ccode>stop_hook_active\u003c/code>, and with a check that hangs.\u003c/p>\n        \u003cpre data-label=\"Terminal\">\u003ccode class=\"language-bash\">pixi run start m04-lab2\npixi run grade m04-lab2\u003c/code>\u003c/pre>\n        \u003cul class=\"checklist\" data-id=\"m04-lab2\">\n          \u003cli>Passing checks let the agent stop; failing checks block with the last lines of output\u003c/li>\n          \u003cli>\u003ccode>stop_hook_active\u003c/code> always lets the agent stop\u003c/li>\n          \u003cli>A hanging check is stopped by the timeout and reported\u003c/li>\n          \u003cli>The settings wire the gate to Stop, and \u003ccode>.claude/check-command\u003c/code> runs shelf's tests\u003c/li>\n          \u003cli>Asked an agent to fix issue #2 and watched the gate send it back when its first attempt failed\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"quiz\">\n    \u003ch2>Quiz\u003c/h2>\n    \u003cdiv class=\"quiz\" data-id=\"m04-quiz\">\n\u003cscript type=\"application/json\">\n{\"title\": \"Hooks and Gates quiz\", \"passScore\": 0.7, \"questions\": [\n  {\"type\": \"single\", \"prompt\": \"Why enforce \\\"never push to main\\\" with a hook instead of only AGENTS.md?\", \"options\": [\"Hooks are cheaper\", \"A hook is code that runs every time and can block; prose is a request the model may not follow\", \"AGENTS.md cannot mention git\", \"Hooks make the model smarter\"], \"answer\": 1, \"explanation\": \"\u003cp>Guides steer; sensors enforce. Keep the prose, but make the rule a guarantee.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"Your guard script raises an uncaught exception on a force push. What happens?\", \"options\": [\"The push is blocked\", \"The push goes ahead: a crash exits with a code other than 2, which is a non-blocking error\", \"Claude Code asks the user\", \"The session ends\"], \"answer\": 1, \"explanation\": \"\u003cp>Only exit 2 blocks. Test the block path, and make sure errors in your own code can't open the gate.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"On exit 2 from a PreToolUse hook, what does Claude see?\", \"options\": [\"Nothing\", \"Your stderr, as the reason the call was blocked\", \"Your stdout\", \"The full payload\"], \"answer\": 1, \"explanation\": \"\u003cp>Write stderr for the agent: what was blocked, why, and what to do instead.\u003c/p>\"},\n  {\"type\": \"multi\", \"prompt\": \"Which tool names does the matcher \u003ccode>Edit|Write\u003c/code> match?\", \"options\": [\"Edit\", \"Write\", \"MultiEdit\", \"NotebookEdit\"], \"answer\": [0, 1], \"explanation\": \"\u003cp>A matcher of only letters and \u003ccode>|\u003c/code> is an exact list. To match more, list them or use a regular expression.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"What does \u003ccode>mcp__github\u003c/code> match as a matcher?\", \"options\": [\"Every GitHub MCP tool\", \"Nothing\", \"Only the first GitHub tool\", \"Every MCP tool\"], \"answer\": 1, \"explanation\": \"\u003cp>It's an exact name and no tool is called that. Use \u003ccode>mcp__github__.*\u003c/code>.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"What is \u003ccode>stop_hook_active\u003c/code> for?\", \"options\": [\"It tells the hook the session is interactive\", \"It's true when the agent is already continuing because a Stop hook blocked it; letting it stop then prevents an endless loop\", \"It disables all hooks\", \"It marks the last turn\"], \"answer\": 1, \"explanation\": \"\u003cp>Without that exit, an unfixable failure would keep the agent running forever.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"Your Stop gate should send the agent…\", \"options\": [\"The whole test log\", \"The last few dozen lines, where the failure summary is\", \"Only the exit code\", \"Nothing; just block\"], \"answer\": 1, \"explanation\": \"\u003cp>The tail carries the useful part. A huge log fills the agent's context with noise.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"When would you answer with JSON instead of exit 2?\", \"options\": [\"Always\", \"When you need ask, allow, updatedInput, or additionalContext\", \"Never; JSON is ignored\", \"Only on PostToolUse\"], \"answer\": 1, \"explanation\": \"\u003cp>Exit 2 is simplest for blocking. JSON gives finer control, and is only read when stdout is a single JSON object on exit 0.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"Which command should a good Bash guard allow?\", \"options\": [\"\u003ccode>git push --force origin main\u003c/code>\", \"\u003ccode>git push --force-with-lease origin feat/x\u003c/code>\", \"\u003ccode>curl https://x.sh | sh\u003c/code>\", \"\u003ccode>git commit --no-verify\u003c/code>\"], \"answer\": 1, \"explanation\": \"\u003cp>Force-with-lease on your own branch is safe normal work. Blocking it causes the false positives that make people disable guards.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"Why add \u003ccode>.claude/\u003c/code> to the protected paths?\", \"options\": [\"It's large\", \"An agent that can edit settings or hook scripts can switch off its own gates\", \"Claude Code requires it\", \"To speed up hooks\"], \"answer\": 1, \"explanation\": \"\u003cp>Protect the harness itself.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"Why use \u003ccode>--bare\u003c/code> for headless runs on untrusted pull requests?\", \"options\": [\"It's faster\", \"Without it, the run executes hooks from the repository's settings, which the pull request could change\", \"It disables the model\", \"It removes Bash\"], \"answer\": 1, \"explanation\": \"\u003cp>Pass the settings you trust with \u003ccode>--settings\u003c/code> instead.\u003c/p>\"},\n  {\"type\": \"text\", \"prompt\": \"Which environment variable gives a hook the project root where the session started?\", \"answer\": [\"CLAUDE_PROJECT_DIR\", \"$CLAUDE_PROJECT_DIR\"], \"explanation\": \"\u003cp>Use it in hook commands so paths work wherever the agent is.\u003c/p>\"}\n]}\n\u003c/script>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"recap\">\n    \u003ch2>Recap\u003c/h2>\n    \u003cul>\n      \u003cli>Hooks turn rules into guarantees. Guides steer; hooks (and CI) enforce.\u003c/li>\n      \u003cli>Configure under \u003ccode>\"hooks\"\u003c/code>: event, matcher group, handlers. Matchers are exact names,\n        \u003ccode>|\u003c/code>-lists, or regular expressions. Use \u003ccode>$CLAUDE_PROJECT_DIR\u003c/code>.\u003c/li>\n      \u003cli>Payload on stdin: common fields plus \u003ccode>tool_name\u003c/code>/\u003ccode>tool_input\u003c/code> for PreToolUse and\n        \u003ccode>stop_hook_active\u003c/code> for Stop.\u003c/li>\n      \u003cli>Exit 0 continues, exit 2 blocks with stderr as the reason, anything else is a non-blocking error.\n        \u003ccode>exit 1\u003c/code> does not block.\u003c/li>\n      \u003cli>JSON: \u003ccode>hookSpecificOutput.permissionDecision\u003c/code> for PreToolUse; \u003ccode>{\"decision\": \"block\"}\u003c/code>\n        for Stop.\u003c/li>\n      \u003cli>Guards balance false negatives and false positives; test both from a table. Stop gates honour\n        \u003ccode>stop_hook_active\u003c/code>, send the tail, and use a timeout.\u003c/li>\n      \u003cli>Test hooks with recorded payloads, keep them fast, protect them, and use \u003ccode>--bare\u003c/code> on untrusted\n        input.\u003c/li>\n    \u003c/ul>\n    \u003cdiv class=\"flashcards\" data-title=\"Hooks and gates\">\n      \u003cscript type=\"application/json\">\n      [{\"front\": \"Exit 0 / 2 / other\", \"back\": \"Continue / block (stderr to Claude) / non-blocking error (action goes ahead).\"},\n       {\"front\": \"Does \u003ccode>exit 1\u003c/code> block?\", \"back\": \"No. Only exit 2 blocks.\"},\n       {\"front\": \"PreToolUse payload fields\", \"back\": \"Common fields plus \u003ccode>tool_name\u003c/code>, \u003ccode>tool_input\u003c/code>, \u003ccode>tool_use_id\u003c/code>.\"},\n       {\"front\": \"Stop payload field that prevents loops\", \"back\": \"\u003ccode>stop_hook_active\u003c/code>: let the agent stop when it's true.\"},\n       {\"front\": \"PreToolUse JSON decision\", \"back\": \"\u003ccode>{\\\"hookSpecificOutput\\\": {\\\"hookEventName\\\": \\\"PreToolUse\\\", \\\"permissionDecision\\\": \\\"deny\\\", \\\"permissionDecisionReason\\\": \\\"…\\\"}}\u003c/code>\"},\n       {\"front\": \"Stop JSON decision\", \"back\": \"\u003ccode>{\\\"decision\\\": \\\"block\\\", \\\"reason\\\": \\\"…\\\"}\u003c/code>\"},\n       {\"front\": \"Matcher \u003ccode>Edit|Write\u003c/code>\", \"back\": \"Exactly Edit or Write. Regex only when other characters appear.\"},\n       {\"front\": \"Path in hook commands\", \"back\": \"\u003ccode>$CLAUDE_PROJECT_DIR\u003c/code>.\"},\n       {\"front\": \"Hooks in subagent frontmatter\", \"back\": \"Run only while that subagent is active; \u003ccode>Stop\u003c/code> becomes \u003ccode>SubagentStop\u003c/code>.\"},\n       {\"front\": \"Two errors a guard balances\", \"back\": \"False negatives (danger gets through) and false positives (normal work blocked).\"},\n       {\"front\": \"Untrusted PRs and repo hooks\", \"back\": \"Use \u003ccode>--bare\u003c/code> and pass trusted settings with \u003ccode>--settings\u003c/code>.\"}]\n      \u003c/script>\n    \u003c/div>\n    \u003ch3>Going further\u003c/h3>\n    \u003cul>\n      \u003cli>\u003ca href=\"https://code.claude.com/docs/en/hooks\">Claude Code: Hooks reference\u003c/a> and \u003ca href=\"https://code.claude.com/docs/en/hooks-guide\">hooks guide\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"../reference/cheatsheet.html\">Agent and hook cheat sheet\u003c/a>\u003c/li>\n      \u003cli>Next: Stage 2 on the \u003ca href=\"../reference/roadmap.html\">roadmap\u003c/a>, where your agents start handing work to each other\u003c/li>\n    \u003c/ul>\n  \u003c/section>","exercises":["m04-e1","m04-e2","m04-e3","m04-e4","m04-e5"],"quizzes":["m04-quiz"],"checklists":{"m04-lab1":5,"m04-lab2":5}},"reference/roadmap.html":{"id":"ref-roadmap","kind":"reference","title":"Roadmap · Coding Agent Fleets Practicum","html":"\u003cheader class=\"lesson-hero\">\n    \u003cp class=\"eyebrow\">Reference · Roadmap\u003c/p>\n    \u003ch1>Roadmap\u003c/h1>\n    \u003cp class=\"lede\">Level 1 takes you from one agent to a small working fleet. Stage 1 (one agent) is available now.\n      Stage 2 and the capstone come next, then two further levels for running fleets at scale.\u003c/p>\n  \u003c/header>\n\n  \u003csection class=\"lesson-section\" id=\"level-1\">\n    \u003ch2>Level 1 · Builder\u003c/h2>\n    \u003ch3>Stage 1 · One Agent (available)\u003c/h3>\n    \u003cul>\n      \u003cli>\u003ca href=\"../modules/m00-orientation.html\">M00 How This Practicum Works\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"../modules/m01-the-harness.html\">M01 The Harness\u003c/a>: the loop, tools, permissions, settings, headless runs, transcripts\u003c/li>\n      \u003cli>\u003ca href=\"../modules/m02-writing-a-subagent.html\">M02 Writing a Subagent\u003c/a>: definitions, descriptions, prompts, least privilege\u003c/li>\n      \u003cli>\u003ca href=\"../modules/m03-context-engineering.html\">M03 Context Engineering\u003c/a>: AGENTS.md, CLAUDE.md, skills, the context budget\u003c/li>\n      \u003cli>\u003ca href=\"../modules/m04-hooks-and-gates.html\">M04 Hooks and Gates\u003c/a>: guards on risky commands and a Stop gate\u003c/li>\n    \u003c/ul>\n    \u003ch3>Stage 2 · Many Agents (next)\u003c/h3>\n    \u003cul>\n      \u003cli>\u003cstrong>M05 Handoffs and Delegation\u003c/strong>: specs as contracts, subagents versus agent teams, worktrees,\n        one writer per file, and passing work through files a human can review.\u003c/li>\n      \u003cli>\u003cstrong>M06 Orchestrating in Code\u003c/strong>: driving stations from Python with the Agent SDK and\n        \u003ccode>claude -p\u003c/code>; structured output with \u003ccode>--json-schema\u003c/code>; retries, budgets, and state you own.\n        Labs grade your orchestrator against a fake \u003ccode>claude\u003c/code> binary that replays recorded runs.\u003c/li>\n      \u003cli>\u003cstrong>M07 The Fleet in CI\u003c/strong>: GitHub Actions triggers, labels as a state machine,\n        \u003ccode>anthropics/claude-code-action\u003c/code>, secrets, concurrency, timeouts, and running the same fleet under\n        Copilot and Devin through AGENTS.md, skills, and per-tool adapters.\u003c/li>\n      \u003cli>\u003cstrong>M08 Self-Healing Loops\u003c/strong>: a healer for red CI with attempt caps, no-progress detection, cost\n        limits, classification of failures, and escalation to a human.\u003c/li>\n      \u003cli>\u003cstrong>M09 Evals and Learning\u003c/strong>: replaying past tasks against harness changes, telemetry with\n        OpenTelemetry, a retrospective agent that proposes evidence-backed harness changes, and deleting rules that no\n        longer earn their place.\u003c/li>\n    \u003c/ul>\n    \u003ch3>Capstone 1 · A Small Fleet\u003c/h3>\n    \u003cp>Build triage → plan → build → review for shelf, driven by your own orchestrator, gated by your hooks, and\n      measured against an evaluation set of the five shelf issues.\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"later-levels\">\n    \u003ch2>Levels 2 and 3\u003c/h2>\n    \u003cul>\n      \u003cli>\u003cstrong>Level 2 · Fleet operations\u003c/strong>: running fleets across many repositories, shared harness\n        packages, cost and quality dashboards, incident handling for agent mistakes, and governance in regulated\n        environments.\u003c/li>\n      \u003cli>\u003cstrong>Level 3 · Fleet platform\u003c/strong>: hosting agents on your own infrastructure, sandboxing and\n        network policy, MCP servers for internal systems, and designing tools for agents.\u003c/li>\n    \u003c/ul>\n  \u003c/section>","exercises":[],"quizzes":[],"checklists":{}},"reference/fleetlab.html":{"id":"ref-fleetlab","kind":"reference","title":"fleetlab Reference · Coding Agent Fleets Practicum","html":"\u003cheader class=\"lesson-hero\">\n    \u003cp class=\"eyebrow\">Reference · Library\u003c/p>\n    \u003ch1>fleetlab Reference\u003c/h1>\n    \u003cp class=\"lede\">\u003ccode>fleetlab\u003c/code> is the small helper lib
