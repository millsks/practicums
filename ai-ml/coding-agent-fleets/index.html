/* ---------- Tokens ---------- */
:root {
  --bg: #fbfaf7;
  --bg-elev: #ffffff;
  --bg-sunk: #f2f0ea;
  --bg-code: #f6f5f1;
  --fg: #1d1f23;
  --fg-muted: #5b6070;
  --fg-faint: #8a8f9c;
  --border: #e3e0d8;
  --border-strong: #cfcabd;
  --accent: #2f6fdf;
  --accent-fg: #ffffff;
  --accent-soft: #e6eefc;
  --py-blue: #3670a0;
  --py-yellow: #f2c53d;
  --ok: #1f8a4c;
  --ok-soft: #e3f4ea;
  --bad: #c2382f;
  --bad-soft: #fbe8e6;
  --warn: #a86400;
  --warn-soft: #fdf1dc;
  --note: #5b5bd6;
  --note-soft: #ecebfc;
  --v314: #0f7b8a;
  --v314-soft: #ddf3f5;
  --v315: #8a3ffc;
  --v315-soft: #f1e8ff;
  --pixi: #c2410c;
  --pixi-soft: #fdeee6;
  /* syntax */
  --tok-comment: #7d8590;
  --tok-keyword: #a626a4;
  --tok-string: #2f7d32;
  --tok-number: #b35c00;
  --tok-function: #2f5fbf;
  --tok-builtin: #0e7490;
  --tok-operator: #4b5563;
  --tok-decorator: #b45309;
  --tok-class: #9a3412;
  /* viz palette */
  --viz-1: #2f6fdf;
  --viz-2: #e08a00;
  --viz-3: #1f8a4c;
  --viz-4: #c2382f;
  --viz-5: #8a3ffc;
  --viz-6: #0f7b8a;
  --viz-node: #ffffff;
  --viz-edge: #9aa1ad;
  --viz-active: #f2c53d;
  --viz-done: #9fd8b5;

  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 1px 2px rgba(20, 20, 30, 0.06), 0 4px 16px rgba(20, 20, 30, 0.05);
  --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --header-h: 56px;
  --sidebar-w: 300px;
  --content-w: 820px;
  color-scheme: light;
}

  --bg: #14161a;

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--header-h) + 16px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.7 var(--font-sans);
  overflow-x: hidden;
}
a { color: var(--accent); text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
img, svg, canvas { max-width: 100%; }
h1, h2, h3, h4 { line-height: 1.25; letter-spacing: -0.015em; }
h1 { font-size: clamp(2rem, 4vw, 2.6rem); margin: 0.2em 0 0.3em; font-weight: 800; }
h2 { font-size: 1.6rem; margin: 2.2em 0 0.6em; font-weight: 700; }
h3 { font-size: 1.2rem; margin: 1.8em 0 0.5em; font-weight: 650; }
h4 { font-size: 1rem; margin: 1.4em 0 0.4em; }
p, ul, ol { margin: 0 0 1em; }
li + li { margin-top: 0.25em; }
hr { border: 0; border-top: 1px solid var(--border); margin: 2.5em 0; }
table { border-collapse: collapse; width: 100%; margin: 1em 0 1.5em; font-size: 0.93rem; display: block; overflow-x: auto; }
th, td { border: 1px solid var(--border); padding: 0.5em 0.75em; text-align: left; vertical-align: top; }
th { background: var(--bg-sunk); font-weight: 600; }
kbd {
  font-family: var(--font-mono); font-size: 0.82em; padding: 0.1em 0.45em;
  border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px; background: var(--bg-elev);
}
code { font-family: var(--font-mono); font-size: 0.88em; }
:not(pre) > code {
  background: var(--bg-sunk); border: 1px solid var(--border); padding: 0.08em 0.35em; border-radius: 4px;
  overflow-wrap: anywhere;
}
pre {
  font-family: var(--font-mono); font-size: 0.86rem; line-height: 1.6;
  background: var(--bg-code); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 1em 1.1em; overflow-x: auto; margin: 0 0 1.2em; position: relative; tab-size: 4;
}
pre code { background: none; border: 0; padding: 0; font-size: inherit; }
dfn { font-style: normal; font-weight: 600; border-bottom: 1px dotted var(--fg-muted); }
mark { background: color-mix(in srgb, var(--py-yellow) 45%, transparent); color: inherit; padding: 0 0.15em; border-radius: 3px; }
button { font: inherit; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Syntax tokens (Prism) ---------- */
.token.comment, .token.prolog, .token.doctype, .token.cdata { color: var(--tok-comment); font-style: italic; }
.token.keyword, .token.important, .token.atrule { color: var(--tok-keyword); }
.token.string, .token.char, .token.attr-value, .token.triple-quoted-string, .token.string-interpolation { color: var(--tok-string); }
.token.interpolation { color: var(--fg); }
.token.number, .token.boolean, .token.constant { color: var(--tok-number); }
.token.function { color: var(--tok-function); }
.token.builtin { color: var(--tok-builtin); }
.token.operator, .token.punctuation { color: var(--tok-operator); }
.token.decorator, .token.annotation { color: var(--tok-decorator); }
.token.class-name { color: var(--tok-class); }
.token.property, .token.key, .token.table { color: var(--tok-function); }

/* ---------- App shell ---------- */
.pp-header {
  position: sticky; top: 0; z-index: 50; height: var(--header-h);
  display: flex; align-items: center; gap: 12px; padding: 0 16px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.pp-brand { display: flex; align-items: center; gap: 10px; font-weight: 800; color: var(--fg); text-decoration: none; white-space: nowrap; }
.pp-brand .logo { width: 28px; height: 28px; flex: none; }
.pp-brand small { font-weight: 500; color: var(--fg-muted); font-size: 0.8rem; }
.pp-header .spacer { flex: 1; }
.pp-progress-pill {
  font-size: 0.8rem; color: var(--fg-muted); border: 1px solid var(--border); border-radius: 999px;
  padding: 0.2em 0.75em; white-space: nowrap; background: var(--bg-elev);
}
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; flex: none;
  border: 1px solid var(--border); border-radius: 8px; background: var(--bg-elev); color: var(--fg); cursor: pointer;
}
.icon-btn:hover { border-color: var(--border-strong); }
.icon-btn svg { width: 18px; height: 18px; }
.pp-menu-btn { display: none; }

.pp-layout { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: calc(100vh - var(--header-h)); }
.pp-sidebar {
  position: sticky; top: var(--header-h); height: calc(100vh - var(--header-h)); overflow-y: auto;
  border-right: 1px solid var(--border); padding: 16px 12px 40px; background: var(--bg); font-size: 0.9rem;
}
.pp-sidebar .part { margin-bottom: 4px; }
.pp-sidebar .part > button {
  width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; background: none; border: 0;
  padding: 8px; border-radius: 8px; cursor: pointer; color: var(--fg); font-weight: 650; font-size: 0.86rem;
}
.pp-sidebar .part > button:hover { background: var(--bg-sunk); }
.pp-sidebar .part > button .num {
  display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px;
  background: var(--accent-soft); color: var(--accent); font-size: 0.75rem; flex: none;
}
.pp-sidebar .part > button .chev { margin-left: auto; transition: transform 0.15s; color: var(--fg-faint); }
.pp-sidebar .part.open > button .chev { transform: rotate(90deg); }
.pp-sidebar ul { list-style: none; margin: 0; padding: 0 0 6px 18px; display: none; }
.pp-sidebar .part.open ul { display: block; }
.pp-sidebar li { margin: 0; }
.pp-sidebar li a {
  display: flex; gap: 8px; align-items: baseline; padding: 5px 8px; border-radius: 6px;
  color: var(--fg-muted); text-decoration: none; line-height: 1.35;
}
.pp-sidebar li a:hover { background: var(--bg-sunk); color: var(--fg); }
.pp-sidebar li a.current { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.pp-sidebar li a .mid { font-family: var(--font-mono); font-size: 0.72rem; color: var(--fg-faint); flex: none; width: 2.2em; }
.pp-sidebar li a .done { margin-left: auto; color: var(--ok); flex: none; }
.pp-sidebar .side-title { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-faint); margin: 18px 8px 6px; }

.pp-main { padding: 32px 16px 80px; min-width: 0; }
.pp-content-wrap { display: grid; grid-template-columns: minmax(0, var(--content-w)) 220px; gap: 48px; justify-content: center; }
.pp-toc { position: sticky; top: calc(var(--header-h) + 24px); align-self: start; font-size: 0.82rem; max-height: calc(100vh - 120px); overflow-y: auto; }
.pp-toc h4 { margin: 0 0 8px; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-faint); }
.pp-toc a { display: block; color: var(--fg-muted); text-decoration: none; padding: 3px 0 3px 10px; border-left: 2px solid var(--border); line-height: 1.35; }
.pp-toc a.active { color: var(--accent); border-left-color: var(--accent); }
.pp-toc a:hover { color: var(--fg); }

@media (max-width: 1240px) {
  .pp-content-wrap { grid-template-columns: minmax(0, var(--content-w)); }
  .pp-toc { display: none; }
}
@media (max-width: 900px) {
  .pp-layout { grid-template-columns: minmax(0, 1fr); }
  .pp-menu-btn { display: inline-flex; }
  .pp-sidebar {
    position: fixed; left: 0; top: var(--header-h); width: min(86vw, 320px); z-index: 40;
    transform: translateX(-102%); transition: transform 0.2s ease; box-shadow: var(--shadow); background: var(--bg-elev);
  }
  body.nav-open .pp-sidebar { transform: none; }
  .pp-brand small, .pp-progress-pill { display: none; }
}

/* ---------- Lesson ---------- */
.lesson { max-width: var(--content-w); min-width: 0; }
.lesson-hero { padding-bottom: 1.2em; border-bottom: 1px solid var(--border); margin-bottom: 1em; }
.eyebrow { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); margin: 0; }
.lede { font-size: 1.15rem; color: var(--fg-muted); }
.lesson-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 0.85rem; color: var(--fg-muted); margin: 0.5em 0 1em; }
.lesson-meta span { display: inline-flex; gap: 6px; align-items: center; }
.objectives {
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); padding: 1em 1.2em 1em 2.4em; margin: 1em 0;
}
.objectives::before { content: "By the end of this module you will be able to"; display: block; margin: 0 0 0.4em -1.2em; font-weight: 700; font-size: 0.9rem; }
.lesson-section { scroll-margin-top: calc(var(--header-h) + 16px); }
.lesson-section > h2:first-child { padding-top: 0.6em; border-top: 1px solid var(--border); }
.lesson-hero + .lesson-section > h2:first-child { border-top: 0; }
.figure { margin: 1.5em 0; text-align: center; }
.figure figcaption, .caption { font-size: 0.85rem; color: var(--fg-muted); margin-top: 0.5em; }
.diagram { display: block; margin: 1.2em auto; max-width: 100%; height: auto; }
.diagram text { font-family: var(--font-sans); fill: var(--fg); }
.diagram .mono { font-family: var(--font-mono); }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 700px) { .two-col { grid-template-columns: 1fr; } }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin: 1em 0 1.5em; }
.card { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); padding: 1em 1.1em; }
.card h4 { margin-top: 0; }
.tag {
  display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 0.15em 0.55em; border-radius: 999px;
  background: var(--bg-sunk); color: var(--fg-muted); border: 1px solid var(--border); vertical-align: middle;
}
.tag.v314 { background: var(--v314-soft); color: var(--v314); border-color: transparent; }
.tag.v315 { background: var(--v315-soft); color: var(--v315); border-color: transparent; }
.tag.pixi { background: var(--pixi-soft); color: var(--pixi); border-color: transparent; }

/* ---------- Callouts ---------- */
.callout {
  --c: var(--note); --c-soft: var(--note-soft);
  border: 1px solid color-mix(in srgb, var(--c) 30%, transparent); border-left: 4px solid var(--c);
  background: var(--c-soft); border-radius: var(--radius-sm); padding: 0.85em 1.1em; margin: 1.2em 0;
}
.callout > :last-child { margin-bottom: 0; }
.callout::before { display: block; font-weight: 700; font-size: 0.8rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--c); margin-bottom: 0.3em; }
.callout.note::before { content: "Note"; }
.callout.tip { --c: var(--ok); --c-soft: var(--ok-soft); }
.callout.tip::before { content: "Tip"; }
.callout.warn { --c: var(--warn); --c-soft: var(--warn-soft); }
.callout.warn::before { content: "Watch out"; }
.callout.danger { --c: var(--bad); --c-soft: var(--bad-soft); }
.callout.danger::before { content: "Common bug"; }
.callout.py314 { --c: var(--v314); --c-soft: var(--v314-soft); }
.callout.py314::before { content: "New in Python 3.14"; }
.callout.py315 { --c: var(--v315); --c-soft: var(--v315-soft); }
.callout.py315::before { content: "Preview · Python 3.15"; }
.callout.pixi { --c: var(--pixi); --c-soft: var(--pixi-soft); }
.callout.pixi::before { content: "Pixi"; }
.callout.pro { --c: var(--accent); --c-soft: var(--accent-soft); }
.callout.pro::before { content: "Pro practice"; }
.callout.think { --c: var(--py-blue); --c-soft: var(--accent-soft); }
.callout.think::before { content: "Think about it"; }
.callout[data-title]::before { content: attr(data-title); }

/* ---------- Widgets: shared ---------- */
.widget {
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius);
  margin: 1.4em 0; box-shadow: var(--shadow); overflow: hidden;
}
.widget-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 0.55em 0.9em;
  border-bottom: 1px solid var(--border); background: var(--bg-sunk); font-size: 0.85rem;
}
.widget-head .w-title { font-weight: 650; }
.widget-head .w-kind { font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-faint); font-weight: 700; }
.widget-head .spacer { flex: 1; }
.widget-body { padding: 0.9em; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-strong); background: var(--bg-elev);
  color: var(--fg); border-radius: 7px; padding: 0.32em 0.8em; font-size: 0.84rem; font-weight: 600; cursor: pointer; line-height: 1.4;
}
.btn:hover { border-color: var(--fg-faint); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.small { padding: 0.18em 0.6em; font-size: 0.78rem; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.status { font-size: 0.8rem; color: var(--fg-muted); }

/* code editor */
.editor-host { border-bottom: 1px solid var(--border); background: var(--bg-code); }
.editor-host textarea {
  display: block; width: 100%; min-height: 8em; border: 0; resize: vertical; padding: 0.9em;
  font: 0.86rem/1.6 var(--font-mono); background: var(--bg-code); color: var(--fg); tab-size: 4;
}
.CodeMirror {
  height: auto; min-height: 3em; font-family: var(--font-mono); font-size: 0.86rem; line-height: 1.6;
  background: var(--bg-code); color: var(--fg);
}
.CodeMirror-scroll { max-height: 560px; min-height: 3em; }
.CodeMirror-gutters { background: var(--bg-code); border-right: 1px solid var(--border); }
.CodeMirror-linenumber { color: var(--fg-faint); }
.CodeMirror-cursor { border-left: 2px solid var(--accent); }
.CodeMirror-selected, .CodeMirror-focused .CodeMirror-selected { background: color-mix(in srgb, var(--accent) 22%, transparent) !important; }

<script type="application/json" id="pp-data">{"curriculum":{"title":"Coding Agent Fleets Practicum","python":"3.14","parts":[{"id":"part0","number":0,"title":"Orientation","level":"Start here","summary":"What a fleet of coding agents is, how this practicum works, the shelf sample project, labs graded with Pixi, and working safely.","modules":[{"id":"m00","title":"How This Practicum Works","href":"modules/m00-orientation.html","minutes":60,"summary":"The fleet you will build, fleetlab in the browser, labs and grading, the shelf sample project, and safety rules for agents."}],"projects":[]},{"id":"part1","number":1,"title":"Stage 1 · One Agent","level":"Level 1 · Builder","summary":"Understand the harness around the model, then write one good agent: its definition, the context it reads, and the hooks that enforce its rules.","modules":[{"id":"m01","title":"The Harness","href":"modules/m01-the-harness.html","minutes":120,"summary":"Agent = model + harness. The loop inside Claude Code, tools and permissions, settings, headless runs, and reading a transcript."},{"id":"m02","title":"Writing a Subagent","href":"modules/m02-writing-a-subagent.html","minutes":150,"summary":"Subagent files, every frontmatter field, descriptions that trigger delegation, prompts with stop conditions, and least-privilege tools."},{"id":"m03","title":"Context Engineering","href":"modules/m03-context-engineering.html","minutes":120,"summary":"What loads at startup, AGENTS.md and CLAUDE.md, skills and progressive disclosure, and spending the context window on the task."},{"id":"m04","title":"Hooks and Gates","href":"modules/m04-hooks-and-gates.html","minutes":150,"summary":"Hook events, payloads, exit codes and JSON decisions, matchers, a guard for risky commands, and a Stop gate that keeps the agent working until checks pass."}],"projects":[]}],"reference":[{"id":"ref-roadmap","title":"Roadmap","href":"reference/roadmap.html","summary":"Stage 2 (many agents), the capstone, and Levels 2-3."},{"id":"ref-fleetlab","title":"fleetlab Reference","href":"reference/fleetlab.html","summary":"Every fleetlab helper used in lessons and lab checks: frontmatter, agents, skills, hooks, settings, and transcripts."},{"id":"ref-cheatsheet","title":"Agent and Hook Cheat Sheet","href":"reference/cheatsheet.html","summary":"Subagent fields, hook events and exit codes, permission modes, and headless flags on one page."},{"id":"ref-glossary","title":"Glossary","href":"reference/glossary.html","summary":"Terms used in the course, with links to where each is taught."}]},"pages":{"index.html":{"id":"home","kind":"home","title":"Coding Agent Fleets Practicum","html":"\u003cheader class=\"home-hero\">\n    \u003cp class=\"eyebrow\">Claude Code · Agent SDK · Pixi\u003c/p>\n    \u003ch1>Coding Agent Fleets Practicum\u003c/h1>\n    \u003cp class=\"lede\">Learn to write coding agents yourself, then orchestrate them into a fleet that triages issues,\n      plans, builds, tests, reviews, heals red builds, and learns from its mistakes. You write every agent\n      definition, hook, and orchestration script. The course explains the ideas and checks your work; it never\n      hands you the finished fleet.\u003c/p>\n    \u003cdiv class=\"btn-row\">\n      \u003ca class=\"btn primary\" href=\"modules/m00-orientation.html\">Start with Module 00 →\u003c/a>\n      \u003ca class=\"btn\" href=\"modules/m02-writing-a-subagent.html\">Jump to writing a subagent\u003c/a>\n      \u003ca class=\"btn\" href=\"reference/roadmap.html\">See the roadmap\u003c/a>\n    \u003c/div>\n  \u003c/header>\n\n  \u003csection class=\"lesson-section\" id=\"progress\">\n    \u003ch2>Your progress\u003c/h2>\n    \u003cdiv class=\"card-grid\" id=\"progress-stats\">\u003c/div>\n    \u003cp class=\"status\">Progress, exercise code, quiz scores, and notes are saved in this browser. Export a backup or move to another computer:\u003c/p>\n    \u003cdiv class=\"btn-row\">\n      \u003cbutton class=\"btn small\" id=\"export-progress\" type=\"button\">Export progress\u003c/button>\n      \u003clabel class=\"btn small\">Import progress\u003cinput type=\"file\" id=\"import-progress\" accept=\"application/json\" class=\"visually-hidden\">\u003c/label>\n      \u003cspan class=\"status\" id=\"progress-message\" aria-live=\"polite\">\u003c/span>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"how\">\n    \u003ch2>How this course works\u003c/h2>\n    \u003cdiv class=\"card-grid\">\n      \u003cdiv class=\"card\">\u003ch4>1 · Read and try\u003c/h4>\u003cp>Lessons mix explanation with \u003cstrong>runnable Python cells\u003c/strong> that use \u003ccode>fleetlab\u003c/code>, a small helper library that checks agent files, builds hook payloads, and reads transcripts. It runs in your browser and never calls a model.\u003c/p>\u003c/div>\n      \u003cdiv class=\"card\">\u003ch4>2 · Practice\u003c/h4>\u003cp>\u003cstrong>Graded exercises\u003c/strong> in every module check your code in the page. Hints are there when you need them, and a reference answer for the small in-page exercises.\u003c/p>\u003c/div>\n      \u003cdiv class=\"card\">\u003ch4>3 · Build in labs\u003c/h4>\u003cp>Each module ends with \u003cstrong>labs\u003c/strong> you do on your machine: \u003ccode>pixi run start m02-lab1\u003c/code>, write the agent or hook, then \u003ccode>pixi run grade m02-lab1\u003c/code>.\u003c/p>\u003c/div>\n      \u003cdiv class=\"card\">\u003ch4>4 · No answer key\u003c/h4>\u003cp>Labs ship \u003cstrong>without solutions\u003c/strong>. Their checks are the specification. The repository's own CI proves every untouched starter fails, so a green grade means you built it.\u003c/p>\u003c/div>\n      \u003cdiv class=\"card\">\u003ch4>5 · Run it for real\u003c/h4>\u003cp>Most checks are deterministic and need no API key. Optional \u003cstrong>live checks\u003c/strong> (\u003ccode>pixi run grade-live &lt;lab&gt;\u003c/code>) run your agents with the real \u003ccode>claude\u003c/code> CLI.\u003c/p>\u003c/div>\n      \u003cdiv class=\"card\">\u003ch4>6 · One codebase\u003c/h4>\u003cp>Every lab works on \u003ccode>shelf\u003c/code>, a tiny book-tracking CLI with real bugs, open issues (one of them hostile), and tests.\u003c/p>\u003c/div>\n    \u003c/div>\n    \u003cpre class=\"mermaid\">\nflowchart LR\n  O[0 · Orientation] --> S1[Stage 1 · One agent] --> S2[Stage 2 · Many agents] --> C1[Capstone · A small fleet]\n  C1 -.-> L2[Level 2 · Fleet operations] -.-> L3[Level 3 · Fleet platform]\n    \u003c/pre>\n    \u003caside class=\"callout note\">\n      \u003cp>\u003cstrong>Stage 1 is available now:\u003c/strong> the harness, writing a subagent, context engineering, and hooks.\n        Stage 2 (handoffs, orchestration in code, CI, self-healing, and evals) and the capstone are next on the\n        \u003ca href=\"reference/roadmap.html\">roadmap\u003c/a>.\u003c/p>\n    \u003c/aside>\n    \u003caside class=\"callout pixi\">\n      \u003cp>All local work uses \u003ca href=\"https://pixi.sh\">Pixi\u003c/a>. From the repository root: \u003ccode>pixi install\u003c/code>\n        once, \u003ccode>pixi run serve\u003c/code> to open this site, \u003ccode>pixi run labs\u003c/code> to list labs,\n        \u003ccode>pixi run start &lt;lab&gt;\u003c/code> to copy a starter into \u003ccode>work/\u003c/code>, and\n        \u003ccode>pixi run grade &lt;lab&gt;\u003c/code> to check it.\u003c/p>\n    \u003c/aside>\n    \u003caside class=\"callout tip\">\n      \u003cp>This course assumes you can read Python and use git. It builds on the\n        \u003ca href=\"https://github.com/millsks/agentic-systems-practicum\">Agentic Systems Practicum\u003c/a>, which teaches the\n        agent loop from the Messages API up. You don't need it first, but its M09 (the agent loop) is the best\n        background for M01 here.\u003c/p>\n    \u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"curriculum\">\n    \u003ch2>Curriculum\u003c/h2>\n    \u003cdiv id=\"curriculum-map\">\u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"reference\">\n    \u003ch2>Reference\u003c/h2>\n    \u003cdiv class=\"card-grid\">\n      \u003ca class=\"card\" href=\"reference/roadmap.html\">\u003ch4>Roadmap\u003c/h4>\u003cp>Stage 2, the capstone, and Levels 2-3.\u003c/p>\u003c/a>\n      \u003ca class=\"card\" href=\"reference/fleetlab.html\">\u003ch4>fleetlab Reference\u003c/h4>\u003cp>Every helper used in lessons and lab checks.\u003c/p>\u003c/a>\n      \u003ca class=\"card\" href=\"reference/cheatsheet.html\">\u003ch4>Agent and Hook Cheat Sheet\u003c/h4>\u003cp>Fields, events, exit codes, modes, and flags on one page.\u003c/p>\u003c/a>\n      \u003ca class=\"card\" href=\"reference/glossary.html\">\u003ch4>Glossary\u003c/h4>\u003cp>Terms with links to where they're taught.\u003c/p>\u003c/a>\n    \u003c/div>\n  \u003c/section>","exercises":[],"quizzes":[],"checklists":{}},"modules/m00-orientation.html":{"id":"m00","kind":"module","title":"M00 · How This Practicum Works · Coding Agent Fleets Practicum","html":"\u003cheader class=\"lesson-hero\">\n    \u003cp class=\"eyebrow\">Orientation · Module 00\u003c/p>\n    \u003ch1>How This Practicum Works\u003c/h1>\n    \u003cp class=\"lede\">A fleet of coding agents is not one clever model. It is several narrow agents, each with its own\n      instructions, tools, and checks, passing work to each other through files a human can read. This module shows\n      you the fleet you will build, how the lessons and labs fit together, the codebase your agents will work on,\n      and the safety rules that apply from the first lab.\u003c/p>\n    \u003cdiv class=\"lesson-meta\">\u003cspan>⏱ ~1 hour\u003c/span>\u003cspan>Prerequisites: Python and git basics\u003c/span>\u003c/div>\n    \u003cul class=\"objectives\">\n      \u003cli>Describe a fleet of coding agents as stations, handoffs, and gates, and name the stations you will build\u003c/li>\n      \u003cli>Explain the difference between the model and the harness, and why this course is mostly about the harness\u003c/li>\n      \u003cli>Use \u003ccode>fleetlab\u003c/code> in a lesson cell to check an agent file and build a hook payload\u003c/li>\n      \u003cli>Start, do, and grade a lab with Pixi, and explain why labs ship without solutions\u003c/li>\n      \u003cli>Find your way around \u003ccode>shelf\u003c/code>, the sample project every lab uses\u003c/li>\n      \u003cli>Apply the safety rules for running agents: sandboxes, credentials, and untrusted input\u003c/li>\n    \u003c/ul>\n  \u003c/header>\n\n  \u003csection class=\"lesson-section\" id=\"the-fleet\">\n    \u003ch2>The fleet you will build\u003c/h2>\n    \u003cp>A \u003cstrong>coding agent\u003c/strong> is a language model running in a loop with tools that read and change a\n      codebase: it reads files, edits them, runs commands, and decides what to do next from what it sees. Claude\n      Code is one. GitHub Copilot's agent and Devin are others.\u003c/p>\n    \u003cp>One agent can fix a bug. A \u003cstrong>fleet\u003c/strong> takes on the whole software development lifecycle (SDLC) by\n      splitting it into \u003cstrong>stations\u003c/strong>, each run by a narrow agent. A station has four parts:\u003c/p>\n    \u003cul>\n      \u003cli>\u003cstrong>A trigger\u003c/strong>: what starts it (an issue is opened, a label is added, CI fails, a schedule).\u003c/li>\n      \u003cli>\u003cstrong>An agent\u003c/strong>: instructions, a model, and only the tools that job needs.\u003c/li>\n      \u003cli>\u003cstrong>A handoff\u003c/strong>: a file the next station reads, such as labels, a spec, a branch, or a review.\u003c/li>\n      \u003cli>\u003cstrong>A gate\u003c/strong>: a check that must pass before work moves on, enforced by code or by a person.\u003c/li>\n    \u003c/ul>\n    \u003cpre class=\"mermaid\">\nflowchart LR\n  T[Triage] -->|labels| P[Plan]\n  P -->|spec.md| B[Build]\n  B -->|branch| R[Review]\n  B \u003c-->|tests| X[Test]\n  R -->|approved PR| L[Release]\n  L --> O[Operate]\n  O -.->|new issues| T\n  H[Heal] -.->|fix red CI| B\n  Q[Learn] -.->|harness changes| T\n    \u003c/pre>\n    \u003cp>By the end of Level 1 you will have written every one of these agents, the hooks that keep them honest, a\n      Python script that runs them in order, the GitHub Actions workflows that trigger them, a healer that fixes\n      red builds within strict limits, and an evaluation set that tells you whether a change to your fleet made it\n      better or worse.\u003c/p>\n    \u003caside class=\"callout think\">\u003cp>Which of those stations would you trust an agent with today, with no human\n      check at all? Keep your answer. You'll revisit it after M04, when you've seen what gates can enforce.\u003c/p>\u003c/aside>\n    \u003caside class=\"callout tip\">\u003cp>\u003cstrong>Remember:\u003c/strong> a fleet is stations, handoffs, and gates. Each agent is\n      narrow, and the files between them are what make the whole thing reviewable.\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"harness\">\n    \u003ch2>The model and the harness\u003c/h2>\n    \u003cp>People say \"the agent did something dumb\" and blame the model. Usually the problem is somewhere else. A\n      useful way to think about it:\u003c/p>\n    \u003cp style=\"text-align:center;font-size:1.2em\">\u003cstrong>agent = model + harness\u003c/strong>\u003c/p>\n    \u003cp>The \u003cstrong>harness\u003c/strong> is everything except the model: the instructions it reads, the tools it can\n      call, the permissions on those tools, the checks that run on its work, and the loop that drives it. Claude\n      Code ships with a \u003cem>builder harness\u003c/em> (its system prompt, its built-in tools, its loop). On top of that you\n      build a \u003cem>user harness\u003c/em>: the files in your repository and your CI that shape what the agent does in your\n      codebase.\u003c/p>\n    \u003cdiv class=\"two-col\">\n      \u003cdiv>\n        \u003ch4>Builder harness (Claude Code provides)\u003c/h4>\n        \u003cul>\n          \u003cli>The agent loop and context management\u003c/li>\n          \u003cli>Built-in tools: Read, Edit, Write, Bash, Grep, Glob, Agent, ...\u003c/li>\n          \u003cli>Permission modes and the permission system\u003c/li>\n          \u003cli>Hook events, subagents, skills, headless mode\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n      \u003cdiv>\n        \u003ch4>User harness (you write)\u003c/h4>\n        \u003cul>\n          \u003cli>\u003ccode>AGENTS.md\u003c/code> and \u003ccode>CLAUDE.md\u003c/code> instructions\u003c/li>\n          \u003cli>Subagent definitions in \u003ccode>.claude/agents/\u003c/code>\u003c/li>\n          \u003cli>Skills in \u003ccode>.claude/skills/\u003c/code>\u003c/li>\n          \u003cli>Hooks and settings in \u003ccode>.claude/settings.json\u003c/code>\u003c/li>\n          \u003cli>Tests, lint rules, CI workflows, and evals\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n    \u003c/div>\n    \u003cp>This course is about the user harness. When an agent you wrote slips, the question is always the same:\n      \u003cem>which instruction, tool limit, or check would have stopped that?\u003c/em> Then you add it. That habit has a\n      name, \u003cstrong>harness engineering\u003c/strong>, and you will practise it in every module.\u003c/p>\n    \u003caside class=\"callout tip\">\u003cp>\u003cstrong>Remember:\u003c/strong> you can't change the model, but you own the harness.\n      Treat each agent mistake as a missing guide (something that steers it before it acts) or a missing sensor\n      (something that checks its work afterward).\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"fleetlab\">\n    \u003ch2>fleetlab: practice in the browser\u003c/h2>\n    \u003cp>Lesson cells run real Python in your browser. They can \u003ccode>import fleetlab\u003c/code>, a small helper library\n      written for this course. It never calls a model. It does the deterministic parts of agent work that you can\n      learn and test anywhere:\u003c/p>\n    \u003cul>\n      \u003cli>\u003ccode>fleetlab.check_agent(text)\u003c/code> parses a subagent file and lists every problem, including fields\n        Claude Code would silently ignore.\u003c/li>\n      \u003cli>\u003ccode>fleetlab.pre_tool_use(...)\u003c/code> and \u003ccode>fleetlab.stop(...)\u003c/code> build the JSON payloads that\n        Claude Code sends to hooks; \u003ccode>fleetlab.run_hook(main, payload)\u003c/code> runs your hook code against them.\u003c/li>\n      \u003cli>\u003ccode>fleetlab.parse_stream(text)\u003c/code> reads the transcript of a headless run.\u003c/li>\n    \u003c/ul>\n    \u003cp>Try it. This cell checks a subagent definition that has one mistake. Run it with the button or\n      \u003ckbd>Ctrl\u003c/kbd>/\u003ckbd>⌘\u003c/kbd>+\u003ckbd>Enter\u003c/kbd>, then fix the mistake and run it again.\u003c/p>\n    \u003cdiv class=\"runnable\" data-title=\"Check an agent file\">\n\u003ctextarea>\nimport fleetlab\n\nagent = \"\"\"---\nname: reviewer\ndescription: Reviews a diff for bugs. Use after code changes.\ntools: Read, Grep, Glob\nmaxturns: 20\n---\n\nYou review code. You never edit files.\n\"\"\"\n\nspec = fleetlab.check_agent(agent, \"reviewer.md\")\nprint(\"problems:\", spec.problems or \"none\")\nprint(\"can write files:\", spec.can_write())\n\u003c/textarea>\n    \u003c/div>\n    \u003cp>The field is spelled \u003ccode>maxTurns\u003c/code>. With \u003ccode>maxturns\u003c/code>, Claude Code would load the agent\n      happily and give it no turn limit at all. Nothing would warn you. That is exactly the kind of failure the\n      harness has to catch, because the model never will.\u003c/p>\n    \u003cp>The same library runs on your machine in the labs, where the checks use it to read your files. Everything\n      it can do is listed in the \u003ca href=\"../reference/fleetlab.html\">fleetlab reference\u003c/a>.\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"labs\">\n    \u003ch2>Labs: build it on your machine\u003c/h2>\n    \u003cp>Lessons teach and exercises drill. \u003cstrong>Labs\u003c/strong> are where you build the real thing: agent files,\n      hooks, settings, scripts, and workflows that Claude Code will actually load. Every lab follows the same cycle,\n      run from the root of this repository:\u003c/p>\n    \u003cpre data-label=\"Terminal\">\u003ccode class=\"language-bash\">pixi install                 # once\npixi run labs                # list labs and whether you've started them\npixi run start m00-lab1      # copy the starter into work/m00-lab1/\n# read labs/m00-lab1/README.md, then do the work in work/m00-lab1/\npixi run grade m00-lab1      # run the lab's checks against your work\npixi run grade-live m02-lab1 # optional: also run checks that call the real claude CLI\u003c/code>\u003c/pre>\n    \u003cp>Grading copies your workspace to \u003ccode>build/labs/&lt;lab&gt;/\u003c/code> first, so checks can run your hooks and\n      scripts without touching your files. Read the check output like a code review: each failure says what was\n      expected and why.\u003c/p>\n    \u003caside class=\"callout warn\" data-title=\"There are no lab solutions\">\u003cp>This is deliberate. The point of the course is\n      that \u003cem>you\u003c/em> write the agents. Each lab's README is the specification and its checks are the acceptance\n      test. The repository's CI runs \u003ccode>pixi run check-labs\u003c/code>, which proves every untouched starter fails\n      its checks, so a green grade can't happen by accident. If you get stuck, the lesson's exercises and hints\n      cover every skill a lab needs.\u003c/p>\u003c/aside>\n    \u003cp>Most checks are deterministic: they parse your files, feed your hooks recorded payloads, and run your\n      scripts against fixture transcripts. You don't need an API key for them. \u003cstrong>Live checks\u003c/strong> are the\n      exception: with \u003ccode>grade-live\u003c/code> they run your agent with the real \u003ccode>claude\u003c/code> CLI and look at\n      what it did. They skip themselves when the CLI isn't installed.\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"shelf\">\n    \u003ch2>Meet shelf, the codebase your agents work on\u003c/h2>\n    \u003cp>Every lab gives your agents the same small project to work on: \u003ccode>shelf\u003c/code>, a command-line tool for\n      tracking books. It lives in \u003ccode>sample/\u003c/code> and each lab copies it into your workspace.\u003c/p>\n    \u003cpre>\u003ccode class=\"language-bash\">sample/\n├── README.md\n├── shelf/\n│   ├── __main__.py      # python -m shelf\n│   ├── cli.py           # add, list, search\n│   ├── models.py        # the Book dataclass\n│   └── store.py         # load, save, search, by_year\n├── tests/               # pytest suite (all green today)\n└── issues/              # five open issues, as Markdown\u003c/code>\u003c/pre>\n    \u003cp>The tests pass, but the code is not correct. The issues describe real bugs the tests don't cover yet, a\n      reasonable feature request, a request too vague for any agent, and one issue that tries to give your agents\n      orders. You'll meet all of them again: the triager has to classify them, the builder has to fix them, and the\n      reviewer has to catch a fix that hides a bug instead of removing it.\u003c/p>\n    \u003caside class=\"callout think\">\u003cp>Open \u003ccode>sample/issues/\u003c/code> and read all five. Which would you give to an\n      agent? Which would you send back to the reporter? One of them contains instructions addressed to AI agents.\n      What should an agent do when it reads them?\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"safety\">\n    \u003ch2>Working safely with agents\u003c/h2>\n    \u003cp>Coding agents run real commands with your permissions. Four rules apply from the first lab:\u003c/p>\n    \u003col>\n      \u003cli>\u003cstrong>Work in a sandbox.\u003c/strong> Run agents in this repository's \u003ccode>work/\u003c/code> directory, a\n        throwaway branch, a git worktree, or a container. Never point a new agent at a repository you can't afford\n        to reset.\u003c/li>\n      \u003cli>\u003cstrong>Keep credentials out of reach.\u003c/strong> API keys live in your environment or your login, never in\n        a file the agent can read and never in a commit. Agents in this course never need production credentials.\u003c/li>\n      \u003cli>\u003cstrong>Treat everything the agent reads as untrusted input.\u003c/strong> Issue text, web pages, log files, and\n        dependency READMEs can contain instructions. That's called \u003cem>prompt injection\u003c/em>. The defence is not a\n        better prompt; it's a harness where the agent \u003cem>can't\u003c/em> do the dangerous thing (issue #5 asks it to push\n        to \u003ccode>main\u003c/code>, which your M04 hook will block).\u003c/li>\n      \u003cli>\u003cstrong>Least privilege by default.\u003c/strong> Give each agent the fewest tools and permissions its job\n        needs. A reviewer that can't edit files can't \"helpfully\" rewrite your code.\u003c/li>\n    \u003c/ol>\n    \u003caside class=\"callout danger\">\u003cp>Never run an agent with \u003ccode>--dangerously-skip-permissions\u003c/code> (bypass\n      mode) outside a disposable container or VM with no credentials and no network access you care about. In that\n      mode nothing asks before it acts.\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"setup\">\n    \u003ch2>Set up your machine\u003c/h2>\n    \u003col>\n      \u003cli>Install \u003ca href=\"https://pixi.sh\">Pixi\u003c/a>, clone this repository, and run \u003ccode>pixi install\u003c/code>.\u003c/li>\n      \u003cli>Run \u003ccode>pixi run serve\u003c/code> to open this site locally (the hosted copy works too).\u003c/li>\n      \u003cli>Install Claude Code by following the official\n        \u003ca href=\"https://code.claude.com/docs/en/overview\">Claude Code setup guide\u003c/a>, then run \u003ccode>claude\u003c/code>\n        once and sign in. You need it for live checks and for trying your agents interactively, not for the\n        deterministic checks.\u003c/li>\n      \u003cli>Run \u003ccode>pixi run start m00-lab1\u003c/code> and read \u003ccode>labs/m00-lab1/README.md\u003c/code>.\u003c/li>\n    \u003c/ol>\n    \u003caside class=\"callout note\">\u003cp>Headless runs in later modules use \u003ccode>--bare\u003c/code>, which skips your login and\n      reads \u003ccode>ANTHROPIC_API_KEY\u003c/code> from the environment. You'll set that up in M01. Never paste a key into a\n      lesson cell or a file in \u003ccode>work/\u003c/code>.\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"practice\">\n    \u003ch2>Practice\u003c/h2>\n    \u003cp>Two warm-ups with \u003ccode>fleetlab\u003c/code>. They introduce the two shapes you'll handle most: agent files and\n      hook payloads.\u003c/p>\n\n    \u003cdiv class=\"exercise\" data-id=\"m00-e1\" data-title=\"Fix an agent file\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>The variable \u003ccode>agent\u003c/code> holds a subagent definition with three problems: a field name typo, an\n          unknown tool, and a \u003ccode>name\u003c/code> that doesn't match its file name \u003ccode>planner.md\u003c/code>. Fix the text\n          so that \u003ccode>fleetlab.check_agent(agent, \"planner.md\").problems\u003c/code> is empty. Keep the agent read-only:\n          it must not be able to edit files or run commands.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\nagent = \"\"\"---\nname: plan-writer\ndescription: Plans a change before code is written. Use after triage.\ntools: Read, Grep, Glob, Search\nmaxturns: 25\n---\n\nYou read the code and write a plan. You never edit files.\n\"\"\"\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\nimport fleetlab\n\ndef test_no_problems():\n    problems = fleetlab.check_agent(agent, \"planner.md\").problems\n    assert problems == [], \"still wrong: \" + \"; \".join(problems)\n\ndef test_read_only():\n    assert not fleetlab.check_agent(agent, \"planner.md\").can_write(), \"the planner must not get Edit, Write or Bash\"\n\ndef test_turn_budget_kept():\n    assert fleetlab.check_agent(agent, \"planner.md\").meta.get(\"maxTurns\") == 25, \"keep the 25-turn budget, spelled maxTurns\"\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>Run \u003ccode>print(fleetlab.check_agent(agent, \"planner.md\").problems)\u003c/code>\n        and fix each message. Grep and Glob already cover searching; there is no \u003ccode>Search\u003c/code> tool.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">agent = \"\"\"---\nname: planner\ndescription: Plans a change before code is written. Use after triage.\ntools: Read, Grep, Glob\nmaxTurns: 25\n---\n\nYou read the code and write a plan. You never edit files.\n\"\"\"\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"exercise\" data-id=\"m00-e2\" data-title=\"Read a hook payload\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>When Claude Code is about to run a shell command, it can send a hook a JSON payload like the one\n          \u003ccode>fleetlab.pre_tool_use(\"Bash\", {\"command\": \"git push origin main\"})\u003c/code> builds. Write\n          \u003ccode>describe(payload)\u003c/code> that returns a one-line string \u003ccode>\"&lt;tool&gt;: &lt;command&gt;\"\u003c/code>\n          for Bash payloads (for example \u003ccode>\"Bash: git push origin main\"\u003c/code>) and just the tool name for any\n          other tool.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\nimport fleetlab\n\ndef describe(payload):\n    ...\n\nprint(describe(fleetlab.pre_tool_use(\"Bash\", {\"command\": \"git push origin main\"})))\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\nimport fleetlab\n\ndef test_bash():\n    p = fleetlab.pre_tool_use(\"Bash\", {\"command\": \"pytest -q\"})\n    assert describe(p) == \"Bash: pytest -q\", \"Bash payloads should give 'Bash: \u003ccommand>'\"\n\ndef test_other_tool():\n    p = fleetlab.pre_tool_use(\"Edit\", {\"file_path\": \"shelf/store.py\", \"old_string\": \"a\", \"new_string\": \"b\"})\n    assert describe(p) == \"Edit\", \"other tools give just the tool name\"\n\ndef test_reads_fields_not_hardcoded():\n    p = fleetlab.pre_tool_use(\"Bash\", {\"command\": \"git status\"})\n    assert describe(p) == \"Bash: git status\"\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>The tool name is \u003ccode>payload[\"tool_name\"]\u003c/code> and its\n        arguments are in \u003ccode>payload[\"tool_input\"]\u003c/code>. Print the payload to see every field.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">def describe(payload):\n    tool = payload[\"tool_name\"]\n    if tool == \"Bash\":\n        return f\"{tool}: {payload['tool_input']['command']}\"\n    return tool\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"mini-project\">\n    \u003ch2>Lab: meet shelf\u003c/h2>\n    \u003cdiv class=\"project-box\">\n      \u003cdiv class=\"widget-head\">\u003cspan class=\"w-kind\">Lab m00-lab1\u003c/span>\u003cspan class=\"w-title\">Read the codebase your agents will work on\u003c/span>\u003c/div>\n      \u003cdiv class=\"widget-body\">\n        \u003cp>Before you write agents for a codebase, you need to know it well enough to judge their work. In this lab\n          you answer questions about \u003ccode>shelf\u003c/code> in \u003ccode>answers.toml\u003c/code>. The checks verify each answer\n          against the code: run the tests, find the bugs behind the issues, and decide which issues are fit for an\n          agent.\u003c/p>\n        \u003cpre data-label=\"Terminal\">\u003ccode class=\"language-bash\">pixi run start m00-lab1\n# read labs/m00-lab1/README.md and edit work/m00-lab1/answers.toml\npixi run grade m00-lab1\u003c/code>\u003c/pre>\n        \u003cul class=\"checklist\" data-id=\"m00-lab1\">\n          \u003cli>Ran the test suite and recorded the command that runs it\u003c/li>\n          \u003cli>Found the file and function behind issues #1 and #2\u003c/li>\n          \u003cli>Identified the issue that tries to give agents instructions\u003c/li>\n          \u003cli>Decided which issues are ready for an agent, and why the others aren't\u003c/li>\n          \u003cli>\u003ccode>pixi run grade m00-lab1\u003c/code> passes\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"quiz\">\n    \u003ch2>Quiz\u003c/h2>\n    \u003cdiv class=\"quiz\" data-id=\"m00-quiz\">\n\u003cscript type=\"application/json\">\n{\"title\": \"Orientation quiz\", \"passScore\": 0.7, \"questions\": [\n  {\"type\": \"multi\", \"prompt\": \"Which are the four parts of a station in a fleet?\", \"options\": [\"A trigger\", \"An agent\", \"A handoff\", \"A gate\", \"A dashboard\"], \"answer\": [0, 1, 2, 3], \"explanation\": \"\u003cp>A station is started by a trigger, run by a narrow agent, produces a handoff file for the next station, and is guarded by a gate. Dashboards are useful but not part of a station.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"In \u003cem>agent = model + harness\u003c/em>, what is the harness?\", \"options\": [\"The model's weights\", \"Everything except the model: instructions, tools, permissions, checks, and the loop\", \"Only the system prompt\", \"The CI server\"], \"answer\": 1, \"explanation\": \"\u003cp>The harness is everything around the model. Claude Code provides the builder harness; you build the user harness in your repository and CI.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"An agent keeps editing generated files. What is the harness-engineering response?\", \"options\": [\"Wait for a better model\", \"Add a guide or sensor that stops it, such as a hook that blocks edits to generated paths\", \"Tell the agent more firmly in chat\", \"Give it more tools\"], \"answer\": 1, \"explanation\": \"\u003cp>Treat the slip as a missing guide or sensor. A hook that blocks the edit (with a message naming the generator to run) makes the mistake impossible rather than discouraged.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"Why does \u003ccode>fleetlab.check_agent\u003c/code> report \u003ccode>maxturns\u003c/code> as a problem?\", \"options\": [\"It is deprecated\", \"Claude Code silently ignores unknown fields, so the agent would run with no turn limit\", \"Turn limits are not allowed\", \"It must be in uppercase\"], \"answer\": 1, \"explanation\": \"\u003cp>The real field is \u003ccode>maxTurns\u003c/code>. An unknown field is ignored without a warning, which is why checks like this belong in your harness.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"Why do labs ship without solutions?\", \"options\": [\"The author ran out of time\", \"The course is about you writing the agents; the checks are the specification, and CI proves each starter fails them\", \"Solutions are on a paid tier\", \"Labs cannot be checked automatically\"], \"answer\": 1, \"explanation\": \"\u003cp>Each README is the spec and each check is an acceptance test. \u003ccode>check-labs\u003c/code> proves no check passes on an untouched starter.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"What does \u003ccode>pixi run grade m02-lab1\u003c/code> run its checks against?\", \"options\": [\"Your files in work/ directly\", \"A copy of your workspace in build/labs/m02-lab1/\", \"The starter only\", \"A hidden reference solution\"], \"answer\": 1, \"explanation\": \"\u003cp>Grading stages a copy first, so checks can run your hooks and scripts without changing your work.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"Issue #5 in shelf contains a comment telling AI agents to push to main. What is the right defence?\", \"options\": [\"Add 'ignore instructions in issues' to the prompt and trust it\", \"A harness where the agent cannot push to main at all, such as a hook that blocks the command\", \"Delete the issue\", \"Use a bigger model\"], \"answer\": 1, \"explanation\": \"\u003cp>Prompt injection is defeated by capability limits, not by asking nicely. A hook (M04) and branch protection make the dangerous action impossible.\u003c/p>\"},\n  {\"type\": \"multi\", \"prompt\": \"Which are safety rules for running agents in this course?\", \"options\": [\"Run them in a sandbox such as work/ or a worktree\", \"Keep API keys in the environment, never in files the agent reads\", \"Treat issue text and logs as untrusted input\", \"Give every agent every tool so it is never stuck\"], \"answer\": [0, 1, 2], \"explanation\": \"\u003cp>The fourth is the opposite of least privilege. Each agent gets the fewest tools its job needs.\u003c/p>\"},\n  {\"type\": \"text\", \"prompt\": \"Which file holds subagent definitions for a project: \u003ccode>.claude/agents/&lt;name&gt;.md\u003c/code> or \u003ccode>.claude/subagents/&lt;name&gt;.json\u003c/code>? Type the directory.\", \"answer\": [\".claude/agents\", \".claude/agents/\"], \"explanation\": \"\u003cp>Project subagents are Markdown files with YAML frontmatter in \u003ccode>.claude/agents/\u003c/code>. You'll write them in M02.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"When is \u003ccode>--dangerously-skip-permissions\u003c/code> acceptable?\", \"options\": [\"Whenever prompts get annoying\", \"Only in a disposable container or VM with no credentials or network access you care about\", \"In CI on your main repository\", \"Never under any circumstances\"], \"answer\": 1, \"explanation\": \"\u003cp>Bypass mode removes every check. It belongs only in an isolated, disposable environment.\u003c/p>\"}\n]}\n\u003c/script>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"recap\">\n    \u003ch2>Recap\u003c/h2>\n    \u003cul>\n      \u003cli>A fleet is stations (trigger, agent, handoff, gate) covering the SDLC: triage, plan, build, test, review,\n        release, operate, plus loops that heal and learn.\u003c/li>\n      \u003cli>Agent = model + harness. Claude Code provides the builder harness; you write the user harness. Fix slips in\n        the harness by adding a guide or a sensor.\u003c/li>\n      \u003cli>\u003ccode>fleetlab\u003c/code> checks agent files, builds hook payloads, runs hook code, and reads transcripts, in\n        the browser and in lab checks. It never calls a model.\u003c/li>\n      \u003cli>Labs: \u003ccode>pixi run start\u003c/code>, write, \u003ccode>pixi run grade\u003c/code>. No solutions; checks are the spec.\n        Live checks are optional.\u003c/li>\n      \u003cli>\u003ccode>shelf\u003c/code> is the codebase every lab uses; its issues include real bugs, a vague request, and a\n        prompt injection.\u003c/li>\n      \u003cli>Safety: sandbox, credentials out of reach, untrusted input, least privilege.\u003c/li>\n    \u003c/ul>\n    \u003cdiv class=\"flashcards\" data-title=\"Orientation\">\n      \u003cscript type=\"application/json\">\n      [{\"front\": \"A station in a fleet has four parts\", \"back\": \"Trigger, agent, handoff, gate.\"},\n       {\"front\": \"agent = ?\", \"back\": \"model + harness.\"},\n       {\"front\": \"Builder harness vs user harness\", \"back\": \"Builder: what Claude Code ships (loop, tools, permissions, hooks). User: what you write (AGENTS.md, agents, skills, hooks, tests, CI).\"},\n       {\"front\": \"Guide vs sensor\", \"back\": \"A guide steers the agent before it acts (instructions, tool limits). A sensor checks its work afterward (tests, hooks, review).\"},\n       {\"front\": \"Why check agent frontmatter in CI?\", \"back\": \"Claude Code silently ignores unknown fields, so a typo like \u003ccode>maxturns\u003c/code> fails quietly.\"},\n       {\"front\": \"The lab cycle\", \"back\": \"\u003ccode>pixi run start &lt;lab&gt;\u003c/code> → work in \u003ccode>work/&lt;lab&gt;/\u003c/code> → \u003ccode>pixi run grade &lt;lab&gt;\u003c/code>.\"},\n       {\"front\": \"Why no lab solutions?\", \"back\": \"You write the agents. Checks are the spec; CI proves every starter fails them.\"},\n       {\"front\": \"Defence against prompt injection\", \"back\": \"Limit what the agent can do (hooks, permissions, branch protection), not just what it's told.\"},\n       {\"front\": \"Least privilege for agents\", \"back\": \"Give each agent only the tools and permissions its job needs.\"}]\n      \u003c/script>\n    \u003c/div>\n    \u003ch3>Going further\u003c/h3>\n    \u003cul>\n      \u003cli>\u003ca href=\"https://code.claude.com/docs/en/overview\">Claude Code documentation\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"https://martinfowler.com/articles/harness-engineering.html\">Harness engineering for coding agent users\u003c/a> (Birgitta Böckeler)\u003c/li>\n      \u003cli>\u003ca href=\"../reference/fleetlab.html\">fleetlab reference\u003c/a> and \u003ca href=\"../reference/glossary.html\">glossary\u003c/a>\u003c/li>\n      \u003cli>Next: \u003ca href=\"m01-the-harness.html\">M01 The Harness\u003c/a>, where you look inside the loop Claude Code runs\u003c/li>\n    \u003c/ul>\n  \u003c/section>","exercises":["m00-e1","m00-e2"],"quizzes":["m00-quiz"],"checklists":{"m00-lab1":5}},"modules/m01-the-harness.html":{"id":"m01","kind":"module","title":"M01 · The Harness · Coding Agent Fleets Practicum","html":"\u003cheader class=\"lesson-hero\">\n    \u003cp class=\"eyebrow\">Stage 1 · One Agent · Module 01\u003c/p>\n    \u003ch1>The Harness\u003c/h1>\n    \u003cp class=\"lede\">Before you write your own agents, look at the one you already have. Claude Code is a model\n      running in a loop with tools, permissions, and settings around it. This module takes that harness apart: what\n      the loop does, which tools it has, who decides whether a tool call runs, how to run it without a terminal, and\n      how to read the transcript it leaves behind. Every agent in your fleet runs inside this same harness.\u003c/p>\n    \u003cdiv class=\"lesson-meta\">\u003cspan>⏱ ~2 hours\u003c/span>\u003cspan>Prerequisites: \u003ca href=\"m00-orientation.html\">M00 How This Practicum Works\u003c/a>\u003c/span>\u003c/div>\n    \u003cul class=\"objectives\">\n      \u003cli>Describe the gather, act, verify loop and name where it usually goes wrong\u003c/li>\n      \u003cli>List Claude Code's core built-in tools and sort them into read-only and state-changing\u003c/li>\n      \u003cli>Explain permission modes and allow, ask, and deny rules, including how \u003ccode>Bash(git diff *)\u003c/code> matches\u003c/li>\n      \u003cli>Say which settings file a rule belongs in and which file wins when they disagree\u003c/li>\n      \u003cli>Run Claude Code headlessly with \u003ccode>-p\u003c/code>, choose an output format, and know what \u003ccode>--bare\u003c/code> changes\u003c/li>\n      \u003cli>Read a \u003ccode>stream-json\u003c/code> transcript: count turns and tool calls, find failures, and spot a loop\u003c/li>\n    \u003c/ul>\n  \u003c/header>\n\n  \u003csection class=\"lesson-section\" id=\"loop\">\n    \u003ch2>The loop inside Claude Code\u003c/h2>\n    \u003cp>Under the interface, Claude Code runs the same loop every agent runs. You send a task. The model replies\n      either with text or with one or more \u003cstrong>tool calls\u003c/strong>. Claude Code runs each call (if it's allowed),\n      sends the results back, and asks the model again. This repeats until the model replies without asking for a\n      tool. Each request and response is one \u003cstrong>turn\u003c/strong>.\u003c/p>\n    \u003cp>A useful way to think about what happens across those turns is three phases that repeat:\u003c/p>\n    \u003cdiv class=\"card-grid\">\n      \u003cdiv class=\"card\">\u003ch4>Gather\u003c/h4>\u003cp>Read files, search with Grep and Glob, read the spec, look at logs and\n        \u003ccode>git diff\u003c/code>. The agent builds the context it needs to act.\u003c/p>\u003c/div>\n      \u003cdiv class=\"card\">\u003ch4>Act\u003c/h4>\u003cp>Edit and write files, run commands, call MCP tools, hand a sub-task to a\n        subagent.\u003c/p>\u003c/div>\n      \u003cdiv class=\"card\">\u003ch4>Verify\u003c/h4>\u003cp>Run the tests and linters, re-read the diff, compare the result with what\n        was asked. Then go around again or stop.\u003c/p>\u003c/div>\n    \u003c/div>\n    \u003cpre class=\"mermaid\">\nflowchart LR\n  Task --> G[Gather] --> A[Act] --> V[Verify]\n  V -->|not done| G\n  V -->|done, out of turns, or blocked| Stop\n    \u003c/pre>\n    \u003cp>Most agent failures are this loop going wrong in a recognisable way. The agent \u003cem>stops too early\u003c/em>,\n      claiming success without running the tests. It \u003cem>loops\u003c/em>, making the same failing edit again and again.\n      It \u003cem>drifts\u003c/em>, editing files nobody asked about. It \u003cem>starves\u003c/em>, acting before it has read the code\n      it's changing. You'll learn to spot each of these in transcripts at the end of this module, and to block them\n      with hooks in M04.\u003c/p>\n    \u003caside class=\"callout tip\">\u003cp>\u003cstrong>Remember:\u003c/strong> the model decides what to do next; the harness decides\n      whether it's allowed, runs it, and decides when the loop must end.\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"tools\">\n    \u003ch2>Built-in tools\u003c/h2>\n    \u003cp>A tool is a function the model can ask the harness to run. Claude Code ships with a set of built-in tools.\n      These are the ones every agent definition in this course refers to by name:\u003c/p>\n    \u003cdiv class=\"scroll\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>Tool\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Changes state?\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>\u003ccode>Read\u003c/code>\u003c/td>\u003ctd>Read a file (or part of one)\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>Grep\u003c/code>\u003c/td>\u003ctd>Search file contents with a regular expression\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>Glob\u003c/code>\u003c/td>\u003ctd>Find files by name pattern\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>Edit\u003c/code>\u003c/td>\u003ctd>Replace an exact string in a file\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>Write\u003c/code>\u003c/td>\u003ctd>Create or overwrite a file\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>Bash\u003c/code>\u003c/td>\u003ctd>Run a shell command\u003c/td>\u003ctd>Yes: anything a shell can do\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>Agent\u003c/code>\u003c/td>\u003ctd>Start a subagent with its own context and tools\u003c/td>\u003ctd>Whatever the subagent can do\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>WebFetch\u003c/code>, \u003ccode>WebSearch\u003c/code>\u003c/td>\u003ctd>Read a URL, search the web\u003c/td>\u003ctd>No, but they bring in untrusted text\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>TodoWrite\u003c/code>\u003c/td>\u003ctd>Keep a task list during a session\u003c/td>\u003ctd>Only the session's list\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n    \u003cp>Two things in that table matter more than they look. First, \u003ccode>Bash\u003c/code> is effectively every tool: an\n      agent with \u003ccode>Bash\u003c/code> can edit files with \u003ccode>sed\u003c/code>, delete them, or push to a remote. An agent\n      you mean to be read-only must not have it, or must have it limited by permission rules. Second, tools from MCP\n      servers appear alongside these with names like \u003ccode>mcp__github__get_issue\u003c/code> (server\n      \u003ccode>github\u003c/code>, tool \u003ccode>get_issue\u003c/code>). They follow the same permission system.\u003c/p>\n    \u003caside class=\"callout think\">\u003cp>A \"reviewer\" agent has \u003ccode>Read\u003c/code>, \u003ccode>Grep\u003c/code>, \u003ccode>Glob\u003c/code>,\n      and \u003ccode>Bash\u003c/code> so it can run \u003ccode>git diff\u003c/code>. Can it change your code? What would you add to make\n      sure it can't?\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"permissions\">\n    \u003ch2>Who decides: permission modes and rules\u003c/h2>\n    \u003cp>Every tool call passes through the permission system before it runs. Two things decide the outcome: the\n      session's \u003cstrong>permission mode\u003c/strong> and your \u003cstrong>permission rules\u003c/strong>.\u003c/p>\n    \u003ch3>Permission modes\u003c/h3>\n    \u003cdiv class=\"scroll\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>Mode\u003c/th>\u003cth>Behaviour\u003c/th>\u003cth>Use it for\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>\u003ccode>default\u003c/code> (also called manual)\u003c/td>\u003ctd>Asks before anything that isn't pre-approved; reads in your working directory don't need approval\u003c/td>\u003ctd>Interactive work\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>acceptEdits\u003c/code>\u003c/td>\u003ctd>File edits and common filesystem commands run without asking; other shell commands still need a rule\u003c/td>\u003ctd>Builders you're watching\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>plan\u003c/code>\u003c/td>\u003ctd>Read-only: the agent explores and proposes, but doesn't change anything\u003c/td>\u003ctd>Planning, risky changes\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>auto\u003c/code>\u003c/td>\u003ctd>A classifier reviews each action instead of asking you\u003c/td>\u003ctd>Long unattended runs with oversight\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>dontAsk\u003c/code>\u003c/td>\u003ctd>Anything that would prompt is denied; only pre-approved actions run\u003c/td>\u003ctd>Locked-down CI\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>bypassPermissions\u003c/code>\u003c/td>\u003ctd>Nothing asks. Everything runs\u003c/td>\u003ctd>Only disposable sandboxes\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n    \u003ch3>Permission rules\u003c/h3>\n    \u003cp>Rules live in a settings file under \u003ccode>permissions\u003c/code>, in three lists: \u003ccode>allow\u003c/code> (run without\n      asking), \u003ccode>ask\u003c/code> (always ask), and \u003ccode>deny\u003c/code> (never run). A rule names a tool, optionally with\n      a pattern in parentheses:\u003c/p>\n    \u003cpre>\u003ccode class=\"language-json\">{\n  \"permissions\": {\n    \"allow\": [\"Read\", \"Bash(python -m pytest *)\", \"Bash(git diff *)\"],\n    \"deny\":  [\"Bash(git push *)\", \"Read(.env)\", \"Edit(.github/workflows/**)\"]\n  }\n}\u003c/code>\u003c/pre>\n    \u003cp>For \u003ccode>Bash\u003c/code>, a trailing \u003ccode>&nbsp;*\u003c/code> (a space, then a star) means \"any command that starts\n      with this\". The space matters: \u003ccode>Bash(git diff *)\u003c/code> matches \u003ccode>git diff main\u003c/code> but not\n      \u003ccode>git diff-index\u003c/code>, while \u003ccode>Bash(git diff*)\u003c/code> matches both. Deny rules win over allow rules,\n      and the same rule syntax is used for the \u003ccode>--allowedTools\u003c/code> flag in headless runs.\u003c/p>\n    \u003cp>Try the matching logic yourself. This is a simplified model of Bash rules (real rules also understand\n      compound commands like \u003ccode>a &amp;&amp; b\u003c/code>), but it shows the precedence:\u003c/p>\n    \u003cdiv class=\"runnable\" data-title=\"Simplified Bash rule matching\">\n\u003ctextarea>\ndef rule_matches(rule, command):\n    inner = rule[len(\"Bash(\"):-1]\n    if inner.endswith(\" *\"):\n        prefix = inner[:-2]\n        return command == prefix or command.startswith(prefix + \" \")\n    return command == inner\n\ndef decide(command, allow, deny):\n    if any(rule_matches(r, command) for r in deny):\n        return \"deny\"\n    if any(rule_matches(r, command) for r in allow):\n        return \"allow\"\n    return \"ask\"\n\nallow = [\"Bash(git diff *)\", \"Bash(python -m pytest *)\"]\ndeny = [\"Bash(git push *)\"]\nfor cmd in [\"git diff main\", \"git diff-index HEAD\", \"git push origin main\", \"python -m pytest -q\", \"rm -rf build\"]:\n    print(f\"{cmd:24} -> {decide(cmd, allow, deny)}\")\n\u003c/textarea>\n    \u003c/div>\n    \u003caside class=\"callout warn\">\u003cp>Rules are a \u003cem>guide\u003c/em>, not a sandbox. A determined or confused agent with a\n      broad \u003ccode>Bash\u003c/code> allowance can reach the same effect another way (\u003ccode>python -c\u003c/code> instead of\n      \u003ccode>rm\u003c/code>). For things that must never happen, add a hook (M04) and an outside control such as branch\n      protection.\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"settings\">\n    \u003ch2>Settings files and which one wins\u003c/h2>\n    \u003cp>Permission rules, hooks, environment variables, and many other options live in JSON settings files. Claude\n      Code reads several and merges them:\u003c/p>\n    \u003cdiv class=\"scroll\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>File\u003c/th>\u003cth>Scope\u003c/th>\u003cth>Commit it?\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>\u003ccode>~/.claude/settings.json\u003c/code>\u003c/td>\u003ctd>You, in every project\u003c/td>\u003ctd>No (it's in your home directory)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>.claude/settings.json\u003c/code>\u003c/td>\u003ctd>Everyone working in this project\u003c/td>\u003ctd>Yes: this is where a fleet's shared rules and hooks go\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>.claude/settings.local.json\u003c/code>\u003c/td>\u003ctd>You, in this project\u003c/td>\u003ctd>No: gitignore it\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>--settings &lt;file-or-json&gt;\u003c/code>\u003c/td>\u003ctd>One run\u003c/td>\u003ctd>It's a flag, so whatever script passes it\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Managed settings\u003c/td>\u003ctd>An organization's administrators\u003c/td>\u003ctd>Deployed by IT, not by you\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n    \u003cp>When files disagree on a single value, the more specific one wins: managed settings over everything, then\n      command-line settings, then local, then project, then user. Lists such as hooks are combined across files\n      rather than replaced. For a fleet, the rule of thumb is simple: anything every agent must obey goes in the\n      committed \u003ccode>.claude/settings.json\u003c/code>, so it travels with the repository into every worktree and CI\n      job.\u003c/p>\n    \u003caside class=\"callout note\">\u003cp>At work you may see settings you didn't write and can't override. That's managed\n      settings doing its job. Design your harness so that its real enforcement (tests, hooks, CI) still works when\n      an administrator has locked other options down.\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"headless\">\n    \u003ch2>Running without a terminal: headless mode\u003c/h2>\n    \u003cp>A fleet runs agents from scripts and CI, not from a chat window. \u003ccode>claude -p \"&lt;prompt&gt;\"\u003c/code> (or\n      \u003ccode>--print\u003c/code>) runs one task non-interactively and exits: 0 on success, non-zero when the run fails.\n      These are the options you'll combine with it most:\u003c/p>\n    \u003cdiv class=\"scroll\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>Option\u003c/th>\u003cth>What it does\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>\u003ccode>--output-format text|json|stream-json\u003c/code>\u003c/td>\u003ctd>\u003ccode>json\u003c/code> prints one object with the result, session id, cost, and usage; \u003ccode>stream-json\u003c/code> prints one JSON event per line as the run happens (add \u003ccode>--verbose\u003c/code>)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>--allowedTools \"Read,Grep,Bash(git diff *)\"\u003c/code>\u003c/td>\u003ctd>Pre-approve tools using permission-rule syntax\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>--permission-mode dontAsk|acceptEdits|plan|...\u003c/code>\u003c/td>\u003ctd>Set the baseline mode for the run\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>--max-turns N\u003c/code>\u003c/td>\u003ctd>Stop after N agentic turns\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>--append-system-prompt \"...\"\u003c/code>\u003c/td>\u003ctd>Add instructions while keeping Claude Code's defaults\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>--json-schema '{...}'\u003c/code>\u003c/td>\u003ctd>With \u003ccode>json\u003c/code> output, return schema-valid data in \u003ccode>structured_output\u003c/code>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>--bare\u003c/code>\u003c/td>\u003ctd>Skip auto-discovery: no hooks, skills, subagents, plugins, MCP servers, or CLAUDE.md unless you pass them with flags\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>--resume &lt;session-id&gt;\u003c/code>, \u003ccode>--continue\u003c/code>\u003c/td>\u003ctd>Continue an earlier conversation\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n    \u003cp>In a headless run nobody can answer a permission prompt, so a call that would need approval is denied unless\n      a rule, a mode, or a hook allows it. That's a feature: a CI job should only be able to do what you listed.\u003c/p>\n    \u003cp>\u003ccode>--bare\u003c/code> deserves a closer look. Without it, \u003ccode>claude -p\u003c/code> loads everything an interactive\n      session would, including the hooks in the repository's \u003ccode>.claude/settings.json\u003c/code> and the servers in\n      its \u003ccode>.mcp.json\u003c/code>, without the trust prompt an interactive session shows. In CI that means a pull\n      request could change what runs. With \u003ccode>--bare\u003c/code>, only what you pass on the command line applies, so\n      every run is the same everywhere. It also skips your subscription login and reads\n      \u003ccode>ANTHROPIC_API_KEY\u003c/code> from the environment.\u003c/p>\n    \u003cpre data-label=\"Terminal\">\u003ccode class=\"language-bash\"># a read-only review that returns JSON, with a hard turn limit\nclaude --bare -p \"Review the diff in change.patch for bugs. Report file:line for each.\" \\\n  --allowedTools \"Read,Grep,Glob\" \\\n  --max-turns 10 \\\n  --output-format json | jq -r '.result'\u003c/code>\u003c/pre>\n    \u003caside class=\"callout tip\">\u003cp>\u003cstrong>Remember:\u003c/strong> in scripts and CI use \u003ccode>-p\u003c/code>, list tools\n      explicitly, cap turns, and prefer \u003ccode>--bare\u003c/code> with everything passed as flags. You'll build exactly\n      this in Stage 2.\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"transcripts\">\n    \u003ch2>Reading a run\u003c/h2>\n    \u003cp>With \u003ccode>--output-format stream-json --verbose\u003c/code>, every event in the run is printed as one JSON object\n      per line. Reading these transcripts is how you debug agents: you see exactly what the model was given, what\n      it asked for, and what came back. The events that matter most:\u003c/p>\n    \u003cul>\n      \u003cli>\u003ccode>{\"type\": \"system\", \"subtype\": \"init\", ...}\u003c/code>: the session id, the model, and the tools available.\u003c/li>\n      \u003cli>\u003ccode>{\"type\": \"assistant\", \"message\": {\"content\": [...]}}\u003c/code>: the model's text and its\n        \u003ccode>tool_use\u003c/code> blocks, each with an \u003ccode>id\u003c/code>, a \u003ccode>name\u003c/code>, and an \u003ccode>input\u003c/code>.\u003c/li>\n      \u003cli>\u003ccode>{\"type\": \"user\", \"message\": {\"content\": [...]}}\u003c/code>: the \u003ccode>tool_result\u003c/code> blocks sent back,\n        each pointing at a call by \u003ccode>tool_use_id\u003c/code>, with \u003ccode>is_error\u003c/code> set when the tool failed.\u003c/li>\n      \u003cli>\u003ccode>{\"type\": \"result\", ...}\u003c/code>: the last line, with \u003ccode>subtype\u003c/code> (\u003ccode>\"success\"\u003c/code> or an\n        error kind), \u003ccode>is_error\u003c/code>, \u003ccode>num_turns\u003c/code>, \u003ccode>total_cost_usd\u003c/code>, and the final\n        \u003ccode>result\u003c/code> text.\u003c/li>\n    \u003c/ul>\n    \u003cp>Messages from subagents carry the id of the tool call that started them in\n      \u003ccode>parent_tool_use_id\u003c/code>; messages from the main conversation carry \u003ccode>null\u003c/code>. The cell below\n      parses a short, abridged transcript of an agent fixing shelf issue #1. Read the output before reading on.\u003c/p>\n    \u003cdiv class=\"runnable\" data-title=\"Parse a transcript\">\n\u003ctextarea>\nimport json, fleetlab\n\nevents = [\n    {\"type\": \"system\", \"subtype\": \"init\", \"session_id\": \"a1\", \"model\": \"claude-sonnet-5-5\", \"tools\": [\"Read\", \"Edit\", \"Bash\", \"Grep\"]},\n    {\"type\": \"assistant\", \"parent_tool_use_id\": None, \"message\": {\"content\": [\n        {\"type\": \"tool_use\", \"id\": \"t1\", \"name\": \"Grep\", \"input\": {\"pattern\": \"def search\"}}]}},\n    {\"type\": \"user\", \"parent_tool_use_id\": None, \"message\": {\"content\": [\n        {\"type\": \"tool_result\", \"tool_use_id\": \"t1\", \"content\": \"shelf/store.py:31:def search(books, term):\"}]}},\n    {\"type\": \"assistant\", \"parent_tool_use_id\": None, \"message\": {\"content\": [\n        {\"type\": \"tool_use\", \"id\": \"t2\", \"name\": \"Edit\", \"input\": {\"file_path\": \"shelf/store.py\"}}]}},\n    {\"type\": \"user\", \"parent_tool_use_id\": None, \"message\": {\"content\": [\n        {\"type\": \"tool_result\", \"tool_use_id\": \"t2\", \"content\": \"ok\"}]}},\n    {\"type\": \"assistant\", \"parent_tool_use_id\": None, \"message\": {\"content\": [\n        {\"type\": \"text\", \"text\": \"Search now ignores case.\"}]}},\n    {\"type\": \"result\", \"subtype\": \"success\", \"is_error\": False, \"num_turns\": 3, \"total_cost_usd\": 0.021, \"result\": \"Search now ignores case.\"},\n]\nrun = fleetlab.parse_stream(\"\\n\".join(json.dumps(e) for e in events))\nprint(\"model:\", run.model, \"| turns:\", run.num_turns, \"| cost: $%.3f\" % run.cost_usd)\nprint(\"calls:\", run.calls_by_tool())\nprint(\"final:\", run.texts[-1])\n\u003c/textarea>\n    \u003c/div>\n    \u003cp>It succeeded, cheaply. And it's wrong in a way the result line will never tell you: there is no\n      \u003ccode>Bash\u003c/code> call, so the agent never ran the tests. It edited the file and declared victory. That's the\n      \u003cem>premature done\u003c/em> failure from the start of this module, and you found it by reading the transcript, not\n      the summary.\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"failure-signatures\">\n    \u003ch2>Failure signatures in transcripts\u003c/h2>\n    \u003cp>Each loop failure leaves a recognisable trace. Learn to look for these:\u003c/p>\n    \u003cdiv class=\"scroll\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>Failure\u003c/th>\u003cth>What it looks like in the transcript\u003c/th>\u003cth>Harness fix (later modules)\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>Premature done\u003c/td>\u003ctd>Edits, then a final message, with no test command after the last edit\u003c/td>\u003ctd>A Stop hook that runs the tests (M04)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Doom loop\u003c/td>\u003ctd>The same tool with the same input several times in a row, each result an error\u003c/td>\u003ctd>Turn limits, error-signature checks, escalation (M04, Stage 2)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Drift\u003c/td>\u003ctd>Edits to files the task never mentioned\u003c/td>\u003ctd>A spec with \"files in scope\", a reviewer that checks it (M02)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Context starvation\u003c/td>\u003ctd>Edits before any Read or Grep of the file being changed\u003c/td>\u003ctd>Better instructions and a map in AGENTS.md (M03)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Shallow fix\u003c/td>\u003ctd>A test file edited to remove or loosen an assertion\u003c/td>\u003ctd>A hook that keeps the builder out of \u003ccode>tests/\u003c/code> (M04)\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n    \u003cp>The exercises below turn three of these into code. In the lab you write a command-line summariser you can\n      point at any real transcript.\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"practice\">\n    \u003ch2>Practice\u003c/h2>\n    \u003cp>Five exercises on transcripts, permission rules, and headless commands. Tests build their own transcripts\n      with \u003ccode>make_run\u003c/code>, a helper defined in the test co
