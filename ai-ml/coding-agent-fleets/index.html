rary used in lesson cells and lab checks. It has no\n      dependencies and never calls a model. In the browser it loads automatically when a cell imports it; locally it is\n      installed in the Pixi environment.\u003c/p>\n  \u003c/header>\n\n  \u003csection class=\"lesson-section\" id=\"frontmatter\">\n    \u003ch2>Frontmatter\u003c/h2>\n    \u003cdl>\n      \u003cdt>\u003ccode>fleetlab.parse(text) -&gt; Document\u003c/code>\u003c/dt>\n      \u003cdd>Split a Markdown file into \u003ccode>.meta\u003c/code> (a dict of frontmatter fields) and \u003ccode>.body\u003c/code>. Handles\n        \u003ccode>key: value\u003c/code>, comma-separated and \u003ccode>[a, b]\u003c/code> lists, booleans, integers, quotes, and comments.\n        Raises \u003ccode>fleetlab.FrontmatterError\u003c/code> for missing delimiters, malformed lines, or repeated keys.\u003c/dd>\n    \u003c/dl>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"agents\">\n    \u003ch2>Subagents\u003c/h2>\n    \u003cdl>\n      \u003cdt>\u003ccode>fleetlab.check_agent(text, filename=None) -&gt; AgentSpec\u003c/code>\u003c/dt>\n      \u003cdd>Parse and check a subagent definition. \u003ccode>spec.problems\u003c/code> lists every problem: missing\n        \u003ccode>name\u003c/code> or \u003ccode>description\u003c/code>, a name that doesn't match the file, unknown fields, unknown tools\n        or models, bad \u003ccode>permissionMode\u003c/code>, \u003ccode>isolation\u003c/code>, \u003ccode>effort\u003c/code>, or\n        \u003ccode>maxTurns\u003c/code>, and an empty body.\u003c/dd>\n      \u003cdt>\u003ccode>AgentSpec\u003c/code>\u003c/dt>\n      \u003cdd>\u003ccode>.meta\u003c/code>, \u003ccode>.prompt\u003c/code>, \u003ccode>.problems\u003c/code>, \u003ccode>.name\u003c/code>, \u003ccode>.tools\u003c/code> (the\n        effective allowlist after \u003ccode>disallowedTools\u003c/code>, or \u003ccode>None\u003c/code> when tools are inherited), and\n        \u003ccode>.can_write()\u003c/code> (true if it has an edit tool or Bash, or inherits tools).\u003c/dd>\n      \u003cdt>\u003ccode>fleetlab.load_agent(path)\u003c/code>\u003c/dt>\n      \u003cdd>Read and check a file from disk.\u003c/dd>\n      \u003cdt>\u003ccode>KNOWN_FIELDS\u003c/code>, \u003ccode>KNOWN_TOOLS\u003c/code>, \u003ccode>READ_ONLY_TOOLS\u003c/code>, \u003ccode>WRITE_TOOLS\u003c/code>\u003c/dt>\n      \u003cdd>The sets used by the checks.\u003c/dd>\n    \u003c/dl>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"skills\">\n    \u003ch2>Skills\u003c/h2>\n    \u003cdl>\n      \u003cdt>\u003ccode>fleetlab.check_skill(text, directory_name) -&gt; list[str]\u003c/code>\u003c/dt>\n      \u003cdd>Check a \u003ccode>SKILL.md\u003c/code>: name present, valid (lowercase, digits, single hyphens, at most 64 characters),\n        and equal to its folder; description present and at most 1,024 characters; only Agent Skills fields; a non-empty\n        body under 500 lines.\u003c/dd>\n    \u003c/dl>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"hooks\">\n    \u003ch2>Hooks\u003c/h2>\n    \u003cdl>\n      \u003cdt>\u003ccode>fleetlab.pre_tool_use(tool_name, tool_input=None, *, cwd=..., permission_mode=\"default\", session_id=...)\u003c/code>\u003c/dt>\n      \u003cdd>The payload Claude Code sends to a PreToolUse hook, as a dict.\u003c/dd>\n      \u003cdt>\u003ccode>fleetlab.stop(*, active=False, last_message=\"Done.\", cwd=..., session_id=...)\u003c/code>\u003c/dt>\n      \u003cdd>The payload for a Stop hook; \u003ccode>active\u003c/code> sets \u003ccode>stop_hook_active\u003c/code>.\u003c/dd>\n      \u003cdt>\u003ccode>fleetlab.run_hook(main, payload) -&gt; HookResult\u003c/code>\u003c/dt>\n      \u003cdd>Run a hook's \u003ccode>main()\u003c/code> in-process with the payload on stdin; captures stdout, stderr, and the exit\n        code from \u003ccode>sys.exit\u003c/code>. An uncaught exception becomes exit 1, as in a real hook.\u003c/dd>\n      \u003cdt>\u003ccode>fleetlab.run_script(path, payload, *, cwd=None, env=None, timeout=60) -&gt; HookResult\u003c/code>\u003c/dt>\n      \u003cdd>Run a hook file as a subprocess (\u003ccode>.py\u003c/code> with Python, \u003ccode>.sh\u003c/code> with bash). A hang returns\n        exit 124.\u003c/dd>\n      \u003cdt>\u003ccode>HookResult\u003c/code>\u003c/dt>\n      \u003cdd>\u003ccode>.exit_code\u003c/code>, \u003ccode>.stdout\u003c/code>, \u003ccode>.stderr\u003c/code>, \u003ccode>.json\u003c/code> (stdout as one JSON\n        object or \u003ccode>None\u003c/code>), \u003ccode>.decision\u003c/code> (\u003ccode>\"block\"\u003c/code>, \u003ccode>\"deny\"\u003c/code>,\n        \u003ccode>\"allow\"\u003c/code>, \u003ccode>\"ask\"\u003c/code>, or \u003ccode>None\u003c/code>), \u003ccode>.blocked\u003c/code>, and \u003ccode>.reason\u003c/code>.\u003c/dd>\n    \u003c/dl>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"settings\">\n    \u003ch2>Settings\u003c/h2>\n    \u003cdl>\n      \u003cdt>\u003ccode>fleetlab.matcher_matches(matcher, tool_name) -&gt; bool\u003c/code>\u003c/dt>\n      \u003cdd>Claude Code's matcher rules: empty or \u003ccode>*\u003c/code> matches all; plain names and \u003ccode>|\u003c/code>/comma lists\n        match exactly; anything else is an unanchored regular expression.\u003c/dd>\n      \u003cdt>\u003ccode>fleetlab.hook_commands(settings, event, tool_name=None) -&gt; list[str]\u003c/code>\u003c/dt>\n      \u003cdd>The command hooks that would run for an event (and tool).\u003c/dd>\n    \u003c/dl>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"transcripts\">\n    \u003ch2>Transcripts\u003c/h2>\n    \u003cdl>\n      \u003cdt>\u003ccode>fleetlab.parse_stream(text) -&gt; Run\u003c/code>\u003c/dt>\n      \u003cdd>Parse \u003ccode>claude -p --output-format stream-json --verbose\u003c/code> output. Skips lines that aren't JSON\n        objects.\u003c/dd>\n      \u003cdt>\u003ccode>Run\u003c/code>\u003c/dt>\n      \u003cdd>\u003ccode>.session_id\u003c/code>, \u003ccode>.model\u003c/code>, \u003ccode>.tools\u003c/code>, \u003ccode>.calls\u003c/code> (list of\n        \u003ccode>ToolCall\u003c/code>), \u003ccode>.texts\u003c/code> (main-conversation text), \u003ccode>.result\u003c/code> (the final event),\n        \u003ccode>.finished\u003c/code>, \u003ccode>.succeeded\u003c/code>, \u003ccode>.num_turns\u003c/code>, \u003ccode>.cost_usd\u003c/code>, and\n        \u003ccode>.calls_by_tool()\u003c/code>.\u003c/dd>\n      \u003cdt>\u003ccode>ToolCall\u003c/code>\u003c/dt>\n      \u003cdd>\u003ccode>.id\u003c/code>, \u003ccode>.name\u003c/code>, \u003ccode>.input\u003c/code>, \u003ccode>.parent\u003c/code> (the\n        \u003ccode>parent_tool_use_id\u003c/code>, \u003ccode>None\u003c/code> for the main conversation), \u003ccode>.result\u003c/code>, and\n        \u003ccode>.is_error\u003c/code>.\u003c/dd>\n    \u003c/dl>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"context\">\n    \u003ch2>Context\u003c/h2>\n    \u003cdl>\n      \u003cdt>\u003ccode>fleetlab.estimate_tokens(text) -&gt; int\u003c/code>\u003c/dt>\n      \u003cdd>About four characters per token. For budgeting, never for billing.\u003c/dd>\n    \u003c/dl>\n  \u003c/section>","exercises":[],"quizzes":[],"checklists":{}},"reference/cheatsheet.html":{"id":"ref-cheatsheet","kind":"reference","title":"Agent and Hook Cheat Sheet · Coding Agent Fleets Practicum","html":"\u003cheader class=\"lesson-hero\">\n    \u003cp class=\"eyebrow\">Reference · One page\u003c/p>\n    \u003ch1>Agent and Hook Cheat Sheet\u003c/h1>\n    \u003cp class=\"lede\">The facts you reach for while writing agents and hooks. Check the\n      \u003ca href=\"https://code.claude.com/docs/en/overview\">Claude Code documentation\u003c/a> against your installed version\n      before relying on a field.\u003c/p>\n  \u003c/header>\n\n  \u003csection class=\"lesson-section\" id=\"subagent\">\n    \u003ch2>Subagent file\u003c/h2>\n    \u003cpre>\u003ccode class=\"language-markdown\">---\nname: reviewer                      # required; matches the file name\ndescription: What it does. Use when…  # required; drives delegation\ntools: Read, Grep, Glob, Bash       # omit = inherit everything\ndisallowedTools: Edit, Write        # removed from the list\nmodel: sonnet                       # sonnet | opus | haiku | fable | full id | inherit\nmaxTurns: 25                        # always set a budget\nisolation: worktree                 # for agents that edit\npermissionMode: plan                # default | acceptEdits | plan | auto | dontAsk | bypassPermissions\n---\nRole and boundary. Inputs. Process. Output format. Stop conditions.\u003c/code>\u003c/pre>\n    \u003cp>Locations: \u003ccode>.claude/agents/\u003c/code> (project), \u003ccode>~/.claude/agents/\u003c/code> (user). Priority: managed &gt;\n      \u003ccode>--agents\u003c/code> &gt; project &gt; user &gt; plugin. Other fields: \u003ccode>effort\u003c/code>, \u003ccode>skills\u003c/code>,\n      \u003ccode>mcpServers\u003c/code>, \u003ccode>hooks\u003c/code>, \u003ccode>memory\u003c/code>, \u003ccode>background\u003c/code>,\n      \u003ccode>omitClaudeMd\u003c/code>, \u003ccode>autoCompactWindow\u003c/code>, \u003ccode>initialPrompt\u003c/code>, \u003ccode>color\u003c/code>.\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"hooks\">\n    \u003ch2>Hooks\u003c/h2>\n    \u003cdiv class=\"scroll\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>Exit code\u003c/th>\u003cth>Effect\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>0\u003c/td>\u003ctd>Continue; stdout read as a decision only if it's exactly one JSON object\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>2\u003c/td>\u003ctd>Block (on blocking events); stderr is the reason Claude sees\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>other\u003c/td>\u003ctd>Non-blocking error; the action goes ahead. \u003cstrong>exit 1 does not block\u003c/strong>\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n    \u003cpre>\u003ccode class=\"language-json\">// PreToolUse decision (exit 0)\n{\"hookSpecificOutput\": {\"hookEventName\": \"PreToolUse\", \"permissionDecision\": \"deny\", \"permissionDecisionReason\": \"…\"}}\n// Stop decision (exit 0)\n{\"decision\": \"block\", \"reason\": \"…\"}\u003c/code>\u003c/pre>\n    \u003cul>\n      \u003cli>Payload (stdin): \u003ccode>session_id\u003c/code>, \u003ccode>transcript_path\u003c/code>, \u003ccode>cwd\u003c/code>,\n        \u003ccode>permission_mode\u003c/code>, \u003ccode>hook_event_name\u003c/code>; PreToolUse adds \u003ccode>tool_name\u003c/code>,\n        \u003ccode>tool_input\u003c/code>, \u003ccode>tool_use_id\u003c/code>; Stop adds \u003ccode>stop_hook_active\u003c/code>,\n        \u003ccode>last_assistant_message\u003c/code>.\u003c/li>\n      \u003cli>Matchers: empty or \u003ccode>*\u003c/code> = all; \u003ccode>Edit|Write\u003c/code> = exact list; other characters = regex\n        (\u003ccode>mcp__github__.*\u003c/code>).\u003c/li>\n      \u003cli>Paths: \u003ccode>$CLAUDE_PROJECT_DIR\u003c/code>. Default command timeout: 600 seconds.\u003c/li>\n      \u003cli>Where: user, project, local, managed settings; plugins; skill and subagent frontmatter (Stop → SubagentStop).\u003c/li>\n    \u003c/ul>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"permissions\">\n    \u003ch2>Permissions\u003c/h2>\n    \u003cul>\n      \u003cli>Modes: \u003ccode>default\u003c/code>, \u003ccode>acceptEdits\u003c/code>, \u003ccode>plan\u003c/code>, \u003ccode>auto\u003c/code>,\n        \u003ccode>dontAsk\u003c/code>, \u003ccode>bypassPermissions\u003c/code>.\u003c/li>\n      \u003cli>Rules: \u003ccode>permissions.allow\u003c/code> / \u003ccode>ask\u003c/code> / \u003ccode>deny\u003c/code>; deny wins.\n        \u003ccode>Bash(git diff *)\u003c/code> = prefix followed by a space.\u003c/li>\n      \u003cli>Settings precedence for one value: managed &gt; command line &gt; local &gt; project &gt; user. Hook lists\n        combine.\u003c/li>\n    \u003c/ul>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"headless\">\n    \u003ch2>Headless\u003c/h2>\n    \u003cpre>\u003ccode class=\"language-bash\">claude --bare -p \"task\" \\\n  --allowedTools \"Read,Grep,Glob,Bash(python -m pytest *)\" \\\n  --permission-mode dontAsk --max-turns 20 \\\n  --output-format json            # or stream-json --verbose\n# --json-schema '{...}' → .structured_output   --resume &lt;id&gt; / --continue\n# --agents '{...}' (bare mode)   --settings &lt;file&gt;   --append-system-prompt \"…\"\u003c/code>\u003c/pre>\n    \u003cp>Result fields: \u003ccode>type\u003c/code>, \u003ccode>subtype\u003c/code>, \u003ccode>is_error\u003c/code>, \u003ccode>num_turns\u003c/code>,\n      \u003ccode>total_cost_usd\u003c/code>, \u003ccode>session_id\u003c/code>, \u003ccode>result\u003c/code>.\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"context\">\n    \u003ch2>Context\u003c/h2>\n    \u003cul>\n      \u003cli>CLAUDE.md: \u003ccode>~/.claude/CLAUDE.md\u003c/code>, project root, subdirectories; \u003ccode>@file\u003c/code> imports. Pattern:\n        CLAUDE.md contains \u003ccode>@AGENTS.md\u003c/code>.\u003c/li>\n      \u003cli>Skills: \u003ccode>.claude/skills/&lt;name&gt;/SKILL.md\u003c/code>, name = folder; metadata always, body when used,\n        linked files when read.\u003c/li>\n      \u003cli>Fact → AGENTS.md. Procedure → skill. Guarantee → hook (+ CI).\u003c/li>\n    \u003c/ul>\n  \u003c/section>","exercises":[],"quizzes":[],"checklists":{}},"reference/glossary.html":{"id":"ref-glossary","kind":"reference","title":"Glossary · Coding Agent Fleets Practicum","html":"\u003cheader class=\"lesson-hero\">\n    \u003cp class=\"eyebrow\">Reference · Vocabulary\u003c/p>\n    \u003ch1>Glossary\u003c/h1>\n    \u003cp class=\"lede\">Terms used in the course, with a link to where each is taught.\u003c/p>\n  \u003c/header>\n  \u003csection class=\"lesson-section\" id=\"terms\">\n    \u003ch2>Terms\u003c/h2>\n    \u003cdl>\n      \u003cdt id=\"term-agent\">Agent\u003c/dt>\n      \u003cdd>A language model running in a loop with tools, deciding step by step what to do next. \u003ca href=\"../modules/m00-orientation.html#the-fleet\">Taught in M00\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-agent-loop\">Agent loop\u003c/dt>\n      \u003cdd>Request, tool calls, results, repeat until the model stops asking for tools. In Claude Code: gather, act, verify. \u003ca href=\"../modules/m01-the-harness.html#loop\">Taught in M01\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-agents-md\">AGENTS.md\u003c/dt>\n      \u003cdd>An open, cross-tool file of instructions for coding agents. Import it from CLAUDE.md with @AGENTS.md. \u003ca href=\"../modules/m03-context-engineering.html#claude-md\">Taught in M03\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-bare-mode-bare\">Bare mode (--bare)\u003c/dt>\n      \u003cdd>A headless run that loads nothing it isn&#x27;t told about: no hooks, skills, subagents, MCP servers, or CLAUDE.md. \u003ca href=\"../modules/m01-the-harness.html#headless\">Taught in M01\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-builder-harness\">Builder harness\u003c/dt>\n      \u003cdd>The harness the agent product ships with: its system prompt, tools, loop, and permission system. \u003ca href=\"../modules/m00-orientation.html#harness\">Taught in M00\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-claude-md\">CLAUDE.md\u003c/dt>\n      \u003cdd>Project instructions Claude Code loads at startup from your home directory, the project, and subdirectories. \u003ca href=\"../modules/m03-context-engineering.html#claude-md\">Taught in M03\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-compaction\">Compaction\u003c/dt>\n      \u003cdd>Summarising earlier turns when a long run nears the context limit. Details fade. \u003ca href=\"../modules/m03-context-engineering.html#focus\">Taught in M03\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-context-window\">Context window\u003c/dt>\n      \u003cdd>Everything the model sees on a request. Fixed size, paid for on every request. \u003ca href=\"../modules/m03-context-engineering.html#what-loads\">Taught in M03\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-doom-loop\">Doom loop\u003c/dt>\n      \u003cdd>An agent repeating the same failing action. Shows as identical failing calls in a row. \u003ca href=\"../modules/m01-the-harness.html#failure-signatures\">Taught in M01\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-drift\">Drift\u003c/dt>\n      \u003cdd>An agent changing things the task didn&#x27;t ask for. \u003ca href=\"../modules/m01-the-harness.html#failure-signatures\">Taught in M01\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-exit-code-2\">Exit code 2\u003c/dt>\n      \u003cdd>The hook exit code that blocks an action on blocking events; stderr becomes the reason. \u003ca href=\"../modules/m04-hooks-and-gates.html#exit-codes\">Taught in M04\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-fleet\">Fleet\u003c/dt>\n      \u003cdd>Several narrow agents covering the SDLC as stations, passing work through files and guarded by gates. \u003ca href=\"../modules/m00-orientation.html#the-fleet\">Taught in M00\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-gate\">Gate\u003c/dt>\n      \u003cdd>A check that must pass before work moves on, enforced by code (a hook, CI) or a person. \u003ca href=\"../modules/m04-hooks-and-gates.html#why\">Taught in M04\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-guide\">Guide\u003c/dt>\n      \u003cdd>Part of the harness that steers the agent before it acts: instructions, tool limits, specs. \u003ca href=\"../modules/m00-orientation.html#harness\">Taught in M00\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-harness\">Harness\u003c/dt>\n      \u003cdd>Everything in an agent except the model: instructions, tools, permissions, checks, and the loop. \u003ca href=\"../modules/m00-orientation.html#harness\">Taught in M00\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-harness-engineering\">Harness engineering\u003c/dt>\n      \u003cdd>Treating each agent mistake as a missing guide or sensor, and adding it. \u003ca href=\"../modules/m00-orientation.html#harness\">Taught in M00\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-headless-mode\">Headless mode\u003c/dt>\n      \u003cdd>Running Claude Code non-interactively with claude -p, for scripts and CI. \u003ca href=\"../modules/m01-the-harness.html#headless\">Taught in M01\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-hook\">Hook\u003c/dt>\n      \u003cdd>A command Claude Code runs at a fixed point in the loop; some can block. \u003ca href=\"../modules/m04-hooks-and-gates.html#why\">Taught in M04\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-least-privilege\">Least privilege\u003c/dt>\n      \u003cdd>Giving each agent only the tools and permissions its job needs. \u003ca href=\"../modules/m02-writing-a-subagent.html#tools\">Taught in M02\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-matcher\">Matcher\u003c/dt>\n      \u003cdd>The filter on a hook group: exact names, a | list, or a regular expression. \u003ca href=\"../modules/m04-hooks-and-gates.html#config\">Taught in M04\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-permission-mode\">Permission mode\u003c/dt>\n      \u003cdd>The baseline for which tool calls need approval: default, acceptEdits, plan, auto, dontAsk, bypassPermissions. \u003ca href=\"../modules/m01-the-harness.html#permissions\">Taught in M01\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-permission-rule\">Permission rule\u003c/dt>\n      \u003cdd>An allow, ask, or deny entry such as Bash(git diff *). Deny wins. \u003ca href=\"../modules/m01-the-harness.html#permissions\">Taught in M01\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-premature-done\">Premature done\u003c/dt>\n      \u003cdd>An agent finishing without verifying its work, such as no test run after the last edit. \u003ca href=\"../modules/m01-the-harness.html#failure-signatures\">Taught in M01\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-progressive-disclosure\">Progressive disclosure\u003c/dt>\n      \u003cdd>Loading a skill in levels: metadata always, body when used, linked files when read. \u003ca href=\"../modules/m03-context-engineering.html#skills\">Taught in M03\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-prompt-injection\">Prompt injection\u003c/dt>\n      \u003cdd>Instructions hidden in content an agent reads, such as an issue or web page. \u003ca href=\"../modules/m00-orientation.html#safety\">Taught in M00\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-sensor\">Sensor\u003c/dt>\n      \u003cdd>Part of the harness that checks the agent&#x27;s work: tests, hooks, reviewers, CI. \u003ca href=\"../modules/m00-orientation.html#harness\">Taught in M00\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-skill\">Skill\u003c/dt>\n      \u003cdd>A folder with a SKILL.md that teaches an agent one procedure, in the open Agent Skills format. \u003ca href=\"../modules/m03-context-engineering.html#skills\">Taught in M03\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-station\">Station\u003c/dt>\n      \u003cdd>One stage of a fleet: a trigger, an agent, a handoff, and a gate. \u003ca href=\"../modules/m00-orientation.html#the-fleet\">Taught in M00\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-stop-hook-active\">stop_hook_active\u003c/dt>\n      \u003cdd>Stop payload field that is true when the agent is already continuing because a Stop hook blocked it. \u003ca href=\"../modules/m04-hooks-and-gates.html#stop-gate\">Taught in M04\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-stream-json\">stream-json\u003c/dt>\n      \u003cdd>Headless output format with one JSON event per line, ending in a result event. \u003ca href=\"../modules/m01-the-harness.html#transcripts\">Taught in M01\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-subagent\">Subagent\u003c/dt>\n      \u003cdd>A separate agent with its own context, prompt, and tools that returns a summary to its caller. \u003ca href=\"../modules/m02-writing-a-subagent.html#why\">Taught in M02\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-turn\">Turn\u003c/dt>\n      \u003cdd>One request to the model and its response. \u003ca href=\"../modules/m01-the-harness.html#loop\">Taught in M01\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-user-harness\">User harness\u003c/dt>\n      \u003cdd>The harness you write: AGENTS.md, agents, skills, hooks, tests, CI. \u003ca href=\"../modules/m00-orientation.html#harness\">Taught in M00\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-worktree\">Worktree\u003c/dt>\n      \u003cdd>A separate git checkout of the same repository; isolation: worktree runs an agent in one. \u003ca href=\"../modules/m02-writing-a-subagent.html#budgets\">Taught in M02\u003c/a>\u003c/dd>\n    \u003c/dl>\n  \u003c/section>","exercises":[],"quizzes":[],"checklists":{}}},"version":"0.1.0","siteUrl":"https://millsks.github.io/coding-agent-fleets-practicum/","repoUrl":"https://github.com/millsks/coding-agent-fleets-practicum"}</script>
<script>window.PP_DATA = JSON.parse(document.getElementById("pp-data").textContent); window.CURRICULUM = window.PP_DATA.curriculum;</script>
<script>
/* Visualizer core: registry, widget shell, SVG helpers, and a frame player. Visualizers live in viz-*.js. */
(() => {
  "use strict";
  const registry = new Map();
  const SVG_NS = "http://www.w3.org/2000/svg";

  function h(tag, attrs = {}, ...children) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "html") el.innerHTML = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const c of children.flat()) {
      if (c === null || c === undefined || c === false) continue;
      el.append(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return el;
  }

  function s(tag, attrs = {}, ...children) {
    const el = document.createElementNS(SVG_NS, tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "text") el.textContent = v;
      else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v);
    }
    for (const c of children.flat()) if (c) el.append(c);
    return el;
  }

  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const randInt = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
  const shuffle = (arr) => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const parseList = (text, numeric = true) => String(text).split(/[\s,]+/).filter(Boolean).map((x) => (numeric ? Number(x) : x)).filter((x) => !numeric || Number.isFinite(x));

  /**
   * Build the standard widget chrome.
   * Returns { root, head, stage, controls, log, legend, setLog(text), setLegend([[label, color]]) }.
   */
  function shell(el, { title = "", kind = "Visualizer" } = {}) {
    el.innerHTML = "";
    el.classList.add("widget");
    const head = h("div", { class: "widget-head" }, h("span", { class: "w-kind", text: kind }), h("span", { class: "w-title", text: title }), h("span", { class: "spacer" }));
    const stage = h("div", { class: "viz-stage" });
    const legend = h("div", { class: "viz-legend" });
    const controls = h("div", { class: "viz-controls" });
    const log = h("div", { class: "viz-log", "aria-live": "polite" });
    el.append(head, stage, legend, controls, log);
    return {
      root: el, head, stage, controls, log, legend,
      setLog(text) { log.innerHTML = text; },
      setLegend(items) { legend.innerHTML = items.map(([label, color]) => `<span><i style="background:${color}"></i>${esc(label)}</span>`).join(""); },
    };
  }

  function button(label, onClick, cls = "btn small") { return h("button", { class: cls, type: "button", text: label, onclick: onClick }); }
  function input(attrs = {}) { return h("input", { type: "text", ...attrs }); }
  function select(options, value, onChange) {
    const el = h("select", {}, options.map(([v, label]) => h("option", { value: v, text: label ?? v })));
    el.value = value;
    el.addEventListener("change", () => onChange(el.value));
    return el;
  }
  function label(text, control) { return h("label", { style: "display:inline-flex;gap:6px;align-items:center" }, text, control); }

  /**
   * Frame player. `frames` is an array of snapshots; `render(frame, index)` draws one.
   * Adds ⏮ ◀ ▶(play) ▶| controls and a speed slider into `controls`. Returns { load(frames), go(i), index(), stop() }.
   */
  function player(controls, render, { speed = 500 } = {}) {
    let frames = [];
    let i = 0;
    let timer = null;
    let delay = speed;
    const counter = h("span", { class: "status" });
    const playBtn = button("Play ▶", () => toggle(), "btn small primary");
    const update = () => {
      if (!frames.length) { counter.textContent = ""; return; }
      render(frames[i], i);
      counter.textContent = `step ${i + 1}/${frames.length}`;
    };
    const go = (n) => { i = Math.max(0, Math.min(frames.length - 1, n)); update(); };
    const stop = () => { if (timer) { clearInterval(timer); timer = null; } playBtn.textContent = "Play ▶"; };
    const toggle = () => {
      if (timer) { stop(); return; }
      if (i >= frames.length - 1) i = 0;
      playBtn.textContent = "Pause ❚❚";
      timer = setInterval(() => { if (i >= frames.length - 1) stop(); else go(i + 1); }, delay);
    };
    const speedEl = h("input", { type: "range", min: 1, max: 10, value: 6, "aria-label": "Speed", title: "Speed" });
    speedEl.addEventListener("input", () => { delay = Math.round(1600 / Number(speedEl.value) ** 1.3); if (timer) { stop(); toggle(); } });
    delay = Math.round(1600 / 6 ** 1.3);
    controls.append(
      button("⏮", () => { stop(); go(0); }),
      button("◀", () => { stop(); go(i - 1); }),
      playBtn,
      button("▶|", () => { stop(); go(i + 1); }),
      label("speed", speedEl),
      counter,
    );
    return { load(f, start = 0) { stop(); frames = f; i = start; update(); }, go, index: () => i, stop, frames: () => frames, toggle };
  }

  /** Draw a simple node-link tree laid out by in-order position. node = { id, label, left, right, cls } or { children: [] }. */
  function layoutBinaryTree(root) {
    const pos = new Map();
    let x = 0;
    let maxDepth = 0;
    const walk = (n, d) => {
      if (!n) return;
      walk(n.left, d + 1);
      pos.set(n, { x: x++, y: d });
      maxDepth = Math.max(maxDepth, d);
      walk(n.right, d + 1);
    };
    walk(root, 0);
    return { pos, width: x, depth: maxDepth + 1 };
  }

  function layoutTree(root, childrenOf = (n) => n.children || []) {
    const pos = new Map();
    let leaf = 0;
    let maxDepth = 0;
    const walk = (n, d) => {
      const kids = childrenOf(n);
      maxDepth = Math.max(maxDepth, d);
      if (!kids.length) { pos.set(n, { x: leaf++, y: d }); return; }
      kids.forEach((k) => walk(k, d + 1));
      const xs = kids.map((k) => pos.get(k).x);
      pos.set(n, { x: (Math.min(...xs) + Math.max(...xs)) / 2, y: d });
    };
    walk(root, 0);
    return { pos, width: Math.max(leaf, 1), depth: maxDepth + 1 };
  }

  function mount(el) {
    const name = el.dataset.viz;
    const factory = registry.get(name);
    if (!factory) { el.textContent = `Unknown visualizer: ${name}`; return; }
    let config = {};
    if (el.dataset.config) {
      try { config = JSON.parse(el.dataset.config); } catch (e) { el.textContent = `Bad data-config for ${name}: ${e.message}`; return; }
    }
    factory(el, config, api);
  }

  const api = { h, s, css, esc, sleep, randInt, shuffle, parseList, shell, button, input, select, label, player, layoutBinaryTree, layoutTree };

  function registerViz(name, factory) { registry.set(name, factory); }

  window.PPViz = { registry, registerViz, mount, api };
  window.registerViz = registerViz;
})();

        { at: "code", arrow: "tool-code", say: "No results. Every turn re-sends the growing list, so each request costs more than the last.", add: [RESULT("toolu_2", "0 results")] },
        { at: "code", arrow: "model-code", say: "And again.", add: [CALL("search", { q: "Atlantis 2031 census data" }, "toolu_3")], stop: "tool_use" },

      ],
    },
  };

  const NODES = { code: { x: 130, y: 70, label: "Your code", sub: "the loop" }, model: { x: 390, y: 70, label: "Model API", sub: "messages.create" }, tool: { x: 130, y: 210, label: "Tools", sub: "your functions" } };
  const ARROWS = {
    "code-model": ["code", "model", -10], "model-code": ["model", "code", 10],
    "code-tool": ["code", "tool", -12], "tool-code": ["tool", "code", 12],
  };

  registerViz("agent-loop", (el, config, api) => {
    const { h, s } = api;
    const names = Object.keys(SCENARIOS);
    let scenario = SCENARIOS[config.scenario] ? config.scenario : "weather";
    const ui = api.shell(el, { title: SCENARIOS[scenario].title, kind: "Agent loop" });
    const wrap = h("div", { style: "display:grid;grid-template-columns:minmax(260px,1fr) minmax(240px,1fr);gap:14px;align-items:start" });
    const svg = s("svg", { viewBox: "0 0 520 280", width: "100%", role: "img", "aria-label": "Agent loop diagram", style: "max-width:520px;height:auto;font-family:var(--font-sans)" });
    const list = h("ol", { class: "viz-messages", style: "list-style:none;margin:0;padding:0;font:0.78rem/1.4 var(--font-mono);display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto" });
    wrap.append(svg, h("div", {}, h("div", { style: "font-size:0.75rem;color:var(--fg-muted);margin-bottom:6px", text: "messages (what the next request sends)" }), list));
    ui.stage.append(wrap);
    ui.setLegend([["user turn", "var(--viz-1)"], ["assistant turn", "var(--viz-2)"], ["tool_result", "var(--viz-3)"], ["error result", "var(--bad)"]]);

    const color = (b) => (b.kind === "tool_result" ? (b.error ? "var(--bad)" : "var(--viz-3)") : b.role === "user" ? "var(--viz-1)" : "var(--viz-2)");

    function frames() {
      const out = [];
      let msgs = [];
      let requests = 0;
      for (const step of SCENARIOS[scenario].steps) {
        if (step.arrow === "code-model") requests += 1;
        msgs = [...msgs, ...(step.add || [])];
        out.push({ step, msgs, requests });
      }
      return out;
    }

    function render(frame) {
      svg.replaceChildren();
      const defs = s("defs", {}, s("marker", { id: "al-arrow", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, s("path", { d: "M0 0L10 5L0 10z", fill: "var(--accent)" })));
      svg.append(defs);
      for (const [key, [from, to, off]] of Object.entries(ARROWS)) {
        const a = NODES[from];
        const b = NODES[to];
        const active = frame.step.arrow === key;
        const horizontal = a.y === b.y;
        const x1 = horizontal ? a.x + (b.x > a.x ? 70 : -70) : a.x + off;
        const x2 = horizontal ? b.x + (b.x > a.x ? -70 : 70) : b.x + off;

        s("text", { x: 390, y: 170, "text-anchor": "middle", "font-size": 12, fill: "var(--fg-muted)", text: `requests sent: ${frame.requests}` }),
        s("text", { x: 390, y: 192, "text-anchor": "middle", "font-size": 12, fill: "var(--fg-muted)", text: `blocks in history: ${frame.msgs.length}` }),

  registerViz("token-meter", (el, config, api) => {
    const { h } = api;
    const ui = api.shell(el, { title: config.title || "How big is this prompt?", kind: "Token meter" });
    const PRICES = { "claude-opus-5-5": [4, 20], "claude-sonnet-5-5": [2, 10], "claude-haiku-5-5": [0.1, 0.5] };
    const area = h("textarea", { rows: 6, style: "width:100%;font:0.85rem/1.45 var(--font-mono);padding:8px;border:1px solid var(--border);border-radius:6px;background:var(--bg-code);color:var(--fg)" });
    area.value = config.text || "You are a helpful assistant. Summarize the attached incident report in three bullet points for an on-call engineer.";
    let model = "claude-opus-5-5";
    const repeat = h("input", { type: "number", min: 1, max: 1000000, value: config.calls || 1000, style: "width:7em" });
    const pieces = h("div", { style: "font:0.8rem/1.9 var(--font-mono);margin-top:10px;word-break:break-word" });
    const out = h("div", { style: "display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px" });
    ui.stage.append(area, pieces, out);
    ui.controls.append(api.select(Object.keys(PRICES).map((m) => [m, m]), model, (v) => { model = v; update(); }), api.label("requests", repeat));
    const tile = (k, v) => h("div", { style: "background:var(--bg-sunk);border:1px solid var(--border);border-radius:6px;padding:6px 10px" }, h("div", { style: "font-size:0.72rem;color:var(--fg-muted)", text: k }), h("div", { style: "font-weight:600", text: v }));
    function chunks(text) {
      const out = [];
      for (const word of text.match(/\s*\S+/g) || []) {
        for (let i = 0; i < word.length; i += 4) out.push(word.slice(i, i + 4));
      }
      return out;
    }
    function update() {
      const parts = chunks(area.value);
      const tokens = Math.ceil(area.value.length / 4);
      const [inPrice] = PRICES[model];
      const n = Math.max(1, Number(repeat.value) || 1);
      pieces.replaceChildren(...parts.slice(0, 160).map((p, i) => h("span", { style: `background:${i % 2 ? "var(--accent-soft)" : "var(--bg-sunk)"};border-radius:3px;padding:1px 0;white-space:pre`, text: p })), parts.length > 160 ? h("span", { text: ` … +${parts.length - 160} more` }) : "");

        tile("characters", area.value.length.toLocaleString()),
        tile("≈ tokens (chars ÷ 4)", tokens.toLocaleString()),
        tile("share of a 1M window", `${((tokens / 1e6) * 100).toFixed(4)}%`),
        tile(`input cost × ${n.toLocaleString()} requests`, `$${((tokens * n * inPrice) / 1e6).toFixed(4)}`),
      );
      ui.setLog("Shaded runs approximate how a tokenizer splits text. Real tokenizers differ by model and language; use messages.count_tokens for exact counts.");
    }
    area.addEventListener("input", update);
    repeat.addEventListener("input", update);
    update();
  });
})();

ilename).name!r}\")\n    for key in sorted(set(meta) - KNOWN_FIELDS):\n        problems.append(f\"unknown field {key!r}: Claude Code would silently ignore it\")\n    for key in (\"tools\", \"disallowedTools\"):\n        value = meta.get(key)\n        for tool in value if isinstance(value, list) else []:\n            if str(tool) not in KNOWN_TOOLS and not str(tool).startswith(\"mcp__\") and \"(\" not in str(tool):\n                problems.append(f\"unknown tool {tool!r} in {key}\")\n    model = meta.get(\"model\")\n    if model is not None and str(model) not in MODELS and not str(model).startswith(\"claude-\"):\n        problems.append(f\"unknown model {model!r}: use inherit, opus, sonnet, haiku, fable, or a full model ID\")\n    mode = meta.get(\"permissionMode\")\n    if mode is not None and mode not in PERMISSION_MODES:\n        problems.append(f\"unknown permissionMode {mode!r}\")\n    if meta.get(\"isolation\") not in (None, \"worktree\"):\n        problems.append(\"isolation must be 'worktree'\")\n    effort = meta.get(\"effort\")\n    if effort is not None and effort not in EFFORTS:\n        problems.append(f\"unknown effort {effort!r}\")\n    turns = meta.get(\"maxTurns\")\n    if turns is not None and (not isinstance(turns, int) or isinstance(turns, bool) or turns < 1):\n        problems.append(\"maxTurns must be a positive whole number\")\n    if not doc.body.strip():\n        problems.append(\"the body is empty: it becomes the subagent's system prompt\")\n    return spec\n\n\ndef load_agent(path: Path) -> AgentSpec:\n    \"\"\"Read and check a subagent file from disk.\n\n    Args:\n        path: Path to ``.claude/agents/<name>.md``.\n\n    Returns:\n        The checked spec.\n    \"\"\"\n    return check_agent(path.read_text(encoding=\"utf-8\"), filename=path.name)\n",
 "fleetlab/context.py": "\"\"\"Rough context-window arithmetic.\"\"\"\n\nCHARS_PER_TOKEN = 4\n\n\ndef estimate_tokens(text: str) -> int:\n    \"\"\"Estimate tokens with the common rule of thumb of about four characters per token for English and code.\n\n    Real tokenizers differ; use this for budgeting, never for billing.\n\n    Args:\n        text: Any text.\n\n    Returns:\n        Approximate token count, at least 1 for non-empty text.\n    \"\"\"\n    return 0 if not text else max(1, round(len(text) / CHARS_PER_TOKEN))\n",
 "fleetlab/frontmatter.py": "\"\"\"Read the YAML frontmatter at the top of agent and skill Markdown files.\n\nOnly the subset of YAML these files use is supported: ``key: value`` scalars, comma-separated or ``[a, b]`` lists,\n``true``/``false``, integers, quoted strings, and ``#`` comments. Nested mappings (``hooks:``, ``mcpServers:``) are\nkept as their raw indented text so checks can see that the key exists.\n\"\"\"\n\nfrom dataclasses import dataclass, field\n\nLIST_KEYS = frozenset({\"tools\", \"disallowedTools\", \"skills\", \"allowed-tools\"})\n\n\nclass FrontmatterError(ValueError):\n    \"\"\"Raised when a file has no frontmatter or the frontmatter cannot be read.\"\"\"\n\n\n@dataclass\nclass Document:\n    \"\"\"A Markdown file split into frontmatter fields and body.\n\n    Attributes:\n        meta: Field names mapped to parsed values, in file order.\n        body: Everything after the closing ``---``.\n    \"\"\"\n\n    meta: dict[str, object] = field(default_factory=dict)\n    body: str = \"\"\n\n\ndef _value(key: str, raw: str) -> object:\n    value = raw.strip()\n    if len(value) >= 2 and value[0] == value[-1] and value[0] in \"'\\\"\":\n        return value[1:-1]\n    if value.startswith(\"[\") and value.endswith(\"]\"):\n        return [item.strip().strip(\"'\\\"\") for item in value[1:-1].split(\",\") if item.strip()]\n    if key in LIST_KEYS:\n        return [item.strip() for item in value.split(\",\") if item.strip()]\n    if value in (\"true\", \"false\"):\n        return value == \"true\"\n    if value.lstrip(\"-\").isdigit():\n        return int(value)\n    return value\n\n\ndef parse(text: str) -> Document:\n    \"\"\"Split Markdown text into frontmatter fields and body.\n\n    Args:\n        text: The whole file.\n\n    Returns:\n        The parsed document.\n\n    Raises:\n        FrontmatterError: If the frontmatter is missing, unterminated, or has a malformed or repeated key.\n    \"\"\"\n    lines = text.lstrip(\"﻿\").splitlines()\n    if not lines or lines[0].strip() != \"---\":\n        raise FrontmatterError(\"the file must start with a line containing only '---'\")\n    end = next((i for i, line in enumerate(lines[1:], start=1) if line.strip() == \"---\"), None)\n    if end is None:\n        raise FrontmatterError(\"the frontmatter has no closing '---' line\")\n\n    doc = Document()\n    current: str | None = None\n    for number, line in enumerate(lines[1:end], start=2):\n        stripped = line.strip()\n        if not stripped or stripped.startswith(\"#\"):\n            continue\n        if line[0] in \" \\t\" or stripped.startswith(\"- \"):\n            if current is None:\n                raise FrontmatterError(f\"line {number}: indented line with no key above it\")\n            previous = doc.meta[current]\n            if isinstance(previous, list) and stripped.startswith(\"- \"):\n                previous.append(stripped[2:].strip().strip(\"'\\\"\"))\n            else:\n                doc.meta[current] = f\"{previous}\\n{line}\" if previous != \"\" else line\n            continue\n        key, sep, raw = stripped.partition(\":\")\n        key = key.strip()\n        if not sep or not key or \" \" in key:\n            raise FrontmatterError(f\"line {number}: expected 'key: value', got {stripped!r}\")\n        if key in doc.meta:\n            raise FrontmatterError(f\"line {number}: the key {key!r} appears twice\")\n        doc.meta[key] = _value(key, raw) if raw.strip() else ([] if key in LIST_KEYS else \"\")\n        current = key\n    doc.body = \"\\n\".join(lines[end + 1 :]).strip(\"\\n\")\n    return doc\n",
 "fleetlab/hooks.py": "\"\"\"Build hook payloads and run hook code against them.\n\nClaude Code runs a command hook by starting your command, writing one JSON object to its stdin, and reading three\nthings back: the exit code, stdout, and stderr.\n\n* Exit 0: the action goes ahead. If stdout is exactly one JSON object, Claude Code reads it for a decision.\n* Exit 2: a blocking error. On events that can block (``PreToolUse``, ``Stop``, ...) the action is stopped and\n  stderr is shown to Claude as the reason.\n* Any other exit code: a non-blocking error. The action goes ahead and the transcript notes that the hook failed.\n  Exit 1 does **not** block.\n\n:func:`run_hook` runs a Python ``main()`` function in-process (this is what lesson exercises use in the browser).\n:func:`run_script` runs a real hook file in a subprocess (this is what lab checks use).\n\"\"\"\n\nimport contextlib\nimport io\nimport json\nimport subprocess\nimport sys\nfrom collections.abc import Callable\nfrom dataclasses import dataclass\nfrom pathlib import Path\nfrom typing import Any\n\nBLOCKING_EXIT_CODE = 2\n\n\ndef _common(event: str, cwd: str, permission_mode: str, session_id: str) -> dict[str, Any]:\n    return {\n        \"session_id\": session_id,\n        \"transcript_path\": f\"/home/dev/.claude/projects/demo/{session_id}.jsonl\",\n        \"cwd\": cwd,\n        \"permission_mode\": permission_mode,\n        \"hook_event_name\": event,\n    }\n\n\ndef pre_tool_use(\n    tool_name: str,\n    tool_input: dict[str, Any] | None = None,\n    *,\n    cwd: str = \"/home/dev/shelf\",\n    permission_mode: str = \"default\",\n    session_id: str = \"sess-0001\",\n) -> dict[str, Any]:\n    \"\"\"Build the payload Claude Code sends to a ``PreToolUse`` hook.\n\n    Args:\n        tool_name: Tool about to run, such as ``Bash`` or ``Edit``.\n        tool_input: The tool's arguments, such as ``{\"command\": \"git status\"}``.\n        cwd: Working directory of the session.\n        permission_mode: The session's permission mode.\n        session_id: Session identifier.\n\n    Returns:\n        The payload as a dictionary (serialise it with ``json.dumps`` to feed a script).\n    \"\"\"\n    payload = _common(\"PreToolUse\", cwd, permission_mode, session_id)\n    payload.update({\"tool_name\": tool_name, \"tool_input\": dict(tool_input or {}), \"tool_use_id\": \"toolu_01demo\"})\n    return payload\n\n\ndef stop(\n    *, active: bool = False, last_message: str = \"Done.\", cwd: str = \"/home/dev/shelf\", session_id: str = \"sess-0001\"\n) -> dict[str, Any]:\n    \"\"\"Build the payload Claude Code sends to a ``Stop`` hook when the agent tries to finish.\n\n    Args:\n        active: ``stop_hook_active``: true when Claude is already continuing because a Stop hook blocked it.\n        last_message: The agent's final message.\n        cwd: Working directory of the session.\n        session_id: Session identifier.\n\n    Returns:\n        The payload as a dictionary.\n    \"\"\"\n    payload = _common(\"Stop\", cwd, \"default\", session_id)\n    payload.update({\"stop_hook_active\": active, \"last_assistant_message\": last_message})\n    return payload\n\n\n@dataclass(frozen=True)\nclass HookResult:\n    \"\"\"What a hook returned.\n\n    Attributes:\n        exit_code: Process exit code.\n        stdout: Everything printed to stdout.\n        stderr: Everything printed to stderr.\n    \"\"\"\n\n    exit_code: int\n    stdout: str = \"\"\n    stderr: str = \"\"\n\n    @property\n    def json(self) -> dict[str, Any] | None:\n        \"\"\"Stdout parsed as one JSON object, or ``None`` when it is not exactly one object.\"\"\"\n        text = self.stdout.strip()\n        if not text.startswith(\"{\"):\n            return None\n        try:\n            value = json.loads(text)\n        except json.JSONDecodeError:\n            return None\n        return value if isinstance(value, dict) else None\n\n    @property\n    def decision(self) -> str | None:\n        \"\"\"The decision Claude Code would act on: ``block`` or ``deny`` to stop, ``allow`` or ``ask``, else ``None``.\"\"\"\n        if self.exit_code == BLOCKING_EXIT_CODE:\n            return \"block\"\n        data = self.json if self.exit_code == 0 else None\n        if not data:\n            return None\n        specific = data.get(\"hookSpecificOutput\")\n        if isinstance(specific, dict) and specific.get(\"permissionDecision\"):\n            return str(specific[\"permissionDecision\"])\n        if data.get(\"decision\") == \"block\":\n            return \"block\"\n        return None\n\n    @property\n    def blocked(self) -> bool:\n        \"\"\"Whether the action would be stopped.\"\"\"\n        return self.decision in (\"block\", \"deny\")\n\n    @property\n    def reason(self) -> str:\n        \"\"\"The text Claude would see as the reason, from stderr (exit 2) or the JSON output.\"\"\"\n        if self.exit_code == BLOCKING_EXIT_CODE:\n            return self.stderr.strip()\n        data = self.json or {}\n        specific = data.get(\"hookSpecificOutput\")\n        if isinstance(specific, dict) and specific.get(\"permissionDecisionReason\"):\n            return str(specific[\"permissionDecisionReason\"])\n        return str(data.get(\"reason\", \"\"))\n\n\ndef run_hook(main: Callable[[], object], payload: dict[str, Any]) -> HookResult:\n    \"\"\"Run a hook's ``main()`` in this process with ``payload`` on stdin.\n\n    ``main`` reads ``sys.stdin``, prints, and calls ``sys.exit(code)`` exactly as a real hook script does, so the same\n    function works when the file runs under Claude Code.\n\n    Args:\n        main: The hook's entry point.\n        payload: The event payload, for example from :func:`pre_tool_use`.\n\n    Returns:\n        The captured result.\n    \"\"\"\n    out, err = io.StringIO(), io.StringIO()\n    old_stdin = sys.stdin\n    sys.stdin = io.StringIO(json.dumps(payload))\n    code = 0\n    try:\n        with contextlib.redirect_stdout(out), contextlib.redirect_stderr(err):\n            try:\n                main()\n            except SystemExit as exc:\n                if exc.code is None:\n                    code = 0\n                elif isinstance(exc.code, int):\n                    code = exc.code\n                else:\n                    print(exc.code, file=sys.stderr)\n                    code = 1\n            except Exception as exc:  # a crashing hook is a non-blocking error, like a real one\n                print(f\"{type(exc).__name__}: {exc}\", file=sys.stderr)\n                code = 1\n    finally:\n        sys.stdin = old_stdin\n    return HookResult(code, out.getvalue(), err.getvalue())\n\n\ndef run_script(\n    path: Path | str,\n    payload: dict[str, Any],\n    *,\n    cwd: Path | str | None = None,\n    env: dict[str, str] | None = None,\n    timeout: float = 60,\n) -> HookResult:\n    \"\"\"Run a hook file as a subprocess, the way Claude Code does.\n\n    ``.py`` files run with this Python interpreter and ``.sh`` files with ``bash``; anything else runs directly.\n\n    Args:\n        path: The hook script.\n        payload: The event payload.\n        cwd: Working directory for the process.\n        env: Environment for the process (defaults to this process's environment).\n        timeout: Seconds before the hook is treated as hung.\n\n    Returns:\n        The captured result. A hung hook returns exit code 124.\n    \"\"\"\n    script = Path(path)\n    if script.suffix == \".py\":\n        command = [sys.executable, str(script)]\n    elif script.suffix == \".sh\":\n        command = [\"bash\", str(script)]\n    else:\n        command = [str(script)]\n    try:\n        done = subprocess.run(\n            command,\n            input=json.dumps(payload),\n            capture_output=True,\n            text=True,\n            cwd=cwd,\n            env=env,\n            timeout=timeout,\n            check=False,\n        )\n    except subprocess.TimeoutExpired:\n        return HookResult(124, \"\", f\"hook timed out after {timeout:.0f}s\")\n    return HookResult(done.returncode, done.stdout, done.stderr)\n",
 "fleetlab/settings.py": "\"\"\"Read hook wiring from Claude Code settings (``.claude/settings.json``).\"\"\"\n\nimport re\nfrom typing import Any\n\n_PLAIN_MATCHER = re.compile(r\"^[A-Za-z0-9_\\-|, ]*$\")\n\n\ndef matcher_matches(matcher: str | None, tool_name: str) -> bool:\n    \"\"\"Apply Claude Code's matcher rules to a tool name.\n\n    * Empty, ``*``, or missing: matches every tool.\n    * Only letters, digits, ``_``, ``-``, spaces, commas, and ``|``: an exact name, or a list split on ``|`` or ``,``.\n    * Anything else: an unanchored regular expression, such as ``^Notebook`` or ``mcp__memory__.*``.\n\n    Args:\n        matcher: The matcher string from settings.\n        tool_name: The tool about to run.\n\n    Returns:\n        Whether the hook group applies.\n    \"\"\"\n    if matcher in (None, \"\", \"*\"):\n        return True\n    assert matcher is not None\n    if _PLAIN_MATCHER.match(matcher):\n        names = {part.strip() for part in re.split(r\"[|,]\", matcher) if part.strip()}\n        return tool_name in names\n    return re.search(matcher, tool_name) is not None\n\n\ndef hook_commands(settings: dict[str, Any], event: str, tool_name: str | None = None) -> list[str]:\n    \"\"\"List the command hooks that would run for an event (and tool, for tool events).\n\n    Args:\n        settings: Parsed ``settings.json``.\n        event: Hook event such as ``PreToolUse`` or ``Stop``.\n        tool_name: Tool name for tool events; ``None`` ignores matchers.\n\n    Returns:\n        The ``command`` strings in the order Claude Code would find them.\n    \"\"\"\n    groups = settings.get(\"hooks\", {}).get(event, [])\n    commands: list[str] = []\n    for group in groups if isinstance(groups, list) else []:\n        if not isinstance(group, dict):\n            continue\n        if tool_name is not None and not matcher_matches(group.get(\"matcher\"), tool_name):\n            continue\n        for hook in group.get(\"hooks\", []):\n            if isinstance(hook, dict) and hook.get(\"type\", \"command\") == \"command\" and hook.get(\"command\"):\n                commands.append(str(hook[\"command\"]))\n    return commands\n",
 "fleetlab/skills.py": "\"\"\"Check skills written in the open Agent Skills format (``<skills dir>/<name>/SKILL.md``).\"\"\"\n\nimport re\n\nfrom fleetlab.frontmatter import FrontmatterError, parse\n\nSKILL_FIELDS = frozenset(\n    {\"name\", \"description\", \"license\", \"compatibility\", \"metadata\", \"allowed-tools\", \"disable-model-invocation\"}\n)\nNAME_PATTERN = re.compile(r\"^[a-z0-9]+(-[a-z0-9]+)*$\")\nMAX_DESCRIPTION = 1024\nMAX_BODY_LINES = 500\n\n\ndef check_skill(text: str, directory_name: str) -> list[str]:\n    \"\"\"Return every problem with a ``SKILL.md`` file.\n\n    Args:\n        text: The contents of ``SKILL.md``.\n        directory_name: The name of the folder that holds it; the skill's ``name`` must match.\n\n    Returns:\n        Problems found; empty when the skill is valid.\n    \"\"\"\n    try:\n        doc = parse(text)\n    except FrontmatterError as exc:\n        return [str(exc)]\n    problems: list[str] = []\n    name = str(doc.meta.get(\"name\", \"\"))\n    description = str(doc.meta.get(\"description\", \"\"))\n    if not name:\n        problems.append(\"missing required field 'name'\")\n    elif not NAME_PATTERN.match(name) or len(name) > 64:\n        problems.append(\"name must be lowercase letters, digits, and single hyphens, at most 64 characters\")\n    if name and name != directory_name:\n        problems.append(f\"name {name!r} must match its folder name {directory_name!r}\")\n    if not description:\n        problems.append(\"missing required field 'description'\")\n    elif len(description) > MAX_DESCRIPTION:\n        problems.append(f\"description is {len(description)} characters; the limit is {MAX_DESCRIPTION}\")\n    for key in sorted(set(doc.meta) - SKILL_FIELDS):\n        problems.append(f\"field {key!r} is not part of the Agent Skills format\")\n    if not doc.body.strip():\n        problems.append(\"the body is empty: it holds the skill's instructions\")\n    elif len(doc.body.splitlines()) > MAX_BODY_LINES:\n        problems.append(f\"the body is over {MAX_BODY_LINES} lines; move detail into files the skill links to\")\n    return problems\n",
 "fleetlab/transcript.py": "\"\"\"Read the newline-delimited JSON that ``claude -p --output-format stream-json --verbose`` prints.\n\nEach line is one event. The ones that matter for reading a run:\n\n* ``{\"type\": \"system\", \"subtype\": \"init\", ...}``: session id, model, and the tools available.\n* ``{\"type\": \"assistant\", \"message\": {\"content\": [...]}}``: text and ``tool_use`` blocks the model produced.\n* ``{\"type\": \"user\", \"message\": {\"content\": [...]}}``: ``tool_result`` blocks sent back to the model.\n* ``{\"type\": \"result\", ...}``: the last line, with ``subtype``, ``num_turns``, ``total_cost_usd``, and ``result``.\n\nMessages from subagents carry the id of the tool call that started them in ``parent_tool_use_id``; messages from the\nmain conversation carry ``null``.\n\"\"\"\n\nimport json\nfrom dataclasses import dataclass, field\nfrom typing import Any\n\n\n@dataclass\nclass ToolCall:\n    \"\"\"One tool call and what came back.\n\n    Attributes:\n        id: The ``tool_use`` block id.\n        name: Tool name, such as ``Bash`` or ``Agent``.\n        input: The arguments the model sent.\n        parent: ``parent_tool_use_id`` of the message, or ``None`` for the main conversation.\n        result: Text of the matching ``tool_result``, or ``None`` if none arrived.\n        is_error: Whether the result was an error.\n    \"\"\"\n\n    id: str\n    name: str\n    input: dict[str, Any]\n    parent: str | None = None\n    result: str | None = None\n    is_error: bool = False\n\n\n@dataclass\nclass Run:\n    \"\"\"A parsed headless run.\n\n    Attributes:\n        session_id: Session id from the init event.\n        model: Model from the init event.\n        tools: Tools the session had.\n        calls: Every tool call in order, including subagents'.\n        texts: Text the main conversation produced, in order.\n        result: The final ``result`` event, or ``None`` if the stream ended early.\n    \"\"\"\n\n    session_id: str = \"\"\n    model: str = \"\"\n    tools: list[str] = field(default_factory=list)\n    calls: list[ToolCall] = field(default_factory=list)\n    texts: list[str] = field(default_factory=list)\n    result: dict[str, Any] | None = None\n\n    @property\n    def finished(self) -> bool:\n        \"\"\"Whether the stream reached its ``result`` event.\"\"\"\n        return self.result is not None\n\n    @property\n    def succeeded(self) -> bool:\n        \"\"\"Whether the run ended with ``subtype == \"success\"`` and no error flag.\"\"\"\n        result = self.result or {}\n        return result.get(\"subtype\") == \"success\" and not result.get(\"is_error\")\n\n    @property\n    def num_turns(self) -> int:\n        \"\"\"Agentic turns reported by the result event (0 if unfinished).\"\"\"\n        return int((self.result or {}).get(\"num_turns\", 0))\n\n    @property\n    def cost_usd(self) -> float:\n        \"\"\"Estimated cost reported by the result event (0.0 if unfinished).\"\"\"\n        return float((self.result or {}).get(\"total_cost_usd\", 0.0))\n\n    def calls_by_tool(self) -> dict[str, int]:\n        \"\"\"Count tool calls per tool name.\"\"\"\n        counts: dict[str, int] = {}\n        for call in self.calls:\n            counts[call.name] = counts.get(call.name, 0) + 1\n        return counts\n\n\ndef _result_text(block: dict[str, Any]) -> str:\n    content = block.get(\"content\", \"\")\n    if isinstance(content, list):\n        return \"\".join(str(part.get(\"text\", \"\")) for part in content if isinstance(part, dict))\n    return str(content)\n\n\ndef parse_stream(text: str) -> Run:\n    \"\"\"Parse a stream-json transcript.\n\n    Blank lines and lines that are not JSON objects are skipped, so a transcript with stray log lines still parses.\n\n    Args:\n        text: The whole transcript.\n\n    Returns:\n        The parsed run.\n    \"\"\"\n    run = Run()\n    by_id: dict[str, ToolCall] = {}\n    for line in text.splitlines():\n        line = line.strip()\n        if not line.startswith(\"{\"):\n            continue\n        try:\n            event = json.loads(line)\n        except json.JSONDecodeError:\n            continue\n        kind = event.get(\"type\")\n        if kind == \"system\" and event.get(\"subtype\") == \"init\":\n            run.session_id = str(event.get(\"session_id\", \"\"))\n            run.model = str(event.get(\"model\", \"\"))\n            run.tools = [str(t) for t in event.get(\"tools\", [])]\n        elif kind in (\"assistant\", \"user\"):\n            parent = event.get(\"parent_tool_use_id\")\n            content = (event.get(\"message\") or {}).get(\"content\", [])\n            for block in content if isinstance(content, list) else []:\n                if not isinstance(block, dict):\n                    continue\n                if block.get(\"type\") == \"tool_use\":\n                    call = ToolCall(\n                        str(block.get(\"id\", \"\")), str(block.get(\"name\", \"\")), dict(block.get(\"input\", {})), parent\n                    )\n                    run.calls.append(call)\n                    by_id[call.id] = call\n                elif block.get(\"type\") == \"tool_result\" and block.get(\"tool_use_id\") in by_id:\n                    call = by_id[block[\"tool_use_id\"]]\n                    call.result = _result_text(block)\n                    call.is_error = bool(block.get(\"is_error\"))\n                elif block.get(\"type\") == \"text\" and kind == \"assistant\" and parent is None:\n                    run.texts.append(str(block.get(\"text\", \"\")))\n        elif kind == \"result\":\n            run.result = event\n    return run\n"
};

def _pp_flush_figures():

def _pp_format_exc(e):
    tb = e.__traceback__

class _PPTee(io.TextIOBase):
    def __init__(self, target):
        self.target = target
        self.buffer_text = io.StringIO()
    def writable(self):

    def write(self, s):
        self.buffer_text.write(s)
        return self.target.write(s)

    old_in = sys.stdin
    if stdin is not None:
        sys.stdin = io.StringIO(stdin)
    try:
        with contextlib.redirect_stdout(buf):
            result = func(*args, **kwargs)

class _PPTraceLimit(Exception):
    pass

def _pp_trace(code, stdin="", max_steps=1500):
    steps = []
    out = io.StringIO()
    ids = {}
    _pp_register(code, "<trace>")
    def tag(obj):
        key = id(obj)
        if key not in ids:
            ids[key] = len(ids) + 1
        return ids[key]
    def snap(value):
        try:
            text = repr(value)
        except Exception as e:
            text = f"<repr failed: {type(e).__name__}>"
        if len(text) > 90:
            text = text[:87] + "..."
        item = {"r": text, "t": type(value).__name__}
        if isinstance(value, (list, dict, set, bytearray)) or (
            hasattr(value, "__dict__") and not isinstance(value, (type, types.FunctionType, types.ModuleType, types.BuiltinFunctionType))
        ):
            item["ref"] = tag(value)
        return item
    def frames(frame):
        stack = []
        f = frame
        while f is not None:
            if f.f_code.co_filename == "<trace>":
                local_vars = {}
                for k, v in list(f.f_locals.items()):
                    if (k.startswith("__") and k.endswith("__")) or isinstance(v, types.ModuleType):
                        continue
                    local_vars[k] = snap(v)
                stack.append({"name": f.f_code.co_name, "line": f.f_lineno, "locals": local_vars})
            f = f.f_back
        return stack[::-1]
    def tracer(frame, event, arg):
        if frame.f_code.co_filename != "<trace>":
            return None
        if len(steps) >= max_steps:
            raise _PPTraceLimit()
        if event in ("line", "return", "exception"):
            step = {"event": event, "line": frame.f_lineno, "stack": frames(frame), "out": out.getvalue()}
            if event == "return":
                step["ret"] = snap(arg)
            if event == "exception":
                step["exc"] = f"{arg[0].__name__}: {arg[1]}"
            steps.append(step)
        return tracer
    ns = _pp_new_ns()
    old_out, old_in = sys.stdout, sys.stdin
    sys.stdout, sys.stdin = out, io.StringIO(stdin)
    error = None
    try:
        compiled = compile(code, "<trace>", "exec")
        sys.settrace(tracer)
        exec(compiled, ns)
    except _PPTraceLimit:
        error = f"Stopped after {max_steps} steps (is there an infinite loop?)."
    except BaseException as e:
        error = "".join(traceback.format_exception_only(type(e), e)).strip()
    finally:
        sys.settrace(None)
        sys.stdout, sys.stdin = old_out, old_in
    return json.dumps({"steps": steps, "error": error, "out": out.getvalue()})
