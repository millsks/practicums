de that turns a list of\n      \u003ccode>(tool, input, error?)\u003c/code> steps into stream-json text.\u003c/p>\n\n    \u003cdiv class=\"exercise\" data-id=\"m01-e1\" data-title=\"Count tool calls\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Write \u003ccode>tool_counts(stream_text)\u003c/code> that returns a dictionary mapping each tool name to how many\n          times it was called in the run, using \u003ccode>fleetlab.parse_stream\u003c/code>. Count subagent calls too.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\nimport fleetlab\n\ndef tool_counts(stream_text):\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\nimport json\n\ndef make_run(steps, finished=True):\n    events = [{\"type\": \"system\", \"subtype\": \"init\", \"session_id\": \"s\", \"model\": \"m\", \"tools\": []}]\n    for i, (tool, tool_input, error) in enumerate(steps):\n        events.append({\"type\": \"assistant\", \"parent_tool_use_id\": None, \"message\": {\"content\": [{\"type\": \"tool_use\", \"id\": f\"t{i}\", \"name\": tool, \"input\": tool_input}]}})\n        events.append({\"type\": \"user\", \"parent_tool_use_id\": None, \"message\": {\"content\": [{\"type\": \"tool_result\", \"tool_use_id\": f\"t{i}\", \"content\": \"x\", \"is_error\": error}]}})\n    if finished:\n        events.append({\"type\": \"result\", \"subtype\": \"success\", \"is_error\": False, \"num_turns\": len(steps) + 1, \"total_cost_usd\": 0.01, \"result\": \"done\"})\n    return \"\\n\".join(json.dumps(e) for e in events)\n\ndef test_counts():\n    text = make_run([(\"Read\", {\"file_path\": \"a\"}, False), (\"Bash\", {\"command\": \"pytest\"}, False), (\"Read\", {\"file_path\": \"b\"}, False)])\n    assert tool_counts(text) == {\"Read\": 2, \"Bash\": 1}, \"count each tool name\"\n\ndef test_empty_run():\n    assert tool_counts(make_run([])) == {}, \"a run with no calls gives an empty dict\"\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>\u003ccode>fleetlab.parse_stream(text).calls\u003c/code> is the list of\n        calls; each has \u003ccode>.name\u003c/code>. The run object also has a method that does the counting.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">import fleetlab\n\ndef tool_counts(stream_text):\n    return fleetlab.parse_stream(stream_text).calls_by_tool()\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"exercise\" data-id=\"m01-e2\" data-title=\"Did it run the tests after its last edit?\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Write \u003ccode>verified_after_last_edit(stream_text)\u003c/code> that returns \u003ccode>True\u003c/code> when a\n          \u003ccode>Bash\u003c/code> call whose command contains \u003ccode>pytest\u003c/code> comes \u003cem>after\u003c/em> the last\n          \u003ccode>Edit\u003c/code> or \u003ccode>Write\u003c/code> call. A run with no edits counts as verified. This is a detector\n          for the premature-done failure.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\nimport fleetlab\n\ndef verified_after_last_edit(stream_text):\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\nimport json\n\ndef make_run(steps):\n    events = [{\"type\": \"system\", \"subtype\": \"init\", \"session_id\": \"s\", \"model\": \"m\", \"tools\": []}]\n    for i, (tool, tool_input, error) in enumerate(steps):\n        events.append({\"type\": \"assistant\", \"parent_tool_use_id\": None, \"message\": {\"content\": [{\"type\": \"tool_use\", \"id\": f\"t{i}\", \"name\": tool, \"input\": tool_input}]}})\n        events.append({\"type\": \"user\", \"parent_tool_use_id\": None, \"message\": {\"content\": [{\"type\": \"tool_result\", \"tool_use_id\": f\"t{i}\", \"content\": \"x\", \"is_error\": error}]}})\n    events.append({\"type\": \"result\", \"subtype\": \"success\", \"is_error\": False, \"num_turns\": 1, \"total_cost_usd\": 0, \"result\": \"ok\"})\n    return \"\\n\".join(json.dumps(e) for e in events)\n\ndef test_tests_after_edit():\n    text = make_run([(\"Edit\", {\"file_path\": \"a.py\"}, False), (\"Bash\", {\"command\": \"python -m pytest -q\"}, False)])\n    assert verified_after_last_edit(text) is True\n\ndef test_tests_before_edit_only():\n    text = make_run([(\"Bash\", {\"command\": \"python -m pytest -q\"}, False), (\"Edit\", {\"file_path\": \"a.py\"}, False)])\n    assert verified_after_last_edit(text) is False, \"tests ran before the last edit, so the edit is unverified\"\n\ndef test_non_test_bash_does_not_count():\n    text = make_run([(\"Write\", {\"file_path\": \"a.py\"}, False), (\"Bash\", {\"command\": \"ls\"}, False)])\n    assert verified_after_last_edit(text) is False, \"only a pytest command counts as verification\"\n\ndef test_no_edits():\n    assert verified_after_last_edit(make_run([(\"Read\", {\"file_path\": \"a.py\"}, False)])) is True\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>Find the index of the last call whose name is\n        \u003ccode>Edit\u003c/code> or \u003ccode>Write\u003c/code>. Then look at the calls after that index.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">import fleetlab\n\ndef verified_after_last_edit(stream_text):\n    calls = fleetlab.parse_stream(stream_text).calls\n    last_edit = -1\n    for i, call in enumerate(calls):\n        if call.name in (\"Edit\", \"Write\"):\n            last_edit = i\n    if last_edit == -1:\n        return True\n    return any(\n        c.name == \"Bash\" and \"pytest\" in c.input.get(\"command\", \"\")\n        for c in calls[last_edit + 1:]\n    )\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"exercise\" data-id=\"m01-e3\" data-title=\"Spot a doom loop\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Write \u003ccode>doom_loop(stream_text, repeats=3)\u003c/code> that returns \u003ccode>True\u003c/code> when the run contains\n          \u003ccode>repeats\u003c/code> or more \u003cem>consecutive\u003c/em> calls with the same tool name and the same input, all of\n          which returned an error.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\nimport fleetlab\n\ndef doom_loop(stream_text, repeats=3):\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\nimport json\n\ndef make_run(steps):\n    events = [{\"type\": \"system\", \"subtype\": \"init\", \"session_id\": \"s\", \"model\": \"m\", \"tools\": []}]\n    for i, (tool, tool_input, error) in enumerate(steps):\n        events.append({\"type\": \"assistant\", \"parent_tool_use_id\": None, \"message\": {\"content\": [{\"type\": \"tool_use\", \"id\": f\"t{i}\", \"name\": tool, \"input\": tool_input}]}})\n        events.append({\"type\": \"user\", \"parent_tool_use_id\": None, \"message\": {\"content\": [{\"type\": \"tool_result\", \"tool_use_id\": f\"t{i}\", \"content\": \"x\", \"is_error\": error}]}})\n    return \"\\n\".join(json.dumps(e) for e in events)\n\nFAIL = (\"Bash\", {\"command\": \"pytest\"}, True)\n\ndef test_three_identical_failures():\n    assert doom_loop(make_run([FAIL, FAIL, FAIL])) is True\n\ndef test_successes_do_not_count():\n    ok = (\"Bash\", {\"command\": \"pytest\"}, False)\n    assert doom_loop(make_run([ok, ok, ok])) is False, \"repeated successful calls are not a doom loop\"\n\ndef test_must_be_consecutive():\n    other = (\"Read\", {\"file_path\": \"a\"}, False)\n    assert doom_loop(make_run([FAIL, FAIL, other, FAIL])) is False, \"an unrelated call breaks the streak\"\n\ndef test_different_inputs_break_streak():\n    alt = (\"Bash\", {\"command\": \"pytest -x\"}, True)\n    assert doom_loop(make_run([FAIL, alt, FAIL])) is False, \"a changed input means the agent tried something new\"\n\ndef test_custom_repeats():\n    assert doom_loop(make_run([FAIL, FAIL]), repeats=2) is True\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>Walk the calls keeping a streak counter. A call continues the\n        streak when it is an error and has the same \u003ccode>(name, input)\u003c/code> as the previous call in the streak.\n        Otherwise reset: to 1 if the call is an error, to 0 if not.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">import json\nimport fleetlab\n\ndef doom_loop(stream_text, repeats=3):\n    streak, previous = 0, None\n    for call in fleetlab.parse_stream(stream_text).calls:\n        key = (call.name, json.dumps(call.input, sort_keys=True))\n        if call.is_error and key == previous:\n            streak += 1\n        elif call.is_error:\n            streak = 1\n        else:\n            streak = 0\n        previous = key if call.is_error else None\n        if streak >= repeats:\n            return True\n    return False\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"exercise\" data-id=\"m01-e4\" data-title=\"Allow, ask, or deny\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Write \u003ccode>decide(command, allow, deny)\u003c/code> using the simplified Bash rule model from this module:\n          a rule is \u003ccode>Bash(&lt;text&gt;)\u003c/code>; if \u003ccode>&lt;text&gt;\u003c/code> ends with a space and a star it\n          matches the prefix exactly or the prefix followed by a space; otherwise it must match the whole command.\n          Deny wins over allow. Return \u003ccode>\"deny\"\u003c/code>, \u003ccode>\"allow\"\u003c/code>, or \u003ccode>\"ask\"\u003c/code>.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\ndef decide(command, allow, deny):\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\nALLOW = [\"Bash(git diff *)\", \"Bash(python -m pytest *)\", \"Bash(git status)\"]\nDENY = [\"Bash(git push *)\", \"Bash(git diff --output *)\"]\n\ndef test_prefix_allow():\n    assert decide(\"git diff main\", ALLOW, DENY) == \"allow\"\n    assert decide(\"git diff\", ALLOW, DENY) == \"allow\", \"the bare prefix matches too\"\n\ndef test_space_matters():\n    assert decide(\"git diff-index HEAD\", ALLOW, DENY) == \"ask\", \"'git diff *' must not match 'git diff-index'\"\n\ndef test_exact_rule():\n    assert decide(\"git status\", ALLOW, DENY) == \"allow\"\n    assert decide(\"git status -s\", ALLOW, DENY) == \"ask\", \"a rule without ' *' matches only the exact command\"\n\ndef test_deny_wins():\n    assert decide(\"git diff --output x.patch\", ALLOW, DENY) == \"deny\", \"deny beats a matching allow\"\n    assert decide(\"git push origin main\", ALLOW, DENY) == \"deny\"\n\ndef test_unknown_asks():\n    assert decide(\"rm -rf build\", ALLOW, DENY) == \"ask\"\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>Write a helper \u003ccode>matches(rule, command)\u003c/code> first. Strip\n        \u003ccode>Bash(\u003c/code> and the closing parenthesis, then handle the two cases.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">def matches(rule, command):\n    inner = rule[len(\"Bash(\"):-1]\n    if inner.endswith(\" *\"):\n        prefix = inner[:-2]\n        return command == prefix or command.startswith(prefix + \" \")\n    return command == inner\n\ndef decide(command, allow, deny):\n    if any(matches(r, command) for r in deny):\n        return \"deny\"\n    if any(matches(r, command) for r in allow):\n        return \"allow\"\n    return \"ask\"\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"exercise\" data-id=\"m01-e5\" data-title=\"Build a headless command\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Write \u003ccode>review_command(prompt, max_turns=10)\u003c/code> that returns the argument list (as for\n          \u003ccode>subprocess.run\u003c/code>) for a \u003cstrong>read-only, reproducible\u003c/strong> headless review. It must start\n          with \u003ccode>\"claude\"\u003c/code>, use \u003ccode>--bare\u003c/code> and \u003ccode>-p\u003c/code> with the prompt, allow exactly the\n          tools \u003ccode>Read,Grep,Glob\u003c/code>, set the turn limit, and ask for \u003ccode>json\u003c/code> output.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\ndef review_command(prompt, max_turns=10):\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\ndef flag(argv, name):\n    assert name in argv, f\"missing {name}\"\n    return argv[argv.index(name) + 1]\n\ndef test_shape():\n    argv = review_command(\"Review change.patch\")\n    assert argv[0] == \"claude\", \"start with the claude executable\"\n    assert \"--bare\" in argv, \"use --bare so only what you pass applies\"\n    assert flag(argv, \"-p\") == \"Review change.patch\", \"-p is followed by the prompt\"\n\ndef test_tools_read_only():\n    tools = set(review_command(\"x\")[review_command(\"x\").index(\"--allowedTools\") + 1].split(\",\"))\n    assert tools == {\"Read\", \"Grep\", \"Glob\"}, f\"allow exactly Read, Grep, Glob (got {sorted(tools)})\"\n\ndef test_turns_and_output():\n    argv = review_command(\"x\", max_turns=7)\n    assert flag(argv, \"--max-turns\") == \"7\", \"turn limit must be a string argument\"\n    assert flag(argv, \"--output-format\") == \"json\"\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>Every element of the list must be a string, including the\n        number of turns. Tools go in one argument separated by commas.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">def review_command(prompt, max_turns=10):\n    return [\n        \"claude\", \"--bare\", \"-p\", prompt,\n        \"--allowedTools\", \"Read,Grep,Glob\",\n        \"--max-turns\", str(max_turns),\n        \"--output-format\", \"json\",\n    ]\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"mini-project\">\n    \u003ch2>Lab: a run summariser\u003c/h2>\n    \u003cdiv class=\"project-box\">\n      \u003cdiv class=\"widget-head\">\u003cspan class=\"w-kind\">Lab m01-lab1\u003c/span>\u003cspan class=\"w-title\">summarize_run.py: turn a transcript into a verdict\u003c/span>\u003c/div>\n      \u003cdiv class=\"widget-body\">\n        \u003cp>Write a command-line tool that reads a \u003ccode>stream-json\u003c/code> transcript and prints a JSON summary: turns,\n          cost, tool counts, failed calls, whether the run succeeded, and the two warnings you built detectors for\n          (unverified edits and doom loops). You'll use it on every agent you run for the rest of the course.\u003c/p>\n        \u003cp>One constraint: the script must use only the standard library, \u003cem>not\u003c/em> \u003ccode>fleetlab\u003c/code>. In a\n          work sandbox you may have nothing but Python, so you need to be able to read a transcript with just\n          \u003ccode>json\u003c/code>.\u003c/p>\n        \u003cpre data-label=\"Terminal\">\u003ccode class=\"language-bash\">pixi run start m01-lab1\n# read labs/m01-lab1/README.md, write work/m01-lab1/summarize_run.py\npixi run grade m01-lab1\npixi run grade-live m01-lab1   # optional: summarise a real run of claude on shelf\u003c/code>\u003c/pre>\n        \u003cul class=\"checklist\" data-id=\"m01-lab1\">\n          \u003cli>Prints exactly the JSON keys the README specifies\u003c/li>\n          \u003cli>Handles a run that never reached its \u003ccode>result\u003c/code> line\u003c/li>\n          \u003cli>Counts subagent calls but reports them separately\u003c/li>\n          \u003cli>Flags unverified edits and doom loops\u003c/li>\n          \u003cli>Uses only the standard library\u003c/li>\n          \u003cli>\u003ccode>pixi run grade m01-lab1\u003c/code> passes\u003c/li>\n        \u003c/ul>\n        \u003cp>\u003cstrong>Stretch:\u003c/strong> add a \u003ccode>--markdown\u003c/code> flag that prints a short report you could paste\n          into a pull request.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"quiz\">\n    \u003ch2>Quiz\u003c/h2>\n    \u003cdiv class=\"quiz\" data-id=\"m01-quiz\">\n\u003cscript type=\"application/json\">\n{\"title\": \"The Harness quiz\", \"passScore\": 0.7, \"questions\": [\n  {\"type\": \"single\", \"prompt\": \"What ends Claude Code's loop on its own?\", \"options\": [\"A fixed number of tool calls\", \"The model replies without asking for a tool (or a limit or block stops it)\", \"The first failed tool call\", \"Every 10 seconds\"], \"answer\": 1, \"explanation\": \"\u003cp>The loop continues while the model asks for tools. A turn limit, a hook, or an error can also stop it.\u003c/p>\"},\n  {\"type\": \"multi\", \"prompt\": \"Which built-in tools can change files or run arbitrary commands?\", \"options\": [\"Read\", \"Edit\", \"Write\", \"Bash\", \"Grep\"], \"answer\": [1, 2, 3], \"explanation\": \"\u003cp>Edit and Write change files; Bash can do anything a shell can, including editing files. Read and Grep only read.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"Which rule allows \u003ccode>git diff main\u003c/code> but not \u003ccode>git diff-index HEAD\u003c/code>?\", \"options\": [\"\u003ccode>Bash(git diff*)\u003c/code>\", \"\u003ccode>Bash(git diff *)\u003c/code>\", \"\u003ccode>Bash(git *)\u003c/code>\", \"\u003ccode>Bash(diff)\u003c/code>\"], \"answer\": 1, \"explanation\": \"\u003cp>The space before the star means \\\"this prefix followed by a space\\\", so \u003ccode>diff-index\u003c/code> doesn't match. Without the space, it would.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"A command matches both an allow rule and a deny rule. What happens?\", \"options\": [\"It runs\", \"It's denied\", \"The first rule in the file wins\", \"Claude Code asks\"], \"answer\": 1, \"explanation\": \"\u003cp>Deny rules take precedence over allow rules.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"Where should a fleet's shared hooks and permission rules live?\", \"options\": [\"~/.claude/settings.json\", \".claude/settings.local.json\", \".claude/settings.json, committed to the repo\", \"In the prompt\"], \"answer\": 2, \"explanation\": \"\u003cp>The committed project settings travel with the repo into every worktree and CI job. Local and user settings are personal.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"Which permission mode denies anything that would otherwise prompt?\", \"options\": [\"default\", \"acceptEdits\", \"dontAsk\", \"bypassPermissions\"], \"answer\": 2, \"explanation\": \"\u003cp>\u003ccode>dontAsk\u003c/code> runs only pre-approved actions, which suits locked-down CI.\u003c/p>\"},\n  {\"type\": \"multi\", \"prompt\": \"What does \u003ccode>--bare\u003c/code> change for \u003ccode>claude -p\u003c/code>?\", \"options\": [\"Skips auto-discovered hooks, skills, subagents, MCP servers, and CLAUDE.md\", \"Reads ANTHROPIC_API_KEY instead of your subscription login\", \"Removes all tools\", \"Makes every run behave the same on every machine\"], \"answer\": [0, 1, 3], \"explanation\": \"\u003cp>Bare mode keeps Bash, read, and edit tools, but loads nothing it wasn't told about, which makes runs reproducible.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"Why is \u003ccode>--bare\u003c/code> safer in CI for pull requests?\", \"options\": [\"It is faster\", \"Without it, the run loads hooks and MCP servers from the repository, which a pull request could change\", \"It hides the transcript\", \"It disables the model\"], \"answer\": 1, \"explanation\": \"\u003cp>A headless run without bare mode loads repository configuration without the trust prompt, so untrusted changes could alter what runs.\u003c/p>\"},\n  {\"type\": \"text\", \"prompt\": \"Which field of the final \u003ccode>result\u003c/code> event holds the number of agentic turns?\", \"answer\": [\"num_turns\"], \"explanation\": \"\u003cp>The result event also carries \u003ccode>subtype\u003c/code>, \u003ccode>is_error\u003c/code>, \u003ccode>total_cost_usd\u003c/code>, \u003ccode>session_id\u003c/code>, and \u003ccode>result\u003c/code>.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"A transcript shows three identical Bash calls in a row, each returning an error. What is this?\", \"options\": [\"Premature done\", \"A doom loop\", \"Drift\", \"Normal retrying\"], \"answer\": 1, \"explanation\": \"\u003cp>Repeating the same failing action is a doom loop. Turn limits and error-signature checks stop it.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"The result says \u003ccode>success\u003c/code>, but there's no test command after the last edit. What should you conclude?\", \"options\": [\"The fix is verified\", \"The agent declared success without verifying: premature done\", \"The tests must have run silently\", \"The model is broken\"], \"answer\": 1, \"explanation\": \"\u003cp>The summary only says the run ended normally. The transcript shows the edit was never checked.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"How do you tell a subagent's messages from the main conversation's in stream-json?\", \"options\": [\"They have type 'subagent'\", \"Their \u003ccode>parent_tool_use_id\u003c/code> is the id of the call that started the subagent; the main conversation has null\", \"They come after the result line\", \"They're in a separate file\"], \"answer\": 1, \"explanation\": \"\u003cp>Following \u003ccode>parent_tool_use_id\u003c/code> lets you rebuild which run each message belongs to.\u003c/p>\"}\n]}\n\u003c/script>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"recap\">\n    \u003ch2>Recap\u003c/h2>\n    \u003cul>\n      \u003cli>Claude Code runs the agent loop: gather, act, verify, repeat. The model chooses; the harness permits, runs,\n        and stops.\u003c/li>\n      \u003cli>Read-only tools: Read, Grep, Glob. State-changing: Edit, Write, and Bash, which can do anything.\u003c/li>\n      \u003cli>Permission modes set the baseline; allow, ask, and deny rules refine it; deny wins; \u003ccode>Bash(x *)\u003c/code>\n        is a prefix match and the space matters.\u003c/li>\n      \u003cli>Shared rules and hooks belong in the committed \u003ccode>.claude/settings.json\u003c/code>. Managed settings beat\n        everything.\u003c/li>\n      \u003cli>Headless: \u003ccode>claude -p\u003c/code>, explicit \u003ccode>--allowedTools\u003c/code>, \u003ccode>--max-turns\u003c/code>,\n        \u003ccode>--output-format json\u003c/code> or \u003ccode>stream-json\u003c/code>, and \u003ccode>--bare\u003c/code> for reproducible,\n        safe CI runs.\u003c/li>\n      \u003cli>Transcripts show what summaries hide: premature done, doom loops, drift, starvation, shallow fixes.\u003c/li>\n    \u003c/ul>\n    \u003cdiv class=\"flashcards\" data-title=\"The harness\">\n      \u003cscript type=\"application/json\">\n      [{\"front\": \"The three phases of the agent loop\", \"back\": \"Gather, act, verify. Then repeat or stop.\"},\n       {\"front\": \"Why is Bash effectively every tool?\", \"back\": \"A shell can edit, delete, and push. A read-only agent must not have unrestricted Bash.\"},\n       {\"front\": \"\u003ccode>Bash(git diff *)\u003c/code> vs \u003ccode>Bash(git diff*)\u003c/code>\", \"back\": \"With the space: \u003ccode>git diff\u003c/code> followed by a space. Without: also matches \u003ccode>git diff-index\u003c/code>.\"},\n       {\"front\": \"Allow and deny both match\", \"back\": \"Deny wins.\"},\n       {\"front\": \"Settings precedence for one value\", \"back\": \"Managed > command line > local > project > user. Hook lists are combined.\"},\n       {\"front\": \"\u003ccode>dontAsk\u003c/code> mode\", \"back\": \"Denies anything that would prompt; only pre-approved actions run. Good for CI.\"},\n       {\"front\": \"What \u003ccode>--bare\u003c/code> does\", \"back\": \"Loads nothing it isn't told about (no hooks, skills, agents, MCP, CLAUDE.md) and uses ANTHROPIC_API_KEY.\"},\n       {\"front\": \"Last line of a stream-json run\", \"back\": \"\u003ccode>{\\\"type\\\": \\\"result\\\", ...}\u003c/code> with subtype, is_error, num_turns, total_cost_usd, result.\"},\n       {\"front\": \"Premature done in a transcript\", \"back\": \"No test command after the last edit.\"},\n       {\"front\": \"Doom loop in a transcript\", \"back\": \"The same failing call, with the same input, several times in a row.\"}]\n      \u003c/script>\n    \u003c/div>\n    \u003ch3>Going further\u003c/h3>\n    \u003cul>\n      \u003cli>\u003ca href=\"https://code.claude.com/docs/en/headless\">Claude Code: Run Claude Code programmatically\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"https://code.claude.com/docs/en/permissions\">Claude Code: Permissions\u003c/a> and \u003ca href=\"https://code.claude.com/docs/en/settings\">Settings\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"../reference/cheatsheet.html\">Agent and hook cheat sheet\u003c/a>\u003c/li>\n      \u003cli>Next: \u003ca href=\"m02-writing-a-subagent.html\">M02 Writing a Subagent\u003c/a>, where you define your first agent\u003c/li>\n    \u003c/ul>\n  \u003c/section>","exercises":["m01-e1","m01-e2","m01-e3","m01-e4","m01-e5"],"quizzes":["m01-quiz"],"checklists":{"m01-lab1":6}},"modules/m02-writing-a-subagent.html":{"id":"m02","kind":"module","title":"M02 · Writing a Subagent · Coding Agent Fleets Practicum","html":"\u003cheader class=\"lesson-hero\">\n    \u003cp class=\"eyebrow\">Stage 1 · One Agent · Module 02\u003c/p>\n    \u003ch1>Writing a Subagent\u003c/h1>\n    \u003cp class=\"lede\">Every station in your fleet is a subagent: a Markdown file that gives Claude a role, a prompt,\n      a set of tools, and limits. This module covers every part of that file and, more importantly, how to write\n      each part well: a description that makes delegation happen at the right moment, a prompt with a clear output\n      and a clear point to stop, and tools that let the agent do its job and nothing else. You'll finish by writing\n      the reviewer and test-writer your fleet will use from here on.\u003c/p>\n    \u003cdiv class=\"lesson-meta\">\u003cspan>⏱ ~2.5 hours\u003c/span>\u003cspan>Prerequisites: \u003ca href=\"m01-the-harness.html\">M01 The Harness\u003c/a>\u003c/span>\u003c/div>\n    \u003cul class=\"objectives\">\n      \u003cli>Explain what a subagent gives you (its own context, tools, and prompt) and what it costs\u003c/li>\n      \u003cli>Write a subagent file in the right place, and predict which definition wins when names collide\u003c/li>\n      \u003cli>Use the frontmatter fields deliberately: tools, disallowedTools, model, maxTurns, isolation, and others\u003c/li>\n      \u003cli>Write descriptions that trigger delegation for the right tasks and not the wrong ones\u003c/li>\n      \u003cli>Write prompts with a role, a scope, a process, an output format, and stop conditions\u003c/li>\n      \u003cli>Choose least-privilege tools for a role, and test an agent against a seeded change\u003c/li>\n    \u003c/ul>\n  \u003c/header>\n\n  \u003csection class=\"lesson-section\" id=\"why\">\n    \u003ch2>What a subagent is for\u003c/h2>\n    \u003cp>A \u003cstrong>subagent\u003c/strong> is a separate agent that the main conversation (or a script) can hand a task to.\n      It runs with:\u003c/p>\n    \u003cul>\n      \u003cli>\u003cstrong>Its own context window.\u003c/strong> It starts fresh with its own prompt and only what it's given. The\n        hundreds of lines it reads while working never land in the caller's context. Only its final answer comes\n        back.\u003c/li>\n      \u003cli>\u003cstrong>Its own prompt.\u003c/strong> The body of the file becomes its system instructions: a role and rules\n        that don't have to compete with everything else the main session knows.\u003c/li>\n      \u003cli>\u003cstrong>Its own tools and limits.\u003c/strong> A reviewer can be read-only even when the main session can edit\n        files.\u003c/li>\n    \u003c/ul>\n    \u003cp>Those three properties are why a fleet is built from subagents. Isolation keeps each station's context\n      small and focused. A separate prompt makes behaviour consistent. Separate tools enforce least privilege. And a\n      fresh context is what makes a reviewer useful: an agent that didn't write the code doesn't share the author's\n      blind spots.\u003c/p>\n    \u003cp>The cost is that a subagent only returns a summary. If the caller needs every detail of what the subagent\n      saw, it either has to ask for that detail in the output format or do the work itself. Subagents also start\n      cold: each one re-reads what it needs, which costs tokens and time.\u003c/p>\n    \u003cp>Claude Code includes some built-in subagents, notably \u003cstrong>Explore\u003c/strong> (fast, read-only searching),\n      \u003cstrong>Plan\u003c/strong> (research before planning), and \u003cstrong>general-purpose\u003c/strong>. Yours sit alongside\n      them.\u003c/p>\n    \u003caside class=\"callout tip\">\u003cp>\u003cstrong>Remember:\u003c/strong> use a subagent when a task is focused, its result can be\n      summarised, and it benefits from a fresh context or tighter tools. Keep work in one session when the caller\n      needs every detail.\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"anatomy\">\n    \u003ch2>Anatomy of a subagent file\u003c/h2>\n    \u003cp>A subagent is a Markdown file with YAML frontmatter. Only \u003ccode>name\u003c/code> and \u003ccode>description\u003c/code> are\n      required. Everything after the closing \u003ccode>---\u003c/code> is the subagent's system prompt.\u003c/p>\n    \u003cpre>\u003ccode class=\"language-markdown\">---\nname: reviewer\ndescription: Reviews the current branch for bugs, security issues and scope creep. Use after code changes, before opening a pull request.\ntools: Read, Grep, Glob, Bash\ndisallowedTools: Edit, Write\nmodel: sonnet\nmaxTurns: 25\n---\n\nYou review code. You never edit files.\n...\u003c/code>\u003c/pre>\n    \u003ch3>Where it lives, and which definition wins\u003c/h3>\n    \u003cdiv class=\"scroll\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>Location\u003c/th>\u003cth>Scope\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>Managed settings directory\u003c/td>\u003ctd>Set by an organization; wins over project and user definitions with the same name\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>--agents '{...}'\u003c/code> on the command line\u003c/td>\u003ctd>One session; highest priority among the ones you control, and not saved to disk\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>.claude/agents/\u003c/code>\u003c/td>\u003ctd>This project; commit it so the whole team and CI get the same agents\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>~/.claude/agents/\u003c/code>\u003c/td>\u003ctd>You, in every project\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>A plugin's \u003ccode>agents/\u003c/code>\u003c/td>\u003ctd>Wherever the plugin is enabled\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n    \u003cp>Claude Code scans the agent folders recursively, so you can organise definitions in subfolders like\n      \u003ccode>agents/review/\u003c/code>. When two definitions share a name, the higher-priority location wins. That's how\n      you'd override a personal reviewer with the team's project reviewer, and how an administrator can pin one for\n      everyone.\u003c/p>\n    \u003caside class=\"callout note\">\u003cp>Claude Code ignores frontmatter fields it doesn't recognise, without warning. A\n      misspelled field simply isn't applied. That's why every lab check (and the validator you'll put in your own CI)\n      parses agent files with \u003ccode>fleetlab.check_agent\u003c/code>.\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"fields\">\n    \u003ch2>The fields, and when to use each\u003c/h2>\n    \u003cdiv class=\"scroll\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>Field\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Guidance\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>\u003ccode>name\u003c/code>\u003c/td>\u003ctd>Unique id (no \u003ccode>:\u003c/code>, up to 256 characters)\u003c/td>\u003ctd>Lowercase with hyphens; match the file name\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>description\u003c/code>\u003c/td>\u003ctd>When Claude should delegate to it\u003c/td>\u003ctd>The most important line you write. See the next section\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>tools\u003c/code>\u003c/td>\u003ctd>Allowlist of tools; omitted means it inherits the caller's\u003c/td>\u003ctd>Always set it. Inheriting is the opposite of least privilege\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>disallowedTools\u003c/code>\u003c/td>\u003ctd>Removed from the inherited or listed tools\u003c/td>\u003ctd>A second lock: list Edit and Write on agents that must never edit\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>model\u003c/code>\u003c/td>\u003ctd>\u003ccode>sonnet\u003c/code>, \u003ccode>opus\u003c/code>, \u003ccode>haiku\u003c/code>, \u003ccode>fable\u003c/code>, a full model id, or \u003ccode>inherit\u003c/code>\u003c/td>\u003ctd>Small models for high-volume routine work, the strongest for planning and review\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>maxTurns\u003c/code>\u003c/td>\u003ctd>Turns before it stops and returns partial output\u003c/td>\u003ctd>Every agent gets a budget. A runaway agent costs money\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>permissionMode\u003c/code>\u003c/td>\u003ctd>\u003ccode>default\u003c/code>, \u003ccode>acceptEdits\u003c/code>, \u003ccode>plan\u003c/code>, \u003ccode>auto\u003c/code>, \u003ccode>dontAsk\u003c/code>, \u003ccode>bypassPermissions\u003c/code>\u003c/td>\u003ctd>\u003ccode>plan\u003c/code> for agents that only propose\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>isolation\u003c/code>\u003c/td>\u003ctd>\u003ccode>worktree\u003c/code> runs it in a temporary git worktree\u003c/td>\u003ctd>For agents that edit, so parallel builders never share files\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>effort\u003c/code>\u003c/td>\u003ctd>\u003ccode>low\u003c/code> to \u003ccode>max\u003c/code>\u003c/td>\u003ctd>Higher for hard reasoning, lower for quick classification\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>skills\u003c/code>\u003c/td>\u003ctd>Skills preloaded into its context\u003c/td>\u003ctd>A procedure the agent always needs (M03)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>mcpServers\u003c/code>\u003c/td>\u003ctd>MCP servers available to it\u003c/td>\u003ctd>Scope external tools to the one agent that needs them\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>hooks\u003c/code>\u003c/td>\u003ctd>Hooks that run only while it's active\u003c/td>\u003ctd>A gate specific to this role (M04)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>memory\u003c/code>\u003c/td>\u003ctd>Persistent notes: \u003ccode>user\u003c/code>, \u003ccode>project\u003c/code>, or \u003ccode>local\u003c/code>\u003c/td>\u003ctd>Useful for a reviewer that learns conventions. Review what it writes\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>background\u003c/code>\u003c/td>\u003ctd>\u003ccode>true\u003c/code> keeps it running in the background\u003c/td>\u003ctd>Long, independent work\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>omitClaudeMd\u003c/code>\u003c/td>\u003ctd>\u003ccode>true\u003c/code> skips CLAUDE.md files at startup\u003c/td>\u003ctd>Agents that don't need project instructions\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>autoCompactWindow\u003c/code>, \u003ccode>initialPrompt\u003c/code>, \u003ccode>color\u003c/code>\u003c/td>\u003ctd>Compaction threshold, first prompt as main agent, display colour\u003c/td>\u003ctd>Rarely needed\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n    \u003cp>Subagents can start their own subagents (by default up to three levels below the main conversation). To stop a\n      specific agent from delegating, leave \u003ccode>Agent\u003c/code> out of its \u003ccode>tools\u003c/code>. That's the right\n      default for most stations: a reviewer that spawns more reviewers is hard to reason about.\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"description\">\n    \u003ch2>Descriptions that trigger delegation\u003c/h2>\n    \u003cp>When you ask the main session to do something, Claude decides whether to hand it to a subagent by reading the\n      \u003cstrong>descriptions\u003c/strong> of all available subagents. The description is a routing rule written in plain\n      language. A good one says \u003cem>what the agent does\u003c/em> and \u003cem>when to use it\u003c/em>, with the trigger words a\n      request would actually contain.\u003c/p>\n    \u003cdiv class=\"two-col\">\n      \u003cdiv>\n        \u003ch4>Weak\u003c/h4>\n        \u003cul>\n          \u003cli>\u003ccode>Helps with code.\u003c/code> (matches everything, so it's useless)\u003c/li>\n          \u003cli>\u003ccode>Reviewer agent.\u003c/code> (no trigger)\u003c/li>\n          \u003cli>A 600-word essay about review philosophy (costs context in every session)\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n      \u003cdiv>\n        \u003ch4>Strong\u003c/h4>\n        \u003cul>\n          \u003cli>\u003ccode>Reviews the current branch for bugs, security issues and scope creep. Use after code changes, before opening a pull request.\u003c/code>\u003c/li>\n          \u003cli>\u003ccode>Writes failing tests that reproduce a reported bug. Use before fixing any bug.\u003c/code>\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n    \u003c/div>\n    \u003cp>Phrases like \"Use proactively after code changes\" make delegation more likely without being asked. You can\n      always delegate explicitly too (\"Use the reviewer subagent on this branch\"), and scripts do exactly that.\n      Descriptions are loaded into every session's context, so keep them to a sentence or two: Claude Code warns at\n      startup when the combined descriptions of your custom subagents pass 15,000 tokens.\u003c/p>\n    \u003caside class=\"callout think\">\u003cp>Two of your agents have the descriptions \"Fixes bugs\" and \"Fixes failing CI\n      builds\". A user says \"CI is red because of a bug in search\". Which one should run? Rewrite the descriptions so\n      the answer is obvious.\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"prompt\">\n    \u003ch2>Prompts with a shape\u003c/h2>\n    \u003cp>The body of the file is the subagent's system prompt. Agents given a vague role (\"You are a great\n      reviewer\") produce vague work. Agents given a \u003cem>shape\u003c/em> produce work you can check. A reliable shape has\n      five parts:\u003c/p>\n    \u003col>\n      \u003cli>\u003cstrong>Role and boundary.\u003c/strong> One sentence: what it does and what it never does. \"You review code.\n        You never edit files.\"\u003c/li>\n      \u003cli>\u003cstrong>Inputs.\u003c/strong> What it should read first: the spec, the diff, the failing log.\u003c/li>\n      \u003cli>\u003cstrong>Process.\u003c/strong> A few numbered steps. Not a script, but the order that avoids common mistakes\n        (read before you act, run the tests before you finish).\u003c/li>\n      \u003cli>\u003cstrong>Output format.\u003c/strong> Exactly what to return, ideally in a form a script can check: labelled\n        findings, a table, a JSON object, a final \u003ccode>VERDICT:\u003c/code> line.\u003c/li>\n      \u003cli>\u003cstrong>Stop conditions.\u003c/strong> When to stop and hand back instead of pushing on: the spec is wrong,\n        a decision belongs to a human, the same fix failed twice.\u003c/li>\n    \u003c/ol>\n    \u003cpre>\u003ccode class=\"language-markdown\">You review code. You never edit files.\n\nInputs: the diff of the current branch against main (`git diff main...HEAD`) and the\nspec in specs/ if there is one.\n\nProcess:\n1. Read the whole diff, then the spec.\n2. Check that every acceptance criterion is implemented and tested.\n3. Look for bugs, missing error handling, security problems, and changes outside the spec's scope.\n\nOutput: one line per finding, `BLOCKING` or `NIT`, then file:line, the problem, and a fix.\nEnd with exactly one line: `VERDICT: approve` or `VERDICT: changes requested`.\n\nStop and say so if there is no diff, or if the change needs a decision only a human can make.\nSay plainly when you find nothing blocking. Do not invent problems to look thorough.\u003c/code>\u003c/pre>\n    \u003cp>The last line matters more than it looks. Models asked to review tend to find \u003cem>something\u003c/em>; telling it\n      that \"nothing blocking\" is an acceptable answer cuts false alarms. The \u003ccode>VERDICT:\u003c/code> line matters\n      because in Stage 2 a script will read it to decide whether the fleet moves on.\u003c/p>\n    \u003caside class=\"callout tip\">\u003cp>\u003cstrong>Remember:\u003c/strong> role and boundary, inputs, process, output format, stop\n      conditions. If a script will read the output, make the format exact.\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"tools\">\n    \u003ch2>Least-privilege tools\u003c/h2>\n    \u003cp>Pick tools from what the role must \u003cem>do\u003c/em>, not what might be handy:\u003c/p>\n    \u003cdiv class=\"scroll\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>Role\u003c/th>\u003cth>Needs to\u003c/th>\u003cth>Tools\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>Triager\u003c/td>\u003ctd>Read the issue and find the code area\u003c/td>\u003ctd>\u003ccode>Read, Grep, Glob\u003c/code> (plus Bash for \u003ccode>gh issue view\u003c/code>, limited by rules)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Planner\u003c/td>\u003ctd>Read code, write a spec\u003c/td>\u003ctd>\u003ccode>Read, Grep, Glob, Write\u003c/code>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Implementer\u003c/td>\u003ctd>Read, edit, run tests, delegate tests and review\u003c/td>\u003ctd>\u003ccode>Read, Grep, Glob, Edit, Write, Bash, Agent\u003c/code>, in a worktree\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Test writer\u003c/td>\u003ctd>Read the spec, write tests, run them\u003c/td>\u003ctd>\u003ccode>Read, Grep, Glob, Write, Edit, Bash\u003c/code>, kept to \u003ccode>tests/\u003c/code> by a hook\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Reviewer\u003c/td>\u003ctd>Read the diff and the code\u003c/td>\u003ctd>\u003ccode>Read, Grep, Glob, Bash\u003c/code> with \u003ccode>disallowedTools: Edit, Write\u003c/code>\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n    \u003cp>Notice that tool lists alone can't express \"only in \u003ccode>tests/\u003c/code>\" or \"only \u003ccode>git diff\u003c/code>\".\n      For that you combine tools with permission rules and hooks. The tools field is the coarse lock; hooks are the\n      fine one.\u003c/p>\n    \u003cdiv class=\"runnable\" data-title=\"Does this agent have more than it needs?\">\n\u003ctextarea>\nimport fleetlab\n\nreviewer = \"\"\"---\nname: reviewer\ndescription: Reviews diffs. Use after code changes.\ntools: Read, Grep, Glob, Bash, Edit\nmaxTurns: 25\n---\nYou review code. You never edit files.\n\"\"\"\nspec = fleetlab.check_agent(reviewer, \"reviewer.md\")\nprint(\"tools:\", sorted(spec.tools))\nprint(\"can change state:\", spec.can_write())\nprint(\"edit tools:\", sorted(spec.tools & fleetlab.WRITE_TOOLS))\n\u003c/textarea>\n    \u003c/div>\n    \u003cp>Its prompt says it never edits, but nothing stops it. Remove \u003ccode>Edit\u003c/code> and add\n      \u003ccode>disallowedTools: Edit, Write\u003c/code>, then run it again. \u003ccode>can_write()\u003c/code> stays true because of\n      \u003ccode>Bash\u003c/code>: that's honest, since a shell can edit files. You'll close that gap with a hook in M04.\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"budgets\">\n    \u003ch2>Model, effort, turns, and isolation\u003c/h2>\n    \u003cp>\u003cstrong>Model.\u003c/strong> Match the model to the stakes and the volume. Triage of every new issue is\n      high-volume and simple: a small model is right. A plan or a review decides what code gets written or merged:\n      use the strongest model you have. \u003ccode>inherit\u003c/code> uses the caller's model, which is convenient but makes\n      cost depend on who called.\u003c/p>\n    \u003cp>\u003cstrong>Turns.\u003c/strong> \u003ccode>maxTurns\u003c/code> stops a subagent after that many turns and returns what it has.\n      Set it from what the job needs plus headroom: a reviewer that needs 40 turns is probably reading the whole\n      repository. When a well-scoped agent keeps hitting its limit, that's a signal the task or the context is wrong,\n      not that the limit is too low.\u003c/p>\n    \u003cp>\u003cstrong>Isolation.\u003c/strong> \u003ccode>isolation: worktree\u003c/code> runs the subagent in a temporary git worktree, a\n      separate checkout of the repository. Two builders working at once can't overwrite each other's files, and a\n      failed attempt is just a worktree to throw away.\u003c/p>\n    \u003cp>\u003cstrong>Background.\u003c/strong> Subagents run in the foreground by default, blocking the caller until they\n      finish. Background subagents run while the caller keeps working, and their results arrive as notifications.\n      By default up to 20 can run at once.\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"testing\">\n    \u003ch2>Using and testing a subagent\u003c/h2>\n    \u003cp>Once the file exists, there are three ways it runs:\u003c/p>\n    \u003cul>\n      \u003cli>\u003cstrong>Automatic delegation:\u003c/strong> the main session picks it from its description.\u003c/li>\n      \u003cli>\u003cstrong>Explicit:\u003c/strong> \"Use the reviewer subagent to review this branch.\"\u003c/li>\n      \u003cli>\u003cstrong>As the main agent of a run:\u003c/strong> \u003ccode>claude --agent reviewer\u003c/code>, or from a script with\n        \u003ccode>-p\u003c/code>. With \u003ccode>--bare\u003c/code>, pass definitions as JSON with \u003ccode>--agents\u003c/code>.\u003c/li>\n    \u003c/ul>\n    \u003cp>Test an agent the way you'd test code: with a fixed input and a known right answer. For a reviewer that means\n      a \u003cstrong>seeded change\u003c/strong>: a diff you wrote with a bug you know about. For shelf, a good one \"fixes\"\n      issue #1 by lower-casing the search term but not the titles, so the bug just moves. Run the reviewer on it\n      several times. Does it find the bug every time? Does it report problems that aren't there? Does it end with\n      the \u003ccode>VERDICT:\u003c/code> line? Change one thing in the prompt at a time and run again.\u003c/p>\n    \u003cpre data-label=\"Terminal\">\u003ccode class=\"language-bash\">cd work/m02-lab1\ngit init -q && git add -A && git commit -qm base\ngit apply ../../labs/m02-lab1/seeded/bad-fix.patch   # the seeded change\nclaude -p \"Use the reviewer subagent to review the uncommitted changes.\" --allowedTools \"Read,Grep,Glob,Bash(git diff *)\"\u003c/code>\u003c/pre>\n    \u003caside class=\"callout warn\">\u003cp>Model output varies from run to run. One good review proves little. Run the same\n      seeded change three to five times before you trust a prompt change. Stage 2 turns this into an evaluation set\n      you can rerun on every change to your fleet.\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"practice\">\n    \u003ch2>Practice\u003c/h2>\n    \u003cp>Five exercises: writing definitions, choosing tools, linting descriptions and prompts, and resolving which\n      definition wins.\u003c/p>\n\n    \u003cdiv class=\"exercise\" data-id=\"m02-e1\" data-title=\"Write a read-only reviewer\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Set \u003ccode>agent\u003c/code> to a complete subagent definition named \u003ccode>reviewer\u003c/code> that passes\n          \u003ccode>fleetlab.check_agent(agent, \"reviewer.md\")\u003c/code> with no problems and also:\u003c/p>\n        \u003cul>\n          \u003cli>has \u003ccode>Read\u003c/code>, \u003ccode>Grep\u003c/code> and \u003ccode>Glob\u003c/code>, and no edit tools after\n            \u003ccode>disallowedTools\u003c/code> is applied;\u003c/li>\n          \u003cli>has a description that includes the word \u003ccode>Use\u003c/code> (when to delegate) and is under 200\n            characters;\u003c/li>\n          \u003cli>sets \u003ccode>maxTurns\u003c/code> between 5 and 40 and a \u003ccode>model\u003c/code>;\u003c/li>\n          \u003cli>has a prompt that mentions \u003ccode>BLOCKING\u003c/code>, \u003ccode>NIT\u003c/code>, and \u003ccode>VERDICT:\u003c/code>.\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\nagent = \"\"\"---\nname: reviewer\ndescription: TODO\n---\n\nTODO\n\"\"\"\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\nimport fleetlab\n\ndef spec():\n    return fleetlab.check_agent(agent, \"reviewer.md\")\n\ndef test_valid():\n    assert spec().problems == [], \"; \".join(spec().problems)\n\ndef test_tools():\n    tools = spec().tools\n    assert tools is not None, \"set tools explicitly; inheriting every tool is not least privilege\"\n    assert {\"Read\", \"Grep\", \"Glob\"} \u003c= tools, \"the reviewer needs Read, Grep and Glob\"\n    assert not (tools & fleetlab.WRITE_TOOLS), f\"no edit tools: found {sorted(tools & fleetlab.WRITE_TOOLS)}\"\n\ndef test_description():\n    d = str(spec().meta.get(\"description\", \"\"))\n    assert \"Use\" in d, \"say when to use it\"\n    assert len(d) \u003c 200, \"keep the description under 200 characters\"\n\ndef test_budget_and_model():\n    m = spec().meta\n    assert isinstance(m.get(\"maxTurns\"), int) and 5 \u003c= m[\"maxTurns\"] \u003c= 40, \"maxTurns between 5 and 40\"\n    assert m.get(\"model\"), \"choose a model\"\n\ndef test_output_format():\n    p = spec().prompt\n    for word in (\"BLOCKING\", \"NIT\", \"VERDICT:\"):\n        assert word in p, f\"the prompt should define the output with {word}\"\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>Start from the example file in \"Anatomy of a subagent file\" and\n        the prompt in \"Prompts with a shape\". Check your work with\n        \u003ccode>print(fleetlab.check_agent(agent, \"reviewer.md\").problems)\u003c/code>.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">agent = \"\"\"---\nname: reviewer\ndescription: Reviews the current branch for bugs and scope creep. Use after code changes, before a pull request.\ntools: Read, Grep, Glob, Bash\ndisallowedTools: Edit, Write\nmodel: sonnet\nmaxTurns: 25\n---\n\nYou review code. You never edit files.\nReport each finding as BLOCKING or NIT with file:line, the problem, and a fix.\nEnd with one line: VERDICT: approve or VERDICT: changes requested.\n\"\"\"\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"exercise\" data-id=\"m02-e2\" data-title=\"Least-privilege tools\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Write \u003ccode>tools_for(needs)\u003c/code>. \u003ccode>needs\u003c/code> is a set drawn from \u003ccode>\"read\"\u003c/code>,\n          \u003ccode>\"search\"\u003c/code>, \u003ccode>\"edit\"\u003c/code>, \u003ccode>\"create\"\u003c/code>, \u003ccode>\"run\"\u003c/code>, and\n          \u003ccode>\"delegate\"\u003c/code>. Return the sorted list of the smallest set of Claude Code tools that covers them:\n          read → \u003ccode>Read\u003c/code>; search → \u003ccode>Grep\u003c/code> and \u003ccode>Glob\u003c/code>; edit → \u003ccode>Edit\u003c/code>; create\n          → \u003ccode>Write\u003c/code>; run → \u003ccode>Bash\u003c/code>; delegate → \u003ccode>Agent\u003c/code>.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\ndef tools_for(needs):\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\ndef test_reviewer():\n    assert tools_for({\"read\", \"search\"}) == [\"Glob\", \"Grep\", \"Read\"]\n\ndef test_builder():\n    assert tools_for({\"read\", \"search\", \"edit\", \"create\", \"run\", \"delegate\"}) == [\"Agent\", \"Bash\", \"Edit\", \"Glob\", \"Grep\", \"Read\", \"Write\"]\n\ndef test_planner():\n    assert tools_for({\"read\", \"search\", \"create\"}) == [\"Glob\", \"Grep\", \"Read\", \"Write\"], \"a planner creates a spec but never edits code\"\n\ndef test_nothing():\n    assert tools_for(set()) == []\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>A dictionary from need to a tuple of tools, then a set union, then\n        \u003ccode>sorted\u003c/code>.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">NEED_TOOLS = {\n    \"read\": (\"Read\",), \"search\": (\"Grep\", \"Glob\"), \"edit\": (\"Edit\",),\n    \"create\": (\"Write\",), \"run\": (\"Bash\",), \"delegate\": (\"Agent\",),\n}\n\ndef tools_for(needs):\n    tools = set()\n    for need in needs:\n        tools.update(NEED_TOOLS[need])\n    return sorted(tools)\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"exercise\" data-id=\"m02-e3\" data-title=\"Lint a description\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Write \u003ccode>description_problems(text)\u003c/code> returning a list of strings, one per problem:\u003c/p>\n        \u003cul>\n          \u003cli>\u003ccode>\"too long\"\u003c/code> when longer than 250 characters;\u003c/li>\n          \u003cli>\u003ccode>\"no trigger\"\u003c/code> when it contains neither \u003ccode>\"Use \"\u003c/code> nor \u003ccode>\"use \"\u003c/code>;\u003c/li>\n          \u003cli>\u003ccode>\"too vague\"\u003c/code> when, lower-cased, it contains any of \u003ccode>\"helps with\"\u003c/code>,\n            \u003ccode>\"does stuff\"\u003c/code>, \u003ccode>\"general purpose\"\u003c/code>.\u003c/li>\n        \u003c/ul>\n        \u003cp>Report problems in that order. A good description returns an empty list.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\ndef description_problems(text):\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\ndef test_good():\n    assert description_problems(\"Writes failing tests that reproduce a bug. Use before fixing any bug.\") == []\n\ndef test_vague_without_trigger():\n    assert description_problems(\"Helps with code.\") == [\"no trigger\", \"too vague\"]\n\ndef test_long():\n    assert description_problems(\"Use it. \" + \"x\" * 260) == [\"too long\"]\n\ndef test_lowercase_trigger():\n    assert description_problems(\"Reviews diffs; use after edits.\") == []\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>Build the list with three independent \u003ccode>if\u003c/code> checks in\n        the stated order.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">VAGUE = (\"helps with\", \"does stuff\", \"general purpose\")\n\ndef description_problems(text):\n    problems = []\n    if len(text) > 250:\n        problems.append(\"too long\")\n    if \"Use \" not in text and \"use \" not in text:\n        problems.append(\"no trigger\")\n    if any(v in text.lower() for v in VAGUE):\n        problems.append(\"too vague\")\n    return problems\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"exercise\" data-id=\"m02-e4\" data-title=\"Does the prompt have a shape?\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Write \u003ccode>missing_parts(prompt)\u003c/code> that returns, in this order, which of these parts a prompt is\n          missing, using simple case-insensitive keyword checks:\u003c/p>\n        \u003cul>\n          \u003cli>\u003ccode>\"boundary\"\u003c/code>: none of \u003ccode>\"never\"\u003c/code>, \u003ccode>\"do not\"\u003c/code>, \u003ccode>\"don't\"\u003c/code>;\u003c/li>\n          \u003cli>\u003ccode>\"output\"\u003c/code>: none of \u003ccode>\"output\"\u003c/code>, \u003ccode>\"report\"\u003c/code>, \u003ccode>\"return\"\u003c/code>;\u003c/li>\n          \u003cli>\u003ccode>\"stop\"\u003c/code>: none of \u003ccode>\"stop\"\u003c/code>, \u003ccode>\"hand back\"\u003c/code>, \u003ccode>\"escalate\"\u003c/code>.\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\ndef missing_parts(prompt):\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\nGOOD = \"You review code. You never edit files. Report each finding. Stop if there is no diff.\"\n\ndef test_complete():\n    assert missing_parts(GOOD) == []\n\ndef test_vague():\n    assert missing_parts(\"You are an excellent reviewer.\") == [\"boundary\", \"output\", \"stop\"]\n\ndef test_case_insensitive():\n    assert missing_parts(\"NEVER edit. RETURN a list. ESCALATE when unsure.\") == []\n\ndef test_partial():\n    assert missing_parts(\"Do not edit files. Return findings.\") == [\"stop\"]\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>Lower-case the prompt once. A part is missing when\n        \u003ccode>not any(word in text for word in words)\u003c/code>.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">PARTS = [\n    (\"boundary\", (\"never\", \"do not\", \"don't\")),\n    (\"output\", (\"output\", \"report\", \"return\")),\n    (\"stop\", (\"stop\", \"hand back\", \"escalate\")),\n]\n\ndef missing_parts(prompt):\n    text = prompt.lower()\n    return [name for name, words in PARTS if not any(w in text for w in words)]\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"exercise\" data-id=\"m02-e5\" data-title=\"Which definition wins?\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Write \u003ccode>resolve(definitions)\u003c/code>. Each definition is a dict with \u003ccode>\"name\"\u003c/code> and\n          \u003ccode>\"scope\"\u003c/code>, where scope is one of \u003ccode>\"managed\"\u003c/code>, \u003ccode>\"cli\"\u003c/code>,\n          \u003ccode>\"project\"\u003c/code>, \u003ccode>\"user\"\u003c/code>, \u003ccode>\"plugin\"\u003c/code> (highest priority first). Return a dict\n          mapping each name to the scope of the definition that wins.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\ndef resolve(definitions):\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\ndef test_project_beats_user():\n    defs = [{\"name\": \"reviewer\", \"scope\": \"user\"}, {\"name\": \"reviewer\", \"scope\": \"project\"}]\n    assert resolve(defs) == {\"reviewer\": \"project\"}\n\ndef test_managed_beats_all():\n    defs = [{\"name\": \"r\", \"scope\": \"cli\"}, {\"name\": \"r\", \"scope\": \"managed\"}, {\"name\": \"r\", \"scope\": \"project\"}]\n    assert resolve(defs) == {\"r\": \"managed\"}\n\ndef test_independent_names():\n    defs = [{\"name\": \"a\", \"scope\": \"plugin\"}, {\"name\": \"b\", \"scope\": \"user\"}, {\"name\": \"a\", \"scope\": \"cli\"}]\n    assert resolve(defs) == {\"a\": \"cli\", \"b\": \"user\"}\n\ndef test_empty():\n    assert resolve([]) == {}\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>Give each scope a rank with\n        \u003ccode>ORDER.index(scope)\u003c/code>; for each name keep the definition with the lowest rank.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">ORDER = [\"managed\", \"cli\", \"project\", \"user\", \"plugin\"]\n\ndef resolve(definitions):\n    winners = {}\n    for d in definitions:\n        current = winners.get(d[\"name\"])\n        if current is None or ORDER.index(d[\"scope\"]) \u003c ORDER.index(current):\n            winners[d[\"name\"]] = d[\"scope\"]\n    return winners\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"mini-project\">\n    \u003ch2>Lab: your fleet's first two agents\u003c/h2>\n    \u003cdiv class=\"project-box\">\n      \u003cdiv class=\"widget-head\">\u003cspan class=\"w-kind\">Lab m02-lab1\u003c/span>\u003cspan class=\"w-title\">A reviewer and a test writer for shelf\u003c/span>\u003c/div>\n      \u003cdiv class=\"widget-body\">\n        \u003cp>Write \u003ccode>.claude/agents/reviewer.md\u003c/code> and \u003ccode>.claude/agents/test-writer.md\u003c/code> for the shelf\n          project. The README gives the specification for each: the role, the tools it may and may not have, its\n          budget, and the output format a later script will depend on. The checks parse both files and enforce the\n          spec. The live check runs your reviewer with the real \u003ccode>claude\u003c/code> CLI on a seeded bad fix for\n          issue #1 and expects it to block the change.\u003c/p>\n        \u003cpre data-label=\"Terminal\">\u003ccode class=\"language-bash\">pixi run start m02-lab1\n# read labs/m02-lab1/README.md, write the two agent files in work/m02-lab1/.claude/agents/\npixi run grade m02-lab1\npixi run grade-live m02-lab1   # optional: run your reviewer on the seeded change\u003c/code>\u003c/pre>\n        \u003cul class=\"checklist\" data-id=\"m02-lab1\">\n          \u003cli>Both files pass \u003ccode>check_agent\u003c/code> with no problems\u003c/li>\n          \u003cli>The reviewer cannot edit or write files\u003c/li>\n          \u003cli>The test writer's prompt keeps it to tests and asks for a failing test first\u003c/li>\n          \u003cli>Both have a model, a turn budget, and a description that says when to use them\u003c/li>\n          \u003cli>The reviewer's output format ends with a \u003ccode>VERDICT:\u003c/code> line\u003c/li>\n          \u003cli>Ran the reviewer on the seeded change at least three times and recorded what it found\u003c/li>\n        \u003c/ul>\n        \u003cp>\u003cstrong>Stretch:\u003c/strong> write a third agent, \u003ccode>triager\u003c/code>, that classifies shelf's five issues,\n          and see whether it spots the prompt injection in issue #5.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"quiz\">\n    \u003ch2>Quiz\u003c/h2>\n    \u003cdiv class=\"quiz\" data-id=\"m02-quiz\">\n\u003cscript type=\"application/json\">\n{\"title\": \"Writing a Subagent quiz\", \"passScore\": 0.7, \"questions\": [\n  {\"type\": \"multi\", \"prompt\": \"What does a subagent get that the main conversation does not share?\", \"options\": [\"Its own context window\", \"Its own system prompt (the file's body)\", \"Its own tool set and limits\", \"A copy of the caller's full history\"], \"answer\": [0, 1, 2], \"explanation\": \"\u003cp>A subagent starts fresh with its own prompt and tools. It doesn't inherit the caller's history; it gets the task it's given.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"Which two frontmatter fields are required?\", \"options\": [\"name and tools\", \"name and description\", \"description and model\", \"name and maxTurns\"], \"answer\": 1, \"explanation\": \"\u003cp>Only \u003ccode>name\u003c/code> and \u003ccode>description\u003c/code> are required. Everything else has a default, which is why setting \u003ccode>tools\u003c/code> and \u003ccode>maxTurns\u003c/code> deliberately matters.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"A personal \u003ccode>~/.claude/agents/reviewer.md\u003c/code> and a project \u003ccode>.claude/agents/reviewer.md\u003c/code> both exist. Which runs in that project?\", \"options\": [\"The personal one\", \"The project one\", \"Both, in turn\", \"Neither; names must be unique\"], \"answer\": 1, \"explanation\": \"\u003cp>Project definitions take priority over user definitions with the same name.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"What happens if you omit \u003ccode>tools\u003c/code>?\", \"options\": [\"The agent gets no tools\", \"The agent inherits the caller's tools\", \"Only Read is allowed\", \"Claude Code refuses to load it\"], \"answer\": 1, \"explanation\": \"\u003cp>Omitted tools are inherited. For least privilege, always list them.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"What decides whether Claude delegates a request to your subagent automatically?\", \"options\": [\"Its name\", \"Its description\", \"Its model\", \"Its file size\"], \"answer\": 1, \"explanation\": \"\u003cp>Claude matches requests against descriptions. Say what the agent does and when to use it.\u003c/p>\"},\n  {\"type\": \"multi\", \"prompt\": \"Which belong in a well-shaped prompt?\", \"options\": [\"Role and boundary\", \"Inputs to read first\", \"A short process\", \"An exact output format\", \"Stop conditions\", \"Flattery about how skilled it is\"], \"answer\": [0, 1, 2, 3, 4], \"explanation\": \"\u003cp>Role, inputs, process, output, stop. Flattery adds tokens and no behaviour.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"Why tell a reviewer that \\\"nothing blocking\\\" is an acceptable answer?\", \"options\": [\"To save tokens\", \"Review prompts push models to find something; permission to say nothing cuts false alarms\", \"It is required syntax\", \"So it stops earlier\"], \"answer\": 1, \"explanation\": \"\u003cp>Without it, reviews tend to invent minor problems. Explicit permission makes clean reviews possible.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"A reviewer has \u003ccode>tools: Read, Grep, Glob, Bash\u003c/code> and \u003ccode>disallowedTools: Edit, Write\u003c/code>. Can it still change files?\", \"options\": [\"No, it is read-only\", \"Yes, through Bash; close that with permission rules and hooks\", \"Only if it is in plan mode\", \"Only through Agent\"], \"answer\": 1, \"explanation\": \"\u003cp>A shell can edit files. Tools are the coarse lock; permission rules and hooks are the fine one.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"Two builder agents run at once on different issues. Which field prevents them overwriting each other?\", \"options\": [\"background: true\", \"isolation: worktree\", \"omitClaudeMd: true\", \"memory: project\"], \"answer\": 1, \"explanation\": \"\u003cp>Each runs in its own temporary git worktree, a separate checkout.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"A well-scoped agent keeps hitting \u003ccode>maxTurns\u003c/code>. What is the best first response?\", \"options\": [\"Double maxTurns\", \"Look at the transcript: the task or its context is probably wrong\", \"Switch to bypassPermissions\", \"Remove maxTurns\"], \"answer\": 1, \"explanation\": \"\u003cp>Hitting the budget is a signal. Read the transcript for drift, starvation, or a doom loop before raising limits.\u003c/p>\"},\n  {\"type\": \"text\", \"prompt\": \"Which tool should you leave out of an agent's \u003ccode>tools\u003c/code> so it cannot start subagents of its own?\", \"answer\": [\"Agent\"], \"explanation\": \"\u003cp>Without the Agent tool, a subagent can't delegate further.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"Why test a reviewer on a seeded change several times?\", \"options\": [\"The first run is always wrong\", \"Model output varies; one good run proves little\", \"Claude Code caches the first answer\", \"To warm up the model\"], \"answer\": 1, \"explanation\": \"\u003cp>Repeat runs show whether the agent catches the bug reliably and whether it invents problems.\u003c/p>\"}\n]}\n\u003c/script>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"recap\">\n    \u003ch2>Recap\u003c/h2>\n    \u003cul>\n      \u003cli>A subagent has its own context, prompt, and tools, and returns a summary. Use one for focused work that\n        benefits from a fresh context or tighter tools.\u003c/li>\n      \u003cli>Files live in \u003ccode>.claude/agents/\u003c/code> (commit them). Managed and \u003ccode>--agents\u003c/code> definitions win\n        over project, which wins over user.\u003c/li>\n      \u003cli>Always set \u003ccode>tools\u003c/code> and \u003ccode>maxTurns\u003c/code>; add \u003ccode>disallowedTools\u003c/code> as a second lock;\n        use \u003ccode>isolation: worktree\u003c/code> for agents that edit.\u003c/li>\n      \u003cli>The description is a routing rule: what it does and when to use it, in a sentence or two.\u003c/li>\n      \u003cli>Prompts need a role and boundary, inputs, process, exact output, and stop conditions.\u003c/li>\n      \u003cli>Test agents on seeded changes, several runs each, one prompt change at a time.\u003c/li>\n    \u003c/ul>\n    \u003cdiv class=\"flashcards\" data-title=\"Writing a subagent\">\n      \u003cscript type=\"application/json\">\n      [{\"front\": \"Required frontmatter fields\", \"back\": \"\u003ccode>name\u003c/code> and \u003ccode>description\u003c/code>.\"},\n       {\"front\": \"Where project subagents live\", \"back\": \"\u003ccode>.claude/agents/&lt;name&gt;.md\u003c/code>, committed to the repo.\"},\n       {\"front\": \"Omitting \u003ccode>tools\u003c/code> means…\", \"back\": \"The agent inherits the caller's tools.\"},\n       {\"front\": \"What the description is for\", \"back\": \"Routing: Claude reads it to decide when to delegate.\"},\n       {\"front\": \"Five parts of a prompt\", \"back\": \"Role and boundary, inputs, process, output format, stop conditions.\"},\n       {\"front\": \"\u003ccode>isolation: worktree\u003c/code>\", \"back\": \"Runs the subagent in a temporary git worktree so parallel editors can't collide.\"},\n       {\"front\": \"\u003ccode>disallowedTools\u003c/code>\", \"back\": \"Tools removed from the inherited or listed set; a second lock on agents that must not edit.\"},\n       {\"front\": \"Stop a subagent from delegating\", \"back\": \"Leave \u003ccode>Agent\u003c/code> out of its tools.\"},\n       {\"front\": \"Name collision priority\", \"back\": \"Managed > --agents > project > user > plugin.\"},\n       {\"front\": \"How to test an agent\", \"back\": \"A seeded change with a known right answer, run several times, one prompt change at a time.\"}]\n      \u003c/script>\n    \u003c/div>\n    \u003ch3>Going further\u003c/h3>\n    \u003cul>\n      \u003cli>\u003ca href=\"https://code.claude.com/docs/en/sub-agents\">Claude Code: Create custom subagents\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"../reference/cheatsheet.html\">Agent and hook cheat sheet\u003c/a>\u003c/li>\n      \u003cli>Next: \u003ca href=\"m03-context-engineering.html\">M03 Context Engineering\u003c/a>, where you decide what every agent reads before it starts\u003c/li>\n    \u003c/ul>\n  \u003c/section>","exercises":["m02-e1","m02-e2","m02-e3","m02-e4","m02-e5"],"quizzes":["m02-quiz"],"checklists":{"m02-lab1":6}},"modules/m03-context-engineering.html":{"id":"m03","kind":"module","title":"M03 · Context Engineering · Coding Agent Fleets Practicum","html":"\u003cheader class=\"lesson-hero\">\n    \u003cp class=\"eyebrow\">Stage 1 · One Agent · Module 03\u003c/p>\n    \u003ch1>Context Engineering\u003c/h1>\n    \u003cp class=\"lede\">An agent can only act on what is in its context window. Some of that you choose: the project\n      instructions every agent reads, the skills it can pull in, the spec it's handed. The rest it gathers while\n      working. This module is about choosing well: what loads at startup and what it costs, how to write the\n      AGENTS.md every tool in your fleet will read, how skills load detail only when it's needed, and how to keep\n      long runs from losing the plot.\u003c/p>\n    \u003cdiv class=\"lesson-meta\">\u003cspan>⏱ ~2 hours\u003c/span>\u003cspan>Prerequisites: \u003ca href=\"m02-writing-a-subagent.html\">M02 Writing a Subagent\u003c/a>\u003c/span>\u003c/div>\n    \u003cul class=\"objectives\">\n      \u003cli>List what loads into an agent's context before it does any work, and estimate what it costs\u003c/li>\n      \u003cli>Explain how CLAUDE.md files and imports load, and use AGENTS.md as one source of instructions for every tool\u003c/li>\n      \u003cli>Write an AGENTS.md with commands that actually run, a map, and rules, kept short\u003c/li>\n      \u003cli>Write a skill in the Agent Skills format and explain its three levels of progressive disclosure\u003c/li>\n      \u003cli>Decide whether a rule belongs in AGENTS.md, a skill, or a hook\u003c/li>\n      \u003cli>Use subagents and handoff files to keep each agent's context focused, and plan for compaction\u003c/li>\n    \u003c/ul>\n  \u003c/header>\n\n  \u003csection class=\"lesson-section\" id=\"what-loads\">\n    \u003ch2>What's in the window before the agent starts\u003c/h2>\n    \u003cp>The \u003cstrong>context window\u003c/strong> is everything the model sees on a request: instructions, tool\n      definitions, conversation so far, and tool results. It has a fixed size, every token in it costs money on every\n      request, and models follow instructions less reliably as it fills with things that don't matter. Before your\n      agent reads a single file of code, its window already holds:\u003c/p>\n    \u003cdiv class=\"scroll\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>What\u003c/th>\u003cth>Who controls it\u003c/th>\u003cth>Typical size\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>Claude Code's system prompt and built-in tool definitions\u003c/td>\u003ctd>The builder harness\u003c/td>\u003ctd>Large, fixed\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>CLAUDE.md files (and anything they import)\u003c/td>\u003ctd>You\u003c/td>\u003ctd>Whatever you write\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Names and descriptions of every skill\u003c/td>\u003ctd>You\u003c/td>\u003ctd>A line or two each\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Names and descriptions of every subagent\u003c/td>\u003ctd>You\u003c/td>\u003ctd>A line or two each\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Tool definitions from every connected MCP server\u003c/td>\u003ctd>You (by connecting servers)\u003c/td>\u003ctd>Can be very large\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>The task itself: the prompt, a spec, an issue\u003c/td>\u003ctd>Whoever starts the agent\u003c/td>\u003ctd>Varies\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n    \u003cp>A common rough estimate is about four characters per token for English and code. Paste your own CLAUDE.md\n      into the meter to see what it costs on every single request:\u003c/p>\n    \u003cdiv class=\"viz\" data-viz=\"token-meter\" data-config='{\"title\": \"What does your CLAUDE.md cost?\", \"calls\": 40, \"text\": \"# Project\\n\\nPaste your CLAUDE.md or AGENTS.md here.\"}'>\u003c/div>\n    \u003caside class=\"callout think\">\u003cp>An agent makes 40 requests to fix a bug. A 6,000-token CLAUDE.md is sent with every\n      one. How many tokens does it cost across the run? What if 4,000 of those tokens are a deployment runbook this\n      agent never needs?\u003c/p>\u003c/aside>\n    \u003caside class=\"callout tip\">\u003cp>\u003cstrong>Remember:\u003c/strong> what loads at startup is paid for on every request and\n      competes with the task for the model's attention. Load a short map up front; pull detail in when it's\n      needed.\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"claude-md\">\n    \u003ch2>CLAUDE.md, imports, and AGENTS.md\u003c/h2>\n    \u003cp>\u003cstrong>CLAUDE.md\u003c/strong> is the file Claude Code reads for project instructions. It loads from several\n      places and combines them:\u003c/p>\n    \u003cul>\n      \u003cli>\u003ccode>~/.claude/CLAUDE.md\u003c/code>: your personal instructions for every project.\u003c/li>\n      \u003cli>\u003ccode>CLAUDE.md\u003c/code> at the project root (and in parent directories above where you start): shared,\n        committed instructions.\u003c/li>\n      \u003cli>\u003ccode>CLAUDE.md\u003c/code> in a subdirectory: loaded when the agent works with files in that directory, so a\n        package can carry its own notes.\u003c/li>\n    \u003c/ul>\n    \u003cp>A line of the form \u003ccode>@path/to/file\u003c/code> \u003cstrong>imports\u003c/strong> that file's contents. That's the key to\n      working with more than one tool.\u003c/p>\n    \u003cp>\u003cstrong>AGENTS.md\u003c/strong> is an open, cross-tool standard for the same job: a README for coding agents. A\n      long list of tools read it, including GitHub Copilot, OpenAI Codex, Cursor, Gemini CLI, and Devin. If your\n      fleet will ever run under more than one tool (Claude Code at home, Copilot or Devin at work), keep the shared\n      instructions in AGENTS.md and make CLAUDE.md a thin pointer:\u003c/p>\n    \u003cpre>\u003ccode class=\"language-markdown\">@AGENTS.md\n\n## Claude Code notes\n\n- The Stop hook runs `make test-fast` before you finish.\u003c/code>\u003c/pre>\n    \u003cp>Now there is one source of truth. Claude Code reads AGENTS.md through the import; the other tools read it\n      directly. Claude-only notes stay in CLAUDE.md.\u003c/p>\n    \u003caside class=\"callout warn\">\u003cp>Some tools read only the start of AGENTS.md (Devin, for example, includes the first\n      16&nbsp;KiB). Put the most important things first and keep the whole file well under that.\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"agents-md\">\n    \u003ch2>Writing an AGENTS.md that earns its tokens\u003c/h2>\n    \u003cp>Every agent reads this file on every run, so every line must change what agents do. Three sections cover most\n      of it:\u003c/p>\n    \u003col>\n      \u003cli>\u003cstrong>Commands.\u003c/strong> The exact commands to set up, test, lint, and run the project. Agents use these\n        verbatim, so \u003cem>each one must work\u003c/em> when pasted into a fresh checkout. A wrong command here is worse than\n        none: every agent will run it, fail, and spend turns working out why.\u003c/li>\n      \u003cli>\u003cstrong>Map.\u003c/strong> Where things live, in a few lines. Which directory holds what, where tests go, what's\n        generated. This replaces the knowledge a senior engineer carries in their head.\u003c/li>\n      \u003cli>\u003cstrong>Rules.\u003c/strong> The handful of non-negotiables: never weaken tests, change only files in the spec's\n        scope, never commit secrets. Short, specific, and checkable.\u003c/li>\n    \u003c/ol>\n    \u003cp>Here's a compact example for a different project, a small invoicing service:\u003c/p>\n
