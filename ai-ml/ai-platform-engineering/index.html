<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AI Platform Engineering</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: same brief-style system as the other practicums; the home page walks the AI platform stack layer by layer. */
:root{
  --bg:#F2F4F6; --sheet:#FFFFFF; --ink:#121A26; --muted:#586374; --rule:#D8DEE5; --rule-strong:#AAB4C1;
  --accent:#17624F; --accent-ink:#FFFFFF; --accent-soft:#DCEEE6;
  --amber:#9C5E16; --amber-soft:#F8EAD3; --risk:#B23A2B; --risk-soft:#F8E1DD;
  --canvas:#FCFCFD; --canvas-dot:#DCE1E7;
  --f-display:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1118; --sheet:#141B25; --ink:#E3E8EF; --muted:#97A2B2; --rule:#263142; --rule-strong:#3D4C60;
  --accent:#5CC5A0; --accent-ink:#052219; --accent-soft:#12342A;
  --amber:#E5AE5C; --amber-soft:#33260F; --risk:#EE7B68; --risk-soft:#3A1C17;
  --canvas:#E9EDF1; --canvas-dot:#CBD3DC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1118; --sheet:#141B25; --ink:#E3E8EF; --muted:#97A2B2; --rule:#263142; --rule-strong:#3D4C60;
  --accent:#5CC5A0; --accent-ink:#052219; --accent-soft:#12342A;
  --amber:#E5AE5C; --amber-soft:#33260F; --risk:#EE7B68; --risk-soft:#3A1C17;
  --canvas:#E9EDF1; --canvas-dot:#CBD3DC; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.62;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2.1rem,6vw,3.4rem);letter-spacing:-.01em}
h2{font-size:clamp(1.5rem,4vw,2rem)}
h3{font-size:1.3rem;margin-top:.5rem}
h4{font-size:1.08rem}
p{margin:0}
code,pre{font-family:var(--f-mono);font-size:.85em}
:not(pre)>code{background:var(--accent-soft);padding:.05em .35em;border-radius:3px}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:1rem}
.prose{display:flex;flex-direction:column;gap:.85rem;max-width:68ch}
.prose ul,.prose ol{margin:0;padding-left:1.25rem;display:flex;flex-direction:column;gap:.35rem}
.prose blockquote{margin:0;border-left:3px solid var(--accent);padding:.3rem 0 .3rem 1rem;font-family:var(--f-display);font-style:italic;font-size:1.05rem}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;flex-direction:column;gap:.35rem;padding-block:.6rem .5rem}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:1rem}
.brand b{font-family:var(--f-display);font-size:1.15rem;font-weight:600}
.brand .meter{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.navscroll{overflow-x:auto;scrollbar-width:none;margin-inline:-4px}
.navscroll::-webkit-scrollbar{display:none}
nav.tabs{display:flex;gap:4px;padding:2px 4px;width:max-content}
nav.tabs button{font:600 .8rem/1 var(--f-body);color:var(--muted);background:none;border:1px solid transparent;border-radius:999px;padding:.5rem .75rem;cursor:pointer;white-space:nowrap;display:flex;gap:.4rem;align-items:center}
nav.tabs button:hover{color:var(--ink);border-color:var(--rule)}
nav.tabs button[aria-current="true"]{background:var(--ink);color:var(--sheet)}
nav.tabs .dot{width:7px;height:7px;border-radius:50%;background:var(--rule-strong)}
nav.tabs .dot.ok{background:var(--accent)}
nav.tabs .sep{width:1px;background:var(--rule);margin:4px 2px}
main{padding-block:1.5rem 4rem}

.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:clamp(16px,3.5vw,34px)}
.section{display:flex;flex-direction:column;gap:1.1rem}
.section+.section{margin-top:2.2rem;padding-top:2rem;border-top:1px solid var(--rule)}
.sec-head{display:flex;align-items:baseline;gap:.75rem;flex-wrap:wrap}
.sec-head .tag{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);padding:.12rem .45rem;border-radius:3px}

/* memo header block */
.memo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:3px double var(--ink);border-bottom:3px double var(--ink);margin-top:1.25rem}
.memo>div{padding:.5rem .7rem;border-right:1px solid var(--rule);min-width:0}
.memo>div:last-child{border-right:0}
.memo .k{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:block}
.memo .v{font-weight:600;font-variant-numeric:tabular-nums}
@media (max-width:560px){.memo{grid-template-columns:repeat(2,minmax(0,1fr))}.memo>div:nth-child(2){border-right:0}.memo>div:nth-child(-n+2){border-bottom:1px solid var(--rule)}}

.lvl{display:inline-flex;align-items:center;font:600 .7rem/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:.3rem .5rem;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.lvl.f{color:var(--accent)} .lvl.p{color:var(--amber)} .lvl.e{color:var(--risk)}

.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:.6rem .75rem;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--bg);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:.85rem}

.canvas{background-color:var(--canvas);background-image:radial-gradient(var(--canvas-dot) 1px,transparent 1.2px);background-size:16px 16px;border:1px solid var(--rule-strong);border-radius:var(--r);overflow:auto;padding:16px;min-height:120px;color:#121A26;display:flex;align-items:flex-start;justify-content:center}
.canvas .loading{font-family:var(--f-mono);font-size:.8rem;color:#586374;align-self:center}
.canvas .err{font-family:var(--f-mono);font-size:.78rem;color:#B23A2B;white-space:pre-wrap;width:100%}
.fig{display:flex;flex-direction:column;gap:.6rem;min-width:0}
.figcap{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:baseline;justify-content:space-between}
.notice{background:var(--bg);border-left:3px solid var(--accent);padding:.6rem .85rem;border-radius:0 var(--r) var(--r) 0;font-size:.93rem}
.notice ul{margin:.25rem 0 0;padding-left:1.1rem;display:flex;flex-direction:column;gap:.2rem}
pre.src{background:var(--bg);border:1px solid var(--rule);border-radius:var(--r);padding:.85rem 1rem;overflow-x:auto;margin:0;line-height:1.55;font-size:.8rem;white-space:pre}
.ba{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem}
@media (max-width:760px){.ba{grid-template-columns:minmax(0,1fr)}}
.ba>div{border:1px solid var(--rule);border-radius:var(--r);padding:1rem;display:flex;flex-direction:column;gap:.5rem;min-width:0}
.ba .before{border-top:3px solid var(--risk)} .ba .after{border-top:3px solid var(--accent)}
.ba .txt{font-size:.92rem;white-space:pre-wrap}

.btns{display:flex;flex-wrap:wrap;gap:.5rem}
.btn{font:600 .85rem/1 var(--f-body);border:1px solid var(--rule-strong);background:var(--sheet);color:var(--ink);padding:.6rem .9rem;border-radius:var(--r);cursor:pointer;display:inline-flex;align-items:center;gap:.4rem;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;padding-inline:.4rem;color:var(--accent)}
.btn.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* hero + line of sight */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(1rem,4vw,2.5rem);align-items:start}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.lede{font-size:1.08rem;max-width:56ch}
.los{display:flex;flex-direction:column;gap:.7rem;min-width:0}
.chain{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--ink);border-radius:var(--r);overflow:hidden}
.chain button{flex:1 1 auto;font:600 .78rem/1.15 var(--f-body);background:var(--sheet);color:var(--ink);border:0;border-right:1px solid var(--ink);padding:.6rem .5rem;cursor:pointer;min-width:84px;position:relative}
.chain button:last-child{border-right:0}
.chain button small{display:block;font:500 .62rem/1 var(--f-mono);letter-spacing:.08em;color:var(--muted);margin-bottom:.25rem}
.chain button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.chain button[aria-pressed="true"] small{color:var(--sheet);opacity:.7}
@media (max-width:560px){.chain button{flex:1 1 30%;border-bottom:1px solid var(--ink)}}
.loscard{border:1px solid var(--rule);border-radius:var(--r);padding:1rem;display:flex;flex-direction:column;gap:.65rem;background:var(--sheet)}
.loscard .big{font-family:var(--f-display);font-size:1.25rem;font-weight:600;line-height:1.3}
.kv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.6rem 1rem;font-size:.9rem}
@media (max-width:480px){.kv{grid-template-columns:minmax(0,1fr)}}
.kv .k{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block}

.path{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
@media (max-width:760px){.path{grid-template-columns:minmax(0,1fr)}}
.stage{border:1px solid var(--rule);border-radius:var(--r);padding:1rem;display:flex;flex-direction:column;gap:.5rem;background:var(--sheet)}
.stage ol{margin:0;padding-left:1.1rem;font-size:.92rem}
.bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.meterline{display:flex;align-items:center;gap:.6rem;font-family:var(--f-mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.meterline .bar{flex:1;min-width:80px}
button.link{background:none;border:0;padding:0;color:var(--ink);font:600 .95rem var(--f-body);cursor:pointer;text-align:left}
button.link:hover{color:var(--accent);text-decoration:underline}
.chk{font-family:var(--f-mono);font-size:.8rem}
.chk.ok{color:var(--accent)} .chk.no{color:var(--rule-strong)}

.q{border:1px solid var(--rule);border-radius:var(--r);padding:1rem;display:flex;flex-direction:column;gap:.6rem;margin:0}
.q .qn{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);letter-spacing:.08em}
.q legend{font-weight:600;padding:0}
.opt{display:flex;gap:.6rem;align-items:flex-start;padding:.5rem .6rem;border:1px solid var(--rule);border-radius:var(--r);cursor:pointer;font-size:.95rem}
.opt input{margin-top:.3rem;accent-color:var(--accent)}
.opt.right{border-color:var(--accent);background:var(--accent-soft)}
.opt.wrong{border-color:var(--risk);background:var(--risk-soft)}
.why{font-size:.9rem;padding:.6rem .8rem;border-radius:var(--r);background:var(--bg)}
.score{font-family:var(--f-display);font-size:1.35rem;font-weight:600}

.reqs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.4rem}
.reqs label{display:flex;gap:.55rem;align-items:flex-start;font-size:.93rem;cursor:pointer}
.reqs input{margin-top:.32rem;accent-color:var(--accent)}
.steps{margin:0;padding-left:1.3rem;display:flex;flex-direction:column;gap:.5rem}
.steps li::marker{font-family:var(--f-mono);color:var(--accent);font-weight:600}
details.reveal{border:1px solid var(--rule);border-radius:var(--r);padding:.6rem .85rem}
details.reveal summary{cursor:pointer;font-weight:600;font-size:.92rem}
details.reveal[open] summary{margin-bottom:.6rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* lab widgets */
.field{display:flex;flex-direction:column;gap:.25rem}
.field label{font-weight:600;font-size:.88rem}
.field .help{font-size:.8rem;color:var(--muted)}
.field textarea,.field input[type=text],select.sel,input.cell{font:400 .92rem/1.45 var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--rule-strong);border-radius:var(--r);padding:.5rem .65rem;width:100%}
.field textarea{min-height:64px;resize:vertical}
.preview{border:2px solid var(--ink);border-radius:var(--r);padding:1rem 1.1rem;font-size:.93rem;white-space:pre-wrap;background:var(--sheet);min-width:0;overflow-wrap:anywhere}
.editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:.75rem}
@media (max-width:820px){.editor{grid-template-columns:minmax(0,1fr)}}
.editor textarea{width:100%;min-height:300px;resize:vertical;font:400 .8rem/1.55 var(--f-mono);background:var(--bg);color:var(--ink);border:1px solid var(--rule-strong);border-radius:var(--r);padding:.8rem}
.edhead{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
.status{font-family:var(--f-mono);font-size:.72rem}
.status.ok{color:var(--accent)} .status.bad{color:var(--risk)}
.sortrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,220px);gap:.6rem;align-items:center;padding:.55rem 0;border-bottom:1px solid var(--rule)}
.sortrow:last-child{border-bottom:0}
@media (max-width:520px){.sortrow{grid-template-columns:minmax(0,1fr)}}
.sortrow .fb{grid-column:1/-1;font-size:.85rem}
.sortrow.right .fb{color:var(--accent)} .sortrow.wrong .fb{color:var(--risk)}
.slider{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 3.2rem;gap:.75rem;align-items:center;padding:.45rem 0;border-bottom:1px solid var(--rule)}
@media (max-width:560px){.slider{grid-template-columns:minmax(0,1fr) 3.2rem}.slider input{grid-column:1/-1;grid-row:2}}
.slider input{accent-color:var(--accent);width:100%}
.slider .val{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.slider .lab small{display:block;color:var(--muted);font-size:.78rem}
.flag{font:600 .68rem/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:.2rem .4rem;border-radius:3px;margin-left:.35rem}
.flag.lo{background:var(--amber-soft);color:var(--amber)} .flag.hi{background:var(--risk-soft);color:var(--risk)} .flag.ok{background:var(--accent-soft);color:var(--accent)}
input.cell{width:4.2rem;text-align:center;padding:.35rem;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td.win{background:var(--accent-soft);font-weight:700}
.scen{border:1px solid var(--rule);border-radius:var(--r);padding:1rem;display:flex;flex-direction:column;gap:.6rem}
.scen .opt.strong{border-color:var(--accent);background:var(--accent-soft)}
.scen .opt.weak{border-color:var(--risk);background:var(--risk-soft)}
.scen .opt.ok{border-color:var(--amber);background:var(--amber-soft)}

.cap{border:1px solid var(--rule);border-radius:var(--r);padding:clamp(14px,3vw,26px);display:flex;flex-direction:column;gap:1rem;background:var(--sheet)}
.cap-head{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:flex-start}
.domain{font:600 .7rem/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.toc{display:flex;flex-wrap:wrap;gap:.4rem}
.toc a{font:600 .8rem/1 var(--f-body);text-decoration:none;border:1px solid var(--rule);padding:.45rem .65rem;border-radius:999px;color:var(--ink)}
.pager{display:flex;justify-content:space-between;gap:.75rem;flex-wrap:wrap;margin-top:1.5rem}
dl.gloss{display:grid;grid-template-columns:minmax(130px,max-content) minmax(0,1fr);gap:.5rem 1.2rem;margin:0}
dl.gloss dt{font-weight:700} dl.gloss dd{margin:0}
@media (max-width:560px){dl.gloss{grid-template-columns:minmax(0,1fr)} dl.gloss dd{margin-bottom:.4rem}}
.comp{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:.4rem 1rem;align-items:center;padding:.6rem 0;border-bottom:1px solid var(--rule)}
.comp:last-child{border-bottom:0}
@media (max-width:620px){.comp{grid-template-columns:minmax(0,1fr)}}
.comp .lv{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.comp .lv button{font:600 .72rem/1 var(--f-mono);padding:.5rem 0;border:1px solid var(--rule-strong);background:var(--sheet);color:var(--muted);border-radius:4px;cursor:pointer}
.comp .lv button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:.6rem 1rem;border-radius:var(--r);font-size:.88rem;z-index:50}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* added labs */
.qrow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr);gap:.5rem 1rem;align-items:center;padding:.55rem 0;border-bottom:1px solid var(--rule)}
@media (max-width:640px){.qrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.qrow .qname{grid-column:1/-1}}
.qname{font:400 .92rem/1.4 var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--rule-strong);border-radius:var(--r);padding:.45rem .6rem;width:100%;min-width:0}
.rng{display:flex;flex-direction:column;gap:.15rem;font-size:.78rem;color:var(--muted)}
.rng b{color:var(--ink);font-family:var(--f-mono)}
.rng input{accent-color:var(--accent);width:100%}
.quadwrap{display:grid;grid-template-columns:1.4rem minmax(0,1fr);gap:.4rem;margin-top:.8rem}
.axis-y{writing-mode:vertical-rl;transform:rotate(180deg);font:600 .68rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.axis-x{grid-column:2;text-align:right;font:600 .68rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.quad{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.6rem}
@media (max-width:560px){.quad{grid-template-columns:minmax(0,1fr)}}
.quad>div{border:1px solid var(--rule);border-radius:var(--r);padding:.8rem;display:flex;flex-direction:column;gap:.35rem;min-width:0;background:var(--sheet)}
.quad .q-protect{border-top:3px solid var(--accent)} .quad .q-lighter{border-top:3px solid var(--amber)} .quad .q-ration{border-top:3px solid var(--rule-strong)} .quad .q-drop{border-top:3px solid var(--risk)}
.quad ul{margin:0;padding-left:1.1rem;font-size:.9rem}
.quad .hint{font-size:.8rem;color:var(--muted)}
.wmgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.5rem}
.wm{border:1px solid var(--rule);border-left:3px solid var(--rule-strong);border-radius:var(--r);padding:.5rem .7rem;display:flex;flex-direction:column;gap:.1rem;min-width:0}

{ id:"a1", no:"AI-01", lvl:"f", title:"AI foundation services as a product", time:"60 min",
  summary:"An AI platform is a product whose customers are application teams. Learn what a foundation services team owns, how it partners with the teams that build on it, and how it measures success.",
  objectives:["Describe the layers of an AI foundation services platform","Split responsibilities between the platform and application teams","Choose an interaction mode for each partnership, and when to change it","Write a platform contract: API, SLOs, support model and deprecation policy"],
  learn:`
<h3>What "foundation services" means</h3>
<p>An AI foundation services team builds the shared capabilities that every AI use case needs, so application teams do not each rebuild them. In most large firms that includes model hosting and serving (LLMs, embeddings, classic ML), a model gateway, GPU compute for training and batch work, governed data access for retrieval, evaluation and guardrail services, and the observability, security and cost controls around all of it.</p>
<p>The test of a foundation service is reuse. If only one team can use it, it is an application component that happens to live on the platform.</p>
<h3>The platform is a product</h3>
<p>Treat application teams as customers. That means knowing who they are, what they are trying to ship, and what slows them down. Useful product measures for an AI platform:</p>
<ul>
<li><b>Time to first inference:</b> how long from "we want to use model X" to a working call from the team's own code.</li>
<li><b>Adoption:</b> share of AI workloads running on the platform rather than on one-off stacks.</li>
<li><b>Reliability as experienced by tenants:</b> SLO attainment per tenant, not just platform-wide averages.</li>
<li><b>Unit cost:</b> cost per million tokens or per thousand predictions, tracked over time.</li>
<li><b>Support load:</b> tickets per tenant per month. Rising tickets usually mean a missing self-service path.</li>
</ul>
<h3>Interaction modes</h3>
<p>Team Topologies describes three ways teams work together. <b>Collaboration</b>: two teams work closely for a time to discover something new, such as co-developing the first retrieval integration with a line of business. <b>X-as-a-service</b>: the platform offers a stable, documented capability that teams consume with little contact. <b>Facilitating</b>: an enabling team helps another team build a skill. Collaboration is expensive, so time-box it and plan the exit: the goal of co-development is a reusable capability that the next ten teams consume as a service.</p>
<h3>Self-hosted and managed, side by side</h3>
<p>Most enterprise AI platforms are hybrid. Some models are self-hosted on the firm's GPUs (for data control, cost at scale, or fine-tuned weights). Others are reached through managed services from cloud providers. The platform's job is to make the choice invisible to callers where possible: one API, one identity model, one set of quotas and logs, with routing deciding where a request goes.</p>
<h3>The platform contract</h3>
<p>Every foundation service should publish a short contract: what the API is, what SLOs it meets, what tenants must do (quotas, data classification, retries with backoff), how to get support, and how versions are deprecated. Contracts turn "the platform is flaky" into a measurable conversation.</p>
<h3>In a regulated firm</h3>
<p>Expect a model inventory, approval workflows for new models and use cases, and evidence requirements for audits. Build these into the platform (registry metadata, automated evidence, logged approvals) rather than leaving each team to produce them by hand. A platform that makes compliance the easy path gets adopted.</p>`,

{ id:"a2", no:"AI-02", lvl:"f", title:"How LLM inference works", time:"90 min",
  summary:"The mechanics behind every serving decision: prefill and decode, the KV cache, continuous batching, latency metrics, quantization and parallelism. Do the GPU memory maths yourself.",
  objectives:["Explain prefill and decode, and why they stress GPUs differently","Calculate model weight and KV cache memory for a deployment","Define TTFT, TPOT and throughput, and the trade-off between them","Describe how continuous batching, PagedAttention, quantization and tensor parallelism change capacity"],
  learn:`
<h3>Two phases per request</h3>
<p><b>Prefill</b> processes the whole prompt in one forward pass. It is compute-bound: thousands of tokens are multiplied through the model in parallel. It produces the first output token, so it sets <b>time to first token (TTFT)</b>.</p>
<p><b>Decode</b> then generates one token at a time. Each step reads the full model weights and the request's cached keys and values from GPU memory, but does little arithmetic per byte. Decode is memory-bandwidth-bound, and its per-step time is <b>time per output token (TPOT)</b>, also called inter-token latency.</p>
<p>End-to-end latency is roughly <code>TTFT + (output tokens − 1) × TPOT</code>. Long prompts hurt TTFT; long answers hurt total latency.</p>
<h3>The KV cache</h3>
<p>To avoid recomputing attention over earlier tokens, the server keeps each layer's key and value vectors for every token in the sequence. Per token, the cache costs:</p>
<p><code>2 × layers × KV heads × head dimension × bytes per value</code></p>
<p>A Llama-3.1-70B-shaped model has 80 layers, 8 KV heads (grouped-query attention) and head dimension 128. At 16-bit precision that is 2 × 80 × 8 × 128 × 2 = 327,680 bytes, or 320 KiB per token. A single 8K-token conversation holds about 2.7 GB of cache. Concurrency is usually limited by KV cache memory, not by compute.</p>
<p>Weights cost <code>parameters × bytes per parameter</code>: a 70B model is about 141 GB at BF16, 70 GB at FP8, and about 35 GB at 4-bit.</p>
<h3>Batching is where throughput comes from</h3>
<p>Because decode is bandwidth-bound, serving many sequences in the same step costs little extra time per step: weights are read once for the whole batch. <b>Continuous batching</b> (also called in-flight batching) lets new requests join and finished ones leave at every step instead of waiting for a whole batch to finish. <b>PagedAttention</b>, introduced by vLLM, stores the KV cache in fixed-size blocks like virtual memory pages, so memory is not wasted on reserved-but-unused space and more sequences fit.</p>
<p>The trade-off: larger batches raise throughput (tokens per second per GPU) but raise TPOT for each user. Serving is tuned to the largest batch that still meets the latency SLO.</p>
<h3>Other levers</h3>
<ul>
<li><b>Quantization</b> (FP8, INT8, INT4 schemes such as AWQ or GPTQ) shrinks weights and, optionally, the KV cache. FP8 on Hopper-class GPUs is often close to lossless; 4-bit needs evaluation on your own tasks before production.</li>
<li><b>Tensor parallelism</b> splits each layer across GPUs in one node over NVLink, for models that do not fit on one GPU or to cut latency. <b>Pipeline parallelism</b> splits layers across nodes. <b>Data parallelism</b> means more replicas. Mixture-of-experts models add <b>expert parallelism</b>.</li>
<li><b>Prefix caching</b> reuses the KV cache for shared prompt prefixes such as long system prompts, cutting TTFT.</li>
<li><b>Chunked prefill</b> splits long prompts so they do not stall decode for everyone else.</li>
<li><b>Speculative decoding</b> drafts several tokens with a small model and verifies them in one pass of the large model.</li>
<li><b>Disaggregated serving</b> runs prefill and decode on separate GPU pools so each can be sized and tuned independently.</li>
</ul>
<h3>Serving engines</h3>
<p>Common LLM engines include vLLM, SGLang and NVIDIA TensorRT-LLM; NVIDIA Triton Inference Server hosts many model types. Kubernetes-native layers such as KServe (the basis of Red Hat OpenShift AI's model serving) and llm-d package these engines with autoscaling and routing. Classic ML and embedding models usually need dynamic batching and sometimes run well on CPU; do not put every model on a GPU by default.</p>`,
  examples:[{kind:"diagram", title:"One request through an LLM server", code:D.infer, caption:"Prefill fills the KV cache and produces the first token. Decode reads the cache every step and adds to it.", notice:["TTFT is dominated by prefill and queueing.","Every decode step reads all weights plus this request's KV cache.","Continuous batching shares each weight read across many sequences."]},
    {kind:"ba", title:"Sizing a 70B deployment, before and after the maths", before:"\"A 70B model needs 140 GB, so two 80 GB H100s will do.\"", after:"Weights at BF16: about 141 GB. Two H100s give 160 GB, and at 90% memory utilisation about 144 GB, leaving roughly 3 GB before runtime overhead: almost no room for KV cache, so almost no concurrency.\nOptions: four H100s at BF16 (about 139 GB of KV cache, around 50 concurrent 8K sequences), or two H100s with FP8 weights and FP8 KV cache (around 50 concurrent 8K sequences) after a quality evaluation.", notice:["Weights fitting is not the same as serving fitting.","KV cache size sets concurrency, and concurrency sets cost per token.","Quantization is a capacity decision that needs a quality check."]}],
  quiz:[
    {q:"Which phase is usually memory-bandwidth-bound?",o:["Prefill","Decode","Tokenization","Both equally"],a:1,why:"Decode does little arithmetic per byte read: it streams weights and KV cache from memory for one token per sequence per step."},
    {q:"A model has 32 layers, 8 KV heads, head dimension 128, 16-bit KV. What is the KV cache per token?",o:["32 KiB","64 KiB","128 KiB","1 MiB"],a:2,why:"2 × 32 × 8 × 128 × 2 bytes = 131,072 bytes = 128 KiB."},
    {q:"Users complain the first word takes too long to appear, but streaming is fast after that. What do you investigate first?",o:["TPOT","TTFT: queueing and prefill, such as long prompts or no prefix caching","Output token count","Tokenizer vocabulary"],a:1,why:"Slow first token with fast streaming points at queueing or prefill, not decode."},
    {q:"What does continuous batching change?",o:["It sends each request to its own GPU","Requests join and leave the running batch at every decode step","It disables the KV cache","It batches requests by user"],a:1,why:"It avoids waiting for the slowest sequence in a static batch, raising utilisation and throughput."},
    {q:"Why evaluate before deploying a 4-bit quantized model?",o:["4-bit models do not run on GPUs","Quality loss varies by model and task and must be measured on your own workloads","It is required by Kubernetes","It changes the API"],a:1,why:"Quantization trades memory for possible accuracy loss. Measure on your tasks; do not assume."}],
  lab:{type:"kv", title:"GPU memory and concurrency calculator",
    brief:"Size a deployment. Pick a model shape, precision, GPU and tensor-parallel degree, then see whether it fits and how many sequences the KV cache can hold. Challenge: serve the 70B-class model to 32 concurrent 8K-token sequences on no more than two GPUs.",
    challenge:{model:"70b", conc:32, ctx:8192, maxGpus:2}},
  talk:[["Walk me through what happens on a GPU when an LLM answers a prompt.","Tokenize; prefill computes all prompt tokens in parallel (compute-bound) and fills KV cache; first token = TTFT; decode one token per step, reading weights and KV cache (bandwidth-bound) = TPOT; continuous batching shares weight reads; stream tokens out."],

    rubric:["Memory maths is shown, not asserted","At least two configurations are compared","Measured TTFT and TPOT are recorded at several concurrency levels","Engine settings are captured so others can reproduce it","Quality impact of any quantization is noted"]}

{ id:"a3", no:"AI-03", lvl:"p", title:"GPU platforms on Kubernetes", time:"90 min",
  summary:"How GPUs reach pods, how to share and schedule them across serving, batch and training, and how to keep an expensive fleet busy without starving anyone.",
  objectives:["Explain the GPU software stack on Kubernetes and OpenShift","Choose between whole GPUs, MIG, time-slicing and DRA for a workload","Design node pools, quotas and queues for serving, batch and training","Pick the right GPU metrics and avoid the 'utilisation' trap"],
  learn:`
<h3>How a pod gets a GPU</h3>
<p>A node needs the GPU driver, the NVIDIA container toolkit, and the <b>device plugin</b>, which advertises <code>nvidia.com/gpu</code> as an extended resource. Pods request it as a whole number in <code>resources.limits</code>. The <b>NVIDIA GPU Operator</b> installs and upgrades all of this as a set, along with GPU Feature Discovery (node labels for GPU model and memory) and the <b>DCGM exporter</b> for metrics. On OpenShift it is installed from OperatorHub, typically alongside the Node Feature Discovery operator.</p>
<p><b>Dynamic Resource Allocation (DRA)</b>, stable in Kubernetes since 1.34, lets workloads claim devices with richer selection (model, memory, partition) than a single integer count. Expect GPU drivers to move toward DRA over time.</p>
<h3>Sharing GPUs</h3>
<ul>
<li><b>Whole GPUs:</b> simplest and fully isolated. Right for large-model serving and training.</li>
<li><b>MIG (Multi-Instance GPU):</b> on A100, H100 and later, splits one GPU into up to seven hardware-isolated instances with their own memory and compute. Good for embeddings, small models and notebooks.</li>
<li><b>Time-slicing:</b> several pods take turns on one GPU. No memory or fault isolation: one pod can exhaust memory for all. Fine for dev, risky for production.</li>
<li><b>MPS:</b> lets processes share a GPU concurrently with some limits; useful for many small inference processes.</li>
</ul>
<h3>Scheduling different kinds of work</h3>
<div class="tbl"><table><thead><tr><th>Workload</th><th>Needs</th><th>Typical setup</th></tr></thead><tbody>
<tr><td>Online serving</td><td>Latency, availability</td><td>Reserved pool, min replicas, priority class high, spread across zones</td></tr>
<tr><td>Batch inference</td><td>Throughput, low cost</td><td>Queued, preemptible, runs in idle capacity</td></tr>
<tr><td>Training and fine-tuning</td><td>All-or-nothing groups of GPUs, long runs</td><td>Gang scheduling, checkpointing, topology-aware placement</td></tr>
</tbody></table></div>
<p>Use taints on GPU nodes so only GPU workloads land there, node affinity for GPU model, <code>ResourceQuota</code> on <code>requests.nvidia.com/gpu</code> per namespace, and priority classes with preemption so serving can reclaim capacity from batch. <b>Kueue</b> adds job queueing on top: ClusterQueues hold quota, LocalQueues give teams an entry point, and cohorts let idle quota be borrowed and reclaimed. Training jobs need <b>gang scheduling</b> so a job does not hold four of eight GPUs while waiting forever for the rest.</p>
<h3>Topology matters</h3>
<p>Tensor parallelism wants GPUs connected by NVLink in the same node. Multi-node training wants fast interconnect (InfiniBand or RoCE, GPUDirect RDMA). Scheduling that ignores topology can halve performance without any error.</p>
<h3>Getting weights onto the node</h3>
<p>A 70B model is over 100 GB. Pulling it from object storage on every scale-up makes cold starts take many minutes. Options: node-local caches, pre-pulled OCI model images (KServe "modelcar"), shared read-only volumes, and model streaming loaders. Cold start time is a capacity-planning input, not a footnote.</p>
<h3>Measuring the fleet</h3>
<p>DCGM's <code>GPU_UTIL</code> reports the share of time any kernel was running, so a GPU doing tiny amounts of work can show 100%. Prefer SM activity and tensor-core activity, memory used, and the serving engine's own metrics (queue depth, KV cache use, tokens per second). The most expensive GPU is the idle one: track allocated-but-idle hours per tenant.</p>`,

{ id:"a4", no:"AI-04", lvl:"p", title:"Gateways, routing, autoscaling and guardrails", time:"90 min",
  summary:"The control plane in front of models: one API with identity and quotas, inference-aware routing, autoscaling on the right signals, guardrails, and evaluation workflows that gate change.",
  objectives:["List the responsibilities of a model gateway","Explain why round-robin load balancing fails for LLMs and what replaces it","Choose autoscaling signals and handle slow scale-up","Place guardrails and evaluation gates, and decide fail-open or fail-closed"],
  learn:`
<h3>What the gateway owns</h3>
<ul>
<li><b>One API</b>, usually OpenAI-compatible, for self-hosted and managed models alike.</li>
<li><b>Identity and authorisation:</b> which tenant and which user, and which models each may call.</li>
<li><b>Quotas and rate limits</b> in tokens per minute as well as requests, because one request can cost a hundred times another.</li>
<li><b>Routing:</b> by model name, cost tier, region or data classification, with <b>fallback</b> to another provider or a smaller model when the primary is degraded.</li>
<li><b>Retries with budgets:</b> retry on transient errors, but cap retries so a partial outage does not turn into a retry storm.</li>
<li><b>Metering</b> for chargeback and capacity planning, and a <b>logging policy</b> for prompts and outputs.</li>
</ul>
<h3>Routing inside a model pool</h3>
<p>Round-robin assumes requests cost about the same. LLM requests vary by orders of magnitude, so round-robin piles long requests onto busy replicas. Inference-aware routing picks a replica by its queue depth and KV cache use, and by <b>prefix affinity</b> (send requests with the same long system prompt to the replica that already has it cached). The Kubernetes Gateway API Inference Extension and projects such as llm-d implement this pattern with an endpoint picker that reads model-server metrics.</p>
<h3>Autoscaling on the right signal</h3>
<p>CPU is irrelevant and GPU utilisation is misleading. Better signals come from the engine: requests waiting in the queue (vLLM exposes <code>num_requests_waiting</code>), KV cache utilisation, or in-flight concurrency per replica. HPA with custom metrics or KEDA can scale on them; KServe's serverless mode can scale on concurrency. Scale-up is slow because nodes, images and weights take time, so combine reactive scaling with minimum replicas sized for the normal peak, scheduled scaling for known patterns, and warm spare capacity. Scale-to-zero suits development and low-tier models, not interactive production.</p>
<h3>Guardrails</h3>
<p><b>Input guardrails</b> detect prompt injection attempts, redact or block sensitive data, and enforce topic policy. <b>Output guardrails</b> check for sensitive data leakage, toxic content, schema validity for structured output, and groundedness against retrieved sources. Put shared, policy-level checks in the gateway or a guardrail service so every tenant gets them; leave use-case checks to the application. Every guardrail adds latency, so give them a budget. Decide <b>fail-open or fail-closed</b> per check and per data class: a PII filter on a restricted-data route should fail closed.</p>
<h3>Evaluation workflows</h3>
<p>Treat a model, prompt or guardrail change like a code change. Keep versioned evaluation datasets per use case, run them in CI as a <b>regression gate</b>, and use LLM-as-judge scoring only after checking it agrees with human ratings on a sample. In production, use shadow traffic and canaries per model version, and watch online signals such as guardrail block rates, user feedback and refusal rates.</p>`,

{ id:"a5", no:"AI-05", lvl:"p", title:"Performance engineering and capacity", time:"90 min",
  summary:"Load test LLM services properly, find the knee of the curve, tune the levers that matter, and turn the results into a capacity and cost model.",
  objectives:["Design a realistic, token-aware load test","Find the maximum concurrency that meets an SLO and report goodput","Use profiling to find the real bottleneck","Build a capacity model with Little's law and compute cost per million tokens"],
  learn:`
<h3>Start with the workload profile</h3>
<p>Before testing, write down the distributions that drive cost: input tokens, output tokens, arrival rate by hour, share of requests with a shared prefix, streaming or not. A load test with fixed 100-token prompts says nothing about a retrieval workload with 6K-token prompts.</p>
<h3>Load testing LLMs</h3>
<ul>
<li>Use real or realistic prompt distributions, including the long tail.</li>
<li>Prefer <b>open-loop</b> tests (requests arrive at a set rate regardless of responses) for capacity questions. Closed-loop tests with a fixed number of users hide queueing: this is <b>coordinated omission</b>.</li>
<li>Measure TTFT, TPOT and end-to-end latency at p50, p95 and p99, plus tokens per second and error rate.</li>
<li>Report <b>goodput</b>: requests per second that met the SLO, not just total throughput.</li>
<li>Sweep concurrency or rate until latency bends sharply upward. That <b>knee</b> is your per-replica capacity at the SLO.</li>
</ul>
<p>Tools include vLLM's benchmark scripts, GuideLLM, NVIDIA GenAI-Perf, k6 and Locust. Whatever the tool, save the config and raw results so tests are reproducible.</p>
<h3>Find the real bottleneck</h3>
<p>Profile before tuning. Common surprises: tokenization or JSON handling on a single CPU thread in the gateway, TLS or connection limits, a guardrail model slower than the main model, and network hops between zones. On the GPU side, use the engine's metrics first, then tools such as Nsight Systems or the PyTorch profiler.</p>
<h3>The levers</h3>
<div class="tbl"><table><thead><tr><th>Lever</th><th>Helps</th><th>Watch for</th></tr></thead><tbody>
<tr><td>Larger batch (max sequences)</td><td>Throughput, cost per token</td><td>TPOT rises</td></tr>
<tr><td>Quantization (FP8)</td><td>Fits more KV cache, faster decode</td><td>Quality; needs evaluation</td></tr>
<tr><td>Prefix caching</td><td>TTFT for shared prompts</td><td>Only helps with real prefix reuse</td></tr>
<tr><td>Speculative decoding</td><td>TPOT at low batch sizes</td><td>Gains shrink at high load</td></tr>
<tr><td>Tensor parallel degree</td><td>Latency for large models</td><td>Fewer replicas per GPU</td></tr>
<tr><td>Routing small tasks to small models</td><td>Cost</td><td>Needs a quality check per task</td></tr>
<tr><td>Response caching at the gateway</td><td>Repeated identical requests</td><td>Staleness, data leakage across users</td></tr>
</tbody></table></div>
<h3>Capacity modelling</h3>
<p><b>Little's law</b>: average concurrency = arrival rate × average time in system. At 20 requests per second and 12 seconds per request, 240 requests are in flight. Divide by the per-replica concurrency that meets the SLO, then add headroom for spikes, zone failure and cold start. Size for the peak, report cost against the average.</p>
<p>Cost per million output tokens = hourly GPU cost ÷ million output tokens served per hour. It is the number that lets you compare self-hosting with a managed API, and it falls as utilisation rises.</p>`,
  examples:[{kind:"ba", title:"A load test summary, rewritten", before:"Load test passed. vLLM handled 500 users. Average latency 3.2 s. GPU utilisation 98%.", after:"70B FP8 on 2×H100, open-loop, production prompt mix (median 1.8K in, 350 out).\nKnee at 48 concurrent sequences per replica: p95 TTFT 0.7 s, p95 TPOT 38 ms, goodput 3.9 req/s at the SLO (p95 TTFT < 1 s, p95 TPOT < 50 ms). Above 56, p95 TTFT exceeds 2 s.\nBottleneck: KV cache full above 56 sequences; requests queue. Next lever: FP8 KV cache (est. +40% concurrency), pending eval.\nRaw results and config: perf/2026-11-chat-70b/", notice:["Names the workload mix and test method.","Reports percentiles and goodput against an SLO, not averages.","States the bottleneck and the next lever."]}],
  quiz:[
    {q:"Why can a closed-loop load test with fixed virtual users understate latency?",o:["It sends too many requests","Users wait for responses before sending more, so arrival slows exactly when the system is slow (coordinated omission)","It ignores streaming","It uses the wrong tokenizer"],a:1,why:"Open-loop arrival at a set rate shows the queueing real traffic would see."},
    {q:"What is goodput?",o:["Total tokens per second","Throughput of requests that met the latency SLO","GPU utilisation","Cache hit rate"],a:1,why:"Throughput that misses the SLO is not useful capacity."},
    {q:"Arrival rate is 10 requests per second and each takes 6 seconds. How many requests are in flight on average?",o:["1.7","16","60","600"],a:2,why:"Little's law: 10 × 6 = 60."},
    {q:"Raising max batch size doubled throughput but p95 TPOT now breaks the SLO. What does that tell you?",o:["The GPU is broken","You are past the knee: pick the largest batch that still meets the SLO","Batching does not work","Lower the SLO"],a:1,why:"Batch size trades per-user latency for throughput. The SLO sets the limit."},
    {q:"Which number best compares self-hosting with a managed API?",o:["GPU count","Cost per million tokens at realistic utilisation, including people and headroom","Peak tokens per second","Model size"],a:1,why:"It normalises for traffic and includes the cost of idle capacity."}],

    brief:"Use Little's law to size replicas for peak traffic, then see the cost per million output tokens at average traffic. Challenge: get cost below $3.00 per million output tokens while keeping at least 25% headroom. Use the engineering levers (per-replica concurrency from batching or quantization, GPUs per replica, latency), not by cutting headroom.",
    target:3.00, minHead:25},
  talk:[["How do you load test an LLM service?","Workload profile from production; realistic token distributions; open-loop arrival; sweep rate to find the knee; TTFT/TPOT/e2e percentiles; goodput vs SLO; error rates; reproducible configs; profile the bottleneck."],
    ["Your LLM endpoint is too slow. Where do you start?","Split TTFT vs TPOT; check queueing; engine metrics (queue, KV use, preemptions); profile gateway CPU, guardrails, network; then levers: batching, prefix caching, quantization, TP degree, routing smaller models."],
    ["How do you build a capacity plan for a new GenAI use case?","Peak and average arrival rates; token distributions; Little's law; per-replica concurrency at SLO from load test; headroom for spikes, zone loss and cold start; GPUs; cost per million tokens; review quarterly."]],

{ id:"a6", no:"AI-06", lvl:"p", title:"SLOs, observability and incident response", time:"90 min",
  summary:"Define service levels that match what AI users feel, alert on error-budget burn instead of noise, instrument the whole request path, and run incidents and root-cause analysis that make the platform better.",
  objectives:["Choose SLIs for an AI service, including latency and quality","Calculate error budgets and multi-window burn-rate alerts","Design metrics, traces and logs for model traffic, with a prompt logging policy","Run an incident and write a root-cause analysis with useful actions"],
  learn:`
<h3>SLIs that match the user's experience</h3>
<p>An SLI is a ratio of good events to all events. For an LLM route, useful SLIs are:</p>
<ul>
<li><b>Availability:</b> share of requests that did not fail with a server error or timeout (client errors and quota rejections usually excluded, but tracked).</li>
<li><b>Responsiveness:</b> share of streaming requests with TTFT under a threshold, and share with TPOT under a threshold. For non-streaming calls, end-to-end latency per 1K output tokens.</li>
<li><b>Quality signals:</b> evaluation pass rate on sampled traffic, guardrail block rate, refusal rate. These are often tracked as indicators before they become formal SLOs.</li>
</ul>
<p>Set SLOs per route and tier: an interactive assistant and an overnight batch summariser should not share targets. An <b>SLA</b> is a contract with consequences; keep internal SLOs tighter than any SLA.</p>
<h3>Error budgets</h3>
<p>The error budget is <code>1 − SLO</code>. A 99.9% availability SLO over 30 days allows 0.1% bad requests, or 43.2 minutes of full outage. An <b>error budget policy</b> says what happens as it is spent: for example, freeze risky changes when 75% is gone and spend engineering time on reliability until it recovers.</p>
<h3>Alert on burn rate</h3>
<p>Burn rate is how fast the budget is being spent: <code>observed error rate ÷ (1 − SLO)</code>. A burn rate of 1 spends exactly the budget over the window. The Google SRE Workbook recommends multi-window alerts for a 30-day window: page at <b>14.4×</b> over 1 hour (2% of budget spent) and at <b>6×</b> over 6 hours (5%), and open a ticket at <b>1×</b> over 3 days (10%). Each long window is paired with a short one (5 minutes, 30 minutes, 6 hours) so alerts stop soon after the problem does.</p>
<h3>Observability for model traffic</h3>
<ul>
<li><b>Metrics:</b> RED (rate, errors, duration) at the gateway; engine metrics (queue depth, KV cache use, preemptions, tokens per second, TTFT and TPOT histograms); GPU metrics from DCGM; all labelled by tenant, model and version.</li>
<li><b>Traces:</b> one trace across app, gateway, guardrails, retrieval and model, using OpenTelemetry. The OpenTelemetry generative AI semantic conventions define attributes such as model name and input and output token counts.</li>
<li><b>Logs:</b> structured, with a written <b>prompt logging policy</b>: what is captured, what is redacted, who can read it, and how long it is kept. Prompts often contain the most sensitive data in the system.</li>
</ul>
<h3>Incidents</h3>
<p>Agree roles before you need them: an incident commander, an operations lead and a communications lead. Declare early, mitigate first (roll back, shed load, fail over to another model), diagnose second. Common AI platform incidents: out-of-memory on unexpectedly long contexts, KV cache thrash and request preemption, one tenant's batch job starving others, a model version that regresses quality, GPU hardware errors (Xid or ECC), a managed provider outage, and a cold-start storm after a node pool upgrade.</p>
<h3>Root-cause analysis</h3>
<p>Write blameless reviews. Separate the trigger from the contributing factors, and ask why the system made the failure easy. Good actions change the system: a test, a guardrail, an alert, an automated check, a default. "Be more careful" is not an action. Track actions to closure and review them as a set each quarter.</p>`,
  examples:[{kind:"diagram", title:"Multi-window burn-rate alerting", code:D.burn, caption:"Fast burns page quickly; slow burns create tickets before the budget runs out.", notice:["Each threshold maps to a share of the 30-day budget.","Short windows make alerts reset quickly after recovery.","No alert fires on a brief blip that barely touches the budget."]},
    {kind:"ba", title:"A runbook step, rewritten", before:"If latency is high, check the GPUs and restart vLLM if needed.", after:"Symptom: p95 TTFT alert on chat-70b.\n1. Open the chat-70b dashboard. If num_requests_waiting > 10 on all replicas, this is capacity: scale to max replicas and enable the fallback route (link). Go to step 4.\n2. If one replica is slow, check its KV cache use and preemptions. If preemptions > 0, cordon the node and delete the pod.\n3. If a single tenant's traffic doubled, apply that tenant's emergency quota (link).\n4. Post status in the incident channel every 15 minutes until p95 TTFT is under target for 30 minutes.", notice:["Starts from the alert the responder actually sees.","Each step has a check and an action.","Mitigation comes before diagnosis."]}],
  quiz:[
    {q:"A route has a 99.5% availability SLO over 30 days. What is the error budget expressed as full-outage time?",o:["43 minutes","3.6 hours","7.2 hours","36 hours"],a:1,why:"0.5% of 30 days = 0.005 × 720 hours = 3.6 hours."},
    {q:"With a 99.9% SLO, what error rate over one hour corresponds to a 14.4× burn rate?",o:["0.1%","1.44%","14.4%","0.0144%"],a:1,why:"14.4 × 0.1% = 1.44%. Sustained for an hour, that spends 2% of the 30-day budget."},
    {q:"Why pair each long alert window with a short one?",o:["To page more often","So the alert stops soon after the problem is fixed","To save storage","It is required by Prometheus"],a:1,why:"The long window gives significance; the short window confirms it is still happening."},
    {q:"Which is the strongest action item from a root-cause analysis?",o:["Engineers will be more careful with config changes","Add a CI check that rejects max context settings above what the KV cache can hold","Hold a meeting about the incident","Restart pods weekly"],a:1,why:"It changes the system so the same mistake is caught automatically."},
    {q:"Why does an AI platform need a written prompt logging policy?",o:["Prompts are always public","Prompts often hold the most sensitive data in the system, so capture, redaction, access and retention must be decided","Logs are free","To improve model accuracy"],a:1,why:"Unplanned prompt logging is a common data exposure."}],

{ id:"a7", no:"AI-07", lvl:"p", title:"Secure by design for AI platforms", time:"90 min",
  summary:"Identity, secrets, supply chain, vulnerability management and sensitive data handling for model platforms, plus the new risks LLMs bring: prompt injection, data leakage and unbounded consumption.",
  objectives:["Threat model an AI platform's data flows and trust boundaries","Apply workload identity, least privilege and entitlement-aware retrieval","Secure the model and software supply chain, including model artifacts","Map LLM-specific risks to controls using the OWASP Top 10 for LLM applications"],
  learn:`
<h3>Start from the data flows</h3>
<p>Draw where prompts, retrieved documents, model weights, outputs and logs travel, and mark each trust boundary. Most AI platform incidents happen at boundaries: retrieved data reaching a user who should not see it, prompts landing in a log store with wide access, or a model artifact from an unvetted source running on the cluster.</p>
<h3>Identity and access</h3>
<ul>
<li>Use <b>workload identity</b> (Kubernetes service accounts federated through OIDC, or SPIFFE) instead of long-lived shared API keys.</li>
<li>Authorise at the gateway per tenant and per model, and pass the <b>end user's identity</b> through to downstream services.</li>
<li>Enforce data entitlements <b>at retrieval time, with the user's entitlements</b>, not the service account's. A retrieval service that can read everything will eventually return everything.</li>
<li>Apply least privilege to agents and tools: an LLM that can call an API is a user of that API and needs its own scoped permissions.</li>
</ul>
<h3>Secrets</h3>
<p>Keep secrets in a managed store such as HashiCorp Vault or a cloud secret manager, sync them with the External Secrets Operator or the Secrets Store CSI driver, prefer short-lived credentials, and rotate automatically. Scan repositories, images and logs for leaked secrets. Never bake keys into images or pass them where a crash dump or debug log will print them.</p>
<h3>Supply chain</h3>
<ul>
<li>Pin dependencies, generate <b>SBOMs</b> (CycloneDX or SPDX), sign images with Sigstore cosign, and record <b>SLSA</b> provenance.</li>
<li>Enforce at admission with policy (Kyverno, OPA Gatekeeper, or OpenShift's built-in controls): only signed images from approved registries.</li>
<li><b>Model artifacts are code.</b> Python pickle files can execute arbitrary code when loaded. Prefer the safetensors format, scan artifacts before admission, pin by hash, and serve only from an approved model registry.</li>
</ul>
<h3>Vulnerability remediation</h3>
<p>Set remediation timelines by severity and exposure, keep a small set of maintained base images, rebuild on a schedule rather than only on alerts, and use VEX statements to record when a reported vulnerability does not affect you. GPU images are large and slow to rebuild, so automate the pipeline before you need an emergency patch.</p>
<h3>Sensitive data</h3>
<p>Classify data per route and decide what each class may do: which models (self-hosted only, or approved managed providers with zero data retention terms), what may be logged, and where it may be processed. Redact before logging, encrypt in transit and at rest, set retention, and never use tenant data to fine-tune without explicit approval.</p>
<h3>LLM-specific risks</h3>
<p>The OWASP Top 10 for LLM Applications (2025) lists: prompt injection, sensitive information disclosure, supply chain, data and model poisoning, improper output handling, excessive agency, system prompt leakage, vector and embedding weaknesses, misinformation, and unbounded consumption. Prompt injection cannot be fully prevented by filters, so contain its impact: least privilege for tools, human approval for consequential actions, treat model output as untrusted input to downstream systems, and keep secrets out of system prompts. Quotas and token limits address unbounded consumption.</p>
<h3>In a regulated firm</h3>
<p>Expect model risk management requirements (in US banking, the Federal Reserve's SR 11-7 guidance), frameworks such as the NIST AI Risk Management Framework, and NIST SP 800-218A for secure development of generative AI. Make evidence a by-product of the platform: approvals in the registry, signed artifacts, logged evaluations.</p>`,
  examples:[{kind:"diagram", title:"Trust boundaries on a retrieval route", code:D.trust, caption:"Amber components handle classified data and need the strictest controls.", notice:["The retrieval service filters by the user's entitlements, carried from the original token.","Weights come only from a signed, scanned registry.","Logs are redacted and have a retention period."]}],
  quiz:[
    {q:"A retrieval service uses its own broad service account to fetch documents for any user. What is the risk?",o:["Slow queries","Users can receive documents they are not entitled to see","Higher GPU cost","None if the gateway authenticates users"],a:1,why:"Entitlements must be enforced at retrieval time with the user's identity, or the model becomes a data leak."},
    {q:"Why treat a pickle-format model file as untrusted code?",o:["It is larger","Loading pickle can execute arbitrary code","It cannot be versioned","It is slower"],a:1,why:"Prefer safetensors, scan artifacts, and serve from an approved registry."},
    {q:"What is the most realistic defence against prompt injection?",o:["A perfect input filter","Contain impact: least privilege for tools, human approval for consequential actions, and treating output as untrusted","Longer system prompts","Higher temperature"],a:1,why:"Filters help but can be bypassed. Limit what a successful injection can do."},
    {q:"Which OWASP LLM risk do per-tenant token quotas mainly address?",o:["System prompt leakage","Unbounded consumption","Misinformation","Data poisoning"],a:1,why:"Quotas and limits stop runaway cost and denial of service."},
    {q:"Which is the best place to keep an API key for a managed model provider?",o:["In the container image","In a ConfigMap","In a secret store, synced as a short-lived or rotated secret","In the system prompt"],a:2,why:"Managed stores with rotation and audit, never images, ConfigMaps or prompts."}],
  lab:{type:"sort", title:"Match each risk to its primary control",
    brief:"For each risk on Northbank's platform, choose the control family that addresses it first.",
    buckets:["Identity and access","Secrets management","Supply chain","Data protection","Runtime guardrails"],
    items:[
      ["A shared API key used by six services leaks in a public repo","Secrets management","Per-service, short-lived credentials from a secret store, with scanning and rotation."],
      ["A model downloaded from a public hub contains a malicious pickle payload","Supply chain","Approved registry, safetensors, scanning and hash pinning."],
      ["An analyst gets loan files from another region through the assistant","Identity and access","Entitlement-aware retrieval using the user's identity."],
      ["Full prompts with customer names are kept in debug logs for a year","Data protection","Redaction, logging policy and retention."],
      ["A support agent tool lets the model issue refunds when a document tells it to","Runtime guardrails","Limit agency and require human approval; treat retrieved text as untrusted."],
      ["An unsigned image from a personal registry runs in the serving namespace","Supply chain","Admission policy: signed images from approved registries only."],
      ["The model returns an account number from its context window to the wrong user","Runtime guardrails","Output checks for sensitive data, alongside entitlement-aware retrieval."],
      ["A batch job's service account can delete production model deployments","Identity and access","Least-privilege RBAC per workload."]]},
  talk:[["How do you secure a multi-tenant LLM platform?","Threat model flows and boundaries; workload identity and per-tenant authZ; user entitlements at retrieval; secrets in a store with rotation; signed images, SBOMs, admission policy; safe model formats and registry; data classification rules; redacted logging; guardrails; quotas; audit evidence."],
    ["What is different about securing AI workloads compared with ordinary services?","Model artifacts can be code; prompts carry sensitive data; outputs are untrusted; prompt injection; excessive agency for tools; unbounded consumption; retrieval can bypass entitlements; quality and misuse risks."],
    ["How do you run vulnerability remediation for large GPU images?","Few maintained base images; automated scheduled rebuilds; severity and exposure-based timelines; VEX for non-applicable CVEs; canary deploys; measure time to remediate."]],
  project:{title:"Threat model and control map", deliver:"A threat model for one AI route with a control for each significant threat.", steps:["Draw the data flow with trust boundaries","List threats per boundary, using STRIDE and the OWASP LLM Top 10","Rate each threat by likelihood and impact","Map each high or medium threat to a control and an owner","Check identity: whose identity reaches the data?","Check supply chain: where do images and weights come from?","Review with a security partner and record decisions"],
    rubric:["Data flow shows trust boundaries","LLM-specific threats are included","Each significant threat has a control and owner","Retrieval uses user entitlements","Model artifact provenance is addressed"]}
},

{ id:"a8", no:"AI-08", lvl:"p", title:"Golden paths, CI/CD and infrastructure as code", time:"90 min",
  summary:"Package the platform so teams can ship safely without asking: templates, reference implementations, test harnesses and baselines, delivered through pipelines and GitOps that make the right way the easy way.",
  objectives:["Define what belongs in a golden path and what makes one adopted","Build reference implementations and test harnesses that stay current","Design a CI/CD pipeline with security and evaluation gates and progressive delivery","Manage platform infrastructure as code with review, drift detection and policy"],
  learn:`
<h3>What a golden path is</h3>
<p>A golden path (or paved road) is the opinionated, supported way to do a common job, such as "host a fine-tuned model" or "add retrieval to an app". It is optional, but so much easier than the alternative that most teams choose it. A good one contains:</p>
<ul>
<li>A <b>template</b> repository or scaffolder entry (for example in a developer portal such as Backstage).</li>
<li>Deployment manifests or a Helm chart with safe defaults: resource requests, probes, autoscaling, network policy.</li>
<li>Infrastructure modules for the pieces the team needs.</li>
<li>A CI pipeline already wired with tests, scans and gates.</li>
<li>A dashboard, alerts and a runbook that work on day one.</li>
<li>An <b>onboarding guide</b> that gets a new team to a first successful call quickly.</li>
</ul>
<h3>Reference implementations and baselines</h3>
<p>A reference implementation is real, tested, running code that shows the pattern end to end, not a diagram. Keep it in CI so it breaks when the platform changes. Pair it with <b>baselines</b>: known-good configurations per model size and GPU type with measured TTFT, TPOT and throughput (Module 2), and for training, known-good job specs with measured throughput. Baselines turn "how many GPUs do we need?" from a meeting into a lookup.</p>
<h3>Test harnesses</h3>
<ul>
<li><b>Contract tests</b> for the gateway API so client libraries and the platform do not drift.</li>
<li>A <b>load test harness</b> teams can point at their route with their own prompt mix (Module 5).</li>
<li>An <b>evaluation harness</b> that runs a team's golden dataset against a model or prompt change (Module 4).</li>
<li><b>Fault injection</b> for game days: kill a replica, fill the KV cache, fail the managed provider.</li>
</ul>
<h3>Pipelines</h3>
<p>Build with pinned dependencies, scan, generate an SBOM and sign. Run unit, contract and integration tests, then an evaluation gate for model or prompt changes. Deploy through <b>GitOps</b> (Argo CD, or OpenShift GitOps, or Flux): the pipeline opens a change to an environment repository, and the controller reconciles the cluster. Use <b>progressive delivery</b> such as Argo Rollouts canaries with automated analysis on error rate and latency, and roll back automatically when burn rate rises. Treat model versions as deployable artifacts with their own promotion, separate from code.</p>
<h3>Infrastructure as code</h3>
<p>Use Terraform or OpenTofu, or Kubernetes-native tools such as Crossplane, with versioned modules, reviewed plans, remote state with locking, drift detection, and policy as code (OPA, Sentinel or Kyverno) that blocks unsafe changes before apply. Review infrastructure changes like code: a plan in the pull request, an owner, and a rollback.</p>
<h3>Measure the paths</h3>
<p>Track time to first inference, share of services on the current template version, change failure rate for golden-path services versus others, and tickets per tenant. If teams fork the template, find out why and fold the reason back in.</p>`,
  examples:[{kind:"diagram", title:"A model service pipeline", code:D.pipeline, caption:"Security and quality gates run before anything reaches a cluster; GitOps and canary analysis handle the rollout.", notice:["Evaluation is a gate, like tests.","Deployment is a pull request to an environment repo.","Rollback is automatic and tied to the same SLO signals as alerting."]}],
  quiz:[
    {q:"What most distinguishes a golden path from a mandated standard?",o:["It is written in YAML","It is optional but so much easier that teams choose it","It has no tests","Only the platform team uses it"],a:1,why:"Adoption is earned by making the supported way the easy way."},
    {q:"How do you stop a reference implementation going stale?",o:["Review it annually","Run it in CI against the current platform so it breaks when the platform changes","Mark it as deprecated","Store it in a wiki"],a:1,why:"If it is tested continuously, it stays true."},
    {q:"In GitOps, how does a pipeline deploy?",o:["kubectl apply from the CI runner","It changes an environment repository, and a controller reconciles the cluster to it","SSH to nodes","Manual approval only"],a:1,why:"Git becomes the source of truth and audit trail; the controller corrects drift."},
    {q:"Why give model versions their own promotion path?",o:["Models are not artifacts","Model changes alter behaviour without code changes and need their own evaluation and rollback","To save storage","Kubernetes requires it"],a:1,why:"A new model version can change quality and capacity; promote and roll back it deliberately."},
    {q:"Teams keep forking the serving template. What should the platform team do?",o:["Block forks","Find out what they changed and why, and fold common reasons back into the template","Ignore it","Write more documentation"],a:1,why:"Forks are product feedback."}],

{ id:"a9", no:"AI-09", lvl:"p", title:"From requirements to design to production", time:"75 min",
  summary:"Turn an application team's request into numeric non-functional requirements, a design with real options, a delivery plan built on thin slices, and a production readiness review that catches problems before customers do.",
  objectives:["Run an intake that surfaces the requirements teams forget to state","Write non-functional requirements as numbers","Plan delivery as a walking skeleton and milestones","Run a production readiness review and plan early-life support"],
  learn:`
<h3>Intake: ask what they did not say</h3>
<p>Application teams describe features. You need the constraints. Ask: who uses it and how many, at what peak; what latency they will tolerate; what data goes in and its classification; what happens to the business if it is wrong or down for an hour; which regions; what it may cost per month; who supports it at 2 a.m.; when it must launch and why.</p>
<h3>Non-functional requirements are numbers</h3>
<div class="tbl"><table><thead><tr><th>Area</th><th>Adjective (not useful)</th><th>Requirement (useful)</th></tr></thead><tbody>
<tr><td>Performance</td><td>Fast</td><td>p95 TTFT under 1 s for prompts up to 4K tokens</td></tr>
<tr><td>Scale</td><td>Scalable</td><td>40 requests per second at peak, 3× growth in 12 months</td></tr>
<tr><td>Availability</td><td>Highly available</td><td>99.9% monthly; survives loss of one zone</td></tr>
<tr><td>Security</td><td>Secure</td><td>Confidential data; self-hosted models only; prompts not logged</td></tr>
<tr><td>Cost</td><td>Cost-effective</td><td>Under $40K per month at forecast volume</td></tr>
<tr><td>Recovery</td><td>Resilient</td><td>Recovery time 30 min; fallback to smaller model acceptable</td></tr>
</tbody></table></div>
<h3>The design document</h3>
<p>Context and goals; non-goals; requirements; at least two real options (including "use what exists") with trade-offs; the chosen design; risks and mitigations; operational plan; open questions. Keep it short enough to be read before the review. Use the review to explore failure modes: what happens when the model is slow, the cache is full, the provider is down, a tenant sends 10× traffic, or the data is wrong?</p>
<h3>Plan delivery in thin slices</h3>
<p>Build a <b>walking skeleton</b> first: the thinnest end-to-end path, from the app through the gateway to a model and back, deployed to a production-like environment with monitoring. Then add capability in milestones that each produce something a user or operator can test. This surfaces integration, identity and network problems in week two instead of week ten.</p>
<h3>Production readiness review</h3>
<p>A readiness review checks evidence, not intentions. Typical items: SLOs defined and dashboards live; alerts tested by fault injection; runbooks for top alerts; on-call rota and escalation; load test at expected peak plus headroom; capacity plan; failover and rollback tested; security review and threat model closed; data classification and logging policy approved; evaluation results signed off by the business owner; cost forecast agreed.</p>
<h3>Launch and early life</h3>
<p>Launch in stages: internal pilot, limited release, general availability. Agree <b>exit criteria</b> for each stage in advance. Plan an early-life support period with the platform and app teams watching the same dashboard, a daily check-in, and a lower threshold for rollback.</p>`,
  examples:[{kind:"diagram", title:"From intake to early-life support", code:D.readiness, caption:"Risk is retired early by the walking skeleton and load test, not at the readiness review.", notice:["NFRs are numbers before design starts.","The walking skeleton reaches a production-like environment early.","The readiness review checks evidence gathered along the way."]},
    {kind:"ba", title:"A requirement, rewritten", before:"The fraud team needs a fast, secure, scalable LLM summary of case notes that is always available.", after:"Summarise case notes (median 3K tokens, max 12K) for 300 investigators.\nPeak 8 req/s weekday mornings; p95 end-to-end under 6 s for 250-token summaries; 99.5% monthly availability; degraded mode: show raw notes.\nRestricted data: self-hosted models only, prompts not logged, outputs retained 90 days with case.\nQuality: 95% of sampled summaries rated acceptable by investigators on a 200-case golden set.\nBudget: under $15K per month. Launch: pilot with 20 investigators by March.", notice:["Every adjective became a number or a rule.","Degraded mode is designed, not discovered.","Quality has an owner and a test set."]}],
  quiz:[
    {q:"Which is a usable non-functional requirement?",o:["The system must be scalable","p95 TTFT under 1 s at 40 requests per second for prompts up to 4K tokens","Latency should be low","Use the best GPU"],a:1,why:"It is measurable and testable."},
    {q:"What is a walking skeleton?",o:["A design document template","The thinnest end-to-end slice deployed to a production-like environment","A load test","A project plan"],a:1,why:"It exposes integration, identity and network issues early."},
    {q:"What should a production readiness review mainly check?",o:["That the team intends to write runbooks","Evidence: tested alerts, load test results, rollback tested, reviews closed","Code style","The project budget only"],a:1,why:"Readiness is shown by evidence gathered during delivery."},
    {q:"Why include 'use what exists' as an option in a design doc?",o:["It is always chosen","It forces the new design to justify its cost against the cheapest alternative","Reviewers require it","It shortens the doc"],a:1,why:"A real baseline option exposes whether new work is needed."},
    {q:"What makes a staged launch safer?",o:["Launching on Fridays","Exit criteria for each stage agreed in advance","Skipping the pilot","More features in the first release"],a:1,why:"Agreed criteria prevent pressure-driven promotion to the next stage."}],
  lab:{type:"builder", title:"Requirements and readiness sheet",
    brief:"Turn a request into numbers and a readiness plan. Fill in the fields or load the Northbank example, then copy the preview.",
    fields:[["usecase","Use case and users","Summarise fraud case notes for 300 investigators"],["load","Load and growth","Peak 8 req/s weekday mornings; median prompt 3K tokens, max 12K; 2× growth in 12 months"],["perf","Performance","p95 end-to-end under 6 s for 250-token summaries"],["avail","Availability and degraded mode","99.5% monthly; survive one zone loss; degraded mode shows raw notes"],["data","Data and security","Restricted; self-hosted only; prompts not logged; outputs retained 90 days with case"],["quality","Quality and owner","95% acceptable on 200-case golden set; owner: fraud operations lead"],["cost","Cost","Under $15K per month at forecast volume"],["skeleton","Walking skeleton","Case UI → gateway → 8B model → summary, in pre-prod with dashboards, by week 2"],["prr","Readiness evidence required","Load test at 16 req/s; alert fault-injected; rollback tested; threat model closed; eval sign-off; on-call rota"]],
    template:o=>`USE CASE: ${o.usecase||"<use case>"}
