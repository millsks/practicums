${o.prr||"<evidence>"}`,
    check:["Every requirement is a number or a rule","Degraded mode is defined","Quality has an owner and a test set","The skeleton reaches a production-like environment early","Readiness lists evidence, not intentions"]},
  talk:[["An application team asks for 'a chatbot over our policies'. What do you do next?","Intake questions: users, peak, latency, data class, impact of wrong answers, regions, budget, support, deadline; NFRs as numbers; options including existing services; walking skeleton; eval set with business owner."],
    ["What is on your production readiness checklist for an AI service?","SLOs and dashboards; alerts tested; runbooks; on-call; load test at peak + headroom; capacity plan; rollback and failover tested; threat model and data review closed; logging policy; eval sign-off; cost forecast."],
    ["How do you run a good design review?","Doc read in advance; focus on requirements, options and failure modes; ask what happens when dependencies fail or traffic spikes; record decisions and open questions; owners and dates."]],
  project:{title:"Requirements to readiness for one request", deliver:"An NFR sheet, short design doc and readiness checklist for a real or realistic request.", steps:["Run an intake conversation and record answers","Write NFRs as numbers","Write the design doc with at least two options","Plan the walking skeleton and milestones","List readiness evidence for launch","Define stage exit criteria for pilot and GA","Hold a review and record decisions"],
    rubric:["NFRs are numeric","Options include using what exists","Failure modes were reviewed","Walking skeleton is planned early","Exit criteria exist for each launch stage"]}
},

{ id:"a10", no:"AI-10", lvl:"e", title:"Leading AI-assisted engineering", time:"90 min",
  summary:"Drive adoption of approved AI coding and operations tools across teams while keeping quality, security and data handling under control: policy, validation standards, guardrails as code, measurement and coaching.",
  objectives:["Describe where AI assistance helps engineering teams and where it fails","Write validation standards that keep authors accountable for AI output","Put guardrails in code: CI checks for security, dependencies and tests","Measure outcomes with delivery and quality metrics, not usage counts","Coach senior engineers on compliant, effective use"],
  learn:`
<h3>Where it helps and where it fails</h3>
<p>AI assistants are useful for boilerplate and scaffolding, test generation, refactoring with good test coverage, explaining unfamiliar code, first-pass code review, log and trace summarisation during incidents, drafting runbooks and postmortems, and migration chores. They fail in predictable ways: plausible but wrong logic, insecure patterns, outdated or invented APIs, <b>invented package names</b> that attackers can register (sometimes called slopsquatting), licence issues in generated code, and confident root-cause stories during incidents that the evidence does not support.</p>
<h3>Evidence says: measure, do not assume</h3>
<p>Results vary widely. A 2025 randomised study by METR found experienced open-source developers took longer on tasks in their own repositories with AI tools, while believing they had been faster. DORA's 2024 research associated higher AI adoption with small declines in delivery stability, and its later research frames AI as an amplifier of a team's existing practices. The lesson for a leader: run pilots with baselines and measure outcomes.</p>
<h3>Policy</h3>
<ul>
<li>Use only <b>enterprise-approved tools</b> with contractual terms on data retention and training, audit logs and central admin.</li>
<li>Define what data may go into prompts by classification. Never secrets or credentials; customer data only in tools approved for it.</li>
<li>Agentic tools that run commands get sandboxed environments, scoped permissions, no production credentials, and human approval for anything consequential.</li>
</ul>
<h3>Validation standards</h3>
<ul>
<li><b>The author is accountable</b> for every line they submit, however it was produced.</li>
<li>AI-assisted changes get the same peer review, and reviewers should know where AI was used on risky changes (a pull request label or note).</li>
<li>Generated code needs tests that the author has read and that would fail if the code were wrong.</li>
<li>Security checks run on everything: SAST, secrets scanning, dependency verification against approved registries (catches invented packages), licence scanning.</li>
<li>Performance-sensitive code gets benchmarks, not just tests.</li>
<li>Incident analyses drafted with AI are checked against logs, metrics and timelines before they are shared.</li>
</ul>
<h3>Guardrails as code</h3>
<p>Standards that rely on memory decay. Put them in pre-commit hooks, CI pipelines and repository rules: required checks, coverage thresholds on changed lines, dependency allow-lists, secret scanning, required reviewers for sensitive paths. This makes compliance the default path, the same principle as a golden path.</p>
<h3>Measure outcomes</h3>
<p>Track the DORA measures (deployment frequency, lead time for changes, change failure rate, failed deployment recovery time), review time, escaped defects, security findings per change, and developer experience surveys. Avoid targets on lines of code generated or suggestion acceptance rates: they are easy to game and say nothing about outcomes.</p>
<h3>Driving adoption</h3>
<p>Start with pilot teams and named champions, publish playbooks for specific tasks (test generation, refactoring, incident summaries) with examples of good validation, run short hands-on sessions, and share both wins and failures. Senior engineers set the norm: when they review AI output critically in public, and say when the tool was wrong, others copy that behaviour.</p>`,

/* ======== calculators ======== */
const GPUS = [["L4",24],["L40S",48],["A100 40GB",40],["A100 80GB",80],["H100 80GB",80],["H200 141GB",141]];
const SHAPES = {
  "8b":{n:"8B-class (Llama 3.1 8B shape)",p:8.0,l:32,kv:8,hd:128},
  "32b":{n:"32B-class (64 layers, 8 KV heads)",p:32.5,l:64,kv:8,hd:128},
  "70b":{n:"70B-class (Llama 3.1 70B shape)",p:70.6,l:80,kv:8,hd:128}
};
const PREC = [["BF16 / FP16",2],["FP8 / INT8",1],["4-bit",0.5]];
const KVPREC = [["BF16 / FP16",2],["FP8",1]];
const MEMUTIL = 0.9, OVERHEAD = 2; // GB per GPU for activations, graphs and runtime
function kvCalc(st){
  const m = SHAPES[st.model], mem = GPUS[st.gpu][1], tp = st.tp;
  const weights = m.p * PREC[st.wp][1];
  const usable = tp*mem*MEMUTIL;
  const budget = usable - weights - tp*OVERHEAD;
  const kvTok = 2*m.l*m.kv*m.hd*KVPREC[st.kp][1];
  const tokens = budget>0 ? budget*1e9/kvTok : 0;
  const seqs = Math.floor(tokens/Math.max(1,st.ctx));
  return {m, mem, weights, usable, budget, kvTok, tokens, seqs, perSeq: kvTok*st.ctx/1e9};
}
const f1 = x => (Math.round(x*10)/10).toLocaleString("en-US");
const usd = x => "$" + x.toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2});
function capCalc(c){
  const inflight = c.peak*c.lat;
  const eff = c.conc*(1-c.head/100);
  const replicas = Math.max(1, Math.ceil(inflight/Math.max(0.01,eff)));
  const gpus = replicas*c.gpr;
  const hourly = gpus*c.price;
  const tokHr = c.avg*c.out*3600;
  const perM = tokHr>0 ? hourly/(tokHr/1e6) : Infinity;
  const utilAvg = (c.avg*c.lat)/(replicas*c.conc);
  const utilPeak = inflight/(replicas*c.conc);
  return {inflight, replicas, gpus, hourly, monthly:hourly*730, tokHr, perM, utilAvg, utilPeak};
}
const SLOS = [99, 99.5, 99.9, 99.95];
const BURNS = [[14.4,"1 hour","5 minutes",2,"Page"],[6,"6 hours","30 minutes",5,"Page"],[1,"3 days","6 hours",10,"Ticket"]];
function sloCalc(s){
  const slo = SLOS[s.slo]/100, b = 1-slo;
  const total = s.rpd*s.days, budgetReq = b*total, budgetMin = b*s.days*1440;
  const seen = s.rpd*Math.max(0.01,s.elapsed);
  const rate = s.bad/Math.max(1,seen), burn = rate/b;
  const used = s.bad/Math.max(1,budgetReq);
  const projected = used*s.days/Math.max(0.01,s.elapsed);
  return {slo, b, budgetReq, budgetMin, rate, burn, used, projected};
}

function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true,1800); }
function copyText(txt, el){ try{ navigator.clipboard.writeText(txt).then(()=>toast("Copied"),()=>{ selectEl(el); toast("Press Ctrl/⌘ + C to copy"); }); }catch(e){ selectEl(el); toast("Press Ctrl/⌘ + C to copy"); } }
function selectEl(el){ if(!el) return; if (el.select) el.select(); else { const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); } }

/* ======== mermaid ======== */
const mmdReady = typeof mermaid !== "undefined";
if (mmdReady) mermaid.initialize({startOnLoad:false, securityLevel:"strict", theme:"base", fontFamily:"IBM Plex Sans, system-ui, sans-serif",
  flowchart:{htmlLabels:true, curve:"basis", padding:12},
  themeVariables:{background:"#FCFCFD", primaryColor:"#FFFFFF", primaryTextColor:"#121A26", primaryBorderColor:"#17624F", lineColor:"#586374", secondaryColor:"#DCEEE6", tertiaryColor:"#F2F4F6", textColor:"#121A26", clusterBkg:"#F2F4F6", clusterBorder:"#AAB4C1", edgeLabelBackground:"#FCFCFD", titleColor:"#121A26", fontSize:"14px"}});
let mmdN = 0;
async function draw(el, code){
  if (!mmdReady){ el.innerHTML = `<div class="err">The diagram renderer did not load.</div>`; return false; }
  const id = "mm"+(++mmdN);
  try { await mermaid.parse(code); const {svg} = await mermaid.render(id, code); el.innerHTML = svg; return true; }
  catch(e){ document.getElementById(id)?.remove(); document.getElementById("d"+id)?.remove(); el.innerHTML = `<div class="err">${esc(String(e&&e.message||e).split("\n").slice(0,6).join("\n"))}</div>`; return false; }
}

/* ======== components ======== */
const LVL = {f:["Foundation","f"],p:["Practitioner","p"],e:["Leader","e"]};
const pill = k => `<span class="lvl ${LVL[k][1]}">${LVL[k][0]}</span>`;
function example(ex){
  if (ex.kind === "diagram"){ const i = reg(ex.code);
    return `<div class="fig"><div class="figcap"><h4>${esc(ex.title)}</h4><button class="btn ghost" data-src>Source</button></div>
    <div class="canvas" data-mmd="${i}"><span class="loading">Rendering…</span></div>
    <p class="muted">${esc(ex.caption)}</p>
    <div class="notice"><b>What to notice</b><ul>${ex.notice.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div>
    <div class="srcbox" hidden>${pre(ex.code)}</div></div>`; }
  return `<div class="fig"><h4>${esc(ex.title)}</h4><div class="ba">
    <div class="before"><span class="eyebrow">Before</span><div class="txt">${esc(ex.before)}</div></div>
    <div class="after"><span class="eyebrow">After</span><div class="txt">${esc(ex.after)}</div></div></div>
    <div class="notice"><b>What to notice</b><ul>${ex.notice.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div></div>`;
}
function checklist(items, prefix, saved){ return `<ul class="reqs">${items.map((r,i)=>`<li><label><input type="checkbox" id="${prefix}-${i}" data-ck="${prefix}" data-i="${i}" ${saved&&saved.includes(i)?"checked":""}>${esc(r)}</label></li>`).join("")}</ul>`; }
const opts = (arr, sel, lab=x=>x[0]) => arr.map((x,i)=>`<option value="${i}" ${+sel===i?"selected":""}>${esc(lab(x))}</option>`).join("");
const numField = (id,label,val,attrs="") => `<label class="field"><span>${label}</span><input class="cell wide" type="number" id="${id}" value="${val}" ${attrs}></label>`;

function labHTML(m){
  const L = m.lab;
  const head = `<p style="max-width:68ch">${esc(L.brief)}</p>`;
  if (L.type==="sort"){
    return head + `<div data-sort>${L.items.map((it,i)=>`<div class="sortrow" data-row="${i}"><span>${esc(it[0])}</span><select class="sel" id="so-${m.id}-${i}" aria-label="Classify"><option value="">Choose…</option>${L.buckets.map(b=>`<option>${b}</option>`).join("")}</select><div class="fb" hidden></div></div>`).join("")}</div>
      <div class="btns" style="align-items:center"><button class="btn primary" data-sortcheck>Check</button><span class="score" data-sortscore></span></div>`;
  }
  if (L.type==="builder"){
    const v = S.build[m.id] || {};
    return head + `<div class="grid2"><div class="stack" style="gap:.7rem" data-build>${L.fields.map(f=>`<div class="field"><label for="b-${m.id}-${f[0]}">${esc(f[1])}</label><textarea id="b-${m.id}-${f[0]}" data-f="${f[0]}" rows="2" placeholder="${esc(f[2])}">${esc(v[f[0]]||"")}</textarea></div>`).join("")}
      <div class="btns"><button class="btn" data-example>Fill with Northbank example</button><button class="btn" data-clear>Clear</button></div></div>
      <div class="stack" style="gap:.5rem;min-width:0"><div class="edhead"><span class="eyebrow">Preview</span><button class="btn ghost" data-copyprev>Copy</button></div><div class="preview" data-prev></div>
      <span class="eyebrow" style="margin-top:.5rem">Self-check</span>${checklist(L.check, m.id+"-chk")}</div></div>`;
  }
  if (L.type==="scenario"){
    return head + L.scen.map((sc,si)=>`<div class="scen" data-scen="${si}"><span class="eyebrow">Situation ${si+1}</span><p><b>${esc(sc.s)}</b></p>
      ${sc.o.map((o,oi)=>`<label class="opt" data-o="${oi}"><input type="radio" name="sc${si}" id="sc-${si}-${oi}" value="${oi}">${esc(o[0])}</label>`).join("")}<div class="why" hidden></div></div>`).join("") +
      `<div class="btns" style="align-items:center"><button class="btn primary" data-sccheck>See feedback</button><span class="score" data-scscore></span></div>`;
  }
  if (L.type==="kv"){
    const st = S.kv[m.id] || {model:"70b", wp:0, kp:0, gpu:4, tp:2, ctx:8192, conc:32};
    return head + `<div class="calc" data-kv>
      <label class="field"><span>Model shape</span><select class="sel" id="kv-model">${Object.entries(SHAPES).map(([k,v])=>`<option value="${k}" ${st.model===k?"selected":""}>${esc(v.n)}</option>`).join("")}</select></label>
      <label class="field"><span>Weight precision</span><select class="sel" id="kv-wp">${opts(PREC,st.wp)}</select></label>
      <label class="field"><span>KV cache precision</span><select class="sel" id="kv-kp">${opts(KVPREC,st.kp)}</select></label>
      <label class="field"><span>GPU</span><select class="sel" id="kv-gpu">${opts(GPUS,st.gpu)}</select></label>
      <label class="field"><span>GPUs per replica (tensor parallel)</span><select class="sel" id="kv-tp">${[1,2,4,8].map(n=>`<option ${st.tp===n?"selected":""}>${n}</option>`).join("")}</select></label>
      ${numField("kv-ctx","Tokens per sequence (prompt + output)",st.ctx,'min="256" step="256"')}
      ${numField("kv-conc","Target concurrent sequences",st.conc,'min="1" step="1"')}
      </div>
      <div class="preview" data-kvout style="white-space:normal"></div>
      <p class="muted" style="font-size:.85rem">Estimates assume ${MEMUTIL*100}% of GPU memory is available to the engine and ${OVERHEAD} GB per GPU for activations and runtime. Real engines vary: confirm with the engine's startup log and a load test.</p>`;
  }
  if (L.type==="cap"){
    const c = S.capc[m.id] || {peak:20, avg:8, out:600, lat:12, conc:32, gpr:2, head:30, price:4};
    return head + `<div class="calc" data-cap>
      ${numField("cp-peak","Peak arrival (requests/s)",c.peak,'min="0.1" step="0.1"')}
      ${numField("cp-avg","Average arrival (requests/s)",c.avg,'min="0.1" step="0.1"')}
      ${numField("cp-out","Average output tokens",c.out,'min="1" step="10"')}
      ${numField("cp-lat","Mean time per request at SLO (s)",c.lat,'min="0.1" step="0.1"')}
      ${numField("cp-conc","Per-replica concurrency at SLO (from load test)",c.conc,'min="1" step="1"')}
      ${numField("cp-gpr","GPUs per replica",c.gpr,'min="1" step="1"')}
      ${numField("cp-head","Headroom %",c.head,'min="0" max="80" step="5"')}
      ${numField("cp-price","Cost per GPU-hour ($)",c.price,'min="0.1" step="0.1"')}
      </div>
      <div class="preview" data-capout style="white-space:normal"></div>
      <div class="btns"><button class="btn" data-capreset>Reset to example</button></div>`;
  }
  if (L.type==="slo"){
    const s = S.slo[m.id] || {slo:2, days:30, rpd:2000000, bad:30000, elapsed:10};
    return head + `<div class="calc" data-slo>
      <label class="field"><span>Availability SLO</span><select class="sel" id="sl-slo">${SLOS.map((x,i)=>`<option value="${i}" ${s.slo===i?"selected":""}>${x}%</option>`).join("")}</select></label>
      ${numField("sl-days","Window (days)",s.days,'min="1" max="90" step="1"')}
      ${numField("sl-rpd","Requests per day",s.rpd,'min="1" step="1000"')}
      ${numField("sl-elapsed","Days elapsed in window",s.elapsed,'min="0.1" step="0.5"')}
      ${numField("sl-bad","Bad requests so far",s.bad,'min="0" step="1"')}
      </div>
      <div class="preview" data-sloout style="white-space:normal"></div>
      <div class="tbl"><table><thead><tr><th>Burn rate</th><th>Long window</th><th>Short window</th><th>Error rate threshold</th><th>Budget spent</th><th>Action</th></tr></thead><tbody data-burns></tbody></table></div>
      <div class="scen"><span class="eyebrow">Check</span><p><b>For the SLO selected above, what error rate (in %) sustained over one hour should page someone?</b></p>
        <div class="btns" style="align-items:center"><input class="cell wide" type="number" step="any" id="sl-ans" aria-label="Error rate percent"><span>%</span><button class="btn primary" data-slocheck>Check</button></div><div class="why" data-slofb hidden></div></div>`;
  }
  return "";
}

/* ======== views ======== */
const VIEWS = ["home", ...MODULES.map(m=>m.id), "capstones", "reference"];
let current = "home";
function renderTabs(){
  const b=(id,l,d)=>`<button data-go="${id}" aria-current="${current===id}">${d!==undefined?`<span class="dot ${d?"ok":""}"></span>`:""}${l}</button>`;
  document.getElementById("tabs").innerHTML = b("home","Overview")+`<span class="sep"></span>`+MODULES.map((m,i)=>b(m.id,`${i+1}. ${m.title}`,modDone(m))).join("")+`<span class="sep"></span>`+b("capstones","Capstones")+b("reference","Reference");
}
function go(id, top){
  if (!VIEWS.includes(id)) id="home";
  current=id; renderTabs(); CODE.length=0;
  const v=document.getElementById("view");
  v.innerHTML = id==="home"?viewHome(): id==="capstones"?viewCaps(): id==="reference"?viewRef(): viewModule(MODULES.find(m=>m.id===id));
  bind(v,id);
  v.querySelectorAll("[data-mmd]").forEach(el=>draw(el, CODE[+el.dataset.mmd]));
  try{ if(location.hash.slice(1)!==id) history.replaceState(null,"","#"+id); }catch(e){}
  if (top!==false) window.scrollTo({top:0});
  document.querySelector(`nav.tabs [data-go="${id}"]`)?.scrollIntoView({block:"nearest",inline:"center"});
}
const nextMod = () => (MODULES.find(m=>!modDone(m))||{id:"capstones"}).id;

  return `<section class="sheet"><div class="hero">
    <div class="stack" style="gap:.5rem"><span class="eyebrow">Self-paced practicum · ${MODULES.length} modules · ${MODULES.length} section projects · ${CAPSTONES.length} capstones</span>
      <h1>Build and run the AI platform other teams depend on</h1>
      <p class="lede">For platform and software engineers who build shared AI infrastructure: model serving on GPUs, Kubernetes and OpenShift platforms, model gateways and guardrails, performance and capacity, SLOs and incident response, secure-by-design delivery, golden paths, and leading AI-assisted engineering. The running case: you are a senior engineer on Northbank's AI platform team, building foundation services that dozens of application teams rely on. Each module has worked examples, a quiz, an interactive lab, "explain it out loud" prompts, and a project you apply to real work.</p>

    <div class="los"><span class="eyebrow">The AI platform stack · tap each layer</span>
      <div class="chain" role="group" aria-label="AI platform stack">${LOS.map((l,i)=>`<button data-los="${i}" aria-pressed="${i===0}"><small>${String(i+1).padStart(2,"0")}</small>${l.k}</button>`).join("")}</div>
      <div class="loscard" id="loscard"></div></div>
  </div></section>

  <section class="section" style="margin-top:2rem"><div class="sec-head"><h2>Learning path</h2></div>
    <div class="path">${stages.map(([k,n,d,idx])=>{ const done=idx.filter(i=>modDone(MODULES[i])).length;
      return `<div class="stage">${pill(k)}<p>${d}</p><ol start="${idx[0]+1}">${idx.map(i=>`<li><button class="link" data-go="${MODULES[i].id}">${MODULES[i].title}</button></li>`).join("")}</ol><div class="meterline"><div class="bar"><i style="width:${done/idx.length*100}%"></i></div>${done}/${idx.length}</div></div>`;}).join("")}</div></section>

  <section class="section"><div class="sec-head"><h2>Progress register</h2><span class="muted">Saved in this browser.</span></div>
    <div class="tbl"><table><thead><tr><th>Brief</th><th>Module</th><th>Stage</th><th>Read</th><th>Quiz</th><th>Lab</th><th>Project</th></tr></thead><tbody>
    ${MODULES.map(m=>`<tr><td class="num">${m.no}</td><td><button class="link" data-go="${m.id}">${m.title}</button><div class="muted" style="font-size:.8rem">${m.time}</div></td><td>${pill(m.lvl)}</td>
      <td class="chk ${S.read[m.id]?"ok":"no"}">${S.read[m.id]?"✓":"–"}</td><td class="num">${S.quiz[m.id]!==undefined?S.quiz[m.id]+"/5":"–"}</td><td class="chk ${S.lab[m.id]?"ok":"no"}">${S.lab[m.id]?"✓":"–"}</td><td class="num">${projN(m)}/${m.project.rubric.length}</td></tr>`).join("")}
    ${CAPSTONES.map(c=>`<tr><td class="num">${c.code}</td><td><button class="link" data-go="capstones">${c.title}</button></td><td>${pill("e")}</td><td colspan="4" class="num">${(S.cap[c.id]||[]).length}/${c.rubric.length} rubric items</td></tr>`).join("")}
    </tbody></table></div>
    <p class="muted" style="font-size:.88rem">A module is complete when you have read it, scored 4/5 or better, finished the lab, and met every item in its project rubric.</p></section>

  <section class="section"><div class="sec-head"><h2>How to work through it</h2></div><div class="prose"><ol>
    <li>Take the self-assessment in Reference first, and start with your two lowest areas if you are short of time.</li>

function viewModule(m){
  const i=MODULES.indexOf(m), prev=MODULES[i-1], next=MODULES[i+1];
  const status = modDone(m)?"Complete":(S.read[m.id]||S.quiz[m.id]!==undefined||S.lab[m.id]||projN(m))?"In progress":"Not started";
  return `<article class="sheet">
    <span class="eyebrow">Module ${i+1} of ${MODULES.length}</span>
    <h1 style="margin-top:.3rem">${m.title}</h1>
    <p class="lede" style="margin-top:.6rem">${m.summary}</p>
    <div class="memo"><div><span class="k">Brief</span><span class="v">${m.no}</span></div><div><span class="k">Stage</span><span class="v">${LVL[m.lvl][0]}</span></div><div><span class="k">Time</span><span class="v">${m.time} + project</span></div><div><span class="k">Status</span><span class="v">${status}</span></div></div>

    <div class="section" style="margin-top:1.8rem"><div class="sec-head"><span class="tag">Objectives</span></div>

    <div class="section" id="learn"><div class="sec-head"><span class="tag">Learn</span></div><div class="prose">${m.learn}</div>
      <div><button class="btn ${S.read[m.id]?"done":""}" data-read>${S.read[m.id]?"✓ Marked as read":"Mark as read"}</button></div></div>

    <div class="section" id="r-num"><div class="sec-head"><span class="tag">Numbers to know</span><h2>Formulas and figures worth memorising</h2></div>
      <div class="tbl"><table><tbody>${NUMBERS.map(n=>`<tr><td><b>${esc(n[0])}</b></td><td>${esc(n[1])}</td></tr>`).join("")}</tbody></table></div></div>

    <div class="section" id="r-cards"><div class="sec-head"><span class="tag">Flashcards</span><h2>Drill the vocabulary</h2></div>
      <div class="flash" data-flash tabindex="0" role="button" aria-label="Flashcard: press to flip"><span class="eyebrow" data-fcount></span><div class="fterm" data-fterm></div><div class="fdef" data-fdef hidden></div><span class="muted" style="font-size:.8rem" data-fhint>Tap to reveal</span></div>
      <div class="btns"><button class="btn" data-fprev>← Previous</button><button class="btn primary" data-fnext>Next →</button><button class="btn" data-fshuf>Shuffle</button></div></div>

    <div class="section" id="r-tpl"><div class="sec-head"><span class="tag">Templates</span><h2>Copy-ready templates</h2></div>
      <div class="stack" style="gap:.6rem">${TEMPLATES.map((t,i)=>`<details class="reveal"><summary>${esc(t[0])}</summary><div class="stack" style="gap:.5rem">${pre(t[1])}<div><button class="btn" data-copytpl="${i}">Copy template</button></div></div></details>`).join("")}</div></div>

    <div class="section" id="r-fw"><div class="sec-head"><span class="tag">Frameworks</span><h2>Mental models and frameworks</h2></div>
      <div class="tbl"><table><thead><tr><th>Framework</th><th>Use it for</th><th>Core idea</th></tr></thead><tbody>${FRAMEWORKS.map(f=>`<tr><td><b>${f[0]}</b></td><td>${f[1]}</td><td>${f[2]}</td></tr>`).join("")}</tbody></table></div></div>

    <div class="section" id="r-q"><div class="sec-head"><span class="tag">Field guide</span><h2>Questions that do the work</h2></div>
      <div class="grid2">
        <div class="stack" style="gap:.4rem"><h4>With an application team</h4><ul class="reqs"><li>→ Who uses it, how many, and when is the peak?</li><li>→ What latency will users tolerate before they give up?</li><li>→ What data goes in, and what is its classification?</li><li>→ What happens if it is wrong, or down for an hour?</li><li>→ Who supports it at 2 a.m.?</li></ul></div>
        <div class="stack" style="gap:.4rem"><h4>With security and risk</h4><ul class="reqs"><li>→ Which data classes may reach which models?</li><li>→ What may be logged, and for how long?</li><li>→ What evidence do audits need from the platform?</li><li>→ Which actions by an AI need human approval?</li></ul></div>
        <div class="stack" style="gap:.4rem"><h4>With finance and capacity owners</h4><ul class="reqs"><li>→ Is cost reported per tenant, and per million tokens?</li><li>→ What utilisation do we assume, and what headroom?</li><li>→ When does self-hosting beat a managed API for this volume?</li></ul></div>
        <div class="stack" style="gap:.4rem"><h4>In a design review</h4><ul class="reqs"><li>→ What happens when the model is slow, or the cache is full?</li><li>→ What if the provider is down, or one tenant sends 10× traffic?</li><li>→ How will we know it is working, from the user's side?</li><li>→ What did we choose not to build, and why?</li></ul></div>
      </div></div>

    <div class="section" id="r-gloss"><div class="sec-head"><span class="tag">Glossary</span></div><dl class="gloss">${GLOSS.map(g=>`<dt>${g[0]}</dt><dd>${g[1]}</dd>`).join("")}</dl></div>

    <div class="section" id="r-read"><div class="sec-head"><span class="tag">Reading</span><h2>Books and links</h2></div>
      <div class="grid2"><ul class="reqs">${READING.map(r=>`<li>→ <i>${r[1]}</i> <span class="muted">· ${r[0]}</span></li>`).join("")}</ul>
      <ul class="reqs">${LINKS.map(l=>`<li>→ <a href="${l[1]}" target="_blank" rel="noopener">${l[0]}</a></li>`).join("")}</ul></div></div>
  </section>`;
}

/* ======== binding ======== */
let FC = GLOSS.map((g,i)=>i), fci = 0;
function bind(v,id){
  v.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));
  v.querySelectorAll(".toc a").forEach(a=>a.addEventListener("click",e=>{ e.preventDefault(); document.getElementById(a.getAttribute("href").slice(1))?.scrollIntoView({behavior:"smooth"}); }));
  v.querySelectorAll("[data-src]").forEach(b=>b.addEventListener("click",()=>{ const x=b.closest(".fig").querySelector(".srcbox"); x.hidden=!x.hidden; b.textContent=x.hidden?"Source":"Hide source"; }));

  if (id==="home"){
    const card=v.querySelector("#loscard");
    const set=i=>{ const l=LOS[i]; v.querySelectorAll("[data-los]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.los===i));
      card.innerHTML=`<span class="eyebrow">Northbank example</span><div class="big">${esc(l.ex)}</div><div class="kv"><div><span class="k">Usually owned by</span>${esc(l.own)}</div><div><span class="k">Artifacts</span>${esc(l.art)}</div><div style="grid-column:1/-1"><span class="k">What the work is</span>${esc(l.you)}</div></div>`; };
    v.querySelectorAll("[data-los]").forEach(b=>b.addEventListener("click",()=>set(+b.dataset.los))); set(0);
  }

  if (id==="capstones"){
    v.querySelectorAll("[data-ck]").forEach(cb=>cb.addEventListener("change",()=>{ const cid=cb.dataset.ck.slice(4), c=CAPSTONES.find(x=>x.id===cid);
      const set=new Set(S.cap[cid]||[]); cb.checked?set.add(+cb.dataset.i):set.delete(+cb.dataset.i); S.cap[cid]=[...set]; save();
      v.querySelector(`[data-capmeter="${cid}"]`).innerHTML=`<div class="bar"><i style="width:${set.size/c.rubric.length*100}%"></i></div>${set.size}/${c.rubric.length}`; }));
  }

  if (id==="reference"){
    const out=v.querySelector("[data-compout]");
    const render=()=>{ const vals=COMP.map((c,i)=>S.comp[i]); const n=vals.filter(Boolean).length;
      if(!n){ out.innerHTML=`<span class="muted">Rate at least one area to see your profile.</span>`; return; }
      const low=COMP.map((c,i)=>[c[0],vals[i]]).filter(x=>x[1]).sort((a,b)=>a[1]-b[1]).slice(0,2);
      out.innerHTML=`<div class="stack" style="gap:.4rem">${COMP.map((c,i)=>`<div style="display:grid;grid-template-columns:minmax(0,13rem) minmax(0,1fr) 1.5rem;gap:.6rem;align-items:center;font-size:.85rem"><span>${c[0]}</span><div class="bar" style="height:10px"><i style="width:${(vals[i]||0)*25}%"></i></div><span class="num">${vals[i]||"–"}</span></div>`).join("")}
      <p style="margin-top:.5rem"><b>Focus next:</b> ${low.map(x=>`${x[0]} (${COMPMAP[x[0]]})`).join(" and ")}.</p></div>`; };
    v.querySelectorAll("[data-c]").forEach(b=>b.addEventListener("click",()=>{ const i=+b.dataset.c, l=+b.dataset.l; S.comp[i]=l; persist();
      v.querySelectorAll(`[data-c="${i}"]`).forEach(x=>x.setAttribute("aria-pressed",+x.dataset.l===l)); render(); }));
    render();
    v.querySelectorAll("[data-copytpl]").forEach(b=>b.addEventListener("click",()=>copyText(TEMPLATES[+b.dataset.copytpl][1], b.closest("details").querySelector("pre"))));
    const card=v.querySelector("[data-flash]"), term=v.querySelector("[data-fterm]"), def=v.querySelector("[data-fdef]"), hint=v.querySelector("[data-fhint]"), cnt=v.querySelector("[data-fcount]");
    const show=()=>{ const g=GLOSS[FC[fci]]; term.textContent=g[0]; def.textContent=g[1]; def.hidden=true; hint.hidden=false; cnt.textContent=`Card ${fci+1} of ${FC.length}`; };
    const flip=()=>{ def.hidden=!def.hidden; hint.hidden=!def.hidden; };
    card.addEventListener("click",flip); card.addEventListener("keydown",e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); flip(); } });
    v.querySelector("[data-fnext]").addEventListener("click",()=>{ fci=(fci+1)%FC.length; show(); });
    v.querySelector("[data-fprev]").addEventListener("click",()=>{ fci=(fci-1+FC.length)%FC.length; show(); });
    v.querySelector("[data-fshuf]").addEventListener("click",()=>{ for(let i=FC.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [FC[i],FC[j]]=[FC[j],FC[i]]; } fci=0; show(); toast("Shuffled"); });
    show();
  }

  const m=MODULES.find(x=>x.id===id); if(!m) return;
  v.querySelector("[data-read]").addEventListener("click",e=>{ S.read[m.id]=!S.read[m.id]; save(); e.target.classList.toggle("done",!!S.read[m.id]); e.target.textContent=S.read[m.id]?"✓ Marked as read":"Mark as read"; });
  const lb=v.querySelector("[data-labdone]");
  const markLab=(on)=>{ S.lab[m.id]=on; save(); lb.classList.toggle("done",on); lb.textContent=on?"✓ Lab complete":"Mark lab complete"; };
  lb.addEventListener("click",()=>{ markLab(!S.lab[m.id]); if(S.lab[m.id]) toast("Lab recorded"); });

  const form=v.querySelector("[data-quiz]");
  form.addEventListener("submit",e=>{ e.preventDefault(); let sc=0;
    m.quiz.forEach((q,qi)=>{ const fs=form.querySelectorAll("fieldset")[qi], sel=form.querySelector(`input[name="q${qi}"]:checked`);
      fs.querySelectorAll(".opt").forEach((o,oi)=>{ o.classList.remove("right","wrong"); if(oi===q.a) o.classList.add("right"); else if(sel&&+sel.value===oi) o.classList.add("wrong"); });
      const ok=sel&&+sel.value===q.a; if(ok) sc++; const w=fs.querySelector(".why"); w.hidden=false; w.innerHTML=`<b>${ok?"Correct.":sel?"Not quite.":"No answer."}</b> ${esc(q.why)}`; });
    form.querySelector("[data-qscore]").textContent=`${sc} / 5`; S.quiz[m.id]=Math.max(S.quiz[m.id]||0,sc); save(); if(sc>=4) toast("Quiz passed"); });
  form.querySelector("[data-qreset]").addEventListener("click",()=>{ form.reset(); form.querySelectorAll(".opt").forEach(o=>o.classList.remove("right","wrong")); form.querySelectorAll(".why").forEach(w=>w.hidden=true); form.querySelector("[data-qscore]").textContent=""; });

  v.querySelectorAll(`[data-ck="pj-${m.id}"]`).forEach(cb=>cb.addEventListener("change",()=>{ const set=new Set(S.proj[m.id]||[]); cb.checked?set.add(+cb.dataset.i):set.delete(+cb.dataset.i); S.proj[m.id]=[...set]; save();
    v.querySelector("[data-pjmeter]").innerHTML=`<div class="bar"><i style="width:${set.size/m.project.rubric.length*100}%"></i></div>${set.size}/${m.project.rubric.length}`; }));

  const L=m.lab;
  if (L.type==="sort"){
    v.querySelector("[data-sortcheck]").addEventListener("click",()=>{ let sc=0;
      L.items.forEach((it,i)=>{ const row=v.querySelector(`[data-row="${i}"]`), val=row.querySelector("select").value, fb=row.querySelector(".fb");
        row.classList.remove("right","wrong"); const ok=val===it[1]; if(ok) sc++; row.classList.add(ok?"right":"wrong"); fb.hidden=false; fb.textContent=(ok?"Correct. ":`Answer: ${it[1]}. `)+it[2]; });
      v.querySelector("[data-sortscore]").textContent=`${sc} / ${L.items.length}`; if(sc>=L.items.length-2){ markLab(true); toast("Lab recorded"); } });
  }
  if (L.type==="builder"){
    const prev=v.querySelector("[data-prev]");
    const vals=()=>{ const o={}; v.querySelectorAll("[data-build] [data-f]").forEach(t=>o[t.dataset.f]=t.value.trim()); return o; };
    const upd=()=>{ const o=vals(); S.build[m.id]=o; persist(); prev.textContent=L.template(o); };
    v.querySelectorAll("[data-build] [data-f]").forEach(t=>t.addEventListener("input",upd));
    v.querySelector("[data-example]").addEventListener("click",()=>{ L.fields.forEach(f=>v.querySelector(`[data-f="${f[0]}"]`).value=f[2]); upd(); });
    v.querySelector("[data-clear]").addEventListener("click",()=>{ v.querySelectorAll("[data-build] [data-f]").forEach(t=>t.value=""); upd(); });
    v.querySelector("[data-copyprev]").addEventListener("click",()=>copyText(prev.textContent, prev));
    upd();
  }
  if (L.type==="scenario"){
    v.querySelector("[data-sccheck]").addEventListener("click",()=>{ let strong=0;
      L.scen.forEach((sc,si)=>{ const box=v.querySelector(`[data-scen="${si}"]`), sel=box.querySelector("input:checked"), why=box.querySelector(".why");
        box.querySelectorAll(".opt").forEach((o,oi)=>{ o.classList.remove("strong","ok","weak"); if(sel&&+sel.value===oi) o.classList.add(sc.o[oi][1]); else if(sc.o[oi][1]==="strong") o.classList.add("strong"); });
        why.hidden=false; if(!sel){ why.innerHTML=`<b>No answer.</b> Strongest: ${esc(sc.o.find(o=>o[1]==="strong")[0])}`; return; }
        const o=sc.o[+sel.value]; if(o[1]==="strong") strong++; why.innerHTML=`<b>${o[1]==="strong"?"Strong.":o[1]==="ok"?"Workable, with costs.":"Weak."}</b> ${esc(o[2])}`; });
      v.querySelector("[data-scscore]").textContent=`${strong} / ${L.scen.length} strong`; if(strong>=L.scen.length-1){ markLab(true); toast("Lab recorded"); } });
  }
  if (L.type==="kv"){
    const out=v.querySelector("[data-kvout]"), C=L.challenge;
    const upd=()=>{ const st={model:v.querySelector("#kv-model").value, wp:+v.querySelector("#kv-wp").value, kp:+v.querySelector("#kv-kp").value, gpu:+v.querySelector("#kv-gpu").value, tp:+v.querySelector("#kv-tp").value, ctx:Math.max(256,+v.querySelector("#kv-ctx").value||256), conc:Math.max(1,+v.querySelector("#kv-conc").value||1)};
      S.kv[m.id]=st; persist(); const r=kvCalc(st);
      const fitsW = r.weights/st.tp < r.mem*MEMUTIL - OVERHEAD;
      const ok = fitsW && r.seqs>=st.conc;
      const verdict = !fitsW ? `<span class="flag hi">Does not fit</span> The weights alone (${f1(r.weights/st.tp)} GB per GPU) exceed usable memory. Use more GPUs, a bigger GPU, or lower weight precision.`
        : r.seqs<1 ? `<span class="flag hi">No room for KV cache</span> Weights fit, but there is no memory left for even one sequence of this length.`
        : ok ? `<span class="flag ok">Fits</span> The KV cache holds about <b>${r.seqs}</b> sequences of ${st.ctx.toLocaleString("en-US")} tokens: enough for your target of ${st.conc}.`
        : `<span class="flag lo">Short</span> The KV cache holds about <b>${r.seqs}</b> sequences of ${st.ctx.toLocaleString("en-US")} tokens, below your target of ${st.conc}. Requests beyond that queue or are preempted.`;
      out.innerHTML=`<div class="kvgrid">
        <div><span class="k">Weights</span><b>${f1(r.weights)} GB</b><small>${f1(r.weights/st.tp)} GB per GPU</small></div>
        <div><span class="k">Usable memory</span><b>${f1(r.usable)} GB</b><small>${st.tp} × ${esc(GPUS[st.gpu][0])} at ${MEMUTIL*100}%</small></div>
        <div><span class="k">KV cache budget</span><b>${f1(Math.max(0,r.budget))} GB</b><small>after weights and ${f1(st.tp*OVERHEAD)} GB overhead</small></div>
        <div><span class="k">KV per token</span><b>${f1(r.kvTok/1024)} KiB</b><small>2 × ${r.m.l} layers × ${r.m.kv} KV heads × ${r.m.hd} × ${KVPREC[st.kp][1]} B</small></div>
        <div><span class="k">KV per sequence</span><b>${f1(r.perSeq)} GB</b><small>at ${st.ctx.toLocaleString("en-US")} tokens</small></div>
        <div><span class="k">Tokens in cache</span><b>${Math.floor(r.tokens).toLocaleString("en-US")}</b><small>across all sequences</small></div></div>
        <p style="margin-top:.7rem">${verdict}</p>
        ${st.wp>0||st.kp>0?`<p class="muted" style="margin-top:.35rem;font-size:.85rem">Lower precision changes quality. Run your evaluation set before production.</p>`:""}`;
      if(st.model===C.model && st.tp<=C.maxGpus && st.ctx>=C.ctx && st.conc>=C.conc && ok && !S.lab[m.id]){ markLab(true); toast("Challenge met · lab recorded"); } };
    v.querySelectorAll("[data-kv] select, [data-kv] input").forEach(i=>i.addEventListener("input",upd)); upd();
  }
  if (L.type==="cap"){
    const out=v.querySelector("[data-capout]");
    const ids=["peak","avg","out","lat","conc","gpr","head","price"];
    const upd=()=>{ const c={}; ids.forEach(k=>c[k]=Math.max(0,+v.querySelector(`#cp-${k}`).value||0)); c.head=Math.min(80,c.head); c.conc=Math.max(1,c.conc); c.gpr=Math.max(1,Math.round(c.gpr));
      S.capc[m.id]=c; persist(); const r=capCalc(c);
      const pass = r.perM<=L.target && c.head>=L.minHead;
      out.innerHTML=`<div class="kvgrid">
        <div><span class="k">In flight at peak</span><b>${f1(r.inflight)}</b><small>${c.peak} req/s × ${c.lat} s</small></div>
        <div><span class="k">Replicas</span><b>${r.replicas}</b><small>at ${c.conc} per replica, ${c.head}% headroom</small></div>
        <div><span class="k">GPUs</span><b>${r.gpus}</b><small>${c.gpr} per replica</small></div>
        <div><span class="k">Cost</span><b>${usd(r.hourly)}/h</b><small>about $${Math.round(r.monthly).toLocaleString("en-US")} per month</small></div>
        <div><span class="k">Utilisation</span><b>${Math.round(r.utilAvg*100)}% avg</b><small>${Math.round(r.utilPeak*100)}% at peak</small></div>
        <div><span class="k">Cost per 1M output tokens</span><b>${isFinite(r.perM)?usd(r.perM):"–"}</b><small>at average traffic</small></div></div>
        <p style="margin-top:.7rem">${pass?`<span class="flag ok">Challenge met</span> Under ${usd(L.target)} with ${c.head}% headroom.`:`<span class="flag lo">Challenge</span> Target ${usd(L.target)} per million output tokens with at least ${L.minHead}% headroom.`}</p>
        <p class="muted" style="margin-top:.35rem;font-size:.85rem">Average utilisation is what you pay for idle capacity. Levers that raise per-replica concurrency at the same latency (batching, FP8, prefix caching) or cut GPUs per replica move cost the most. Check every change against a load test.</p>`;
      if(pass && !S.lab[m.id]){ markLab(true); toast("Challenge met · lab recorded"); } };
    v.querySelectorAll("[data-cap] input").forEach(i=>i.addEventListener("input",upd));
    v.querySelector("[data-capreset]").addEventListener("click",()=>{ delete S.capc[m.id]; persist(); go(m.id,false); document.getElementById("lab")?.scrollIntoView(); });
    upd();
  }
  if (L.type==="slo"){
    const out=v.querySelector("[data-sloout]"), tb=v.querySelector("[data-burns]");
    const read=()=>({slo:+v.querySelector("#sl-slo").value, days:Math.max(1,+v.querySelector("#sl-days").value||30), rpd:Math.max(1,+v.querySelector("#sl-rpd").value||1), elapsed:Math.max(0.1,+v.querySelector("#sl-elapsed").value||0.1), bad:Math.max(0,+v.querySelector("#sl-bad").value||0)});
    const upd=()=>{ const s=read(); S.slo[m.id]=s; persist(); const r=sloCalc(s);
      const pctUsed=Math.round(r.used*100), proj=Math.round(r.projected*100);
      const status = r.used>=1?["hi","Budget exhausted"]:r.projected>1?["lo","On track to overspend"]:["ok","Within budget"];
      out.innerHTML=`<div class="kvgrid">
        <div><span class="k">Error budget</span><b>${(r.b*100).toFixed(2)}%</b><small>of requests over ${s.days} days</small></div>
        <div><span class="k">As full-outage time</span><b>${r.budgetMin>=120?f1(r.budgetMin/60)+" h":f1(r.budgetMin)+" min"}</b><small>(1 − SLO) × window</small></div>
        <div><span class="k">As requests</span><b>${Math.round(r.budgetReq).toLocaleString("en-US")}</b><small>bad requests allowed</small></div>
        <div><span class="k">Spent so far</span><b>${pctUsed}%</b><small>after ${s.elapsed} of ${s.days} days</small></div>
        <div><span class="k">Average burn rate</span><b>${r.burn.toFixed(2)}×</b><small>error rate ${(r.rate*100).toFixed(3)}%</small></div>
        <div><span class="k">Projected at window end</span><b>${proj}%</b><small>if the current rate continues</small></div></div>
        <p style="margin-top:.7rem"><span class="flag ${status[0]}">${status[1]}</span> ${r.used>=0.75?"Your error budget policy should now be in force: freeze risky changes and prioritise reliability work.":r.projected>1?"Find the main source of bad requests before the budget runs out.":"Room to ship changes; keep watching the burn rate."}</p>`;
      tb.innerHTML=BURNS.map(bn=>`<tr><td class="num">${bn[0]}×</td><td>${bn[1]}</td><td>${bn[2]}</td><td class="num">${(Math.round(bn[0]*r.b*1e6)/1e4).toFixed(Math.round(bn[0]*r.b*1e6)/1e4<0.1?3:2)}%</td><td class="num">${bn[3]}%</td><td>${bn[4]}</td></tr>`).join(""); };
    v.querySelectorAll("[data-slo] select, [data-slo] input").forEach(i=>i.addEventListener("input",upd));
    v.querySelector("[data-slocheck]").addEventListener("click",()=>{ const r=sloCalc(read()), want=14.4*r.b*100, got=+v.querySelector("#sl-ans").value, fb=v.querySelector("[data-slofb]");
      const ok = got>0 && Math.abs(got-want)/want<=0.03; fb.hidden=false;
      fb.innerHTML = ok?`<b>Correct.</b> 14.4 × ${(r.b*100).toFixed(2)}% = ${want.toFixed(3)}%. Sustained for an hour, that spends 2% of a 30-day budget.`:`<b>Not quite.</b> Multiply the fast-burn rate (14.4) by the error budget rate (1 − SLO). Try again.`;
      if(ok){ markLab(true); toast("Lab recorded"); } });
    upd();
  }
}

document.getElementById("tabs").addEventListener("click",e=>{ const b=e.target.closest("[data-go]"); if(b) go(b.dataset.go); });
updateMeter();
go((location.hash||"#home").slice(1), false);
</script>
</body></html>
