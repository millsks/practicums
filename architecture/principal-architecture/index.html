  project:{title:"Your operating system", deliver:"A stakeholder map, operating rhythm, a WSJF-ranked portfolio view, and a quarterly impact narrative.", steps:["Map stakeholders by power and interest; set a cadence for each quadrant","Write your weekly, monthly and quarterly rhythm and block the calendar","Score the candidate initiatives in your domain with WSJF with product and CDO partners","Meet your data risk partner and audit liaison; list open findings that architecture can help close","Draft a one-page impact narrative for this quarter","Share it with your manager"],
    rubric:["Data owners, privacy, risk and audit appear on the map","The rhythm is in your calendar","WSJF was scored with partners, not alone","Open findings have architectural owners","Impact narrative cites outcomes and people, not activity"]}

{ id:"m10", lvl:"f", title:"From builder to multiplier", time:"75 min",
  summary:"The identity shift from individual contributor to leader: where satisfaction comes from now, letting go of the keyboard, and staying technically sharp without becoming the bottleneck.",
  objectives:["Name what changes in how your work is measured, and how that feels","Recognise accidental-diminisher habits and swap them for multiplier habits","Design hands-on practice that keeps you sharp and off the critical path","Build feedback loops that make slow, indirect impact visible"],
  learn:`
<h3>The transition nobody announces</h3>
<p>A promotion changes your job overnight but your identity slowly. For years a good day meant shipping something: a closed ticket, a green build, a problem solved with your own hands. At principal and ED level, most good days end with nothing you built yourself. Many strong engineers find this disorienting, and some drift back to coding because it feels like real work. Naming the shift is the first step to managing it.</p>
<h3>What changes</h3>
<div class="tbl"><table><thead><tr><th>Dimension</th><th>As an individual contributor</th><th>Now</th></tr></thead><tbody>
<tr><td>Unit of output</td><td>Code and designs you implement</td><td>Decisions, clarity and other people's capability</td></tr>
<tr><td>Feedback loop</td><td>Minutes to days: tests pass, feature ships</td><td>Months to quarters: outcomes move, people grow</td></tr>
<tr><td>Source of credibility</td><td>Being the best at the problem</td><td>Making the group better at problems</td></tr>
<tr><td>Time</td><td>Long focus blocks (maker's schedule)</td><td>Fragmented by meetings (manager's schedule)</td></tr>
<tr><td>What done means</td><td>Merged and deployed</td><td>Decided, understood and owned by someone else</td></tr>
</tbody></table></div>
<h3>The dip is normal</h3>
<p>Losing daily mastery feels like a loss because it is one. You were expert at the old job and are a novice at the new one, so expect a dip that can last six to eighteen months. Signs you are stuck: you measure your week by code written, you feel guilty in meetings, or you take the interesting ticket "just this once".</p>
<h3>Where satisfaction comes from now</h3>
<ul>
<li><b>The craft of decisions.</b> A well-framed trade-off or a clear decision record can be as satisfying as an elegant function, if you treat writing and deciding as craft.</li>
<li><b>Other people's wins.</b> An engineer you coached presents the design you would have made, and defends it well.</li>
<li><b>Systems that outlast you.</b> A paved road, a principle set, a review process that runs without you.</li>
<li><b>Slow outcomes.</b> Access lead time falling quarter on quarter; legacy jobs switched off one by one. You need a way to see them (below).</li>
</ul>
<h3>Multipliers and accidental diminishers</h3>
<p>Liz Wiseman's research found that leaders either amplify the intelligence of the people around them or diminish it, usually with good intentions. Former star engineers are prone to these habits:</p>
<div class="tbl"><table><thead><tr><th>Habit</th><th>What it looks like</th><th>Multiplier swap</th></tr></thead><tbody>
<tr><td>Rescuer</td><td>Jumps in to fix it when someone struggles</td><td>Ask what they have tried and what they would try next</td></tr>
<tr><td>Rapid responder</td><td>Answers first in every thread</td><td>Wait; let others answer, then add</td></tr>
<tr><td>Idea fountain</td><td>Brings five ideas to every meeting</td><td>Bring one good question and leave space</td></tr>
<tr><td>Perfectionist reviewer</td><td>Rewrites other people's work</td><td>Comment on what matters; accept different-but-fine</td></tr>
<tr><td>Always on</td><td>Available for every question, all day</td><td>Office hours and explicit decision rights</td></tr>
</tbody></table></div>
<p>Marshall Goldsmith calls a related habit <b>adding too much value</b>: improving someone's idea by 5% while cutting their ownership of it by 50%.</p>
<h3>Let go of the keyboard, not the craft</h3>
<p>You should stay technical. What changes is how.</p>
<ul>
<li><b>Stay off the critical path.</b> Never own a story that a release depends on.</li>
<li><b>Code to learn, not to ship.</b> Spikes, prototypes, proofs of concept, tooling and fitness functions.</li>
<li><b>Review selectively.</b> Design reviews and high-risk changes; read code weekly to stay grounded.</li>
<li><b>Pair rather than take over.</b> The other person keeps the keyboard.</li>
<li><b>Keep a sharpening budget.</b> About 10 to 15% of your time, protected on the calendar.</li>
<li><b>Practise outside the day job</b> where policy allows. Side projects keep your hands sharp without competing with your teams.</li>
</ul>
<h3>Protect your energy</h3>
<p>Paul Graham observed that makers and managers run on different schedules. Cluster your meetings and hold at least two half-day blocks a week for writing and thinking. Notice which activities energise you and which drain you; the lab maps them.</p>
<h3>Build your own scoreboard</h3>
<p>Nobody congratulates you for a decision that prevented a problem. Keep a short weekly impact journal: decisions made, people unblocked, risks retired, someone who grew. Review it monthly. It replaces the dopamine of a green build and becomes your evidence at review time.</p>`,
  examples:[
    {kind:"ba", title:"An engineer stuck on a production issue", before:"Engineer: The nightly load to the risk data mart failed again. Still digging.\nYou: Move over, I'll take it.\n[You fix it in 20 minutes, alone.]", after:"Engineer: The nightly load to the risk data mart failed again. Still digging.\nYou: What have you ruled out so far?\nEngineer: The source extract landed and the cluster looks healthy.\nYou: Good. What changed in the last deploy? Let's look together; you drive.\n[Fixed in 35 minutes.]\nYou, in the review: Priya found the root cause; she'll walk us through it.", notice:["Fifteen minutes slower today, and one more engineer who can handle it next time.","In a severe incident with customer impact, take the wheel if you must, then debrief and hand back.","Credit goes to the person who did the work, in public."]},

  quiz:[
    {q:"Which is the clearest sign you are stuck in the transition from individual contributor?",o:["You attend many meetings","You measure a good week by how much code you wrote","You write decision records","You delegate decisions"],a:1,why:"Your output is now decisions and capability. Counting code means you are still keeping the old score."},

    {q:"Which hands-on work best fits a principal architect?",o:["Owning a story the release depends on","A time-boxed spike that tests a risky design assumption","Taking every complex ticket","Rewriting a team's module over the weekend"],a:1,why:"Spikes inform decisions without putting you on the critical path."},

{ id:"m11", lvl:"p", title:"Leading the contract team", time:"90 min",
  summary:"Lead engineers you did not hire and do not appraise: one front door for work, explicit decision rights, briefs that travel, knowledge that survives rotation, and growth within the rules.",
  objectives:["Set up an operating model for engineers who come to you indirectly","Write task briefs that contractors can deliver without repeated clarification","Set and publish delegation levels per decision area","Develop people while staying inside contingent-workforce rules"],
  learn:`
<h3>Your situation</h3>
<p>Many principal architects guide a group of contract engineers they did not hire and do not formally manage. The engineers may report to a supplier lead or a delivery manager, work under a statement of work or a staff-augmentation agreement, and come to you for direction, design decisions and unblocking. You have responsibility without line authority, so clarity becomes your main tool.</p>
<h3>Know the rules of the engagement</h3>
<ul>
<li><b>Read the contract model.</b> Under a statement of work (SOW), the supplier is paid for deliverables and directs how the work is done. Under staff augmentation, your firm directs the day-to-day work. Match your style of direction to the model.</li>
<li><b>Respect co-employment boundaries.</b> In many firms, especially US banks, performance management, discipline, pay, hours and career decisions go through the supplier, not you. Give feedback on the work; route concerns about the person to the supplier manager. Follow your firm's contingent-workforce policy.</li>
<li><b>Plan for the access people have.</b> Contractors often have narrower data and production access. Shape work so it can be done within that access; never share credentials to get around it.</li>
<li><b>Expect rotation.</b> Contracts end and people move. Design for continuity from day one.</li>
</ul>
<h3>An operating model, not a queue</h3>
<p>If every request routes through you, you become the bottleneck. Put a light structure in place:</p>
<div class="tbl"><table><thead><tr><th>Element</th><th>What it is</th></tr></thead><tbody>
<tr><td>Single intake</td><td>Work arrives through the backlog, not direct messages. A request without a story gets a story.</td></tr>
<tr><td>Contractor leads</td><td>Two or three senior engineers as point people for sub-areas. They triage and answer first.</td></tr>
<tr><td>Office hours</td><td>Fixed slots for design questions instead of interruptions all day.</td></tr>
<tr><td>Decision board</td><td>A visible list of which decisions are the team's, which need your input, and which need your approval.</td></tr>
<tr><td>Working agreement</td><td>Definition of ready and done, review norms, response times and the escalation path.</td></tr>
<tr><td>Knowledge base</td><td>ADRs, runbooks, an onboarding guide and recorded design walkthroughs.</td></tr>
</tbody></table></div>
<h3>Briefs that travel</h3>
<p>Ambiguity is expensive with contractors. Questions wait for time-zone overlap, and people may hesitate to push back on an executive director. A good task brief covers six things:</p>
<ol><li>The outcome, and why it matters</li><li>Context and links (ADRs, standards, prior work)</li><li>Constraints and non-negotiables: controls, standards, the paved road</li><li>What is theirs to decide</li><li>What done looks like: acceptance criteria and evidence</li><li>When and how to check in</li></ol>
<p>Then ask them to play it back in their own words. Most misunderstandings surface in that minute.</p>
<h3>Delegation levels, made explicit</h3>
<p>Jurgen Appelo's seven levels (introduced in Module 11) are: 1 Tell, 2 Sell, 3 Consult, 4 Agree, 5 Advise, 6 Inquire, 7 Delegate. Agree a level for each decision area, publish it, and raise levels as trust grows. Reversible, local decisions inside the paved road should sit at 6 or 7. Cross-domain contracts, controls and new third-party dependencies usually stay at 3 or 4.</p>
<h3>Growing people you do not manage</h3>
<p>You cannot promote contractors, but you can make them better: pair on hard designs, have them present their own work in reviews, give specific SBI feedback on the work, name good work in public channels, and tell the supplier when someone excels. Engineers who grow stay engaged and produce better work, which is your outcome too.</p>
<h3>Quality without micromanagement</h3>
<p>Use guardrails instead of inspection: templates and paved roads, automated checks (linting, tests, fitness functions), and design review only for decisions above the decision board's threshold. Review a sample of work deeply rather than every change shallowly.</p>
<h3>Healthy signals</h3>
<p>Questions to you trend down while decision quality holds. Leads answer most questions. New joiners are productive within two weeks. Nothing stops when you take a week off.</p>`,

    {kind:"ba", title:"A task handed to a contract engineer", before:"Hey, can you make the ledger CDC feed cope with schema changes? Thanks.", after:"Outcome: the ledger change feed should keep flowing when the source adds a column. Today a new column stops the feed and the risk data product goes stale.\nContext: ADR-0012 (change data capture), the data contract for ledger postings, and last month's incident review are linked.\nConstraints: use the platform schema registry; additive changes only without a contract review; no restricted fields leave the source unmasked.\nYours to decide: how to detect and apply additive changes; test approach.\nCheck with me: anything that changes the published data contract.\nDone: an added test column flows end to end in staging without a restart; contract test in CI; runbook updated.\nCheck-in: post a short design in the channel by Wednesday.\nCan you play this back to me in your own words?", notice:["Outcome and evidence of done, not only an activity.","Decision rights are explicit, so there is no need to ask about backoff settings.","The playback catches misunderstandings before any code is written."]},

{ id:"m12", lvl:"e", title:"Executive presence and visibility", time:"75 min",
  summary:"Show up at the top table with calm authority: answer crisply, say 'I don't know' well, disagree upward, and make your domain's work visible without self-promotion.",
  objectives:["Describe executive presence as observable behaviour, not personality","Answer executive questions crisply, including when you do not know","Disagree upward and hold a position under pressure","Build sponsorship and a strategic network on purpose"],
  learn:`
<h3>Presence is behaviour</h3>
<p>Executive presence sounds like charisma, but people use the phrase for things they can observe: you are prepared, you stay calm when things go wrong, you get to the point, you hold a view and change it for good reasons, and you make others look good. Sylvia Ann Hewlett's research groups these into gravitas (how you act), communication (how you speak) and appearance (how you show up). For architects, gravitas does most of the work.</p>
<h3>The crisp answer</h3>
<p>When an executive asks a question, answer it in the first sentence: yes, no, a number or a recommendation. Give the one or two reasons that matter. Offer detail only if asked. Then stop; silence after an answer is fine. Engineers often lead with context because it feels rigorous. At the top table it sounds like evasion.</p>
<h3>When you do not know</h3>
<p>"I don't know; I'll find out and come back to you by Thursday" builds more credibility than a confident guess that turns out wrong. A guess becomes a commitment in an executive's memory. If you have a partial view, give it with a confidence level: "Probably under three months. I'm about 70% sure and will confirm after the vendor call."</p>
<h3>Disagreeing upward</h3>
<p>Disagree in private first when you can. In the meeting, acknowledge the goal, state the risk with evidence, and offer an option: "I agree we need intraday risk data in Q1. The current plan skips lineage capture for the critical fields, which I'd expect to draw an audit finding. If we cut the usage dashboard instead, we keep the date and the control." Once a decision is made, disagree and commit (Module 11).</p>
<h3>Calm under pressure</h3>
<p>In incidents and tense meetings, the most senior technical person sets the temperature. Slow your speech. Say what is known and unknown, confirm who leads, assign next steps, and set the time of the next update. The family therapist Edwin Friedman called this being a non-anxious presence.</p>
<h3>Visibility without self-promotion</h3>
<ul>
<li><b>Work out loud.</b> A short monthly note on decisions made and what they enabled.</li>
<li><b>Credit teams by name.</b> Leaders notice who builds others up.</li>
<li><b>Tie updates to what executives already care about:</b> outcomes, risk, cost, customers.</li>
<li><b>Choose your forums.</b> Be present where your domain's priorities are set, not in every meeting.</li>
</ul>
<h3>Sponsors, mentors and networks</h3>
<p>A mentor advises you. A sponsor spends their own influence to put you forward. At ED level you need at least one sponsor who knows your work; you earn one by delivering on what matters to them and making them look good. Herminia Ibarra distinguishes three networks: <b>operational</b> (people you need for today's job), <b>personal</b> (development and perspective) and <b>strategic</b> (people who help you see what is coming and win support for new directions). Most engineers over-invest in the first. Executives build the third deliberately.</p>
<h3>Reading the room</h3>
<p>Before a meeting, know who decides, what each person cares about, and what a good outcome looks like. During it, notice who has not spoken. Afterwards, send a two-line summary of decisions and actions. Whoever writes the summary shapes the record.</p>`,
  examples:[
    {kind:"ba", title:"Answering an executive's question", before:"CIO: Can we hit the Q1 date?\nYou: So, there are a few things going on. The ledger team's test environment has been a challenge since September, and we've been replaying logs, and the team has been working through the change-data-capture integration, and depending on how the next sprint goes…", after:"CIO: Can we hit the Q1 date?\nYou: Not as planned. We're about three weeks behind.\nTwo options hold the date: cut the usage dashboard, or add one team for six weeks. I recommend cutting the dashboard; no consumer depends on it yet.\nI need a decision by Friday.", notice:["The first sentence answers the question.","Options and a recommendation, not a story.","A clear ask with a date."]},
    {kind:"ba", title:"Saying 'I don't know' well", before:"Executive: What will the new data platform cost to run each year?\nYou: Roughly $400K, I think.\n[Three weeks later the estimate is $900K.]", after:"Executive: What will the new data platform cost to run each year?\nYou: I don't have a reliable number yet. Licences are $300K. Infrastructure and support aren't modelled. I'll have a full run-cost estimate to you by Tuesday.", notice:["Give the part you know, name the gap, commit to a date.","Your credibility survives contact with the real number."]}],
  quiz:[
    {q:"Which best describes executive presence?",o:["A personality trait you have or lack","Observable behaviour: preparation, calm, clarity, holding and updating a view","Dressing formally","Talking the most in meetings"],a:1,why:"Because it is behaviour, it can be practised."},
    {q:"An executive asks a direct question. Your first sentence should…",o:["Give background","Answer the question","Thank them for asking","List caveats"],a:1,why:"Answer first; context only if they want it."},
    {q:"You do not know the answer to an executive's question. Best response?",o:["Give your best guess confidently","Say you don't know, share what you do know, and commit to a date","Change the subject","Defer to a junior colleague"],a:1,why:"A wrong guess becomes a broken commitment."},
    {q:"What distinguishes a sponsor from a mentor?",o:["Sponsors are paid","A sponsor uses their influence to put you forward; a mentor advises","Mentors are more senior","There is no difference"],a:1,why:"Sponsorship is advocacy, which matters most for senior opportunities."},
    {q:"Which network do engineers most often under-invest in as they become executives?",o:["Operational","Strategic","Personal","Social media"],a:1,why:"The strategic network helps you see what is coming and win support for new directions."}],

    scen:[
      {s:"In a steering committee, the chief risk officer asks whether the new data access platform is 'safe enough to go live'. Two medium penetration-test findings are open, with fixes due next week.",o:[["Explain the test method and each finding in detail","weak","Accurate, but the COO asked a yes-or-no question and will stop listening."],["'Yes, it's fine.'","weak","Hides open findings. If something happens, your credibility is gone."],["'Not yet, but on track. Two medium findings are open and fixed next week, so launch on the 20th holds. I'll confirm closure in writing.'","strong","A direct answer, the facts that matter, and a commitment."],["'Security would be better placed to answer that.'","ok","Sometimes true, but you own the design. Give your view, then bring security in."]]},
      {s:"A senior VP interrupts your presentation on slide 3: 'I don't need all this. What do you want from me?'",o:[["Go straight to the ask: the decision, your recommendation and the deadline","strong","They told you exactly what they need. Take the gift."],["Ask to finish the remaining slides first","weak","Puts your structure ahead of their need."],["Apologise at length and start over","weak","Loses time and authority."],["Summarise the remaining slides quickly","ok","Better, but still not the ask."]]},
      {s:"In a leadership meeting, your manager's peer proposes a vendor that failed your firm's third-party risk review last year.",o:[["Say nothing and email your manager afterwards","ok","Avoids conflict, but the group may commit without the facts."],["Interrupt to say it won't work","weak","Right fact, wrong delivery. It makes the peer defensive."],["Acknowledge the goal, state the risk-review history as a fact, and suggest checking whether the issues were fixed before committing","strong","Respectful, factual and constructive. The decision stays open with the right information."],["Wait to see whether anyone else raises it","weak","If no one does, you have let a known risk through."]]},
      {s:"Severe incident: the overnight load to the regulatory reporting mart failed and a filing is due at noon. The bridge call is chaotic and two executives keep asking for updates.",o:[["Start debugging yourself","weak","Someone must lead. Diving into code leaves the call without direction."],["Calmly state what is known and unknown, confirm the incident lead, assign actions, and set the time of the next executive update","strong","You lower the temperature and protect the responders' focus."],["Ask the executives to leave the call","ok","Protecting the team is right; do it by offering them a separate channel and update times."],["Promise a fix within 15 minutes to calm everyone","weak","An unfounded estimate that you will probably miss."]]},
      {s:"A director you respect offers to put your name forward for a firm-wide architecture council. You are already busy.",o:[["Decline; you have enough on","ok","Reasonable if your capacity is truly gone, but you may be declining sponsorship."],["Accept, ask what she hopes you will bring, and decide what you will stop doing to make room","strong","Accepts sponsorship deliberately and protects your capacity."],["Accept and add it to your existing load","weak","Overcommitment hurts your delivery and your sponsor's reputation."],["Suggest one of your contractors instead","weak","Council seats usually need an employee at your level, and it misses the point of the offer."]]}]},
  project:{title:"Presence and visibility plan", deliver:"A 60-day plan to strengthen how you show up with executives, with evidence from real meetings.", steps:["Ask two people who see you in senior meetings for one thing you do well and one thing to change","Write a one-line headline answer for the five questions executives most often ask about your domain","For a month, before each senior meeting, note who decides, what they care about and your desired outcome; afterwards send a two-line summary","Record one briefing and practise delivering it in half the time","Start a monthly decisions-and-outcomes note that credits teams by name","Sort your network into operational, personal and strategic; plan two strategic conversations","Identify a potential sponsor and one way you will help their priorities succeed"],
    rubric:["Feedback from two senior observers was gathered","Headline answers exist for your top five questions","A month of pre-meeting notes and follow-up summaries exists","Two monthly notes went out, crediting teams","Two strategic network conversations happened"]}

{ id:"m16", lvl:"e", title:"Writing and presenting for senior leaders", time:"2–3 hours",
  summary:"Write in plain English that executives understand on first read, translate technical detail into business consequences, keep their attention, and build PowerPoint decks that are clear, concise and stay on topic.",
  objectives:["Write in plain English a non-technical executive understands on first read","Translate technical facts into business consequences, and keep the detail where it belongs","Structure documents so the point survives a two-minute skim","Build decks from a storyline of action titles, one message per slide, that stays on topic","Edit ruthlessly: cut length, jargon, passive voice and hedging"],
  learn:`
<h3>Why this matters more than ever</h3>
<p>At your level, writing is how your thinking reaches people you are not in the room with. Senior leaders give a document about two minutes, often on a phone between meetings, and decide from the first paragraph whether to read on. If the point is buried in paragraph four, it does not exist. Unclear writing has a visible cost: the meeting you have to call to explain the document.</p>
<p>The good news is that clear writing is a skill with rules, not a talent. This module gives you the rules, a way to check your own drafts, and a method for decks.</p>

<h3>Part 1. Before you write: reader, purpose, one sentence</h3>
<p>Answer three questions before typing a word:</p>
<ol>
<li><b>Who is the reader, and what do they already know?</b> A head of regulatory reporting knows deadlines, regulators and which numbers matter. They do not know what a batch DAG or a change log is, and should not need to.</li>
<li><b>What do I want them to do, think or decide after reading?</b> If you cannot say, you are not ready to write.</li>
<li><b>What is the one sentence I would say if I had ten seconds in a lift?</b> That sentence goes first.</li>
</ol>
<p>The purpose decides the shape:</p>
<div class="tbl"><table><thead><tr><th>Purpose</th><th>Typical document</th><th>Opens with</th><th>Length</th></tr></thead><tbody>
<tr><td>Decide</td><td>Decision memo, investment case</td><td>The ask, the recommendation, the deadline</td><td>One page, appendix behind it</td></tr>
<tr><td>Inform</td><td>Status update, incident summary</td><td>Status, trend and what you need</td><td>Half a page</td></tr>
<tr><td>Align</td><td>Strategy, roadmap narrative</td><td>Where we are going and why it matters</td><td>Two to six pages</td></tr>
<tr><td>Instruct</td><td>Standard, runbook, guide</td><td>Who it is for and when to use it</td><td>As short as the task allows</td></tr>
<tr><td>Record</td><td>ADR, design decision</td><td>The decision and its context</td><td>One to two pages</td></tr>
</tbody></table></div>

<h3>Part 2. Plain English</h3>
<p>Plain English is not dumbing down. It is respect for the reader's time. The rules:</p>
<ul>
<li><b>Short sentences.</b> Average 15 to 20 words. Split any sentence over 25.</li>
<li><b>Everyday words.</b> Use, not utilise. Help, not facilitate. Fix, not remediate.</li>
<li><b>Active voice.</b> Say who does what. "The vendor will deliver test data by 8 Nov" beats "Test data is expected to be delivered".</li>
<li><b>Numbers, not adjectives.</b> "Significant risk" means nothing; "about 40 analysts blocked for a day" means something.</li>
<li><b>One idea per paragraph,</b> stated in its first sentence.</li>
<li><b>Define acronyms or drop them.</b> If an executive must stop to decode CDC, SLA or ABAC, you have lost a little of their attention each time.</li>
<li><b>No hedge stacks.</b> "We may potentially want to consider" becomes "We should" or "We might". Say how sure you are once, with a number if you can.</li>
</ul>
<div class="tbl"><table><thead><tr><th>Instead of</th><th>Write</th></tr></thead><tbody>
<tr><td>leverage, utilise</td><td>use</td></tr>
<tr><td>in order to</td><td>to</td></tr>
<tr><td>at this point in time</td><td>now</td></tr>
<tr><td>remediate the vulnerability</td><td>fix the weakness</td></tr>
<tr><td>robust, scalable, seamless</td><td>say what it withstands, how many it handles, what changes for the user</td></tr>
<tr><td>going forward</td><td>from now on, or delete it</td></tr>
<tr><td>due to the fact that</td><td>because</td></tr>
<tr><td>it should be noted that</td><td>(delete)</td></tr>
</tbody></table></div>

<h3>Part 3. Translating technical detail into business consequence</h3>
<p>Executives do not need less truth; they need the truth at their altitude. Climb the <b>so-what ladder</b> until you reach something they own:</p>
<ol>
<li><b>Technical fact:</b> the risk data mart is loaded by one nightly batch job with no restart point.</li>
<li><b>System consequence:</b> if the job fails after 2am, the whole load must rerun from the start, which takes five hours.</li>
<li><b>Business consequence:</b> the morning liquidity report can miss its 10am regulatory deadline, a reportable breach. It happened twice last quarter.</li>
</ol>
<p>Lead with rung three. Keep rungs one and two as evidence, in an appendix or a single supporting sentence. The currencies executives deal in are <b>money, customers, risk and regulatory exposure, time, and reputation</b>. Translate into one of them every time.</p>
<p>Three more habits help:</p>
<ul>
<li><b>Use analogies sparingly and accurately.</b> "A restart point is like saving your work as you go: a crash costs minutes, not the whole morning." One good analogy beats three loose ones.</li>
<li><b>Be honest about uncertainty.</b> Give a range and a confidence: "four to six months; we'll know within two weeks of the vendor pilot".</li>
<li><b>Keep the technical depth available, not in front.</b> Put it in an appendix, a linked design doc, or your back pocket for questions. Experts will find it; executives will not trip over it.</li>
</ul>

<h3>Part 4. Keeping their attention</h3>
<ul>
<li><b>Answer first.</b> The bottom line goes up front (BLUF). Module 14 covers decision memos and status updates in detail.</li>
<li><b>Headings that say something.</b> "Buying the platform is five months faster" instead of "Options analysis". A reader who skims only your headings should get the argument.</li>
<li><b>The skim test.</b> Read only the title, the first sentence of each section, and anything bold. If the story survives, the document works. If not, rewrite those lines first.</li>
<li><b>A length budget.</b> One page for a decision, two to six for a strategy. Everything else goes in an appendix, which nobody minds skipping.</li>
<li><b>Show comparisons as tables,</b> and use one diagram at the right altitude: context or capability level, not components.</li>
<li><b>Short paragraphs and white space.</b> Dense blocks get skipped on phones.</li>
<li><b>End with the ask again,</b> and what happens next.</li>
</ul>

<h3>Part 5. Presentations that stay on topic</h3>
<p>A deck is a document shown on a screen. The same rules apply, plus a few of its own.</p>
<h4>Storyline before slides</h4>
<p>Do not open PowerPoint first. Write a <b>ghost deck</b>: the slide titles only, each as a full sentence that states the point (an <b>action title</b>). Read the titles in order. They should tell the whole story on their own; this is the horizontal logic. Then make each slide's body prove its title and nothing else; this is the vertical logic. Barbara Minto's pyramid principle and consulting firms' storyboards work this way.</p>
<h4>Structure</h4>
<ul>
<li>Open with the situation and complication (SCQA from Module 14), then the recommendation by slide two or three.</li>
<li>Group the supporting argument into three or fewer reasons, one slide or section each.</li>
<li>State the ask on the second slide and again on the last.</li>
<li>For a 10-minute slot, plan four to six main slides. Everything else goes in an appendix.</li>
</ul>
<h4>Staying on topic</h4>
<p>Test every slide against the ask: <b>does this help them make the decision?</b> If not, move it to the appendix or delete it. Architects are tempted to include the architecture because they are proud of it, or because it proves rigour. Rigour is shown by being able to answer the question, not by putting every diagram on screen. In the meeting, keep a parking lot for tangents and bring the conversation back: "That's a good point for the vendor review. For today, the question is whether to approve the contract."</p>
<h4>Slide design</h4>
<ul>
<li>One message per slide, in an action title of no more than about 15 words, two lines at most.</li>
<li>Few words on the slide; 18-point body text or larger. If you need sentences, it is a pre-read, not a slide.</li>
<li>Charts carry their takeaway in the title ("Access lead time fell from 15 days to 2 after launch") and highlight the one series that matters.</li>
<li>No architecture eye charts. Show context or capability views and build complex pictures in steps.</li>
<li>Consistent layout so attention goes to content, not to decoding the slide.</li>
</ul>
<h4>Pre-read deck or presented deck?</h4>
<p>Many executives read ahead. A pre-read must stand alone, so it can be denser, with full sentences. A presented deck is sparser because you are the narration. If you must send one artefact, send the pre-read 24 hours ahead with a three-line summary in the email, and present from it by walking the action titles.</p>
<h4>Delivery</h4>
<ul>
<li>Start with the ask. Expect to be interrupted and be ready to jump to the recommendation slide.</li>
<li>Know your one-slide version, in case your 30 minutes become five.</li>
<li>Rehearse to finish in about 70% of the slot, leaving time for questions.</li>
<li>Answer a question directly, then bridge back to the storyline.</li>
</ul>

<h3>Part 6. Editing: write fast, edit slow</h3>
<p>Nobody writes clearly in a first draft. Clear writers edit in passes:</p>
<ol>
<li><b>Structure.</b> Does the first paragraph carry the point and the ask? Do the headings tell the story?</li>
<li><b>Cut.</b> Remove 30 to 50%. Background, history and process usually go first.</li>
<li><b>Words.</b> Replace jargon, turn passive into active, delete hedges and filler.</li>
<li><b>Read aloud.</b> Wherever you stumble or run out of breath, the reader will too.</li>
<li><b>Cold reader.</b> Give it to someone outside your domain for two minutes, then ask them to tell you the ask and the main reason. If they cannot, the document is not done.</li>
</ol>
<p>Readability scores are a signal, not a target. For executive documents, aim for a reading grade around 9 to 11 and an average sentence under 20 words. The lab measures both.</p>

<h3>Part 7. Writing for the record</h3>
<p>In a regulated firm, your documents become evidence. An auditor, a regulator, or your successor may read them two years from now without you there to explain. Date every document, name its owner and status, separate facts from opinions, and record what you decided and why, including the options you rejected. Plain English helps here too: a clear record is a defensible record.</p>`,
  examples:[
    {kind:"ba", title:"A technical paragraph, rewritten for executives", before:"The risk data mart is populated by a monolithic nightly ETL batch (JOB-RDM-01) orchestrated by the legacy scheduler with no checkpointing. Upon an abend post-0200, the full DAG must be re-executed with an expected runtime of ~5h, impacting SLA attainment for downstream LCR reporting, as evidenced by two SLA breaches in Q3.", after:"If the overnight load to the risk data mart fails after 2am, the morning liquidity report can miss its 10am regulatory deadline. This happened twice last quarter. The load has no restart point, so any failure means a five-hour rerun.\n\nRecommendation: fund three weeks of work to add restart points and move the load to the new platform's scheduler. Cost: about $60K. Decision needed by 15 Nov.", notice:["The business consequence comes first; the technical cause is one plain clause.","Job names and acronyms are gone. The technical version can go in an appendix for the experts.","It ends with an ask, a cost and a date."]},
    {kind:"ba", title:"Slide titles: labels versus action titles", before:"1. Background\n2. Current-state architecture\n3. Options\n4. Vendor comparison\n5. Risks\n6. Next steps", after:"1. Getting data takes 15 days, so teams copy it instead\n2. Manual approvals cause most of the delay\n3. Buying a governance platform is five months faster than building one\n4. Vendor A meets every access-control audit criterion at the lowest five-year cost\n5. Vendor concentration is the main risk, and an exit plan covers it\n6. We need your approval by 14 Nov to start in Q1", notice:["Read only the right-hand titles: the whole argument survives.","Each slide body now has one job: prove its title.","The left-hand titles tell the reader nothing they could not guess."]},
    {kind:"diagram", title:"A ghost deck as a pyramid", code:D.ghost, caption:"The ask sits at the top; three reasons support it; each reason has its evidence. Every slide maps to one box.", notice:["If a slide does not map to a box, it belongs in the appendix.","Three reasons is usually enough. Five reasons usually means two are evidence, not reasons."]},
    {kind:"ba", title:"An email, cut by more than half", before:"Hi all, I wanted to reach out to provide a quick update regarding the ongoing efforts related to the ledger change data capture integration. As you may be aware, the team has been working diligently over the past several sprints to complete the integration work. At this point in time, we have encountered some challenges with respect to the availability of an appropriate test environment with change logging enabled, which has had an impact on our ability to complete end-to-end testing. We are currently exploring a number of potential options to mitigate this. Please let me know if you have any questions.", after:"Subject: Intraday risk feed three weeks late; need ledger team priority by Friday\n\nWe can't finish end-to-end testing because the ledger team's test environment doesn't produce a change log. That puts the Q1 date for intraday risk data about three weeks at risk.\n\nWe're testing against a replayed log in parallel. Could you ask the ledger application owner to prioritise this by Friday? If it's enabled by 15 Nov, the date holds.", notice:["The subject line carries the news and the ask.","Fewer words, more information.","'Exploring a number of options' became one specific action and one specific request."]}],
  quiz:[
    {q:"Which sentence is plain English?",o:["We will leverage synergies to facilitate a more robust data experience","Analysts will get approved data in one day instead of fifteen","Going forward, data access functionality will be optimised","It should be noted that access may potentially improve"],a:1,why:"Concrete, active and measurable. The others are jargon with no claim a reader can check."},
    {q:"You need to tell executives about a nightly batch job with no restart point. What do you lead with?",o:["The scheduler technology and job dependencies","The business consequence: which report is late, how often, and what that breaches","An analogy about saving your work","The history of the 2024 performance work"],a:1,why:"Climb the so-what ladder to something they own. Keep the technical facts as evidence."},
    {q:"What is an action title?",o:["A slide title with an animation","A one-word label such as 'Options'","A full sentence that states the slide's point, so the titles alone tell the story","The name of the action item owner"],a:2,why:"Action titles make the storyline readable on its own and give each slide one job."},
    {q:"A slide is accurate and you worked hard on it, but it does not help the executives make today's decision. You should…",o:["Keep it to show rigour","Move it to the appendix or delete it","Present it quickly","Put it first"],a:1,why:"Every main slide must serve the ask. Rigour shows in how you answer questions."},
    {q:"What is the skim test?",o:["Checking spelling","Reading only the title, first sentences and bold text to see if the argument survives","Counting slides","Asking a peer to proofread"],a:1,why:"Executives skim. If the skim carries the point, the document works."}],
  lab:{type:"writing", title:"Plain-English checker and ghost-deck builder",
    brief:"Part 1: paste a real paragraph you wrote for senior leaders, or edit the sample. The checker measures sentence length, reading grade, passive voice, jargon and acronyms, and highlights problems in place. Rewrite until it meets the targets. Part 2: write the action titles for a deck of up to six main slides, and check that they tell the story on their own.",
    sample:"The risk data mart is populated by a monolithic nightly ETL batch (JOB-RDM-01) orchestrated by the legacy scheduler with no checkpointing. Upon an abend post-0200, the full DAG must be re-executed with an expected runtime of ~5h, impacting SLA attainment for downstream LCR reporting. Going forward, we may potentially want to leverage a more robust orchestration paradigm in order to facilitate improved resiliency.",
    ask:"Approve three weeks of restart-point work by 15 Nov",
    titles:["The morning liquidity report can miss its regulatory deadline","We recommend adding restart points: three weeks of work and about $60K","It missed the deadline twice last quarter","Any failure after 2am means a five-hour rerun","We need your approval by 15 Nov to finish before year-end",""]},
  project:{title:"Rewrite and present a real decision", deliver:"A one-page rewrite of a real technical document, a ghost deck, and a short presented deck, tested on a cold reader and used with senior leaders.", steps:["Pick a technical document you sent to senior leaders in the last three months","Run it through the checker; note the reading grade, sentence length, jargon and acronym count","Rewrite it to one page: the ask and business consequence in the first paragraph, technical detail in an appendix","Write a ghost deck of no more than six action titles; check the titles tell the story alone","Build the deck from the ghost deck, with an appendix for supporting detail","Give the page to a colleague outside your domain for two minutes; ask them to tell you the ask and the main reason","Present it in a real meeting; note which slides drew questions and how much of the slot you used","Ask one senior attendee for one piece of feedback on clarity"],
    rubric:["The rewrite has a reading grade of 11 or lower and an average sentence under 20 words","The first paragraph states the ask and the business consequence","The ghost-deck titles tell the full story on their own","No more than six main slides; detail is in an appendix","A cold reader correctly restated the ask","You finished within about 70% of the time slot"]}

{ id:"m13", lvl:"p", title:"Teams, boundaries and Conway's law", time:"75 min",
  summary:"Architecture and organisation shape each other. Use Team Topologies to line up team boundaries with system boundaries, cut hand-offs, and keep cognitive load manageable.",
  objectives:["Explain Conway's law and the inverse Conway manoeuvre","Use the four team types and three interaction modes","Spot cognitive-load and dependency hotspots","Propose a boundary change with a transition plan"],
  learn:`
<h3>Conway's law</h3>
<p>In 1968 Mel Conway observed that organisations design systems that mirror their own communication structures. Three teams building a compiler produce a three-pass compiler. The practical consequence for you: if you design the architecture without looking at the teams, the organisation will redesign it for you, usually around its hand-offs.</p>
<h3>The inverse Conway manoeuvre</h3>
<p>Turn the law around: shape teams and their responsibilities to match the architecture you want. If you want the data access experience to evolve independently, one team should own it end to end, from catalogue to approval. If two services must change together every release, they probably belong to one team, or the boundary between them is in the wrong place.</p>
<h3>Team Topologies in one page</h3>
<p>Matthew Skelton and Manuel Pais describe four team types and three ways for teams to interact.</p>
<div class="tbl"><table><thead><tr><th>Team type</th><th>Purpose</th><th>Northbank example</th></tr></thead><tbody>
<tr><td>Stream-aligned</td><td>Delivers value for one business flow, end to end</td><td>Data access experience: catalogue, requests, approvals</td></tr>
<tr><td>Platform</td><td>Offers internal services that reduce other teams' load</td><td>Streaming backbone, lakehouse, the paved road</td></tr>
<tr><td>Enabling</td><td>Coaches teams in new skills for a limited time, then moves on</td><td>Data contracts and controls coaching</td></tr>
<tr><td>Complicated subsystem</td><td>Owns a part needing rare, deep expertise</td><td>Policy decision engine</td></tr>
</tbody></table></div>
<div class="tbl"><table><thead><tr><th>Interaction mode</th><th>When to use it</th></tr></thead><tbody>
<tr><td>Collaboration</td><td>Discovering something new together. Time-box it; it is expensive.</td></tr>
<tr><td>X-as-a-service</td><td>The boundary is clear and stable; one team consumes another's service with little coordination.</td></tr>
<tr><td>Facilitating</td><td>One team helps another learn, then steps away.</td></tr>
</tbody></table></div>
<h3>Cognitive load</h3>
<p>A team can only own as much software as it can understand well. When a team owns too much, quality slips, on-call becomes painful and changes slow down. Signs: slow ramp-up for new members, the same few people needed for every change, and frequent "we don't really know how that part works". The fix is less scope per team, better platforms, or simpler systems, not more heroics.</p>
<h3>Where to draw boundaries</h3>
<p>Look for natural seams, sometimes called fracture planes: business domain (a bounded context in domain-driven design), regulatory scope (for example, keeping card-data systems separate), different change cadence, risk profile, performance isolation, and user group. Draw boundaries along them, then check the team map matches.</p>
<h3>Dependency smells</h3>
<ul><li>Stories regularly blocked waiting for another team</li><li>Shared databases written to by several teams</li><li>Releases that must be coordinated across teams</li><li>A hand-off ticket for every change ("raise a request with the integration team")</li><li>Planning meetings dominated by dependency negotiation</li></ul>
<h3>Your role</h3>
<p>You rarely own reporting lines, and in an enterprise you may work with vendor teams and shared services you cannot reshape. You still have levers: where you draw service and API boundaries, what the platform offers, ownership maps, and proposals to delivery leadership backed by dependency data. Publish a short <b>team API</b> for each team: what it owns, what it offers others, how to work with it, and how to reach it.</p>`,
  examples:[
    {kind:"diagram", title:"Northbank's teams as a topology", code:D.topo, caption:"Solid arrows are services consumed with little coordination; dotted arrows are coaching; the two stream-aligned teams collaborate for a fixed period.", notice:["The platform team reduces load on the stream-aligned teams; it does not sit in their path.","Collaboration between the two stream-aligned teams is time-boxed while they settle who owns data product publishing.","Enabling teams aim to make themselves unnecessary."]},
    {kind:"ba", title:"A boundary that fights the architecture", before:"Teams: Ingestion, Transformation, Storage, Access, Reporting.\nEvery new data product needs all five teams.\nAverage lead time for a new data product: 14 weeks, 9 of them waiting.", after:"Teams: Risk and finance data products (stream-aligned, owns source capture to consumer), Data access experience (stream-aligned), Platform (streaming, lakehouse, paved road).\nMost new data products need one team plus self-service platform tools.\nAverage lead time: 4 weeks.", notice:["Teams organised by pipeline stage turn every data product into a relay race.","Stream-aligned teams own a flow end to end, so the architecture and the org chart point the same way.","The change needs delivery leadership; your contribution is the boundary design and the dependency data."]}],
  quiz:[
    {q:"Conway's law says that…",o:["Systems slow down as they grow","Systems mirror the communication structure of the organisation that builds them","Teams should never exceed nine people","Architecture should be decided before teams form"],a:1,why:"Org structure and system structure converge. Design both together."},
    {q:"The inverse Conway manoeuvre means…",o:["Reorganising every year","Shaping teams to match the architecture you want","Letting teams pick their architecture","Ignoring the org chart"],a:1,why:"Use team design deliberately to get the system boundaries you want."},
    {q:"Which team type coaches other teams for a limited time, then moves on?",o:["Stream-aligned","Platform","Enabling","Complicated subsystem"],a:2,why:"Enabling teams spread capability and step away."},
    {q:"Two teams are working out how to split data product publishing between them. Which interaction mode fits?",o:["X-as-a-service","Collaboration, time-boxed","Facilitating","None; let them work it out"],a:1,why:"Collaboration suits discovery but is costly, so give it an end date."},
    {q:"Which is the strongest sign a team's cognitive load is too high?",o:["They hold many meetings","The same two people are needed for every change and new joiners take months to contribute","They use many tools","They have a large backlog"],a:1,why:"Knowledge concentrated in a few people is a classic overload signal."}],
  lab:{type:"sort", title:"Which team type, which mode?",
    brief:"Classify each Northbank situation. Each answer explains why.",
    buckets:["Stream-aligned","Platform","Enabling","Complicated subsystem"],
    items:[["Owns the data access experience: catalogue search, requests and approvals","Stream-aligned","It delivers one flow of value to users, end to end."],["Runs the streaming backbone and the paved road other teams build pipelines on","Platform","It offers internal services that reduce other teams' load."],["Spends six weeks helping the finance data team adopt data contracts, then moves on","Enabling","It builds capability in another team and steps away."],["A small specialist group owns the policy decision engine and its rule evaluation","Complicated subsystem","Deep, specialist logic is concentrated so other teams don't need it."],["Provides self-service change-data-capture connectors used by every source team","Platform","A stable service consumed by many teams."],["Owns the risk and finance data products from source capture to consumer","Stream-aligned","One value stream, end to end."],["Architects and data risk partners coach teams on designing access controls","Enabling","Coaching for a limited period, not owning the work."],["Maintains the entity-resolution engine that matches customer records across sources","Complicated subsystem","Specialist matching logic is a classic complicated subsystem."]]},
  project:{title:"Team and boundary map", deliver:"A map of your domain's teams, what they own and how they interact, with one proposed boundary change.", steps:["List the teams in your domain, including vendor and shared-service teams","Map each to the services and data it owns; mark anything with more than one owner","Draw the interactions using the three modes; mark hand-offs and blocked-dependency hotspots","Run a short cognitive-load check with each team lead (for example, 'how well do you understand what you own?' on a 1–5 scale)","Pick one boundary that fights the architecture and propose a change, with a transition plan","Write a team API for at least two teams","Review the proposal with delivery leadership"],
    rubric:["Every service and data store has one owning team","Interaction modes are named, not only arrows","Dependency hotspots are backed by data (blocked stories, coordinated releases)","The proposal includes a transition plan, not only a target","Delivery leadership reviewed it"]}
},
{ id:"m14", lvl:"p", title:"Measuring architecture health", time:"75 min",
  summary:"Choose a small set of trusted measures across delivery flow, reliability, debt and decision speed, and build a scorecard that leads to action rather than theatre.",
  objectives:["Choose measures with Goodhart's law in mind","Read delivery health with DORA and flow metrics","Track debt, decision lead time and fitness-function results","Build a one-page scorecard with targets, owners and actions"],
  learn:`
<h3>Measure to steer, not to judge</h3>
<p>Architecture health measures tell you whether the system and the way it is built are getting easier or harder to change safely. Use them to choose where to invest, not to rank teams. Goodhart's law warns that a measure that becomes a target stops being a good measure: tell teams their deployment count matters and you will get many tiny deployments.</p>
<h3>Delivery: the DORA measures</h3>
<p>The DORA research programme found that a few measures predict both delivery performance and organisational outcomes:</p>
<ul><li><b>Lead time for changes:</b> commit to running in production.</li><li><b>Deployment frequency:</b> how often you release.</li><li><b>Change failure rate:</b> the share of deployments that cause a failure needing remediation.</li><li><b>Failed deployment recovery time:</b> how long it takes to restore service after a failed change.</li></ul>
<p>Read them together. Speed without stability is not progress, and the research shows the best performers improve both. Track trends within a team, not comparisons between teams with different contexts.</p>
<h3>Flow</h3>
<p>Mik Kersten's flow metrics look at work items rather than deployments: flow time, flow velocity, flow load (work in progress), flow efficiency (active versus waiting time), and <b>flow distribution</b>: the mix of features, defects, risk and debt work. Distribution is especially useful to you; if debt work is 5% of capacity when the agreed share is 20%, that is a conversation for planning.</p>
<h3>Architecture-specific measures</h3>
<div class="tbl"><table><thead><tr><th>Measure</th><th>What it tells you</th></tr></thead><tbody>
<tr><td>Data freshness against service level</td><td>Whether data products arrive when consumers need them.</td></tr>
<tr><td>Lineage coverage</td><td>Share of critical data elements with automated end-to-end lineage, a BCBS 239 expectation.</td></tr>
<tr><td>Access request lead time</td><td>How long users wait for approved data; long waits drive unmanaged copies.</td></tr>
<tr><td>Decision lead time</td><td>Request to decision for architecture questions. Long times mean governance is a bottleneck.</td></tr>
<tr><td>Fitness-function pass rate</td><td>Whether automated architecture checks hold over time.</td></tr>
<tr><td>Share of services on the paved road</td><td>Adoption of standards and platforms.</td></tr>
<tr><td>End-of-life components</td><td>Exposure to unsupported software, a frequent audit topic.</td></tr>
<tr><td>Change coupling</td><td>How often services must change together, a sign of a misplaced boundary.</td></tr>
<tr><td>Vulnerability age</td><td>How long known weaknesses stay open.</td></tr>
<tr><td>Incidents by architectural cause</td><td>Where design, not operations, keeps causing failures.</td></tr>
</tbody></table></div>
<h3>Do not forget people</h3>
<p>The SPACE framework (satisfaction, performance, activity, communication, efficiency) reminds you that developer experience matters. A short quarterly survey ("how easy is it to ship a change safely?") often reveals what dashboards hide.</p>
<h3>Designing the scorecard</h3>
<ul><li>Six to ten measures. More becomes noise.</li><li>For each: definition, data source, owner, target or threshold, trend, and the action when it is red.</li><li>Automate collection from pipelines where you can; start manually if you must.</li><li>Review monthly with delivery leads; summarise quarterly for executives in business terms (Module 13).</li><li>Retire measures that never lead to action.</li></ul>`,
  examples:[
    {kind:"ba", title:"A vanity dashboard versus an action scorecard", before:"Stories completed: 412\nLines of code: 1.2 million\nArchitecture reviews held: 18\nUptime: 99.9%\nStatus: Green", after:"Lead time for changes: 9 days (was 12; target 3). Action: remove the manual change-board step for low-risk changes. Owner: delivery lead.\nChange failure rate: 18% (threshold 15%): RED. Action: schema-compatibility checks on the ledger feed. Owner: risk data products team.\nDecision lead time: 21 days median. Action: async review tier for reversible decisions. Owner: you.\nEnd-of-life components: 7 (was 11).\nDebt share of capacity: 8% (agreed 20%). Action: raise at planning with product.", notice:["Every line has a trend, a target and, when off target, an owner and an action.","Activity counts are gone; they cannot tell you whether to act.","Decision lead time puts your own governance under the same scrutiny."]}],
  quiz:[
    {q:"Goodhart's law warns that…",o:["Metrics are always wrong","When a measure becomes a target, it stops being a good measure","Only four metrics matter","Dashboards need weekly updates"],a:1,why:"People optimise what they are judged on, sometimes at the expense of the real goal."},
    {q:"Which pair should you read together to judge delivery health?",o:["Lines of code and story points","Deployment frequency and change failure rate","Meetings and headcount","Uptime and budget"],a:1,why:"Speed and stability together; one without the other misleads."},
    {q:"Why is flow distribution useful to an architect?",o:["It ranks developers","It shows the mix of features, defects, risk and debt work, so you can see whether debt gets agreed capacity","It replaces DORA","It measures uptime"],a:1,why:"It turns 'we never get time for debt' into a number you can discuss at planning."},
    {q:"Which is a sign governance is slowing delivery?",o:["High deployment frequency","Long decision lead time for architecture questions","Low vulnerability age","Many services on the paved road"],a:1,why:"If decisions wait weeks, teams wait too."},
    {q:"What should every scorecard measure have?",o:["A colour","A definition, source, owner, target and an action when it is off target","A chart","A team ranking"],a:1,why:"Without an owner and an action, a red measure is just decoration."}],
  lab:{type:"scorecard", title:"Build your health scorecard",
    brief:"Enter current values and targets for your own domain (Northbank numbers are prefilled). The scorecard rates each measure: green when it meets the target, amber when it is within 25% of it, red otherwise. Then name an owner and an action for every red.",
    rows:[["Lead time for changes","days",3,3,"lower"],["Change failure rate","%",18,15,"lower"],["Data products meeting freshness SLA","%",82,95,"higher"],["Access request lead time (median)","days",6,1,"lower"],["Critical data elements with lineage","%",45,95,"higher"],["Decision lead time (median)","days",21,7,"lower"],["Legacy ETL jobs remaining","count",360,300,"lower"],["Debt share of capacity","%",16,20,"higher"]]},
  project:{title:"Architecture health scorecard, version 1", deliver:"A one-page scorecard of six to ten measures for your domain, reviewed monthly with delivery leads.", steps:["Pick six to ten measures across delivery, reliability, architecture and people","Write a definition and data source for each; automate at least two","Agree targets or thresholds with delivery leads, not alone","Collect a baseline and three months of trend if available","Name an owner and an action for every red measure","Hold the first monthly review; retire any measure nobody would act on","Write a three-line executive summary in business terms"],
    rubric:["Six to ten measures, each with a definition and source","At least two measures collected automatically","Targets agreed with delivery leads","Every red has an owner and an action","A monthly review has happened","The executive summary uses business language"]}
},
{ id:"m15", lvl:"p", title:"Facilitation and driving adoption", time:"90 min",
  summary:"Run workshops that end in decisions, and get teams to adopt standards, platforms and paved roads because they want to, not because they were told.",
  objectives:["Design a workshop around a clear purpose, outcome and process","Use diverge-and-converge techniques and manage group dynamics","Diagnose stalled adoption with the adoption curve and ADKAR","Make the right way the easy way"],
  learn:`
<h3>Every workshop needs a POP</h3>
<p>Before inviting anyone, write the <b>purpose</b> (why we are meeting), the <b>outcome</b> (the decision or artefact we will leave with), and the <b>process</b> (the agenda that gets us there). If you cannot name the outcome, send an update instead.</p>
<h3>Facilitator or decider?</h3>
<p>The facilitator runs the process; the decider decides. When you have a strong stake in the answer, say so openly, or ask a neutral colleague to facilitate while you participate. Facilitating towards your own preferred answer quietly costs trust.</p>
<h3>Diverge, then converge</h3>
<p>Good sessions first widen the options, then narrow them. Between the two sits what Sam Kaner calls the <b>groan zone</b>: the uncomfortable stretch where views conflict. It is normal. Do not cut it short by deciding too early.</p>
<ul>
<li><b>Silent writing first.</b> Everyone writes ideas alone for three minutes before discussion, so the loudest voice does not anchor the group.</li>
<li><b>1-2-4-All</b> (from Liberating Structures): think alone, then in pairs, then fours, then the whole group.</li>
<li><b>Dot voting</b> to narrow options; <b>fist-of-five</b> to test support for a decision.</li>
<li><b>Timeboxes</b> stated up front, and a visible <b>parking lot</b> for off-topic points.</li>
</ul>
<h3>Architecture workshops worth knowing</h3>
<div class="tbl"><table><thead><tr><th>Format</th><th>Produces</th></tr></thead><tbody>
<tr><td>Event storming</td><td>Domain events on a timeline; candidate service boundaries</td></tr>
<tr><td>Capability mapping</td><td>A shared capability map and heat map (Module 4)</td></tr>
<tr><td>Quality-attribute workshop</td><td>Prioritised quality scenarios with measures (Module 6)</td></tr>
<tr><td>Pre-mortem</td><td>Imagine the project failed a year from now; list why. Risks the plan missed.</td></tr>
<tr><td>Planning breakouts</td><td>Features, dependencies and risks for the next increment</td></tr>
</tbody></table></div>
<h3>Managing the room</h3>
<ul>
<li><b>Dominant voices:</b> use rounds, where everyone speaks once before anyone speaks twice.</li>
<li><b>The most senior person:</b> ask them to speak last, so their view does not end the discussion.</li>
<li><b>Quiet people:</b> written input first; invite them by name only if you know they are comfortable.</li>
<li><b>Remote participants:</b> collect input in chat or a shared board before discussion, and give remote voices the first turn.</li>
<li><b>Closing:</b> read back decisions, owners and dates. Send the summary within 24 hours.</li>
</ul>
<h3>Adoption: standards do not adopt themselves</h3>
<p>Publishing a standard is the start, not the finish. Everett Rogers' diffusion curve describes how change spreads: innovators, early adopters, an early majority, a late majority and laggards. Win the early adopters first and make them visible as reference teams; the early majority follows peers, not memos.</p>
<h3>Make the right way the easy way</h3>
<p>A paved road (or golden path) should be the fastest route to production, not only the compliant one: templates, project generators, working examples, documentation, migration tooling and a support channel. When compliance is easier than non-compliance, most teams comply without being asked. Add automated guardrails (fitness functions, pipeline checks) once the easy path exists, not before.</p>
<h3>Diagnose stalled adoption with ADKAR</h3>
<p>Prosci's ADKAR model lists five things a person needs to change: <b>Awareness</b> of why, <b>Desire</b> to take part, <b>Knowledge</b> of how, <b>Ability</b> to do it in practice, and <b>Reinforcement</b> to keep doing it. Find the first missing element and fix that one. Teams that know why and want to, but lack the time to migrate, need capacity, not more training.</p>
<h3>Listen to resistance</h3>
<p>Resistance is information. A team refusing your standard may know about a constraint you missed. Ask what would make it work for them. Set sunset dates for old paths, and support teams through them.</p>`,
  examples:[
    {kind:"ba", title:"A workshop invitation", before:"Subject: Data access architecture discussion\nAgenda: Discuss data access architecture (2 hours)\nAttendees: everyone on the programme (24 people)", after:"Subject: Decide how data products publish change events (90 min)\nPurpose: teams are blocked until we agree how data products publish change events.\nOutcome: a decision between table-level change events and business-level events, recorded as ADR-0015.\nDecider: Dana (lead architect, data products). Facilitator: Sam (neutral).\nPre-read: two one-page options, sent by Monday.\nAgenda:\n 10 min  Criteria we will judge by (agree before options)\n 20 min  Each option presented against the criteria\n 15 min  Silent questions and concerns, then grouped\n 25 min  Discussion of the top concerns\n 10 min  Fist-of-five; decider decides\n 10 min  Owners, next steps, ADR author\nAttendees: 8 people who own the affected systems.", notice:["The outcome is a decision, named in the subject line.","Criteria are agreed before options, which takes heat out of the debate.","Eight owners instead of 24 observers; others get the ADR."]},
    {kind:"ba", title:"Announcing a standard versus planning adoption", before:"From the architecture office: Effective immediately, all new services must use the platform event library. Non-compliance will be raised at design review.", after:"Adoption plan, platform event library:\n1. Two early-adopter teams pilot it this quarter; we fix what they find.\n2. The service template includes it by default, so new services get it free.\n3. A migration guide and a two-hour clinic for existing services.\n4. Reference teams share results at the community of practice.\n5. A pipeline check warns from Q2 and blocks from Q3, with a time-boxed exception process.", notice:["The easy path comes first; the guardrail comes later.","Peers, not memos, persuade the early majority.","Warn before blocking, and keep an exception route."]}],
  quiz:[
    {q:"What should a workshop's 'outcome' describe?",o:["The agenda","The decision or artefact the group will leave with","The attendee list","The room booking"],a:1,why:"If you cannot name an outcome, the meeting is probably an update."},
    {q:"You strongly prefer one option in a workshop you are running. What should you do?",o:["Steer the group quietly","State your stake openly, or ask a neutral colleague to facilitate","Cancel the workshop","Skip the discussion and announce the decision"],a:1,why:"Transparency protects trust and the quality of the decision."},
    {q:"Why ask the most senior person to speak last?",o:["Seniority rules","So their view does not anchor or end the discussion","To save time","They know least"],a:1,why:"Early senior opinions suppress other views."},
    {q:"Teams understand why a new standard matters and want it, but haven't migrated. In ADKAR terms, what is most likely missing?",o:["Awareness","Desire","Ability, often time and capacity","Reinforcement"],a:2,why:"Fix the first missing element. Here that is usually capacity or tooling, not more communication."},
    {q:"What is the best first move to drive adoption of a paved road?",o:["Block non-compliant deployments immediately","Make the paved road the fastest route to production and win early adopters","Send a memo from the CIO","Add it to the audit checklist"],a:1,why:"Make the right way the easy way, then add guardrails."}],

  ["protect","Protect and grow","High leverage, energising","Your best work. Block calendar time for it and say no to what crowds it out."],
  ["drop","Delegate, automate or drop","Low leverage, draining","Start here to free time: hand it off, automate it, replace it with an async update, or decline it."],
  ["ration","Ration it","Low leverage, energising","Often old individual-contributor work. Keep a small, deliberate dose as your sharpening budget, off the critical path."]];
const JARGON = {"leverage":"use","leveraging":"using","leveraged":"used","utilise":"use","utilize":"use","utilising":"using","utilizing":"using","utilisation":"use","utilization":"use","facilitate":"help","facilitating":"helping","functionality":"feature","remediate":"fix","remediation":"fix","synergy":"(cut)","synergies":"(cut)","paradigm":"model","holistic":"complete","robust":"say what it withstands","scalable":"say how many it handles","seamless":"say what changes for the user","seamlessly":"say what changes for the user","resiliency":"ability to recover","going forward":"from now on, or cut","at this point in time":"now","in order to":"to","in the event of":"if","prior to":"before","subsequent to":"after","with regard to":"about","with respect to":"about","due to the fact that":"because","a number of":"some, or give the number","best-in-class":"cut, or give evidence","best of breed":"cut, or give evidence","circle back":"return to","deep dive":"review","bandwidth":"time","actionable":"practical","operationalize":"run","operationalise":"run","incentivize":"encourage","incentivise":"encourage","optimize":"improve (say how)","optimise":"improve (say how)","enablement":"support","ecosystem":"set of systems","in terms of":"cut or rephrase","it should be noted that":"cut","may potentially":"may","could potentially":"could","might potentially":"might","reach out":"contact","touch base":"talk","moving forward":"from now on, or cut","pending":"until, or waiting for","non-zero":"some","impactful":"say the effect","learnings":"lessons","align on":"agree"};
const JRE = new RegExp("\\b(" + Object.keys(JARGON).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-\s]/g,m=>m===" "?"\\s+":"\\-")).join("|") + ")\\b","gi");
const PRE = /\b(?:am|is|are|was|were|be|been|being)\s+(?:\w+ly\s+)?(?:\w+ed|\w+en|built|done|made|held|kept|left|lost|met|paid|put|run|sent|set|shown|told|taken|given|found|known|seen)\b/gi;
const ARE = /\b[A-Z][A-Z0-9]{1,6}s?\b/g;
const syl = w => { w=w.toLowerCase().replace(/[^a-z]/g,""); if(!w) return 0; if(w.length<=3) return 1; w=w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/,"").replace(/^y/,""); const g=w.match(/[aeiouy]{1,2}/g); return g?g.length:1; };
function analyse(text){
  const clean = text.replace(/\s+/g," ").trim();
  if(!clean) return null;
  const sents = clean.split(/(?<=[.!?])\s+(?=["'(\[]?[A-Z0-9])/).filter(s=>s.trim());
  const words = clean.match(/[A-Za-z0-9][A-Za-z0-9'’-]*/g)||[];
  const sw = sents.map(s=>(s.match(/[A-Za-z0-9][A-Za-z0-9'’-]*/g)||[]).length);
  const syll = words.reduce((a,w)=>a+(/^\d/.test(w)?1:syl(w)),0);
  const n = Math.max(1,words.length), ns = Math.max(1,sents.length);
  const grade = 0.39*(n/ns) + 11.8*(syll/n) - 15.59;
  const jargon = [...new Set((clean.match(JRE)||[]).map(x=>x.toLowerCase().replace(/\s+/g," ")))];
  const passive = sents.filter(s=>{ PRE.lastIndex=0; return PRE.test(s); }).length;
  const acr = [...new Set((clean.match(ARE)||[]).filter(a=>!/^(I|A|OK|US|UK|CEO|CIO|COO|CFO|CTO|Q[1-4])$/.test(a)))];
  const first = sents[0]||"";
  const opensWithAsk = /\b(recommend|propose|need|decide|decision|approve|approval|ask|request|must|should)\b/i.test(first);
  return {sents, sw, words:words.length, avg:words.length/ns, long:sw.filter(x=>x>25).length, grade, jargon, passive, acr, opensWithAsk, mins:Math.max(1,Math.round(words.length/230))};
}
function markup(a){
  return a.sents.map((s,i)=>{ let h=esc(s);
    h=h.replace(PRE,x=>`<span class="pv">${x}</span>`);
    h=h.replace(JRE,x=>`<mark class="jg" title="Try: ${esc(JARGON[x.toLowerCase().replace(/\s+/g," ")]||"")}">${x}</mark>`);
    h=h.replace(/(^|[\s(>])([A-Z][A-Z0-9]{1,6}s?)(?=[\s,.;:)<-]|$)/g,(x,p,ac)=>/^(I|A|OK|US|UK|CEO|CIO|COO|CFO|CTO|Q[1-4])$/.test(ac)?x:`${p}<span class="ac">${ac}</span>`);
    return a.sw[i]>25?`<span class="long">${h}</span>`:h; }).join(" ");
}
const isLabel = t => /^(agenda|background|overview|introduction|context|current state|current-state architecture|architecture|options|options analysis|vendor comparison|risks?|next steps|summary|recommendation|appendix|q&a|questions|timeline|budget|status)$/i.test(t.trim());
function titleCheck(t){
  const w=(t.trim().match(/\S+/g)||[]).length;
  if(!w) return ["","empty"];
  if(isLabel(t)||w<=3) return ["Reads as a label. Write the point as a full sentence.","bad"];
  if(w>15) return [`${w} words. Cut to one message of 15 words or fewer.`,"warn"];
  return [`${w} words. Good length.`,"ok"];
}

const KEY = "ppa-progress-v1";
let S = {read:{},quiz:{},lab:{},proj:{},cap:{},build:{},code:{},comp:{},alloc:{},matrix:{},wsjf:{},quad:{},lvl:{},score:{},wr:{}};
try { const r = localStorage.getItem(KEY); if (r) S = Object.assign(S, JSON.parse(r)); } catch(e){}
const persist = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };
function save(){ persist(); updateMeter(); renderTabs(); }
const projN = m => (S.proj[m.id]||[]).length;
function modDone(m){ return !!(S.read[m.id] && S.lab[m.id] && (S.quiz[m.id]||0)>=4 && projN(m)>=m.project.rubric.length); }
function pct(){ let t=0,g=0; MODULES.forEach(m=>{ t+=3+m.project.rubric.length; g+=(S.read[m.id]?1:0)+(S.lab[m.id]?1:0)+((S.quiz[m.id]||0)>=4?1:0)+projN(m); }); CAPSTONES.forEach(c=>{ t+=c.rubric.length; g+=(S.cap[c.id]||[]).length; }); return Math.round(g/t*100); }
function updateMeter(){ document.getElementById("meter").textContent = pct()+"% complete"; }
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true,1800); }
function copyText(txt, el){ try{ navigator.clipboard.writeText(txt).then(()=>toast("Copied"),()=>{ selectEl(el); toast("Press Ctrl/⌘ + C to copy"); }); }catch(e){ selectEl(el); toast("Press Ctrl/⌘ + C to copy"); } }
function selectEl(el){ if(!el) return; if (el.select) el.select(); else { const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); } }

const mmdReady = typeof mermaid !== "undefined";
if (mmdReady) mermaid.initialize({startOnLoad:false, securityLevel:"strict", theme:"base", fontFamily:"IBM Plex Sans, system-ui, sans-serif",
  flowchart:{htmlLabels:true, curve:"basis", padding:12},
  themeVariables:{background:"#FCFCFD", primaryColor:"#FFFFFF", primaryTextColor:"#121A26", primaryBorderColor:"#17624F", lineColor:"#586374", secondaryColor:"#DCEEE6", tertiaryColor:"#F2F4F6", textColor:"#121A26", clusterBkg:"#F2F4F6", clusterBorder:"#AAB4C1", edgeLabelBackground:"#FCFCFD", titleColor:"#121A26", fontSize:"14px"}});
let mmdN = 0;
async function draw(el, code){
  if (!mmdReady){ el.innerHTML = `<div class="err">The diagram renderer did not load.</div>`; return false; }
  const id = "mm"+(++mmdN);
  try { await mermaid.parse(code); const {svg} = await mermaid.render(id, code); el.innerHTML = svg; return true; }
  catch(e){ document.getElementById(id)?.remove(); document.getElementById("d"+id)?.remove(); el.innerHTML = `<div class="err">${esc(String(e&&e.message||e).split("\n").slice(0,6).join("\n"))}</div>`; return false; }
}

/* ======== views ======== */
const VIEWS = ["home", ...MODULES.map(m=>m.id), "capstones", "reference"];
let current = "home";
function renderTabs(){
  const b=(id,l,d)=>`<button data-go="${id}" aria-current="${current===id}">${d!==undefined?`<span class="dot ${d?"ok":""}"></span>`:""}${l}</button>`;
  document.getElementById("tabs").innerHTML = b("home","Overview")+`<span class="sep"></span>`+MODULES.map((m,i)=>b(m.id,`${i+1}. ${m.title}`,modDone(m))).join("")+`<span class="sep"></span>`+b("capstones","Capstones")+b("reference","Reference");
}
function go(id, top){
  if (!VIEWS.includes(id)) id="home";
  current=id; renderTabs(); CODE.length=0;
  const v=document.getElementById("view");
  v.innerHTML = id==="home"?viewHome(): id==="capstones"?viewCaps(): id==="reference"?viewRef(): viewModule(MODULES.find(m=>m.id===id));
  bind(v,id);
  v.querySelectorAll("[data-mmd]").forEach(el=>draw(el, CODE[+el.dataset.mmd]));
  try{ if(location.hash.slice(1)!==id) history.replaceState(null,"","#"+id); }catch(e){}
  if (top!==false) window.scrollTo({top:0});
  document.querySelector(`nav.tabs [data-go="${id}"]`)?.scrollIntoView({block:"nearest",inline:"center"});
}

  </div></section>

  <section class="section"><div class="sec-head"><h2>Progress register</h2><span class="muted">Saved in this browser.</span></div>
    <div class="tbl"><table><thead><tr><th>Brief</th><th>Module</th><th>Stage</th><th>Read</th><th>Quiz</th><th>Lab</th><th>Project</th></tr></thead><tbody>
    ${MODULES.map(m=>`<tr><td class="num">${m.no}</td><td><button class="link" data-go="${m.id}">${m.title}</button><div class="muted" style="font-size:.8rem">${m.time}</div></td><td>${pill(m.lvl)}</td>

    ${CAPSTONES.map(c=>`<tr><td class="num">${c.code}</td><td><button class="link" data-go="capstones">${c.title}</button></td><td>${pill("e")}</td><td colspan="4" class="num">${(S.cap[c.id]||[]).length}/${c.rubric.length} rubric items</td></tr>`).join("")}
    </tbody></table></div>
    <p class="muted" style="font-size:.88rem">A module is complete when you have read it, scored 4/5 or better, finished the lab, and met every item in its project rubric.</p></section>

  <section class="section"><div class="sec-head"><h2>How to work through it</h2></div><div class="prose"><ol>
    <li>Take the self-assessment in Reference first. Re-take it after each stage.</li>
    <li>Do one module every week or two. Projects use your real initiatives; expect them to take longer than the reading.</li>
    <li>Share projects with your manager or a peer. Feedback is where most of the learning happens.</li>
    <li>Finish with Capstone 1, then at least one more. Capstones 5 and 6 pull the leadership and writing modules together.</li>
    <li>For C4, BPMN and diagrams-as-code, use the companion <a href="${STUDIO}" target="_blank" rel="noopener">Architecture Diagramming Studio</a>.</li></ol></div></section>`;
