<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Principal Architect Practicum</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a set of executive "briefs" — each module opens with a memo-style header block; the home page traces one line of sight from strategy to evidence. */
:root{
  --bg:#F2F4F6; --sheet:#FFFFFF; --ink:#121A26; --muted:#586374; --rule:#D8DEE5; --rule-strong:#AAB4C1;
  --accent:#17624F; --accent-ink:#FFFFFF; --accent-soft:#DCEEE6;
  --amber:#9C5E16; --amber-soft:#F8EAD3; --risk:#B23A2B; --risk-soft:#F8E1DD;
  --canvas:#FCFCFD; --canvas-dot:#DCE1E7;
  --f-display:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1118; --sheet:#141B25; --ink:#E3E8EF; --muted:#97A2B2; --rule:#263142; --rule-strong:#3D4C60;
  --accent:#5CC5A0; --accent-ink:#052219; --accent-soft:#12342A;
  --amber:#E5AE5C; --amber-soft:#33260F; --risk:#EE7B68; --risk-soft:#3A1C17;
  --canvas:#E9EDF1; --canvas-dot:#CBD3DC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1118; --sheet:#141B25; --ink:#E3E8EF; --muted:#97A2B2; --rule:#263142; --rule-strong:#3D4C60;
  --accent:#5CC5A0; --accent-ink:#052219; --accent-soft:#12342A;
  --amber:#E5AE5C; --amber-soft:#33260F; --risk:#EE7B68; --risk-soft:#3A1C17;
  --canvas:#E9EDF1; --canvas-dot:#CBD3DC; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.62;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2.1rem,6vw,3.4rem);letter-spacing:-.01em}
h2{font-size:clamp(1.5rem,4vw,2rem)}
h3{font-size:1.3rem;margin-top:.5rem}
h4{font-size:1.08rem}
p{margin:0}
code,pre{font-family:var(--f-mono);font-size:.85em}
:not(pre)>code{background:var(--accent-soft);padding:.05em .35em;border-radius:3px}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:1rem}
.prose{display:flex;flex-direction:column;gap:.85rem;max-width:68ch}
.prose ul,.prose ol{margin:0;padding-left:1.25rem;display:flex;flex-direction:column;gap:.35rem}
.prose blockquote{margin:0;border-left:3px solid var(--accent);padding:.3rem 0 .3rem 1rem;font-family:var(--f-display);font-style:italic;font-size:1.05rem}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;flex-direction:column;gap:.35rem;padding-block:.6rem .5rem}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:1rem}
.brand b{font-family:var(--f-display);font-size:1.15rem;font-weight:600}
.brand .meter{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.navscroll{overflow-x:auto;scrollbar-width:none;margin-inline:-4px}
.navscroll::-webkit-scrollbar{display:none}
nav.tabs{display:flex;gap:4px;padding:2px 4px;width:max-content}
nav.tabs button{font:600 .8rem/1 var(--f-body);color:var(--muted);background:none;border:1px solid transparent;border-radius:999px;padding:.5rem .75rem;cursor:pointer;white-space:nowrap;display:flex;gap:.4rem;align-items:center}
nav.tabs button:hover{color:var(--ink);border-color:var(--rule)}
nav.tabs button[aria-current="true"]{background:var(--ink);color:var(--sheet)}
nav.tabs .dot{width:7px;height:7px;border-radius:50%;background:var(--rule-strong)}
nav.tabs .dot.ok{background:var(--accent)}
nav.tabs .sep{width:1px;background:var(--rule);margin:4px 2px}
main{padding-block:1.5rem 4rem}

.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:clamp(16px,3.5vw,34px)}
.section{display:flex;flex-direction:column;gap:1.1rem}
.section+.section{margin-top:2.2rem;padding-top:2rem;border-top:1px solid var(--rule)}
.sec-head{display:flex;align-items:baseline;gap:.75rem;flex-wrap:wrap}
.sec-head .tag{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);padding:.12rem .45rem;border-radius:3px}

/* memo header block */
.memo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:3px double var(--ink);border-bottom:3px double var(--ink);margin-top:1.25rem}
.memo>div{padding:.5rem .7rem;border-right:1px solid var(--rule);min-width:0}
.memo>div:last-child{border-right:0}
.memo .k{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:block}
.memo .v{font-weight:600;font-variant-numeric:tabular-nums}
@media (max-width:560px){.memo{grid-template-columns:repeat(2,minmax(0,1fr))}.memo>div:nth-child(2){border-right:0}.memo>div:nth-child(-n+2){border-bottom:1px solid var(--rule)}}

.lvl{display:inline-flex;align-items:center;font:600 .7rem/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:.3rem .5rem;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.lvl.f{color:var(--accent)} .lvl.p{color:var(--amber)} .lvl.e{color:var(--risk)}

.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:.6rem .75rem;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--bg);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:.85rem}

.canvas{background-color:var(--canvas);background-image:radial-gradient(var(--canvas-dot) 1px,transparent 1.2px);background-size:16px 16px;border:1px solid var(--rule-strong);border-radius:var(--r);overflow:auto;padding:16px;min-height:120px;color:#121A26;display:flex;align-items:flex-start;justify-content:center}
.canvas .loading{font-family:var(--f-mono);font-size:.8rem;color:#586374;align-self:center}
.canvas .err{font-family:var(--f-mono);font-size:.78rem;color:#B23A2B;white-space:pre-wrap;width:100%}
.fig{display:flex;flex-direction:column;gap:.6rem;min-width:0}
.figcap{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:baseline;justify-content:space-between}
.notice{background:var(--bg);border-left:3px solid var(--accent);padding:.6rem .85rem;border-radius:0 var(--r) var(--r) 0;font-size:.93rem}
.notice ul{margin:.25rem 0 0;padding-left:1.1rem;display:flex;flex-direction:column;gap:.2rem}
pre.src{background:var(--bg);border:1px solid var(--rule);border-radius:var(--r);padding:.85rem 1rem;overflow-x:auto;margin:0;line-height:1.55;font-size:.8rem;white-space:pre}
.ba{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem}
@media (max-width:760px){.ba{grid-template-columns:minmax(0,1fr)}}
.ba>div{border:1px solid var(--rule);border-radius:var(--r);padding:1rem;display:flex;flex-direction:column;gap:.5rem;min-width:0}
.ba .before{border-top:3px solid var(--risk)} .ba .after{border-top:3px solid var(--accent)}
.ba .txt{font-size:.92rem;white-space:pre-wrap}

.btns{display:flex;flex-wrap:wrap;gap:.5rem}
.btn{font:600 .85rem/1 var(--f-body);border:1px solid var(--rule-strong);background:var(--sheet);color:var(--ink);padding:.6rem .9rem;border-radius:var(--r);cursor:pointer;display:inline-flex;align-items:center;gap:.4rem;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;padding-inline:.4rem;color:var(--accent)}
.btn.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* hero + line of sight */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(1rem,4vw,2.5rem);align-items:start}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.lede{font-size:1.08rem;max-width:56ch}
.los{display:flex;flex-direction:column;gap:.7rem;min-width:0}
.chain{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--ink);border-radius:var(--r);overflow:hidden}
.chain button{flex:1 1 auto;font:600 .78rem/1.15 var(--f-body);background:var(--sheet);color:var(--ink);border:0;border-right:1px solid var(--ink);padding:.6rem .5rem;cursor:pointer;min-width:84px;position:relative}
.chain button:last-child{border-right:0}
.chain button small{display:block;font:500 .62rem/1 var(--f-mono);letter-spacing:.08em;color:var(--muted);margin-bottom:.25rem}
.chain button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.chain button[aria-pressed="true"] small{color:var(--sheet);opacity:.7}
@media (max-width:560px){.chain button{flex:1 1 30%;border-bottom:1px solid var(--ink)}}
.loscard{border:1px solid var(--rule);border-radius:var(--r);padding:1rem;display:flex;flex-direction:column;gap:.65rem;background:var(--sheet)}
.loscard .big{font-family:var(--f-display);font-size:1.25rem;font-weight:600;line-height:1.3}
.kv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.6rem 1rem;font-size:.9rem}
@media (max-width:480px){.kv{grid-template-columns:minmax(0,1fr)}}
.kv .k{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block}

.path{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
@media (max-width:760px){.path{grid-template-columns:minmax(0,1fr)}}
.stage{border:1px solid var(--rule);border-radius:var(--r);padding:1rem;display:flex;flex-direction:column;gap:.5rem;background:var(--sheet)}
.stage ol{margin:0;padding-left:1.1rem;font-size:.92rem}
.bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.meterline{display:flex;align-items:center;gap:.6rem;font-family:var(--f-mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.meterline .bar{flex:1;min-width:80px}
button.link{background:none;border:0;padding:0;color:var(--ink);font:600 .95rem var(--f-body);cursor:pointer;text-align:left}
button.link:hover{color:var(--accent);text-decoration:underline}
.chk{font-family:var(--f-mono);font-size:.8rem}
.chk.ok{color:var(--accent)} .chk.no{color:var(--rule-strong)}

.q{border:1px solid var(--rule);border-radius:var(--r);padding:1rem;display:flex;flex-direction:column;gap:.6rem;margin:0}
.q .qn{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);letter-spacing:.08em}
.q legend{font-weight:600;padding:0}
.opt{display:flex;gap:.6rem;align-items:flex-start;padding:.5rem .6rem;border:1px solid var(--rule);border-radius:var(--r);cursor:pointer;font-size:.95rem}
.opt input{margin-top:.3rem;accent-color:var(--accent)}
.opt.right{border-color:var(--accent);background:var(--accent-soft)}
.opt.wrong{border-color:var(--risk);background:var(--risk-soft)}
.why{font-size:.9rem;padding:.6rem .8rem;border-radius:var(--r);background:var(--bg)}
.score{font-family:var(--f-display);font-size:1.35rem;font-weight:600}

.reqs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.4rem}
.reqs label{display:flex;gap:.55rem;align-items:flex-start;font-size:.93rem;cursor:pointer}
.reqs input{margin-top:.32rem;accent-color:var(--accent)}
.steps{margin:0;padding-left:1.3rem;display:flex;flex-direction:column;gap:.5rem}
.steps li::marker{font-family:var(--f-mono);color:var(--accent);font-weight:600}
details.reveal{border:1px solid var(--rule);border-radius:var(--r);padding:.6rem .85rem}
details.reveal summary{cursor:pointer;font-weight:600;font-size:.92rem}
details.reveal[open] summary{margin-bottom:.6rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* lab widgets */
.field{display:flex;flex-direction:column;gap:.25rem}
.field label{font-weight:600;font-size:.88rem}
.field .help{font-size:.8rem;color:var(--muted)}
.field textarea,.field input[type=text],select.sel,input.cell{font:400 .92rem/1.45 var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--rule-strong);border-radius:var(--r);padding:.5rem .65rem;width:100%}
.field textarea{min-height:64px;resize:vertical}
.preview{border:2px solid var(--ink);border-radius:var(--r);padding:1rem 1.1rem;font-size:.93rem;white-space:pre-wrap;background:var(--sheet);min-width:0;overflow-wrap:anywhere}
.editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:.75rem}
@media (max-width:820px){.editor{grid-template-columns:minmax(0,1fr)}}
.editor textarea{width:100%;min-height:300px;resize:vertical;font:400 .8rem/1.55 var(--f-mono);background:var(--bg);color:var(--ink);border:1px solid var(--rule-strong);border-radius:var(--r);padding:.8rem}
.edhead{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
.status{font-family:var(--f-mono);font-size:.72rem}
.status.ok{color:var(--accent)} .status.bad{color:var(--risk)}
.sortrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,220px);gap:.6rem;align-items:center;padding:.55rem 0;border-bottom:1px solid var(--rule)}
.sortrow:last-child{border-bottom:0}
@media (max-width:520px){.sortrow{grid-template-columns:minmax(0,1fr)}}
.sortrow .fb{grid-column:1/-1;font-size:.85rem}
.sortrow.right .fb{color:var(--accent)} .sortrow.wrong .fb{color:var(--risk)}
.slider{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 3.2rem;gap:.75rem;align-items:center;padding:.45rem 0;border-bottom:1px solid var(--rule)}
@media (max-width:560px){.slider{grid-template-columns:minmax(0,1fr) 3.2rem}.slider input{grid-column:1/-1;grid-row:2}}
.slider input{accent-color:var(--accent);width:100%}
.slider .val{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.slider .lab small{display:block;color:var(--muted);font-size:.78rem}
.flag{font:600 .68rem/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:.2rem .4rem;border-radius:3px;margin-left:.35rem}
.flag.lo{background:var(--amber-soft);color:var(--amber)} .flag.hi{background:var(--risk-soft);color:var(--risk)} .flag.ok{background:var(--accent-soft);color:var(--accent)}
input.cell{width:4.2rem;text-align:center;padding:.35rem;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td.win{background:var(--accent-soft);font-weight:700}
.scen{border:1px solid var(--rule);border-radius:var(--r);padding:1rem;display:flex;flex-direction:column;gap:.6rem}
.scen .opt.strong{border-color:var(--accent);background:var(--accent-soft)}
.scen .opt.weak{border-color:var(--risk);background:var(--risk-soft)}
.scen .opt.ok{border-color:var(--amber);background:var(--amber-soft)}

.cap{border:1px solid var(--rule);border-radius:var(--r);padding:clamp(14px,3vw,26px);display:flex;flex-direction:column;gap:1rem;background:var(--sheet)}
.cap-head{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:flex-start}
.domain{font:600 .7rem/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.toc{display:flex;flex-wrap:wrap;gap:.4rem}
.toc a{font:600 .8rem/1 var(--f-body);text-decoration:none;border:1px solid var(--rule);padding:.45rem .65rem;border-radius:999px;color:var(--ink)}
.pager{display:flex;justify-content:space-between;gap:.75rem;flex-wrap:wrap;margin-top:1.5rem}
dl.gloss{display:grid;grid-template-columns:minmax(130px,max-content) minmax(0,1fr);gap:.5rem 1.2rem;margin:0}
dl.gloss dt{font-weight:700} dl.gloss dd{margin:0}
@media (max-width:560px){dl.gloss{grid-template-columns:minmax(0,1fr)} dl.gloss dd{margin-bottom:.4rem}}
.comp{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:.4rem 1rem;align-items:center;padding:.6rem 0;border-bottom:1px solid var(--rule)}
.comp:last-child{border-bottom:0}
@media (max-width:620px){.comp{grid-template-columns:minmax(0,1fr)}}
.comp .lv{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.comp .lv button{font:600 .72rem/1 var(--f-mono);padding:.5rem 0;border:1px solid var(--rule-strong);background:var(--sheet);color:var(--muted);border-radius:4px;cursor:pointer}
.comp .lv button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:.6rem 1rem;border-radius:var(--r);font-size:.88rem;z-index:50}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* added labs */
.qrow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr);gap:.5rem 1rem;align-items:center;padding:.55rem 0;border-bottom:1px solid var(--rule)}
@media (max-width:640px){.qrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.qrow .qname{grid-column:1/-1}}
.qname{font:400 .92rem/1.4 var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--rule-strong);border-radius:var(--r);padding:.45rem .6rem;width:100%;min-width:0}
.rng{display:flex;flex-direction:column;gap:.15rem;font-size:.78rem;color:var(--muted)}
.rng b{color:var(--ink);font-family:var(--f-mono)}
.rng input{accent-color:var(--accent);width:100%}
.quadwrap{display:grid;grid-template-columns:1.4rem minmax(0,1fr);gap:.4rem;margin-top:.8rem}
.axis-y{writing-mode:vertical-rl;transform:rotate(180deg);font:600 .68rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.axis-x{grid-column:2;text-align:right;font:600 .68rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.quad{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.6rem}
@media (max-width:560px){.quad{grid-template-columns:minmax(0,1fr)}}
.quad>div{border:1px solid var(--rule);border-radius:var(--r);padding:.8rem;display:flex;flex-direction:column;gap:.35rem;min-width:0;background:var(--sheet)}
.quad .q-protect{border-top:3px solid var(--accent)} .quad .q-lighter{border-top:3px solid var(--amber)} .quad .q-ration{border-top:3px solid var(--rule-strong)} .quad .q-drop{border-top:3px solid var(--risk)}
.quad ul{margin:0;padding-left:1.1rem;font-size:.9rem}
.quad .hint{font-size:.8rem;color:var(--muted)}
.wmgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.5rem}
.wm{border:1px solid var(--rule);border-left:3px solid var(--rule-strong);border-radius:var(--r);padding:.5rem .7rem;display:flex;flex-direction:column;gap:.1rem;min-width:0}

{ id:"m1", lvl:"f", title:"The role you actually have", time:"60 min",
  summary:"Principal engineer by title, architect and executive by expectation. Define the job in a chief data office technology team, find your leverage, and decide what to stop doing.",
  objectives:["Describe the principal architect role in your own words, including decision rights","Recognise the common Staff+ archetypes and failure modes","Audit where your time goes and set a target portfolio"],
  learn:`
<h3>Two titles, one job</h3>
<p>"Principal engineer" signals technical depth and credibility. "Executive director" signals organisational altitude and accountability for outcomes. Together they describe a translator: you take the chief data officer's strategy and the business's needs for data, decide what they mean for platforms and teams, and push clear, buildable intent down to delivery. Your output is no longer mainly code. It is <b>decisions, clarity and alignment</b> that let many teams move in the same direction.</p>
<h3>The CDO technology context</h3>
<p>A chief data office sets data strategy, governance and policy. Its technology arm builds the platforms that make that strategy real: how data moves from source systems to the people who use it, and how access to it is requested, granted, controlled and evidenced. Your customers are internal: risk, finance, regulatory reporting, analytics and AI teams, and the source application teams who produce the data. Your constraints come from data owners, privacy, information security and regulators. That makes the role unusually cross-cutting. Almost every decision touches several teams you do not run.</p>
<h3>The translation loop</h3>
<p>Strategy flows down: outcomes, data capabilities, target platform architecture, epics and features, team stories. Evidence flows back up: freshness and quality metrics, access lead times, incidents, audit findings. You own the middle of that chain, and you are accountable for it holding together. The diagram below highlights your part.</p>
<h3>Staff-plus archetypes</h3>
<p>Will Larson describes four shapes of senior technical role. Most principal architects blend two.</p>
<div class="tbl"><table><thead><tr><th>Archetype</th><th>Focus</th><th>In your role</th></tr></thead><tbody>
<tr><td>Tech lead</td><td>Guides one team's execution</td><td>Occasionally, during a critical platform launch</td></tr>
<tr><td>Architect</td><td>Direction and quality of a domain</td><td>Core of the job: data movement and access platforms</td></tr>
<tr><td>Solver</td><td>Parachutes into hard problems</td><td>Sometimes, for failed batch runs or blocked migrations</td></tr>
<tr><td>Right hand</td><td>Extends an executive's reach</td><td>Strong at ED level: you represent CDO technology in leadership forums</td></tr>
</tbody></table></div>
<h3>What changes at this level</h3>
<ul>
<li><b>From answers to questions.</b> The best contribution is often the question that reframes a problem: "Who is waiting for this data, and what do they do while they wait?"</li>
<li><b>From doing to multiplying.</b> Measure yourself by what teams can do because of you.</li>
<li><b>From correct to timely.</b> A good decision this week beats a perfect one next quarter, if it is reversible.</li>
<li><b>From team scope to portfolio scope.</b> You weigh trade-offs across platforms, budgets and risk, not only within one pipeline.</li>
</ul>
<h3>Failure modes to watch for</h3>
<ul>
<li><b>Ivory tower:</b> an elegant target data platform nobody can migrate to.</li>
<li><b>Super-senior engineer:</b> still writing the critical pipelines, so nothing moves when you are in meetings.</li>
<li><b>Bottleneck approver:</b> every design and every new feed waits for your review.</li>
<li><b>Requirements thrower:</b> long specs pushed over the wall without the team's input.</li>
<li><b>Meeting sponge:</b> present in every governance forum, deciding nothing.</li>
</ul>
<h3>In a regulated firm</h3>
<p>Data platforms are where many controls live: who can see what, where data came from, how long it is kept. Your design decisions become evidence that auditors, risk partners and regulators will read. Clear decision records, lineage and controls-by-design are part of the job, not overhead. Modules 6 and 16 go deeper.</p>`,
  examples:[{kind:"diagram", title:"Your part of the chain", code:D.loop, caption:"Highlighted steps are where a principal architect adds the most leverage.", notice:["You do not own the CDO's strategy or the team's stories, but you are accountable for the links between them.","The dotted line matters: without evidence flowing back, the chain becomes a one-way spec factory."]}],
  quiz:[
    {q:"Which best describes the main output of a principal architect in CDO technology?",o:["Pipelines on the critical path","Decisions, clarity and alignment that many teams build on","Detailed user stories for every team","Approval of every new data feed"],a:1,why:"Your leverage comes from decisions and direction that multiply across teams."},
    {q:"Which archetype describes extending an executive's reach into forums they cannot attend?",o:["Solver","Tech lead","Right hand","Architect"],a:2,why:"The right hand operates with borrowed authority on behalf of a leader. ED-level architects often do some of this."},
    {q:"Every new data feed waits for your design review, and teams are slowing down. Which failure mode is this?",o:["Ivory tower","Bottleneck approver","Meeting sponge","Requirements thrower"],a:1,why:"Make decision rights explicit and push reversible decisions to teams with guardrails, such as a standard feed pattern."},
    {q:"What does 'from correct to timely' mean in practice?",o:["Skip analysis","Prefer quick decisions for reversible choices; invest time in irreversible ones","Always decide in the meeting","Delegate every decision"],a:1,why:"Match decision effort to reversibility and blast radius."},
    {q:"Why do decision records matter more for data platforms in a regulated firm?",o:["They are optional paperwork","Access, lineage and retention controls live in the platform, so design decisions become audit evidence","They replace testing","They speed up coding"],a:1,why:"Traceable decisions show how data risk was considered and controlled."}],

    brief:"Look back at your calendar for the last two weeks. Estimate the share of your time in each category. The page compares it with a typical range for a principal architect at ED level. Ranges are a starting point; adjust them in your role charter.",
    cats:[["Strategy and discovery","CDO and business partners, outcome framing, roadmap",15,25,10],["Architecture and decisions","Target platform, ADRs, design reviews",20,30,15],["Delivery partnership","PI planning, backlog shaping, unblocking teams",15,25,30],["People and influence","Mentoring, 1:1s, coalition building",15,25,10],["Hands-on technical","Prototypes, code reviews, spikes",5,15,25],["Status and low-value meetings","Meetings with no decision or outcome",0,10,10]]},

{ id:"m2", lvl:"f", title:"From strategy to outcomes", time:"75 min",
  summary:"Read the CDO's strategy critically and turn it into measurable outcomes that platform teams can aim at.",
  objectives:["Separate activities, outputs, outcomes and impact","Test a strategy against Rumelt's kernel","Write OKRs and an impact map for a real data initiative","Use a Wardley map to inform build versus buy"],
  learn:`
<h3>Good strategy has a kernel</h3>
<p>Richard Rumelt's test: a strategy needs a <b>diagnosis</b> (what is really going on), a <b>guiding policy</b> (the approach to the challenge), and <b>coherent actions</b> (steps that reinforce each other). Many data strategies are lists of goals: "become data-driven", "democratise data". Your job is to ask for the missing diagnosis and policy, because platform choices depend on them. A real diagnosis sounds like: "Teams wait 15 days for access, so they copy data into unmanaged stores, which multiplies our privacy and quality risk."</p>
<h3>Activities, outputs, outcomes, impact</h3>
<div class="tbl"><table><thead><tr><th>Level</th><th>Definition</th><th>Northbank example</th></tr></thead><tbody>
<tr><td>Activity</td><td>Work we do</td><td>Interview analysts about how they find data</td></tr>
<tr><td>Output</td><td>Things we ship</td><td>Data catalogue launched</td></tr>
<tr><td>Outcome</td><td>Change in behaviour we can measure</td><td>Median access request lead time falls from 15 days to 1</td></tr>
<tr><td>Impact</td><td>Business result the outcome contributes to</td><td>Regulatory reports delivered on time; fewer data findings</td></tr>
</tbody></table></div>
<p>Teams control outputs. They influence outcomes. Aim the backlog at outcomes, and report outputs only as evidence of progress toward them. "We migrated 120 ETL jobs" is an output; "risk reports now use data under 15 minutes old" is an outcome.</p>
<h3>OKRs that work</h3>
<ul><li>Objective: qualitative and directional. "Make trusted data available within a day."</li><li>Key results: 2 to 4 measurable outcomes with a baseline and target. "Critical data elements with automated end-to-end lineage: 30% → 95%."</li><li>Not a task list. "Launch the catalogue" is an output, not a key result.</li><li>Include guardrail metrics, such as unauthorised access events or data-quality breaches, so speed is not bought with risk.</li></ul>
<h3>Impact mapping and opportunity trees</h3>
<p>An impact map links a goal to the actors who can affect it, the behaviour change you need from each, and the deliverables that might cause that change. Teresa Torres' opportunity solution tree adds a step: outcome → user opportunities (needs, pains) → candidate solutions → assumption tests. Both make it easy to drop platform features that do not connect to the goal.</p>
<h3>Wardley maps in one paragraph</h3>
<p>Map the components of a value chain on an evolution axis: genesis, custom-built, product, commodity. Build where you differentiate. Buy or use managed services where the market has commoditised. Object storage, event streaming and change-data-capture tooling are largely product or commodity today. How your firm models its own data, its policies and its data products is usually where differentiation lives.</p>
<h3>Questions to ask the CDO and data consumers</h3>
<ol><li>What problem are we solving, and for whom?</li><li>How will we know it worked? What number moves?</li><li>What happens if we do nothing for a year?</li><li>Which constraints are fixed: regulatory dates, budget, data residency, headcount?</li><li>What would make you stop or change course?</li><li>Which data risks worry you most, and who else needs to be comfortable?</li></ol>`,
  examples:[{kind:"diagram", title:"Impact map: the Trusted Data programme", code:D.impact, caption:"Goal, actors, behaviour changes, then candidate deliverables.", notice:["Deliverables come last and are candidates, not commitments.","Source application teams are actors too: the programme needs them to change how they publish data.","Any platform feature that does not hang off this tree should be questioned."]}],
  quiz:[
    {q:"Which is an outcome?",o:["Launch the data catalogue","Run five interviews with analysts","Median access request lead time falls from 15 days to 1","Fewer regulatory data findings"],a:2,why:"It is a measurable change in experience. Fewer findings is impact; the catalogue is an output."},
    {q:"Rumelt's kernel of good strategy is…",o:["Vision, mission, values","Diagnosis, guiding policy, coherent actions","Objectives and key results","Plan, do, check, act"],a:1,why:"Without a diagnosis, goals such as 'democratise data' are just wishes."},
    {q:"Which is a well-formed key result?",o:["Deliver the CDC framework by June","Critical data elements with automated lineage: 30% to 95%","Improve data quality","Hold weekly stand-ups"],a:1,why:"Baseline, target and an outcome measure."},

  project:{title:"Outcome brief for a real initiative", deliver:"A one-page outcome brief for a data movement or access initiative you are shaping now.", steps:["Diagnosis: the real problem in three sentences","Impact the business wants, and the outcomes that lead to it","Baseline and target for each outcome, with data source","Leading indicators you can see within weeks","Guardrail metrics (access risk, data quality, run cost)","Top three assumptions and how you will test them","Review with your CDO or business partner and agree the measures"],

{ id:"m3", lvl:"f", title:"Capabilities and target architecture", time:"90 min",
  summary:"Translate outcomes into data capabilities, assess them, and describe a target platform with realistic transition steps.",
  objectives:["Build a data capability map and heat-map it","Describe baseline, target and transition architectures","Write architecture principles that guide decisions","Produce a now/next/later roadmap that teams can plan against"],
  learn:`
<h3>Capabilities describe what, not how</h3>
<p>A capability is something the organisation does, independent of who does it or which tool supports it: "Capture changes from source systems", "Grant access to a data product". Capabilities are stable for years, while tools, vendors and org charts change. That stability makes them the right bridge between the CDO's strategy and your platform architecture.</p>
<ul><li>Level 1: broad areas (Data movement, Data management, Data access and protection).</li><li>Level 2: capabilities within them (Change data capture, Metadata and lineage).</li><li>Level 3: detail where needed (Schema evolution handling).</li></ul>
<h3>Heat-map for investment</h3>
<p>Score each capability on <b>strategic importance</b> (from the outcomes) and <b>current health</b> (process, tooling, data quality, audit findings). High importance plus low health is where investment goes. Show the result as a coloured capability map with a key, and repeat the meaning in labels so it works in greyscale.</p>
<h3>Baseline, target, transition</h3>
<p>TOGAF calls them baseline, target and transition architectures. Without transitions, a target platform is a poster. In data platforms, transitions matter even more because old and new run side by side: consumers cannot switch until feeds are reconciled. Each transition should be a stable, operable state that delivers some value and can be audited. Plan reconciliation, parallel running and the decommissioning step explicitly.</p>
<h3>TOGAF, lightly</h3>
<p>You do not need the full framework, but its cycle is a useful checklist: vision, business architecture, data and application architecture, technology architecture, opportunities and solutions, migration planning, implementation governance, change management. If a programme skips one, ask why.</p>
<h3>Architecture principles</h3>
<p>Write 6 to 10 principles in the form <b>name, statement, rationale, implications</b>. Example: <i>Capture once, publish as a product.</i> Source systems publish changes once through change data capture; consumers use governed data products, not private extracts. Rationale: fewer copies, consistent lineage, lower run cost. Implications: source teams own data contracts; we run a schema registry; consumers handle eventual consistency.</p>
<h3>Roadmaps people can plan against</h3>
<p>Use now / next / later, tied to outcomes rather than dates far out. "Now" should be concrete enough for the next planning increment. "Later" is directional and may change. Pair it with C4 context and container views of the target and each transition. The <a href="${STUDIO}" target="_blank" rel="noopener">Architecture Diagramming Studio</a> covers those views.</p>`,
  examples:[
    {kind:"diagram", title:"Target data flow, at container level", code:D.flow, caption:"Highlighted parts are new; the rest exists in some form today.", notice:["Metadata flows alongside data, so lineage is captured automatically rather than documented afterwards.","Consumers reach data through products and a policy decision, not through direct database access."]},
    {kind:"diagram", title:"Capability heat map", code:D.heat, caption:"Where Northbank should invest to hit its access and freshness outcomes.", notice:["Capabilities, not tools or teams.","The key states what each colour means, and the labels repeat it."]},
    {kind:"diagram", title:"Now / next / later roadmap", code:D.roadmap, caption:"Transition states that each deliver value.", notice:["Decommissioning the legacy scheduler appears on the roadmap. Otherwise it never happens.","Later items are directional and reviewed each quarter."]}],
  quiz:[
    {q:"A data capability is…",o:["A team","A tool","Something the organisation does with data, independent of who or how","A project"],a:2,why:"Capabilities outlast reorganisations and tool replacements."},
    {q:"Which capabilities should get investment first?",o:["High health, low importance","Low importance, low health","High importance, low health","Whatever the newest team owns"],a:2,why:"Close the biggest gap between what strategy needs and what exists."},
    {q:"Why are transition architectures especially important in data platform migrations?",o:["TOGAF requires them","Old and new run in parallel until feeds are reconciled, so each step must be operable and auditable","To delay delivery","To reduce documentation"],a:1,why:"Consumers cannot switch until data reconciles; plan the parallel run explicitly."},
    {q:"Which part of an architecture principle explains its cost?",o:["Name","Statement","Rationale","Implications"],a:3,why:"Implications spell out what the principle requires and what it rules out."},

{ id:"m4", lvl:"p", title:"Shaping the backlog", time:"90 min",
  summary:"Turn capabilities and target architecture into epics, features, enablers and stories that platform teams can build, with traceability back to outcomes.",
  objectives:["Write an epic hypothesis statement and lean business case","Write features with benefit hypotheses and acceptance criteria","Express non-functional requirements and data controls as enablers and acceptance criteria","Know where your writing stops and the team's begins"],
  learn:`
<h3>The backlog hierarchy</h3>
<div class="tbl"><table><thead><tr><th>Item</th><th>Size</th><th>Who writes it</th><th>Your role</th></tr></thead><tbody>
<tr><td>Portfolio epic</td><td>Quarters; needs funding</td><td>Epic owner with architect</td><td>Co-author, especially solution and NFRs</td></tr>
<tr><td>Feature</td><td>Fits one planning increment (8–12 weeks)</td><td>Product management</td><td>Shape and review; write enabler features</td></tr>
<tr><td>Enabler</td><td>Feature or story size</td><td>Architect or team</td><td>Author: runway, infrastructure, compliance, exploration</td></tr>
<tr><td>Story</td><td>Days; fits a sprint</td><td>Team with product owner</td><td>Review for fit; do not write them all</td></tr>
</tbody></table></div>
<h3>Platforms have users too</h3>
<p>Platform backlogs drift toward components ("build the policy engine") because the users are internal. Keep naming the user and the change in their day: the analyst who gets data in an hour, the steward who reviews only exceptions, the source team who publishes once. A platform product owner is as important as a customer-facing one.</p>
<h3>Epic hypothesis statement</h3>
${pre(`For <users> who <need>,
the <solution> is a <category>
that <key benefit>.
Unlike <current alternative>, our solution <differentiator>.

Business outcomes: <measurable, from the outcome brief>
Leading indicators: <early signals>
Non-functional requirements: <freshness, availability, security, compliance>`)}
<p>An epic is a hypothesis. Define the minimum viable version that tests it, and the evidence that would make you stop.</p>
<h3>Features</h3>
<ul><li>Name it by the benefit: "Policy-based automatic approval", not "Policy engine integration".</li><li>Benefit hypothesis: "We believe automatic approval will clear 70% of access requests without a human."</li><li>Acceptance criteria at feature level: observable behaviour and measures, not tasks.</li></ul>
<h3>Stories</h3>
<p>User voice ("As a data steward, I want…"), sized to days, INVEST (independent, negotiable, valuable, estimable, small, testable). Acceptance criteria in Given / When / Then. Useful splitting patterns for data work: one domain or source at a time, one classification level at a time, happy path then failure handling, read before write, and spikes for unknowns such as a source system's change log format.</p>
<h3>Non-functional requirements and data controls</h3>
<ul><li>As <b>constraints</b> on every story, written into the Definition of Done: encryption, logging, classification tags, lineage capture.</li><li>As <b>enablers</b> when work is needed: a schema registry, a policy decision service, an audit evidence store.</li><li>As <b>acceptance criteria</b> for controls: "Given a request for restricted data, when the requester lacks an entitled role, then the request is routed to the data owner and the decision is retained as evidence for 7 years."</li><li>As <b>data service levels</b>: freshness, completeness and quality thresholds for each data product.</li></ul>
<h3>Where your writing stops</h3>
<p>Write the intent, constraints and boundaries: epics, enabler features, NFRs, acceptance criteria for cross-cutting controls. Let teams write and split stories with their product owner. Review for architectural fit, not wording. Teams that write their own stories understand them; teams handed stories implement them literally.</p>`,
  examples:[{kind:"diagram", title:"Traceability from outcome to story", code:D.trace, caption:"Every story can be traced to the outcome it serves.", notice:["The enabler (amber) has no user-visible benefit on its own but is needed by both features.","Story S3 is a control written as a story, so it is planned and tested like any other work."]}],
  quiz:[
    {q:"A feature should fit within…",o:["One sprint","One planning increment","One year","Any size"],a:1,why:"Features are sized so a team or a few teams can deliver them within a PI."},
    {q:"Which is an enabler?",o:["Analyst can request access from the catalogue","Policy decision service","Steward sees a queue of exceptions","Requester receives an approval notice"],a:1,why:"Enablers build runway, infrastructure, compliance or knowledge needed by features."},
    {q:"Where should most stories be written?",o:["By the principal architect","By the team with its product owner","By the chief data officer","By the vendor"],a:1,why:"Teams that shape their own stories understand and own them."},
    {q:"Which feature name is better?",o:["Policy engine integration","Policy-based automatic approval","Backend changes for access","Phase 2"],a:1,why:"Name features by the benefit to users, not by the component."},
    {q:"How should an access-decision retention requirement appear in the backlog?",o:["A comment in a meeting","As acceptance criteria and, if work is needed, an enabler","Only in the architecture document","Left to audit"],a:1,why:"Controls that are not in the backlog are not planned, built or tested."}],
  lab:{type:"builder", title:"Write an epic and its first feature",
    brief:"Draft the epic hypothesis for a real initiative (or use Northbank). Then draft one feature. The preview assembles your text in standard form.",
    fields:[["for","For (users)","Risk, finance and analytics teams at Northbank"],["who","who (need)","need trusted data for reporting and models without waiting weeks"],["sol","the (solution)","governed self-service data access platform"],["cat","is a (category)","catalogue with policy-based access to data products"],["ben","that (key benefit)","grants standard access within an hour and records every decision as evidence"],["alt","Unlike (current alternative)","ticket-based requests that take 15 days and lead teams to copy data"],["diff","our solution (differentiator)","approves standard requests automatically against policy and masks restricted fields by default"],["out","Business outcomes","Access lead time 15 days → 1. Uncontrolled restricted-data copies down 50%. Steward review time down 70%."],["lead","Leading indicators","Share of requests auto-approved; catalogue searches that end in a request; time in owner review"],["nfr","NFRs and controls","Policy decision under 200 ms; access decisions retained 7 years; restricted data masked by default; quarterly recertification"],["fname","Feature name","Policy-based automatic approval"],["fhyp","Feature benefit hypothesis","We believe automatic approval will clear 70% of access requests without human review"],["fac","Feature acceptance criteria","Requests for internal data from entitled roles are approved within one minute. Restricted-data requests reach the data owner with context attached. Every decision has an audit record."]],
    template:v=>`EPIC\nFor ${v.for||"…"} who ${v.who||"…"},\nthe ${v.sol||"…"} is a ${v.cat||"…"}\nthat ${v.ben||"…"}.\nUnlike ${v.alt||"…"}, our solution ${v.diff||"…"}.\n\nBusiness outcomes: ${v.out||"…"}\nLeading indicators: ${v.lead||"…"}\nNFRs and controls: ${v.nfr||"…"}\n\nFEATURE: ${v.fname||"…"}\nBenefit hypothesis: ${v.fhyp||"…"}\nAcceptance criteria: ${v.fac||"…"}`,
    check:["Outcomes have baselines and targets","Leading indicators are visible within weeks","NFRs include at least one data control","Feature name states a benefit, not a component","Feature acceptance criteria are observable, not tasks"]},
  project:{title:"Shape a real epic with a team", deliver:"An epic, its features and enablers, and three exemplar stories written with a platform team.", steps:["Write the epic hypothesis and MVP definition","Break it into features and enabler features","Map NFRs, data service levels and controls to Definition of Done, enablers or acceptance criteria","Workshop one feature with the team and product owner; they write the stories","Check traceability: every story links to a feature and the epic","Agree the stop or pivot criteria with the epic owner"],
    rubric:["Epic is framed as a hypothesis with measurable outcomes","Enablers are explicit and justified","Controls appear as acceptance criteria","The team wrote the stories","Traceability is visible in the backlog tool"]}
},
{ id:"m5", lvl:"p", title:"Decisions, trade-offs and governance", time:"90 min",
  summary:"Make good architecture decisions at the right speed, record them, and build governance that guides rather than blocks.",
  objectives:["Classify decisions by reversibility and blast radius","Write quality attribute scenarios and a weighted trade-off analysis","Record ADRs and define fitness functions","Design governance with guardrails, paved roads and expiring exceptions"],
  learn:`
<h3>Decisions are the unit of architecture</h3>
<p>Separate <b>one-way doors</b> (hard to reverse: data ownership, canonical storage format, the policy model, vendor lock-in) from <b>two-way doors</b> (easy to reverse: a library, a dashboard tool, an internal API shape). Spend analysis on one-way doors. Push two-way doors to teams with guardrails. In data platforms, anything that consumers build on, such as a schema or a data product contract, quickly becomes a one-way door.</p>
<h3>Quality attribute scenarios</h3>
<p>Vague goals like "real-time" or "highly available" cannot be designed or tested. Write scenarios: <b>source, stimulus, environment, artefact, response, measure</b>. Example: "When a ledger transaction commits (stimulus) during month-end peak (environment), the change reaches the risk data product (artefact) and is queryable (response) within 15 minutes for 99% of events (measure)."</p>
<h3>Trade-off analysis</h3>
<p>For significant decisions, list options (including "do nothing"), score them against weighted criteria, and look for <b>sensitivity points</b>: criteria where a small weight change flips the winner. That tells you what to discuss. ATAM formalises this with a utility tree of scenarios; a weighted matrix is the everyday version.</p>
<h3>Record and automate</h3>
<ul><li><b>ADRs</b>: context, decision, status, consequences. One per decision, in the repository.</li><li><b>Fitness functions</b> (from <i>Building Evolutionary Architectures</i>): automated checks that protect architectural characteristics. For data platforms: schema-compatibility checks in CI, freshness and volume monitors on every data product, policy-as-code that blocks unclassified datasets, a check that every pipeline emits lineage.</li></ul>
<h3>Governance that scales</h3>
<ul><li><b>Paved road</b>: a supported default (feed templates, standard connectors, data product scaffolding) that is the easiest way to be compliant.</li><li><b>Guardrails over gates</b>: automated checks catch most issues; humans review the exceptions.</li><li><b>Tiered review</b>: in-standard changes need only an ADR; reversible deviations get async review; irreversible ones go to a review forum with risk partners.</li><li><b>Exceptions expire</b>: every exception has an owner, a reason, and an end date.</li><li><b>Tech debt register</b>: impact and "interest rate" per item, with capacity reserved each increment. Legacy ETL is debt with a very visible interest rate: failed batches and late reports.</li></ul>
<h3>Regulated-firm specifics</h3>
<p>Expect controls on data classification and handling, privacy, data residency, records retention, access certification, third-party risk, model risk for analytics and AI, and resilience. For risk data, the Basel Committee's BCBS 239 principles set expectations for accuracy, completeness, timeliness and lineage of risk data aggregation. Bring the data risk partner in at the option stage, not after the decision.</p>`,
  examples:[{kind:"diagram", title:"Tiered architecture governance", code:D.gov, caption:"Most decisions never reach a committee.", notice:["The fast path is the default.","Exceptions are time-boxed, so they come back for review."]}],
  quiz:[
    {q:"Which is a one-way door?",o:["Choosing a logging library","Choosing the canonical storage format that every data product will use","Renaming an internal endpoint","Changing a dashboard tool"],a:1,why:"A shared format becomes a dependency for every consumer and is costly to reverse."},
    {q:"Which part of a quality attribute scenario makes it testable?",o:["Source","Stimulus","Response measure","Artefact"],a:2,why:"A measurable response, such as 'within 15 minutes for 99% of events', is what you design and test against."},
    {q:"Which is a fitness function for a data platform?",o:["A quarterly architecture review","A CI check that rejects schema changes that break existing consumers","A wiki page of standards","A KPI for architects"],a:1,why:"It turns architecture intent into something the pipeline verifies automatically."},
    {q:"What makes exception processes healthy?",o:["Permanent approvals","Owner, reason and expiry date","No documentation","Only verbal approval"],a:1,why:"Expiry forces review and stops exceptions becoming hidden standards."},
    {q:"When should the data risk partner join a significant design decision?",o:["After go-live","When options are being formed","Only if audit asks","Never"],a:1,why:"Early involvement shapes options; late involvement only blocks them."}],
  lab:{type:"matrix", title:"Weighted trade-off: data access governance platform",
    brief:"Northbank must choose how to deliver catalogue, access requests and policy enforcement. Adjust the weights and scores (1 = poor, 5 = strong) to match your judgement. Watch whether the winner changes. Any criterion where small changes flip the result is a sensitivity point worth discussing.",
    options:["Build in-house","Vendor A (SaaS)","Vendor B (self-hosted)"],
    criteria:[["Time to value",3,[1,5,3]],["Control fit and auditability",5,[4,4,5]],["5-year total cost",3,[2,4,3]],["Integration with existing entitlements",2,[4,3,3]],["Vendor and concentration risk",3,[5,2,3]],["Fit with our data and policy model",2,[5,3,3]]]},
  project:{title:"Two ADRs and a fitness function", deliver:"Two ADRs for real decisions in your platforms, and one fitness function running in CI or monitoring.", steps:["Pick one one-way-door decision and one two-way-door decision","For the one-way door, write quality attribute scenarios and a weighted option analysis","Write both ADRs; link each to the diagrams it changes","Involve the data risk or security partner on the one-way door","Pick one architectural characteristic (freshness, schema compatibility, lineage coverage) and automate a check for it","Publish a one-page governance tier description for your domain"],
    rubric:["Options include do-nothing","Scenarios have measurable responses","ADRs state consequences, including negatives","Fitness function runs automatically","Governance tiers make the fast path the default"]}
},
{ id:"m6", lvl:"p", title:"Partnering with delivery", time:"75 min",
  summary:"Work with product owners and platform teams so architecture accelerates delivery: planning, runway, dependencies, capacity and migration.",
  objectives:["Play the architect's part in PI planning","Plan architectural runway and enabler capacity","Clarify decision ownership with product and teams","Plan migrations and decommissioning so they actually finish"],
  learn:`
<h3>Your part in PI planning</h3>
<ul><li><b>Before:</b> publish the architecture vision for the increment, the runway status, and the enabler features. Pre-wire dependencies on source application teams; they plan on their own cadence.</li><li><b>Day 1:</b> a short architecture briefing: what is changing, which constraints apply, which enablers teams must plan.</li><li><b>Breakouts:</b> walk the floor. Answer design questions, spot dependency conflicts, and help teams make trade-offs.</li><li><b>Risks:</b> facilitate ROAM (Resolved, Owned, Accepted, Mitigated) for architectural risks.</li><li><b>After:</b> track enabler progress and runway consumption.</li></ul>
<h3>Architectural runway</h3>
<p>Runway is the existing code, components and infrastructure needed to deliver upcoming features without excessive redesign. Features consume runway; enablers extend it. Agree a capacity allocation with product management, often 15–30% of capacity for enablers and debt. Make it visible so it does not get traded away silently.</p>
<h3>Migrations that finish</h3>
<p>Data platform programmes rarely fail at building the new thing. They fail at moving consumers off the old thing. Plan migration as product work:</p>
<ul><li><b>Inventory the consumers</b> of every legacy feed before you plan; usage logs beat spreadsheets.</li><li><b>Parallel run and reconcile</b> with agreed tolerances, so consumers trust the new feed.</li><li><b>Migrate by consumer wave,</b> starting with willing, low-risk teams who become references.</li><li><b>Set a switch-off date</b> per legacy job, agreed with its consumers, and celebrate decommissioning.</li><li><b>Track retirement as an outcome</b> (jobs switched off, run cost removed), not migration activity.</li></ul>
<h3>Who decides what</h3>
<div class="tbl"><table><thead><tr><th>Decision</th><th>Usually leads</th></tr></thead><tbody>
<tr><td>Which consumer need to serve next, feature priority</td><td>Product</td></tr>
<tr><td>Data product boundaries, integration patterns, shared platforms</td><td>Architect</td></tr>
<tr><td>Story splitting, estimates, implementation within standards</td><td>Team</td></tr>
<tr><td>Trading an enabler for a feature, build versus buy</td><td>Joint, with clear escalation</td></tr>
</tbody></table></div>
<h3>Be an accelerator, not a gate</h3>
<ul><li>Office hours twice a week beat a monthly review board.</li><li>Pair with teams on the first use of a new pattern, such as the first CDC feed; then step back.</li><li>Publish reference implementations and templates.</li><li>Review designs asynchronously with a clear turnaround time.</li></ul>
<p>Warning signs you are a bottleneck: teams wait for you; decisions happen only in meetings you attend; teams describe architecture as "approval".</p>
<h3>Metrics</h3>
<p>DORA and flow metrics show how well the delivery system works; Module 9 covers them in depth. Use them to find constraints, not to rank teams.</p>`,
  examples:[{kind:"ba", title:"Briefing teams at PI planning", before:"Architecture update: we are moving to streaming. Please use the new platform for new feeds. Talk to me if you have questions. Also remember data classification standards.", after:"Three things change this increment:\n1. Ledger changes move to change data capture. Enabler EN-12 (CDC connector) lands in iteration 2. Teams A and C: plan consumers from iteration 3; parallel run with the batch feed until reconciliation passes.\n2. New data products use the data product template v2. Classification tags are mandatory and the pipeline checks them.\n3. Access decisions must be retained 7 years. Acceptance criterion added to F-31 and F-33.\nOffice hours: Tue and Thu 10:00. Async design review: 2-day turnaround.", notice:["The 'after' version names enablers, dates and teams.","It builds parallel running into the plan rather than leaving it to chance.","It tells teams how to get help without waiting."]}],
  quiz:[
    {q:"What extends architectural runway?",o:["Features","Enablers","Retrospectives","Status reports"],a:1,why:"Features consume runway; enablers build it."},
    {q:"In ROAM, 'Owned' means…",o:["The risk is gone","Someone has taken responsibility to manage it","It was accepted as is","It is reduced"],a:1,why:"Resolved, Owned, Accepted, Mitigated."},
    {q:"Why do data platform programmes often stall at 80% migrated?",o:["The new platform is never finished","Consumers are not inventoried, reconciliation is not planned and nobody owns switch-off dates","Too much testing","Teams are too small"],a:1,why:"Migration and decommissioning must be planned as product work with consumers."},
    {q:"Which is a sign you are a bottleneck?",o:["Teams ship without asking you","Decisions only happen in meetings you attend","ADRs are written by teams","Teams use the paved road"],a:1,why:"Push reversible decisions down and make guidance available without you."},
    {q:"How should you measure a legacy ETL migration?",o:["Jobs rewritten","Legacy jobs switched off and run cost removed","Lines of code","Meetings held"],a:1,why:"Retirement is the outcome; rewriting is activity."}],
  lab:{type:"sort", title:"Who leads this decision?",
    brief:"For each decision on the Trusted Data programme, pick who should lead it.",
    buckets:["Architect","Product","Team","Joint"],
    items:[
      ["Whether source systems publish changes as events or as nightly extracts","Architect","A cross-domain integration pattern; the architect leads with source teams' input."],
      ["Which consumer group gets self-service access first","Product","Product owns priority, informed by architecture and risk."],
      ["How to split a data product feature into stories","Team","Teams own delivery shape with their product owner."],
      ["Which test framework the team uses for pipelines within standards","Team","Inside the paved road, teams choose."],
      ["Whether to defer the lineage enabler to ship the catalogue earlier","Joint","A trade between value and runway. Decide together, with escalation if needed."],
      ["Which domain owns the customer reference data product","Architect","A one-way-door boundary decision. The architect leads with data owners."],
      ["Which analytics pain point to tackle next quarter","Product","Product leads, with architecture input on feasibility."],
      ["Whether the data catalogue is built or bought","Joint","Architecture, product, procurement and risk all have a stake."],
      ["Estimates for stories","Team","The people doing the work estimate it."],
      ["The retention period for access-decision records","Joint","Set with risk and compliance; the architect ensures it is designed in."]]},
  project:{title:"Run an architecture sync with one team", deliver:"A runway view, a capacity agreement, a migration plan for one legacy feed, and a 30-day experiment in how you support delivery.", steps:["Publish the runway: enablers done, in flight, needed for the next increment","Agree an enabler and debt capacity allocation with the product owner","Pick one legacy feed: inventory its consumers, agree reconciliation tolerances and a switch-off date","Write a short decision-ownership table for the team","Start office hours and async reviews with a turnaround promise","After 30 days, ask the team what helped and what slowed them"],
    rubric:["Runway is visible to the team and product","Capacity allocation is explicit","The legacy feed has named consumers and a switch-off date","Decision ownership is written down","You collected feedback from the team"]}
},
{ id:"m7", lvl:"p", title:"Leading without authority", time:"90 min",
  summary:"Influence data owners, source teams, executives and engineers who do not report to you. Develop the engineers who rely on you.",
  objectives:["Use the main sources of influence deliberately","Facilitate decisions with DACI and disagree-and-commit","Write documents that lead: one-pagers and RFCs","Mentor, coach, sponsor and delegate on purpose"],
  learn:`
<h3>Why influence matters more in data</h3>
<p>Data platforms depend on people you do not manage: source application teams who must publish changes, data owners who approve access, stewards who define quality, and consumers who must migrate. Few of them have your programme in their own goals. Influence is how the work gets done.</p>
<h3>Sources of influence</h3>
<ul><li><b>Expertise:</b> you are right often, and you show your reasoning.</li><li><b>Relationships:</b> people trust you before they need you.</li><li><b>Track record:</b> your past calls worked out, or you owned them when they did not.</li><li><b>Clarity:</b> you make complex things simple to act on.</li><li><b>Reciprocity:</b> you solve their problem too. A source team that publishes once through CDC also stops maintaining forty extracts.</li><li><b>Position:</b> the ED title opens doors. Use it sparingly; borrowed authority wears out.</li></ul>
<h3>Facilitating decisions</h3>
<p>DACI names a <b>Driver</b> (runs the process), one <b>Approver</b>, <b>Contributors</b> (consulted), and <b>Informed</b> people. Many stuck decisions have no approver or three of them. Agree the criteria before debating options. Once decided, expect <b>disagree and commit</b>: dissent is recorded, then everyone executes. Record what would trigger a revisit.</p>
<h3>Pre-wiring</h3>
<p>Big decisions should not be surprises in the meeting. Walk key stakeholders through the proposal one-to-one first. You will learn objections early, and people support what they helped shape.</p>
<h3>Writing to lead</h3>
<p>Documents scale your thinking across time zones and teams. Use a one-pager for a proposal (problem, proposal, alternatives, risks, ask) and an RFC for designs that need wider review, with a comment deadline and a named decider. Module 13 goes deep on writing for senior leaders.</p>
<h3>Developing people</h3>
<div class="tbl"><table><thead><tr><th>Mode</th><th>What you do</th><th>When</th></tr></thead><tbody>
<tr><td>Mentoring</td><td>Share experience and advice</td><td>They face something you have done</td></tr>
<tr><td>Coaching</td><td>Ask questions so they find the answer</td><td>They can solve it with some reflection</td></tr>
<tr><td>Sponsoring</td><td>Put their name forward for stretch work</td><td>They are ready and need visibility</td></tr>
<tr><td>Delegating</td><td>Hand over a decision with clear boundaries</td><td>Always, at the right level</td></tr>
</tbody></table></div>
<p>Delegation has levels: tell, sell, consult, agree, advise, inquire, delegate. Say which level you mean. Module 12 applies this to contract engineers.</p>
<h3>Feedback</h3>
<p>Use SBI: <b>Situation</b>, <b>Behaviour</b>, <b>Impact</b>. "In Tuesday's design review (S), you presented three options with costs (B). The data owner decided in ten minutes (I)." Specific praise teaches as much as correction.</p>`,
  examples:[{kind:"ba", title:"Handing back a decision", before:"Engineer: Should the feed land as files or go through the streaming backbone?\nYou: Use streaming.", after:"Engineer: Should the feed land as files or go through the streaming backbone?\nYou: What would you pick, and why?\nEngineer: Streaming, because risk wants intraday data and files would mean another batch window.\nYou: Good reasoning. That's your call for this feed. Write a short ADR and share it in the channel. Ping me if it changes a contract other teams consume.", notice:["The engineer leaves with the decision, the reasoning and a boundary.","Next time, they are more likely to decide without asking."]}],
  quiz:[
    {q:"In DACI, how many approvers should a decision have?",o:["None","One","Two","Everyone affected"],a:1,why:"One accountable approver avoids deadlock."},
    {q:"What does 'pre-wiring' mean?",o:["Rehearsing slides","Walking key stakeholders through a proposal before the decision meeting","Wiring diagrams","Pre-approving budgets"],a:1,why:"It surfaces objections early and builds support."},
    {q:"A source application team has no reason in its own goals to adopt change data capture. Which source of influence helps most?",o:["Position: tell them to","Reciprocity: show how it removes their extract maintenance","Escalate to their director","Wait for a mandate"],a:1,why:"People move faster when the change solves their problem too."},
    {q:"SBI stands for…",o:["Status, budget, issues","Situation, behaviour, impact","Scope, benefit, investment","Standard, baseline, improvement"],a:1,why:"Specific, observable feedback is easier to hear and act on."},
    {q:"After disagreeing and committing, you should…",o:["Keep re-arguing","Execute fully, and record the trigger that would justify revisiting","Comply slowly","Escalate quietly"],a:1,why:"Full commitment keeps trust; a revisit trigger keeps learning possible."}],
  lab:{type:"scenario", title:"Four leadership situations",
    brief:"Choose how you would respond. Each option gets feedback.",
    scen:[
      {s:"Two senior engineers disagree about whether the risk data product should be served from the lakehouse or a separate low-latency store. The design review has stalled for 40 minutes.",o:[["Decide yourself on the spot to end the debate","ok","Fast, but it teaches the group to wait for you, and the losing side may not commit."],["Agree the criteria first (freshness, cost, query patterns), ask each to write one page against them, and set a decision date and approver","strong","Separates criteria from preference, gives both sides a fair hearing, and creates a record."],["Escalate to their director","weak","Unnecessary. You have the standing to facilitate this."],["Let them keep talking until someone gives in","weak","Burns time and goodwill; the decision will be fragile."]]},

{ id:"m8", lvl:"e", title:"Executive communication", time:"75 min",
  summary:"Brief executives clearly: answer first, honest status, options with consequences, and diagrams at the right altitude.",
  objectives:["Write with BLUF and the pyramid principle","Brief a decision: ask, options, recommendation, risks","Report status honestly with defined criteria","Say no, or 'yes, and here is the cost', without damaging relationships"],
  learn:`
<h3>Answer first</h3>
<p>Barbara Minto's pyramid principle: start with the answer, then group supporting arguments, then evidence. Military writing calls it <b>BLUF</b>, bottom line up front. Executives read the first two lines; make them count. Module 13 covers plain English and decks in depth; this module focuses on decisions and status.</p>
<blockquote>We recommend buying the data governance platform from Vendor A. It gets self-service access live five months sooner and meets our access-control audit criteria. Decision needed by 14 Nov to start in Q1.</blockquote>
<h3>SCQA for the opening</h3>
<p>Situation, Complication, Question, Answer. "Our analysts make about 300 data access requests a month (S). Each takes 15 days, so teams copy data into unmanaged stores (C). How do we cut access to a day without weakening control (Q)? Automate approval against policy and serve data as governed products (A)."</p>
<h3>Decision brief structure</h3>
<ol><li>The ask and deadline</li><li>Recommendation in one sentence</li><li>Why now: cost of delay</li><li>Options considered, including do nothing</li><li>Risks and mitigations, including control impacts</li><li>Cost, timeline and who is needed</li><li>Next step</li></ol>
<h3>Honest status</h3>
<p>Watermelon reporting (green outside, red inside) destroys trust when it bursts. Define RAG criteria in advance (for example, amber means a milestone is at risk but recoverable within the increment). Report the trend, the cause, and what you need. Bad news early is a gift.</p>
<h3>Diagrams at the right altitude</h3>
<p>Executives get context views and capability heat maps, not pipeline diagrams. Build complex views progressively. One message per slide, stated in its title. The <a href="${STUDIO}" target="_blank" rel="noopener">Diagramming Studio</a> covers C4 levels and presenting.</p>
<h3>Saying no well</h3>
<p>Prefer "yes, and here is what it costs" with options: "We can onboard that domain this increment if we defer F-34, or next increment with no impact." Make the trade-off visible and let the right person choose.</p>
<h3>Managing up</h3>
<p>Know your leader's priorities and pressures. Bring problems with options. Ask how they want updates. Never let them be surprised in front of their own leadership.</p>`,
  examples:[{kind:"ba", title:"A status update, rewritten", before:"Trusted Data programme status: Green.\nThis sprint the team completed 34 story points. CDC work is ongoing and we are working closely with the ledger team. Some challenges with test environments. Next sprint we will continue integration.", after:"Trusted Data programme: AMBER (was green). Intraday risk feed at risk by about 3 weeks.\nCause: the ledger team's test environment has no change log enabled, so CDC cannot be tested end to end.\nRecovery: ledger team commits to enable it by 8 Nov; we are testing against a replayed log in parallel.\nNeed from you: ask the ledger application owner to prioritise this week.\nIf recovered by 15 Nov, the Q1 date holds.", notice:["Status first, with trend and impact.","Cause, recovery plan, and a specific ask with a date.","Story points are gone; executives cannot act on them."]}],
  quiz:[
    {q:"BLUF means…",o:["Big list up front","Bottom line up front","Budget, leadership, users, features","Build less, use frameworks"],a:1,why:"Lead with the conclusion or ask."},
    {q:"Which belongs in the first sentence of a decision brief?",o:["Programme history","The ask and the recommendation","Team names","Technical detail"],a:1,why:"Executives decide quickly when the ask is clear."},
    {q:"'Watermelon' status means…",o:["Seasonal reporting","Green on the outside, red inside","Mixed RAG","Too detailed"],a:1,why:"Defined criteria and early bad news prevent it."},
    {q:"An executive asks to onboard an extra data domain mid-increment. Best response?",o:["No","Yes, silently","Yes, with the trade-off options and their costs","Escalate"],a:2,why:"Make the trade-off visible and let the accountable person choose."},
    {q:"Which diagram fits an executive investment briefing?",o:["Pipeline DAG","Class diagram","Capability heat map or context view","Sequence diagram"],a:2,why:"Match the altitude to the decision being made."}],
  lab:{type:"builder", title:"Write a one-page decision memo",
    brief:"Draft a memo for a real decision you need from an executive (or use the Northbank example). The preview shows it in BLUF order.",
    fields:[["to","To","Chief Data Officer; CIO"],["ask","Decision needed and by when","Approve buying the data governance platform from Vendor A, by 14 Nov, to start in Q1"],["rec","Recommendation (one sentence)","Buy from Vendor A: five months faster than building, meets access-control audit criteria, lower 5-year cost"],["why","Why now (cost of delay)","Each month of delay keeps access at 15 days and adds about 40 unmanaged data copies"],["opts","Options considered","1) Build in-house: 11 months, highest fit. 2) Vendor A SaaS: 6 months, recommended. 3) Vendor B self-hosted: 9 months. 4) Do nothing: ticket-based access continues"],["risk","Risks and mitigations","Vendor concentration: policies kept in an open format we own, exit clause. Third-party risk review: started, due 7 Nov. Data residency: metadata only leaves our network; data stays in place"],["cost","Cost, timeline, people","$1.4M over 3 years; integration 6 months with two teams; one data risk analyst part-time"],["next","Next step","On approval, sign the contract and start third-party onboarding on 15 Nov"]],
    template:v=>`TO: ${v.to||"…"}\nRE: ${v.ask||"…"}\n\nRECOMMENDATION\n${v.rec||"…"}\n\nWHY NOW\n${v.why||"…"}\n\nOPTIONS CONSIDERED\n${v.opts||"…"}\n\nRISKS AND MITIGATIONS\n${v.risk||"…"}\n\nCOST, TIMELINE, PEOPLE\n${v.cost||"…"}\n\nNEXT STEP\n${v.next||"…"}`,
    check:["The ask and deadline are in the first line","Recommendation fits one sentence","Do-nothing is among the options","Risks include control or regulatory impacts","It fits on one page"]},
  project:{title:"Brief a real decision", deliver:"A decision memo and a 10-minute briefing for a real executive decision.", steps:["Pick a decision that needs executive approval in the next month","Write the memo in BLUF order","Pre-wire with two stakeholders","Prepare two diagrams at executive altitude","Deliver the briefing; capture questions you did not anticipate","Ask your sponsor for one piece of feedback"],
    rubric:["First two lines carry the ask and recommendation","Options include do-nothing","Diagrams match the audience","A decision was made or a clear next step agreed","You recorded feedback and what you will change"]}

{ id:"m9", lvl:"e", title:"Operating at executive director level", time:"90 min",
  summary:"Stakeholders, portfolio and funding, data risk partnership, operating rhythm, and building an architecture practice that outlasts you.",
  objectives:["Map stakeholders by power and interest and set a cadence","Prioritise with cost of delay and WSJF","Work with the three lines of defence, audit and data governance","Set an operating rhythm and measure your own impact"],
  learn:`
<h3>Stakeholders</h3>
<p>Map stakeholders on <b>power</b> and <b>interest</b>. Manage high-power, high-interest people closely; keep high-power, low-interest people satisfied with brief updates; keep high-interest, low-power people informed; monitor the rest. Revisit the map each quarter. In a chief data office, data owners in the business, the privacy office, information security, internal audit and the heads of regulatory reporting often have more power over your outcomes than their org-chart position suggests.</p>
<h3>Portfolio and funding</h3>
<ul><li><b>Lean portfolio management</b> funds value streams or platforms rather than projects, with guardrails on spend and regular review.</li><li><b>Cost of delay</b>: what we lose each week this is not done. It turns arguments about priority into arguments about value.</li><li><b>WSJF</b> (weighted shortest job first) = (business value + time criticality + risk reduction or opportunity enablement) ÷ job size. Use relative scores; the conversation matters more than the number.</li><li><b>Run versus change</b>: know the cost to run what you have. Every legacy ETL job you switch off frees budget and reduces risk.</li><li><b>Build, buy, partner</b>: total cost of ownership over 5 years, exit costs, concentration risk.</li></ul>
<h3>Risk partnership</h3>
<p>The <b>three lines</b> model: the first line (business and technology, including you) owns and manages risk; the second line (data risk, privacy, security, compliance) sets frameworks and challenges; the third line (internal audit) gives independent assurance to the board, and regulators examine it all. Architects strengthen the first line by designing controls into the platforms: classification, policy-based access, lineage, retention. Treat audit findings as design input, and close them with evidence, not promises.</p>
<h3>Working with data governance</h3>
<p>The CDO's governance function defines policies, data ownership and quality standards. Your platforms make them executable. The best relationship is a partnership where policies are written so they can be enforced as code, and the platform reports compliance automatically. Attend the governance council as the voice of what is buildable.</p>
<h3>Operating rhythm</h3>
<div class="tbl"><table><thead><tr><th>Cadence</th><th>Activity</th></tr></thead><tbody>
<tr><td>Weekly</td><td>Office hours; architecture decisions review; 1:1s with key engineers; product sync</td></tr>
<tr><td>Fortnightly</td><td>Data owner and consumer check-ins; risk partner sync</td></tr>
<tr><td>Monthly</td><td>Runway, debt and migration review; architecture community of practice; health scorecard</td></tr>
<tr><td>Quarterly</td><td>Roadmap refresh; PI planning; capability heat-map update; governance council; impact narrative to leadership</td></tr>
</tbody></table></div>
<h3>Measuring your impact</h3>
<p>At this level your work shows up in others' results. Track: outcomes your decisions enabled; decisions made and their time to decision; teams unblocked; risks and findings retired; legacy decommissioned; people grown and promoted; standards and platforms adopted. Write a short quarterly impact narrative; it also prepares you for performance conversations.</p>
<h3>Building the practice</h3>
<p>Leave behind more than decisions: a community of practice, reference architectures, a principles set, templates, and successors who can do your job. That is the clearest sign of executive-level impact.</p>`,
  examples:[{kind:"diagram", title:"Three lines model, and where you sit", code:D.lod, caption:"Architects are first line: they own the risk their platform designs create.", notice:["Controls designed in by the first line are cheaper than controls added after a finding.","The second line challenges; it does not design your solution."]}],
  quiz:[
    {q:"WSJF divides cost of delay by…",o:["Team size","Job size","Budget","Risk"],a:1,why:"Small, valuable, urgent jobs go first."},
    {q:"In the three lines model, platform architects are usually in…",o:["First line","Second line","Third line","None"],a:0,why:"Technology teams own and manage the risks their systems create."},
    {q:"A high-power, low-interest stakeholder should be…",o:["Ignored","Kept satisfied with brief, relevant updates","Managed in weekly detail","Removed from the map"],a:1,why:"Avoid surprises without burdening them."},
    {q:"What is the most useful relationship between data governance policy and your platforms?",o:["Policies live in documents; platforms ignore them","Policies are written so they can be enforced as code, and platforms report compliance","Governance approves every pipeline","Platforms set policy"],a:1,why:"Executable policy turns governance from review into automation."},
    {q:"Which is the strongest evidence of executive-level impact?",o:["Hours worked","Number of meetings","Outcomes enabled and people who can now do what you do","Slides produced"],a:2,why:"Impact shows in results and in capability you built in others."}],

    brief:"Five Trusted Data candidates compete for the next increment. Score each 1, 2, 3, 5, 8, 13 or 20 relative to the others. Job size uses the same scale. The table ranks by WSJF as you type.",
