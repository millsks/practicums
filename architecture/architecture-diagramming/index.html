<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Architecture Diagramming Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a drafting-office set of "sheets" — each module is a drawing sheet with an engineering title block; diagrams sit on light canvas paper in both themes. */
:root{
  --paper:#EEF2F1; --sheet:#FFFFFF; --ink:#172125; --muted:#56656C; --rule:#D3DCDA; --rule-strong:#A9B7B6;
  --accent:#0A6A7E; --accent-ink:#FFFFFF; --accent-soft:#DDEDEF;
  --redline:#C2331F; --redline-soft:#FBE7E3; --ok:#23744A; --ok-soft:#DFF1E6; --warn:#9A6512; --warn-soft:#FAEFD9;
  --canvas:#FBFCFB; --canvas-dot:#D8E0DF; --canvas-ink:#172125;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1517; --sheet:#152024; --ink:#E2EAEB; --muted:#93A5AA; --rule:#27363A; --rule-strong:#3D5257;
  --accent:#55B9CC; --accent-ink:#06262D; --accent-soft:#12343B;
  --redline:#F0765D; --redline-soft:#3A1D17; --ok:#62C792; --ok-soft:#143424; --warn:#E2B556; --warn-soft:#352A12;
  --canvas:#E8EDEC; --canvas-dot:#C9D3D2; --canvas-ink:#172125; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1517; --sheet:#152024; --ink:#E2EAEB; --muted:#93A5AA; --rule:#27363A; --rule-strong:#3D5257;
  --accent:#55B9CC; --accent-ink:#06262D; --accent-soft:#12343B;
  --redline:#F0765D; --redline-soft:#3A1D17; --ok:#62C792; --ok-soft:#143424; --warn:#E2B556; --warn-soft:#352A12;
  --canvas:#E8EDEC; --canvas-dot:#C9D3D2; --canvas-ink:#172125; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.1;text-wrap:balance;margin:0;letter-spacing:.005em}
h1{font-size:clamp(2.4rem,7vw,4rem);font-weight:700}
h2{font-size:clamp(1.7rem,4.5vw,2.3rem)}
h3{font-size:1.45rem;margin-top:.4rem}
h4{font-size:1.15rem}
p{margin:0}
code,kbd,pre{font-family:var(--f-mono);font-size:.86em}
:not(pre)>code{background:var(--accent-soft);padding:.05em .35em;border-radius:3px}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:1rem}
.prose{display:flex;flex-direction:column;gap:.85rem;max-width:68ch}
.prose ul,.prose ol{margin:0;padding-left:1.25rem;display:flex;flex-direction:column;gap:.35rem}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;flex-direction:column;gap:.35rem;padding-block:.6rem .5rem}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:1rem}
.brand b{font-family:var(--f-display);font-size:1.25rem;font-weight:700;letter-spacing:.02em}
.brand .meter{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.navscroll{overflow-x:auto;scrollbar-width:none;margin-inline:-4px}
.navscroll::-webkit-scrollbar{display:none}
nav.tabs{display:flex;gap:4px;padding:2px 4px;width:max-content}
nav.tabs button{font:600 .82rem/1 var(--f-body);color:var(--muted);background:none;border:1px solid transparent;border-radius:999px;padding:.5rem .75rem;cursor:pointer;white-space:nowrap;display:flex;gap:.4rem;align-items:center}
nav.tabs button:hover{color:var(--ink);border-color:var(--rule)}
nav.tabs button[aria-current="true"]{background:var(--ink);color:var(--sheet)}
nav.tabs .dot{width:7px;height:7px;border-radius:50%;background:var(--rule-strong)}
nav.tabs .dot.ok{background:var(--ok)}
nav.tabs button[aria-current="true"] .dot.ok{background:var(--ok)}
nav.tabs .sep{width:1px;background:var(--rule);margin:4px 2px}

main{padding-block:1.5rem 4rem}

/* sheets */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:clamp(16px,3.5vw,32px)}
.section{display:flex;flex-direction:column;gap:1.1rem}
.section+.section{margin-top:2.2rem;padding-top:2rem;border-top:1px dashed var(--rule-strong)}
.sec-head{display:flex;align-items:baseline;gap:.75rem;flex-wrap:wrap}
.sec-head .tag{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);padding:.1rem .45rem;border-radius:3px}

/* engineering title block */
.titleblock{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:2px solid var(--ink);margin-top:1.25rem}
.titleblock>div{border-right:1px solid var(--ink);border-top:1px solid var(--ink);padding:.4rem .6rem;min-width:0}
.titleblock>div:nth-child(4n){border-right:0}
.titleblock>div:nth-child(-n+4){border-top:0}
.titleblock .k{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:block}
.titleblock .v{font-family:var(--f-display);font-weight:600;font-size:1.05rem;font-variant-numeric:tabular-nums}
@media (max-width:560px){.titleblock{grid-template-columns:repeat(2,minmax(0,1fr))}
 .titleblock>div:nth-child(4n){border-right:1px solid var(--ink)}
 .titleblock>div:nth-child(2n){border-right:0}
 .titleblock>div:nth-child(-n+4){border-top:1px solid var(--ink)}
 .titleblock>div:nth-child(-n+2){border-top:0}}

/* level pills */
.lvl{display:inline-flex;align-items:center;gap:.35rem;font:600 .72rem/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:.3rem .5rem;border-radius:3px;border:1px solid currentColor}
.lvl.a{color:var(--ok)} .lvl.p{color:var(--warn)} .lvl.x{color:var(--redline)}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:.6rem .75rem;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--paper);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td code{white-space:nowrap}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:.85rem}

/* diagram canvas */
.fig{display:flex;flex-direction:column;gap:.6rem;min-width:0}
.canvas{background-color:var(--canvas);background-image:radial-gradient(var(--canvas-dot) 1px,transparent 1.2px);background-size:16px 16px;border:1px solid var(--rule-strong);border-radius:var(--r);overflow:auto;padding:16px;min-height:140px;color:var(--canvas-ink);display:flex;align-items:flex-start;justify-content:center}
.canvas svg{height:auto}
.canvas .loading{font-family:var(--f-mono);font-size:.8rem;color:#56656C;align-self:center}
.canvas .err{font-family:var(--f-mono);font-size:.78rem;color:#B12A16;white-space:pre-wrap;align-self:stretch;width:100%}
.figcap{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:baseline;justify-content:space-between}
.figcap h4{font-size:1.1rem}
.notice{background:var(--paper);border-left:3px solid var(--accent);padding:.6rem .85rem;border-radius:0 var(--r) var(--r) 0;font-size:.93rem}
.notice ul{margin:.25rem 0 0;padding-left:1.1rem;display:flex;flex-direction:column;gap:.2rem}
pre.src{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:.85rem 1rem;overflow-x:auto;margin:0;line-height:1.5;font-size:.8rem}

/* buttons */
.btns{display:flex;flex-wrap:wrap;gap:.5rem}
.btn{font:600 .85rem/1 var(--f-body);border:1px solid var(--rule-strong);background:var(--sheet);color:var(--ink);padding:.6rem .9rem;border-radius:var(--r);cursor:pointer;display:inline-flex;align-items:center;gap:.4rem}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;padding-inline:.4rem;color:var(--accent)}
.btn.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(1rem,4vw,2.5rem);align-items:start}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero p.lede{font-size:1.1rem;max-width:52ch;margin-top:.8rem}
.zoom{display:flex;flex-direction:column;gap:.6rem;min-width:0}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--ink);border-radius:var(--r);overflow:hidden}
.seg button{font:600 .8rem/1.15 var(--f-body);background:var(--sheet);color:var(--ink);border:0;border-right:1px solid var(--ink);padding:.55rem .3rem;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button small{display:block;font:500 .66rem/1 var(--f-mono);letter-spacing:.08em;color:var(--muted);margin-bottom:.2rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.seg button[aria-pressed="true"] small{color:var(--sheet);opacity:.75}
.zoom .canvas{height:340px}
.zoom-meta{display:grid;grid-template-columns:1fr 1fr;gap:.5rem 1rem;font-size:.9rem}
.zoom-meta .k{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block}

/* path */
.path{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
@media (max-width:760px){.path{grid-template-columns:minmax(0,1fr)}}
.stage{border:1px solid var(--rule);border-radius:var(--r);padding:1rem;display:flex;flex-direction:column;gap:.5rem;background:var(--sheet)}
.stage ol{margin:0;padding-left:1.1rem;font-size:.92rem}
.bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .4s}
.reg td:first-child{font-family:var(--f-mono);font-size:.8rem;white-space:nowrap}
.reg button.link{background:none;border:0;padding:0;color:var(--ink);font:600 .95rem var(--f-body);cursor:pointer;text-align:left}
.reg button.link:hover{color:var(--accent);text-decoration:underline}
.chk{font-family:var(--f-mono);font-size:.8rem}
.chk.ok{color:var(--ok)} .chk.no{color:var(--rule-strong)}

/* quiz */
.q{border:1px solid var(--rule);border-radius:var(--r);padding:1rem;display:flex;flex-direction:column;gap:.6rem}
.q .qn{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.08em}
.q .qt{font-weight:600}
.opt{display:flex;gap:.6rem;align-items:flex-start;padding:.5rem .6rem;border:1px solid var(--rule);border-radius:var(--r);cursor:pointer;font-size:.95rem}
.opt:hover{border-color:var(--rule-strong)}
.opt input{margin-top:.3rem;accent-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--redline);background:var(--redline-soft)}
.why{font-size:.9rem;padding:.6rem .8rem;border-radius:var(--r);background:var(--paper)}
.score{font-family:var(--f-display);font-size:1.4rem;font-weight:600}

/* lab */
.lab{display:flex;flex-direction:column;gap:1rem}
.brief{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem}
@media (max-width:760px){.brief{grid-template-columns:minmax(0,1fr)}}
.reqs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.35rem}
.reqs label{display:flex;gap:.55rem;align-items:flex-start;font-size:.93rem;cursor:pointer}
.reqs input{margin-top:.32rem;accent-color:var(--ok)}
.editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:.75rem}
@media (max-width:820px){.editor{grid-template-columns:minmax(0,1fr)}}
.editor textarea{width:100%;min-height:320px;resize:vertical;font:400 .8rem/1.55 var(--f-mono);background:var(--paper);color:var(--ink);border:1px solid var(--rule-strong);border-radius:var(--r);padding:.8rem;tab-size:2}
.editor .canvas{min-height:320px}
.edhead{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
.status{font-family:var(--f-mono);font-size:.72rem}
.status.ok{color:var(--ok)} .status.bad{color:var(--redline)}
details.reveal{border:1px solid var(--rule);border-radius:var(--r);padding:.6rem .85rem}
details.reveal summary{cursor:pointer;font-weight:600;font-size:.92rem}
details.reveal[open] summary{margin-bottom:.6rem}
.steps{margin:0;padding-left:1.3rem;display:flex;flex-direction:column;gap:.55rem}
.steps li::marker{font-family:var(--f-mono);color:var(--accent);font-weight:600}

/* redline */
.redline .canvas{border-color:var(--redline);border-style:dashed}
.rl-item.found{color:var(--ok)}
.rl-item.missed{color:var(--redline)}
.rl-item.false{color:var(--warn)}

/* cards grid */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.cap{border:1px solid var(--rule);border-radius:var(--r);padding:clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:1rem;background:var(--sheet)}
.cap-head{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:flex-start}
.domain{font:600 .7rem/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.meterline{display:flex;align-items:center;gap:.6rem;font-family:var(--f-mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.meterline .bar{flex:1;min-width:80px}

/* picker */
.picker{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem}
@media (max-width:760px){.picker{grid-template-columns:minmax(0,1fr)}}
.picker .qs{display:flex;flex-direction:column;gap:.35rem}
.picker .qs button{text-align:left;font:500 .92rem/1.35 var(--f-body);background:var(--sheet);color:var(--ink);border:1px solid var(--rule);border-radius:var(--r);padding:.6rem .75rem;cursor:pointer}
.picker .qs button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.answer{border:2px solid var(--ink);border-radius:var(--r);padding:1rem;display:flex;flex-direction:column;gap:.5rem;align-self:start;position:sticky;top:120px}
@media (max-width:760px){.answer{position:static}}
.answer .big{font-family:var(--f-display);font-size:1.7rem;font-weight:700;line-height:1.05}
.anti{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.75rem}
.anti>div{border:1px solid var(--rule);border-top:3px solid var(--redline);border-radius:var(--r);padding:.8rem;display:flex;flex-direction:column;gap:.3rem;font-size:.9rem}
.anti b{font-family:var(--f-display);font-size:1.15rem;font-weight:600}
.anti .fix{color:var(--ok)}
dl.gloss{display:grid;grid-template-columns:minmax(120px,max-content) minmax(0,1fr);gap:.5rem 1.2rem;margin:0}
dl.gloss dt{font-weight:700}
dl.gloss dd{margin:0}
@media (max-width:560px){dl.gloss{grid-template-columns:minmax(0,1fr)} dl.gloss dd{margin-bottom:.4rem}}
.toc{display:flex;flex-wrap:wrap;gap:.4rem}
.toc a{font:600 .8rem/1 var(--f-body);text-decoration:none;border:1px solid var(--rule);padding:.45rem .65rem;border-radius:999px;color:var(--ink)}
.pager{display:flex;justify-content:space-between;gap:.75rem;flex-wrap:wrap;margin-top:1.5rem}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:.6rem 1rem;border-radius:var(--r);font-size:.88rem;z-index:50}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><b>Architecture Diagramming Studio</b><span class="meter" id="meter">0% complete</span></div>
    <div class="navscroll"><nav class="tabs" id="tabs" aria-label="Course sections"></nav></div>
  </div>
</header>
<main class="wrap" id="view" tabindex="-1"></main>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<script>
"use strict";
/* ---------- helpers ---------- */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const pre = s => `<pre class="src"><code>${esc(s.trim())}</code></pre>`;
const CODE = []; const reg = c => (CODE.push(c.trim()), CODE.length - 1);

/* ---------- shared diagrams (running example: "Parcel", an online order platform) ---------- */
const D = {};
D.ctx = `C4Context
  title System context: Parcel order platform
  Person(shopper, "Shopper", "Buys products and tracks deliveries")
  Person(ops, "Fulfilment staff", "Packs and ships orders")
  System(parcel, "Parcel", "Lets shoppers browse, order and track deliveries")
  System_Ext(pay, "Payment gateway", "Card authorisation and capture")
  System_Ext(carrier, "Carrier API", "Shipping labels and tracking")
  System_Ext(mail, "Email service", "Transactional email")
  Rel(shopper, parcel, "Places orders using", "HTTPS")
  Rel(ops, parcel, "Manages fulfilment using", "HTTPS")
  Rel(parcel, pay, "Takes payments via", "REST")
  Rel(parcel, carrier, "Books shipments via", "REST")
  Rel(parcel, mail, "Sends notifications via", "SMTP")
  UpdateLayoutConfig($c4ShapeInRow="3", $c4BoundaryInRow="1")`;
D.cont = `C4Container
  title Container view: Parcel
  Person(shopper, "Shopper")
  System_Ext(pay, "Payment gateway", "Card payments")
  System_Ext(carrier, "Carrier API", "Shipping")
  System_Boundary(b, "Parcel") {
    Container(web, "Storefront SPA", "React", "Catalogue, cart and checkout UI")
    Container(api, "Order API", "Python, Django", "Carts, orders, checkout")
    ContainerQueue(q, "Order events", "Kafka topic", "order.placed, order.shipped")
    Container(worker, "Fulfilment worker", "Python, Celery", "Books shipments, sends email")
    ContainerDb(db, "Orders DB", "PostgreSQL", "Orders, customers, stock")
  }
  Rel(shopper, web, "Uses", "HTTPS")
  Rel(web, api, "Calls", "JSON/HTTPS")
  Rel(api, db, "Reads and writes", "SQL")
  Rel(api, pay, "Authorises cards", "REST")
  Rel(api, q, "Publishes order.placed")
  Rel(worker, q, "Consumes events from")
  Rel(worker, carrier, "Books shipments", "REST")
  UpdateLayoutConfig($c4ShapeInRow="3", $c4BoundaryInRow="1")`;
D.comp = `C4Component
  title Component view: Order API
  Container(web, "Storefront SPA", "React")
  ContainerDb(db, "Orders DB", "PostgreSQL")
  System_Ext(pay, "Payment gateway")
  Container_Boundary(api, "Order API") {
    Component(ctrl, "Checkout view", "Django view", "Validates the cart, starts checkout")
    Component(svc, "Checkout service", "Python module", "Prices, reserves stock, takes payment")
    Component(repo, "Order repository", "Django ORM", "Persists orders")
    Component(paycl, "Payment client", "httpx", "Wraps the gateway API with retries")
    Component(pub, "Event publisher", "confluent-kafka", "Emits order events")
  }
  Rel(web, ctrl, "POST /checkout", "JSON/HTTPS")
  Rel(ctrl, svc, "Calls")
  Rel(svc, repo, "Uses")
  Rel(svc, paycl, "Uses")
  Rel(svc, pub, "Uses")
  Rel(repo, db, "Reads and writes", "SQL")
  Rel(paycl, pay, "Authorises", "REST")
  UpdateLayoutConfig($c4ShapeInRow="3", $c4BoundaryInRow="1")`;
D.code = `classDiagram
  direction LR
  class CheckoutService {
    +checkout(cart, token) Order
    -reserve_stock(lines)
  }
  class PaymentClient {
    +authorise(amount, token) AuthResult
  }
  class OrderRepository {
    +save(order)
    +get(order_id) Order
  }
  class Order {
    +id UUID
    +status OrderStatus
    +total Money
  }

{ id:"m1", dwg:"A-01", lvl:"a", title:"Why we diagram", time:"35 min",
  summary:"Diagrams answer questions for specific readers. Learn to pick the audience, the question, and the level of detail before you draw anything.",
  objectives:["Match a diagram to its audience and the question it answers","Explain levels of abstraction using the map analogy","Write a one-paragraph diagram brief before drawing"],
  learn:`
<h3>A diagram answers one question for one audience</h3>
<p>Architecture diagrams are communication tools. A good one lets a specific reader answer a specific question quickly: "What does this system depend on?", "What happens when a payment fails?", "What runs in which data centre?". When a diagram tries to answer every question at once, it answers none of them well.</p>
<div class="tbl"><table><thead><tr><th>Reader</th><th>What they ask</th><th>Usually show them</th></tr></thead><tbody>
<tr><td>Executives, product owners</td><td>What is it, who uses it, what does it touch, what is the risk?</td><td>System context, landscape</td></tr>
<tr><td>Architects, tech leads</td><td>What are the moving parts and how do they communicate?</td><td>Container view, dynamic views, ADRs</td></tr>
<tr><td>Developers</td><td>Where does my code go? What calls what, in what order?</td><td>Component view, sequence, state machine</td></tr>
<tr><td>SRE and operations</td><td>What runs where? What fails together? How do we recover?</td><td>Deployment view, network view</td></tr>
<tr><td>Security and risk</td><td>Where does sensitive data go? Where are the trust boundaries?</td><td>Data-flow diagram with trust boundaries</td></tr>
<tr><td>Business and process owners</td><td>Who does what, in which order, with which hand-offs?</td><td>BPMN or swimlane process</td></tr>
</tbody></table></div>
<h3>Levels of abstraction: think in maps</h3>
<p>Online maps let you zoom from country to street. Each zoom level shows a different amount of detail, and nobody expects a country map to show house numbers. Architecture works the same way. The C4 model (Module 3) gives you four named zoom levels: <b>Context</b>, <b>Container</b>, <b>Component</b> and <b>Code</b>. The most common beginner mistake is mixing levels, for example a box for "the mobile app" next to a box for "the users table" next to a box for "AWS".</p>
<h3>Write a diagram brief first</h3>
<p>Before you open any tool, answer six questions in a sentence each. This takes two minutes and prevents most redraws.</p>
<ol>
<li><b>Reader:</b> who will look at this?</li>
<li><b>Question:</b> what will they be able to answer afterwards?</li>
<li><b>Scope:</b> which system, process or environment, and where is the boundary?</li>
<li><b>Level:</b> context, container, component, code, process, or deployment?</li>
<li><b>State:</b> current state, target state, or a transition between them?</li>
<li><b>Home:</b> where will it live, and who keeps it current?</li>
</ol>
<h3>Sketch, then formalise</h3>
<p>Whiteboards and paper are fine for thinking. Formalise a diagram when the design settles, when it needs review, or when someone outside the room needs it. A formal diagram has a title, a key, labelled lines, and an owner. Module 2 covers the grammar that makes that work.</p>`,

{ id:"m2", dwg:"A-02", lvl:"a", title:"Visual grammar", time:"45 min",
  summary:"Boxes, lines, words, colour and layout. The small rules that make any notation readable.",
  objectives:["Label every element with name, type, responsibility, and technology where relevant","Draw directional, labelled relationships","Use colour and shape with a key, and never as the only signal","Lay out a diagram so it reads in one pass"],
  learn:`
<h3>Boxes</h3>
<p>A box with one word ("Backend") forces the reader to guess. Give each element four things:</p>
<ul><li><b>Name</b>: what people call it ("Order API").</li><li><b>Type</b>: person, system, container, component, data store, queue.</li><li><b>Responsibility</b>: one short line about what it does.</li><li><b>Technology</b>: at container level and below ("Python, Django").</li></ul>
<h3>Lines</h3>
<p>Lines carry most of the meaning, and they are where most diagrams fail. For every line:</p>
<ul><li><b>Direction</b>: point the arrow from the initiator to the receiver. For request/response, show the request direction; the reply is implied.</li><li><b>Verb</b>: "Publishes order.placed to", "Reads stock from". Avoid "uses" when a better verb exists.</li><li><b>Protocol or format</b> at container level: HTTPS, gRPC, SQL, AMQP, SFTP, JSON, Avro.</li><li><b>One line per intent.</b> Avoid double-headed arrows; they hide who calls whom.</li></ul>
<h3>Words</h3>
<p>Use the same name for the same thing on every diagram and in the code. Write labels in plain language. Prefer "Sends receipt emails via" over "Integration".</p>
<h3>Colour and shape</h3>
<ul><li>Colour must mean something, and the key must say what.</li><li>Keep to about four fills. Common choices: internal, external, data store, deprecated or planned.</li><li>Never rely on colour alone. Pair it with a shape, border style, or text label so the diagram works in greyscale and for colour-blind readers.</li><li>Dashed borders conventionally mean "external" or "planned". Say which in the key.</li></ul>
<h3>Layout</h3>
<ul><li>Pick a reading direction (left to right, or top to bottom) and keep the main flow in it.</li><li>Put users and callers on the left or top, data stores and external dependencies on the right or bottom.</li><li>Group with boundaries (a system, a team, a network zone), and label each boundary.</li><li>Minimise crossing lines. If you cannot, the diagram is probably too big.</li><li>Aim for roughly 20 elements or fewer. Past that, split by level or by scenario.</li></ul>
<h3>Every diagram carries a frame</h3>
<p>Engineering drawings carry a title block. Yours should too: <b>title</b>, <b>scope</b>, <b>key</b>, <b>date or version</b>, <b>status</b> (current, target, draft), and <b>owner</b>. Readers six months from now will thank you.</p>`,

{ id:"m3", dwg:"A-03", lvl:"a", title:"The C4 model", time:"60 min",
  summary:"The most widely used way to describe software architecture: four zoom levels plus a few supporting views, independent of notation.",
  objectives:["Use the C4 abstractions correctly: person, software system, container, component, code","Draw context, container and component views of one system","Know when to use landscape, dynamic and deployment views","Avoid the common C4 mistakes"],
  learn:`
<h3>The abstractions</h3>
<div class="tbl"><table><thead><tr><th>Abstraction</th><th>Meaning</th><th>Examples</th></tr></thead><tbody>
<tr><td>Person</td><td>A human user or role</td><td>Shopper, Teller, Auditor</td></tr>
<tr><td>Software system</td><td>The highest level of value delivery, usually owned by one team</td><td>Parcel, Payment gateway, Core ledger</td></tr>
<tr><td>Container</td><td>A separately runnable or deployable unit, or a data store. Not necessarily a Docker container.</td><td>SPA, API service, batch job, database, topic, S3 bucket</td></tr>
<tr><td>Component</td><td>A grouping of related code inside one container, behind an interface</td><td>Checkout service, Payment client</td></tr>
<tr><td>Code</td><td>Classes, functions, tables</td><td>CheckoutService, orders table</td></tr>
</tbody></table></div>
<h3>The four core views</h3>
<ol>
<li><b>System context</b>: your system as one box, with people and external systems. For everyone.</li>
<li><b>Container</b>: zoom into your system; show applications and data stores and how they talk. For technical people.</li>
<li><b>Component</b>: zoom into one container. Draw it only when it helps; many teams draw few or none.</li>
<li><b>Code</b>: UML class or ER diagrams. Usually generated from code, or skipped.</li>
</ol>
<h3>Supporting views</h3>
<ul>
<li><b>System landscape</b>: many systems across a department or enterprise. Useful for portfolio and platform conversations.</li>
<li><b>Dynamic</b>: a numbered collaboration for one scenario. A sequence diagram works too (Module 4).</li>
<li><b>Deployment</b>: containers mapped onto infrastructure nodes (Module 6).</li>
</ul>
<h3>Rules that keep C4 honest</h3>
<ul>
<li>Each view stays at one level. Containers do not appear on a context view.</li>
<li>Every element states its type and, from container level down, its technology.</li>
<li>Every relationship states its intent and, from container level down, its protocol.</li>
<li>Shared libraries are not containers. They are components inside each container that uses them.</li>
<li>Message brokers: show the topics or queues as containers and name the events on the arrows. Do not draw a single "Kafka" hub that everything points at.</li>
<li>C4 is notation-independent. Mermaid, Structurizr, PlantUML and draw.io all work; what matters is a consistent key.</li>
</ul>
<h3>One model, many views</h3>
<p>Structurizr DSL describes the model once and derives views from it, so a rename updates every diagram. This is the same Parcel system:</p>
${pre(`workspace "Parcel" {
  model {
    shopper = person "Shopper"
    pay = softwareSystem "Payment gateway" { tags "External" }
    parcel = softwareSystem "Parcel" {
      web = container "Storefront SPA" "Catalogue, cart, checkout" "React"
      api = container "Order API" "Carts, orders, checkout" "Python, Django"
      db  = container "Orders DB" "Orders, customers, stock" "PostgreSQL" { tags "Database" }
    }
    shopper -> web "Uses" "HTTPS"
    web -> api "Calls" "JSON/HTTPS"
    api -> db "Reads and writes" "SQL"
    api -> pay "Authorises cards" "REST"
  }
  views {
    systemContext parcel "Context" { include * autolayout lr }
    container parcel "Containers" { include * autolayout lr }
    styles {
      element "External" { background #999999 }
      element "Database" { shape cylinder }
    }
  }
}`)}`,

  objectives:["Draw sequence diagrams with sync, async and reply messages and alt/opt/loop/par fragments","Model a lifecycle with a state machine: event [guard] / action","Know which other UML diagrams to use and when to use C4 instead"],
  learn:`
<h3>Which UML diagrams matter to architects</h3>
<div class="tbl"><table><thead><tr><th>Diagram</th><th>Use it for</th><th>How often</th></tr></thead><tbody>
<tr><td>Sequence</td><td>Ordering of calls in one scenario, including failures and retries</td><td>Very often</td></tr>
<tr><td>State machine</td><td>Lifecycle of an entity: order, payment, account, ticket</td><td>Often</td></tr>
<tr><td>Activity</td><td>Algorithm or workflow logic within one actor</td><td>Sometimes; BPMN is better across roles</td></tr>
<tr><td>Component, deployment</td><td>Structure and infrastructure</td><td>C4 container and deployment views usually replace these</td></tr>
<tr><td>Class</td><td>Key domain types and relationships</td><td>For domain models, not full class dumps</td></tr>
</tbody></table></div>
<h3>Sequence diagram notation</h3>
<div class="tbl"><table><thead><tr><th>Mermaid</th><th>Meaning</th></tr></thead><tbody>
<tr><td><code>A->>B: msg</code></td><td>Synchronous call; caller waits</td></tr>
<tr><td><code>B-->>A: msg</code></td><td>Reply (dashed)</td></tr>
<tr><td><code>A-)B: msg</code></td><td>Asynchronous message; caller does not wait</td></tr>
<tr><td><code>A-xB: msg</code></td><td>Lost or failed message</td></tr>
<tr><td><code>alt / else / end</code></td><td>Mutually exclusive branches</td></tr>
<tr><td><code>opt</code></td><td>Optional step</td></tr>
<tr><td><code>loop</code></td><td>Repetition, such as polling or retries</td></tr>
<tr><td><code>par / and</code></td><td>Parallel branches</td></tr>
<tr><td><code>Note over A,B: text</code></td><td>Annotation, e.g. timeouts or idempotency keys</td></tr>
</tbody></table></div>
<p>Good sequence diagrams show the <b>unhappy path</b>: timeouts, declines, retries, compensation. Reviewers learn the most from those.</p>
<h3>State machines</h3>
<p>Transitions are labelled <code>event [guard] / action</code>. For example: <code>payment authorised [amount &gt; 0] / send receipt</code>. Check that every state has a way out (or is final), and that every event that can arrive in a state is handled.</p>
<h3>Class diagrams, sparingly</h3>
<p>Draw the handful of domain types that make the design understandable, with multiplicities on the relationships. Leave getters, setters and framework classes out.</p>`,
  examples:[
    {title:"Checkout, including the decline path", code:D.seq, caption:"A sequence diagram for one scenario, with numbered steps.", notice:["The order event is asynchronous (open arrowhead); the API does not wait for consumers.","The alt fragment shows the decline branch, which reviewers will ask about.","Step numbers let people refer to 'step 6' in review comments."]},
    {title:"Order lifecycle", code:D.state, caption:"Every status the Orders DB can hold, and what moves an order between them.", notice:["Each transition is labelled with the event that causes it.","Three final states are explicit.","This diagram doubles as a test checklist."]},
    {title:"Code level: key types only", code:D.code, caption:"A focused class diagram supporting the component view.", notice:["Only the types needed to explain checkout are shown."]}
  ],
  quiz:[
    {q:"In Mermaid sequence syntax, what does A-)B mean?", o:["Synchronous call","Reply","Asynchronous message","Deleted participant"], a:2, why:"The open arrowhead marks an asynchronous message; the sender continues without waiting."},
    {q:"What is a sequence diagram best at showing?", o:["The full static structure of a system","The order of interactions in one scenario","Infrastructure topology","Business ownership"], a:1, why:"Sequence diagrams are about time and order for a single scenario."},
    {q:"Which fragment shows mutually exclusive branches?", o:["loop","par","alt","opt"], a:2, why:"alt/else shows one branch or the other. opt is a single optional branch; par is parallel."},
    {q:"In the label 'payment authorised [amount > 0] / send receipt', what is '[amount > 0]'?", o:["The event","The guard","The action","The target state"], a:1, why:"Event [guard] / action. The guard must be true for the transition to fire."},
    {q:"How should architects use class diagrams?", o:["Generate every class in the codebase","Show key domain types and relationships only","Never","Only for databases"], a:1, why:"A focused domain model communicates; a full dump overwhelms and goes stale."}
  ],
  lab:{type:"mermaid", title:"Sign-in with OIDC and MFA",
    brief:"A user signs in to an internal web app. The app redirects to the company identity provider (OIDC). The IdP checks the password, then pushes an MFA prompt to the user's phone. If the user approves within 60 seconds, the IdP redirects back with an authorisation code; the app exchanges it for tokens and creates a session. If the push times out, the IdP shows an error.",
    reqs:["Participants: User, Browser, Web app, Identity provider, Authenticator app","Use autonumber","Show the code-for-token exchange as a back-channel call from the Web app","Use alt/else for approved versus timed out","Add a note about the 60-second timeout"],

{ id:"m5", dwg:"B-02", lvl:"p", title:"Processes and BPMN", time:"60 min",
  summary:"Business and operational processes: who does what, in what order, with which decisions and hand-offs.",
  objectives:["Read and draw the core BPMN elements: events, tasks, gateways, flows, pools and lanes","Apply naming rules for tasks and events","Build a BPMN diagram in draw.io and a quick approximation in Mermaid"],
  learn:`
<h3>The core BPMN palette</h3>
<div class="tbl"><table><thead><tr><th>Element</th><th>Looks like</th><th>Means</th></tr></thead><tbody>
<tr><td>Start event</td><td>Thin circle</td><td>Something that starts the process: "Invoice received"</td></tr>
<tr><td>Intermediate event</td><td>Double circle</td><td>Something that happens mid-process: a timer, a message, an error</td></tr>
<tr><td>End event</td><td>Thick circle</td><td>A result: "Invoice paid", "Claim rejected"</td></tr>
<tr><td>Task</td><td>Rounded rectangle</td><td>A unit of work: "Review claim"</td></tr>
<tr><td>Sub-process</td><td>Rounded rectangle with +</td><td>A collapsible group of tasks</td></tr>
<tr><td>Exclusive gateway</td><td>Diamond with X (or empty)</td><td>Exactly one outgoing path is taken</td></tr>
<tr><td>Parallel gateway</td><td>Diamond with +</td><td>All paths run; the join waits for all</td></tr>
<tr><td>Inclusive gateway</td><td>Diamond with O</td><td>One or more paths run</td></tr>
<tr><td>Event-based gateway</td><td>Diamond with pentagon</td><td>Path chosen by whichever event happens first</td></tr>
<tr><td>Sequence flow</td><td>Solid arrow</td><td>Order of work within one pool</td></tr>
<tr><td>Message flow</td><td>Dashed arrow, open circle tail</td><td>Communication between pools (organisations)</td></tr>
<tr><td>Pool and lane</td><td>Large band split into rows</td><td>Pool: a participant. Lane: a role, team or system inside it.</td></tr>
<tr><td>Data object, store</td><td>Folded page, cylinder</td><td>Information used or produced</td></tr>
</tbody></table></div>
<h3>Rules that prevent broken processes</h3>
<ul>
<li>Sequence flows stay inside one pool. Between pools, use message flows.</li>
<li>Name tasks verb plus noun ("Approve payment"). Name events as states in the past tense ("Payment approved").</li>
<li>Label every gateway as a question, and every outgoing flow as an answer.</li>
<li>Close what you open: a parallel split needs a parallel join, or the process can deadlock or run twice.</li>
<li>Every path ends in an end event. Show exception and timeout paths; they are where the risk is.</li>
<li>Pick a level and stay there: descriptive (for business), analytical (with exceptions), or executable (for an engine like Camunda).</li>
</ul>
<h3>Tools</h3>
<p>For true BPMN, use draw.io's BPMN shape libraries, or bpmn.io / Camunda Modeler, which save standard BPMN 2.0 XML. Mermaid has no BPMN type; a flowchart with subgraphs as lanes is a quick approximation for docs, as below.</p>`,
  examples:[{title:"Wire transfer approval (swimlane approximation)", code:D.bpmn, caption:"Three lanes, two decision points, explicit rejection paths.", notice:["Events use circles: thin for start, double ring for end in this Mermaid approximation.","Gateways are questions; each outgoing flow is labelled with an answer.","The rejection path has its own end event."]}],
  quiz:[
    {q:"A diamond with an X inside is…", o:["A parallel gateway","An exclusive gateway: exactly one path","An error event","A sub-process"], a:1, why:"Exclusive (XOR) gateways route the flow down exactly one outgoing path."},
    {q:"Message flows (dashed) connect…", o:["Tasks in the same lane","Elements in different pools","Gateways only","Data objects"], a:1, why:"Pools are separate participants; they communicate through messages. Sequence flows cannot cross pools."},
    {q:"Which is the best name for an end event?", o:["Pay invoice","Invoice","Invoice paid","Payment step"], a:2, why:"Events describe a state reached, in the past tense. Tasks use verb plus noun."},
    {q:"A parallel gateway splits into three paths. How should they merge?", o:["Into an exclusive gateway","Into a parallel gateway","They do not need to merge","Into a start event"], a:1, why:"A parallel join waits for all branches. Joining with an exclusive gateway can let the process continue three times."},
    {q:"What do lanes represent?", o:["Time periods","Roles, teams or systems responsible for the work","Data stores","Priorities"], a:1, why:"Lanes show who performs each task within a participant."}
  ],
  lab:{type:"drawio", title:"Employee expense claim in draw.io (BPMN)",
    brief:"Employees submit expense claims with receipts. Their manager reviews each claim and can approve it or send it back for changes. Finance checks approved claims against policy. Claims over policy limits go to the finance controller. Approved claims are paid in the next payroll run. If the manager does not act within five business days, the claim escalates to the manager's manager.",
    steps:[
      "Open <a href=\"https://app.diagrams.net\" target=\"_blank\" rel=\"noopener\">app.diagrams.net</a>, choose where to save (Device is fine), and create a blank diagram named <code>expense-claim</code>.",
      "Add BPMN shapes: click <b>+ More Shapes</b> at the bottom of the left panel, tick <b>BPMN General</b> (and any other BPMN libraries listed), then <b>Apply</b>.",
      "Search the shape panel for <b>pool</b>, drag a horizontal pool onto the canvas, and give it three lanes: Employee, Manager, Finance. Name the pool \"Expense claim\".",
      "In Employee: a start event \"Expense incurred\", then tasks \"Prepare claim\" and \"Submit claim with receipts\".",
      "In Manager: task \"Review claim\", then an exclusive gateway \"Claim acceptable?\". Label the outgoing flows Yes and No. No goes to \"Request changes\" and back to the employee's prepare task.",
      "Attach a timer boundary event to \"Review claim\" labelled \"5 business days\". Its flow leads to a task \"Escalate to senior manager\".",
      "In Finance: \"Check against policy\", then a gateway \"Within policy limit?\". No leads to \"Controller review\". Both paths reach \"Schedule payment in payroll\" and an end event \"Claim paid\". Add an end event \"Claim rejected\" for a controller refusal.",
      "Tidy: keep the flow left to right, avoid crossing lines, and add a text box with title, date, owner and status.",
      "Save with <b>File › Export as › SVG</b> and tick <b>Include a copy of my diagram</b>. The file stays editable in draw.io and renders in any Git host or wiki."
    ],
    reqs:["One pool with three labelled lanes","Tasks are verb plus noun; events are past tense","Every gateway is a question with labelled outgoing flows","Timer boundary event with an escalation path","Every path reaches an end event","Exported as an editable .drawio.svg with a title block"]}
},
{ id:"m6", dwg:"B-03", lvl:"p", title:"Cloud, infrastructure and data flow", time:"70 min",
  summary:"Where software runs, what fails together, and where sensitive data crosses trust boundaries.",
  objectives:["Draw deployment views with regions, zones, networks and replication","Make failure domains and single points of failure visible","Draw data-flow diagrams with trust boundaries for threat modelling","Use vendor icons without making icon soup"],
  learn:`
<h3>Deployment views</h3>
<p>A deployment view maps containers onto infrastructure. Nest boundaries from the outside in: cloud account or data centre, region, network (VPC or VNet), availability zone, subnet, cluster or host, then the container instances.</p>
<ul>
<li>Show <b>instance counts</b> ("x3") and <b>scaling rules</b> where they matter.</li>
<li>Show <b>replication</b> with direction and mode: synchronous or asynchronous.</li>
<li>Show <b>ingress and egress</b>: load balancers, WAF, NAT, private endpoints, firewalls.</li>
<li>Draw one deployment view per environment that differs. Production and development usually differ.</li>
</ul>
<h3>Make failure domains visible</h3>
<p>A reader should be able to point at any box and say what happens if it disappears. If the only database sits inside one zone, the drawing should make that obvious. Mark single points of failure explicitly, and show the recovery path (failover, restore from backup) with RPO and RTO if they are known.</p>
<h3>Data-flow diagrams and trust boundaries</h3>
<p>Security reviews use data-flow diagrams (DFDs), which have only five elements:</p>
<div class="tbl"><table><thead><tr><th>Element</th><th>Shape</th><th>Example</th></tr></thead><tbody>
<tr><td>External entity</td><td>Rectangle</td><td>User, partner system</td></tr>
<tr><td>Process</td><td>Circle or rounded box</td><td>Checkout service</td></tr>
<tr><td>Data store</td><td>Open rectangle or cylinder</td><td>Orders DB</td></tr>
<tr><td>Data flow</td><td>Arrow labelled with the data</td><td>"card token, cart"</td></tr>
<tr><td>Trust boundary</td><td>Dashed line or box</td><td>Internet to DMZ, app to database network</td></tr>
</tbody></table></div>
<p>Wherever a flow crosses a trust boundary, walk through <b>STRIDE</b>: Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege. Label flows with the data they carry (PII, card data, credentials) so classification is visible.</p>
<h3>Icons</h3>
<ul>
<li>Vendor icons (AWS, Azure, GCP) help infrastructure people recognise services quickly. They do not explain purpose.</li>
<li>Always pair an icon with a text label: role first, product second ("Orders DB, Amazon RDS for PostgreSQL").</li>
<li>Use the official, current icon set, at one size, and do not mix vendors' styles in one view.</li>
<li>draw.io ships AWS, Azure, GCP, Kubernetes and Cisco libraries under <b>+ More Shapes</b>.</li>
</ul>`,
  examples:[
    {title:"Deployment: two zones, one region", code:D.deploy, caption:"Production deployment of Parcel's Order API and database.", notice:["Nesting shows region, network and zone.","The replication arrow names its mode.","A reader can see the region is a single point of failure, which is a fair review question."]},
    {title:"Data-flow diagram with trust boundaries", code:D.dfd, caption:"The checkout path, as a security reviewer would want it.", notice:["Flows are labelled with the data they carry.","Dashed red boundaries show where trust changes.","Processes are numbered and the data store is labelled D1, which is DFD convention."]}
  ],
  quiz:[
    {q:"Which belongs on a deployment view?", o:["Classes and methods","Nodes, what runs on them, replication and network boundaries","Business process steps","Only vendor logos"], a:1, why:"Deployment views answer 'what runs where', including the infrastructure and connections between nodes."},
    {q:"A trust boundary is…", o:["A team boundary","Where data or calls cross between different levels of privilege or trust","A firewall vendor","The edge of the diagram"], a:1, why:"Crossing a trust boundary is where authentication, authorisation, validation and encryption matter most."},
    {q:"In STRIDE, T stands for…", o:["Timeout","Tampering","Tokenisation","Throttling"], a:1, why:"Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege."},
    {q:"What is the right way to use vendor icons?", o:["Instead of labels","Sparingly, always with a text label saying what the thing does","Mix several vendors' styles for variety","Only on context diagrams"], a:1, why:"An icon says which product it is; the label says what it is for. Readers need both."},
    {q:"How do you make a single-zone database risk visible?", o:["Mention it in a footnote","Place it inside one zone's boundary and show no replica","Colour it red without a key","Leave zones off the diagram"], a:1, why:"Correct nesting makes the failure domain obvious without extra explanation."}
  ],
  lab:{type:"mermaid", title:"DFD for a document upload service",

    reqs:["External entities: customer browser, verification vendor","Processes numbered (1. Upload API, 2. Verification handler)","Data stores labelled D1, D2","Every flow labelled with the data it carries; mark PII","At least two dashed trust boundaries"],
    starter:`flowchart LR

{ id:"m7", dwg:"C-01", lvl:"x", title:"Diagrams as code and tooling", time:"60 min",
  summary:"Keep diagrams next to the code, review them in pull requests, render them in CI, and publish them with your docs.",
  objectives:["Choose between Mermaid, PlantUML, Structurizr, D2 and draw.io for a given job","Set up a docs folder that renders diagrams in CI","Keep draw.io diagrams editable and versioned in Git"],
  learn:`
<h3>Why treat diagrams as code</h3>
<ul><li>They live next to the code they describe and change in the same pull request.</li><li>Reviewers see a text diff, not a mystery binary.</li><li>Rendering is repeatable, so styling stays consistent across a team.</li><li>Model-based tools (Structurizr) generate many views from one model, so names never drift.</li></ul>
<h3>Choosing a tool</h3>
<div class="tbl"><table><thead><tr><th>Tool</th><th>Strengths</th><th>Weak spots</th><th>Good for</th></tr></thead><tbody>
<tr><td>Mermaid</td><td>Renders natively in GitHub, GitLab, many wikis; low friction</td><td>Limited layout control; C4 support is basic</td><td>Sequences, flows, state, quick views in READMEs</td></tr>
<tr><td>PlantUML</td><td>Very complete UML; C4-PlantUML library; mature</td><td>Needs Java or a server to render; dated default look</td><td>Detailed UML, C4 with layout hints</td></tr>
<tr><td>Structurizr DSL</td><td>One model, many C4 views; consistent naming</td><td>C4-specific; learning curve</td><td>Living architecture of a system or landscape</td></tr>
<tr><td>D2</td><td>Modern layouts, nested containers, good looking</td><td>Smaller ecosystem</td><td>Polished infrastructure and overview diagrams</td></tr>
<tr><td>draw.io</td><td>Free, visual, huge shape libraries, editable SVG/PNG in Git</td><td>Manual layout; diffs are XML</td><td>BPMN, cloud diagrams, presentation-quality views</td></tr>
<tr><td>Excalidraw</td><td>Fast, hand-drawn style, collaborative</td><td>Not for formal documentation</td><td>Workshops and early sketches</td></tr>
</tbody></table></div>
<h3>A docs folder that works</h3>
${pre(`docs/
  architecture/
    workspace.dsl          # Structurizr model: context, containers, deployment
    decisions/
      0001-use-postgres.md # ADRs, one per decision
    diagrams/
      checkout.mmd         # Mermaid sequence
      expense-claim.drawio.svg
    README.md              # index: what each diagram is for, owner, review date
mkdocs.yml                 # or Backstage TechDocs config`)}
<h3>Render and publish in CI</h3>
${pre(`# .github/workflows/docs.yml (sketch)
on: { push: { branches: [main], paths: ["docs/**"] } }
jobs:
  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render Mermaid
        run: npx -y @mermaid-js/mermaid-cli -i docs/architecture/diagrams/checkout.mmd -o site/checkout.svg
      - name: Export Structurizr views
        run: docker run --rm -v $PWD:/w structurizr/cli export -w /w/docs/architecture/workspace.dsl -f plantuml
      - name: Build docs site
        run: pipx run mkdocs build`)}
<h3>PlantUML with the C4 library</h3>
${pre(`@startuml
!include <C4/C4_Container>
Person(shopper, "Shopper")
System_Boundary(b, "Parcel") {
  Container(api, "Order API", "Python, Django", "Carts and checkout")
  ContainerDb(db, "Orders DB", "PostgreSQL")
}
Rel(shopper, api, "Uses", "HTTPS")
Rel_R(api, db, "Reads and writes", "SQL")
SHOW_LEGEND()
@enduml`)}
<h3>draw.io in Git</h3>
<ul><li>Save as <code>.drawio.svg</code> or <code>.drawio.png</code>: an image any viewer renders, with the editable diagram embedded.</li><li>The draw.io VS Code extension edits these files in place.</li><li>Agree on a shared shape library and colour key, and keep it in the repo.</li></ul>`,
  examples:[{title:"Release pipeline for an open-source package", code:D.pipe, caption:"A flowchart that lives in the repo's docs and changes with the workflow file.", notice:["The CI workflow is shown as a distinct shape.","Artefacts and destinations are named, so the supply chain is reviewable.","It is short enough to read in a pull request."]}],
  quiz:[
    {q:"What is the main benefit of diagrams as code?", o:["They always look better","They are versioned and reviewed alongside the code they describe","They need no tooling","They replace all prose"], a:1, why:"Versioning and review in the same workflow is what keeps diagrams honest."},
    {q:"How does Structurizr differ from writing separate Mermaid files?", o:["It only draws sequence diagrams","You define one model and generate many views from it","It cannot render C4","It needs no text"], a:1, why:"Model-based tooling keeps names and relationships consistent across every view."},
    {q:"How do you keep a draw.io diagram both viewable and editable in Git?", o:["Commit a PNG screenshot","Save as .drawio.svg or .drawio.png with the diagram embedded","Commit a PDF","Store only the XML and never render it"], a:1, why:"The embedded format renders anywhere and reopens in draw.io for edits."},
    {q:"Where should diagrams be rendered for publication?", o:["Each developer's laptop","In CI on merge, published with the docs site","Only during architecture reviews","In email attachments"], a:1, why:"CI rendering means the published diagram always matches the main branch."},
    {q:"Which is a known limitation of Mermaid?", o:["It cannot render in GitHub","Limited control over layout","No sequence diagrams","It requires Java"], a:1, why:"Mermaid auto-lays out diagrams. Precise placement needs other tools or restructuring."}
  ],

    starter:`---

{ id:"m8", dwg:"C-02", lvl:"x", title:"Professional practice", time:"60 min",
  summary:"Documentation sets, decision records, reviews, presenting, and keeping diagrams alive.",
  objectives:["Assemble a documentation set with C4 views and ADRs (or arc42)","Write an Architecture Decision Record with a supporting diagram","Review a diagram against a rubric and give actionable feedback","Present architecture with progressive disclosure"],
  learn:`
<h3>The documentation set</h3>
<p>A professional set is small and current. For most systems: a context view, a container view, one or two dynamic or sequence views for the riskiest scenarios, a deployment view per distinct environment, and a list of ADRs. arc42 is a popular 12-section template if you need a fuller structure; C4 views slot into its sections 3, 5, 6 and 7.</p>
<h3>Architecture Decision Records</h3>
${pre(`# 0007. Publish order events to Kafka instead of calling fulfilment directly

Status: Accepted (2026-10-12)
Deciders: Payments platform architecture group

## Context
Checkout latency rises when the fulfilment service is slow, and
fulfilment outages block orders. Three other teams want order events.

## Decision
The Order API publishes order.placed to a Kafka topic. Fulfilment
and other consumers subscribe. See container view v3 and sequence S-02.

## Consequences
+ Checkout no longer depends on fulfilment availability.
+ New consumers can subscribe without changes to the Order API.
- Fulfilment becomes eventually consistent; customer messaging must reflect that.
- We now operate a topic: schema registry, retention and DLQ policies needed.`)}
<p>Link each ADR to the diagram version it changes, and draw the "after" picture.</p>
<h3>Reviewing diagrams</h3>
<p>Review against a rubric (see Reference) and make each comment actionable: "Line 4 has no protocol; is it gRPC or REST?" beats "unclear". Engineers call marking up a drawing <b>redlining</b>: the reviewer marks problems in red and the author resolves each one.</p>
<h3>Presenting</h3>
<ul><li>Start at context, then zoom in only as far as the audience needs.</li><li>Build complex views in steps: show the happy path, then add failure paths.</li><li>One message per slide. Say it in the slide title.</li><li>Label current versus target state, and show the transition plan if it spans quarters.</li></ul>
<h3>Keeping diagrams alive</h3>
<ul><li>Every diagram has an owner and a review date.</li><li>Update diagrams in the same pull request as the change they describe.</li><li>Prefer generated or model-based views for things that change often.</li><li>Archive superseded diagrams with a note that points to the replacement. Do not leave fossils in the wiki.</li></ul>`,
  examples:[{title:"Redline exercise source", code:D.bad, caption:"The lab below asks you to review this diagram. Look at it closely first.", notice:["Try to find at least six problems before opening the lab checklist."]}],
  quiz:[
    {q:"What does an ADR contain?", o:["Only the decision","Context, decision, status and consequences","A full design document","Meeting minutes"], a:1, why:"The context and consequences explain why, which is what future readers need."},
    {q:"What best keeps diagrams current?", o:["A yearly documentation sprint","An owner, a review date, and updates in the same pull request as the change","Printing them","Locking the wiki page"], a:1, why:"Ownership plus a change-time habit keeps drift small."},
    {q:"Presenting to executives, you should start with…", o:["The component view","The system context, then zoom in only as needed","The class diagram","The deployment YAML"], a:1, why:"Progressive disclosure keeps the audience oriented."},
    {q:"Current and target state appear in one deck. What should you do?", o:["Mix them on one diagram without labels","Label each view clearly and date it","Show only the target","Use colour alone to tell them apart"], a:1, why:"Readers act on what they believe is true today. Make the state explicit."},
    {q:"arc42 is…", o:["A diagram notation","A template for structuring architecture documentation","A cloud provider","A BPMN engine"], a:1, why:"arc42 gives a section structure. You still choose notations like C4 for its diagrams."}
  ],
  lab:{type:"redline", title:"Redline review",
    brief:"Review the diagram below as if it were attached to a design review. Tick every problem you can see, then check your review.",
    items:[
      {t:"No title, scope, date or status", real:true},
      {t:"No key explaining colours or shapes", real:true},
      {t:"Lines have no direction", real:true},
      {t:"Lines have no verbs or protocols", real:true},
      {t:"Mixed abstraction levels: 'AWS' is not the same kind of thing as 'Web'", real:true},
      {t:"Vague names: 'Backend', 'Service 2', 'Stuff'", real:true},
      {t:"Colours appear without meaning", real:true},
      {t:"Two services share one database, and the diagram does not say who owns it", real:true},
      {t:"Kafka drawn as an anonymous box with no topics or events", real:true},
      {t:"Too many elements for one view", real:false, note:"Nine elements is a comfortable size. The problems are elsewhere."},
      {t:"It should use vendor icons", real:false, note:"Icons would not fix any of the real problems, and they are optional."}
    ]}
}

/* ---------- state ---------- */
const KEY = "ads-progress-v1";
let S = {read:{}, quiz:{}, lab:{}, cap:{}, labCode:{}, sandbox:null};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} updateMeter(); renderTabs(); }
function modDone(m){ return !!(S.read[m.id] && S.lab[m.id] && (S.quiz[m.id]||0) >= 4); }
function pct(){
  let total = MODULES.length*3, got = 0;
  MODULES.forEach(m => { got += (S.read[m.id]?1:0) + (S.lab[m.id]?1:0) + ((S.quiz[m.id]||0)>=4?1:0); });
  CAPSTONES.forEach(c => { total += c.rubric.length; got += (S.cap[c.id]||[]).length; });
  return Math.round(got/total*100);
}
function updateMeter(){ document.getElementById("meter").textContent = pct() + "% complete"; }
function toast(t){ const el = document.getElementById("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(()=>el.hidden = true, 1800); }

/* ---------- mermaid ---------- */
let mmdReady = typeof mermaid !== "undefined";
if (mmdReady) mermaid.initialize({
  startOnLoad:false, securityLevel:"strict", theme:"base",
  fontFamily:"Public Sans, system-ui, sans-serif",
  flowchart:{htmlLabels:true, curve:"basis", padding:12},
  sequence:{useMaxWidth:false, mirrorActors:false},
  c4:{diagramMarginY:10},
  themeVariables:{
    background:"#FBFCFB", primaryColor:"#FFFFFF", primaryTextColor:"#172125", primaryBorderColor:"#0A6A7E",
    lineColor:"#56656C", secondaryColor:"#DDEDEF", tertiaryColor:"#F1F5F4", textColor:"#172125",
    clusterBkg:"#F1F5F4", clusterBorder:"#A9B7B6", edgeLabelBackground:"#FBFCFB", titleColor:"#172125",
    actorBkg:"#FFFFFF", actorBorder:"#0A6A7E", actorTextColor:"#172125", signalColor:"#172125", signalTextColor:"#172125",
    labelBoxBkgColor:"#DDEDEF", labelBoxBorderColor:"#0A6A7E", labelTextColor:"#172125", loopTextColor:"#172125",
    noteBkgColor:"#FAEFD9", noteTextColor:"#172125", noteBorderColor:"#9A6512", fontSize:"14px"
  }
});
let mmdN = 0;
async function draw(el, code){
  if (!mmdReady){ el.innerHTML = `<div class="err">The diagram renderer did not load. The source is still below.</div>`; return false; }
  const id = "mmd" + (++mmdN);
  try {
    await mermaid.parse(code);
    const { svg } = await mermaid.render(id, code);
    el.innerHTML = svg;
    return true;
  } catch(e){
    document.getElementById(id)?.remove(); document.getElementById("d"+id)?.remove();
    el.innerHTML = `<div class="err">${esc((e && e.message || String(e)).split("\n").slice(0,6).join("\n"))}</div>`;
    return false;
  }
}
function hydrateDiagrams(root){
  root.querySelectorAll("[data-mmd]").forEach(el => draw(el, CODE[+el.dataset.mmd]));
}

const LVL = {a:["Apprentice","a"], p:["Practitioner","p"], x:["Professional","x"]};
const lvlPill = k => `<span class="lvl ${LVL[k][1]}">${LVL[k][0]}</span>`;
function figure(ex, opts={}){
  const i = reg(ex.code);
  return `<div class="fig">
    <div class="figcap"><h4>${esc(ex.title)}</h4>
      <div class="btns"><button class="btn ghost" data-src="${i}">Source</button><button class="btn ghost" data-sandbox="${i}">Open in sandbox</button></div></div>
    <div class="canvas" data-mmd="${i}"><span class="loading">Rendering…</span></div>
    ${ex.caption ? `<p class="muted">${esc(ex.caption)}</p>` : ""}
    ${ex.notice ? `<div class="notice"><b>What to notice</b><ul>${ex.notice.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div>` : ""}
    <div class="srcbox" hidden>${pre(ex.code)}</div>
  </div>`;
}
function editorBlock(key, code, compact){
  return `<div class="editor" data-ed="${key}">
    <div class="stack" style="gap:.4rem">
      <div class="edhead"><span class="eyebrow">Mermaid source</span><span class="status" data-st>…</span></div>
      <textarea id="ed-${key}" spellcheck="false" aria-label="Mermaid source">${esc(code)}</textarea>
    </div>
    <div class="stack" style="gap:.4rem">
      <div class="edhead"><span class="eyebrow">Live preview</span><button class="btn ghost" data-copy="${key}">Copy source</button></div>
      <div class="canvas" data-prev><span class="loading">Rendering…</span></div>
    </div>
  </div>`;
}
function bindEditor(root, key, onChange){
  const wrap = root.querySelector(`[data-ed="${key}"]`); if (!wrap) return;
  const ta = wrap.querySelector("textarea"), prev = wrap.querySelector("[data-prev]"), st = wrap.querySelector("[data-st]");
  let t;
  const run = async () => { const ok = await draw(prev, ta.value); st.textContent = ok ? "Renders" : "Syntax error"; st.className = "status " + (ok?"ok":"bad"); };
  ta.addEventListener("input", () => { clearTimeout(t); t = setTimeout(run, 450); onChange && onChange(ta.value); });
  ta.addEventListener("keydown", e => { if (e.key === "Tab" && !e.shiftKey){ e.preventDefault(); const s = ta.selectionStart; ta.setRangeText("  ", s, ta.selectionEnd, "end"); ta.dispatchEvent(new Event("input")); } });
  wrap.querySelector("[data-copy]").addEventListener("click", () => copyText(ta.value, ta));
  wrap._set = v => { ta.value = v; run(); onChange && onChange(v); };
  run();
}
function copyText(txt, fallbackEl){
  try { navigator.clipboard.writeText(txt).then(()=>toast("Copied"), ()=>{ fallbackEl && fallbackEl.select(); toast("Press Ctrl/⌘ + C to copy"); }); }
  catch(e){ fallbackEl && fallbackEl.select(); toast("Press Ctrl/⌘ + C to copy"); }
}

/* ---------- views ---------- */
const VIEWS = ["home", ...MODULES.map(m=>m.id), "capstones", "sandbox", "reference"];
let current = "home";
function renderTabs(){
  const nav = document.getElementById("tabs");
  const b = (id, label, dot) => `<button data-go="${id}" aria-current="${current===id}">${dot!==undefined?`<span class="dot ${dot?"ok":""}"></span>`:""}${label}</button>`;
  nav.innerHTML = b("home","Overview") + `<span class="sep"></span>` +
    MODULES.map((m,i)=>b(m.id, `${i+1}. ${m.title}`, modDone(m))).join("") + `<span class="sep"></span>` +
    b("capstones","Capstones") + b("sandbox","Sandbox") + b("reference","Reference");
}
function go(id, focus){
  if (!VIEWS.includes(id)) id = "home";
  current = id; renderTabs();
  const v = document.getElementById("view");
  CODE.length = 0;
  if (id === "home") v.innerHTML = viewHome();
  else if (id === "capstones") v.innerHTML = viewCapstones();
  else if (id === "sandbox") v.innerHTML = viewSandbox();
  else if (id === "reference") v.innerHTML = viewReference();
  else v.innerHTML = viewModule(MODULES.find(m=>m.id===id));
  bind(v, id);
  hydrateDiagrams(v);
  try { if (location.hash.slice(1) !== id) history.replaceState(null, "", "#"+id); } catch(e){}
  if (focus !== false) window.scrollTo({top:0});
  document.querySelector(`nav.tabs [data-go="${id}"]`)?.scrollIntoView({block:"nearest", inline:"center"});
}

      <details class="reveal"><summary>Want a quick text version too?</summary><p class="muted" style="margin-bottom:.6rem">Sketch the flow in Mermaid first, then rebuild it properly in draw.io.</p>${editorBlock(m.id, S.labCode[m.id] ?? `flowchart LR
  subgraph E["Employee"]
    s((Expense incurred)) --> p[Prepare claim] --> sub[Submit claim with receipts]
  end

    r[Review claim] --> g{Claim acceptable?}
  end
  sub --> r
  g -- No --> p
  %% TODO: Finance lane, policy check, payment, end events`)}</details>
    </div>`;
  }
  if (L.type === "redline"){
    const i = reg(D.bad);
    return `<div class="lab redline"><p>${esc(L.brief)}</p>
      <div class="canvas" data-mmd="${i}"><span class="loading">Rendering…</span></div>

    </div>`;
  }
  return "";
}

/* ---------- binding ---------- */
function bind(v, id){
  v.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));
  v.querySelectorAll("[data-src]").forEach(b => b.addEventListener("click", () => { const box = b.closest(".fig").querySelector(".srcbox"); box.hidden = !box.hidden; b.textContent = box.hidden ? "Source" : "Hide source"; }));
  v.querySelectorAll("[data-sandbox]").forEach(b => b.addEventListener("click", () => { S.sandbox = CODE[+b.dataset.sandbox]; save(); go("sandbox"); }));
  v.querySelectorAll('.toc a').forEach(a => a.addEventListener("click", e => { e.preventDefault(); document.getElementById(a.getAttribute("href").slice(1))?.scrollIntoView({behavior:"smooth", block:"start"}); }));

  if (id === "home"){
    const zc = v.querySelector("#zoomc"), zm = v.querySelector("#zoomm");
    const setZ = i => { v.querySelectorAll("[data-z]").forEach(b=>b.setAttribute("aria-pressed", +b.dataset.z===i)); draw(zc, ZOOM[i].code); zm.innerHTML = `<div><span class="k">For</span>${ZOOM[i].who}</div><div><span class="k">Answers</span>${ZOOM[i].q}</div>`; };
    v.querySelectorAll("[data-z]").forEach(b => b.addEventListener("click", () => setZ(+b.dataset.z)));
    setZ(0);
  }

  const m = MODULES.find(x=>x.id===id);
  if (m){
    v.querySelector("[data-read]").addEventListener("click", e => { S.read[m.id] = !S.read[m.id]; save(); e.target.classList.toggle("done", !!S.read[m.id]); e.target.textContent = S.read[m.id]?"✓ Marked as read":"Mark as read"; });
    v.querySelector("[data-labdone]").addEventListener("click", e => { S.lab[m.id] = !S.lab[m.id]; save(); e.target.classList.toggle("done", !!S.lab[m.id]); e.target.textContent = S.lab[m.id]?"✓ Lab complete":"Mark lab complete"; if (S.lab[m.id]) toast("Lab recorded"); });
    const form = v.querySelector("[data-quiz]");
    form.addEventListener("submit", e => {
      e.preventDefault(); let score = 0;
      m.quiz.forEach((q,qi) => {
        const fs = form.querySelectorAll("fieldset")[qi], sel = form.querySelector(`input[name="q${qi}"]:checked`);
        fs.querySelectorAll(".opt").forEach((o,oi) => { o.classList.remove("right","wrong"); if (oi===q.a) o.classList.add("right"); else if (sel && +sel.value===oi) o.classList.add("wrong"); });
        if (sel && +sel.value===q.a) score++;
        const w = fs.querySelector(".why"); w.hidden = false; w.innerHTML = `<b>${sel && +sel.value===q.a ? "Correct." : sel ? "Not quite." : "No answer."}</b> ${esc(q.why)}`;
      });
      form.querySelector("[data-score]").textContent = `${score} / ${m.quiz.length}`;
      S.quiz[m.id] = Math.max(S.quiz[m.id]||0, score); save();
      if (score >= 4) toast("Quiz passed");
    });
    form.querySelector("[data-reset]").addEventListener("click", () => { form.reset(); form.querySelectorAll(".opt").forEach(o=>o.classList.remove("right","wrong")); form.querySelectorAll(".why").forEach(w=>w.hidden=true); form.querySelector("[data-score]").textContent=""; });

    if (m.lab.type !== "redline"){
      bindEditor(v, m.id, val => { S.labCode[m.id] = val; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} });
    }
    if (m.lab.type === "mermaid"){
      v.querySelector("[data-resetlab]").addEventListener("click", () => v.querySelector(`[data-ed="${m.id}"]`)._set(m.lab.starter));
      const sol = v.querySelector("[data-solution]"); let drawn = false;
      sol.addEventListener("toggle", () => { if (sol.open && !drawn){ drawn = true; draw(sol.querySelector("[data-solcanvas]"), m.lab.solution); } });
      v.querySelector("[data-loadsol]").addEventListener("click", () => { v.querySelector(`[data-ed="${m.id}"]`)._set(m.lab.solution); toast("Solution loaded"); });
    }
    if (m.lab.type === "redline"){
      v.querySelector("[data-rlcheck]").addEventListener("click", () => {
        let found = 0, realN = 0, falseHits = 0;
        m.lab.items.forEach((it,ii) => {
          const li = v.querySelectorAll(".rl-item")[ii], on = li.querySelector("input").checked, note = li.querySelector(".rl-note");
          li.classList.remove("found","missed","false"); note.hidden = true;
          if (it.real){ realN++; if (on){ found++; li.classList.add("found"); } else li.classList.add("missed"); }
          else if (on){ falseHits++; li.classList.add("false"); note.hidden = false; note.textContent = it.note; }
        });
        v.querySelector("[data-rlscore]").textContent = `${found}/${realN} found${falseHits?`, ${falseHits} false alarm${falseHits>1?"s":""}`:""}`;
        if (found >= realN - 1 && !falseHits){ S.lab[m.id] = true; save(); const b = v.querySelector("[data-labdone]"); b.classList.add("done"); b.textContent = "✓ Lab complete"; toast("Sharp eyes"); }
      });
    }
  }

  if (id === "capstones"){
    v.querySelectorAll("[data-cap]").forEach(cb => cb.addEventListener("change", () => {
      const c = cb.dataset.cap, ri = +cb.dataset.ri; const arr = new Set(S.cap[c]||[]);
      cb.checked ? arr.add(ri) : arr.delete(ri); S.cap[c] = [...arr]; save();
      const card = cb.closest(".cap"), cap = CAPSTONES.find(x=>x.id===c);
      card.querySelector(".meterline").innerHTML = `<div class="bar"><i style="width:${arr.size/cap.rubric.length*100}%"></i></div>${arr.size}/${cap.rubric.length}`;
    }));
  }

  if (id === "sandbox"){
    bindEditor(v, "sandbox", val => { S.sandbox = val; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} });
    v.querySelector("[data-loadtpl]").addEventListener("click", () => v.querySelector('[data-ed="sandbox"]')._set(TEMPLATES[+v.querySelector("#tpl").value][1]));
  }

  if (id === "reference"){
    const ans = v.querySelector("#pickans");
    const setP = i => { const p = PICKER[i]; v.querySelectorAll("[data-pick]").forEach(b=>b.setAttribute("aria-pressed", +b.dataset.pick===i));
      ans.innerHTML = `<span class="eyebrow">Draw a</span><div class="big">${esc(p.d)}</div><div><span class="eyebrow">For</span><p>${esc(p.who)}</p></div><div><span class="eyebrow">Tip</span><p>${esc(p.tip)}</p></div>`; };
    v.querySelectorAll("[data-pick]").forEach(b => b.addEventListener("click", () => setP(+b.dataset.pick)));
    setP(0);
  }
}

document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) go(b.dataset.go); });
updateMeter();
go((location.hash || "#home").slice(1), false);
</script>
