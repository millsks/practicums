/* ---------- Tokens ---------- */
:root {
  --bg: #ffffff;
  --bg-elev: #ffffff;
  --bg-sunk: #f2f2f2;
  --bg-code: #f6f6f6;
  --fg: #111111;
  --fg-muted: #555555;
  --fg-faint: #8a8a8a;
  --border: #e2e2e2;
  --border-strong: #c4c4c4;
  --accent: #4b7a00;
  --accent-fg: #ffffff;
  --accent-soft: #eef6e0;
  --py-blue: #3670a0;
  --py-yellow: #f2c53d;
  --ok: #1f8a4c;
  --ok-soft: #e3f4ea;
  --bad: #c2382f;
  --bad-soft: #fbe8e6;
  --warn: #a86400;
  --warn-soft: #fdf1dc;
  --note: #4b7a00;
  --note-soft: #eef6e0;
  --v314: #0f7b8a;
  --v314-soft: #ddf3f5;
  --v315: #8a3ffc;
  --v315-soft: #f1e8ff;
  --pixi: #c2410c;
  --pixi-soft: #fdeee6;
  /* syntax */
  --tok-comment: #7d8590;
  --tok-keyword: #a626a4;
  --tok-string: #2f7d32;
  --tok-number: #b35c00;
  --tok-function: #2f5fbf;
  --tok-builtin: #0e7490;
  --tok-operator: #4b5563;
  --tok-decorator: #b45309;
  --tok-class: #9a3412;
  /* viz palette */
  --viz-1: #4b7a00;
  --viz-2: #e08a00;
  --viz-3: #1f8a4c;
  --viz-4: #c2382f;
  --viz-5: #8a3ffc;
  --viz-6: #0f7b8a;
  --viz-node: #ffffff;
  --viz-edge: #9aa1ad;
  --viz-active: #76b900;
  --viz-done: #cfe8a3;

  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 1px 2px rgba(20, 20, 30, 0.06), 0 4px 16px rgba(20, 20, 30, 0.05);
  --font-sans: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --header-h: 56px;
  --sidebar-w: 300px;
  --content-w: 820px;
  color-scheme: light;
}

    --tok-builtin: #56c7d9;
    --tok-operator: #b4bccb;
    --tok-decorator: #f0b04a;
    --tok-class: #ffab70;
    --viz-1: #76b900;
    --viz-2: #f0b04a;

    --viz-4: #ff7b72;

    --viz-6: #4fd1df;
    --viz-node: #1a1a1a;
    --viz-edge: #5d6574;

    --viz-done: #2e4a0a;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 16px rgba(0, 0, 0, 0.3);

}

:root[data-theme="dark"] {
  --bg: #000000;
  --bg-elev: #111111;
  --bg-sunk: #0a0a0a;
  --bg-code: #141414;
  --fg: #f2f2f2;

  --accent-fg: #000000;
  --accent-soft: #1c2a08;

  --pixi-soft: #3a2010;
  --tok-comment: #7f8896;
  --tok-keyword: #d68cf0;

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--header-h) + 16px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.7 var(--font-sans);
  overflow-x: hidden;
}
a { color: var(--accent); text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
img, svg, canvas { max-width: 100%; }
h1, h2, h3, h4 { line-height: 1.25; letter-spacing: -0.015em; }
h1 { font-size: clamp(2rem, 4vw, 2.6rem); margin: 0.2em 0 0.3em; font-weight: 800; }
h2 { font-size: 1.6rem; margin: 2.2em 0 0.6em; font-weight: 700; }
h3 { font-size: 1.2rem; margin: 1.8em 0 0.5em; font-weight: 650; }
h4 { font-size: 1rem; margin: 1.4em 0 0.4em; }
p, ul, ol { margin: 0 0 1em; }
li + li { margin-top: 0.25em; }
hr { border: 0; border-top: 1px solid var(--border); margin: 2.5em 0; }
table { border-collapse: collapse; width: 100%; margin: 1em 0 1.5em; font-size: 0.93rem; display: block; overflow-x: auto; }
th, td { border: 1px solid var(--border); padding: 0.5em 0.75em; text-align: left; vertical-align: top; }
th { background: var(--bg-sunk); font-weight: 600; }
kbd {
  font-family: var(--font-mono); font-size: 0.82em; padding: 0.1em 0.45em;
  border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px; background: var(--bg-elev);
}
code { font-family: var(--font-mono); font-size: 0.88em; }
:not(pre) > code {
  background: var(--bg-sunk); border: 1px solid var(--border); padding: 0.08em 0.35em; border-radius: 4px;
  overflow-wrap: anywhere;
}
pre {
  font-family: var(--font-mono); font-size: 0.86rem; line-height: 1.6;
  background: var(--bg-code); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 1em 1.1em; overflow-x: auto; margin: 0 0 1.2em; position: relative; tab-size: 4;
}
pre code { background: none; border: 0; padding: 0; font-size: inherit; }
dfn { font-style: normal; font-weight: 600; border-bottom: 1px dotted var(--fg-muted); }
mark { background: color-mix(in srgb, var(--py-yellow) 45%, transparent); color: inherit; padding: 0 0.15em; border-radius: 3px; }
button { font: inherit; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Syntax tokens (Prism) ---------- */
.token.comment, .token.prolog, .token.doctype, .token.cdata { color: var(--tok-comment); font-style: italic; }
.token.keyword, .token.important, .token.atrule { color: var(--tok-keyword); }
.token.string, .token.char, .token.attr-value, .token.triple-quoted-string, .token.string-interpolation { color: var(--tok-string); }
.token.interpolation { color: var(--fg); }
.token.number, .token.boolean, .token.constant { color: var(--tok-number); }
.token.function { color: var(--tok-function); }
.token.builtin { color: var(--tok-builtin); }
.token.operator, .token.punctuation { color: var(--tok-operator); }
.token.decorator, .token.annotation { color: var(--tok-decorator); }
.token.class-name { color: var(--tok-class); }
.token.property, .token.key, .token.table { color: var(--tok-function); }

/* ---------- App shell ---------- */
.pp-header {
  position: sticky; top: 0; z-index: 50; height: var(--header-h);
  display: flex; align-items: center; gap: 12px; padding: 0 16px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.pp-brand { display: flex; align-items: center; gap: 10px; font-weight: 800; color: var(--fg); text-decoration: none; white-space: nowrap; }
.pp-brand .logo { width: 28px; height: 28px; flex: none; }
.pp-brand small { font-weight: 500; color: var(--fg-muted); font-size: 0.8rem; }
.pp-header .spacer { flex: 1; }
.pp-progress-pill {
  font-size: 0.8rem; color: var(--fg-muted); border: 1px solid var(--border); border-radius: 999px;
  padding: 0.2em 0.75em; white-space: nowrap; background: var(--bg-elev);
}
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; flex: none;
  border: 1px solid var(--border); border-radius: 8px; background: var(--bg-elev); color: var(--fg); cursor: pointer;
}
.icon-btn:hover { border-color: var(--border-strong); }
.icon-btn svg { width: 18px; height: 18px; }
.pp-menu-btn { display: none; }

.pp-layout { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: calc(100vh - var(--header-h)); }
.pp-sidebar {
  position: sticky; top: var(--header-h); height: calc(100vh - var(--header-h)); overflow-y: auto;
  border-right: 1px solid var(--border); padding: 16px 12px 40px; background: var(--bg); font-size: 0.9rem;
}
.pp-sidebar .part { margin-bottom: 4px; }
.pp-sidebar .part > button {
  width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; background: none; border: 0;
  padding: 8px; border-radius: 8px; cursor: pointer; color: var(--fg); font-weight: 650; font-size: 0.86rem;
}
.pp-sidebar .part > button:hover { background: var(--bg-sunk); }
.pp-sidebar .part > button .num {
  display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px;
  background: var(--accent-soft); color: var(--accent); font-size: 0.75rem; flex: none;
}
.pp-sidebar .part > button .chev { margin-left: auto; transition: transform 0.15s; color: var(--fg-faint); }
.pp-sidebar .part.open > button .chev { transform: rotate(90deg); }
.pp-sidebar ul { list-style: none; margin: 0; padding: 0 0 6px 18px; display: none; }
.pp-sidebar .part.open ul { display: block; }
.pp-sidebar li { margin: 0; }
.pp-sidebar li a {
  display: flex; gap: 8px; align-items: baseline; padding: 5px 8px; border-radius: 6px;
  color: var(--fg-muted); text-decoration: none; line-height: 1.35;
}
.pp-sidebar li a:hover { background: var(--bg-sunk); color: var(--fg); }
.pp-sidebar li a.current { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.pp-sidebar li a .mid { font-family: var(--font-mono); font-size: 0.72rem; color: var(--fg-faint); flex: none; width: 2.2em; }
.pp-sidebar li a .done { margin-left: auto; color: var(--ok); flex: none; }
.pp-sidebar .side-title { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-faint); margin: 18px 8px 6px; }

.pp-main { padding: 32px 16px 80px; min-width: 0; }
.pp-content-wrap { display: grid; grid-template-columns: minmax(0, var(--content-w)) 220px; gap: 48px; justify-content: center; }
.pp-toc { position: sticky; top: calc(var(--header-h) + 24px); align-self: start; font-size: 0.82rem; max-height: calc(100vh - 120px); overflow-y: auto; }
.pp-toc h4 { margin: 0 0 8px; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-faint); }
.pp-toc a { display: block; color: var(--fg-muted); text-decoration: none; padding: 3px 0 3px 10px; border-left: 2px solid var(--border); line-height: 1.35; }
.pp-toc a.active { color: var(--accent); border-left-color: var(--accent); }
.pp-toc a:hover { color: var(--fg); }

@media (max-width: 1240px) {
  .pp-content-wrap { grid-template-columns: minmax(0, var(--content-w)); }
  .pp-toc { display: none; }
}
@media (max-width: 900px) {
  .pp-layout { grid-template-columns: minmax(0, 1fr); }
  .pp-menu-btn { display: inline-flex; }
  .pp-sidebar {
    position: fixed; left: 0; top: var(--header-h); width: min(86vw, 320px); z-index: 40;
    transform: translateX(-102%); transition: transform 0.2s ease; box-shadow: var(--shadow); background: var(--bg-elev);
  }
  body.nav-open .pp-sidebar { transform: none; }
  .pp-brand small, .pp-progress-pill { display: none; }
}

/* ---------- Lesson ---------- */
.lesson { max-width: var(--content-w); min-width: 0; }
.lesson-hero { padding-bottom: 1.2em; border-bottom: 1px solid var(--border); margin-bottom: 1em; }
.eyebrow { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); margin: 0; }
.lede { font-size: 1.15rem; color: var(--fg-muted); }
.lesson-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 0.85rem; color: var(--fg-muted); margin: 0.5em 0 1em; }
.lesson-meta span { display: inline-flex; gap: 6px; align-items: center; }
.objectives {
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); padding: 1em 1.2em 1em 2.4em; margin: 1em 0;
}
.objectives::before { content: "By the end of this module you will be able to"; display: block; margin: 0 0 0.4em -1.2em; font-weight: 700; font-size: 0.9rem; }
.lesson-section { scroll-margin-top: calc(var(--header-h) + 16px); }
.lesson-section > h2:first-child { padding-top: 0.6em; border-top: 1px solid var(--border); }
.lesson-hero + .lesson-section > h2:first-child { border-top: 0; }
.figure { margin: 1.5em 0; text-align: center; }
.figure figcaption, .caption { font-size: 0.85rem; color: var(--fg-muted); margin-top: 0.5em; }
.diagram { display: block; margin: 1.2em auto; max-width: 100%; height: auto; }
.diagram text { font-family: var(--font-sans); fill: var(--fg); }
.diagram .mono { font-family: var(--font-mono); }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 700px) { .two-col { grid-template-columns: 1fr; } }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin: 1em 0 1.5em; }
.card { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); padding: 1em 1.1em; }
.card h4 { margin-top: 0; }
.tag {
  display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 0.15em 0.55em; border-radius: 999px;
  background: var(--bg-sunk); color: var(--fg-muted); border: 1px solid var(--border); vertical-align: middle;
}
.tag.v314 { background: var(--v314-soft); color: var(--v314); border-color: transparent; }
.tag.v315 { background: var(--v315-soft); color: var(--v315); border-color: transparent; }
.tag.pixi { background: var(--pixi-soft); color: var(--pixi); border-color: transparent; }

/* ---------- Callouts ---------- */
.callout {
  --c: var(--note); --c-soft: var(--note-soft);
  border: 1px solid color-mix(in srgb, var(--c) 30%, transparent); border-left: 4px solid var(--c);
  background: var(--c-soft); border-radius: var(--radius-sm); padding: 0.85em 1.1em; margin: 1.2em 0;
}
.callout > :last-child { margin-bottom: 0; }
.callout::before { display: block; font-weight: 700; font-size: 0.8rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--c); margin-bottom: 0.3em; }
.callout.note::before { content: "Note"; }
.callout.tip { --c: var(--ok); --c-soft: var(--ok-soft); }
.callout.tip::before { content: "Tip"; }
.callout.warn { --c: var(--warn); --c-soft: var(--warn-soft); }
.callout.warn::before { content: "Watch out"; }
.callout.danger { --c: var(--bad); --c-soft: var(--bad-soft); }
.callout.danger::before { content: "Common bug"; }
.callout.py314 { --c: var(--v314); --c-soft: var(--v314-soft); }
.callout.py314::before { content: "New in Python 3.14"; }
.callout.py315 { --c: var(--v315); --c-soft: var(--v315-soft); }
.callout.py315::before { content: "Preview · Python 3.15"; }
.callout.pixi { --c: var(--pixi); --c-soft: var(--pixi-soft); }
.callout.pixi::before { content: "Pixi"; }
.callout.pro { --c: var(--accent); --c-soft: var(--accent-soft); }
.callout.pro::before { content: "Pro practice"; }
.callout.think { --c: var(--py-blue); --c-soft: var(--accent-soft); }
.callout.think::before { content: "Think about it"; }
.callout[data-title]::before { content: attr(data-title); }

/* ---------- Widgets: shared ---------- */
.widget {
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius);
  margin: 1.4em 0; box-shadow: var(--shadow); overflow: hidden;
}
.widget-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 0.55em 0.9em;
  border-bottom: 1px solid var(--border); background: var(--bg-sunk); font-size: 0.85rem;
}
.widget-head .w-title { font-weight: 650; }
.widget-head .w-kind { font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-faint); font-weight: 700; }
.widget-head .spacer { flex: 1; }
.widget-body { padding: 0.9em; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-strong); background: var(--bg-elev);
  color: var(--fg); border-radius: 7px; padding: 0.32em 0.8em; font-size: 0.84rem; font-weight: 600; cursor: pointer; line-height: 1.4;
}
.btn:hover { border-color: var(--fg-faint); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.small { padding: 0.18em 0.6em; font-size: 0.78rem; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.status { font-size: 0.8rem; color: var(--fg-muted); }

/* code editor */
.editor-host { border-bottom: 1px solid var(--border); background: var(--bg-code); }
.editor-host textarea {
  display: block; width: 100%; min-height: 8em; border: 0; resize: vertical; padding: 0.9em;
  font: 0.86rem/1.6 var(--font-mono); background: var(--bg-code); color: var(--fg); tab-size: 4;
}
.CodeMirror {
  height: auto; min-height: 3em; font-family: var(--font-mono); font-size: 0.86rem; line-height: 1.6;
  background: var(--bg-code); color: var(--fg);
}
.CodeMirror-scroll { max-height: 560px; min-height: 3em; }
.CodeMirror-gutters { background: var(--bg-code); border-right: 1px solid var(--border); }
.CodeMirror-linenumber { color: var(--fg-faint); }
.CodeMirror-cursor { border-left: 2px solid var(--accent); }
.CodeMirror-selected, .CodeMirror-focused .CodeMirror-selected { background: color-mix(in srgb, var(--accent) 22%, transparent) !important; }
.CodeMirror-activeline-background { background: color-mix(in srgb, var(--accent) 6%, transparent); }

<script type="application/json" id="pp-data">{"curriculum":{"title":"Kubernetes Practicum","python":"3.14","badge":"kind on your Mac","parts":[{"id":"part0","number":0,"title":"Orientation","level":"Start here","summary":"Install the toolchain, start Colima, create a three-node kind cluster, and see where Docker ends and containerd begins.","modules":[{"id":"m00","title":"Your Mac Lab: Colima and kind","href":"modules/m00-mac-lab.html","minutes":90,"summary":"How this practicum works, the toolchain, Colima and kind, Docker vs containerd, the primer cluster, and keeping it healthy."}],"projects":[]},{"id":"part1","number":1,"title":"Stage 1 · Foundations","level":"Level 1 · Novice","summary":"How Kubernetes thinks, the Pod, and the controllers that keep Pods running: Deployments, rollouts, and the other workload kinds.","modules":[{"id":"m01","title":"How Kubernetes Thinks","href":"modules/m01-how-kubernetes-thinks.html","minutes":120,"summary":"The control plane and nodes, the API and its objects, desired vs actual state, controllers and reconciliation, and the kubectl verbs you use daily."},{"id":"m02","title":"Pods","href":"modules/m02-pods.html","minutes":150,"summary":"Pod anatomy, the lifecycle, probes, requests and limits and QoS, init containers and native sidecars, security context, and debugging a Pod."},{"id":"m03","title":"Deployments and Workloads","href":"modules/m03-deployments-and-workloads.html","minutes":150,"summary":"ReplicaSets and Deployments, label selectors, rolling updates and rollbacks, maxSurge and maxUnavailable, and when to use a StatefulSet, DaemonSet, Job, or CronJob."}],"projects":[]}],"reference":[{"id":"ref-roadmap","title":"Roadmap","href":"reference/roadmap.html","summary":"Stages 2-4 (networking, packaging and scaling, production) and the GitOps capstone."},{"id":"ref-kubelab","title":"kubelab Reference","href":"reference/kubelab.html","summary":"Every kubelab helper used in lessons and lab checks: manifests, quantities, selectors, validation, workloads, kind configs, and lint."},{"id":"ref-cheatsheet","title":"kubectl and kind Cheat Sheet","href":"reference/cheatsheet.html","summary":"The commands, fields, and Pod states from Stage 1 on one page."},{"id":"ref-glossary","title":"Glossary","href":"reference/glossary.html","summary":"Terms used in the course, with links to where each is taught."}]},"pages":{"index.html":{"id":"home","kind":"home","title":"Kubernetes Practicum","html":"\u003cheader class=\"home-hero\">\n    \u003cp class=\"eyebrow\">kind · Colima · kubectl · Pixi\u003c/p>\n    \u003ch1>Kubernetes Practicum\u003c/h1>\n    \u003cp class=\"lede\">Learn Kubernetes from your first Pod to a platform deployed entirely from Git, on a real\n      three-node cluster running on your Mac. You write every manifest and every tool yourself. The course explains\n      the ideas, drills them with exercises in the browser, and checks your work in labs. It never hands you the\n      answers.\u003c/p>\n    \u003cdiv class=\"btn-row\">\n      \u003ca class=\"btn primary\" href=\"modules/m00-mac-lab.html\">Start with Module 00 →\u003c/a>\n      \u003ca class=\"btn\" href=\"modules/m03-deployments-and-workloads.html\">Jump to Deployments\u003c/a>\n      \u003ca class=\"btn\" href=\"reference/roadmap.html\">See the roadmap\u003c/a>\n    \u003c/div>\n  \u003c/header>\n\n  \u003csection class=\"lesson-section\" id=\"progress\">\n    \u003ch2>Your progress\u003c/h2>\n    \u003cdiv class=\"card-grid\" id=\"progress-stats\">\u003c/div>\n    \u003cp class=\"status\">Progress, exercise code, quiz scores, and notes are saved in this browser. Export a backup or move to another computer:\u003c/p>\n    \u003cdiv class=\"btn-row\">\n      \u003cbutton class=\"btn small\" id=\"export-progress\" type=\"button\">Export progress\u003c/button>\n      \u003clabel class=\"btn small\">Import progress\u003cinput type=\"file\" id=\"import-progress\" accept=\"application/json\" class=\"visually-hidden\">\u003c/label>\n      \u003cspan class=\"status\" id=\"progress-message\" aria-live=\"polite\">\u003c/span>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"how\">\n    \u003ch2>How this course works\u003c/h2>\n    \u003cdiv class=\"card-grid\">\n      \u003cdiv class=\"card\">\u003ch4>1 · Read and try\u003c/h4>\u003cp>Lessons mix explanation, diagrams, and step-through visualizers with \u003cstrong>runnable Python cells\u003c/strong> that use \u003ccode>kubelab\u003c/code>, a small library that reads manifests and reasons about them the way the control plane does.\u003c/p>\u003c/div>\n      \u003cdiv class=\"card\">\u003ch4>2 · Practice\u003c/h4>\u003cp>\u003cstrong>Graded exercises\u003c/strong> in every module check your code in the page, with hints and a reference answer for the small in-page tasks.\u003c/p>\u003c/div>\n      \u003cdiv class=\"card\">\u003ch4>3 · Build in labs\u003c/h4>\u003cp>Each module ends with \u003cstrong>labs\u003c/strong> on your Mac: \u003ccode>pixi run start m02-lab1\u003c/code>, write the manifest or tool, then \u003ccode>pixi run grade m02-lab1\u003c/code>.\u003c/p>\u003c/div>\n      \u003cdiv class=\"card\">\u003ch4>4 · No answer key\u003c/h4>\u003cp>Labs ship \u003cstrong>without solutions\u003c/strong>. Their checks are the specification, and CI proves every untouched starter fails, so a green grade means you built it.\u003c/p>\u003c/div>\n      \u003cdiv class=\"card\">\u003ch4>5 · Run it for real\u003c/h4>\u003cp>Offline checks run in seconds. Optional \u003cstrong>live checks\u003c/strong> (\u003ccode>pixi run grade-live &lt;lab&gt;\u003c/code>) apply your work to your kind cluster and wait for it to be healthy.\u003c/p>\u003c/div>\n      \u003cdiv class=\"card\">\u003ch4>6 · All local\u003c/h4>\u003cp>Everything runs on a MacBook: Colima for the Linux VM, kind for a three-node cluster, and Pixi for pinned tools. No cloud account needed.\u003c/p>\u003c/div>\n    \u003c/div>\n    \u003cpre class=\"mermaid\">\nflowchart LR\n  O[0 · Your Mac lab] --> S1[Stage 1 · Foundations] --> S2[Stage 2 · Networking and state] --> S3[Stage 3 · Packaging and scaling] --> S4[Stage 4 · Production] --> C[Capstone · GitOps platform]\n    \u003c/pre>\n    \u003caside class=\"callout note\">\n      \u003cp>\u003cstrong>Stage 1 is available now:\u003c/strong> your Mac lab, how Kubernetes thinks, Pods, and Deployments.\n        Networking, Helm, autoscaling, security, observability, GitOps with Argo CD, and the capstone follow on the\n        \u003ca href=\"reference/roadmap.html\">roadmap\u003c/a>.\u003c/p>\n    \u003c/aside>\n    \u003caside class=\"callout pixi\">\n      \u003cp>All local work uses \u003ca href=\"https://pixi.sh\">Pixi\u003c/a>. From the repository root: \u003ccode>pixi install\u003c/code>\n        once, \u003ccode>pixi run serve\u003c/code> to open this site, \u003ccode>pixi run labs\u003c/code> to list labs,\n        \u003ccode>pixi run start &lt;lab&gt;\u003c/code> to copy a starter into \u003ccode>work/\u003c/code>, and\n        \u003ccode>pixi run grade &lt;lab&gt;\u003c/code> to check it.\u003c/p>\n    \u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"curriculum\">\n    \u003ch2>Curriculum\u003c/h2>\n    \u003cdiv id=\"curriculum-map\">\u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"reference\">\n    \u003ch2>Reference\u003c/h2>\n    \u003cdiv class=\"card-grid\">\n      \u003ca class=\"card\" href=\"reference/roadmap.html\">\u003ch4>Roadmap\u003c/h4>\u003cp>Stages 2–4 and the GitOps capstone.\u003c/p>\u003c/a>\n      \u003ca class=\"card\" href=\"reference/kubelab.html\">\u003ch4>kubelab Reference\u003c/h4>\u003cp>Every helper used in lessons and lab checks.\u003c/p>\u003c/a>\n      \u003ca class=\"card\" href=\"reference/cheatsheet.html\">\u003ch4>kubectl and kind Cheat Sheet\u003c/h4>\u003cp>Commands, rollouts, and Pod states on one page.\u003c/p>\u003c/a>\n      \u003ca class=\"card\" href=\"reference/glossary.html\">\u003ch4>Glossary\u003c/h4>\u003cp>Terms with links to where they're taught.\u003c/p>\u003c/a>\n    \u003c/div>\n  \u003c/section>","exercises":[],"quizzes":[],"checklists":{}},"modules/m00-mac-lab.html":{"id":"m00","kind":"module","title":"M00 · Your Mac Lab: Colima and kind · Kubernetes Practicum","html":"\u003cheader class=\"lesson-hero\">\n    \u003cp class=\"eyebrow\">Orientation · Module 00\u003c/p>\n    \u003ch1>Your Mac Lab: Colima and kind\u003c/h1>\n    \u003cp class=\"lede\">Every lab in this course runs on a real Kubernetes cluster on your MacBook. This module builds\n      that lab: a small Linux VM (Colima), a Docker engine inside it, and a three-node cluster made of containers\n      (kind). Along the way you'll learn exactly where Docker stops and containerd starts, which explains half the\n      \"it works on my laptop\" puzzles you'll meet later.\u003c/p>\n    \u003cdiv class=\"lesson-meta\">\u003cspan>⏱ ~1.5 hours\u003c/span>\u003cspan>Prerequisites: a Mac with Homebrew, comfort in a terminal\u003c/span>\u003c/div>\n    \u003cul class=\"objectives\">\n      \u003cli>Explain how this practicum works: lessons, graded exercises, labs, and grading with Pixi\u003c/li>\n      \u003cli>Install the toolchain and start a Colima VM sized for the whole course\u003c/li>\n      \u003cli>Explain why kind needs Docker but your Pods run on containerd, and move an image between them\u003c/li>\n      \u003cli>Write a kind cluster config with two workers and a port mapping, and validate it before using it\u003c/li>\n      \u003cli>Create, inspect, pause, and delete the \u003ccode>primer\u003c/code> cluster\u003c/li>\n      \u003cli>Fix the most common local-cluster problems: inotify limits, memory, and port clashes\u003c/li>\n    \u003c/ul>\n  \u003c/header>\n\n  \u003csection class=\"lesson-section\" id=\"how-it-works\">\n    \u003ch2>How this practicum works\u003c/h2>\n    \u003cp>Each module has four parts. You \u003cstrong>read\u003c/strong> an explanation with diagrams, tables, and small\n      Python cells that run in your browser. You \u003cstrong>practice\u003c/strong> with graded exercises in the page. You\n      \u003cstrong>build\u003c/strong> in a lab on your own machine. Then you \u003cstrong>check\u003c/strong> yourself with a quiz.\u003c/p>\n    \u003cdiv class=\"card-grid\">\n      \u003cdiv class=\"card\">\u003ch4>Python in the page\u003c/h4>\u003cp>Cells run real CPython (Pyodide) in your browser. They use\n        \u003ccode>kubelab\u003c/code>, a small library that reads YAML manifests, parses quantities like \u003ccode>128Mi\u003c/code>,\n        matches label selectors, and validates objects the way the API server would. It never talks to a cluster.\u003c/p>\u003c/div>\n      \u003cdiv class=\"card\">\u003ch4>Labs on your Mac\u003c/h4>\u003cp>Labs live in the \u003ccode>kubernetes-practicum\u003c/code> repository.\n        \u003ccode>pixi run start m00-lab1\u003c/code> copies a starter into \u003ccode>work/\u003c/code>; you edit it;\n        \u003ccode>pixi run grade m00-lab1\u003c/code> checks it.\u003c/p>\u003c/div>\n      \u003cdiv class=\"card\">\u003ch4>No answer key\u003c/h4>\u003cp>Labs ship \u003cstrong>without solutions\u003c/strong>. The checks are the\n        specification, and the repository's CI proves every untouched starter fails, so a pass means you built it.\u003c/p>\u003c/div>\n      \u003cdiv class=\"card\">\u003ch4>Live checks\u003c/h4>\u003cp>Most checks are offline and run in seconds. Optional live checks\n        (\u003ccode>pixi run grade-live &lt;lab&gt;\u003c/code>) apply your work to your kind cluster and wait for it to be\n        healthy.\u003c/p>\u003c/div>\n    \u003c/div>\n    \u003cpre data-label=\"Terminal\">\u003ccode class=\"language-bash\">git clone https://github.com/millsks/kubernetes-practicum.git\ncd kubernetes-practicum\npixi install            # Python 3.14, kubelab, kubectl and helm (conda-forge)\npixi run serve          # this site at http://127.0.0.1:8000/\npixi run labs           # list labs and whether you've started them\u003c/code>\u003c/pre>\n    \u003caside class=\"callout tip\">\u003cp>\u003cstrong>Remember:\u003c/strong> read and try in the page, build in a lab, grade with\n      Pixi. A green grade is the only \"done\" that counts.\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"toolchain\">\n    \u003ch2>The toolchain\u003c/h2>\n    \u003cp>You need a handful of tools. Homebrew installs the ones that talk to macOS; Pixi installs the ones the course\n      checks rely on, pinned to versions that are tested together.\u003c/p>\n    \u003cdiv class=\"scroll\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>Tool\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Install with\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>\u003ccode>colima\u003c/code>\u003c/td>\u003ctd>Runs a small Linux VM using Apple's Virtualization.framework, with a Docker engine inside\u003c/td>\u003ctd>Homebrew\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>docker\u003c/code> (CLI only)\u003c/td>\u003ctd>Talks to Colima's Docker engine; builds images\u003c/td>\u003ctd>Homebrew\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>kind\u003c/code>\u003c/td>\u003ctd>Kubernetes IN Docker: each cluster node is a container\u003c/td>\u003ctd>Homebrew\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>kubectl\u003c/code>\u003c/td>\u003ctd>The Kubernetes command-line client\u003c/td>\u003ctd>Pixi (Apple Silicon); Homebrew on Intel Macs\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>helm\u003c/code>\u003c/td>\u003ctd>Kubernetes package manager (from Stage 3)\u003c/td>\u003ctd>Pixi\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>k9s\u003c/code>\u003c/td>\u003ctd>Terminal UI that shows the cluster live\u003c/td>\u003ctd>Homebrew (optional)\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n    \u003cpre data-label=\"Terminal\">\u003ccode class=\"language-bash\">brew install colima docker kind k9s\n# Docker Desktop is not needed. If it's installed, quit it so only one engine runs.\u003c/code>\u003c/pre>\n    \u003caside class=\"callout pixi\">\u003cp>Inside the repository, run tools through Pixi so you get the tested versions:\n      \u003ccode>pixi run kubectl get nodes\u003c/code>, or open a shell with them on your PATH using \u003ccode>pixi shell\u003c/code>.\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"colima\">\n    \u003ch2>Colima: a Linux machine inside your Mac\u003c/h2>\n    \u003cp>Containers are a Linux feature: they're ordinary processes that the Linux kernel isolates with\n      \u003cstrong>namespaces\u003c/strong> (what a process can see) and \u003cstrong>cgroups\u003c/strong> (how much CPU and memory it\n      may use). macOS has a different kernel, so to run Linux containers you need a Linux kernel somewhere. Colima\n      starts a lightweight Linux virtual machine and runs a Docker engine in it. Your \u003ccode>docker\u003c/code> CLI on\n      macOS sends commands into that VM.\u003c/p>\n    \u003cpre data-label=\"Terminal\">\u003ccode class=\"language-bash\">colima start --cpu 4 --memory 8 --disk 60 --vm-type vz --mount-type virtiofs\ndocker context use colima\ndocker info --format '{{.ServerVersion}} {{.Architecture}}'\u003c/code>\u003c/pre>\n    \u003cdiv class=\"scroll\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>Flag\u003c/th>\u003cth>Why this value\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>\u003ccode>--cpu 4\u003c/code>\u003c/td>\u003ctd>Three nodes plus the system Pods; four cores keeps rollouts snappy\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>--memory 8\u003c/code>\u003c/td>\u003ctd>Enough for every stage, including Prometheus and Grafana in Stage 4. 6 GB is fine for Stages 1–2\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>--disk 60\u003c/code>\u003c/td>\u003ctd>Images and volumes add up; the disk grows only as it's used\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>--vm-type vz\u003c/code>\u003c/td>\u003ctd>Apple's native hypervisor: faster and lighter than QEMU\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>--mount-type virtiofs\u003c/code>\u003c/td>\u003ctd>Fast file sharing between macOS and the VM\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n    \u003caside class=\"callout note\">\u003cp>On an Apple Silicon Mac the VM is \u003cstrong>arm64\u003c/strong>, so nodes, Pods, and\n      the images you build are arm64 too. Every image in this course is multi-architecture. For an amd64-only\n      image, restart Colima with \u003ccode>--vz-rosetta\u003c/code> and pull with \u003ccode>--platform linux/amd64\u003c/code>.\u003c/p>\u003c/aside>\n    \u003caside class=\"callout think\">\u003cp>Colima stops when your Mac sleeps or restarts. Before you read on: what do you\n      expect happens to your kind cluster then? (The answer is in \u003ca href=\"#lifecycle\">Day to day\u003c/a>.)\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"runtimes\">\n    \u003ch2>Docker vs containerd: who runs what\u003c/h2>\n    \u003cp>This setup has two container runtimes, and they work at different layers. Getting this straight now saves\n      hours later.\u003c/p>\n    \u003cfigure class=\"figure\">\n      \u003csvg class=\"diagram\" viewBox=\"0 0 760 250\" role=\"img\" aria-label=\"Docker creates node containers; inside each node kubelet talks to containerd\">\n        \u003crect x=\"10\" y=\"10\" width=\"740\" height=\"230\" rx=\"10\" fill=\"none\" stroke=\"var(--fg-muted)\" stroke-dasharray=\"5 4\"/>\n        \u003ctext x=\"24\" y=\"30\" font-size=\"13\" font-weight=\"600\" fill=\"var(--fg-muted)\">Colima VM (Linux)\u003c/text>\n        \u003crect x=\"30\" y=\"60\" width=\"170\" height=\"60\" rx=\"8\" fill=\"var(--fg)\" />\n        \u003ctext x=\"115\" y=\"86\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"var(--bg)\">Docker engine\u003c/text>\n        \u003ctext x=\"115\" y=\"104\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--bg)\">docker build · kind create\u003c/text>\n        \u003crect x=\"240\" y=\"40\" width=\"495\" height=\"185\" rx=\"10\" fill=\"var(--bg-sunk)\" stroke=\"var(--border-strong)\"/>\n        \u003ctext x=\"254\" y=\"60\" font-size=\"13\" font-weight=\"600\" fill=\"var(--fg)\">kind node container (e.g. primer-worker)\u003c/text>\n        \u003crect x=\"260\" y=\"80\" width=\"140\" height=\"50\" rx=\"8\" fill=\"var(--bg-elev)\" stroke=\"var(--border-strong)\"/>\n        \u003ctext x=\"330\" y=\"102\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fg)\">kubelet\u003c/text>\n        \u003ctext x=\"330\" y=\"119\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--fg-muted)\">node agent\u003c/text>\n        \u003crect x=\"430\" y=\"80\" width=\"140\" height=\"50\" rx=\"8\" fill=\"var(--accent)\"/>\n        \u003ctext x=\"500\" y=\"102\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--accent-fg)\">containerd\u003c/text>\n        \u003ctext x=\"500\" y=\"119\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--accent-fg)\">CRI runtime\u003c/text>\n        \u003crect x=\"600\" y=\"74\" width=\"115\" height=\"30\" rx=\"6\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"/>\n        \u003ctext x=\"657\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--fg)\">Pod A\u003c/text>\n        \u003crect x=\"600\" y=\"112\" width=\"115\" height=\"30\" rx=\"6\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"/>\n        \u003ctext x=\"657\" y=\"132\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--fg)\">Pod B\u003c/text>\n        \u003crect x=\"430\" y=\"160\" width=\"140\" height=\"50\" rx=\"8\" fill=\"var(--bg-elev)\" stroke=\"var(--border-strong)\"/>\n        \u003ctext x=\"500\" y=\"182\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fg)\">image store\u003c/text>\n        \u003ctext x=\"500\" y=\"199\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--fg-muted)\">kind load lands here\u003c/text>\n        \u003cline x1=\"200\" y1=\"90\" x2=\"238\" y2=\"90\" stroke=\"var(--fg)\" stroke-width=\"1.5\"/>\n        \u003cline x1=\"400\" y1=\"105\" x2=\"428\" y2=\"105\" stroke=\"var(--accent)\" stroke-width=\"2\"/>\n        \u003cline x1=\"570\" y1=\"95\" x2=\"598\" y2=\"90\" stroke=\"var(--accent)\" stroke-width=\"2\"/>\n        \u003cline x1=\"570\" y1=\"112\" x2=\"598\" y2=\"126\" stroke=\"var(--accent)\" stroke-width=\"2\"/>\n        \u003cline x1=\"500\" y1=\"130\" x2=\"500\" y2=\"158\" stroke=\"var(--fg-muted)\" stroke-width=\"1.5\"/>\n        \u003ctext x=\"415\" y=\"148\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--fg-muted)\">CRI (gRPC)\u003c/text>\n      \u003c/svg>\n      \u003cfigcaption>Docker is only the \"hardware\" for kind. Kubernetes never talks to Docker: since v1.24 removed\n        dockershim, the kubelet uses the Container Runtime Interface (CRI), and kind nodes run containerd.\u003c/figcaption>\n    \u003c/figure>\n    \u003cdiv class=\"scroll\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>Question\u003c/th>\u003cth>Docker (in Colima)\u003c/th>\u003cth>containerd (in each kind node)\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>Who talks to it?\u003c/td>\u003ctd>You (\u003ccode>docker\u003c/code>) and \u003ccode>kind\u003c/code>\u003c/td>\u003ctd>The kubelet, over CRI\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>What does it run?\u003c/td>\u003ctd>The node containers \u003ccode>primer-control-plane\u003c/code>, \u003ccode>primer-worker\u003c/code>…\u003c/td>\u003ctd>Your Pods' containers\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Where do its images live?\u003c/td>\u003ctd>Colima's Docker image store\u003c/td>\u003ctd>Each node's own store\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>How do images move?\u003c/td>\u003ctd>\u003ccode>kind load docker-image NAME:TAG\u003c/code> copies them into every node\u003c/td>\u003ctd>Or each node pulls from a registry itself\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Inspect it with\u003c/td>\u003ctd>\u003ccode>docker ps\u003c/code>, \u003ccode>docker images\u003c/code>\u003c/td>\u003ctd>\u003ccode>docker exec -it primer-worker crictl ps\u003c/code>\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n    \u003cp>The practical consequence: an image you \u003ccode>docker build\u003c/code> on your Mac is \u003cem>invisible\u003c/em> to your\n      Pods until you \u003ccode>kind load\u003c/code> it (or push it to a registry the nodes can reach). A Pod that can't find\n      its image goes into \u003ccode>ErrImagePull\u003c/code>, then \u003ccode>ImagePullBackOff\u003c/code>. You'll diagnose exactly that\n      in M02.\u003c/p>\n    \u003caside class=\"callout warn\">\u003cp>Use a pinned tag such as \u003ccode>myapp:0.1.0\u003c/code> for images you load, and\n      \u003ccode>imagePullPolicy: IfNotPresent\u003c/code>. With the tag \u003ccode>:latest\u003c/code>, Kubernetes defaults to\n      \u003ccode>Always\u003c/code> and tries to pull from Docker Hub, ignoring the copy you loaded.\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"kind-config\">\n    \u003ch2>A kind cluster config\u003c/h2>\n    \u003cp>kind reads a small YAML file that describes the nodes. The course's \u003ccode>primer\u003c/code> cluster has one\n      control-plane node and two workers, and publishes one port from the control-plane node to your Mac.\u003c/p>\n    \u003cpre>\u003ccode class=\"language-yaml\"># kind-primer.yaml\nkind: Cluster\napiVersion: kind.x-k8s.io/v1alpha4\nname: primer\nnodes:\n  - role: control-plane\n    extraPortMappings:\n      - containerPort: 30080   # a NodePort inside the cluster (used from Stage 2)\n        hostPort: 8080         # http://*.localhost:8080 on your Mac\n        protocol: TCP\n  - role: worker\n  - role: worker\u003c/code>\u003c/pre>\n    \u003cp>Why three nodes on one laptop? Because scheduling, spreading replicas, draining a node, and \"a node died\"\n      only mean something with more than one node. Each node is a container, so they're cheap.\u003c/p>\n    \u003cp>Before you create a cluster, check the file. \u003ccode>kubelab.check_kind_config\u003c/code> returns a list of\n      problems; an empty list means the file is valid. Try breaking it: change \u003ccode>worker\u003c/code> to\n      \u003ccode>workers\u003c/code>, or give two mappings the same \u003ccode>hostPort\u003c/code>.\u003c/p>\n    \u003cdiv class=\"runnable\" data-title=\"Validate a kind config\">\n\u003ctextarea>\nimport kubelab\n\ntext = \"\"\"\nkind: Cluster\napiVersion: kind.x-k8s.io/v1alpha4\nname: primer\nnodes:\n  - role: control-plane\n    extraPortMappings:\n      - {containerPort: 30080, hostPort: 8080, protocol: TCP}\n  - role: worker\n  - role: worker\n\"\"\"\nconfig = kubelab.load_manifests(text)[0]\nprint(\"problems:\", kubelab.check_kind_config(config))\nprint(\"roles:   \", kubelab.node_roles(config))\nfor m in kubelab.port_mappings(config):\n    print(f\"localhost:{m.host_port} -> {m.role} node port {m.container_port}/{m.protocol}\")\n\u003c/textarea>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"create\">\n    \u003ch2>Create the primer cluster\u003c/h2>\n    \u003cpre data-label=\"Terminal\">\u003ccode class=\"language-bash\">kind create cluster --config kind-primer.yaml\nkubectl cluster-info --context kind-primer\nkubectl get nodes -o wide            # 1 control-plane + 2 workers, all Ready\ndocker ps --format '{{.Names}}'      # the nodes are just containers\u003c/code>\u003c/pre>\n    \u003cp>\u003ccode>kind create cluster\u003c/code> does four things: it starts one Docker container per node from the\n      \u003ccode>kindest/node\u003c/code> image (which bundles systemd, containerd, the kubelet, and kubeadm); it runs\n      \u003ccode>kubeadm init\u003c/code> on the control plane and \u003ccode>kubeadm join\u003c/code> on the workers; it installs a\n      network plugin (kindnet) and a storage provisioner; and it adds a \u003cstrong>context\u003c/strong> named\n      \u003ccode>kind-primer\u003c/code> to \u003ccode>~/.kube/config\u003c/code> and switches to it.\u003c/p>\n    \u003cp>A context is a named pairing of a cluster, a user, and a default namespace. \u003ccode>kubectl\u003c/code> always talks\n      to the current context, which matters as soon as you have more than one cluster.\u003c/p>\n    \u003cpre data-label=\"Terminal\">\u003ccode class=\"language-bash\">kubectl config get-contexts           # * marks the current one\nkubectl config use-context kind-primer\nkind get clusters\u003c/code>\u003c/pre>\n    \u003caside class=\"callout tip\">\u003cp>\u003cstrong>Remember:\u003c/strong> if \u003ccode>kubectl\u003c/code> suddenly shows the wrong\n      cluster (or none), check \u003ccode>kubectl config current-context\u003c/code> first.\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"ports\">\n    \u003ch2>How traffic reaches the cluster\u003c/h2>\n    \u003cp>The port mapping is a chain of three hops. Seeing it now makes Stage 2's networking much easier.\u003c/p>\n    \u003cpre class=\"mermaid\">\nflowchart LR\n  B[Browser or curl on your Mac] -->|localhost:8080| C[Colima port forward]\n  C -->|VM port 8080| D[Docker publishes to primer-control-plane]\n  D -->|node port 30080| S[A NodePort Service in the cluster]\n  S --> P[Pods]\n    \u003c/pre>\n    \u003cp>Until something in the cluster listens on NodePort 30080 (the gateway you install in Stage 2),\n      \u003ccode>localhost:8080\u003c/code> refuses connections. That's expected. Any name ending in \u003ccode>.localhost\u003c/code>\n      resolves to your own machine in curl and in browsers, so later you'll use names like\n      \u003ccode>http://podinfo.localhost:8080\u003c/code> with no \u003ccode>/etc/hosts\u003c/code> edits.\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"lifecycle\">\n    \u003ch2>Day to day and troubleshooting\u003c/h2>\n    \u003cdiv class=\"scroll\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>Goal\u003c/th>\u003cth>Command\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>Pause everything (keeps the cluster)\u003c/td>\u003ctd>\u003ccode>colima stop\u003c/code>, later \u003ccode>colima start\u003c/code>: the node containers restart with it\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Delete the cluster\u003c/td>\u003ctd>\u003ccode>kind delete cluster --name primer\u003c/code>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Recreate from scratch\u003c/td>\u003ctd>delete, then \u003ccode>kind create cluster --config kind-primer.yaml\u003c/code>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Repair a missing kubeconfig entry\u003c/td>\u003ctd>\u003ccode>kind export kubeconfig --name primer\u003c/code>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Watch the cluster live\u003c/td>\u003ctd>\u003ccode>k9s\u003c/code> (type \u003ccode>:pods\u003c/code>, press \u003ccode>0\u003c/code> for all namespaces)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Collect node logs for a bug report\u003c/td>\u003ctd>\u003ccode>kind export logs ./kind-logs --name primer\u003c/code>\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n    \u003cdiv class=\"scroll\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>Symptom\u003c/th>\u003cth>Likely cause\u003c/th>\u003cth>Fix\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>Nodes flap \u003ccode>NotReady\u003c/code>; logs say \u003ccode>too many open files\u003c/code>\u003c/td>\u003ctd>inotify limits in the VM are too low for several nodes\u003c/td>\u003ctd>\u003ccode>colima ssh -- sudo sysctl -w fs.inotify.max_user_watches=524288 fs.inotify.max_user_instances=512\u003c/code>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>Cannot connect to the Docker daemon\u003c/code>\u003c/td>\u003ctd>Colima isn't running, or another context is active\u003c/td>\u003ctd>\u003ccode>colima status\u003c/code>; \u003ccode>docker context use colima\u003c/code>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Pods \u003ccode>Pending\u003c/code>; events say \u003ccode>Insufficient memory\u003c/code>\u003c/td>\u003ctd>The VM is too small\u003c/td>\u003ctd>\u003ccode>colima stop && colima start --memory 10\u003c/code>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>kind create\u003c/code> fails: port 8080 is in use\u003c/td>\u003ctd>Another app on your Mac owns it\u003c/td>\u003ctd>Free it, or change \u003ccode>hostPort\u003c/code> and recreate\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>ErrImagePull\u003c/code> for an image you built\u003c/td>\u003ctd>It's in Docker, not in the nodes' containerd\u003c/td>\u003ctd>\u003ccode>kind load docker-image NAME:TAG --name primer\u003c/code>\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n    \u003caside class=\"callout note\">\u003cp>The answer to the earlier question: when Colima stops, the node containers stop\n      with it. \u003ccode>colima start\u003c/code> brings them back and the cluster resumes with its objects intact, because\n      etcd's data lives on the control-plane container's disk.\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"practice\">\n    \u003ch2>Practice\u003c/h2>\n    \u003cp>Four short exercises on cluster configs and images. Each one uses \u003ccode>kubelab\u003c/code> or plain Python.\u003c/p>\n\n    \u003cdiv class=\"exercise\" data-id=\"m00-e1\" data-title=\"Count the nodes\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Write \u003ccode>node_counts(yaml_text)\u003c/code> that parses a kind config and returns a dict with the number\n          of \u003ccode>\"control-plane\"\u003c/code> and \u003ccode>\"worker\"\u003c/code> nodes. A config with no \u003ccode>nodes\u003c/code> list\n          has one control-plane node. Use \u003ccode>kubelab.load_manifests\u003c/code> and \u003ccode>kubelab.node_roles\u003c/code>.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\nimport kubelab\n\ndef node_counts(yaml_text):\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\ndef test_primer():\n    text = \"kind: Cluster\\napiVersion: kind.x-k8s.io/v1alpha4\\nnodes:\\n- role: control-plane\\n- role: worker\\n- role: worker\\n\"\n    assert node_counts(text) == {\"control-plane\": 1, \"worker\": 2}, \"one control plane, two workers\"\n\ndef test_default_single_node():\n    text = \"kind: Cluster\\napiVersion: kind.x-k8s.io/v1alpha4\\n\"\n    assert node_counts(text) == {\"control-plane\": 1, \"worker\": 0}, \"no nodes list means one control-plane node\"\n\ndef test_ha():\n    text = \"kind: Cluster\\napiVersion: kind.x-k8s.io/v1alpha4\\nnodes:\\n- role: control-plane\\n- role: control-plane\\n- role: control-plane\\n- role: worker\\n\"\n    assert node_counts(text) == {\"control-plane\": 3, \"worker\": 1}\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>Parse with \u003ccode>kubelab.load_manifests(text)[0]\u003c/code>, then\n        count the roles from \u003ccode>kubelab.node_roles(config)\u003c/code>. Start both counts at zero.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">import kubelab\n\ndef node_counts(yaml_text):\n    config = kubelab.load_manifests(yaml_text)[0]\n    roles = kubelab.node_roles(config)\n    return {\"control-plane\": roles.count(\"control-plane\"), \"worker\": roles.count(\"worker\")}\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"exercise\" data-id=\"m00-e2\" data-title=\"Which URL reaches a NodePort?\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Write \u003ccode>url_for(config, node_port, host=\"localhost\")\u003c/code> that returns the URL on your Mac that\n          reaches \u003ccode>node_port\u003c/code>, such as \u003ccode>\"http://localhost:8080\"\u003c/code>, using the config's\n          \u003ccode>extraPortMappings\u003c/code>. Return \u003ccode>None\u003c/code> when no TCP mapping publishes that port.\n          \u003ccode>config\u003c/code> is already a dict.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\nimport kubelab\n\ndef url_for(config, node_port, host=\"localhost\"):\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\nCONFIG = {\"kind\": \"Cluster\", \"apiVersion\": \"kind.x-k8s.io/v1alpha4\", \"nodes\": [\n    {\"role\": \"control-plane\", \"extraPortMappings\": [\n        {\"containerPort\": 30080, \"hostPort\": 8080},\n        {\"containerPort\": 30053, \"hostPort\": 5353, \"protocol\": \"UDP\"}]},\n    {\"role\": \"worker\"}]}\n\ndef test_mapped():\n    assert url_for(CONFIG, 30080) == \"http://localhost:8080\"\n\ndef test_custom_host():\n    assert url_for(CONFIG, 30080, host=\"podinfo.localhost\") == \"http://podinfo.localhost:8080\"\n\ndef test_unmapped_or_udp():\n    assert url_for(CONFIG, 31000) is None, \"nothing publishes 31000\"\n    assert url_for(CONFIG, 30053) is None, \"a UDP mapping can't serve HTTP\"\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>Loop over \u003ccode>kubelab.port_mappings(config)\u003c/code>; each item\n        has \u003ccode>container_port\u003c/code>, \u003ccode>host_port\u003c/code>, and \u003ccode>protocol\u003c/code>.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">import kubelab\n\ndef url_for(config, node_port, host=\"localhost\"):\n    for m in kubelab.port_mappings(config):\n        if m.container_port == node_port and m.protocol == \"TCP\":\n            return f\"http://{host}:{m.host_port}\"\n    return None\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"exercise\" data-id=\"m00-e3\" data-title=\"Does this image need kind load?\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Write \u003ccode>needs_load(image, docker_images, node_images)\u003c/code>. It returns \u003ccode>True\u003c/code> when the\n          image exists in Docker (on your Mac's side) but is missing from at least one node's containerd store, so\n          \u003ccode>kind load\u003c/code> is required. \u003ccode>node_images\u003c/code> maps each node name to the set of images it has.\n          If the image isn't in Docker at all, return \u003ccode>False\u003c/code> (there's nothing to load; build or pull it first).\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\ndef needs_load(image, docker_images, node_images):\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\nNODES = {\"primer-control-plane\": {\"busybox:1.36\"}, \"primer-worker\": {\"busybox:1.36\", \"app:0.1.0\"}, \"primer-worker2\": {\"busybox:1.36\"}}\n\ndef test_missing_on_some_nodes():\n    assert needs_load(\"app:0.1.0\", {\"app:0.1.0\"}, NODES) is True\n\ndef test_everywhere_already():\n    assert needs_load(\"busybox:1.36\", {\"busybox:1.36\"}, NODES) is False\n\ndef test_not_in_docker():\n    assert needs_load(\"app:0.2.0\", {\"app:0.1.0\"}, NODES) is False, \"build the image before you can load it\"\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>Two conditions: the image is in \u003ccode>docker_images\u003c/code>, and\n        \u003ccode>any(image not in imgs for imgs in node_images.values())\u003c/code>.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">def needs_load(image, docker_images, node_images):\n    if image not in docker_images:\n        return False\n    return any(image not in images for images in node_images.values())\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"exercise\" data-id=\"m00-e4\" data-title=\"Ready for the primer cluster?\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Write \u003ccode>primer_gaps(yaml_text)\u003c/code> that returns a list of what's missing for the course's cluster.\n          Start with every problem from \u003ccode>kubelab.check_kind_config\u003c/code>, then add these exact messages when they\n          apply: \u003ccode>\"name must be primer\"\u003c/code>, \u003ccode>\"need exactly 2 workers\"\u003c/code>, and\n          \u003ccode>\"map node port 30080 to host port 8080\"\u003c/code> (a TCP mapping on a control-plane node). A perfect\n          config returns \u003ccode>[]\u003c/code>.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\nimport kubelab\n\ndef primer_gaps(yaml_text):\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\nGOOD = \"\"\"kind: Cluster\napiVersion: kind.x-k8s.io/v1alpha4\nname: primer\nnodes:\n- role: control-plane\n  extraPortMappings: [{containerPort: 30080, hostPort: 8080}]\n- role: worker\n- role: worker\n\"\"\"\n\ndef test_good():\n    assert primer_gaps(GOOD) == []\n\ndef test_single_node_default():\n    gaps = primer_gaps(\"kind: Cluster\\napiVersion: kind.x-k8s.io/v1alpha4\\n\")\n    assert gaps == [\"name must be primer\", \"need exactly 2 workers\", \"map node port 30080 to host port 8080\"]\n\ndef test_mapping_on_worker_does_not_count():\n    text = GOOD.replace(\"- role: control-plane\\n  extraPortMappings: [{containerPort: 30080, hostPort: 8080}]\\n- role: worker\", \"- role: control-plane\\n- role: worker\\n  extraPortMappings: [{containerPort: 30080, hostPort: 8080}]\")\n    assert primer_gaps(text) == [\"map node port 30080 to host port 8080\"]\n\ndef test_reports_kubelab_problems_first():\n    gaps = primer_gaps(GOOD.replace(\"kind: Cluster\", \"kind: Clutser\"))\n    assert gaps[0] == \"kind: must be 'Cluster'\"\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>Build the list in the order the prompt gives. For the mapping,\n        look for a \u003ccode>PortMapping\u003c/code> with \u003ccode>role == \"control-plane\"\u003c/code>, container port 30080, host\n        port 8080, and protocol TCP.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">import kubelab\n\ndef primer_gaps(yaml_text):\n    config = kubelab.load_manifests(yaml_text)[0]\n    gaps = list(kubelab.check_kind_config(config))\n    if config.get(\"name\") != \"primer\":\n        gaps.append(\"name must be primer\")\n    if kubelab.node_roles(config).count(\"worker\") != 2:\n        gaps.append(\"need exactly 2 workers\")\n    wanted = kubelab.PortMapping(\"control-plane\", 30080, 8080, \"TCP\")\n    if wanted not in kubelab.port_mappings(config):\n        gaps.append(\"map node port 30080 to host port 8080\")\n    return gaps\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"mini-project\">\n    \u003ch2>Lab: the primer cluster\u003c/h2>\n    \u003cdiv class=\"project-box\">\n      \u003cdiv class=\"widget-head\">\u003cspan class=\"w-kind\">Lab m00-lab1\u003c/span>\u003cspan class=\"w-title\">Build, check, and create your cluster\u003c/span>\u003c/div>\n      \u003cdiv class=\"widget-body\">\n        \u003cp>Write the \u003ccode>kind-primer.yaml\u003c/code> you'll use for the whole course, answer a few questions about the\n          two runtimes, then create the cluster. The offline checks validate your config and answers; the live check\n          confirms the cluster exists, has three Ready nodes, and runs containerd.\u003c/p>\n        \u003cpre data-label=\"Terminal\">\u003ccode class=\"language-bash\">pixi run start m00-lab1\n# edit work/m00-lab1/kind-primer.yaml and work/m00-lab1/answers.toml\npixi run grade m00-lab1\nkind create cluster --config work/m00-lab1/kind-primer.yaml\npixi run grade-live m00-lab1   # optional: checks the running cluster\u003c/code>\u003c/pre>\n        \u003cul class=\"checklist\" data-id=\"m00-lab1\">\n          \u003cli>Colima runs with at least 4 CPUs and 6 GB of memory\u003c/li>\n          \u003cli>\u003ccode>kind-primer.yaml\u003c/code> passes \u003ccode>kubelab.check_kind_config\u003c/code>\u003c/li>\n          \u003cli>One control-plane node, two workers, cluster name \u003ccode>primer\u003c/code>\u003c/li>\n          \u003cli>Node port 30080 is mapped to host port 8080 over TCP on the control plane\u003c/li>\n          \u003cli>\u003ccode>answers.toml\u003c/code> is complete\u003c/li>\n          \u003cli>\u003ccode>pixi run grade m00-lab1\u003c/code> passes\u003c/li>\n        \u003c/ul>\n        \u003cp>\u003cstrong>Stretch:\u003c/strong> create a second, single-node cluster called \u003ccode>scratch\u003c/code>, switch between\n          the two contexts, then delete it.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"quiz\">\n    \u003ch2>Quiz\u003c/h2>\n    \u003cdiv class=\"quiz\" data-id=\"m00-quiz\">\n\u003cscript type=\"application/json\">\n{\"title\": \"Your Mac Lab quiz\", \"passScore\": 0.7, \"questions\": [\n  {\"type\": \"single\", \"prompt\": \"Why does a Mac need Colima (or a similar VM) to run Linux containers?\", \"options\": [\"macOS forbids containers\", \"Containers are isolated Linux processes, so they need a Linux kernel\", \"kind only runs in the cloud\", \"Docker is Linux-only software\"], \"answer\": 1, \"explanation\": \"\u003cp>Containers rely on Linux kernel features (namespaces and cgroups). Colima provides a Linux kernel in a lightweight VM.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"In this setup, which runtime runs your Pods' containers?\", \"options\": [\"Docker in Colima\", \"containerd inside each kind node\", \"Apple Virtualization.framework\", \"runc on macOS\"], \"answer\": 1, \"explanation\": \"\u003cp>The kubelet talks CRI to containerd inside each node. Docker only runs the node containers themselves.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"You built \u003ccode>app:0.1.0\u003c/code> with \u003ccode>docker build\u003c/code>, and the Pod shows \u003ccode>ErrImagePull\u003c/code>. What's the fastest fix?\", \"options\": [\"Restart Colima\", \"\u003ccode>kind load docker-image app:0.1.0 --name primer\u003c/code>\", \"Set \u003ccode>imagePullPolicy: Always\u003c/code>\", \"Delete the namespace\"], \"answer\": 1, \"explanation\": \"\u003cp>The image is in Docker's store, not the nodes' containerd stores. \u003ccode>kind load\u003c/code> copies it into every node.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"Why avoid the tag \u003ccode>:latest\u003c/code> for an image you \u003ccode>kind load\u003c/code>?\", \"options\": [\"kind rejects it\", \"With \u003ccode>:latest\u003c/code> the default pull policy is \u003ccode>Always\u003c/code>, so the node tries the registry and ignores your loaded copy\", \"It's slower to load\", \"containerd doesn't support tags\"], \"answer\": 1, \"explanation\": \"\u003cp>Pinned tags default to \u003ccode>IfNotPresent\u003c/code>, which uses the loaded image.\u003c/p>\"},\n  {\"type\": \"multi\", \"prompt\": \"What does \u003ccode>kind create cluster\u003c/code> do?\", \"options\": [\"Starts one container per node\", \"Runs kubeadm to bootstrap the control plane and join workers\", \"Installs a CNI (kindnet) and a storage provisioner\", \"Adds a \u003ccode>kind-&lt;name&gt;\u003c/code> context to your kubeconfig\", \"Installs Docker Desktop\"], \"answer\": [0, 1, 2, 3], \"explanation\": \"\u003cp>Everything except Docker Desktop: kind uses whatever Docker-compatible engine is active, here Colima's.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"What does \u003ccode>extraPortMappings: [{containerPort: 30080, hostPort: 8080}]\u003c/code> on the control-plane node do?\", \"options\": [\"Opens port 8080 on every Pod\", \"Publishes the node container's port 30080 as port 8080 on the host\", \"Creates a Service\", \"Changes the API server's port\"], \"answer\": 1, \"explanation\": \"\u003cp>It's a Docker port mapping on the node container. Colima forwards it to your Mac, and a NodePort Service on 30080 then answers at localhost:8080.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"Nodes keep flapping NotReady and the logs say \u003ccode>too many open files\u003c/code>. What's the fix?\", \"options\": [\"Give Colima more disk\", \"Raise \u003ccode>fs.inotify\u003c/code> limits inside the VM\", \"Use fewer Pods\", \"Upgrade kubectl\"], \"answer\": 1, \"explanation\": \"\u003cp>Each node runs many file watchers. Raise \u003ccode>max_user_watches\u003c/code> and \u003ccode>max_user_instances\u003c/code>.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"Which command pauses your lab without losing the cluster?\", \"options\": [\"\u003ccode>kind delete cluster\u003c/code>\", \"\u003ccode>colima stop\u003c/code>\", \"\u003ccode>docker system prune\u003c/code>\", \"\u003ccode>kubectl drain --all\u003c/code>\"], \"answer\": 1, \"explanation\": \"\u003cp>Stopping the VM stops the node containers; \u003ccode>colima start\u003c/code> brings them back with their state.\u003c/p>\"},\n  {\"type\": \"text\", \"prompt\": \"Which CLI, run inside a kind node with \u003ccode>docker exec\u003c/code>, lists the containers containerd is running?\", \"answer\": [\"crictl\"], \"explanation\": \"\u003cp>\u003ccode>crictl\u003c/code> is the CRI debugging client. \u003ccode>crictl ps\u003c/code> lists containers and \u003ccode>crictl images\u003c/code> lists images.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"\u003ccode>kubectl\u003c/code> suddenly shows a different cluster. What do you check first?\", \"options\": [\"Your Docker images\", \"\u003ccode>kubectl config current-context\u003c/code>\", \"The inotify limits\", \"The Pixi lock file\"], \"answer\": 1, \"explanation\": \"\u003cp>kubectl always uses the current context. Switch with \u003ccode>kubectl config use-context kind-primer\u003c/code>.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"Why does the course cluster have two workers instead of one node?\", \"options\": [\"kind requires it\", \"Scheduling, spreading replicas, draining, and node failure only mean something with several nodes\", \"To use more memory\", \"Workers are faster than the control plane\"], \"answer\": 1, \"explanation\": \"\u003cp>Many lessons in Stages 1 and 3 need more than one place for Pods to run.\u003c/p>\"}\n]}\n\u003c/script>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"recap\">\n    \u003ch2>Recap\u003c/h2>\n    \u003cul>\n      \u003cli>Read and try in the page, build in a lab, grade with Pixi. Labs have no answer key.\u003c/li>\n      \u003cli>Colima gives your Mac a Linux kernel and a Docker engine. Size it at 4 CPUs and 6–8 GB.\u003c/li>\n      \u003cli>Docker runs kind's node containers; containerd inside each node runs your Pods. Move images with\n        \u003ccode>kind load docker-image\u003c/code>.\u003c/li>\n      \u003cli>The \u003ccode>primer\u003c/code> cluster: one control plane, two workers, NodePort 30080 published as localhost:8080.\u003c/li>\n      \u003cli>Check configs before you use them; check the current context before you blame the cluster.\u003c/li>\n    \u003c/ul>\n    \u003cdiv class=\"flashcards\" data-title=\"Your Mac lab\">\n      \u003cscript type=\"application/json\">\n      [{\"front\": \"Why Colima?\", \"back\": \"Containers need a Linux kernel. Colima runs a lightweight Linux VM with a Docker engine.\"},\n       {\"front\": \"Who runs Pods in kind?\", \"back\": \"containerd inside each node container, driven by the kubelet over CRI.\"},\n       {\"front\": \"Who runs kind's nodes?\", \"back\": \"Docker (in Colima). Each node is a container.\"},\n       {\"front\": \"Move a local image into the cluster\", \"back\": \"\u003ccode>kind load docker-image NAME:TAG --name primer\u003c/code>\"},\n       {\"front\": \"List containers inside a node\", \"back\": \"\u003ccode>docker exec -it primer-worker crictl ps\u003c/code>\"},\n       {\"front\": \"\u003ccode>extraPortMappings\u003c/code>\", \"back\": \"Publishes a node container's port on the host: containerPort (node) → hostPort (Mac).\"},\n       {\"front\": \"A kubeconfig context\", \"back\": \"A named cluster + user + default namespace. kubectl uses the current one.\"},\n       {\"front\": \"Nodes flap, 'too many open files'\", \"back\": \"Raise fs.inotify.max_user_watches and max_user_instances in the VM.\"},\n       {\"front\": \"Pause the lab\", \"back\": \"\u003ccode>colima stop\u003c/code> / \u003ccode>colima start\u003c/code>. The cluster survives.\"}]\n      \u003c/script>\n    \u003c/div>\n    \u003ch3>Going further\u003c/h3>\n    \u003cul>\n      \u003cli>\u003ca href=\"https://kind.sigs.k8s.io/docs/user/configuration/\">kind: Configuration\u003c/a> and \u003ca href=\"https://kind.sigs.k8s.io/docs/user/quick-start/#loading-an-image-into-your-cluster\">loading an image\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"https://github.com/abiosoft/colima\">Colima on GitHub\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"https://kubernetes.io/docs/setup/production-environment/container-runtimes/\">Kubernetes: Container runtimes\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"../reference/cheatsheet.html\">kubectl and kind cheat sheet\u003c/a>\u003c/li>\n      \u003cli>Next: \u003ca href=\"m01-how-kubernetes-thinks.html\">M01 How Kubernetes Thinks\u003c/a>\u003c/li>\n    \u003c/ul>\n  \u003c/section>","exercises":["m00-e1","m00-e2","m00-e3","m00-e4"],"quizzes":["m00-quiz"],"checklists":{"m00-lab1":6}},"modules/m01-how-kubernetes-thinks.html":{"id":"m01","kind":"module","title":"M01 · How Kubernetes Thinks · Kubernetes Practicum","html":"\u003cheader class=\"lesson-hero\">\n    \u003cp class=\"eyebrow\">Stage 1 · Foundations · Module 01\u003c/p>\n    \u003ch1>How Kubernetes Thinks\u003c/h1>\n    \u003cp class=\"lede\">Kubernetes isn't a tool that runs containers when you ask. It's a database of what you want,\n      surrounded by control loops that keep making the world match it. Once that model clicks, every feature in\n      the rest of the course (rollouts, autoscaling, GitOps) is the same idea applied to a different object.\u003c/p>\n    \u003cdiv class=\"lesson-meta\">\u003cspan>⏱ ~2 hours\u003c/span>\u003cspan>Prerequisites: \u003ca href=\"m00-mac-lab.html\">M00 Your Mac Lab\u003c/a>\u003c/span>\u003c/div>\n    \u003cul class=\"objectives\">\n      \u003cli>Name each control-plane and node component and say what it's responsible for\u003c/li>\n      \u003cli>Read any object as apiVersion, kind, metadata, spec, and status, and know who writes each part\u003c/li>\n      \u003cli>Explain declarative configuration and why \u003ccode>kubectl apply\u003c/code> is idempotent\u003c/li>\n      \u003cli>Describe a controller's reconcile loop, and why level-triggered loops self-heal\u003c/li>\n      \u003cli>Trace a Deployment from \u003ccode>kubectl apply\u003c/code> to running containers, naming each component that acts\u003c/li>\n      \u003cli>Use the everyday kubectl verbs, output formats, and \u003ccode>kubectl explain\u003c/code>\u003c/li>\n    \u003c/ul>\n  \u003c/header>\n\n  \u003csection class=\"lesson-section\" id=\"why\">\n    \u003ch2>The problem Kubernetes solves\u003c/h2>\n    \u003cp>Running one container on one machine is easy. Running hundreds across a fleet of machines raises questions\n      that a single \u003ccode>docker run\u003c/code> never answers: which machine has room? What happens when a machine dies\n      at 3 a.m.? How do you replace version 1 with version 2 without dropping requests? How do clients find a\n      container whose IP keeps changing?\u003c/p>\n    \u003cp>Kubernetes answers all of these with one design. You \u003cstrong>declare\u003c/strong> the end state you want\n      (\"three copies of this web server, version 2, reachable as \u003ccode>web\u003c/code>\"). The system stores that\n      declaration and runs \u003cstrong>controllers\u003c/strong> that notice any difference between what you declared and\n      what exists, and fix it. Nobody, including you, scripts the steps.\u003c/p>\n    \u003cdiv class=\"card-grid\">\n      \u003cdiv class=\"card\">\u003ch4>Scheduling\u003c/h4>\u003cp>Pick a node with enough CPU and memory, honouring your rules.\u003c/p>\u003c/div>\n      \u003cdiv class=\"card\">\u003ch4>Self-healing\u003c/h4>\u003cp>Replace containers and Pods that die, and Pods on nodes that die.\u003c/p>\u003c/div>\n      \u003cdiv class=\"card\">\u003ch4>Rollouts\u003c/h4>\u003cp>Move from one version to the next gradually, and roll back.\u003c/p>\u003c/div>\n      \u003cdiv class=\"card\">\u003ch4>Discovery\u003c/h4>\u003cp>Give a changing set of Pods one stable name and address.\u003c/p>\u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"architecture\">\n    \u003ch2>The architecture\u003c/h2>\n    \u003cfigure class=\"figure\">\n      \u003csvg class=\"diagram\" viewBox=\"0 0 780 330\" role=\"img\" aria-label=\"Control plane with API server, etcd, scheduler, controller manager; worker node with kubelet, kube-proxy, containerd and Pods\">\n        \u003crect x=\"10\" y=\"10\" width=\"370\" height=\"310\" rx=\"10\" fill=\"none\" stroke=\"var(--fg-muted)\" stroke-dasharray=\"5 4\"/>\n        \u003ctext x=\"24\" y=\"30\" font-size=\"13\" font-weight=\"600\" fill=\"var(--fg-muted)\">Control plane\u003c/text>\n        \u003crect x=\"110\" y=\"44\" width=\"170\" height=\"54\" rx=\"8\" fill=\"var(--accent)\"/>\n        \u003ctext x=\"195\" y=\"67\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"var(--accent-fg)\">kube-apiserver\u003c/text>\n        \u003ctext x=\"195\" y=\"85\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--accent-fg)\">the only front door\u003c/text>\n        \u003crect x=\"30\" y=\"140\" width=\"150\" height=\"54\" rx=\"8\" fill=\"var(--fg)\"/>\n        \u003ctext x=\"105\" y=\"163\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--bg)\">etcd\u003c/text>\n        \u003ctext x=\"105\" y=\"181\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--bg)\">all cluster state\u003c/text>\n        \u003crect x=\"210\" y=\"140\" width=\"150\" height=\"54\" rx=\"8\" fill=\"var(--bg-elev)\" stroke=\"var(--border-strong)\"/>\n        \u003ctext x=\"285\" y=\"163\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fg)\">scheduler\u003c/text>\n        \u003ctext x=\"285\" y=\"181\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--fg-muted)\">picks a node\u003c/text>\n        \u003crect x=\"30\" y=\"230\" width=\"150\" height=\"54\" rx=\"8\" fill=\"var(--bg-elev)\" stroke=\"var(--border-strong)\"/>\n        \u003ctext x=\"105\" y=\"253\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fg)\">controller-manager\u003c/text>\n        \u003ctext x=\"105\" y=\"271\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--fg-muted)\">dozens of loops\u003c/text>\n        \u003crect x=\"210\" y=\"230\" width=\"150\" height=\"54\" rx=\"8\" fill=\"none\" stroke=\"var(--fg-muted)\" stroke-dasharray=\"4 3\"/>\n        \u003ctext x=\"285\" y=\"253\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fg-muted)\">cloud-controller\u003c/text>\n        \u003ctext x=\"285\" y=\"271\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--fg-muted)\">(not on kind)\u003c/text>\n        \u003cline x1=\"160\" y1=\"98\" x2=\"110\" y2=\"140\" stroke=\"var(--fg)\" stroke-width=\"1.5\"/>\n        \u003cline x1=\"230\" y1=\"98\" x2=\"280\" y2=\"140\" stroke=\"var(--fg)\" stroke-width=\"1.5\"/>\n        \u003cline x1=\"150\" y1=\"98\" x2=\"105\" y2=\"230\" stroke=\"var(--fg)\" stroke-width=\"1.5\"/>\n        \u003crect x=\"410\" y=\"10\" width=\"360\" height=\"310\" rx=\"10\" fill=\"none\" stroke=\"var(--fg-muted)\" stroke-dasharray=\"5 4\"/>\n        \u003ctext x=\"424\" y=\"30\" font-size=\"13\" font-weight=\"600\" fill=\"var(--fg-muted)\">Worker node\u003c/text>\n        \u003crect x=\"430\" y=\"44\" width=\"150\" height=\"54\" rx=\"8\" fill=\"var(--accent)\"/>\n        \u003ctext x=\"505\" y=\"67\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--accent-fg)\">kubelet\u003c/text>\n        \u003ctext x=\"505\" y=\"85\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--accent-fg)\">runs assigned Pods\u003c/text>\n        \u003crect x=\"600\" y=\"44\" width=\"150\" height=\"54\" rx=\"8\" fill=\"var(--bg-elev)\" stroke=\"var(--border-strong)\"/>\n        \u003ctext x=\"675\" y=\"67\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fg)\">kube-proxy\u003c/text>\n        \u003ctext x=\"675\" y=\"85\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--fg-muted)\">Service → Pod rules\u003c/text>\n        \u003crect x=\"430\" y=\"140\" width=\"150\" height=\"54\" rx=\"8\" fill=\"var(--bg-elev)\" stroke=\"var(--border-strong)\"/>\n        \u003ctext x=\"505\" y=\"163\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fg)\">containerd\u003c/text>\n        \u003ctext x=\"505\" y=\"181\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--fg-muted)\">pulls and runs\u003c/text>\n        \u003crect x=\"430\" y=\"232\" width=\"150\" height=\"48\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"/>\n        \u003ctext x=\"505\" y=\"261\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fg)\">Pod\u003c/text>\n        \u003crect x=\"600\" y=\"232\" width=\"150\" height=\"48\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"/>\n        \u003ctext x=\"675\" y=\"261\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fg)\">Pod\u003c/text>\n        \u003cline x1=\"505\" y1=\"98\" x2=\"505\" y2=\"140\" stroke=\"var(--fg)\" stroke-width=\"1.5\"/>\n        \u003cline x1=\"505\" y1=\"194\" x2=\"505\" y2=\"232\" stroke=\"var(--fg)\" stroke-width=\"1.5\"/>\n        \u003cline x1=\"540\" y1=\"194\" x2=\"640\" y2=\"232\" stroke=\"var(--fg)\" stroke-width=\"1.5\"/>\n        \u003cline x1=\"430\" y1=\"71\" x2=\"280\" y2=\"71\" stroke=\"var(--accent)\" stroke-width=\"2\"/>\n        \u003ctext x=\"355\" y=\"62\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--fg-muted)\">watch / report\u003c/text>\n      \u003c/svg>\n      \u003cfigcaption>Everything talks to the API server. Nothing else touches etcd, and components don't call each\n        other: each one watches the API for objects it cares about and writes back what it did.\u003c/figcaption>\n    \u003c/figure>\n    \u003cdiv class=\"scroll\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>Component\u003c/th>\u003cth>Runs on\u003c/th>\u003cth>Job in one sentence\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>kube-apiserver\u003c/td>\u003ctd>Control plane\u003c/td>\u003ctd>Authenticates, authorises, validates, and stores every object; serves watches\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>etcd\u003c/td>\u003ctd>Control plane\u003c/td>\u003ctd>A consistent key-value store that holds the entire cluster state\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>kube-scheduler\u003c/td>\u003ctd>Control plane\u003c/td>\u003ctd>Assigns each unscheduled Pod to a node by filtering and scoring\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>kube-controller-manager\u003c/td>\u003ctd>Control plane\u003c/td>\u003ctd>Runs the built-in reconcile loops: ReplicaSet, Deployment, Node, Job, EndpointSlice, and more\u003c/td>\u003c/tr>\n        \
