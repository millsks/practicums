      out.innerHTML = ""; results.innerHTML = "";
      const res = await Py.request("run", { code: editor.getValue(), stdin }, (m) => m.type === "image" ? appendImage(out, m.data) : appendOut(out, m.text + (m.type === "stdin" ? "\n" : ""), m.type === "err" ? "err" : m.type === "stdin" ? "sys" : null)).catch((e) => ({ error: e.message }));
      if (res.error) appendOut(out, res.error, "err");
      if (!out.textContent) appendOut(out, "(no output)", "sys");
    };
    const check = async () => {
      out.innerHTML = ""; results.innerHTML = "";
      checkBtn.disabled = true;
      const res = await Py.request("check", { code: editor.getValue(), tests, stdin }, (m) => appendOut(out, m.text, m.type === "err" ? "err" : null)).catch((e) => ({ error: e.message }));
      checkBtn.disabled = false;
      let parsed;
      try { parsed = res.error ? { error: res.error } : JSON.parse(res.result); } catch { parsed = { error: "Could not read the test results." }; }
      if (parsed.error) { results.append(h("li", { class: "fail" }, h("span", { text: "✗" }), h("span", { text: parsed.error }))); return; }
      const passed = parsed.results.filter((r) => r.ok).length;
      for (const r of parsed.results) {
        results.append(h("li", { class: r.ok ? "pass" : "fail" }, h("span", { text: r.ok ? "✓" : "✗" }), h("span", {}, r.name, r.msg ? h("span", { class: "msg", text: " — " + r.msg }) : null)));
      }
      const all = passed === parsed.results.length && passed > 0;
      results.append(h("li", { class: all ? "pass" : "fail" }, h("strong", { text: all ? `All ${passed} checks passed. Nice work.` : `${passed}/${parsed.results.length} checks passed.` })));
      if (all) {
        Store.set("exercises", id, { code: editor.getValue(), solved: true, at: new Date().toISOString() });
        el.classList.add("solved");
      }
    };
    const checkBtn = h("button", { class: "btn ok small", text: "Check ✓", title: "Ctrl/Cmd + Enter", onclick: check });
    head.append(runtimeBadge(),
      h("button", { class: "btn small", text: "Run", onclick: runIt }),
      checkBtn,
      h("button", { class: "btn small", text: "Reset", onclick: () => { editor.setValue(starter); out.innerHTML = ""; results.innerHTML = ""; } }));
    el.append(head);
    if (prompt) el.append(prompt);
    el.append(host, results, out, ...details);
    highlightAll(el);
  }

  /* ---------------- quizzes ---------------- */
  function mountQuiz(el) {
    const id = el.dataset.id;
    const dataEl = $("script[type='application/json']", el);
    let quiz;
    try { quiz = JSON.parse(dataEl.textContent); } catch (e) { el.textContent = "Quiz data is invalid: " + e.message; return; }
    const passScore = quiz.passScore ?? 0.7;
    el.innerHTML = "";
    el.classList.add("widget");
    const head = h("div", { class: "widget-head" },
      h("span", { class: "w-kind", text: "Quiz" }),
      h("span", { class: "w-title", text: quiz.title || "Check your understanding" }),
      h("span", { class: "spacer" }),
      h("span", { class: "status", text: `${quiz.questions.length} questions · pass at ${Math.round(passScore * 100)}%` }));
    el.append(head);
    const answered = new Map();
    const summary = h("div", { class: "quiz-summary" });
    const qEls = quiz.questions.map((q, i) => renderQuestion(q, i, (correct) => { answered.set(i, correct); updateSummary(); }));
    el.append(...qEls, summary);
    function updateSummary() {
      const correct = [...answered.values()].filter(Boolean).length;
      const total = quiz.questions.length;
      const pct = correct / total;
      summary.innerHTML = "";
      const ring = h("div", { class: "score-ring", style: `--p:${Math.round((answered.size ? correct / total : 0) * 100)}`, text: `${correct}/${total}` });
      const prev = Store.get("quizzes", id);
      let msg = `Answered ${answered.size} of ${total}.`;
      if (answered.size === total) {
        const passed = pct >= passScore;
        msg = passed ? `Passed with ${Math.round(pct * 100)}%. Review any you missed, then move on.` : `${Math.round(pct * 100)}%. Re-read the sections behind the questions you missed, then retake the quiz.`;
        Store.set("quizzes", id, { best: Math.max(pct, prev?.best ?? 0), last: pct, at: new Date().toISOString(), attempts: (prev?.attempts ?? 0) + 1 });
      }
      summary.append(ring, h("div", { style: "flex:1;min-width:200px" },
        h("div", { text: msg }),
        prev ? h("div", { class: "status", text: `Best so far: ${Math.round(prev.best * 100)}% over ${prev.attempts} attempt(s)` }) : null),
        h("button", { class: "btn small", text: "Retake quiz", onclick: () => { const fresh = h("div", { class: "quiz", "data-id": id }); fresh.append(h("script", { type: "application/json", text: JSON.stringify(quiz) })); el.replaceWith(fresh); mountQuiz(fresh); } }));
    }
    updateSummary();
    highlightAll(el);
  }
  function renderQuestion(q, i, onAnswer) {
    const type = q.type || "single";
    const wrap = h("div", { class: "quiz-q" },
      h("div", { class: "q-num", text: `Question ${i + 1}${type === "multi" ? " · select all that apply" : type === "output" ? " · type the exact output" : ""}` }),
      h("div", { class: "q-prompt", html: q.prompt }));
    if (q.code) wrap.append(h("pre", {}, h("code", { class: "language-python", text: dedent(q.code) })));
    const feedback = h("div", { class: "q-feedback" });
    let getAnswer;
    let optionEls = [];
    if (type === "single" || type === "multi") {
      const group = `q${Math.random().toString(36).slice(2)}`;
      const opts = h("div", { class: "q-options" });
      optionEls = q.options.map((o, idx) => {
        const input = h("input", { type: type === "multi" ? "checkbox" : "radio", name: group, value: idx });
        const label = h("label", { class: "q-option" }, input, h("span", { html: o }));
        opts.append(label);
        return label;
      });
      wrap.append(opts);
      getAnswer = () => optionEls.map((l, idx) => ($("input", l).checked ? idx : -1)).filter((x) => x >= 0);
    } else {
      const input = type === "output" ? h("textarea", { class: "q-text-input", rows: 3, placeholder: "Exact output…" }) : h("input", { class: "q-text-input", type: "text", placeholder: "Your answer…" });
      wrap.append(input);
      getAnswer = () => input.value;
    }
    const checkBtn = h("button", { class: "btn small primary", text: "Check answer" });
    checkBtn.addEventListener("click", () => {
      const ans = getAnswer();
      if ((Array.isArray(ans) && !ans.length) || (!Array.isArray(ans) && !ans.trim())) { feedback.className = "q-feedback show bad"; feedback.innerHTML = "<strong>Choose or type an answer first.</strong>"; return; }
      let correct;
      if (type === "single" || type === "multi") {
        const expected = type === "multi" ? [...q.answer].sort() : [q.answer];
        correct = JSON.stringify([...ans].sort()) === JSON.stringify(expected);
        optionEls.forEach((l, idx) => {
          if (expected.includes(idx)) l.classList.add("correct");
          else if (ans.includes(idx)) l.classList.add("incorrect");
          $("input", l).disabled = true;
        });
      } else {
        const norm = (s) => s.replace(/\r/g, "").split("\n").map((l) => l.trimEnd()).join("\n").trim();
        const accepted = (Array.isArray(q.answer) ? q.answer : [q.answer]).map((a) => (type === "text" ? norm(a).toLowerCase() : norm(a)));
        const given = type === "text" ? norm(ans).toLowerCase() : norm(ans);
        correct = accepted.includes(given);
        $(".q-text-input", wrap).disabled = true;
      }
      checkBtn.disabled = true;
      feedback.className = "q-feedback show " + (correct ? "ok" : "bad");
      const reveal = type === "output" || type === "text" ? `<p>Expected: <code>${esc(Array.isArray(q.answer) ? q.answer[0] : q.answer).replace(/\n/g, "<br>")}</code></p>` : "";
      feedback.innerHTML = `<strong>${correct ? "Correct." : "Not quite."}</strong>${correct ? "" : reveal}${q.explanation}`;
      highlightAll(feedback);
      onAnswer(correct);
    });
    wrap.append(h("div", { class: "btn-row" }, checkBtn), feedback);
    return wrap;
  }

  /* ---------------- flashcards ---------------- */
  function mountFlashcards(el) {
    let cards;
    try { cards = JSON.parse($("script[type='application/json']", el).textContent); } catch { return; }
    if (!Array.isArray(cards)) cards = cards.cards || [];
    el.innerHTML = "";
    el.classList.add("widget");
    let i = 0;
    const card = h("div", { class: "flashcard", tabindex: "0", role: "button", "aria-label": "Flip card" });
    const counter = h("span", { class: "status" });
    const show = () => {
      card.classList.remove("flipped");
      card.innerHTML = `<div class="face front"><small>Prompt</small><div>${cards[i].front}</div></div><div class="face back"><small>Answer</small><div>${cards[i].back}</div></div>`;
      counter.textContent = `${i + 1} / ${cards.length}`;
    };
    card.addEventListener("click", () => card.classList.toggle("flipped"));
    card.addEventListener("keydown", (e) => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); card.classList.toggle("flipped"); } });
    el.append(
      h("div", { class: "widget-head" }, h("span", { class: "w-kind", text: "Flashcards" }), h("span", { class: "w-title", text: el.dataset.title || "Review" }), h("span", { class: "spacer" }), counter),
      h("div", { class: "card-stage" }, card),
      h("div", { class: "viz-controls" },
        h("button", { class: "btn small", text: "← Prev", onclick: () => { i = (i - 1 + cards.length) % cards.length; show(); } }),
        h("button", { class: "btn small primary", text: "Flip", onclick: () => card.classList.toggle("flipped") }),
        h("button", { class: "btn small", text: "Next →", onclick: () => { i = (i + 1) % cards.length; show(); } }),
        h("button", { class: "btn small", text: "Shuffle", onclick: () => { cards.sort(() => Math.random() - 0.5); i = 0; show(); } })),
    );
    show();
  }

  /* ---------------- tabs, checklists, mermaid ---------------- */
  function mountTabs(el) {
    const tabs = $$(":scope > .tab", el);
    const bar = h("div", { class: "tab-bar", role: "tablist" });
    tabs.forEach((t, i) => {
      const b = h("button", { role: "tab", "aria-selected": i === 0 ? "true" : "false", text: t.dataset.label || `Tab ${i + 1}` });
      b.addEventListener("click", () => {
        tabs.forEach((x) => x.classList.remove("active"));
        $$("button", bar).forEach((x) => x.setAttribute("aria-selected", "false"));
        t.classList.add("active"); b.setAttribute("aria-selected", "true");
        t.querySelectorAll(".CodeMirror").forEach((cm) => cm.CodeMirror?.refresh());
      });
      bar.append(b);
      if (i === 0) t.classList.add("active");
    });
    el.prepend(bar);
  }
  function mountChecklist(el) {
    const id = el.dataset.id;
    const items = $$(":scope > li", el);
    const state = Store.get("checklists", id) || [];
    items.forEach((li, i) => {
      const box = h("input", { type: "checkbox" });
      box.checked = !!state[i];
      const span = h("span");
      while (li.firstChild) span.append(li.firstChild);
      li.append(box, span);
      li.classList.toggle("checked", box.checked);
      box.addEventListener("change", () => {
        const s = Store.get("checklists", id) || [];
        s[i] = box.checked;
        Store.set("checklists", id, s);
        li.classList.toggle("checked", box.checked);
      });
    });
  }
  async function renderMermaid(root = document) {
    const blocks = $$("pre.mermaid, div.mermaid", root);
    if (!blocks.length) return;
    blocks.forEach((b) => { b.dataset.mmd ||= b.textContent; });
    try {
      await loadScript(CDN.mermaid);
      window.mermaid.initialize({ startOnLoad: false, theme: currentTheme() === "dark" ? "dark" : "neutral", fontFamily: "Barlow, system-ui, sans-serif", securityLevel: "strict" });
      for (const b of blocks) { b.removeAttribute("data-processed"); b.innerHTML = esc(b.dataset.mmd); }
      await window.mermaid.run({ nodes: blocks });
    } catch { /* diagrams fall back to their source text */ }
  }

  /* ---------------- tracer (step through execution) ---------------- */
  const REF_COLORS = ["--viz-1", "--viz-2", "--viz-3", "--viz-4", "--viz-5", "--viz-6"];
  function refTag(n) {
    const color = getComputedStyle(document.documentElement).getPropertyValue(REF_COLORS[(n - 1) % REF_COLORS.length]);
    return `<span class="ref-tag" style="background:${color}" title="Same tag = same object in memory">obj ${n}</span>`;
  }
  function mountTracer(el) {
    const src = $("textarea", el);
    const original = dedent(src ? src.value : el.textContent);
    el.innerHTML = "";
    el.classList.add("widget");
    const head = h("div", { class: "widget-head" },
      h("span", { class: "w-kind", text: "Step-through" }),
      h("span", { class: "w-title", text: el.dataset.title || "Watch the code run line by line" }),
      h("span", { class: "spacer" }), runtimeBadge());
    const host = h("div", { class: "editor-host" });
    const editor = makeEditor(host, original, { onRun: () => trace() });
    const grid = h("div", { class: "tracer-grid" });
    const codeView = h("pre", { class: "tracer-code" });
    const state = h("div", { class: "tracer-state", html: '<span class="status">Press “Visualize” to record every step, then scrub through them.</span>' });
    grid.append(codeView, state);
    const slider = h("input", { type: "range", min: 0, max: 0, value: 0, "aria-label": "Step" });
    const stepLabel = h("span", { class: "status", text: "" });
    let steps = [], idx = 0, timer = null, finalOut = "", error = null, codeLines = [];
    const render = () => {
      if (!steps.length) return;
      const s = steps[idx];
      const prev = steps[idx - 1];
      $$(".ln", codeView).forEach((ln, i) => {
        ln.classList.toggle("cur", i + 1 === s.line);
        ln.classList.toggle("prev", !!prev && i + 1 === prev.line && prev.line !== s.line);
      });
      const curLine = $(".ln.cur", codeView);
      if (curLine) {
        const top = curLine.offsetTop - codeView.clientHeight / 2;
        codeView.scrollTop = Math.max(0, top);
      }
      const fname = s.stack.at(-1)?.name;
      const evText = s.event === "line" ? `about to run line ${s.line}` : s.event === "return" ? (fname === "<module>" ? "program finished" : `returning from ${fname}()`) : `exception: ${s.exc}`;
      let html = `<div class="status" style="margin-bottom:6px">Step ${idx + 1} of ${steps.length} · ${esc(evText)}</div>`;
      const prevStack = prev?.stack || [];
      s.stack.forEach((f, fi) => {
        const prevFrame = prevStack[fi] && prevStack[fi].name === f.name ? prevStack[fi] : null;
        const rows = Object.entries(f.locals).filter(([k, v]) => !(f.name === "<module>" && (v.t === "function" || v.t === "type") && el.dataset.hideFunctions !== undefined));
        html += `<div class="frame"><h5>${f.name === "<module>" ? "Global frame" : esc(f.name) + "()"}</h5><table>`;
        if (!rows.length) html += `<tr><td class="status">(no variables yet)</td></tr>`;
        for (const [k, v] of rows) {
          const changed = prevFrame && (!prevFrame.locals[k] || prevFrame.locals[k].r !== v.r);
          html += `<tr><td class="var">${esc(k)}</td><td class="${changed ? "changed" : ""}">${v.ref ? refTag(v.ref) : ""}${esc(v.r)} <span class="status">${esc(v.t)}</span></td></tr>`;
        }
        if (s.event === "return" && fi === s.stack.length - 1 && s.ret) html += `<tr><td class="var">↩ return</td><td class="changed">${esc(s.ret.r)}</td></tr>`;
        html += `</table></div>`;
      });
      html += `<div class="status">Printed so far</div><div class="tracer-out">${esc(s.out)}</div>`;
      if (idx === steps.length - 1 && error) html += `<div class="verdict bad" style="margin-top:6px">${esc(error)}</div>`;
      state.innerHTML = html;
      slider.value = idx;
      stepLabel.textContent = `${idx + 1}/${steps.length}`;
    };
    const go = (n) => { idx = Math.max(0, Math.min(steps.length - 1, n)); render(); };
    const play = () => {
      if (timer) { clearInterval(timer); timer = null; playBtn.textContent = "Play ▶"; return; }
      if (idx >= steps.length - 1) idx = 0;
      playBtn.textContent = "Pause ❚❚";
      timer = setInterval(() => { if (idx >= steps.length - 1) { play(); return; } go(idx + 1); }, 650);
    };
    const trace = async () => {
      if (timer) play();
      state.innerHTML = '<span class="status">Recording steps…</span>';
      const code = editor.getValue();
      codeLines = code.split("\n");
      codeView.innerHTML = codeLines.map((l, i) => `<span class="ln"><span class="n">${i + 1}</span>${esc(l) || " "}</span>`).join("");
      const res = await Py.request("trace", { code, stdin: (el.dataset.stdin || "").replace(/\\n/g, "\n") }).catch((e) => ({ error: e.message }));
      if (res.error) { state.innerHTML = `<div class="verdict bad">${esc(res.error)}</div>`; return; }
      const data = JSON.parse(res.result);
      steps = data.steps; error = data.error; finalOut = data.out;
      if (!steps.length) { state.innerHTML = `<div class="verdict bad">${esc(error || "Nothing to show.")}</div>`; return; }
      slider.max = steps.length - 1;
      go(0);
    };
    slider.addEventListener("input", () => go(+slider.value));
    const playBtn = h("button", { class: "btn small", text: "Play ▶", onclick: play });
    const controls = h("div", { class: "tracer-controls" },
      h("button", { class: "btn primary small", text: "Visualize", onclick: trace }),
      h("button", { class: "btn small", text: "⏮", title: "First step", onclick: () => go(0) }),
      h("button", { class: "btn small", text: "◀ Back", onclick: () => go(idx - 1) }),
      h("button", { class: "btn small", text: "Step ▶", onclick: () => go(idx + 1) }),
      h("button", { class: "btn small", text: "⏭", title: "Last step", onclick: () => go(steps.length - 1) }),
      playBtn, slider, stepLabel);
    el.append(head, host, controls, grid);
    void finalOut;
  }

  /* ---------------- home page ---------------- */
  function renderHome() {
    const map = $("#curriculum-map");
    if (!map) return;
    const draw = () => {
      map.innerHTML = "";
      for (const part of C.parts) {
        const items = [...part.modules, ...part.projects];
        const done = items.filter((m) => isDone(m.id)).length;
        const hours = Math.round(part.modules.reduce((a, m) => a + (m.minutes || 0), 0) / 60);
        map.append(h("article", { class: "part-card" },
          h("header", {}, h("span", { class: "tag", text: `Part ${part.number}` }), h("h3", { text: part.title }), h("span", { class: "level", text: `${part.level}${hours ? ` · ~${hours} h of lessons` : ""}` })),
          h("p", { style: "margin:0.4em 0 0;color:var(--fg-muted)", text: part.summary }),
          h("div", { class: "bar" }, h("i", { style: `width:${items.length ? (done / items.length) * 100 : 0}%` })),
          h("ul", { class: "module-list" }, items.map((m) => h("li", {}, h("a", { href: m.href, title: m.summary || "", html: `<span class="mid">${m.id === "capstone" ? "★" : m.id.toUpperCase()}</span>${esc(m.title)}${isDone(m.id) ? '<span class="done">✓</span>' : ""}` })))),
        ));
      }
      const all = allItems();
      const doneCount = all.filter((m) => isDone(m.id)).length;
      const stat = $("#progress-stats");
      if (stat) {
        const quizzes = Object.values(Store.load().quizzes);
        const avg = quizzes.length ? Math.round((quizzes.reduce((a, q) => a + q.best, 0) / quizzes.length) * 100) : 0;
        const solved = Object.values(Store.load().exercises).filter((e) => e.solved).length;
        const next = all.find((m) => !isDone(m.id));
        stat.innerHTML = `<div class="card"><h4>Completed</h4><div style="font-size:1.6rem;font-weight:800">${doneCount} / ${all.length}</div></div>
          <div class="card"><h4>Exercises solved</h4><div style="font-size:1.6rem;font-weight:800">${solved}</div></div>
          <div class="card"><h4>Average quiz best</h4><div style="font-size:1.6rem;font-weight:800">${quizzes.length ? avg + "%" : "—"}</div></div>
          <div class="card"><h4>Up next</h4>${next ? `<a href="${next.href}">${esc(next.title)}</a>` : "You finished everything."}</div>`;
      }
    };
    draw();
    document.addEventListener("pp:progress", draw);
    $("#export-progress")?.addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(Store.load(), null, 2)], { type: "application/json" });
      const a = h("a", { href: URL.createObjectURL(blob), download: `kubernetes-practicum-progress-${new Date().toISOString().slice(0, 10)}.json` });
      document.body.append(a); a.click(); a.remove();
    });
    $("#import-progress")?.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try { Store.data = JSON.parse(await file.text()); Store.load(); Store.save(); alertBox("Progress imported."); } catch { alertBox("That file is not a progress export."); }
    });
  }
  function alertBox(text) {
    const el = $("#progress-message");
    if (el) { el.textContent = text; setTimeout(() => (el.textContent = ""), 4000); }
  }

  /* ---------------- boot ---------------- */
  function mountComponents(root = document) {
    $$(".runnable", root).forEach(mountRunnable);
    $$(".exercise[data-id]", root).forEach(mountExercise);
    $$(".quiz[data-id]", root).forEach(mountQuiz);
    $$(".flashcards", root).forEach(mountFlashcards);
    $$(".tracer", root).forEach(mountTracer);
    $$(".tabs", root).forEach(mountTabs);
    $$(".checklist[data-id]", root).forEach(mountChecklist);
    if (window.PPViz) $$(".viz[data-viz]", root).forEach((el) => { try { window.PPViz.mount(el); } catch (e) { el.textContent = `Visualizer failed: ${e.message}`; } });
  }
  // The single-file edition (body[data-engine="single"]) supplies its own shell and calls these directly.
  window.PPCourse = { Store, Py, mount: mountComponents, highlightAll, renderMermaid, currentTheme, themePref, cycleTheme, themeButtonHtml, isDone, allItems };
  applySavedTheme();
  if (body.dataset.engine === "single") return;
  document.addEventListener("DOMContentLoaded", () => {
    const main = $("main");
    if (!main) return;
    buildShell();
    if (PAGE_ID === "home") renderHome();
    mountComponents();
    buildModuleFooter(main);
    highlightAll();
    renderMermaid();
    document.addEventListener("pp:theme", () => renderMermaid());
    if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
  });
})();

</script>
<script>
/* Single-file edition shell: hash routes, views, and progress on top of the course runtime in course.js. */
(() => {
  "use strict";
  const D = window.PP_DATA;
  const C = D.curriculum;
  const P = window.PPCourse;
  const Store = P.Store;

  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
  const view = $("#view");

  /* ---------------- index ---------------- */
  const PAGES = D.pages;
  const BY_ID = {};
  for (const [path, pg] of Object.entries(PAGES)) BY_ID[pg.id] = path;
  const PARTS = C.parts;
  const ITEMS = PARTS.flatMap((p) => [...p.modules, ...p.projects].map((m) => ({ ...m, part: p })));
  const MODULES = ITEMS.filter((m) => /^m\d/.test(m.id));
  const PROJECTS = ITEMS.filter((m) => !/^m\d/.test(m.id));
  const REFS = C.reference || [];
  const itemById = (id) => ITEMS.find((m) => m.id === id);
  const pageOf = (id) => PAGES[BY_ID[id]];

  /* ---------------- progress ---------------- */
  const isDone = (id) => !!Store.get("items", id)?.done;
  const quizBest = (pg) => {
    const q = (pg?.quizzes || []).map((id) => Store.get("quizzes", id)).filter(Boolean);
    return q.length ? Math.max(...q.map((x) => x.best)) : null;
  };
  const solved = (pg) => (pg?.exercises || []).filter((id) => Store.get("exercises", id)?.solved).length;
  const ticked = (pg) => Object.entries(pg?.checklists || {}).reduce((a, [id, n]) => a + Math.min(n, (Store.get("checklists", id) || []).filter(Boolean).length), 0);
  const tickTotal = (pg) => Object.values(pg?.checklists || {}).reduce((a, b) => a + b, 0);
  const started = (m) => { const pg = pageOf(m.id); return isDone(m.id) || quizBest(pg) !== null || solved(pg) > 0 || ticked(pg) > 0; };
  const statusOf = (m) => (isDone(m.id) ? "Complete" : started(m) ? "In progress" : "Not started");
  const partDone = (p) => [...p.modules, ...p.projects].filter((m) => isDone(m.id)).length;
  const partSize = (p) => p.modules.length + p.projects.length;
  const pct = (x) => (x === null ? "–" : Math.round(x * 100) + "%");
  const fmtMin = (n) => (!n ? "" : n < 60 ? `${n} min` : `~${Math.round((n / 60) * 2) / 2} h`);
  const nextItem = () => ITEMS.find((m) => !isDone(m.id));

  /* ---------------- links and routes ---------------- */
  let current = null;
  let currentBase = "index.html";
  let refreshCurrent = null;
  const isRoute = (r) => r === "home" || r === "projects" || r === "reference" || /^part-\d+$/.test(r) || r in BY_ID;
  function parseHash() {
    const raw = decodeURIComponent(location.hash.slice(1));
    const cut = raw.indexOf("/");
    return cut === -1 ? { route: raw || "home", anchor: "" } : { route: raw.slice(0, cut) || "home", anchor: raw.slice(cut + 1) };
  }
  function resolveLink(href, base) {
    if (!href) return null;
    if (/^(https?:|mailto:|data:|javascript:|\/\/)/i.test(href)) return { ext: href };
    if (href.startsWith("#")) {
      const frag = href.slice(1);
      if (isRoute(frag.split("/")[0])) return { hash: href };
      return { hash: `#${current}${frag ? "/" + frag : ""}` };
    }
    const u = new URL(href, "https://pp.invalid/" + base);
    const path = decodeURIComponent(u.pathname.slice(1));
    const pg = PAGES[path];
    const frag = u.hash.slice(1);
    if (pg) return { hash: `#${pg.id}${frag ? "/" + frag : ""}` };
    return { ext: D.siteUrl + path + u.hash };
  }
  function rewriteLinks(root, base) {
    for (const a of $$("a[href]", root)) {
      if (a.dataset.eng) continue;
      const r = resolveLink(a.getAttribute("href"), base);
      a.dataset.eng = "1";
      if (!r) continue;
      if (r.hash) a.setAttribute("href", r.hash);
      else { a.setAttribute("href", r.ext); a.target = "_blank"; a.rel = "noopener"; }
    }
  }
  document.addEventListener("click", (e) => {
    const a = e.target.closest("a[href]");
    if (!a || a.dataset.eng || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey) return;
    const href = a.getAttribute("href");
    if (/^blob:|^data:/.test(href) || a.hasAttribute("download")) return;
    const r = resolveLink(href, currentBase);
    if (!r) return;
    e.preventDefault();
    if (r.ext) window.open(r.ext, "_blank", "noopener");
    else location.hash = r.hash;
  });
  function scrollToAnchor(anchor) {
    if (!anchor) return;
    requestAnimationFrame(() => document.getElementById(anchor)?.scrollIntoView());
  }
  function route() {
    const { route: r, anchor } = parseHash();
    const target = isRoute(r) ? r : "home";
    if (target !== current) {
      current = target;
      draw(target);
      if (!anchor) window.scrollTo({ top: 0 });
    }
    scrollToAnchor(anchor);
  }
  window.addEventListener("hashchange", route);

  /* ---------------- shell ---------------- */
  const icon = {
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  };
  function tabFor(r) {
    if (r === "projects" || r === "reference" || r === "home") return r;
    if (/^part-\d+$/.test(r)) return r;
    const item = itemById(r);
    if (item) return /^m\d/.test(item.id) ? `part-${item.part.number}` : "projects";
    return "reference";
  }
  function renderTabs() {
    const on = tabFor(current);
    const b = (id, label, dot) => `<button data-go="${id}" aria-current="${on === id}">${dot === undefined ? "" : `<span class="dot ${dot ? "ok" : ""}"></span>`}${esc(label)}</button>`;
    $("#tabs").innerHTML = b("home", "Overview") + '<span class="sep"></span>' +
      PARTS.map((p) => b(`part-${p.number}`, `${p.number}. ${p.title}`, partDone(p) === partSize(p))).join("") +
      '<span class="sep"></span>' + b("projects", "Projects") + b("reference", "Reference");
    $("#tabs [aria-current='true']")?.scrollIntoView({ block: "nearest", inline: "center" });
  }
  $("#tabs").addEventListener("click", (e) => { const t = e.target.closest("[data-go]"); if (t) location.hash = t.dataset.go; });
  function updateMeter() { $("#meter").textContent = `${ITEMS.filter((m) => isDone(m.id)).length} / ${ITEMS.length} complete`; }
  function updateThemeButton() {
    const pref = P.themePref();
    $("#theme").innerHTML = P.themeButtonHtml();
    $("#theme").setAttribute("aria-label", `Theme: ${pref}. Click to switch (auto, light, dark).`);
    $("#theme").title = `Theme: ${pref === "auto" ? "auto (follows your system)" : pref}`;
  }
  $("#theme").addEventListener("click", () => {
    P.cycleTheme();
    updateThemeButton();
    P.renderMermaid(view);
  });
  document.addEventListener("pp:theme", () => P.renderMermaid(view));
  function toast(text) {
    const el = $("#toast");
    el.textContent = text; el.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 2200);
  }
  document.addEventListener("pp:progress", () => { updateMeter(); renderTabs(); refreshCurrent?.(); });

  /* ---------------- shared pieces ---------------- */
  const pill = (p) => `<span class="lvl l${Math.min(5, Math.floor(p.number / 2))}">Part ${p.number} · ${esc(p.level)}</span>`;
  const meterline = (done, total) => `<div class="meterline"><div class="bar"><i style="width:${total ? (done / total) * 100 : 0}%"></i></div>${done}/${total}</div>`;
  const chk = (ok) => `<span class="chk ${ok ? "ok" : "no"}">${ok ? "✓" : "–"}</span>`;
  function itemRow(m) {
    const pg = pageOf(m.id);
    const ex = pg?.exercises.length || 0;
    const tt = tickTotal(pg);
    return `<tr><td class="num">${esc(m.id.toUpperCase())}</td>
      <td><a class="e-link" href="#${m.id}">${esc(m.title)}</a>${m.summary ? `<div class="muted" style="font-size:.82rem">${esc(m.summary)}</div>` : ""}</td>
      <td class="num">${fmtMin(m.minutes)}</td><td class="num">${pct(quizBest(pg))}</td>
      <td class="num">${ex ? `${solved(pg)}/${ex}` : "–"}</td><td class="num">${tt ? `${ticked(pg)}/${tt}` : "–"}</td><td>${chk(isDone(m.id))}</td></tr>`;
  }
  const itemTable = (items) => `<div class="tbl"><table><thead><tr><th>No</th><th>Module</th><th>Time</th><th>Quiz</th><th>Exercises</th><th>Checklist</th><th>Done</th></tr></thead><tbody>${items.map(itemRow).join("")}</tbody></table></div>`;
  function parseContent(html) {
    const t = document.createElement("template");
    t.innerHTML = html;
    return t.content;
  }
  function heroOf(frag) {
    const hero = $(".lesson-hero, .home-hero", frag);
    const out = {
      eyebrow: hero ? $(".eyebrow", hero)?.textContent.trim() || "" : "",
      title: hero ? $("h1", hero)?.innerHTML || "" : "",
      lede: hero ? $(".lede", hero)?.innerHTML || "" : "",
      objectives: hero ? $$(".objectives li", hero).map((li) => li.innerHTML) : [],
      extra: hero ? $$(".btn-row, .callout", hero) : [],
    };
    hero?.remove();
    return out;
  }
  function runInlineScripts(root) {
    for (const old of $$("script", root)) {
      const type = (old.getAttribute("type") || "").trim();
      if (type && type !== "text/javascript" && type !== "module") continue;
      const s = document.createElement("script");
      if (type) s.type = type;
      s.textContent = old.textContent;
      old.replaceWith(s);
    }
  }
  function activate(root, base) {
    rewriteLinks(root, base);
    P.mount(root);
    runInlineScripts(root);
    P.highlightAll(root);
    P.renderMermaid(root);
    rewriteLinks(root, base);
  }
  function finishBox(item, pg) {
    const box = document.createElement("div");
    const notes = document.createElement("div");
    notes.className = "notes stack";
    notes.style.gap = ".4rem";
    notes.innerHTML = `<span class="eyebrow">My notes · saved in this browser</span><textarea placeholder="Write what you learned, what confused you, and questions to revisit."></textarea>`;
    const ta = $("textarea", notes);
    ta.value = Store.get("notes", item.id) || "";
    let t;
    ta.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => Store.set("notes", item.id, ta.value), 400); });
    const refresh = () => {
      const done = isDone(item.id);
      const ex = pg.exercises.length, tt = tickTotal(pg);
      box.className = "complete" + (done ? " is-done" : "");
      box.innerHTML = `<div style="flex:1;min-width:220px"><b>${done ? `You completed this ${/^m\d/.test(item.id) ? "module" : "project"}.` : "Finished? Mark it complete to track your progress."}</b>
        <div class="muted" style="font-size:.88rem">Exercises solved ${ex ? `${solved(pg)}/${ex}` : "–"} · Quiz best ${pct(quizBest(pg))} · Checklist ${tt ? `${ticked(pg)}/${tt}` : "–"}</div></div>
        <button class="e-btn ${done ? "" : "primary"}" type="button">${done ? "Mark as not complete" : "Mark complete"}</button>`;
      $("button", box).addEventListener("click", () => {
        Store.set("items", item.id, done ? { done: false } : { done: true, at: new Date().toISOString() });
        if (!done) toast("Marked complete");
      });
      const st = $("[data-status]");
      if (st) st.textContent = statusOf(item);
    };
    refresh();
    refreshCurrent = refresh;
    const wrap = document.createElement("div");
    wrap.className = "stack";
    wrap.append(box, notes);
    return wrap;
  }
  function pager(prev, next) {
    const a = (it, cls, lab) => `<a class="e-btn ${cls}" href="#${it.id}">${lab === "prev" ? "← " : ""}${esc(it.title)}${lab === "next" ? " →" : ""}</a>`;
    return `<nav class="pager">${prev ? a(prev, "", "prev") : "<span></span>"}${next ? a(next, "primary", "next") : "<span></span>"}</nav>`;
  }

  /* ---------------- views ---------------- */
  function draw(r) {
    refreshCurrent = null;
    currentBase = "index.html";
    if (r === "home") viewHome();
    else if (r === "projects") viewProjects();
    else if (r === "reference") viewReference();
    else if (/^part-\d+$/.test(r)) viewPart(PARTS.find((p) => `part-${p.number}` === r) || PARTS[0]);
    else {
      const path = BY_ID[r];
      const pg = PAGES[path];
      currentBase = path;
      if (pg.kind === "module") viewModule(itemById(r), pg);
      else if (pg.kind === "project") viewProject(itemById(r), pg);
      else viewRefPage(REFS.find((x) => x.id === r) || { id: r, title: pg.title }, pg);
    }
    renderTabs();
    updateMeter();
    const titles = { home: "", projects: "Projects", reference: "Reference" };
    const it = itemById(r);
    const label = r in titles ? titles[r] : /^part-/.test(r) ? `Part ${r.slice(5)}` : it ? `${it.id.toUpperCase()} · ${it.title}` : REFS.find((x) => x.id === r)?.title || "";
    document.title = label ? `${label} · ${C.title}` : C.title;
  }

  function viewHome() {
    const home = parseContent(PAGES["index.html"].html);
    const hero = heroOf(home);
    const how = $("#how", home);
    const exTotal = Object.values(PAGES).reduce((a, p) => a + p.exercises.length, 0);
    const next = nextItem();
    const anyDone = ITEMS.some((m) => isDone(m.id));
    view.innerHTML = `<section class="sheet"><div class="hero">
      <div class="stack" style="gap:.6rem"><span class="eyebrow">Self-paced practicum · ${MODULES.length} modules · ${exTotal} graded exercises · ${PROJECTS.length} capstone${PROJECTS.length === 1 ? "" : "s"}</span>
        <h1 class="e-h e-h1">${esc(C.title)}</h1>
        <p class="lede">${hero.lede}</p>
        <div class="e-btns" style="margin-top:.6rem"><a class="e-btn primary" href="#${(next || MODULES[0]).id}">${anyDone ? "Continue" : "Start with Module 00"}</a>
          <a class="e-btn" href="#ref-roadmap">Roadmap</a><a class="e-btn" href="#reference">Reference</a></div></div>
      <div class="los"><span class="eyebrow">The path · tap a part</span>
        <div class="chain" role="group" aria-label="Parts" style="grid-template-columns:repeat(${Math.min(4, PARTS.length)},minmax(0,1fr))">${PARTS.map((p, i) => `<button type="button" data-part="${i}" aria-pressed="${i === 0}"><small>${String(p.number).padStart(2, "0")}</small>${esc(p.title.split(" · ")[0])}</button>`).join("")}</div>
        <div class="loscard" id="partcard"></div></div></div></section>

      <section class="section" style="margin-top:2rem"><div class="sec-head"><h2 class="e-h e-h2">Your progress</h2><span class="muted">Saved in this browser.</span></div>
        <div class="stats" id="stats"></div>
        <div class="e-btns"><button class="e-btn" type="button" id="export">Export progress</button><label class="e-btn">Import progress<input type="file" id="import" accept="application/json"></label></div></section>

      <section class="section"><div class="sec-head"><h2 class="e-h e-h2">How this course works</h2></div><div class="lesson" id="how-slot"></div></section>

      <section class="section"><div class="sec-head"><h2 class="e-h e-h2">Learning path</h2></div>
        <div class="path">${PARTS.map((p) => `<div class="stage">${pill(p)}<h3><a class="e-link" href="#part-${p.number}">${esc(p.title)}</a></h3><p>${esc(p.summary)}</p>${meterline(partDone(p), partSize(p))}</div>`).join("")}</div></section>

      <section class="section"><div class="sec-head"><h2 class="e-h e-h2">Progress register</h2></div>${itemTable(ITEMS)}
        <p class="muted" style="font-size:.88rem">Mark each module complete at the end of its page. Quiz, exercise, and checklist results save as you go.</p></section>`;
    if (how) { $("h2", how)?.remove(); $("#how-slot").append(...how.childNodes); }
    const card = $("#partcard");
    const setPart = (i) => {
      const p = PARTS[i];
      const hours = Math.round(p.modules.reduce((a, m) => a + (m.minutes || 0), 0) / 60);
      $$("[data-part]").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.part === i)));
      card.innerHTML = `<span class="eyebrow">Part ${p.number} · ${esc(p.level)}</span><div class="big">${esc(p.title)}</div><p style="margin:0">${esc(p.summary)}</p>
        <div class="kv"><div><span class="k">Modules</span>${p.modules.length}${p.projects.length ? ` + ${p.projects.length} project${p.projects.length > 1 ? "s" : ""}` : ""}</div><div><span class="k">Lessons</span>${hours ? `~${hours} h` : "–"}</div>
        <div style="grid-column:1/-1"><span class="k">Progress</span>${meterline(partDone(p), partSize(p))}</div></div>
        <div><a class="e-btn primary" href="#part-${p.number}">Open part ${p.number}</a></div>`;
    };
    $$("[data-part]").forEach((b) => b.addEventListener("click", () => setPart(+b.dataset.part)));
    const stats = () => {
      const quizzes = Object.values(Store.load().quizzes);
      const avg = quizzes.length ? Math.round((quizzes.reduce((a, q) => a + q.best, 0) / quizzes.length) * 100) + "%" : "–";
      const solvedAll = Object.values(Store.load().exercises).filter((e) => e.solved).length;
      const nx = nextItem();
      $("#stats").innerHTML = `<div class="stat"><span class="eyebrow">Completed</span><span class="v">${ITEMS.filter((m) => isDone(m.id)).length} / ${ITEMS.length}</span></div>
        <div class="stat"><span class="eyebrow">Exercises solved</span><span class="v">${solvedAll} / ${exTotal}</span></div>
        <div class="stat"><span class="eyebrow">Average quiz best</span><span class="v">${avg}</span></div>
        <div class="stat"><span class="eyebrow">Up next</span>${nx ? `<a class="e-link" href="#${nx.id}">${esc(nx.title)}</a>` : "You finished everything."}</div>`;
    };
    stats();
    refreshCurrent = stats;
    setPart(Math.max(0, PARTS.findIndex((p) => partDone(p) < partSize(p))));
    bindBackup();
    activate(view, "index.html");
  }
  function bindBackup() {
    $("#export")?.addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(Store.load(), null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `kubernetes-practicum-progress-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.append(a); a.click(); a.remove();
    });
    $("#import")?.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try { Store.data = JSON.parse(await file.text()); Store.load(); Store.save(); toast("Progress imported"); draw(current); }
      catch { toast("That file is not a progress export"); }
    });
  }

  function viewPart(p) {
    const i = PARTS.indexOf(p);
    const hours = Math.round(p.modules.reduce((a, m) => a + (m.minutes || 0), 0) / 60);
    const prev = PARTS[i - 1], next = PARTS[i + 1];
    view.innerHTML = `<section class="sheet stack" style="gap:.8rem">
      <span class="eyebrow">Part ${p.number} of ${PARTS[PARTS.length - 1].number}</span>
      <h1 class="e-h e-h1">${esc(p.title)}</h1><p class="lede">${esc(p.summary)}</p>
      <div class="memo"><div><span class="k">Level</span><span class="v">${esc(p.level)}</span></div><div><span class="k">Modules</span><span class="v">${p.modules.length}</span></div>
        <div><span class="k">Lessons</span><span class="v">${hours ? `~${hours} h` : "–"}</span></div><div><span class="k">Done</span><span class="v">${partDone(p)}/${partSize(p)}</span></div></div>
      ${p.modules.length ? `<div class="section" style="margin-top:1.2rem"><div class="sec-head"><span class="tag">Modules</span></div>${itemTable(p.modules)}</div>` : ""}
      ${p.projects.length ? `<div class="section"><div class="sec-head"><span class="tag">Projects</span></div>${itemTable(p.projects)}</div>` : ""}
    </section>
    <nav class="pager">${prev ? `<a class="e-btn" href="#part-${prev.number}">← Part ${prev.number}: ${esc(prev.title)}</a>` : "<span></span>"}${next ? `<a class="e-btn primary" href="#part-${next.number}">Part ${next.number}: ${esc(next.title)} →</a>` : `<a class="e-btn primary" href="#projects">Projects →</a>`}</nav>`;
    refreshCurrent = () => { if (current === `part-${p.number}`) { const y = scrollY; viewPart(p); scrollTo(0, y); } };
  }

  const SPECIAL = [["practice", "e-lab", "Interactive lab"], ["quiz", "e-quiz", "Quiz"], ["mini-project", "e-project", "Section project"], ["recap", "e-review", "Review"]];
  function viewModule(m, pg) {
    const frag = parseContent(pg.html);
    const hero = heroOf(frag);
    const tops = Array.from(frag.children);
    const special = Object.fromEntries(SPECIAL.map(([sid]) => [sid, tops.find((el) => el.id === sid)]));
    const learn = tops.filter((el) => !Object.values(special).includes(el));
    const idx = MODULES.indexOf(m);
    const learnToc = learn.filter((el) => el.id && $("h2", el)).map((el) => `<a href="#${m.id}/${el.id}">${esc($("h2", el).textContent)}</a>`).join("");
    const chips = [["e-learn", "Learn"], ...SPECIAL.filter(([sid]) => special[sid]).map(([, wid, lab]) => [wid, lab]), ["e-finish", "Finish"]]
      .map(([id, lab]) => `<a href="#${m.id}/${id}">${lab}</a>`).join("");
    view.innerHTML = `<article class="sheet">
      <span class="eyebrow">${esc(hero.eyebrow || `Part ${m.part.number} · ${m.part.title}`)} · ${idx + 1} of ${MODULES.length}</span>
      <h1 class="e-h e-h1" style="margin-top:.3rem">${hero.title || esc(m.title)}</h1>
      <p class="lede" style="margin-top:.6rem">${hero.lede || esc(m.summary)}</p>
      <div class="memo"><div><span class="k">Module</span><span class="v">${esc(m.id.toUpperCase())}</span></div><div><span class="k">Part</span><span class="v">${m.part.number} · ${esc(m.part.level)}</span></div>
        <div><span class="k">Time</span><span class="v">${fmtMin(m.minutes) || "–"} + project</span></div><div><span class="k">Status</span><span class="v" data-status>${statusOf(m)}</span></div></div>
      <div class="section" style="margin-top:1.8rem"><div class="sec-head"><span class="tag">Objectives</span></div>
        ${hero.objectives.length ? `<ul class="objectives-list">${hero.objectives.map((o) => `<li>→ ${o}</li>`).join("")}</ul>` : ""}
        <div class="toc">${chips}</div>${learnToc ? `<span class="eyebrow">In the lesson</span><div class="toc">${learnToc}</div>` : ""}</div>
      <div class="section" id="e-learn"><div class="sec-head"><span class="tag">Learn</span></div><div class="lesson" data-slot="learn"></div></div>
      ${SPECIAL.filter(([sid]) => special[sid]).map(([sid, wid, lab]) => `<div class="section" id="${wid}"><div class="sec-head"><span class="tag">${lab}</span><h3>${esc($("h2", special[sid])?.textContent || lab)}</h3></div><div class="lesson" data-slot="${sid}"></div></div>`).join("")}
      <div class="section" id="e-finish"><div class="sec-head"><span class="tag">Finish</span></div><div data-slot="finish"></div></div>
    </article>${pager(MODULES[idx - 1], MODULES[idx + 1] || PROJECTS.find((p) => p.part.number === m.part.number))}`;
    $("[data-slot='learn']").append(...learn);
    for (const [sid] of SPECIAL) {
      const sec = special[sid];
      if (!sec) continue;
      $("h2", sec)?.remove();
      $(`[data-slot='${sid}']`).append(sec);
    }
    $("[data-slot='finish']").append(finishBox(m, pg));
    Store.set("visits", m.id, (Store.get("visits", m.id) || 0) + 1);
    activate(view, BY_ID[m.id]);
  }

  function viewProject(item, pg) {
    const frag = parseContent(pg.html);
    const hero = heroOf(frag);
    const idx = PROJECTS.indexOf(item);
    view.innerHTML = `<article class="sheet">
      <span class="eyebrow">${esc(hero.eyebrow || `Part ${item.part.number} · Project`)}</span>
      <h1 class="e-h e-h1" style="margin-top:.3rem">${hero.title || esc(item.title)}</h1>
      <p class="lede" style="margin-top:.6rem">${hero.lede || esc(item.summary)}</p>
      <div class="memo"><div><span class="k">Project</span><span class="v">${esc(item.id === "capstone" ? "Capstone" : item.id.toUpperCase())}</span></div><div><span class="k">Part</span><span class="v">${item.part.number} · ${esc(item.part.level)}</span></div>
        <div><span class="k">Graded with</span><span class="v">pixi run grade ${esc(item.id)}</span></div><div><span class="k">Status</span><span class="v" data-status>${statusOf(item)}</span></div></div>
      ${hero.objectives.length ? `<div class="section" style="margin-top:1.8rem"><div class="sec-head"><span class="tag">Objectives</span></div><ul class="objectives-list">${hero.objectives.map((o) => `<li>→ ${o}</li>`).join("")}</ul></div>` : ""}
      <div class="section"><div class="sec-head"><span class="tag">Brief</span></div><div class="lesson" data-slot="body"></div></div>
      <div class="section" id="e-finish"><div class="sec-head"><span class="tag">Finish</span></div><div data-slot="finish"></div></div>
    </article>${pager(PROJECTS[idx - 1], PROJECTS[idx + 1])}`;
    $("[data-slot='body']").append(...hero.extra, frag);
    $("[data-slot='finish']").append(finishBox(item, pg));
    Store.set("visits", item.id, (Store.get("visits", item.id) || 0) + 1);
    activate(view, BY_ID[item.id]);
  }

  function viewProjects() {
    view.innerHTML = `<section class="sheet stack" style="gap:.6rem"><span class="eyebrow">Build on your own machine</span><h1 class="e-h e-h1">Projects</h1>
      <p class="lede">Each level ends with a graded capstone in the kubernetes-practicum repository. Start one with <code>pixi run start c1</code>, then check it with <code>pixi run grade c1</code>.</p></section>
      <div class="stack" style="gap:1rem;margin-top:1.25rem">${PROJECTS.map((it) => {
        const pg = pageOf(it.id);
        const tt = tickTotal(pg);
        return `<article class="cap"><div class="cap-head"><div class="stack" style="gap:.3rem"><span class="domain">${esc(it.id === "capstone" ? "Capstone" : it.id.toUpperCase())} · Part ${it.part.number} · ${esc(it.part.title)}</span><h2 class="e-h e-h2">${esc(it.title)}</h2></div>
          <span class="lvl l${isDone(it.id) ? 0 : 3}">${statusOf(it)}</span></div>
          <p>${esc(it.summary || "")}</p>${tt ? meterline(ticked(pg), tt) : ""}
          <div><a class="e-btn primary" href="#${it.id}">Open the brief</a></div></article>`;
      }).join("")}</div>`;
  }

  function viewReference() {
    view.innerHTML = `<section class="sheet stack"><span class="eyebrow">Keep these open while you work</span><h1 class="e-h e-h1">Reference</h1>
      <div class="path">${REFS.map((r) => `<div class="stage"><span class="eyebrow">Reference</span><h3><a class="e-link" href="#${r.id}">${esc(r.title)}</a></h3>${r.summary ? `<p>${esc(r.summary)}</p>` : ""}</div>`).join("")}</div>
      <div class="section"><div class="sec-head"><span class="tag">Backup</span><h3>Your progress</h3></div>
        <p class="muted" style="max-width:68ch">Progress, exercise code, quiz scores, and notes live in this browser. Export a backup to move them to another computer.</p>
        <div class="e-btns"><button class="e-btn" type="button" id="export">Export progress</button><label class="e-btn">Import progress<input type="file" id="import" accept="application/json"></label></div></div>
      <div class="section"><div class="sec-head"><span class="tag">About</span><h3>This edition</h3></div>
        <p style="max-width:68ch">A single-file edition of <a href="${esc(D.repoUrl)}" target="_blank" rel="noopener">kubernetes-practicum</a> v${esc(D.version)}, generated with <code>pixi run bundle</code>. Python runs in your browser with Pyodide, loaded on first use. The multi-page site is at <a href="${esc(D.siteUrl)}" target="_blank" rel="noopener">${esc(D.siteUrl)}</a>; both editions share progress when served from the same site.</p></div></section>`;
    bindBackup();
  }

  function viewRefPage(ref, pg) {
    const frag = parseContent(pg.html);
    const hero = heroOf(frag);
    const others = REFS.filter((r) => r.id !== ref.id).map((r) => `<a href="#${r.id}">${esc(r.title)}</a>`).join("");
    view.innerHTML = `<article class="sheet">
      <span class="eyebrow">${esc(hero.eyebrow || "Reference")}</span>
      <h1 class="e-h e-h1" style="margin-top:.3rem">${hero.title || esc(ref.title)}</h1>
      ${hero.lede ? `<p class="lede" style="margin-top:.6rem">${hero.lede}</p>` : ""}
      <div class="section" style="margin-top:1.4rem"><div class="toc">${others}</div></div>
      <div class="section"><div class="lesson" data-slot="body"></div></div></article>
      <nav class="pager"><a class="e-btn" href="#reference">← All reference</a><span></span></nav>`;
    $("[data-slot='body']").append(...hero.extra, frag);
    activate(view, BY_ID[ref.id]);
  }

  /* ---------------- boot ---------------- */
  updateThemeButton();
  route();
})();

</script>
</body>
</html>
