u003ctr>\u003ctd>kubelet\u003c/td>\u003ctd>Every node\u003c/td>\u003ctd>Makes the node's containers match the Pods assigned to it, and reports their status\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>kube-proxy\u003c/td>\u003ctd>Every node\u003c/td>\u003ctd>Programs packet rules so a Service's virtual IP reaches a ready Pod\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>container runtime\u003c/td>\u003ctd>Every node\u003c/td>\u003ctd>containerd here: pulls images and runs containers when the kubelet asks\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>CoreDNS, CNI (kindnet)\u003c/td>\u003ctd>Pods\u003c/td>\u003ctd>Cluster DNS names; Pod networking across nodes\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n    \u003cpre data-label=\"Terminal\">\u003ccode class=\"language-bash\">kubectl -n kube-system get pods -o wide\ndocker exec primer-control-plane ls /etc/kubernetes/manifests   # control plane runs as static Pods\u003c/code>\u003c/pre>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"objects\">\n    \u003ch2>Objects: spec and status\u003c/h2>\n    \u003cp>Everything you create is an \u003cstrong>object\u003c/strong> stored by the API server. Every object has the same\n      outer shape:\u003c/p>\n    \u003cpre>\u003ccode class=\"language-yaml\">apiVersion: apps/v1          # API group \"apps\", version \"v1\" (core objects are just \"v1\")\nkind: Deployment             # the type\nmetadata:                    # identity: name, namespace, labels, annotations\n  name: web\n  namespace: default\n  labels: {app: web}\nspec:                        # what YOU want (desired state)\n  replicas: 3\nstatus:                      # what the cluster OBSERVED (written by controllers)\n  readyReplicas: 2\u003c/code>\u003c/pre>\n    \u003cdiv class=\"two-col\">\n      \u003cdiv>\u003ch4>You write\u003c/h4>\u003cp>\u003ccode>metadata\u003c/code> (mostly) and \u003ccode>spec\u003c/code>. The spec is a request, not a\n        command: \"there should be three replicas\".\u003c/p>\u003c/div>\n      \u003cdiv>\u003ch4>Controllers write\u003c/h4>\u003cp>\u003ccode>status\u003c/code>, plus metadata fields like \u003ccode>uid\u003c/code>,\n        \u003ccode>resourceVersion\u003c/code>, \u003ccode>generation\u003c/code>, and \u003ccode>ownerReferences\u003c/code>.\u003c/p>\u003c/div>\n    \u003c/div>\n    \u003cp>\u003cstrong>Namespaces\u003c/strong> divide one cluster into named groups (\u003ccode>default\u003c/code>,\n      \u003ccode>kube-system\u003c/code>, \u003ccode>apps\u003c/code>…). Most objects live in one; a few (Nodes, Namespaces themselves,\n      PersistentVolumes) are cluster-wide. \u003ccode>kubectl api-resources\u003c/code> lists every kind and whether it's\n      namespaced.\u003c/p>\n    \u003cdiv class=\"runnable\" data-title=\"Read an object like a controller\">\n\u003ctextarea>\nimport kubelab\n\ndeploy = kubelab.load_manifests(\"\"\"\napiVersion: apps/v1\nkind: Deployment\nmetadata: {name: web, generation: 4}\nspec:\n  replicas: 3\n  selector: {matchLabels: {app: web}}\n  template:\n    metadata: {labels: {app: web}}\n    spec:\n      containers: [{name: app, image: \"ghcr.io/stefanprodan/podinfo:6.7.1\"}]\nstatus: {observedGeneration: 4, replicas: 3, readyReplicas: 2}\n\"\"\")[0]\n\nprint(\"desired:\", kubelab.dig(deploy, \"spec.replicas\"))\nprint(\"ready:  \", kubelab.dig(deploy, \"status.readyReplicas\"))\nprint(\"image:  \", kubelab.dig(deploy, \"spec.template.spec.containers.0.image\"))\nprint(\"problems:\", kubelab.check_object(deploy))\n\u003c/textarea>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"declarative\">\n    \u003ch2>Declarative, not imperative\u003c/h2>\n    \u003cdiv class=\"scroll\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>Imperative\u003c/th>\u003cth>Declarative\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>You say\u003c/td>\u003ctd>\"Start 2 more containers\"\u003c/td>\u003ctd>\"There should be 5\"\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Run it twice\u003c/td>\u003ctd>4 more containers\u003c/td>\u003ctd>Still 5: the second run changes nothing\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Something dies later\u003c/td>\u003ctd>Nobody notices\u003c/td>\u003ctd>The controller sees 4, wants 5, creates 1\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Where the truth lives\u003c/td>\u003ctd>In your shell history\u003c/td>\u003ctd>In a file you can review, diff, and version\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>kubectl\u003c/td>\u003ctd>\u003ccode>run\u003c/code>, \u003ccode>create\u003c/code>, \u003ccode>scale\u003c/code>, \u003ccode>set image\u003c/code>\u003c/td>\u003ctd>\u003ccode>apply -f\u003c/code>, \u003ccode>diff -f\u003c/code>, \u003ccode>delete -f\u003c/code>\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n    \u003cp>\u003ccode>kubectl apply\u003c/code> sends your file to the API server, which merges it into the stored object. It's\n      \u003cstrong>idempotent\u003c/strong>: applying the same file again is a no-op. That's what lets you keep manifests in\n      Git and apply them on every change, which is all GitOps is (Stage 4).\u003c/p>\n    \u003cdiv class=\"runnable\" data-predict data-title=\"Predict: what does a second apply change?\">\n\u003ctextarea>\ndesired = {\"replicas\": 5, \"image\": \"web:2\"}\nstored = {\"replicas\": 3, \"image\": \"web:1\"}\n\ndef apply(stored, desired):\n    changed = sorted(k for k in desired if stored.get(k) != desired[k])\n    stored.update(desired)\n    return changed\n\nprint(apply(stored, desired))\nprint(apply(stored, desired))\n\u003c/textarea>\n    \u003c/div>\n    \u003caside class=\"callout tip\">\u003cp>\u003cstrong>Remember:\u003c/strong> imperative commands are fine for learning and\n      emergencies. For anything you want to keep, write a file and \u003ccode>apply\u003c/code> it.\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"controllers\">\n    \u003ch2>Controllers and the reconcile loop\u003c/h2>\n    \u003cp>A \u003cstrong>controller\u003c/strong> is a loop that owns one kind of object. Each pass it does three things:\u003c/p>\n    \u003col>\n      \u003cli>\u003cstrong>Observe\u003c/strong>: read the desired state (the spec) and the actual state (what exists).\u003c/li>\n      \u003cli>\u003cstrong>Diff\u003c/strong>: compute the difference.\u003c/li>\n      \u003cli>\u003cstrong>Act\u003c/strong>: take a step that makes the difference smaller, then go around again.\u003c/li>\n    \u003c/ol>\n    \u003cp>Step through a ReplicaSet controller handling a deleted Pod, a scale-up, a dead node, and a scale-down:\u003c/p>\n    \u003cdiv class=\"viz\" data-viz=\"reconcile\">\u003c/div>\n    \u003cp>Kubernetes controllers are \u003cstrong>level-triggered\u003c/strong>: they act on the current \u003cem>state\u003c/em> (\"there\n      are 4, there should be 5\"), not on the \u003cem>event\u003c/em> that caused it (\"a Pod was deleted\"). If a controller\n      crashes and misses ten events, it doesn't matter: when it comes back it compares state again and does the\n      right thing. That's the source of Kubernetes' self-healing.\u003c/p>\n    \u003caside class=\"callout think\">\u003cp>An edge-triggered system reacts to each event once. What goes wrong if it misses\n      the \"Pod deleted\" event while it's restarting? Why can't that happen to a level-triggered loop?\u003c/p>\u003c/aside>\n    \u003cp>Controllers stack. A Deployment controller manages ReplicaSets; a ReplicaSet controller manages Pods; the\n      scheduler places Pods; the kubelet runs them. Each owns one level and records ownership in\n      \u003ccode>metadata.ownerReferences\u003c/code>, which is also how \u003cstrong>garbage collection\u003c/strong> works: delete a\n      Deployment and its ReplicaSets and Pods are deleted after it.\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"journey\">\n    \u003ch2>From \u003ccode>kubectl apply\u003c/code> to a running container\u003c/h2>\n    \u003cpre class=\"mermaid\">\nsequenceDiagram\n  participant You as kubectl apply\n  participant API as API server + etcd\n  participant DC as Deployment controller\n  participant RC as ReplicaSet controller\n  participant S as Scheduler\n  participant K as kubelet (worker)\n  You->>API: Deployment web (replicas: 3)\n  API-->>DC: watch: new Deployment\n  DC->>API: create ReplicaSet web-7d9f\n  API-->>RC: watch: new ReplicaSet\n  RC->>API: create 3 Pods (no node yet)\n  API-->>S: watch: unscheduled Pods\n  S->>API: bind each Pod to a node\n  API-->>K: watch: Pod assigned to me\n  K->>K: containerd pulls image, starts containers\n  K->>API: status: Running, Ready\n    \u003c/pre>\n    \u003cp>Notice that nobody calls anybody. Each component watches the API for its own kind of work, does it, and\n      writes the result back. You can watch the same story in the event stream:\u003c/p>\n    \u003cpre data-label=\"Terminal\">\u003ccode class=\"language-bash\">kubectl create deployment hello --image=nginx:1.27-alpine --replicas=2\nkubectl get events --sort-by=.lastTimestamp | tail -12\n# ScalingReplicaSet → SuccessfulCreate → Scheduled → Pulling → Pulled → Created → Started\nkubectl delete deployment hello\u003c/code>\u003c/pre>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"kubectl\">\n    \u003ch2>The kubectl you need first\u003c/h2>\n    \u003cdiv class=\"scroll\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>Verb\u003c/th>\u003cth>Example\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>get\u003c/td>\u003ctd>\u003ccode>kubectl get pods -A -o wide\u003c/code>\u003c/td>\u003ctd>\u003ccode>-A\u003c/code> all namespaces, \u003ccode>-o yaml\u003c/code> the whole object, \u003ccode>-w\u003c/code> watch\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>describe\u003c/td>\u003ctd>\u003ccode>kubectl describe pod web-abc\u003c/code>\u003c/td>\u003ctd>Human view with \u003cstrong>Events\u003c/strong> at the bottom: read these first when debugging\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>apply / diff / delete\u003c/td>\u003ctd>\u003ccode>kubectl diff -f app.yaml\u003c/code>\u003c/td>\u003ctd>See what would change before you apply\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>explain\u003c/td>\u003ctd>\u003ccode>kubectl explain deployment.spec.strategy\u003c/code>\u003c/td>\u003ctd>Schema docs from your own cluster, offline\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>logs / exec\u003c/td>\u003ctd>\u003ccode>kubectl logs -f POD\u003c/code>, \u003ccode>kubectl exec -it POD -- sh\u003c/code>\u003c/td>\u003ctd>Covered fully in M02\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>api-resources\u003c/td>\u003ctd>\u003ccode>kubectl api-resources\u003c/code>\u003c/td>\u003ctd>Every kind, its short name, group, and whether it's namespaced\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>jsonpath\u003c/td>\u003ctd>\u003ccode>kubectl get deploy web -o jsonpath='{.status.readyReplicas}'\u003c/code>\u003c/td>\u003ctd>Pull one field out for scripts\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n    \u003caside class=\"callout pro\">\u003cp>Short names save typing: \u003ccode>po\u003c/code>, \u003ccode>deploy\u003c/code>, \u003ccode>rs\u003c/code>,\n      \u003ccode>svc\u003c/code>, \u003ccode>ns\u003c/code>, \u003ccode>cm\u003c/code>. Add \u003ccode>alias k=kubectl\u003c/code> to your shell and the\n      completion script from \u003ccode>kubectl completion zsh\u003c/code>.\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"practice\">\n    \u003ch2>Practice\u003c/h2>\n    \u003cp>Five exercises on reconciling, API groups, rollout status, ownership, and grouping Pods.\u003c/p>\n\n    \u003cdiv class=\"exercise\" data-id=\"m01-e1\" data-title=\"One reconcile step\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Write \u003ccode>reconcile_step(desired, actual)\u003c/code> that returns a tuple \u003ccode>(action, count)\u003c/code>:\n          \u003ccode>(\"create\", n)\u003c/code> when there are too few, \u003ccode>(\"delete\", n)\u003c/code> when there are too many,\n          and \u003ccode>(\"none\", 0)\u003c/code> when they match. Negative \u003ccode>desired\u003c/code> is invalid: raise\n          \u003ccode>ValueError\u003c/code>.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\ndef reconcile_step(desired, actual):\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\ndef test_create():\n    assert reconcile_step(3, 1) == (\"create\", 2)\n\ndef test_delete():\n    assert reconcile_step(2, 5) == (\"delete\", 3)\n\ndef test_none():\n    assert reconcile_step(4, 4) == (\"none\", 0)\n\ndef test_zero():\n    assert reconcile_step(0, 2) == (\"delete\", 2), \"scaling to zero deletes every Pod\"\n\ndef test_invalid():\n    try:\n        reconcile_step(-1, 0)\n    except ValueError:\n        return\n    raise AssertionError(\"negative desired should raise ValueError\")\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>Compute \u003ccode>diff = desired - actual\u003c/code> once and branch on\n        its sign.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">def reconcile_step(desired, actual):\n    if desired &lt; 0:\n        raise ValueError(\"desired must not be negative\")\n    diff = desired - actual\n    if diff &gt; 0:\n        return (\"create\", diff)\n    if diff &lt; 0:\n        return (\"delete\", -diff)\n    return (\"none\", 0)\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"exercise\" data-id=\"m01-e2\" data-title=\"Group and version\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Write \u003ccode>split_api_version(api_version)\u003c/code> that returns \u003ccode>(group, version)\u003c/code>. Core objects\n          have an empty group: \u003ccode>\"v1\"\u003c/code> gives \u003ccode>(\"\", \"v1\")\u003c/code>, while \u003ccode>\"apps/v1\"\u003c/code> gives\n          \u003ccode>(\"apps\", \"v1\")\u003c/code> and \u003ccode>\"networking.k8s.io/v1\"\u003c/code> gives\n          \u003ccode>(\"networking.k8s.io\", \"v1\")\u003c/code>.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\ndef split_api_version(api_version):\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\ndef test_core():\n    assert split_api_version(\"v1\") == (\"\", \"v1\")\n\ndef test_named():\n    assert split_api_version(\"apps/v1\") == (\"apps\", \"v1\")\n    assert split_api_version(\"networking.k8s.io/v1\") == (\"networking.k8s.io\", \"v1\")\n    assert split_api_version(\"batch/v1\") == (\"batch\", \"v1\")\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>\u003ccode>str.rpartition(\"/\")\u003c/code> returns\n        \u003ccode>(\"\", \"\", \"v1\")\u003c/code> when there's no slash.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">def split_api_version(api_version):\n    group, _, version = api_version.rpartition(\"/\")\n    return (group, version)\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"exercise\" data-id=\"m01-e3\" data-title=\"Is the rollout finished?\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>A Deployment's status can lag behind its spec. Write \u003ccode>rollout_complete(deploy)\u003c/code> that returns\n          \u003ccode>True\u003c/code> only when the controller has \u003cstrong>seen\u003c/strong> the latest spec\n          (\u003ccode>status.observedGeneration &gt;= metadata.generation\u003c/code>) and \u003ccode>status.updatedReplicas\u003c/code>,\n          \u003ccode>status.readyReplicas\u003c/code>, and \u003ccode>status.replicas\u003c/code> all equal \u003ccode>spec.replicas\u003c/code>.\n          Missing status fields count as 0. This is roughly what \u003ccode>kubectl rollout status\u003c/code> waits for.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\nimport kubelab\n\ndef rollout_complete(deploy):\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\ndef d(gen, observed, spec, updated, ready, total):\n    return {\"metadata\": {\"generation\": gen}, \"spec\": {\"replicas\": spec},\n            \"status\": {\"observedGeneration\": observed, \"updatedReplicas\": updated, \"readyReplicas\": ready, \"replicas\": total}}\n\ndef test_done():\n    assert rollout_complete(d(3, 3, 4, 4, 4, 4)) is True\n\ndef test_not_observed_yet():\n    assert rollout_complete(d(4, 3, 4, 4, 4, 4)) is False, \"the controller hasn't seen generation 4 yet\"\n\ndef test_still_rolling():\n    assert rollout_complete(d(3, 3, 4, 2, 4, 5)) is False, \"old Pods still exist (replicas 5) and only 2 are updated\"\n\ndef test_missing_status():\n    assert rollout_complete({\"metadata\": {\"generation\": 1}, \"spec\": {\"replicas\": 2}}) is False\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>\u003ccode>kubelab.dig(deploy, \"status.readyReplicas\", 0)\u003c/code>\n        reads a nested field with a default.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">import kubelab\n\ndef rollout_complete(deploy):\n    want = kubelab.dig(deploy, \"spec.replicas\", 1)\n    if kubelab.dig(deploy, \"status.observedGeneration\", 0) &lt; kubelab.dig(deploy, \"metadata.generation\", 0):\n        return False\n    fields = (\"updatedReplicas\", \"readyReplicas\", \"replicas\")\n    return all(kubelab.dig(deploy, f\"status.{f}\", 0) == want for f in fields)\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"exercise\" data-id=\"m01-e4\" data-title=\"Who owns this Pod?\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Write \u003ccode>owner_chain(objects, kind, name)\u003c/code> that starts at one object and follows the first\n          \u003ccode>metadata.ownerReferences\u003c/code> entry upward, returning \u003ccode>[\"Pod/web-7d9f-x2\", \"ReplicaSet/web-7d9f\",\n          \"Deployment/web\"]\u003c/code>. Stop when an object has no owner, or when the owner isn't in\n          \u003ccode>objects\u003c/code>.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\ndef owner_chain(objects, kind, name):\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\nOBJS = [\n    {\"kind\": \"Deployment\", \"metadata\": {\"name\": \"web\"}},\n    {\"kind\": \"ReplicaSet\", \"metadata\": {\"name\": \"web-7d9f\", \"ownerReferences\": [{\"kind\": \"Deployment\", \"name\": \"web\"}]}},\n    {\"kind\": \"Pod\", \"metadata\": {\"name\": \"web-7d9f-x2\", \"ownerReferences\": [{\"kind\": \"ReplicaSet\", \"name\": \"web-7d9f\"}]}},\n    {\"kind\": \"Pod\", \"metadata\": {\"name\": \"orphan\", \"ownerReferences\": [{\"kind\": \"ReplicaSet\", \"name\": \"gone\"}]}},\n    {\"kind\": \"Pod\", \"metadata\": {\"name\": \"bare\"}},\n]\n\ndef test_full_chain():\n    assert owner_chain(OBJS, \"Pod\", \"web-7d9f-x2\") == [\"Pod/web-7d9f-x2\", \"ReplicaSet/web-7d9f\", \"Deployment/web\"]\n\ndef test_missing_owner():\n    assert owner_chain(OBJS, \"Pod\", \"orphan\") == [\"Pod/orphan\"]\n\ndef test_bare_pod():\n    assert owner_chain(OBJS, \"Pod\", \"bare\") == [\"Pod/bare\"]\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>Build a dict keyed by \u003ccode>(kind, name)\u003c/code> first, then loop\n        while the current object has an owner you can look up.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">def owner_chain(objects, kind, name):\n    index = {(o[\"kind\"], o[\"metadata\"][\"name\"]): o for o in objects}\n    chain = []\n    current = index.get((kind, name))\n    while current is not None:\n        chain.append(f\"{current['kind']}/{current['metadata']['name']}\")\n        owners = current[\"metadata\"].get(\"ownerReferences\") or []\n        if not owners:\n            break\n        current = index.get((owners[0][\"kind\"], owners[0][\"name\"]))\n    return chain\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"exercise\" data-id=\"m01-e5\" data-title=\"Pods per node\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Given Pods as returned by \u003ccode>kubectl get pods -o json\u003c/code> (\u003ccode>items\u003c/code> only), write\n          \u003ccode>pods_by_node(pods)\u003c/code> returning a dict of node name to a \u003cstrong>sorted\u003c/strong> list of Pod\n          names. Pods without \u003ccode>spec.nodeName\u003c/code> haven't been scheduled: put them under\n          \u003ccode>\"&lt;pending&gt;\"\u003c/code>.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\nimport kubelab\n\ndef pods_by_node(pods):\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\nPODS = [\n    {\"metadata\": {\"name\": \"web-b\"}, \"spec\": {\"nodeName\": \"primer-worker\"}},\n    {\"metadata\": {\"name\": \"web-a\"}, \"spec\": {\"nodeName\": \"primer-worker\"}},\n    {\"metadata\": {\"name\": \"web-c\"}, \"spec\": {\"nodeName\": \"primer-worker2\"}},\n    {\"metadata\": {\"name\": \"web-d\"}, \"spec\": {}},\n]\n\ndef test_grouping():\n    assert pods_by_node(PODS) == {\"primer-worker\": [\"web-a\", \"web-b\"], \"primer-worker2\": [\"web-c\"], \"\u003cpending>\": [\"web-d\"]}\n\ndef test_empty():\n    assert pods_by_node([]) == {}\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>Use \u003ccode>dict.setdefault(node, []).append(name)\u003c/code>, then sort\n        each list.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">import kubelab\n\ndef pods_by_node(pods):\n    groups = {}\n    for pod in pods:\n        node = kubelab.dig(pod, \"spec.nodeName\") or \"&lt;pending&gt;\"\n        groups.setdefault(node, []).append(pod[\"metadata\"][\"name\"])\n    return {node: sorted(names) for node, names in groups.items()}\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"mini-project\">\n    \u003ch2>Lab: write a ReplicaSet controller\u003c/h2>\n    \u003cdiv class=\"project-box\">\n      \u003cdiv class=\"widget-head\">\u003cspan class=\"w-kind\">Lab m01-lab1\u003c/span>\u003cspan class=\"w-title\">reconciler.py: the loop at the heart of Kubernetes\u003c/span>\u003c/div>\n      \u003cdiv class=\"widget-body\">\n        \u003cp>Write the decision logic of a ReplicaSet controller in plain Python. Given the desired replica count and\n          the Pods that exist, your \u003ccode>reconcile()\u003c/code> returns which Pods to create and which to delete, using\n          the same rules Kubernetes uses: only active Pods count, terminating Pods are left alone, and when scaling\n          down, the Pods least likely to be serving go first. Then write \u003ccode>converge()\u003c/code>, which applies\n          actions until nothing changes, and prove it's idempotent.\u003c/p>\n        \u003cpre data-label=\"Terminal\">\u003ccode class=\"language-bash\">pixi run start m01-lab1\n# read labs/m01-lab1/README.md, edit work/m01-lab1/reconciler.py\npixi run grade m01-lab1\u003c/code>\u003c/pre>\n        \u003cul class=\"checklist\" data-id=\"m01-lab1\">\n          \u003cli>Counts only Pods that are active (Pending or Running, not terminating)\u003c/li>\n          \u003cli>Creates exactly the missing number of Pods, with unique names\u003c/li>\n          \u003cli>Scales down unscheduled, then not-ready, then newest Pods first\u003c/li>\n          \u003cli>Never deletes a Pod that is already terminating\u003c/li>\n          \u003cli>\u003ccode>converge()\u003c/code> reaches a fixed point; a second call returns no actions\u003c/li>\n          \u003cli>\u003ccode>pixi run grade m01-lab1\u003c/code> passes\u003c/li>\n        \u003c/ul>\n        \u003cp>\u003cstrong>Stretch:\u003c/strong> add a \u003ccode>burst\u003c/code> limit so one reconcile creates at most N Pods, the way\n          the real controller batches creations.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"quiz\">\n    \u003ch2>Quiz\u003c/h2>\n    \u003cdiv class=\"quiz\" data-id=\"m01-quiz\">\n\u003cscript type=\"application/json\">\n{\"title\": \"How Kubernetes Thinks quiz\", \"passScore\": 0.7, \"questions\": [\n  {\"type\": \"single\", \"prompt\": \"Which component decides which node a new Pod runs on?\", \"options\": [\"kubelet\", \"kube-scheduler\", \"kube-proxy\", \"etcd\"], \"answer\": 1, \"explanation\": \"\u003cp>The scheduler filters and scores nodes, then binds the Pod by setting \u003ccode>spec.nodeName\u003c/code>. The kubelet on that node runs it.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"Which component may read and write etcd directly?\", \"options\": [\"Any controller\", \"The kubelet\", \"Only the API server\", \"CoreDNS\"], \"answer\": 2, \"explanation\": \"\u003cp>Everything else goes through the API server, which handles authentication, authorisation, admission, and validation.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"Who writes an object's \u003ccode>status\u003c/code>?\", \"options\": [\"You, in the manifest\", \"Controllers and the kubelet\", \"etcd\", \"kubectl\"], \"answer\": 1, \"explanation\": \"\u003cp>You write the spec (desired state). The system writes the status (observed state).\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"You delete a Pod owned by a ReplicaSet. What happens?\", \"options\": [\"It's gone for good\", \"The ReplicaSet controller creates a replacement with a new name\", \"The kubelet restores the same Pod\", \"etcd rolls back the deletion\"], \"answer\": 1, \"explanation\": \"\u003cp>The controller sees fewer Pods than desired and creates one. Pods are cattle, not pets: the replacement is a new object.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"What makes Kubernetes controllers robust to missed events?\", \"options\": [\"They retry every event three times\", \"They're level-triggered: they compare current state with desired state each pass\", \"etcd replays all events\", \"The scheduler buffers events\"], \"answer\": 1, \"explanation\": \"\u003cp>Acting on state rather than on individual events means a restarted controller still does the right thing.\u003c/p>\"},\n  {\"type\": \"multi\", \"prompt\": \"Which of these are declarative?\", \"options\": [\"\u003ccode>kubectl apply -f web.yaml\u003c/code>\", \"\u003ccode>kubectl scale deploy/web --replicas=5\u003c/code>\", \"A manifest in Git applied by a GitOps agent\", \"\u003ccode>kubectl run tmp --image=busybox\u003c/code>\"], \"answer\": [0, 2], \"explanation\": \"\u003cp>Applying a file of desired state is declarative and idempotent. \u003ccode>scale\u003c/code> and \u003ccode>run\u003c/code> are imperative commands.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"What is the API group of a Deployment (\u003ccode>apiVersion: apps/v1\u003c/code>)?\", \"options\": [\"v1\", \"apps\", \"core\", \"deployments\"], \"answer\": 1, \"explanation\": \"\u003cp>The part before the slash is the group. Core objects such as Pods and Services have no group: \u003ccode>apiVersion: v1\u003c/code>.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"You delete a Deployment. Why do its ReplicaSets and Pods disappear too?\", \"options\": [\"kubectl deletes them one by one\", \"Garbage collection follows \u003ccode>ownerReferences\u003c/code>\", \"The scheduler evicts them\", \"They time out\"], \"answer\": 1, \"explanation\": \"\u003cp>Each child records its owner. When the owner goes, the garbage collector removes dependents.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"What should you read first when a Pod misbehaves?\", \"options\": [\"\u003ccode>kubectl api-resources\u003c/code>\", \"The Events at the bottom of \u003ccode>kubectl describe\u003c/code>\", \"etcd's data directory\", \"The kubeconfig\"], \"answer\": 1, \"explanation\": \"\u003cp>Events record scheduling, image pulls, probe failures, and kills.\u003c/p>\"},\n  {\"type\": \"text\", \"prompt\": \"Which kubectl verb shows the schema and documentation for a field, such as \u003ccode>deployment.spec.strategy\u003c/code>?\", \"answer\": [\"explain\"], \"explanation\": \"\u003cp>\u003ccode>kubectl explain\u003c/code> reads the schema from your own cluster, so it matches your version.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"\u003ccode>status.observedGeneration\u003c/code> is 3 and \u003ccode>metadata.generation\u003c/code> is 4. What does that tell you?\", \"options\": [\"The rollout is finished\", \"The controller hasn't processed your latest spec change yet\", \"etcd is corrupt\", \"Generation 4 failed\"], \"answer\": 1, \"explanation\": \"\u003cp>Each spec change bumps \u003ccode>generation\u003c/code>. The controller copies it to \u003ccode>observedGeneration\u003c/code> once it has acted on that version.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"In the journey from \u003ccode>kubectl apply\u003c/code> to a running container, which component asks containerd to pull the image?\", \"options\": [\"The scheduler\", \"The ReplicaSet controller\", \"The kubelet on the chosen node\", \"The API server\"], \"answer\": 2, \"explanation\": \"\u003cp>The kubelet watches for Pods bound to its node and drives the runtime to start them.\u003c/p>\"}\n]}\n\u003c/script>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"recap\">\n    \u003ch2>Recap\u003c/h2>\n    \u003cul>\n      \u003cli>The API server is the front door; etcd stores state; the scheduler places Pods; controllers reconcile;\n        the kubelet runs containers on each node.\u003c/li>\n      \u003cli>Every object is apiVersion, kind, metadata, spec (you) and status (the system).\u003c/li>\n      \u003cli>Declarative \u003ccode>apply\u003c/code> is idempotent: the file is the truth.\u003c/li>\n      \u003cli>Controllers observe, diff, and act, level-triggered, which is why the cluster heals itself.\u003c/li>\n      \u003cli>Nobody calls anybody: components watch the API and write back what they did. Events tell the story.\u003c/li>\n    \u003c/ul>\n    \u003cdiv class=\"flashcards\" data-title=\"How Kubernetes thinks\">\n      \u003cscript type=\"application/json\">\n      [{\"front\": \"The only component that talks to etcd\", \"back\": \"kube-apiserver\"},\n       {\"front\": \"spec vs status\", \"back\": \"spec: desired state, written by you. status: observed state, written by controllers and the kubelet.\"},\n       {\"front\": \"The reconcile loop\", \"back\": \"Observe desired and actual, diff, act to shrink the difference, repeat.\"},\n       {\"front\": \"Level-triggered\", \"back\": \"Acts on current state, not on individual events, so missed events don't matter.\"},\n       {\"front\": \"Who binds a Pod to a node?\", \"back\": \"The scheduler, by setting spec.nodeName.\"},\n       {\"front\": \"Who starts the containers?\", \"back\": \"The kubelet on the node, via containerd.\"},\n       {\"front\": \"ownerReferences\", \"back\": \"Child to owner links: Pod → ReplicaSet → Deployment. Drive garbage collection.\"},\n       {\"front\": \"\u003ccode>apiVersion: apps/v1\u003c/code>\", \"back\": \"Group apps, version v1. Core kinds are just v1.\"},\n       {\"front\": \"generation vs observedGeneration\", \"back\": \"generation bumps on each spec change; observedGeneration shows which one the controller has acted on.\"},\n       {\"front\": \"First debugging step\", \"back\": \"\u003ccode>kubectl describe\u003c/code> and read the Events.\"}]\n      \u003c/script>\n    \u003c/div>\n    \u003ch3>Going further\u003c/h3>\n    \u003cul>\n      \u003cli>\u003ca href=\"https://kubernetes.io/docs/concepts/overview/components/\">Kubernetes: Cluster components\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"https://kubernetes.io/docs/concepts/architecture/controller/\">Kubernetes: Controllers\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"https://kubernetes.io/docs/concepts/overview/working-with-objects/\">Kubernetes: Objects\u003c/a>\u003c/li>\n      \u003cli>Next: \u003ca href=\"m02-pods.html\">M02 Pods\u003c/a>\u003c/li>\n    \u003c/ul>\n  \u003c/section>","exercises":["m01-e1","m01-e2","m01-e3","m01-e4","m01-e5"],"quizzes":["m01-quiz"],"checklists":{"m01-lab1":6}},"modules/m02-pods.html":{"id":"m02","kind":"module","title":"M02 · Pods · Kubernetes Practicum","html":"\u003cheader class=\"lesson-hero\">\n    \u003cp class=\"eyebrow\">Stage 1 · Foundations · Module 02\u003c/p>\n    \u003ch1>Pods\u003c/h1>\n    \u003cp class=\"lede\">The Pod is the smallest thing Kubernetes schedules: one or more containers that share a network\n      address and storage, placed together on one node. Every higher-level object (Deployments, Jobs, StatefulSets)\n      exists to create and replace Pods. Get Pods right, with health probes, resources, and security, and everything\n      built on them behaves.\u003c/p>\n    \u003cdiv class=\"lesson-meta\">\u003cspan>⏱ ~2.5 hours\u003c/span>\u003cspan>Prerequisites: \u003ca href=\"m01-how-kubernetes-thinks.html\">M01 How Kubernetes Thinks\u003c/a>\u003c/span>\u003c/div>\n    \u003cul class=\"objectives\">\n      \u003cli>Explain what containers in one Pod share, and when to put two containers in the same Pod\u003c/li>\n      \u003cli>Read the Pod phases and container states, and know what each restart policy does\u003c/li>\n      \u003cli>Choose between startup, readiness, and liveness probes, and avoid the classic probe mistakes\u003c/li>\n      \u003cli>Set requests and limits, predict the QoS class, and explain throttling vs OOM kills\u003c/li>\n      \u003cli>Use init containers and native sidecars\u003c/li>\n      \u003cli>Write a Pod that meets the \u003ccode>restricted\u003c/code> Pod Security Standard\u003c/li>\n      \u003cli>Debug a Pod systematically with describe, logs, exec, port-forward, and ephemeral containers\u003c/li>\n    \u003c/ul>\n  \u003c/header>\n\n  \u003csection class=\"lesson-section\" id=\"anatomy\">\n    \u003ch2>What a Pod is\u003c/h2>\n    \u003cp>A Pod wraps one or more containers that are always scheduled \u003cstrong>together\u003c/strong>, on the same node.\n      They share:\u003c/p>\n    \u003cul>\n      \u003cli>\u003cstrong>One network namespace\u003c/strong>: one IP address and one port space. Containers in a Pod reach each\n        other on \u003ccode>localhost\u003c/code>, so two of them can't both listen on 8080.\u003c/li>\n      \u003cli>\u003cstrong>Volumes\u003c/strong> declared on the Pod, which any container can mount.\u003c/li>\n      \u003cli>\u003cstrong>A lifecycle\u003c/strong>: the Pod is created, runs, and is deleted as a unit.\u003c/li>\n    \u003c/ul>\n    \u003cfigure class=\"figure\">\n      \u003csvg class=\"diagram\" viewBox=\"0 0 720 240\" role=\"img\" aria-label=\"A Pod with an init container, an app container and a sidecar sharing a volume and network\">\n        \u003crect x=\"10\" y=\"10\" width=\"700\" height=\"220\" rx=\"10\" fill=\"var(--bg-sunk)\" stroke=\"var(--border-strong)\"/>\n        \u003ctext x=\"24\" y=\"30\" font-size=\"13\" font-weight=\"600\" fill=\"var(--fg)\">Pod · one IP (10.244.1.7) · one node\u003c/text>\n        \u003crect x=\"30\" y=\"50\" width=\"170\" height=\"60\" rx=\"8\" fill=\"none\" stroke=\"var(--fg-muted)\" stroke-dasharray=\"4 3\"/>\n        \u003ctext x=\"115\" y=\"75\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fg)\">init: migrate\u003c/text>\n        \u003ctext x=\"115\" y=\"93\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--fg-muted)\">runs first, then exits\u003c/text>\n        \u003crect x=\"240\" y=\"50\" width=\"200\" height=\"80\" rx=\"8\" fill=\"var(--accent)\"/>\n        \u003ctext x=\"340\" y=\"84\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"var(--accent-fg)\">app\u003c/text>\n        \u003ctext x=\"340\" y=\"104\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--accent-fg)\">:9898 · probes\u003c/text>\n        \u003crect x=\"480\" y=\"50\" width=\"200\" height=\"80\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"/>\n        \u003ctext x=\"580\" y=\"84\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"600\" fill=\"var(--fg)\">sidecar: log shipper\u003c/text>\n        \u003ctext x=\"580\" y=\"104\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--fg-muted)\">init + restartPolicy: Always\u003c/text>\n        \u003crect x=\"240\" y=\"160\" width=\"200\" height=\"50\" rx=\"8\" fill=\"var(--bg-elev)\" stroke=\"var(--border-strong)\"/>\n        \u003ctext x=\"340\" y=\"190\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fg)\">shared volume (emptyDir)\u003c/text>\n        \u003crect x=\"480\" y=\"160\" width=\"200\" height=\"50\" rx=\"8\" fill=\"var(--bg-elev)\" stroke=\"var(--border-strong)\"/>\n        \u003ctext x=\"580\" y=\"190\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fg)\">localhost network\u003c/text>\n        \u003cline x1=\"200\" y1=\"80\" x2=\"238\" y2=\"85\" stroke=\"var(--fg)\" stroke-width=\"1.5\"/>\n        \u003cline x1=\"340\" y1=\"130\" x2=\"340\" y2=\"158\" stroke=\"var(--fg)\" stroke-width=\"1.5\"/>\n        \u003cline x1=\"580\" y1=\"130\" x2=\"580\" y2=\"158\" stroke=\"var(--fg)\" stroke-width=\"1.5\"/>\n        \u003cline x1=\"440\" y1=\"90\" x2=\"478\" y2=\"90\" stroke=\"var(--fg)\" stroke-width=\"1.5\"/>\n      \u003c/svg>\n      \u003cfigcaption>Put containers in one Pod only when they must share a lifecycle, a network, or files: an app and\n        its log shipper or proxy. Two independent services belong in two Pods.\u003c/figcaption>\n    \u003c/figure>\n    \u003caside class=\"callout warn\">\u003cp>A Pod you create directly (a \u003cstrong>bare Pod\u003c/strong>) is never recreated if it\n      or its node dies. You'll use bare Pods in this module to learn; real workloads use a controller (M03).\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"first-pod\">\n    \u003ch2>Your first Pod\u003c/h2>\n    \u003cp>The course uses \u003ca href=\"https://github.com/stefanprodan/podinfo\">podinfo\u003c/a>, a tiny Go web app built for\n      Kubernetes demos. It has health endpoints, a version page, and switches to make it misbehave on purpose.\u003c/p>\n    \u003cpre>\u003ccode class=\"language-yaml\"># pod.yaml: the minimum\napiVersion: v1\nkind: Pod\nmetadata:\n  name: podinfo\n  labels: {app.kubernetes.io/name: podinfo}\nspec:\n  containers:\n    - name: app\n      image: ghcr.io/stefanprodan/podinfo:6.7.1\n      ports: [{containerPort: 9898, name: http}]\u003c/code>\u003c/pre>\n    \u003cpre data-label=\"Terminal\">\u003ccode class=\"language-bash\">kubectl apply -f pod.yaml\nkubectl get pod podinfo -o wide -w        # Ctrl-C once it's Running\nkubectl describe pod podinfo | tail -15   # the Events tell the story\nkubectl port-forward pod/podinfo 9898:9898 &amp;\ncurl -s localhost:9898 | head\nkill %1\u003c/code>\u003c/pre>\n    \u003cp>Names matter: \u003ccode>metadata.name\u003c/code> must be a DNS-1123 subdomain (lowercase letters, digits,\n      \u003ccode>-\u003c/code> and \u003ccode>.\u003c/code>), container names and port names must be DNS labels, and port names are at\n      most 15 characters. \u003ccode>kubelab.check_object\u003c/code> enforces the same rules as the API server.\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"lifecycle\">\n    \u003ch2>Lifecycle: phases, states, restarts\u003c/h2>\n    \u003cdiv class=\"two-col\">\n      \u003cdiv>\n        \u003ch4>Pod phase\u003c/h4>\n        \u003cdiv class=\"scroll\">\u003ctable>\u003ctbody>\n          \u003ctr>\u003ctd>\u003ccode>Pending\u003c/code>\u003c/td>\u003ctd>Accepted, but not running yet: waiting to be scheduled, pulling images, or mounting volumes\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003ccode>Running\u003c/code>\u003c/td>\u003ctd>Bound to a node; at least one container running or restarting\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003ccode>Succeeded\u003c/code>\u003c/td>\u003ctd>Every container exited 0 and won't restart\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003ccode>Failed\u003c/code>\u003c/td>\u003ctd>Every container stopped, at least one with an error\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003ccode>Unknown\u003c/code>\u003c/td>\u003ctd>The node stopped reporting\u003c/td>\u003c/tr>\n        \u003c/tbody>\u003c/table>\u003c/div>\n      \u003c/div>\n      \u003cdiv>\n        \u003ch4>Container state\u003c/h4>\n        \u003cdiv class=\"scroll\">\u003ctable>\u003ctbody>\n          \u003ctr>\u003ctd>\u003ccode>Waiting\u003c/code>\u003c/td>\u003ctd>Not running yet, with a \u003cem>reason\u003c/em>: \u003ccode>ContainerCreating\u003c/code>, \u003ccode>ImagePullBackOff\u003c/code>, \u003ccode>CrashLoopBackOff\u003c/code>…\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003ccode>Running\u003c/code>\u003c/td>\u003ctd>Executing\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003ccode>Terminated\u003c/code>\u003c/td>\u003ctd>Exited, with an exit code and a reason such as \u003ccode>Completed\u003c/code>, \u003ccode>Error\u003c/code>, or \u003ccode>OOMKilled\u003c/code>\u003c/td>\u003c/tr>\n        \u003c/tbody>\u003c/table>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cp>\u003ccode>spec.restartPolicy\u003c/code> decides what the kubelet does when a container exits:\n      \u003ccode>Always\u003c/code> (the default, required for Deployments), \u003ccode>OnFailure\u003c/code>, or \u003ccode>Never\u003c/code>\n      (both for Jobs). Restarts back off exponentially (10 s, 20 s, 40 s… up to five minutes), and while waiting the\n      container shows \u003ccode>CrashLoopBackOff\u003c/code>. The restart happens \u003cem>inside the same Pod on the same\n      node\u003c/em>; it isn't rescheduled.\u003c/p>\n    \u003cdiv class=\"runnable\" data-predict data-title=\"Predict: the back-off schedule\">\n\u003ctextarea>\ndelay, waits = 10, []\nfor attempt in range(7):\n    waits.append(delay)\n    delay = min(delay * 2, 300)\nprint(waits)\n\u003c/textarea>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"probes\">\n    \u003ch2>Health probes\u003c/h2>\n    \u003cp>A running process isn't necessarily a healthy one. Probes let the kubelet ask your app how it's doing.\u003c/p>\n    \u003cdiv class=\"scroll\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>Probe\u003c/th>\u003cth>Question it answers\u003c/th>\u003cth>On failure\u003c/th>\u003cth>Classic mistake\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>\u003ccode>startupProbe\u003c/code>\u003c/td>\u003ctd>Has the app finished starting?\u003c/td>\u003ctd>Keeps checking; the other probes wait until it passes\u003c/td>\u003ctd>Missing on slow starters, so liveness kills them mid-boot\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>readinessProbe\u003c/code>\u003c/td>\u003ctd>Can it take traffic right now?\u003c/td>\u003ctd>Removed from Service endpoints; \u003cstrong>not\u003c/strong> restarted\u003c/td>\u003ctd>Omitting it, so traffic arrives before the app can serve\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>livenessProbe\u003c/code>\u003c/td>\u003ctd>Is the process wedged?\u003c/td>\u003ctd>Container is \u003cstrong>restarted\u003c/strong>\u003c/td>\u003ctd>Checking the database here: one DB blip restarts every replica at once\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n    \u003cpre>\u003ccode class=\"language-yaml\">    - name: app\n      image: ghcr.io/stefanprodan/podinfo:6.7.1\n      ports: [{containerPort: 9898, name: http}]\n      startupProbe:                          # up to 30 × 2s = 60s to boot\n        httpGet: {path: /healthz, port: http}\n        failureThreshold: 30\n        periodSeconds: 2\n      readinessProbe:\n        httpGet: {path: /readyz, port: http}\n        periodSeconds: 5\n      livenessProbe:\n        httpGet: {path: /healthz, port: http}\n        periodSeconds: 10\n        failureThreshold: 3\u003c/code>\u003c/pre>\n    \u003cp>Probe handlers are \u003ccode>httpGet\u003c/code> (a 2xx or 3xx counts as success), \u003ccode>tcpSocket\u003c/code>,\n      \u003ccode>exec\u003c/code> (exit 0 is success), and \u003ccode>grpc\u003c/code>. Refer to ports \u003cstrong>by name\u003c/strong>\n      (\u003ccode>port: http\u003c/code>) so changing the number in one place can't break the probe.\u003c/p>\n    \u003caside class=\"callout tip\">\u003cp>\u003cstrong>Remember:\u003c/strong> liveness checks \u003cem>this process only\u003c/em>. Readiness can\n      consider whether the app can do useful work. Startup protects slow boots.\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"resources\">\n    \u003ch2>Requests, limits, and QoS\u003c/h2>\n    \u003cdiv class=\"scroll\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>Request\u003c/th>\u003cth>Limit\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>Used by\u003c/td>\u003ctd>The scheduler, to place the Pod (the node must have this much unreserved)\u003c/td>\u003ctd>The kernel (cgroups), at runtime\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>CPU above it\u003c/td>\u003ctd>Allowed if the node has spare CPU\u003c/td>\u003ctd>Throttled: slower, never killed\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Memory above it\u003c/td>\u003ctd>Allowed until the node runs short, then evicted first\u003c/td>\u003ctd>\u003cstrong>OOMKilled\u003c/strong>: exit code 137\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n    \u003cp>Quantities have units. CPU is in cores: \u003ccode>250m\u003c/code> is a quarter of a core (\"milli\"). Memory is in\n      bytes: \u003ccode>128Mi\u003c/code> is 128 × 2\u003csup>20\u003c/sup> (binary), while \u003ccode>128M\u003c/code> is 128 × 10\u003csup>6\u003c/sup>\n      (decimal), about 5% smaller.\u003c/p>\n    \u003cp>From requests and limits, the kubelet assigns a \u003cstrong>QoS class\u003c/strong> that decides who is evicted first\n      when a node runs out of memory:\u003c/p>\n    \u003cdiv class=\"scroll\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>QoS class\u003c/th>\u003cth>When\u003c/th>\u003cth>Evicted\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>Guaranteed\u003c/td>\u003ctd>Every container has CPU and memory limits, and requests equal limits\u003c/td>\u003ctd>Last\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Burstable\u003c/td>\u003ctd>At least one request or limit is set, but not Guaranteed\u003c/td>\u003ctd>Middle\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>BestEffort\u003c/td>\u003ctd>No requests or limits at all\u003c/td>\u003ctd>First\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n    \u003cdiv class=\"runnable\" data-title=\"Quantities and QoS\">\n\u003ctextarea>\nimport kubelab\n\nprint(kubelab.parse_cpu(\"250m\"), \"cores\")\nprint(kubelab.parse_memory(\"128Mi\"), \"bytes vs\", kubelab.parse_memory(\"128M\"))\n\ndef spec(requests, limits):\n    return {\"containers\": [{\"name\": \"app\", \"image\": \"x:1\", \"resources\": {\"requests\": requests, \"limits\": limits}}]}\n\nprint(kubelab.qos_class(spec({}, {})))\nprint(kubelab.qos_class(spec({\"cpu\": \"100m\", \"memory\": \"64Mi\"}, {\"memory\": \"128Mi\"})))\nprint(kubelab.qos_class(spec({}, {\"cpu\": \"500m\", \"memory\": \"256Mi\"})))   # requests default to limits\n\u003c/textarea>\n    \u003c/div>\n    \u003caside class=\"callout pro\">\u003cp>A good default for web apps: set CPU and memory \u003cem>requests\u003c/em> to typical usage,\n      set a memory \u003cem>limit\u003c/em>, and think twice before a CPU limit. CPU limits cause throttling, which shows up as\n      mysterious latency spikes even when the node is idle.\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"multi-container\">\n    \u003ch2>Init containers and native sidecars\u003c/h2>\n    \u003cp>\u003cstrong>Init containers\u003c/strong> run to completion, one after another, before the app containers start. Use\n      them to wait for a dependency, run a migration, or render a config file. A \u003cstrong>native sidecar\u003c/strong>\n      (stable since Kubernetes 1.33) is an init container with \u003ccode>restartPolicy: Always\u003c/code>: it starts before\n      the app, keeps running beside it, and stops after it, which is exactly what log shippers and proxies need.\u003c/p>\n    \u003cpre>\u003ccode class=\"language-yaml\">spec:\n  initContainers:\n    - name: wait-for-db                 # classic init: must exit 0 before the app starts\n      image: busybox:1.36\n      command: ['sh', '-c', 'until nc -z db 5432; do echo waiting; sleep 2; done']\n    - name: log-shipper                 # native sidecar: keeps running\n      image: busybox:1.36\n      restartPolicy: Always\n      command: ['sh', '-c', 'tail -F /logs/app.log']\n      volumeMounts: [{name: logs, mountPath: /logs}]\n  containers:\n    - name: app\n      image: busybox:1.36\n      command: ['sh', '-c', 'while true; do date &gt;&gt; /logs/app.log; sleep 1; done']\n      volumeMounts: [{name: logs, mountPath: /logs}]\n  volumes:\n    - name: logs\n      emptyDir: {}\u003c/code>\u003c/pre>\n    \u003cp>While init containers run, \u003ccode>kubectl get pod\u003c/code> shows \u003ccode>Init:0/2\u003c/code>. If one keeps failing,\n      the Pod shows \u003ccode>Init:CrashLoopBackOff\u003c/code>; read it with \u003ccode>kubectl logs POD -c wait-for-db\u003c/code>.\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"security\">\n    \u003ch2>Security context: the restricted standard\u003c/h2>\n    \u003cp>By default a container may run as root and keep several Linux capabilities. Kubernetes defines three\n      \u003cstrong>Pod Security Standards\u003c/strong>: \u003ccode>privileged\u003c/code>, \u003ccode>baseline\u003c/code>, and\n      \u003ccode>restricted\u003c/code>. Write everything to \u003ccode>restricted\u003c/code>:\u003c/p>\n    \u003cpre>\u003ccode class=\"language-yaml\">spec:\n  securityContext:                       # Pod level\n    runAsNonRoot: true\n    runAsUser: 10001                     # numeric: needed when the image's USER is a name\n    seccompProfile: {type: RuntimeDefault}\n  containers:\n    - name: app\n      securityContext:                   # container level\n        allowPrivilegeEscalation: false\n        readOnlyRootFilesystem: true\n        capabilities: {drop: [ALL]}\u003c/code>\u003c/pre>\n    \u003caside class=\"callout warn\">\u003cp>\u003ccode>runAsNonRoot: true\u003c/code> alone fails with\n      \u003ccode>CreateContainerConfigError\u003c/code> if the image declares a non-numeric user (such as\n      \u003ccode>USER app\u003c/code>), because the kubelet can't prove the name isn't root. Add a numeric\n      \u003ccode>runAsUser\u003c/code>.\u003c/p>\u003c/aside>\n    \u003cp>\u003ccode>kubelab.warnings\u003c/code> flags what a manifest is missing. Fix the Pod below until the only warning left\n      is the one about it being a bare Pod.\u003c/p>\n    \u003cdiv class=\"runnable\" data-title=\"Lint a Pod\">\n\u003ctextarea>\nimport kubelab\n\npod = kubelab.load_manifests(\"\"\"\napiVersion: v1\nkind: Pod\nmetadata: {name: podinfo}\nspec:\n  containers:\n    - name: app\n      image: ghcr.io/stefanprodan/podinfo:6.7.1\n      ports: [{containerPort: 9898, name: http}]\n\"\"\")[0]\nprint(\"valid:\", kubelab.check_object(pod) == [])\nfor warning in kubelab.warnings(pod):\n    print(\"-\", warning)\n\u003c/textarea>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"debugging\">\n    \u003ch2>Debugging a Pod\u003c/h2>\n    \u003cpre class=\"mermaid\">\nflowchart TD\n  A[Pod not working] --> B{STATUS?}\n  B -->|Pending| C[describe → Events: FailedScheduling? PVC?]\n  B -->|ImagePullBackOff / ErrImagePull| D[describe → Failed to pull: tag? registry? kind load?]\n  B -->|CreateContainerConfigError| E[describe → missing Secret / ConfigMap / key]\n  B -->|CrashLoopBackOff| F[logs --previous → exit code, OOMKilled?]\n  B -->|Running 0/1| G[describe → Readiness probe failed: path, port, timing]\n    \u003c/pre>\n    \u003cdiv class=\"scroll\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>Need\u003c/th>\u003cth>Command\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>What Kubernetes did to it\u003c/td>\u003ctd>\u003ccode>kubectl describe pod POD\u003c/code> (read Events)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>What the app said, including the crash before this restart\u003c/td>\u003ctd>\u003ccode>kubectl logs POD --previous\u003c/code>, \u003ccode>-c NAME\u003c/code> for one container\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>A shell inside\u003c/td>\u003ctd>\u003ccode>kubectl exec -it POD -- sh\u003c/code>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Reach it from your Mac\u003c/td>\u003ctd>\u003ccode>kubectl port-forward pod/POD 9898:9898\u003c/code>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>A throwaway client in the cluster\u003c/td>\u003ctd>\u003ccode>kubectl run tmp --rm -it --image=busybox:1.36 --restart=Never -- sh\u003c/code>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Tools in an image that has none\u003c/td>\u003ctd>\u003ccode>kubectl debug -it POD --image=busybox:1.36 --target=app\u003c/code> (ephemeral container)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>The exact termination reason\u003c/td>\u003ctd>\u003ccode>kubectl get pod POD -o jsonpath='{.status.containerStatuses[0].lastState}'\u003c/code>\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n    \u003cp>\u003ccode>kubelab.pod_issue\u003c/code> applies the same decision tree to a Pod's status, reporting the root cause\n      (an \u003ccode>OOMKilled\u003c/code> last state beats the \u003ccode>CrashLoopBackOff\u003c/code> it causes):\u003c/p>\n    \u003cdiv class=\"runnable\" data-title=\"Diagnose from status\">\n\u003ctextarea>\nimport kubelab\n\npod = {\"status\": {\"phase\": \"Running\", \"containerStatuses\": [{\n    \"name\": \"app\", \"ready\": False,\n    \"state\": {\"waiting\": {\"reason\": \"CrashLoopBackOff\"}},\n    \"lastState\": {\"terminated\": {\"reason\": \"OOMKilled\", \"exitCode\": 137}}}]}}\nissue = kubelab.pod_issue(pod)\nprint(issue.reason, \"in\", issue.container)\nprint(issue.hint)\n\u003c/textarea>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"practice\">\n    \u003ch2>Practice\u003c/h2>\n    \u003cp>Five exercises on quantities, probes, hardening, and diagnosis.\u003c/p>\n\n    \u003cdiv class=\"exercise\" data-id=\"m02-e1\" data-title=\"Millicores\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Write \u003ccode>millicores(quantity)\u003c/code> that converts a CPU quantity to whole millicores:\n          \u003ccode>\"250m\"\u003c/code> → 250, \u003ccode>\"1.5\"\u003c/code> → 1500, \u003ccode>2\u003c/code> → 2000. Round to the nearest integer.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\nimport kubelab\n\ndef millicores(quantity):\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\ndef test_values():\n    assert millicores(\"250m\") == 250\n    assert millicores(\"1.5\") == 1500\n    assert millicores(2) == 2000\n    assert millicores(\"0.1\") == 100, \"watch out for floating point: round, don't truncate\"\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>\u003ccode>kubelab.parse_cpu\u003c/code> returns cores as a float.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">import kubelab\n\ndef millicores(quantity):\n    return round(kubelab.parse_cpu(quantity) * 1000)\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"exercise\" data-id=\"m02-e2\" data-title=\"Memory headroom\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Write \u003ccode>headroom(container)\u003c/code> that returns how many bytes a container may grow above its memory\n          request before it's OOM-killed: limit minus request. Return \u003ccode>None\u003c/code> when there's no memory limit\n          (no ceiling). A missing request counts as equal to the limit.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\nimport kubelab\n\ndef headroom(container):\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\ndef c(requests=None, limits=None):\n    return {\"name\": \"app\", \"resources\": {\"requests\": requests or {}, \"limits\": limits or {}}}\n\ndef test_headroom():\n    assert headroom(c({\"memory\": \"64Mi\"}, {\"memory\": \"128Mi\"})) == 64 * 2**20\n\ndef test_no_limit():\n    assert headroom(c({\"memory\": \"64Mi\"})) is None\n\ndef test_request_defaults_to_limit():\n    assert headroom(c(None, {\"memory\": \"1Gi\"})) == 0\n\ndef test_no_resources():\n    assert headroom({\"name\": \"app\"}) is None\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>Read the two values with \u003ccode>.get()\u003c/code> and convert with\n        \u003ccode>kubelab.parse_memory\u003c/code>.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">import kubelab\n\ndef headroom(container):\n    resources = container.get(\"resources\") or {}\n    limit = (resources.get(\"limits\") or {}).get(\"memory\")\n    if limit is None:\n        return None\n    request = (resources.get(\"requests\") or {}).get(\"memory\", limit)\n    return kubelab.parse_memory(limit) - kubelab.parse_memory(request)\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"exercise\" data-id=\"m02-e3\" data-title=\"Broken probe ports\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Write \u003ccode>broken_probes(container)\u003c/code> that returns a sorted list of the probe names\n          (\u003ccode>\"startupProbe\"\u003c/code>, \u003ccode>\"readinessProbe\"\u003c/code>, \u003ccode>\"livenessProbe\"\u003c/code>) whose\n          \u003ccode>httpGet\u003c/code> or \u003ccode>tcpSocket\u003c/code> port is a \u003cstrong>name\u003c/strong> that no\n          \u003ccode>ports[].name\u003c/code> in the container defines. Numeric ports are always fine.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\ndef broken_probes(container):\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\ndef test_mixed():\n    container = {\n        \"name\": \"app\",\n        \"ports\": [{\"containerPort\": 9898, \"name\": \"http\"}],\n        \"startupProbe\": {\"tcpSocket\": {\"port\": \"http\"}},\n        \"readinessProbe\": {\"httpGet\": {\"path\": \"/readyz\", \"port\": \"web\"}},\n        \"livenessProbe\": {\"httpGet\": {\"path\": \"/healthz\", \"port\": 9898}},\n    }\n    assert broken_probes(container) == [\"readinessProbe\"]\n\ndef test_no_ports():\n    container = {\"name\": \"app\", \"livenessProbe\": {\"httpGet\": {\"port\": \"http\"}}, \"readinessProbe\": {\"exec\": {\"command\": [\"true\"]}}}\n    assert broken_probes(container) == [\"livenessProbe\"], \"exec probes have no port\"\n\ndef test_none():\n    assert broken_probes({\"name\": \"app\"}) == []\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>Collect the named ports into a set first. A port is a name when\n        it's a \u003ccode>str\u003c/code> that isn't all digits.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">def broken_probes(container):\n    names = {p.get(\"name\") for p in container.get(\"ports\", []) if p.get(\"name\")}\n    broken = []\n    for probe in (\"startupProbe\", \"readinessProbe\", \"livenessProbe\"):\n        spec = container.get(probe) or {}\n        for handler in (\"httpGet\", \"tcpSocket\"):\n            port = (spec.get(handler) or {}).get(\"port\")\n            if isinstance(port, str) and not port.isdigit() and port not in names:\n                broken.append(probe)\n    return sorted(broken)\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"exercise\" data-id=\"m02-e4\" data-title=\"Harden a container\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Write \u003ccode>harden(pod)\u003c/code> that returns a \u003cstrong>new\u003c/strong> Pod dict (don't modify the argument)\n          that meets the restricted standard: at Pod level \u003ccode>runAsNonRoot: true\u003c/code>, \u003ccode>runAsUser:\n          10001\u003c/code>, and \u003ccode>seccompProfile.type: RuntimeDefault\u003c/code>; on every container\n          \u003ccode>allowPrivilegeEscalation: false\u003c/code>, \u003ccode>readOnlyRootFilesystem: true\u003c/code>, and\n          \u003ccode>capabilities.drop: [\"ALL\"]\u003c/code>. Keep any settings that are already there.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\nimport copy\nimport kubelab\n\ndef harden(pod):\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\nimport kubelab\n\nPOD = {\"apiVersion\": \"v1\", \"kind\": \"Pod\", \"metadata\": {\"name\": \"p\"}, \"spec\": {\n    \"securityContext\": {\"fsGroup\": 2000},\n    \"containers\": [{\"name\": \"a\", \"image\": \"x:1\"}, {\"name\": \"b\", \"image\": \"y:1\", \"securityContext\": {\"runAsGroup\": 3000}}]}}\n\nSECURITY = (\"runAsNonRoot\", \"allowPrivilegeEscalation\", \"capabilities\", \"seccompProfile\")\n\ndef test_no_security_warnings():\n    hardened = harden(POD)\n    left = [w for w in kubelab.warnings(hardened) if any(s in w for s in SECURITY)]\n    assert left == [], left\n\ndef test_keeps_existing_and_copies():\n    hardened = harden(POD)\n    assert hardened[\"spec\"][\"securityContext\"][\"fsGroup\"] == 2000\n    assert hardened[\"spec\"][\"containers\"][1][\"securityContext\"][\"runAsGroup\"] == 3000\n    assert hardened[\"spec\"][\"securityContext\"][\"runAsUser\"] == 10001\n    assert hardened[\"spec\"][\"containers\"][0][\"securityContext\"][\"readOnlyRootFilesystem\"] is True\n    assert \"securityContext\" not in POD[\"spec\"][\"containers\"][0], \"don't modify the input\"\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>Start with \u003ccode>copy.deepcopy(pod)\u003c/code>, then use\n        \u003ccode>setdefault(\"securityContext\", {})\u003c/code> and \u003ccode>update()\u003c/code>.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">import copy\n\ndef harden(pod):\n    out = copy.deepcopy(pod)\n    spec = out[\"spec\"]\n    spec.setdefault(\"securityContext\", {}).update(\n        {\"runAsNonRoot\": True, \"runAsUser\": 10001, \"seccompProfile\": {\"type\": \"RuntimeDefault\"}})\n    for container in spec.get(\"containers\", []):\n        container.setdefault(\"securityContext\", {}).update(\n            {\"allowPrivilegeEscalation\": False, \"readOnlyRootFilesystem\": True, \"capabilities\": {\"drop\": [\"ALL\"]}})\n    return out\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"exercise\" data-id=\"m02-e5\" data-title=\"Triage a namespace\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Write \u003ccode>triage(pods)\u003c/code> that returns a dict counting Pods by diagnosis using\n          \u003ccode>kubelab.pod_issue\u003c/code>: the issue's \u003ccode>reason\u003c/code>, or \u003ccode>\"OK\"\u003c/code> when it returns\n          \u003ccode>None\u003c/code>.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\nimport kubelab\n\ndef triage(pods):\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\ndef p(**status):\n    return {\"status\": status}\n\nPODS = [\n    p(phase=\"Running\", containerStatuses=[{\"name\": \"a\", \"ready\": True, \"state\": {\"running\": {}}}]),\n    p(phase=\"Running\", containerStatuses=[{\"name\": \"a\", \"ready\": True, \"state\": {\"running\": {}}}]),\n    p(phase=\"Pending\", containerStatuses=[{\"name\": \"a\", \"state\": {\"waiting\": {\"reason\": \"ImagePullBackOff\"}}}]),\n    p(phase=\"Pending\", conditions=[{\"type\": \"PodScheduled\", \"status\": \"False\"}]),\n    p(phase=\"Running\", containerStatuses=[{\"name\": \"a\", \"ready\": False, \"state\": {\"running\": {}}}]),\n]\n\ndef test_counts():\n    assert triage(PODS) == {\"OK\": 2, \"ImagePullBackOff\": 1, \"Unschedulable\": 1, \"NotReady\": 1}\n\ndef test_empty():\n    assert triage([]) == {}\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>\u003ccode>issue.reason if issue else \"OK\"\u003c/code>, then count with a\n        dict or \u003ccode>collections.Counter\u003c/code> (convert it back to a plain dict).\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">import kubelab\n\ndef triage(pods):\n    counts = {}\n    for pod in pods:\n        issue = kubelab.pod_issue(pod)\n        key = issue.reason if issue else \"OK\"\n        counts[key] = counts.get(key, 0) + 1\n    return counts\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"mini-project\">\n    \u003ch2>Labs: a production-shaped Pod, and Pod triage\u003c/h2>\n    \u003cdiv class=\"project-box\">\n      \u003cdiv class=\"widget-head\">\u003cspan class=\"w-kind\">Labs m02-lab1 and m02-lab2\u003c/span>\u003cspan class=\"w-title\">Write a Pod you'd ship, then a tool that explains broken ones\u003c/span>\u003c/div>\n      \u003cdiv class=\"widget-body\">\n        \u003cp>\u003cstrong>m02-lab1:\u003c/strong> write \u003ccode>pod.yaml\u003c/code> for podinfo with a named port, all three probes,\n          requests and a memory limit, and the restricted security settings. The checks validate it with kubelab and\n          require that the only lint warning left is \"bare Pod\". The live check applies it to your cluster and waits\n          for it to become Ready.\u003c/p>\n        \u003cp>\u003cstrong>m02-lab2:\u003c/strong> write \u003ccode>triage.py\u003c/code>, a command-line tool that reads\n          \u003ccode>kubectl get pods -o json\u003c/code> and prints one line per unhealthy Pod with its reason and the next\n          command to run. No kubelab allowed: in a locked-down environment you'll have only Python and kubectl.\u003c/p>\n        \u003cpre data-label=\"Terminal\">\u003ccode class=\"language-bash\">pixi run start m02-lab1\npixi run grade m02-lab1\npixi run grade-live m02-lab1      # optional: applies pod.yaml to the primer cluster\npixi run start m02-lab2\npixi run grade m02-lab2\nkubectl get pods -A -o json | python work/m02-lab2/triage.py\u003c/code>\u003c/pre>\n        \u003cul class=\"checklist\" data-id=\"m02-labs\">\n          \u003cli>\u003ccode>pod.yaml\u003c/code> passes \u003ccode>kubelab.check_object\u003c/code>\u003c/li>\n          \u003cli>Startup, readiness, and liveness probes all use the named port\u003c/li>\n          \u003cli>Burstable QoS with modest requests and a memory limit\u003c/li>\n          \u003cli>Only the \"bare Pod\" warning remains\u003c/li>\n          \u003cli>\u003ccode>triage.py\u003c/code> reports the root cause for each fixture, OOM before CrashLoop\u003c/li>\n          \u003cli>Both \u003ccode>pixi run grade\u003c/code> commands pass\u003c/li>\n        \u003c/ul>\n        \u003cp>\u003cstrong>Stretch:\u003c/strong> add a \u003ccode>--watch\u003c/code> flag to \u003ccode>triage.py\u003c/code> that re-reads every five\n          seconds from \u003ccode>kubectl get pods -o json\u003c/code> via \u003ccode>subprocess\u003c/code>.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"quiz\">\n    \u003ch2>Quiz\u003c/h2>\n    \u003cdiv class=\"quiz\" data-id=\"m02-quiz\">\n\u003cscript type=\"application/json\">\n{\"title\": \"Pods quiz\", \"passScore\": 0.7, \"questions\": [\n  {\"type\": \"single\", \"prompt\": \"Two containers in the same Pod need to talk. Which address do they use?\", \"options\": [\"The Service name\", \"localhost\", \"The node's IP\", \"They can't\"], \"answer\": 1, \"explanation\": \"\u003cp>Containers in a Pod share one network namespace, so they reach each other on localhost (on different ports).\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"A readiness probe fails. What happens?\", \"options\": [\"The container restarts\", \"The Pod is removed from Service endpoints until it passes again\", \"The node is cordoned\", \"The Pod is deleted\"], \"answer\": 1, \"explanation\": \"\u003cp>Readiness controls traffic only. Liveness failures cause restarts.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"A slow-booting app keeps being killed during startup. What should you add?\", \"options\": [\"A longer readinessProbe\", \"A startupProbe\", \"A bigger CPU limit\", \"\u003ccode>restartPolicy: Never\u003c/code>\"], \"answer\": 1, \"explanation\": \"\u003cp>Liveness and readiness don't run until the startup probe succeeds, which protects slow boots.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"Why shouldn't a liveness probe check the database?\", \"options\": [\"Probes can't make network calls\", \"A database outage would restart every replica at once without fixing anything\", \"It's too slow\", \"Databases don't support HTTP\"], \"answer\": 1, \"explanation\": \"\u003cp>Restarting your app doesn't fix the database. Liveness should check only whether this process is wedged.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"A container uses more memory than its \u003cstrong>limit\u003c/strong>. What happens?\", \"options\": [\"It's throttled\", \"It's OOMKilled (exit code 137)\", \"Nothing until the node is full\", \"It's moved to another node\"], \"answer\": 1, \"explanation\": \"\u003cp>Memory isn't compressible. Going over the limit triggers the kernel's OOM killer. Going over a CPU limit only throttles.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"A Pod's only container has \u003ccode>limits: {cpu: 500m, memory: 256Mi}\u003c/code> and no requests. What's its QoS class?\", \"options\": [\"BestEffort\", \"Burstable\", \"Guaranteed\"], \"answer\": 2, \"explanation\": \"\u003cp>Missing requests default to the limits, so requests equal limits for both resources: Guaranteed.\u003c/p>\"},\n  {\"type\": \"output\", \"prompt\": \"What does this print?\", \"code\": \"import kubelab\\nprint(kubelab.parse_memory('1Ki'))\", \"answer\": \"1024\", \"explanation\": \"\u003cp>\u003ccode>Ki\u003c/code> is binary (2\u003csup>10\u003c/sup>). \u003ccode>1k\u003c/code> would be 1000.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"How do you declare a native sidecar?\", \"options\": [\"A container named sidecar\", \"An init container with \u003ccode>restartPolicy: Always\u003c/code>\", \"An annotation\", \"A second Pod with the same labels\"], \"answer\": 1, \"explanation\": \"\u003cp>Native sidecars start before the app, keep running beside it, and stop after it.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"\u003ccode>runAsNonRoot: true\u003c/code> is set and the Pod fails with \u003ccode>CreateContainerConfigError\u003c/code>. The image says \u003ccode>USER app\u003c/code>. What's the fix?\", \"options\": [\"Remove runAsNonRoot\", \"Add a numeric \u003ccode>runAsUser\u003c/code>\", \"Run as privileged\", \"Rebuild with \u003ccode>USER root\u003c/code>\"], \"answer\": 1, \"explanation\": \"\u003cp>The kubelet can't prove a user \u003cem>name\u003c/em> isn't root. A numeric UID lets it verify.\u003c/p>\"},\n  {\"type\": \"multi\", \"prompt\": \"Which settings does the \u003ccode>restricted\u003c/code> Pod Security Standard expect?\", \"options\": [\"\u003ccode>runAsNonRoot: true\u003c/code>\", \"\u003ccode>allowPrivilegeEscalation: false\u003c/code>\", \"\u003ccode>capabilities.drop: [ALL]\u003c/code>\", \"\u003ccode>seccompProfile.type: RuntimeDefault\u003c/code>\", \"\u003ccode>hostNetwork: true\u003c/code>\"], \"answer\": [0, 1, 2, 3], \"explanation\": \"\u003cp>Host namespaces are forbidden at restricted (and baseline). The other four are required.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"A Pod restarts every few seconds. Which command shows why the last attempt died?\", \"options\": [\"\u003ccode>kubectl logs POD\u003c/code>\", \"\u003ccode>kubectl logs POD --previous\u003c/code>\", \"\u003ccode>kubectl get events -w\u003c/code>\", \"\u003ccode>kubectl top pod\u003c/code>\"], \"answer\": 1, \"explanation\": \"\u003cp>\u003ccode>--previous\u003c/code> shows the terminated container's output; the current one may have only just started.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"Which tool gives you a shell with tools inside a running Pod whose image has no shell?\", \"options\": [\"\u003ccode>kubectl exec -- bash\u003c/code>\", \"\u003ccode>kubectl debug -it POD --image=busybox:1.36 --target=app\u003c/code>\", \"\u003ccode>kubectl attach\u003c/code>\", \"\u003ccode>docker exec\u003c/code> on your Mac\"], \"answer\": 1, \"explanation\": \"\u003cp>An ephemeral debug container brings its own tools and can share the target container's process namespace.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"Why use named ports in probes (\u003ccode>port: http\u003c/code>)?\", \"options\": [\"Names are faster\", \"Changing the container port in one place can't silently break the probes\", \"Probes require names\", \"Names work across Pods\"], \"answer\": 1, \"explanation\": \"\u003cp>The name resolves to whatever \u003ccode>containerPort\u003c/code> carries it.\u003c/p>\"}\n]}\n\u003c/script>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"recap\">\n    \u003ch2>Recap\u003c/h2>\n    \u003cul>\n      \u003cli>A Pod is containers scheduled together, sharing an IP and volumes. Keep it to one app plus helpers.\u003c/li>\n      \u003cli>Phases describe the Pod; states and reasons describe each container. CrashLoopBackOff is a restart\n        back-off, not a cause.\u003c/li>\n      \u003cli>Startup protects boots, readiness controls traffic, liveness restarts wedged processes.\u003c/li>\n      \u003cli>Requests place Pods; limits cap them; requests and limits together decide the QoS class.\u003c/li>\n      \u003cli>Init containers prepare; native sidecars accompany.\u003c/li>\n      \u003cli>Write to \u003ccode>restricted\u003c/code>: non-root with a numeric UID, no escalation, no capabilities, seccomp.\u003c/li>\n      \u003cli>Debug top-down: status, describe Events, logs --previous, then exec or debug.\u003c/li>\n    \u003c/ul>\n    \u003cdiv class=\"flashcards\" data-title=\"Pods\">\n      \u003cscript type=\"application/json\">\n      [{\"front\": \"What containers in a Pod share\", \"back\": \"One network namespace (IP, ports, localhost), declared volumes, and a lifecycle.\"},\n       {\"front\": \"readiness vs liveness\", \"back\": \"Readiness: may it get traffic? Failure removes it from endpoints. Liveness: is it wedged? Failure restarts it.\"},\n       {\"front\": \"startupProbe\", \"back\": \"Holds off the other probes until the app has booted.\"},\n       {\"front\": \"CPU over limit / memory over limit\", \"back\": \"CPU: throttled. Memory: OOMKilled (exit 137).\"},\n       {\"front\": \"Guaranteed QoS\", \"back\": \"Every container sets CPU and memory limits, with requests equal to limits.\"},\n       {\"front\": \"\u003ccode>250m\u003c/code> CPU\", \"back\": \"A quarter of a core.\"},\n       {\"front\": \"\u003ccode>128Mi\u003c/code> vs \u003ccode>128M\u003c/code>\", \"back\": \"Binary 134,217,728 bytes vs decimal 128,000,000 bytes.\"},\n       {\"front\": \"Native sidecar\", \"back\": \"An initContainer with \u003ccode>restartPolicy: Always\u003c/code>.\"},\n       {\"front\": \"CrashLoopBackOff\", \"back\": \"The kubelet is waiting before restarting a container that keeps exiting. Read \u003ccode>logs --previous\u003c/code>.\"},\n       {\"front\": \"runAsNonRoot with USER app\", \"back\": \"Fails: add a numeric runAsUser.\"},\n       {\"front\": \"Shell into a distroless Pod\", \"back\": \"\u003ccode>kubectl debug -it POD --image=busybox:1.36 --target=CONTAINER\u003c/code>\"}]\n      \u003c/script>\n    \u003c/div>\n    \u003ch3>Going further\u003c/h3>\n    \u003cul>\n      \u003cli>\u003ca href=\"https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/\">Kubernetes: Pod lifecycle\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/\">Configure liveness, readiness, and startup probes\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"https://kubernetes.io/docs/concepts/security/pod-security-standards/\">Pod Security Standards\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/\">Sidecar containers\u003c/a>\u003c/li>\n      \u003cli>Next: \u003ca href=\"m03-deployments-and-workloads.html\">M03 Deployments and Workloads\u003c/a>\u003c/li>\n    \u003c/ul>\n  \u003c/section>","exercises":["m02-e1","m02-e2","m02-e3","m02-e4","m02-e5"],"quizzes":["m02-quiz"],"checklists":{"m02-labs":6}},"modules/m03-deployments-and-workloads.html":{"id":"m03","kind":"module","title":"M03 · Deployments and Workloads · Kubernetes Practicum","html":"\u003cheader class=\"lesson-hero\">\n    \u003cp class=\"eyebrow\">Stage 1 · Foundations · Module 03\u003c/p>\n    \u003ch1>Deployments and Workloads\u003c/h1>\n    \u003cp class=\"lede\">You almost never create Pods yourself. You create a controller that creates them, replaces them\n      when they die, and swaps them for a new version without dropping traffic. This module covers the Deployment,\n      the controller you'll use most, in depth, then the other workload kinds and when each one fits.\u003c/p>\n    \u003cdiv class=\"lesson-meta\">\u003cspan>⏱ ~2.5 hours\u003c/span>\u003cspan>Prerequisites: \u003ca href=\"m02-pods.html\">M02 Pods\u003c/a>\u003c/span>\u003c/div>\n    \u003cul class=\"objectives\">\n      \u003cli>Explain how labels and selectors connect Deployments, ReplicaSets, and Pods, and the pitfalls of overlap\u003c/li>\n      \u003cli>Write a Deployment and predict exactly how a rolling update proceeds for any maxSurge and maxUnavailable\u003c/li>\n      \u003cli>Use minReadySeconds and progressDeadlineSeconds to make rollouts safe\u003c/li>\n      \u003cli>Drive rollouts: status, history, pause, resume, restart, and undo\u003c/li>\n      \u003cli>Choose between Deployment, StatefulSet, DaemonSet, Job, and CronJob\u003c/li>\n      \u003cli>Write Jobs and Cr
