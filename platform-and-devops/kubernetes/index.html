onJobs with retries, deadlines, concurrency policy, and history limits\u003c/li>\n    \u003c/ul>\n  \u003c/header>\n\n  \u003csection class=\"lesson-section\" id=\"why\">\n    \u003ch2>Why controllers\u003c/h2>\n    \u003cp>A bare Pod has no guardian. If it crashes, the kubelet restarts its containers in place, but if the Pod is\n      deleted or its node dies, it's simply gone. A \u003cstrong>ReplicaSet\u003c/strong> fixes that: it keeps a number of\n      identical Pods running, using the reconcile loop you met in M01. A \u003cstrong>Deployment\u003c/strong> sits on top\n      and manages ReplicaSets, one per version of your Pod template, so it can move you from one version to the\n      next.\u003c/p>\n    \u003cfigure class=\"figure\">\n      \u003csvg class=\"diagram\" viewBox=\"0 0 720 200\" role=\"img\" aria-label=\"A Deployment owns two ReplicaSets; the new one owns three Pods\">\n        \u003crect x=\"20\" y=\"72\" width=\"150\" height=\"56\" rx=\"8\" fill=\"var(--accent)\"/>\n        \u003ctext x=\"95\" y=\"96\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"var(--accent-fg)\">Deployment web\u003c/text>\n        \u003ctext x=\"95\" y=\"114\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--accent-fg)\">strategy · template\u003c/text>\n        \u003crect x=\"240\" y=\"20\" width=\"180\" height=\"50\" rx=\"8\" fill=\"var(--bg-elev)\" stroke=\"var(--border-strong)\"/>\n        \u003ctext x=\"330\" y=\"41\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fg)\">ReplicaSet web-7d9f\u003c/text>\n        \u003ctext x=\"330\" y=\"58\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--fg-muted)\">v1 · 0 replicas (kept for rollback)\u003c/text>\n        \u003crect x=\"240\" y=\"122\" width=\"180\" height=\"50\" rx=\"8\" fill=\"var(--fg)\"/>\n        \u003ctext x=\"330\" y=\"143\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--bg)\">ReplicaSet web-5c4b\u003c/text>\n        \u003ctext x=\"330\" y=\"160\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--bg)\">v2 · 3 replicas\u003c/text>\n        \u003crect x=\"470\" y=\"127\" width=\"70\" height=\"40\" rx=\"6\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"/>\n        \u003ctext x=\"505\" y=\"152\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--fg)\">pod\u003c/text>\n        \u003crect x=\"550\" y=\"127\" width=\"70\" height=\"40\" rx=\"6\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"/>\n        \u003ctext x=\"585\" y=\"152\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--fg)\">pod\u003c/text>\n        \u003crect x=\"630\" y=\"127\" width=\"70\" height=\"40\" rx=\"6\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"/>\n        \u003ctext x=\"665\" y=\"152\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--fg)\">pod\u003c/text>\n        \u003cline x1=\"170\" y1=\"92\" x2=\"240\" y2=\"48\" stroke=\"var(--fg)\" stroke-width=\"1.5\"/>\n        \u003cline x1=\"170\" y1=\"108\" x2=\"240\" y2=\"145\" stroke=\"var(--accent)\" stroke-width=\"2\"/>\n        \u003cline x1=\"420\" y1=\"147\" x2=\"470\" y2=\"147\" stroke=\"var(--accent)\" stroke-width=\"2\"/>\n      \u003c/svg>\n      \u003cfigcaption>Each change to the Pod template creates a new ReplicaSet (its name ends in a hash of the template).\n        The Deployment shifts replicas from the old one to the new one, and keeps old ReplicaSets at zero so it can\n        roll back.\u003c/figcaption>\n    \u003c/figure>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"selectors\">\n    \u003ch2>Labels and selectors\u003c/h2>\n    \u003cp>\u003cstrong>Labels\u003c/strong> are key/value pairs on any object: \u003ccode>app.kubernetes.io/name: podinfo\u003c/code>,\n      \u003ccode>tier: front\u003c/code>. A \u003cstrong>selector\u003c/strong> is a query over labels. Controllers find \"their\" Pods by\n      selector, not by name, which is why the selector and the template's labels must agree.\u003c/p>\n    \u003cpre>\u003ccode class=\"language-yaml\">selector:\n  matchLabels: {app.kubernetes.io/name: podinfo}       # every listed label must equal\n  matchExpressions:                                    # and every expression must hold\n    - {key: tier, operator: In, values: [front, edge]}\n    - {key: canary, operator: DoesNotExist}\u003c/code>\u003c/pre>\n    \u003cdiv class=\"scroll\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>Rule\u003c/th>\u003cth>Why\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>\u003ccode>spec.selector\u003c/code> must match \u003ccode>spec.template.metadata.labels\u003c/code>\u003c/td>\u003ctd>Otherwise the controller couldn't see the Pods it creates; the API rejects it\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>A Deployment's selector is \u003cstrong>immutable\u003c/strong>\u003c/td>\u003ctd>Changing it would orphan every existing Pod. To change it, create a new Deployment\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Two controllers must not select the same Pods\u003c/td>\u003ctd>They'd fight, each deleting Pods the other created. Include a distinguishing label\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Label values are strings\u003c/td>\u003ctd>Write \u003ccode>version: \"2\"\u003c/code>, not \u003ccode>version: 2\u003c/code>\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n    \u003cdiv class=\"runnable\" data-title=\"Who selects whom?\">\n\u003ctextarea>\nimport kubelab\n\npods = [\n    {\"metadata\": {\"name\": \"a\", \"labels\": {\"app\": \"web\", \"tier\": \"front\"}}},\n    {\"metadata\": {\"name\": \"b\", \"labels\": {\"app\": \"web\", \"tier\": \"edge\", \"canary\": \"true\"}}},\n    {\"metadata\": {\"name\": \"c\", \"labels\": {\"app\": \"api\"}}},\n]\nselector = {\"matchLabels\": {\"app\": \"web\"},\n            \"matchExpressions\": [{\"key\": \"canary\", \"operator\": \"DoesNotExist\"}]}\nprint([p[\"metadata\"][\"name\"] for p in kubelab.select(selector, pods)])\nprint([p[\"metadata\"][\"name\"] for p in kubelab.select({\"app\": \"web\"}, pods)])   # Service-style selector\n\u003c/textarea>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"deployment\">\n    \u003ch2>A production-shaped Deployment\u003c/h2>\n    \u003cpre>\u003ccode class=\"language-yaml\"># deployment.yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: podinfo\n  labels: {app.kubernetes.io/name: podinfo}\n  annotations:\n    kubernetes.io/change-cause: \"podinfo 6.7.0\"   # shown by rollout history\nspec:\n  replicas: 4\n  revisionHistoryLimit: 5            # old ReplicaSets kept for rollback\n  minReadySeconds: 5                 # a new Pod must stay Ready this long to count\n  progressDeadlineSeconds: 120       # mark the rollout failed if stuck this long\n  selector:\n    matchLabels: {app.kubernetes.io/name: podinfo}\n  strategy:\n    type: RollingUpdate\n    rollingUpdate:\n      maxSurge: 1                    # at most 1 Pod above replicas during a rollout\n      maxUnavailable: 0              # never fewer than 4 ready\n  template:\n    metadata:\n      labels: {app.kubernetes.io/name: podinfo}\n    spec:\n      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}\n      containers:\n        - name: app\n          image: ghcr.io/stefanprodan/podinfo:6.7.0\n          ports: [{containerPort: 9898, name: http}]\n          readinessProbe: {httpGet: {path: /readyz, port: http}}\n          livenessProbe: {httpGet: {path: /healthz, port: http}}\n          resources:\n            requests: {cpu: 50m, memory: 64Mi}\n            limits: {memory: 128Mi}\n          securityContext:\n            allowPrivilegeEscalation: false\n            readOnlyRootFilesystem: true\n            capabilities: {drop: [ALL]}\u003c/code>\u003c/pre>\n    \u003cp>Notice what's \u003cem>not\u003c/em> here: no Pod names, no node names. The Deployment describes a template and a\n      count. Everything else follows.\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"rolling\">\n    \u003ch2>Rolling updates\u003c/h2>\n    \u003cp>Change anything in \u003ccode>spec.template\u003c/code> (the image, an env var, a label) and the Deployment starts a\n      rollout. Two numbers bound it:\u003c/p>\n    \u003cdiv class=\"scroll\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>Setting\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>Percentages round\u003c/th>\u003cth>Default\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>\u003ccode>maxSurge\u003c/code>\u003c/td>\u003ctd>How many Pods may exist \u003cstrong>above\u003c/strong> \u003ccode>replicas\u003c/code>\u003c/td>\u003ctd>Up\u003c/td>\u003ctd>25%\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>maxUnavailable\u003c/code>\u003c/td>\u003ctd>How many may be \u003cstrong>missing\u003c/strong> from \u003ccode>replicas\u003c/code>\u003c/td>\u003ctd>Down\u003c/td>\u003ctd>25%\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n    \u003cp>So during a rollout: total Pods ≤ \u003ccode>replicas + maxSurge\u003c/code>, and ready Pods ≥\n      \u003ccode>replicas − maxUnavailable\u003c/code>. Both can't be zero, or the rollout could never take a step.\u003c/p>\n    \u003cdiv class=\"viz\" data-viz=\"rollout\" data-config='{\"replicas\": 4, \"maxSurge\": 1, \"maxUnavailable\": 0}'>\u003c/div>\n    \u003cp>Try \u003ccode>maxSurge: 0, maxUnavailable: 1\u003c/code> (no extra capacity: good when the cluster is full), then\n      \u003ccode>25%\u003c/code> and \u003ccode>25%\u003c/code> with 10 replicas (the defaults), then \u003ccode>0\u003c/code> and \u003ccode>0\u003c/code>.\u003c/p>\n    \u003cdiv class=\"runnable\" data-title=\"The bounds for any settings\">\n\u003ctextarea>\nimport kubelab\n\nfor replicas, surge, unavailable in [(4, 1, 0), (10, \"25%\", \"25%\"), (3, \"25%\", \"25%\"), (4, 0, 1)]:\n    most, least = kubelab.rollout_bounds(replicas, surge, unavailable)\n    print(f\"replicas={replicas:2} surge={surge!s:>4} unavailable={unavailable!s:>4} -> at most {most} Pods, at least {least} ready\")\n\u003c/textarea>\n    \u003c/div>\n    \u003cp>Two fields make rollouts safer. \u003ccode>minReadySeconds\u003c/code> requires a new Pod to stay Ready for a while\n      before it counts as available, which catches apps that pass one readiness check and then crash.\n      \u003ccode>progressDeadlineSeconds\u003c/code> marks the rollout as failed (\u003ccode>Progressing=False\u003c/code>,\n      reason \u003ccode>ProgressDeadlineExceeded\u003c/code>) if it makes no progress for that long. Kubernetes does\n      \u003cstrong>not\u003c/strong> roll back on its own; your pipeline or you do that.\u003c/p>\n    \u003caside class=\"callout think\">\u003cp>With \u003ccode>maxUnavailable: 0\u003c/code>, you push an image tag that doesn't exist.\n      What happens to traffic? What does \u003ccode>kubectl get rs\u003c/code> show? Check your answer in the lab.\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"rollbacks\">\n    \u003ch2>Driving rollouts\u003c/h2>\n    \u003cdiv class=\"scroll\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>Action\u003c/th>\u003cth>Command\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>Change the image (starts a rollout)\u003c/td>\u003ctd>\u003ccode>kubectl set image deploy/podinfo app=ghcr.io/stefanprodan/podinfo:6.7.1\u003c/code>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Watch it\u003c/td>\u003ctd>\u003ccode>kubectl rollout status deploy/podinfo\u003c/code> (exits non-zero if the deadline passes)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Record why\u003c/td>\u003ctd>\u003ccode>kubectl annotate deploy/podinfo kubernetes.io/change-cause=\"6.7.1\" --overwrite\u003c/code>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>History\u003c/td>\u003ctd>\u003ccode>kubectl rollout history deploy/podinfo\u003c/code>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Roll back one revision, or to a specific one\u003c/td>\u003ctd>\u003ccode>kubectl rollout undo deploy/podinfo\u003c/code>, \u003ccode>--to-revision=2\u003c/code>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Batch several edits into one rollout\u003c/td>\u003ctd>\u003ccode>kubectl rollout pause deploy/podinfo\u003c/code> … edit … \u003ccode>kubectl rollout resume deploy/podinfo\u003c/code>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Restart every Pod (e.g. after a Secret changed)\u003c/td>\u003ctd>\u003ccode>kubectl rollout restart deploy/podinfo\u003c/code>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Scale (doesn't create a revision)\u003c/td>\u003ctd>\u003ccode>kubectl scale deploy/podinfo --replicas=6\u003c/code>\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n    \u003cp>A rollback is just another rollout: the Deployment copies an old ReplicaSet's template back and gives it a\n      \u003cem>new\u003c/em> revision number. Scaling never creates a revision, because \u003ccode>replicas\u003c/code> isn't part of the\n      template.\u003c/p>\n    \u003caside class=\"callout note\">\u003cp>\u003ccode>kubectl rollout restart\u003c/code> works by adding a timestamp annotation to the\n      template. That's a template change, so it's a normal rolling update with all its safety.\u003c/p>\u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"recreate\">\n    \u003ch2>The Recreate strategy\u003c/h2>\n    \u003cp>\u003ccode>strategy: {type: Recreate}\u003c/code> deletes every old Pod first, then creates the new ones. There is\n      downtime between the two. Use it only when two versions must never run at once: an app that holds an\n      exclusive lock, or a schema change old code can't survive. For everything else, use RollingUpdate and make\n      your app tolerate a short overlap.\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"other-controllers\">\n    \u003ch2>The other workload controllers\u003c/h2>\n    \u003cdiv class=\"scroll\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>Controller\u003c/th>\u003cth>Use it for\u003c/th>\u003cth>Pod identity\u003c/th>\u003cth>Storage\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>Deployment\u003c/td>\u003ctd>Stateless, interchangeable replicas\u003c/td>\u003ctd>Random suffixes\u003c/td>\u003ctd>Shared or none\u003c/td>\u003ctd>Web and API servers\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>StatefulSet\u003c/td>\u003ctd>Stable identity, ordered start and stop\u003c/td>\u003ctd>\u003ccode>db-0\u003c/code>, \u003ccode>db-1\u003c/code> with stable DNS\u003c/td>\u003ctd>One volume per replica\u003c/td>\u003ctd>PostgreSQL, Kafka, etcd\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>DaemonSet\u003c/td>\u003ctd>One Pod on every (matching) node\u003c/td>\u003ctd>One per node\u003c/td>\u003ctd>Often the node's disk\u003c/td>\u003ctd>Log agents, CNI, node exporters\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Job\u003c/td>\u003ctd>Run to completion, with retries\u003c/td>\u003ctd>Random\u003c/td>\u003ctd>Optional\u003c/td>\u003ctd>Migrations, batch exports\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>CronJob\u003c/td>\u003ctd>Jobs on a schedule\u003c/td>\u003ctd>Random\u003c/td>\u003ctd>Optional\u003c/td>\u003ctd>Nightly backups, reports\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>ReplicaSet\u003c/td>\u003ctd>Don't use directly; Deployments manage them\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n    \u003cp>StatefulSets need persistent storage and headless Services, so they get full treatment in Stage 2. For now,\n      know when you'd reach for one.\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"jobs\">\n    \u003ch2>Jobs and CronJobs\u003c/h2>\n    \u003cpre>\u003ccode class=\"language-yaml\"># cronjob.yaml: print the date every five minutes\napiVersion: batch/v1\nkind: CronJob\nmetadata: {name: ticker}\nspec:\n  schedule: \"*/5 * * * *\"             # minute hour day-of-month month day-of-week\n  timeZone: America/Chicago           # otherwise the controller's time zone (usually UTC)\n  concurrencyPolicy: Forbid           # skip a run if the last one is still going\n  startingDeadlineSeconds: 120        # give up on a missed run after 2 minutes\n  successfulJobsHistoryLimit: 3\n  failedJobsHistoryLimit: 1\n  jobTemplate:\n    spec:\n      backoffLimit: 2                 # retries before the Job is marked failed\n      activeDeadlineSeconds: 60       # kill a run that takes longer\n      ttlSecondsAfterFinished: 3600   # clean up finished Jobs\n      template:\n        spec:\n          restartPolicy: OnFailure    # Jobs need OnFailure or Never\n          containers:\n            - name: tick\n              image: busybox:1.36\n              command: ['sh', '-c', 'date; echo hello from $(hostname)']\u003c/code>\u003c/pre>\n    \u003cdiv class=\"scroll\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>Field\u003c/th>\u003cth>What it controls\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>\u003ccode>completions\u003c/code> / \u003ccode>parallelism\u003c/code>\u003c/td>\u003ctd>How many successful Pods a Job needs, and how many run at once\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>backoffLimit\u003c/code>\u003c/td>\u003ctd>Failures allowed before the Job fails (default 6)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>activeDeadlineSeconds\u003c/code>\u003c/td>\u003ctd>Wall-clock limit for the whole Job\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>concurrencyPolicy\u003c/code>\u003c/td>\u003ctd>\u003ccode>Allow\u003c/code> (default), \u003ccode>Forbid\u003c/code>, or \u003ccode>Replace\u003c/code> the running Job\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ccode>restartPolicy\u003c/code>\u003c/td>\u003ctd>\u003ccode>OnFailure\u003c/code> retries in the same Pod; \u003ccode>Never\u003c/code> makes a new Pod per attempt (keeps the failed ones for logs)\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n    \u003cpre data-label=\"Terminal\">\u003ccode class=\"language-bash\">kubectl create job once --from=cronjob/ticker    # run a CronJob now\nkubectl get jobs,pods -l job-name=once\nkubectl logs job/once\u003c/code>\u003c/pre>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"practice\">\n    \u003ch2>Practice\u003c/h2>\n    \u003cp>Five exercises on rollout maths, selectors, choosing controllers, and history.\u003c/p>\n\n    \u003cdiv class=\"exercise\" data-id=\"m03-e1\" data-title=\"Rollout bounds by hand\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Without using \u003ccode>kubelab.rollout_bounds\u003c/code>, write \u003ccode>bounds(replicas, max_surge,\n          max_unavailable)\u003c/code> returning \u003ccode>(max_pods, min_ready)\u003c/code>. Each setting is an int or a string\n          like \u003ccode>\"25%\"\u003c/code>; percentages of \u003ccode>replicas\u003c/code> round \u003cstrong>up\u003c/strong> for surge and\n          \u003cstrong>down\u003c/strong> for unavailable. The tests compare you with kubelab.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\nimport math\n\ndef bounds(replicas, max_surge, max_unavailable):\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\nimport kubelab\n\nCASES = [(4, 1, 0), (10, \"25%\", \"25%\"), (3, \"25%\", \"25%\"), (4, 0, 1), (1, \"25%\", \"25%\"), (7, \"50%\", \"10%\"), (5, 2, \"40%\")]\n\ndef test_against_kubelab():\n    for case in CASES:\n        assert bounds(*case) == kubelab.rollout_bounds(*case), f\"bounds{case} should be {kubelab.rollout_bounds(*case)}\"\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>Write a helper that turns \u003ccode>\"25%\"\u003c/code> into\n        \u003ccode>replicas * 25 / 100\u003c/code> and rounds with \u003ccode>math.ceil\u003c/code> or \u003ccode>math.floor\u003c/code>, and\n        turns ints into themselves.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">import math\n\ndef resolve(value, replicas, up):\n    text = str(value)\n    if text.endswith(\"%\"):\n        exact = replicas * float(text[:-1]) / 100\n        return math.ceil(exact) if up else math.floor(exact)\n    return int(text)\n\ndef bounds(replicas, max_surge, max_unavailable):\n    surge = resolve(max_surge, replicas, True)\n    unavailable = resolve(max_unavailable, replicas, False)\n    return replicas + surge, replicas - unavailable\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"exercise\" data-id=\"m03-e2\" data-title=\"Overlapping Deployments\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Two Deployments fight when one's selector matches the other's Pod template labels. Write\n          \u003ccode>overlaps(deployments)\u003c/code> returning a sorted list of \u003ccode>(a, b)\u003c/code> name pairs\n          (\u003ccode>a &lt; b\u003c/code>) where \u003cstrong>either\u003c/strong> selector matches the other's template labels. Use\n          \u003ccode>kubelab.selector_matches\u003c/code>.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\nimport kubelab\n\ndef overlaps(deployments):\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\ndef dep(name, selector, labels):\n    return {\"metadata\": {\"name\": name}, \"spec\": {\"selector\": selector, \"template\": {\"metadata\": {\"labels\": labels}}}}\n\nDEPS = [\n    dep(\"web\", {\"matchLabels\": {\"app\": \"web\"}}, {\"app\": \"web\", \"track\": \"stable\"}),\n    dep(\"web-canary\", {\"matchLabels\": {\"app\": \"web\", \"track\": \"canary\"}}, {\"app\": \"web\", \"track\": \"canary\"}),\n    dep(\"api\", {\"matchLabels\": {\"app\": \"api\"}}, {\"app\": \"api\"}),\n]\n\ndef test_overlap_found():\n    assert overlaps(DEPS) == [(\"web\", \"web-canary\")], \"web's selector also matches the canary's Pods\"\n\ndef test_no_overlap():\n    fixed = [dep(\"web\", {\"matchLabels\": {\"app\": \"web\", \"track\": \"stable\"}}, {\"app\": \"web\", \"track\": \"stable\"}), DEPS[1], DEPS[2]]\n    assert overlaps(fixed) == []\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>Loop over every pair with two indices \u003ccode>i &lt; j\u003c/code> and\n        check both directions.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">import kubelab\n\ndef overlaps(deployments):\n    def parts(d):\n        return d[\"metadata\"][\"name\"], d[\"spec\"][\"selector\"], d[\"spec\"][\"template\"][\"metadata\"][\"labels\"]\n    found = []\n    for i, a in enumerate(deployments):\n        for b in deployments[i + 1:]:\n            name_a, sel_a, labels_a = parts(a)\n            name_b, sel_b, labels_b = parts(b)\n            if kubelab.selector_matches(sel_a, labels_b) or kubelab.selector_matches(sel_b, labels_a):\n                found.append(tuple(sorted((name_a, name_b))))\n    return sorted(found)\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"exercise\" data-id=\"m03-e3\" data-title=\"Pick the controller\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Write \u003ccode>choose(needs)\u003c/code> that returns the controller kind for a workload described by a dict with\n          boolean keys \u003ccode>stable_identity\u003c/code>, \u003ccode>every_node\u003c/code>, \u003ccode>runs_to_completion\u003c/code>, and an\n          optional \u003ccode>schedule\u003c/code> string. Precedence: a schedule means \u003ccode>\"CronJob\"\u003c/code>; otherwise\n          runs-to-completion means \u003ccode>\"Job\"\u003c/code>; otherwise every-node means \u003ccode>\"DaemonSet\"\u003c/code>; otherwise\n          stable identity means \u003ccode>\"StatefulSet\"\u003c/code>; otherwise \u003ccode>\"Deployment\"\u003c/code>. Missing keys are\n          false.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\ndef choose(needs):\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\ndef test_cases():\n    assert choose({}) == \"Deployment\"\n    assert choose({\"stable_identity\": True}) == \"StatefulSet\"\n    assert choose({\"every_node\": True}) == \"DaemonSet\"\n    assert choose({\"runs_to_completion\": True}) == \"Job\"\n    assert choose({\"runs_to_completion\": True, \"schedule\": \"0 2 * * *\"}) == \"CronJob\"\n    assert choose({\"schedule\": \"@hourly\", \"every_node\": True}) == \"CronJob\", \"a schedule wins\"\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>A chain of \u003ccode>if\u003c/code> statements in the given order, using\n        \u003ccode>needs.get(key)\u003c/code>.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">def choose(needs):\n    if needs.get(\"schedule\"):\n        return \"CronJob\"\n    if needs.get(\"runs_to_completion\"):\n        return \"Job\"\n    if needs.get(\"every_node\"):\n        return \"DaemonSet\"\n    if needs.get(\"stable_identity\"):\n        return \"StatefulSet\"\n    return \"Deployment\"\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"exercise\" data-id=\"m03-e4\" data-title=\"Where does undo go?\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>\u003ccode>history\u003c/code> is a list of revision numbers kept by a Deployment (for example\n          \u003ccode>[2, 4, 5]\u003c/code>; old ones were pruned by \u003ccode>revisionHistoryLimit\u003c/code>). Write\n          \u003ccode>undo_target(history, to_revision=None)\u003c/code>: with no \u003ccode>to_revision\u003c/code>, return the revision\n          just before the newest; otherwise return \u003ccode>to_revision\u003c/code> if it's in history. Raise\n          \u003ccode>ValueError\u003c/code> when there's nothing to roll back to or the revision isn't kept.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\ndef undo_target(history, to_revision=None):\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\ndef raises(fn):\n    try:\n        fn()\n    except ValueError:\n        return True\n    return False\n\ndef test_previous():\n    assert undo_target([2, 4, 5]) == 4\n    assert undo_target([5, 2, 4]) == 4, \"history may arrive unsorted\"\n\ndef test_explicit():\n    assert undo_target([2, 4, 5], to_revision=2) == 2\n\ndef test_errors():\n    assert raises(lambda: undo_target([7])), \"one revision: nothing to roll back to\"\n    assert raises(lambda: undo_target([2, 4, 5], to_revision=3)), \"revision 3 was pruned\"\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>Sort the history; the target is \u003ccode>ordered[-2]\u003c/code>.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">def undo_target(history, to_revision=None):\n    if to_revision is not None:\n        if to_revision not in history:\n            raise ValueError(f\"revision {to_revision} is not in the history\")\n        return to_revision\n    ordered = sorted(history)\n    if len(ordered) &lt; 2:\n        raise ValueError(\"no previous revision to roll back to\")\n    return ordered[-2]\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"exercise\" data-id=\"m03-e5\" data-title=\"Will this CronJob validate?\">\n      \u003cdiv class=\"exercise-prompt\">\n        \u003cp>Write \u003ccode>cronjob_for(name, schedule, image, command)\u003c/code> returning a CronJob dict that\n          \u003ccode>kubelab.check_object\u003c/code> accepts, with \u003ccode>concurrencyPolicy: Forbid\u003c/code>,\n          \u003ccode>backoffLimit: 2\u003c/code>, \u003ccode>restartPolicy: OnFailure\u003c/code>, and one container named\n          \u003ccode>\"task\"\u003c/code>.\u003c/p>\n      \u003c/div>\n\u003ctextarea class=\"starter\">\nimport kubelab\n\ndef cronjob_for(name, schedule, image, command):\n    ...\n\u003c/textarea>\n      \u003cscript type=\"text/x-python\" class=\"tests\">\nimport kubelab\n\ndef test_valid():\n    cj = cronjob_for(\"report\", \"0 2 * * *\", \"busybox:1.36\", [\"sh\", \"-c\", \"echo hi\"])\n    assert kubelab.check_object(cj) == [], kubelab.check_object(cj)\n    assert kubelab.dig(cj, \"spec.concurrencyPolicy\") == \"Forbid\"\n    assert kubelab.dig(cj, \"spec.jobTemplate.spec.backoffLimit\") == 2\n    assert kubelab.dig(cj, \"spec.jobTemplate.spec.template.spec.containers.0.name\") == \"task\"\n    assert kubelab.dig(cj, \"spec.jobTemplate.spec.template.spec.containers.0.command\") == [\"sh\", \"-c\", \"echo hi\"]\n      \u003c/script>\n      \u003cdetails class=\"hint\">\u003csummary>Hint\u003c/summary>\u003cp>Copy the nesting from the cronjob.yaml above:\n        \u003ccode>spec.jobTemplate.spec.template.spec\u003c/code>.\u003c/p>\u003c/details>\n      \u003cdetails class=\"solution\">\u003csummary>Show solution\u003c/summary>\u003cpre>\u003ccode class=\"language-python\">def cronjob_for(name, schedule, image, command):\n    pod = {\"restartPolicy\": \"OnFailure\", \"containers\": [{\"name\": \"task\", \"image\": image, \"command\": command}]}\n    return {\n        \"apiVersion\": \"batch/v1\",\n        \"kind\": \"CronJob\",\n        \"metadata\": {\"name\": name},\n        \"spec\": {\n            \"schedule\": schedule,\n            \"concurrencyPolicy\": \"Forbid\",\n            \"jobTemplate\": {\"spec\": {\"backoffLimit\": 2, \"template\": {\"spec\": pod}}},\n        },\n    }\u003c/code>\u003c/pre>\u003c/details>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"mini-project\">\n    \u003ch2>Lab: a zero-downtime release\u003c/h2>\n    \u003cdiv class=\"project-box\">\n      \u003cdiv class=\"widget-head\">\u003cspan class=\"w-kind\">Lab m03-lab1\u003c/span>\u003cspan class=\"w-title\">Ship podinfo with no dropped requests, and a CronJob beside it\u003c/span>\u003c/div>\n      \u003cdiv class=\"widget-body\">\n        \u003cp>Write \u003ccode>deployment.yaml\u003c/code> for four podinfo replicas that can never drop below four ready Pods\n          during a rollout, with safe rollout settings and a recorded change cause. Add \u003ccode>cronjob.yaml\u003c/code>\n          for a scheduled task that never overlaps itself. Then fill in \u003ccode>rollout.toml\u003c/code> with the bounds and\n          rollback facts for your own settings. The live check applies both, rolls to 6.7.1, rolls back, and checks\n          the history.\u003c/p>\n        \u003cpre data-label=\"Terminal\">\u003ccode class=\"language-bash\">pixi run start m03-lab1\n# edit work/m03-lab1/deployment.yaml, cronjob.yaml, rollout.toml\npixi run grade m03-lab1\npixi run grade-live m03-lab1     # optional: real rollout and rollback on the primer cluster\u003c/code>\u003c/pre>\n        \u003cul class=\"checklist\" data-id=\"m03-lab1\">\n          \u003cli>4 replicas, \u003ccode>maxUnavailable: 0\u003c/code>, \u003ccode>maxSurge\u003c/code> of 1\u003c/li>\n          \u003cli>\u003ccode>minReadySeconds\u003c/code>, \u003ccode>progressDeadlineSeconds\u003c/code>, and \u003ccode>revisionHistoryLimit\u003c/code> set\u003c/li>\n          \u003cli>Readiness probe on a named port; the Pod passes the restricted settings\u003c/li>\n          \u003cli>CronJob with \u003ccode>concurrencyPolicy: Forbid\u003c/code>, a time zone, history limits, and a deadline\u003c/li>\n          \u003cli>\u003ccode>rollout.toml\u003c/code> answers match your manifests\u003c/li>\n          \u003cli>\u003ccode>pixi run grade m03-lab1\u003c/code> passes\u003c/li>\n        \u003c/ul>\n        \u003cp>\u003cstrong>Stretch:\u003c/strong> run a request loop during the live rollout (see the lab README) and prove it\n          never prints an error.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"quiz\">\n    \u003ch2>Quiz\u003c/h2>\n    \u003cdiv class=\"quiz\" data-id=\"m03-quiz\">\n\u003cscript type=\"application/json\">\n{\"title\": \"Deployments and Workloads quiz\", \"passScore\": 0.7, \"questions\": [\n  {\"type\": \"single\", \"prompt\": \"With \u003ccode>replicas: 4\u003c/code>, \u003ccode>maxSurge: 1\u003c/code>, \u003ccode>maxUnavailable: 0\u003c/code>, what's the most Pods that can exist mid-rollout?\", \"options\": [\"4\", \"5\", \"6\", \"8\"], \"answer\": 1, \"explanation\": \"\u003cp>replicas + maxSurge = 5. Ready Pods never drop below 4 − 0 = 4.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"\u003ccode>replicas: 10\u003c/code> with the default 25%/25%. What are the bounds?\", \"options\": [\"At most 12, at least 8 ready\", \"At most 13, at least 8 ready\", \"At most 13, at least 7 ready\", \"At most 12, at least 7 ready\"], \"answer\": 1, \"explanation\": \"\u003cp>Surge rounds up: ceil(2.5) = 3, so 13. Unavailable rounds down: floor(2.5) = 2, so 8.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"Which change starts a new rollout?\", \"options\": [\"\u003ccode>kubectl scale --replicas=6\u003c/code>\", \"Changing an env var in the Pod template\", \"Adding a label to the Deployment's own metadata\", \"Changing \u003ccode>revisionHistoryLimit\u003c/code>\"], \"answer\": 1, \"explanation\": \"\u003cp>Only changes to \u003ccode>spec.template\u003c/code> create a new ReplicaSet and revision.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"The new image tag doesn't exist and \u003ccode>maxUnavailable: 0\u003c/code>. What happens to traffic?\", \"options\": [\"Outage\", \"Old Pods keep serving; the rollout stalls\", \"Kubernetes rolls back automatically\", \"Half the requests fail\"], \"answer\": 1, \"explanation\": \"\u003cp>Old Pods are only removed when new ones become available. After \u003ccode>progressDeadlineSeconds\u003c/code> the rollout is marked failed; you roll back.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"What does \u003ccode>minReadySeconds: 10\u003c/code> add?\", \"options\": [\"Pods start 10 seconds later\", \"A new Pod must stay Ready for 10 seconds before it counts as available\", \"Probes run every 10 seconds\", \"Rollouts time out after 10 seconds\"], \"answer\": 1, \"explanation\": \"\u003cp>It catches Pods that pass a readiness check once and then crash.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"Why is a Deployment's \u003ccode>spec.selector\u003c/code> immutable?\", \"options\": [\"For performance\", \"Changing it would orphan the existing Pods and ReplicaSets\", \"etcd can't update it\", \"Selectors are cached forever\"], \"answer\": 1, \"explanation\": \"\u003cp>The selector is how the Deployment finds its children. Create a new Deployment to change it.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"What does \u003ccode>kubectl rollout undo\u003c/code> actually do?\", \"options\": [\"Deletes the Deployment\", \"Copies the previous ReplicaSet's template back, as a new revision\", \"Restores an etcd backup\", \"Scales the Deployment to zero\"], \"answer\": 1, \"explanation\": \"\u003cp>A rollback is a normal rollout with an old template, so it gets a new revision number.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"When is \u003ccode>strategy: Recreate\u003c/code> the right choice?\", \"options\": [\"Always: it's faster\", \"When two versions must never run at the same time\", \"For stateless web apps\", \"To save memory\"], \"answer\": 1, \"explanation\": \"\u003cp>Recreate has downtime by design. Use it only when overlap is unsafe.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"Which controller fits a three-replica database that needs stable names and its own disk per replica?\", \"options\": [\"Deployment\", \"DaemonSet\", \"StatefulSet\", \"Job\"], \"answer\": 2, \"explanation\": \"\u003cp>StatefulSets give ordinal names, stable DNS, and a volume per replica.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"You need a log agent on every node, including nodes added later. Which controller?\", \"options\": [\"Deployment with replicas = node count\", \"DaemonSet\", \"CronJob\", \"StatefulSet\"], \"answer\": 1, \"explanation\": \"\u003cp>A DaemonSet runs one Pod per matching node and adds one automatically when a node joins.\u003c/p>\"},\n  {\"type\": \"multi\", \"prompt\": \"Which \u003ccode>restartPolicy\u003c/code> values can a Job's Pod template use?\", \"options\": [\"Always\", \"OnFailure\", \"Never\"], \"answer\": [1, 2], \"explanation\": \"\u003cp>A Job must be able to finish, so \u003ccode>Always\u003c/code> is rejected.\u003c/p>\"},\n  {\"type\": \"single\", \"prompt\": \"A nightly CronJob sometimes runs longer than a day and two copies overlap. What fixes it?\", \"options\": [\"\u003ccode>backoffLimit: 0\u003c/code>\", \"\u003ccode>concurrencyPolicy: Forbid\u003c/code>\", \"\u003ccode>restartPolicy: Never\u003c/code>\", \"\u003ccode>suspend: true\u003c/code>\"], \"answer\": 1, \"explanation\": \"\u003cp>Forbid skips a run while the previous one is still active. \u003ccode>Replace\u003c/code> would kill the old one instead.\u003c/p>\"},\n  {\"type\": \"text\", \"prompt\": \"Which annotation does \u003ccode>kubectl rollout history\u003c/code> show in its CHANGE-CAUSE column?\", \"answer\": [\"kubernetes.io/change-cause\"], \"explanation\": \"\u003cp>Set it with \u003ccode>kubectl annotate deploy/NAME kubernetes.io/change-cause=\\\"...\\\" --overwrite\u003c/code> or in the manifest.\u003c/p>\"}\n]}\n\u003c/script>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"recap\">\n    \u003ch2>Recap\u003c/h2>\n    \u003cul>\n      \u003cli>Deployments manage ReplicaSets (one per template version), which manage Pods. Selectors tie them together\n        and must match the template's labels, without overlapping other controllers.\u003c/li>\n      \u003cli>Rolling updates keep total ≤ replicas + maxSurge (rounded up) and ready ≥ replicas − maxUnavailable\n        (rounded down).\u003c/li>\n      \u003cli>\u003ccode>minReadySeconds\u003c/code> and \u003ccode>progressDeadlineSeconds\u003c/code> make rollouts honest; rollbacks are\n        new revisions made from old templates.\u003c/li>\n      \u003cli>Pick by need: Deployment (stateless), StatefulSet (identity and disks), DaemonSet (per node), Job (finish),\n        CronJob (schedule).\u003c/li>\n      \u003cli>Jobs need \u003ccode>OnFailure\u003c/code> or \u003ccode>Never\u003c/code>; CronJobs want a time zone, a concurrency policy,\n        deadlines, and history limits.\u003c/li>\n    \u003c/ul>\n    \u003cdiv class=\"flashcards\" data-title=\"Deployments and workloads\">\n      \u003cscript type=\"application/json\">\n      [{\"front\": \"Deployment → ? → Pods\", \"back\": \"ReplicaSets: one per Pod template version.\"},\n       {\"front\": \"What starts a rollout?\", \"back\": \"Any change to spec.template. Scaling doesn't.\"},\n       {\"front\": \"maxSurge rounding / maxUnavailable rounding\", \"back\": \"Surge rounds up; unavailable rounds down.\"},\n       {\"front\": \"Default rollout bounds\", \"back\": \"25% surge, 25% unavailable.\"},\n       {\"front\": \"minReadySeconds\", \"back\": \"How long a new Pod must stay Ready before it counts as available.\"},\n       {\"front\": \"progressDeadlineSeconds\", \"back\": \"Marks a stuck rollout as failed (ProgressDeadlineExceeded). It doesn't roll back.\"},\n       {\"front\": \"rollout undo\", \"back\": \"Re-applies an old ReplicaSet's template as a new revision.\"},\n       {\"front\": \"Recreate strategy\", \"back\": \"Kill all old Pods, then start new ones. Downtime by design.\"},\n       {\"front\": \"StatefulSet vs Deployment\", \"back\": \"Stable names, stable DNS, a volume per replica, ordered rollout.\"},\n       {\"front\": \"concurrencyPolicy: Forbid\", \"back\": \"Skip a CronJob run while the previous Job is still active.\"},\n       {\"front\": \"Overlapping selectors\", \"back\": \"Two controllers selecting the same Pods fight. Add a distinguishing label.\"}]\n      \u003c/script>\n    \u003c/div>\n    \u003ch3>Going further\u003c/h3>\n    \u003cul>\n      \u003cli>\u003ca href=\"https://kubernetes.io/docs/concepts/workloads/controllers/deployment/\">Kubernetes: Deployments\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/\">Labels and selectors\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"https://kubernetes.io/docs/concepts/workloads/controllers/job/\">Jobs\u003c/a> and \u003ca href=\"https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/\">CronJobs\u003c/a>\u003c/li>\n      \u003cli>Next: \u003ca href=\"../reference/roadmap.html\">the roadmap\u003c/a>, where Stage 2 picks up with Services and Gateway API\u003c/li>\n    \u003c/ul>\n  \u003c/section>","exercises":["m03-e1","m03-e2","m03-e3","m03-e4","m03-e5"],"quizzes":["m03-quiz"],"checklists":{"m03-lab1":6}},"reference/roadmap.html":{"id":"ref-roadmap","kind":"reference","title":"Roadmap · Kubernetes Practicum","html":"\u003cheader class=\"lesson-hero\">\n    \u003cp class=\"eyebrow\">Reference · Roadmap\u003c/p>\n    \u003ch1>Roadmap\u003c/h1>\n    \u003cp class=\"lede\">The practicum goes from your first Pod to a platform deployed entirely from Git. Stage 1 is\n      available now. Each later stage arrives as its own release, with the same mix of lessons, graded exercises,\n      labs without solutions, and quizzes.\u003c/p>\n  \u003c/header>\n\n  \u003csection class=\"lesson-section\" id=\"stage-1\">\n    \u003ch2>Stage 1 · Foundations (available)\u003c/h2>\n    \u003cul>\n      \u003cli>\u003ca href=\"../modules/m00-mac-lab.html\">M00 Your Mac Lab\u003c/a>: Colima, kind, Docker vs containerd, the primer cluster\u003c/li>\n      \u003cli>\u003ca href=\"../modules/m01-how-kubernetes-thinks.html\">M01 How Kubernetes Thinks\u003c/a>: architecture, objects, reconciliation, kubectl\u003c/li>\n      \u003cli>\u003ca href=\"../modules/m02-pods.html\">M02 Pods\u003c/a>: lifecycle, probes, resources and QoS, sidecars, security, debugging\u003c/li>\n      \u003cli>\u003ca href=\"../modules/m03-deployments-and-workloads.html\">M03 Deployments and Workloads\u003c/a>: selectors, rollouts, rollbacks, Jobs and CronJobs\u003c/li>\n    \u003c/ul>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"stage-2\">\n    \u003ch2>Stage 2 · Networking and state (next)\u003c/h2>\n    \u003cul>\n      \u003cli>M04 Services, DNS, and cluster networking: ClusterIP, NodePort, headless Services, EndpointSlices, kube-proxy\u003c/li>\n      \u003cli>M05 Gateway API with Traefik: GatewayClass, Gateway, HTTPRoute, weighted canaries, reading old Ingress objects\n        (the community Ingress NGINX controller was retired in March 2026)\u003c/li>\n      \u003cli>M06 ConfigMaps and Secrets: env vs files, live reload, what base64 doesn't protect, Sealed Secrets\u003c/li>\n      \u003cli>M07 Storage: PersistentVolumes, claims, StorageClasses, StatefulSets with PostgreSQL\u003c/li>\n    \u003c/ul>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"stage-3\">\n    \u003ch2>Stage 3 · Packaging and scaling\u003c/h2>\n    \u003cul>\n      \u003cli>M08 Helm 4: charts, templates, values, releases, umbrella charts, OCI registries\u003c/li>\n      \u003cli>M09 Resources and autoscaling: metrics-server, HPA behaviour, VPA, KEDA\u003c/li>\n      \u003cli>M10 Scheduling and clusters: affinity, taints, topology spread, PodDisruptionBudgets, quotas, contexts\u003c/li>\n    \u003c/ul>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"stage-4\">\n    \u003ch2>Stage 4 · Production\u003c/h2>\n    \u003cul>\n      \u003cli>M11 Security: RBAC, Pod Security Admission, NetworkPolicies\u003c/li>\n      \u003cli>M12 Observability and troubleshooting: Prometheus, Grafana, ServiceMonitors, the debugging tree\u003c/li>\n      \u003cli>M13 GitOps with Argo CD: Applications, sync policies, app-of-apps, sync waves, ApplicationSets, drift\u003c/li>\n    \u003c/ul>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"capstone\">\n    \u003ch2>Capstone · A GitOps-run notes platform\u003c/h2>\n    \u003cp>A web frontend, a FastAPI service, PostgreSQL, and Redis, packaged as an umbrella Helm chart, exposed through\n      Gateway API, with autoscaling, NetworkPolicies, and Prometheus metrics. Argo CD deploys every component,\n      platform and app, from your own Git repository, so a commit is a deploy. Graded with offline chart checks and\n      optional live checks on the primer cluster.\u003c/p>\n  \u003c/section>","exercises":[],"quizzes":[],"checklists":{}},"reference/kubelab.html":{"id":"ref-kubelab","kind":"reference","title":"kubelab Reference · Kubernetes Practicum","html":"\u003cheader class=\"lesson-hero\">\n    \u003cp class=\"eyebrow\">Reference · Library\u003c/p>\n    \u003ch1>kubelab Reference\u003c/h1>\n    \u003cp class=\"lede\">kubelab is the small helper library that lesson cells, exercises, and lab checks use. The same\n      code runs in your browser and on your Mac (\u003ccode>pixi run python\u003c/code>). It reads manifests and reasons about\n      them; it never talks to a cluster.\u003c/p>\n  \u003c/header>\n\n  \u003csection class=\"lesson-section\" id=\"manifests\">\n    \u003ch2>Manifests\u003c/h2>\n    \u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Function\u003c/th>\u003cth>Returns\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n      \u003ctr>\u003ctd>\u003ccode>load_manifests(text)\u003c/code>\u003c/td>\u003ctd>A list of dicts, one per non-empty YAML document. Raises \u003ccode>ManifestError\u003c/code> for bad YAML\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003ccode>load_files(paths)\u003c/code>\u003c/td>\u003ctd>Every manifest in the files, or in \u003ccode>*.yaml\u003c/code>/\u003ccode>*.yml\u003c/code> under directories\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003ccode>find(manifests, kind, name=None)\u003c/code>\u003c/td>\u003ctd>Manifests of one kind, optionally one name\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003ccode>dig(obj, \"spec.template.spec.containers.0.image\", default=None)\u003c/code>\u003c/td>\u003ctd>A nested value by dotted path (numbers index lists)\u003c/td>\u003c/tr>\n    \u003c/tbody>\u003c/table>\u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"quantities\">\n    \u003ch2>Quantities\u003c/h2>\n    \u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Function\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n      \u003ctr>\u003ctd>\u003ccode>parse_cpu(q)\u003c/code>\u003c/td>\u003ctd>\u003ccode>\"250m\"\u003c/code> → 0.25 cores\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003ccode>parse_memory(q)\u003c/code>\u003c/td>\u003ctd>\u003ccode>\"128Mi\"\u003c/code> → 134217728 bytes; \u003ccode>\"1G\"\u003c/code> → 1000000000\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003ccode>parse_quantity(q)\u003c/code>\u003c/td>\u003ctd>Any quantity as a float in base units. Raises \u003ccode>QuantityError\u003c/code>\u003c/td>\u003c/tr>\n    \u003c/tbody>\u003c/table>\u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"selectors\">\n    \u003ch2>Selectors\u003c/h2>\n    \u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Function\u003c/th>\u003cth>Returns\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n      \u003ctr>\u003ctd>\u003ccode>selector_matches(selector, labels)\u003c/code>\u003c/td>\u003ctd>Whether a Service-style mapping, or \u003ccode>matchLabels\u003c/code> plus \u003ccode>matchExpressions\u003c/code> (In, NotIn, Exists, DoesNotExist), selects the labels\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003ccode>select(selector, objects)\u003c/code>\u003c/td>\u003ctd>The objects whose \u003ccode>metadata.labels\u003c/code> match\u003c/td>\u003c/tr>\n    \u003c/tbody>\u003c/table>\u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"validation\">\n    \u003ch2>Validation and lint\u003c/h2>\n    \u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Function\u003c/th>\u003cth>Returns\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n      \u003ctr>\u003ctd>\u003ccode>check_object(obj)\u003c/code>\u003c/td>\u003ctd>Problems the API server would reject: identity, names, labels, Pod specs, workload selectors and strategies, Job and CronJob rules, Services\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003ccode>check_pod_spec(spec, where=\"spec\")\u003c/code>\u003c/td>\u003ctd>Container names, images, ports, probe ports, resources (request ≤ limit)\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003ccode>warnings(obj)\u003c/code>\u003c/td>\u003ctd>Best-practice gaps: unpinned images, missing requests or memory limit, missing probes, restricted security settings, host namespaces, bare Pods\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003ccode>is_dns_label(name)\u003c/code>, \u003ccode>is_dns_subdomain(name)\u003c/code>, \u003ccode>label_problems(labels, where)\u003c/code>\u003c/td>\u003ctd>Name and label syntax\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003ccode>pod_spec_of(obj)\u003c/code>, \u003ccode>pod_containers(obj)\u003c/code>\u003c/td>\u003ctd>The Pod spec inside any workload, and its containers\u003c/td>\u003c/tr>\n    \u003c/tbody>\u003c/table>\u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"workloads\">\n    \u003ch2>Workloads\u003c/h2>\n    \u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Function\u003c/th>\u003cth>Returns\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n      \u003ctr>\u003ctd>\u003ccode>qos_class(pod_spec)\u003c/code>\u003c/td>\u003ctd>\u003ccode>\"Guaranteed\"\u003c/code>, \u003ccode>\"Burstable\"\u003c/code>, or \u003ccode>\"BestEffort\"\u003c/code>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003ccode>rollout_bounds(replicas, max_surge=\"25%\", max_unavailable=\"25%\")\u003c/code>\u003c/td>\u003ctd>\u003ccode>(max_pods, min_available)\u003c/code>; raises \u003ccode>ValueError\u003c/code> if both resolve to 0\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003ccode>pod_issue(pod)\u003c/code>\u003c/td>\u003ctd>A \u003ccode>PodIssue(reason, container, hint)\u003c/code> from the Pod's status, or \u003ccode>None\u003c/code> when it's running and ready\u003c/td>\u003c/tr>\n    \u003c/tbody>\u003c/table>\u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"kind\">\n    \u003ch2>kind configs\u003c/h2>\n    \u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Function\u003c/th>\u003cth>Returns\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n      \u003ctr>\u003ctd>\u003ccode>check_kind_config(config)\u003c/code>\u003c/td>\u003ctd>Problems with kind, apiVersion, name, roles, and port mappings\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003ccode>node_roles(config)\u003c/code>\u003c/td>\u003ctd>Each node's role; no nodes list means one control plane\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003ccode>port_mappings(config)\u003c/code>\u003c/td>\u003ctd>\u003ccode>PortMapping(role, container_port, host_port, protocol)\u003c/code> entries\u003c/td>\u003c/tr>\n    \u003c/tbody>\u003c/table>\u003c/div>\n    \u003cdiv class=\"runnable\" data-title=\"Try any helper\">\n\u003ctextarea>\nimport kubelab\nhelp(kubelab.rollout_bounds)\n\u003c/textarea>\n    \u003c/div>\n  \u003c/section>","exercises":[],"quizzes":[],"checklists":{}},"reference/cheatsheet.html":{"id":"ref-cheatsheet","kind":"reference","title":"kubectl and kind Cheat Sheet · Kubernetes Practicum","html":"\u003cheader class=\"lesson-hero\">\n    \u003cp class=\"eyebrow\">Reference · Cheat sheet\u003c/p>\n    \u003ch1>kubectl and kind Cheat Sheet\u003c/h1>\n    \u003cp class=\"lede\">The commands, fields, and Pod states from Stage 1 on one page.\u003c/p>\n  \u003c/header>\n\n  \u003csection class=\"lesson-section\" id=\"lab\">\n    \u003ch2>Your lab\u003c/h2>\n    \u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Task\u003c/th>\u003cth>Command\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n      \u003ctr>\u003ctd>Start or stop the VM\u003c/td>\u003ctd>\u003ccode>colima start --cpu 4 --memory 8 --disk 60 --vm-type vz\u003c/code> · \u003ccode>colima stop\u003c/code>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>Create or delete the cluster\u003c/td>\u003ctd>\u003ccode>kind create cluster --config kind-primer.yaml\u003c/code> · \u003ccode>kind delete cluster --name primer\u003c/code>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>Load a local image into every node\u003c/td>\u003ctd>\u003ccode>kind load docker-image NAME:TAG --name primer\u003c/code>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>containerd inside a node\u003c/td>\u003ctd>\u003ccode>docker exec -it primer-worker crictl ps\u003c/code> · \u003ccode>crictl images\u003c/code>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>Fix inotify limits\u003c/td>\u003ctd>\u003ccode>colima ssh -- sudo sysctl -w fs.inotify.max_user_watches=524288 fs.inotify.max_user_instances=512\u003c/code>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>Labs\u003c/td>\u003ctd>\u003ccode>pixi run labs\u003c/code> · \u003ccode>pixi run start ID\u003c/code> · \u003ccode>pixi run grade ID\u003c/code> · \u003ccode>pixi run grade-live ID\u003c/code>\u003c/td>\u003c/tr>\n    \u003c/tbody>\u003c/table>\u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"kubectl\">\n    \u003ch2>kubectl\u003c/h2>\n    \u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Task\u003c/th>\u003cth>Command\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n      \u003ctr>\u003ctd>Which cluster am I on?\u003c/td>\u003ctd>\u003ccode>kubectl config current-context\u003c/code> · \u003ccode>kubectl config use-context kind-primer\u003c/code>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>Everything, everywhere\u003c/td>\u003ctd>\u003ccode>kubectl get all -A\u003c/code> · \u003ccode>kubectl get pods -A -o wide\u003c/code>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>The whole object / one field\u003c/td>\u003ctd>\u003ccode>kubectl get deploy web -o yaml\u003c/code> · \u003ccode>-o jsonpath='{.status.readyReplicas}'\u003c/code>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>Watch\u003c/td>\u003ctd>\u003ccode>kubectl get pods -w\u003c/code>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>Why is it like this?\u003c/td>\u003ctd>\u003ccode>kubectl describe pod POD\u003c/code> · \u003ccode>kubectl get events --sort-by=.lastTimestamp\u003c/code>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>Apply declaratively\u003c/td>\u003ctd>\u003ccode>kubectl diff -f app.yaml\u003c/code> · \u003ccode>kubectl apply -f app.yaml\u003c/code> · \u003ccode>kubectl delete -f app.yaml\u003c/code>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>Logs\u003c/td>\u003ctd>\u003ccode>kubectl logs -f POD\u003c/code> · \u003ccode>--previous\u003c/code> · \u003ccode>-c CONTAINER\u003c/code>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>Get inside\u003c/td>\u003ctd>\u003ccode>kubectl exec -it POD -- sh\u003c/code> · \u003ccode>kubectl debug -it POD --image=busybox:1.36 --target=C\u003c/code>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>Reach a Pod from your Mac\u003c/td>\u003ctd>\u003ccode>kubectl port-forward pod/POD 9898:9898\u003c/code>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>Throwaway client\u003c/td>\u003ctd>\u003ccode>kubectl run tmp --rm -it --image=busybox:1.36 --restart=Never -- sh\u003c/code>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>Schema docs\u003c/td>\u003ctd>\u003ccode>kubectl explain deployment.spec.strategy\u003c/code> · \u003ccode>kubectl api-resources\u003c/code>\u003c/td>\u003c/tr>\n    \u003c/tbody>\u003c/table>\u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"rollouts\">\n    \u003ch2>Rollouts\u003c/h2>\n    \u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Task\u003c/th>\u003cth>Command\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n      \u003ctr>\u003ctd>New image\u003c/td>\u003ctd>\u003ccode>kubectl set image deploy/web app=IMAGE:TAG\u003c/code>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>Progress\u003c/td>\u003ctd>\u003ccode>kubectl rollout status deploy/web\u003c/code>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>History and undo\u003c/td>\u003ctd>\u003ccode>kubectl rollout history deploy/web\u003c/code> · \u003ccode>kubectl rollout undo deploy/web [--to-revision=N]\u003c/code>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>Pause, resume, restart\u003c/td>\u003ctd>\u003ccode>kubectl rollout pause|resume|restart deploy/web\u003c/code>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>Scale\u003c/td>\u003ctd>\u003ccode>kubectl scale deploy/web --replicas=6\u003c/code>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>Run a CronJob now\u003c/td>\u003ctd>\u003ccode>kubectl create job once --from=cronjob/NAME\u003c/code>\u003c/td>\u003c/tr>\n    \u003c/tbody>\u003c/table>\u003c/div>\n    \u003cp>Bounds: total ≤ replicas + maxSurge (percent rounds up); ready ≥ replicas − maxUnavailable (percent rounds down).\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"states\">\n    \u003ch2>Pod states and what to run\u003c/h2>\n    \u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>You see\u003c/th>\u003cth>Usually\u003c/th>\u003cth>Run\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n      \u003ctr>\u003ctd>\u003ccode>Pending\u003c/code>\u003c/td>\u003ctd>Doesn't fit any node, a taint, or an unbound volume\u003c/td>\u003ctd>\u003ccode>kubectl describe pod\u003c/code> → FailedScheduling\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003ccode>ErrImagePull\u003c/code> / \u003ccode>ImagePullBackOff\u003c/code>\u003c/td>\u003ctd>Wrong name or tag, registry access, or image not loaded into kind\u003c/td>\u003ctd>\u003ccode>describe\u003c/code>; \u003ccode>kind load docker-image\u003c/code>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003ccode>CreateContainerConfigError\u003c/code>\u003c/td>\u003ctd>Missing Secret, ConfigMap, or key; non-numeric USER with runAsNonRoot\u003c/td>\u003ctd>\u003ccode>describe\u003c/code>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003ccode>CrashLoopBackOff\u003c/code>\u003c/td>\u003ctd>The process keeps exiting\u003c/td>\u003ctd>\u003ccode>kubectl logs POD --previous\u003c/code>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003ccode>OOMKilled\u003c/code> (exit 137)\u003c/td>\u003ctd>Over the memory limit\u003c/td>\u003ctd>\u003ccode>kubectl get pod -o yaml\u003c/code> → lastState\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>Running, \u003ccode>0/1\u003c/code> ready\u003c/td>\u003ctd>Readiness probe failing\u003c/td>\u003ctd>\u003ccode>describe\u003c/code> → Readiness probe failed\u003c/td>\u003c/tr>\n    \u003c/tbody>\u003c/table>\u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"lesson-section\" id=\"pod-fields\">\n    \u003ch2>Pod fields worth memorising\u003c/h2>\n    \u003cpre>\u003ccode class=\"language-yaml\">spec:\n  securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}\n  containers:\n    - name: app\n      image: repo/app:1.2.3                  # pinned tag\n      ports: [{containerPort: 8080, name: http}]\n      startupProbe:   {httpGet: {path: /healthz, port: http}, failureThreshold: 30, periodSeconds: 2}\n      readinessProbe: {httpGet: {path: /readyz,  port: http}}\n      livenessProbe:  {httpGet: {path: /healthz, port: http}}\n      resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 128Mi}}\n      securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}\u003c/code>\u003c/pre>\n  \u003c/section>","exercises":[],"quizzes":[],"checklists":{}},"reference/glossary.html":{"id":"ref-glossary","kind":"reference","title":"Glossary · Kubernetes Practicum","html":"\u003cheader class=\"lesson-hero\">\n    \u003cp class=\"eyebrow\">Reference · Vocabulary\u003c/p>\n    \u003ch1>Glossary\u003c/h1>\n    \u003cp class=\"lede\">Terms used in Stage 1, with a link to where each is taught.\u003c/p>\n  \u003c/header>\n  \u003csection class=\"lesson-section\" id=\"terms\">\n    \u003ch2>Terms\u003c/h2>\n    \u003cdl>\n      \u003cdt id=\"term-api-server\">API server\u003c/dt>\u003cdd>The cluster's front door: authenticates, authorises, validates, and stores every object, and serves watches. The only component that talks to etcd. \u003ca href=\"../modules/m01-how-kubernetes-thinks.html#architecture\">M01\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-container-runtime\">Container runtime\u003c/dt>\u003cdd>Software that pulls images and runs containers; containerd inside kind nodes. The kubelet talks to it over CRI. \u003ca href=\"../modules/m00-mac-lab.html#runtimes\">M00\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-context\">Context\u003c/dt>\u003cdd>A named cluster, user, and default namespace in your kubeconfig. kubectl always uses the current one. \u003ca href=\"../modules/m00-mac-lab.html#create\">M00\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-controller\">Controller\u003c/dt>\u003cdd>A loop that observes desired and actual state for one kind of object, and acts to close the gap. \u003ca href=\"../modules/m01-how-kubernetes-thinks.html#controllers\">M01\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-cri\">CRI\u003c/dt>\u003cdd>Container Runtime Interface: the gRPC API between the kubelet and a runtime. \u003ca href=\"../modules/m00-mac-lab.html#runtimes\">M00\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-crashloopbackoff\">CrashLoopBackOff\u003c/dt>\u003cdd>A container keeps exiting and the kubelet is waiting, with growing delays, before restarting it. A symptom, not a cause. \u003ca href=\"../modules/m02-pods.html#lifecycle\">M02\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-cronjob\">CronJob\u003c/dt>\u003cdd>Creates Jobs on a schedule. \u003ca href=\"../modules/m03-deployments-and-workloads.html#jobs\">M03\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-daemonset\">DaemonSet\u003c/dt>\u003cdd>Runs one Pod on every matching node. \u003ca href=\"../modules/m03-deployments-and-workloads.html#other-controllers\">M03\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-deployment\">Deployment\u003c/dt>\u003cdd>Manages ReplicaSets to run stateless replicas and roll between versions. \u003ca href=\"../modules/m03-deployments-and-workloads.html#deployment\">M03\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-etcd\">etcd\u003c/dt>\u003cdd>The consistent key-value store holding all cluster state. \u003ca href=\"../modules/m01-how-kubernetes-thinks.html#architecture\">M01\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-init-container\">Init container\u003c/dt>\u003cdd>Runs to completion before the app containers start. With \u003ccode>restartPolicy: Always\u003c/code> it becomes a native sidecar. \u003ca href=\"../modules/m02-pods.html#multi-container\">M02\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-job\">Job\u003c/dt>\u003cdd>Runs Pods until a number of them succeed, with retries and deadlines. \u003ca href=\"../modules/m03-deployments-and-workloads.html#jobs\">M03\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-kind\">kind\u003c/dt>\u003cdd>Kubernetes IN Docker: a tool that runs each cluster node as a container. \u003ca href=\"../modules/m00-mac-lab.html#kind-config\">M00\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-kubelet\">kubelet\u003c/dt>\u003cdd>The node agent: runs the Pods assigned to its node and reports their status. \u003ca href=\"../modules/m01-how-kubernetes-thinks.html#architecture\">M01\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-label\">Label and selector\u003c/dt>\u003cdd>Key/value pairs on objects, and queries over them. Controllers and Services find Pods by selector. \u003ca href=\"../modules/m03-deployments-and-workloads.html#selectors\">M03\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-level-triggered\">Level-triggered\u003c/dt>\u003cdd>Acting on current state rather than on individual events, so missed events don't matter. \u003ca href=\"../modules/m01-how-kubernetes-thinks.html#controllers\">M01\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-oomkilled\">OOMKilled\u003c/dt>\u003cdd>A container went over its memory limit and the kernel killed it (exit code 137). \u003ca href=\"../modules/m02-pods.html#resources\">M02\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-pod\">Pod\u003c/dt>\u003cdd>One or more containers scheduled together, sharing an IP and volumes. \u003ca href=\"../modules/m02-pods.html#anatomy\">M02\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-probe\">Probe\u003c/dt>\u003cdd>A health check: startup (has it booted?), readiness (may it get traffic?), liveness (is it wedged?). \u003ca href=\"../modules/m02-pods.html#probes\">M02\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-qos\">QoS class\u003c/dt>\u003cdd>Guaranteed, Burstable, or BestEffort, derived from requests and limits; decides eviction order. \u003ca href=\"../modules/m02-pods.html#resources\">M02\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-reconcile\">Reconcile loop\u003c/dt>\u003cdd>Observe, diff, act, repeat. \u003ca href=\"../modules/m01-how-kubernetes-thinks.html#controllers\">M01\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-replicaset\">ReplicaSet\u003c/dt>\u003cdd>Keeps a number of identical Pods running. Managed by a Deployment. \u003ca href=\"../modules/m03-deployments-and-workloads.html#why\">M03\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-request-limit\">Request and limit\u003c/dt>\u003cdd>A request reserves capacity for scheduling; a limit caps usage at runtime. \u003ca href=\"../modules/m02-pods.html#resources\">M02\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-rolling-update\">Rolling update\u003c/dt>\u003cdd>Replacing Pods gradually, bounded by maxSurge and maxUnavailable. \u003ca href=\"../modules/m03-deployments-and-workloads.html#rolling\">M03\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-scheduler\">Scheduler\u003c/dt>\u003cdd>Assigns each unscheduled Pod to a node by filtering and scoring. \u003ca href=\"../modules/m01-how-kubernetes-thinks.html#journey\">M01\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-sidecar\">Native sidecar\u003c/dt>\u003cdd>An init container with \u003ccode>restartPolicy: Always\u003c/code> that runs alongside the app. \u003ca href=\"../modules/m02-pods.html#multi-container\">M02\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-spec-status\">spec and status\u003c/dt>\u003cdd>Desired state (written by you) and observed state (written by the system). \u003ca href=\"../modules/m01-how-kubernetes-thinks.html#objects\">M01\u003c/a>\u003c/dd>\n      \u003cdt id=\"term-statefulset\">StatefulSet\u003c/dt>\u003cdd>Runs replicas with stable names, stable DNS, and a volume each. \u003ca href=\"../modules/m03-deployments-and-workloads.html#other-controllers\">M03\u003c/a>\u003c/dd>\n    \u003c/dl>\n  \u003c/section>","exercises":[],"quizzes":[],"checklists":{}}},"version":"0.1.0","siteUrl":"https://millsks.github.io/kubernetes-practicum/","repoUrl":"https://github.com/millsks/kubernetes-practicum"}</script>

<script>
/* Visualizer core: registry, widget shell, SVG helpers, and a frame player. Visualizers live in viz-*.js. */
(() => {
  "use strict";
  const registry = new Map();
  const SVG_NS = "http://www.w3.org/2000/svg";

  function h(tag, attrs = {}, ...children) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "html") el.innerHTML = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const c of children.flat()) {
      if (c === null || c === undefined || c === false) continue;
      el.append(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return el;
  }

  function s(tag, attrs = {}, ...children) {
    const el = document.createElementNS(SVG_NS, tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "text") el.textContent = v;
      else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v);
    }
    for (const c of children.flat()) if (c) el.append(c);
    return el;
  }

  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const randInt = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
  const shuffle = (arr) => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const parseList = (text, numeric = true) => String(text).split(/[\s,]+/).filter(Boolean).map((x) => (numeric ? Number(x) : x)).filter((x) => !numeric || Number.isFinite(x));

  /**
   * Build the standard widget chrome.
   * Returns { root, head, stage, controls, log, legend, setLog(text), setLegend([[label, color]]) }.
   */
  function shell(el, { title = "", kind = "Visualizer" } = {}) {
    el.innerHTML = "";
    el.classList.add("widget");
    const head = h("div", { class: "widget-head" }, h("span", { class: "w-kind", text: kind }), h("span", { class: "w-title", text: title }), h("span", { class: "spacer" }));
    const stage = h("div", { class: "viz-stage" });
    const legend = h("div", { class: "viz-legend" });
    const controls = h("div", { class: "viz-controls" });
    const log = h("div", { class: "viz-log", "aria-live": "polite" });
    el.append(head, stage, legend, controls, log);
    return {
      root: el, head, stage, controls, log, legend,
      setLog(text) { log.innerHTML = text; },
      setLegend(items) { legend.innerHTML = items.map(([label, color]) => `<span><i style="background:${color}"></i>${esc(label)}</span>`).join(""); },
    };
  }

  function button(label, onClick, cls = "btn small") { return h("button", { class: cls, type: "button", text: label, onclick: onClick }); }
  function input(attrs = {}) { return h("input", { type: "text", ...attrs }); }
  function select(options, value, onChange) {
    const el = h("select", {}, options.map(([v, label]) => h("option", { value: v, text: label ?? v })));
    el.value = value;
    el.addEventListener("change", () => onChange(el.value));
    return el;
  }
  function label(text, control) { return h("label", { style: "display:inline-flex;gap:6px;align-items:center" }, text, control); }

  /**
   * Frame player. `frames` is an array of snapshots; `render(frame, index)` draws one.
   * Adds ⏮ ◀ ▶(play) ▶| controls and a speed slider into `controls`. Returns { load(frames), go(i), index(), stop() }.
   */
  function player(controls, render, { speed = 500 } = {}) {
    let frames = [];
    let i = 0;
    let timer = null;
    let delay = speed;
    const counter = h("span", { class: "status" });
    const playBtn = button("Play ▶", () => toggle(), "btn small primary");
    const update = () => {
      if (!frames.length) { counter.textContent = ""; return; }
      render(frames[i], i);
      counter.textContent = `step ${i + 1}/${frames.length}`;
    };
    const go = (n) => { i = Math.max(0, Math.min(frames.length - 1, n)); update(); };
    const stop = () => { if (timer) { clearInterval(timer); timer = null; } playBtn.textContent = "Play ▶"; };
    const toggle = () => {
      if (timer) { stop(); return; }
      if (i >= frames.length - 1) i = 0;
      playBtn.textContent = "Pause ❚❚";
      timer = setInterval(() => { if (i >= frames.length - 1) stop(); else go(i + 1); }, delay);
    };
    const speedEl = h("input", { type: "range", min: 1, max: 10, value: 6, "aria-label": "Speed", title: "Speed" });
    speedEl.addEventListener("input", () => { delay = Math.round(1600 / Number(speedEl.value) ** 1.3); if (timer) { stop(); toggle(); } });
    delay = Math.round(1600 / 6 ** 1.3);
    controls.append(
      button("⏮", () => { stop(); go(0); }),
      button("◀", () => { stop(); go(i - 1); }),
      playBtn,
      button("▶|", () => { stop(); go(i + 1); }),
      label("speed", speedEl),
      counter,
    );
    return { load(f, start = 0) { stop(); frames = f; i = start; update(); }, go, index: () => i, stop, frames: () => frames, toggle };
  }

  /** Draw a simple node-link tree laid out by in-order position. node = { id, label, left, right, cls } or { children: [] }. */
  function layoutBinaryTree(root) {
    const pos = new Map();
    let x = 0;
    let maxDepth = 0;
    const walk = (n, d) => {
      if (!n) return;
      walk(n.left, d + 1);
      pos.set(n, { x: x++, y: d });
      maxDepth = Math.max(maxDepth, d);
      walk(n.right, d + 1);
    };
    walk(root, 0);
    return { pos, width: x, depth: maxDepth + 1 };
  }

  function layoutTree(root, childrenOf = (n) => n.children || []) {
    const pos = new Map();
    let leaf = 0;
    let maxDepth = 0;
    const walk = (n, d) => {
      const kids = childrenOf(n);
      maxDepth = Math.max(maxDepth, d);
      if (!kids.length) { pos.set(n, { x: leaf++, y: d }); return; }
      kids.forEach((k) => walk(k, d + 1));
      const xs = kids.map((k) => pos.get(k).x);
      pos.set(n, { x: (Math.min(...xs) + Math.max(...xs)) / 2, y: d });
    };
    walk(root, 0);
    return { pos, width: Math.max(leaf, 1), depth: maxDepth + 1 };
  }

  function mount(el) {
    const name = el.dataset.viz;
    const factory = registry.get(name);
    if (!factory) { el.textContent = `Unknown visualizer: ${name}`; return; }
    let config = {};
    if (el.dataset.config) {
      try { config = JSON.parse(el.dataset.config); } catch (e) { el.textContent = `Bad data-config for ${name}: ${e.message}`; return; }
    }
    factory(el, config, api);
  }

  const api = { h, s, css, esc, sleep, randInt, shuffle, parseList, shell, button, input, select, label, player, layoutBinaryTree, layoutTree };

  function registerViz(name, factory) { registry.set(name, factory); }

  window.PPViz = { registry, registerViz, mount, api };
  window.registerViz = registerViz;
})();

</script>
<script>
/* Kubernetes visualizers: the reconcile loop of a ReplicaSet, and a Deployment's rolling update step by step. */
(() => {
  "use strict";
  const { registerViz } = window.PPViz;

  /* ---------------- reconcile: desired vs actual, one controller step at a time ---------------- */
  const NODES = ["worker", "worker2"];
  const RECONCILE = [
    { event: "You apply a ReplicaSet with replicas: 3.", desired: 3, change: (p) => p, act: "create" },
    { event: "Nothing changed: actual matches desired, so the controller does nothing.", desired: 3, change: (p) => p, act: "none" },
    { event: "Someone runs kubectl delete pod on one replica.", desired: 3, change: (p) => p.slice(1), act: "create" },
    { event: "You scale up: kubectl scale rs/web --replicas=5.", desired: 5, change: (p) => p, act: "create" },
    { event: "Node 'worker2' dies. Its Pods are gone.", desired: 5, change: (p) => p.filter((x) => x.node !== "worker2"), act: "create", lost: "worker2" },
    { event: "You scale down to 2. The controller deletes the surplus.", desired: 2, change: (p) => p, act: "delete" },
  ];

  registerViz("reconcile", (el, config, api) => {
    const { h, s } = api;
    const ui = api.shell(el, { title: "A ReplicaSet keeps actual = desired", kind: "Reconcile loop" });
    const svg = s("svg", { viewBox: "0 0 640 250", width: "100%", role: "img", "aria-label": "Reconcile loop", style: "max-width:640px;height:auto;font-family:var(--font-sans)" });
    ui.stage.append(svg);
    ui.setLegend([["ready Pod", "var(--accent)"], ["new Pod (just created)", "var(--viz-2)"], ["being deleted", "var(--bad)"]]);

    function frames() {
      const out = [];
      let pods = [];
      let next = 1;
      let lost = null;
      for (const step of RECONCILE) {
        pods = step.change(pods.map((p) => ({ ...p, fresh: false })));
        lost = step.lost || lost;
        const observe = pods.length;
        out.push({ phase: "observe", step, pods: pods.map((p) => ({ ...p })), observe, lost, say: `${step.event} Observe: desired ${step.desired}, actual ${observe}.` });
        const diff = step.desired - pods.length;
        if (diff > 0) {
          const live = NODES.filter((n) => n !== lost);
          for (let i = 0; i < diff; i++) {
            const load = (n) => pods.filter((p) => p.node === n).length;
            const node = live.reduce((best, n) => (load(n) < load(best) ? n : best), live[0]);
            pods.push({ id: `web-${String(next++).padStart(2, "0")}`, node, fresh: true });
          }
          out.push({ phase: "act", step, pods: pods.map((p) => ({ ...p })), observe, lost, say: `Diff = ${diff}. Act: create ${diff} Pod${diff > 1 ? "s" : ""}; the scheduler places ${diff > 1 ? "them" : "it"} on a healthy node.` });
        } else if (diff < 0) {
          const marked = pods.map((p, i) => ({ ...p, dying: i >= step.desired }));
          out.push({ phase: "act", step, pods: marked, observe, lost, say: `Diff = ${diff}. Act: delete ${-diff} Pod${diff < -1 ? "s" : ""}.` });
          pods = pods.slice(0, step.desired);
        } else {
          out.push({ phase: "act", step, pods: pods.map((p) => ({ ...p })), observe, lost, say: "Diff = 0. Act: nothing. A controller that has nothing to do does nothing." });
        }
      }
      return out;
    }

    function render(frame) {
      svg.replaceChildren();
      const box = (x, y, w, hgt, label, sub, active) => [
        s("rect", { x, y, width: w, height: hgt, rx: 8, fill: active ? "var(--accent-soft)" : "var(--bg-elev)", stroke: active ? "var(--accent)" : "var(--border-strong)", "stroke-width": active ? 2.2 : 1.2 }),

      svg.append(...box(10, 86, 170, 56, "controller", frame.phase === "observe" ? "observe → diff" : "act", true));
      svg.append(...box(10, 162, 170, 56, `actual: ${frame.pods.filter((p) => !p.dying).length}`, "Pods that exist", false));
