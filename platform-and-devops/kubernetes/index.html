  });

  /* ---------------- rollout: a Deployment moving from v1 to v2 ---------------- */
  function resolve(value, replicas, up) {
    const t = String(value).trim();
    if (t.endsWith("%")) { const exact = (replicas * parseFloat(t)) / 100; return up ? Math.ceil(exact) : Math.floor(exact); }
    return Math.max(0, parseInt(t, 10) || 0);
  }

  function rolloutFrames(replicas, surgeIn, unavailIn) {
    const surge = resolve(surgeIn, replicas, true);
    const unavail = resolve(unavailIn, replicas, false);
    if (surge === 0 && unavail === 0) return { error: "maxSurge and maxUnavailable can't both be 0: the rollout could never start." };
    const maxTotal = replicas + surge;
    const minReady = Math.max(0, replicas - unavail);
    let oldPods = replicas;
    let newReady = 0;
    let newStarting = 0;
    const frames = [{ oldPods, newReady, newStarting, maxTotal, minReady, say: `Start: ${replicas} × v1 ready. Limits: at most ${maxTotal} Pods, at least ${minReady} ready.` }];
    let guard = 0;
    while ((oldPods > 0 || newStarting > 0 || newReady < replicas) && guard++ < 60) {
      const ready = oldPods + newReady;
      const canKill = Math.min(oldPods, Math.max(0, ready - minReady));
      const total = oldPods + newReady + newStarting - canKill;
      const canStart = Math.max(0, Math.min(maxTotal - total, replicas - newReady - newStarting));
      oldPods -= canKill;
      newStarting += canStart;
      frames.push({ oldPods, newReady, newStarting, killed: canKill, maxTotal, minReady,
        say: `Scale v1 down by ${canKill} and v2 up by ${canStart}. Ready now: ${oldPods + newReady} (never below ${minReady}); total ${oldPods + newReady + newStarting} (never above ${maxTotal}).` });
      if (newStarting) {
        newReady += newStarting;
        frames.push({ oldPods, newReady, newStarting: 0, maxTotal, minReady, say: `${newStarting} v2 Pod${newStarting > 1 ? "s" : ""} pass the readiness probe and start taking traffic.` });
        newStarting = 0;
      }
    }
    frames.push({ oldPods: 0, newReady: replicas, newStarting: 0, maxTotal, minReady, say: `Done: ${replicas} × v2. The old ReplicaSet stays at 0 replicas so you can roll back.` });
    return { frames };
  }

  registerViz("rollout", (el, config, api) => {
    const { h } = api;
    const ui = api.shell(el, { title: "Rolling update from v1 to v2", kind: "Rollout" });
    const rep = h("input", { type: "number", min: 1, max: 12, value: config.replicas ?? 4, style: "width:4.5em" });
    const sur = h("input", { type: "text", value: String(config.maxSurge ?? 1), style: "width:4.5em" });
    const una = h("input", { type: "text", value: String(config.maxUnavailable ?? 0), style: "width:4.5em" });
    const grid = h("div", { style: "display:flex;flex-direction:column;gap:10px" });
    ui.stage.append(grid);
    ui.setLegend([["v1 ready", "var(--fg-muted)"], ["v2 starting", "var(--viz-2)"], ["v2 ready", "var(--accent)"], ["v1 terminating", "var(--bad)"]]);
    const pod = (label, bg, fg, extra = "") => h("span", { style: `display:inline-grid;place-items:center;width:54px;height:36px;border-radius:6px;font:600 0.75rem var(--font-mono);background:${bg};color:${fg};${extra}`, text: label });
    function render(f) {
      const row = (title, pods) => h("div", {}, h("div", { style: "font-size:0.75rem;color:var(--fg-muted);margin-bottom:4px", text: title }), h("div", { style: "display:flex;gap:6px;flex-wrap:wrap;min-height:36px" }, pods));
      const old = [...Array(f.oldPods)].map(() => pod("v1", "var(--bg-sunk)", "var(--fg)", "border:1.5px solid var(--fg-muted)"));
      const killed = [...Array(f.killed || 0)].map(() => pod("v1 ✕", "var(--bad-soft)", "var(--bad)", "border:1.5px dashed var(--bad)"));
      const ready = [...Array(f.newReady)].map(() => pod("v2", "var(--accent)", "var(--accent-fg)"));
      const starting = [...Array(f.newStarting)].map(() => pod("v2…", "var(--bg-elev)", "var(--fg)", "border:1.5px dashed var(--viz-2)"));
      grid.replaceChildren(row("old ReplicaSet (v1)", [...old, ...killed]), row("new ReplicaSet (v2)", [...ready, ...starting]));
      ui.setLog(api.esc(f.say));
    }
    const play = api.player(ui.controls, render, { speed: 900 });
    const reload = () => {
      const result = rolloutFrames(Math.max(1, Math.min(12, Number(rep.value) || 1)), sur.value, una.value);
      if (result.error) { play.load([{ oldPods: 0, newReady: 0, newStarting: 0, say: result.error }]); return; }
      play.load(result.frames);
    };
    [rep, sur, una].forEach((i) => i.addEventListener("change", reload));
    ui.controls.prepend(api.label("replicas", rep), api.label("maxSurge", sur), api.label("maxUnavailable", una));
    reload();
  });
})();

 "kubelab/manifests.py": "\"\"\"Load Kubernetes manifests from YAML text or files into plain dictionaries.\"\"\"\n\nfrom collections.abc import Iterable\nfrom pathlib import Path\nfrom typing import Any\n\nimport yaml\n\nManifest = dict[str, Any]\n\n\nclass ManifestError(ValueError):\n    \"\"\"Raised when text is not valid YAML or a document is not a mapping.\"\"\"\n\n\ndef load_manifests(text: str) -> list[Manifest]:\n    \"\"\"Parse one or more YAML documents (separated by ``---``) into dictionaries.\n\n    Empty documents are skipped, so a trailing ``---`` or a file of comments is harmless.\n\n    Args:\n        text: YAML text.\n\n    Returns:\n        One dictionary per non-empty document, in order.\n\n    Raises:\n        ManifestError: If the YAML is invalid or a document is not a mapping.\n    \"\"\"\n    try:\n        documents = list(yaml.safe_load_all(text))\n    except yaml.YAMLError as exc:\n        raise ManifestError(f\"invalid YAML: {exc}\") from exc\n    manifests: list[Manifest] = []\n    for index, document in enumerate(documents):\n        if document is None:\n            continue\n        if not isinstance(document, dict):\n            raise ManifestError(f\"document {index + 1} is a {type(document).__name__}, not a mapping\")\n        manifests.append(document)\n    return manifests\n\n\ndef load_files(paths: Iterable[Path]) -> list[Manifest]:\n    \"\"\"Load every manifest from the given files (directories are searched for ``*.yaml`` and ``*.yml``).\n\n    Args:\n        paths: Files or directories.\n\n    Returns:\n        Manifests in path order.\n\n    Raises:\n        ManifestError: If a file is invalid; the message names the file.\n    \"\"\"\n    manifests: list[Manifest] = []\n    for path in paths:\n        files = sorted([*path.rglob(\"*.yaml\"), *path.rglob(\"*.yml\")]) if path.is_dir() else [path]\n        for file in files:\n            try:\n                manifests.extend(load_manifests(file.read_text(encoding=\"utf-8\")))\n            except ManifestError as exc:\n                raise ManifestError(f\"{file.name}: {exc}\") from exc\n    return manifests\n\n\ndef find(manifests: Iterable[Manifest], kind: str, name: str | None = None) -> list[Manifest]:\n    \"\"\"Return the manifests of one kind, optionally with one name.\n\n    Args:\n        manifests: Manifests to search.\n        kind: Kind such as ``Deployment`` (case-sensitive, as in YAML).\n        name: ``metadata.name`` to match, or ``None`` for any.\n\n    Returns:\n        Matching manifests in their original order.\n    \"\"\"\n    return [\n        m\n        for m in manifests\n        if m.get(\"kind\") == kind and (name is None or (m.get(\"metadata\") or {}).get(\"name\") == name)\n    ]\n\n\ndef dig(obj: Any, path: str, default: Any = None) -> Any:\n    \"\"\"Read a nested field with a dotted path; numeric parts index lists.\n\n    Args:\n        obj: A manifest or any nested structure of dicts and lists.\n        path: Dotted path such as ``spec.template.spec.containers.0.image``.\n        default: Value returned when any part is missing.\n\n    Returns:\n        The value found, or ``default``.\n    \"\"\"\n    current = obj\n    for part in path.split(\".\"):\n        if isinstance(current, dict) and part in current:\n            current = current[part]\n        elif isinstance(current, list) and part.isdigit() and int(part) < len(current):\n            current = current[int(part)]\n        else:\n            return default\n    return current\n",
 "kubelab/quantity.py": "\"\"\"Parse Kubernetes resource quantities such as ``250m`` CPU and ``128Mi`` memory.\"\"\"\n\nimport re\n\n_QUANTITY = re.compile(r\"^([+-]?(?:\\d+\\.?\\d*|\\.\\d+)(?:[eE][+-]?\\d+)?)([a-zA-Z]*)$\")\n_BINARY = {\"Ki\": 2**10, \"Mi\": 2**20, \"Gi\": 2**30, \"Ti\": 2**40, \"Pi\": 2**50, \"Ei\": 2**60}\n_DECIMAL = {\"\": 1, \"n\": 1e-9, \"u\": 1e-6, \"m\": 1e-3, \"k\": 1e3, \"M\": 1e6, \"G\": 1e9, \"T\": 1e12, \"P\": 1e15, \"E\": 1e18}\n\n\nclass QuantityError(ValueError):\n    \"\"\"Raised for a value that is not a valid Kubernetes quantity.\"\"\"\n\n\ndef parse_quantity(value: str | int | float) -> float:\n    \"\"\"Parse any quantity into a plain number in base units.\n\n    ``1Gi`` (binary suffix) is 1073741824, ``1G`` (decimal) is 1000000000, ``250m`` is 0.25.\n\n    Args:\n        value: A quantity string, or a number (YAML often gives ``cpu: 1`` as an int).\n\n    Returns:\n        The value as a float.\n\n    Raises:\n        QuantityError: If the value is not a valid quantity.\n    \"\"\"\n    if isinstance(value, bool):\n        raise QuantityError(f\"{value!r} is not a quantity\")\n    if isinstance(value, int | float):\n        return float(value)\n    match = _QUANTITY.match(str(value).strip())\n    if not match:\n        raise QuantityError(f\"{value!r} is not a quantity\")\n    number, suffix = float(match.group(1)), match.group(2)\n    if suffix in _BINARY:\n        return number * _BINARY[suffix]\n    if suffix in _DECIMAL:\n        return number * _DECIMAL[suffix]\n    raise QuantityError(f\"{value!r} has an unknown suffix {suffix!r}\")\n\n\ndef parse_cpu(value: str | int | float) -> float:\n    \"\"\"Parse a CPU quantity into cores: ``\"500m\"`` → 0.5, ``2`` → 2.0.\n\n    Args:\n        value: CPU quantity.\n\n    Returns:\n        Cores as a float.\n\n    Raises:\n        QuantityError: If the value is invalid or negative.\n    \"\"\"\n    cores = parse_quantity(value)\n    if cores < 0:\n        raise QuantityError(f\"CPU {value!r} is negative\")\n    return cores\n\n\ndef parse_memory(value: str | int | float) -> int:\n    \"\"\"Parse a memory quantity into bytes: ``\"128Mi\"`` → 134217728, ``\"1G\"`` → 1000000000.\n\n    Args:\n        value: Memory quantity.\n\n    Returns:\n        Bytes as an int (rounded up, as the kubelet does).\n\n    Raises:\n        QuantityError: If the value is invalid or negative.\n    \"\"\"\n    amount = parse_quantity(value)\n    if amount < 0:\n        raise QuantityError(f\"memory {value!r} is negative\")\n    whole = int(amount)\n    return whole if whole == amount else whole + 1\n",
 "kubelab/selectors.py": "\"\"\"Label selectors: the way Services, ReplicaSets, and Deployments choose their Pods.\"\"\"\n\nfrom collections.abc import Mapping\nfrom typing import Any\n\n\nclass SelectorError(ValueError):\n    \"\"\"Raised for a malformed selector.\"\"\"\n\n\ndef selector_matches(selector: Mapping[str, Any] | None, labels: Mapping[str, str] | None) -> bool:\n    \"\"\"Tell whether a label selector selects an object with ``labels``.\n\n    Accepts both forms: a Service-style plain mapping (``{\"app\": \"web\"}``) and a workload-style selector with\n    ``matchLabels`` and/or ``matchExpressions``. Every requirement must hold. An empty selector matches everything,\n    as the API defines it (which is why Deployments forbid one).\n\n    Args:\n        selector: The selector, or ``None`` (treated as empty).\n        labels: The object's labels, or ``None`` (treated as no labels).\n\n    Returns:\n        ``True`` when every requirement is satisfied.\n\n    Raises:\n        SelectorError: For an unknown operator or a malformed expression.\n    \"\"\"\n    selector = dict(selector or {})\n    labels = dict(labels or {})\n    if \"matchLabels\" not in selector and \"matchExpressions\" not in selector:\n        return all(labels.get(k) == str(v) for k, v in selector.items())\n    match_labels = selector.get(\"matchLabels\") or {}\n    if any(labels.get(k) != str(v) for k, v in match_labels.items()):\n        return False\n    return all(_expression_holds(expr, labels) for expr in selector.get(\"matchExpressions\") or [])\n\n\ndef _expression_holds(expr: Mapping[str, Any], labels: Mapping[str, str]) -> bool:\n    try:\n        key, operator = expr[\"key\"], expr[\"operator\"]\n    except (KeyError, TypeError) as exc:\n        raise SelectorError(f\"expression {expr!r} needs key and operator\") from exc\n    values = [str(v) for v in expr.get(\"values\") or []]\n    if operator == \"In\":\n        return key in labels and labels[key] in values\n    if operator == \"NotIn\":\n        return key not in labels or labels[key] not in values\n    if operator == \"Exists\":\n        return key in labels\n    if operator == \"DoesNotExist\":\n        return key not in labels\n    raise SelectorError(f\"unknown operator {operator!r}\")\n\n\ndef select(selector: Mapping[str, Any] | None, objects: list[dict[str, Any]]) -> list[dict[str, Any]]:\n    \"\"\"Return the objects whose ``metadata.labels`` the selector matches.\n\n    Args:\n        selector: Selector in either form.\n        objects: Manifests to filter.\n\n    Returns:\n        The selected objects, in order.\n    \"\"\"\n    return [o for o in objects if selector_matches(selector, (o.get(\"metadata\") or {}).get(\"labels\"))]\n",
 "kubelab/validate.py": "\"\"\"Structural validation of manifests: the mistakes the API server would reject, caught before you apply.\"\"\"\n\nimport re\nfrom typing import Any\n\nfrom kubelab._common import all_containers, as_dict, as_list, pod_spec_of\nfrom kubelab.quantity import QuantityError, parse_cpu, parse_memory\nfrom kubelab.selectors import SelectorError, selector_matches\n\nAPI_VERSIONS: dict[str, str] = {\n    \"Pod\": \"v1\",\n    \"Service\": \"v1\",\n    \"ConfigMap\": \"v1\",\n    \"Secret\": \"v1\",\n    \"Namespace\": \"v1\",\n    \"Deployment\": \"apps/v1\",\n    \"ReplicaSet\": \"apps/v1\",\n    \"DaemonSet\": \"apps/v1\",\n    \"StatefulSet\": \"apps/v1\",\n    \"Job\": \"batch/v1\",\n    \"CronJob\": \"batch/v1\",\n}\nWORKLOADS = frozenset({\"Deployment\", \"ReplicaSet\", \"DaemonSet\", \"StatefulSet\"})\n\n_DNS_LABEL = re.compile(r\"^[a-z0-9]([-a-z0-9]*[a-z0-9])?$\")\n_DNS_SUBDOMAIN = re.compile(r\"^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$\")\n_DNS_1035 = re.compile(r\"^[a-z]([-a-z0-9]*[a-z0-9])?$\")\n_LABEL_NAME = re.compile(r\"^[A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?$\")\n_PORT_NAME = re.compile(r\"^[a-z0-9]([-a-z0-9]*[a-z0-9])?$\")\n_CRON_MACROS = frozenset({\"@yearly\", \"@annually\", \"@monthly\", \"@weekly\", \"@daily\", \"@midnight\", \"@hourly\"})\n_PROBE_HANDLERS = (\"httpGet\", \"tcpSocket\", \"exec\", \"grpc\")\n\n\ndef is_dns_label(name: str) -> bool:\n    \"\"\"Tell whether ``name`` is a valid DNS-1123 label (container names, namespace names).\n\n    Args:\n        name: Candidate name.\n\n    Returns:\n        ``True`` for 1-63 lowercase letters, digits, and hyphens, starting and ending alphanumeric.\n    \"\"\"\n    return len(name) <= 63 and bool(_DNS_LABEL.match(name))\n\n\ndef is_dns_subdomain(name: str) -> bool:\n    \"\"\"Tell whether ``name`` is a valid DNS-1123 subdomain (most object names).\n\n    Args:\n        name: Candidate name.\n\n    Returns:\n        ``True`` for up to 253 characters of dot-separated DNS labels.\n    \"\"\"\n    return len(name) <= 253 and bool(_DNS_SUBDOMAIN.match(name))\n\n\ndef label_problems(labels: Any, where: str) -> list[str]:\n    \"\"\"Check label keys and values against the Kubernetes syntax rules.\n\n    Args:\n        labels: The labels mapping.\n        where: Path used in messages, such as ``metadata.labels``.\n\n    Returns:\n        Problems found (empty when valid).\n    \"\"\"\n    problems: list[str] = []\n    if labels is None:\n        return problems\n    if not isinstance(labels, dict):\n        return [f\"{where}: must be a mapping of strings\"]\n    for key, value in labels.items():\n        key = str(key)\n        prefix, _, name = key.rpartition(\"/\")\n        if prefix and not is_dns_subdomain(prefix):\n            problems.append(f\"{where}: key {key!r} has an invalid prefix\")\n        if not (len(name) <= 63 and _LABEL_NAME.match(name)):\n            problems.append(f\"{where}: key {key!r} is not a valid label name\")\n        if not isinstance(value, str):\n            problems.append(f\"{where}.{key}: value {value!r} must be a string (quote numbers and booleans in YAML)\")\n        elif value and not (len(value) <= 63 and _LABEL_NAME.match(value)):\n            problems.append(f\"{where}.{key}: value {value!r} is not a valid label value\")\n    return problems\n\n\ndef check_object(obj: dict[str, Any]) -> list[str]:\n    \"\"\"Validate one manifest and return every problem found.\n\n    Checks identity (``apiVersion``, ``kind``, ``metadata.name``), labels, and the kind-specific rules for Pods,\n    workloads (Deployment, ReplicaSet, DaemonSet, StatefulSet), Jobs, CronJobs, and Services. Unknown kinds only get\n    the identity checks.\n\n    Args:\n        obj: A manifest.\n\n    Returns:\n        Human-readable problems, each prefixed with the field path. Empty means valid.\n    \"\"\"\n    if not isinstance(obj, dict):\n        return [\"a manifest must be a mapping\"]\n    problems: list[str] = []\n    kind = obj.get(\"kind\")\n    if not kind:\n        problems.append(\"kind: required\")\n    expected = API_VERSIONS.get(str(kind))\n    if not obj.get(\"apiVersion\"):\n        problems.append(\"apiVersion: required\")\n    elif expected and obj[\"apiVersion\"] != expected:\n        problems.append(f\"apiVersion: {kind} uses {expected!r}, not {obj['apiVersion']!r}\")\n    metadata = as_dict(obj.get(\"metadata\"))\n    name = metadata.get(\"name\")\n    if not name:\n        problems.append(\"metadata.name: required\")\n    elif kind == \"Service\" and not (len(str(name)) <= 63 and _DNS_1035.match(str(name))):\n        problems.append(f\"metadata.name: {name!r} must start with a letter and be a DNS-1035 label for a Service\")\n    elif kind == \"Namespace\" and not is_dns_label(str(name)):\n        problems.append(f\"metadata.name: {name!r} is not a valid DNS-1123 label\")\n    elif not is_dns_subdomain(str(name)):\n        problems.append(f\"metadata.name: {name!r} is not a valid DNS-1123 subdomain (lowercase, digits, '-', '.')\")\n    problems += label_problems(metadata.get(\"labels\"), \"metadata.labels\")\n    spec = as_dict(obj.get(\"spec\"))\n    if kind == \"Pod\":\n        problems += check_pod_spec(spec, \"spec\")\n    elif kind in WORKLOADS:\n        problems += _check_workload(str(kind), spec)\n    elif kind == \"Job\":\n        problems += _check_job(spec, \"spec\")\n    elif kind == \"CronJob\":\n        problems += _check_cronjob(spec)\n    elif kind == \"Service\":\n        problems += _check_service(spec)\n    return problems\n\n\ndef check_pod_spec(spec: dict[str, Any], where: str = \"spec\") -> list[str]:\n    \"\"\"Validate a Pod spec: containers, names, images, ports, probes, and resources.\n\n    Args:\n        spec: The Pod spec mapping.\n        where: Path prefix used in messages.\n\n    Returns:\n        Problems found.\n    \"\"\"\n    problems: list[str] = []\n    containers = as_list(spec.get(\"containers\"))\n    if not containers:\n        problems.append(f\"{where}.containers: at least one container is required\")\n    restart = spec.get(\"restartPolicy\")\n    if restart is not None and restart not in (\"Always\", \"OnFailure\", \"Never\"):\n        problems.append(f\"{where}.restartPolicy: {restart!r} must be Always, OnFailure, or Never\")\n    seen: set[str] = set()\n    groups = ((\"initContainers\", as_list(spec.get(\"initContainers\"))), (\"containers\", containers))\n    for group, items in groups:\n        for i, raw in enumerate(items):\n            path = f\"{where}.{group}[{i}]\"\n            container = as_dict(raw)\n            name = str(container.get(\"name\") or \"\")\n            if not name:\n                problems.append(f\"{path}.name: required\")\n            elif not is_dns_label(name):\n                problems.append(f\"{path}.name: {name!r} is not a valid DNS-1123 label\")\n            elif name in seen:\n                problems.append(f\"{path}.name: {name!r} is used by another container in this Pod\")\n            seen.add(name)\n            if not container.get(\"image\"):\n                problems.append(f\"{path}.image: required\")\n            if group == \"initContainers\":\n                policy = container.get(\"restartPolicy\")\n                if policy is not None and policy != \"Always\":\n                    problems.append(f\"{path}.restartPolicy: only 'Always' (a native sidecar) is allowed here\")\n            problems += _check_container(container, path)\n    return problems\n\n\ndef _check_container(container: dict[str, Any], path: str) -> list[str]:\n    problems: list[str] = []\n    port_names: set[str] = set()\n    for j, raw in enumerate(as_list(container.get(\"ports\"))):\n        port = as_dict(raw)\n        number = port.get(\"containerPort\")\n        if not isinstance(number, int) or isinstance(number, bool) or not 1 <= number <= 65535:\n            problems.append(f\"{path}.ports[{j}].containerPort: {number!r} must be an integer from 1 to 65535\")\n        port_name = port.get(\"name\")\n        if port_name is not None:\n            port_name = str(port_name)\n            if not (len(port_name) <= 15 and _PORT_NAME.match(port_name) and re.search(\"[a-z]\", port_name)):\n                problems.append(f\"{path}.ports[{j}].name: {port_name!r} must be 1-15 lowercase letters, digits, '-'\")\n            elif port_name in port_names:\n                problems.append(f\"{path}.ports[{j}].name: {port_name!r} is used twice\")\n            port_names.add(port_name)\n    for probe_kind in (\"startupProbe\", \"livenessProbe\", \"readinessProbe\"):\n        if probe_kind in container:\n            problems += _check_probe(as_dict(container[probe_kind]), port_names, f\"{path}.{probe_kind}\")\n    problems += _check_resources(as_dict(container.get(\"resources\")), f\"{path}.resources\")\n    return problems\n\n\ndef _check_probe(probe: dict[str, Any], port_names: set[str], path: str) -> list[str]:\n    handlers = [h for h in _PROBE_HANDLERS if h in probe]\n    if len(handlers) != 1:\n        return [f\"{path}: needs exactly one of {', '.join(_PROBE_HANDLERS)}\"]\n    handler = handlers[0]\n    if handler in (\"httpGet\", \"tcpSocket\"):\n        port = as_dict(probe[handler]).get(\"port\")\n        if isinstance(port, str) and not port.isdigit() and port not in port_names:\n            return [f\"{path}.{handler}.port: no container port is named {port!r}\"]\n        if port is None:\n            return [f\"{path}.{handler}.port: required\"]\n    problems = []\n    for field in (\"periodSeconds\", \"timeoutSeconds\", \"failureThreshold\", \"successThreshold\"):\n        value = probe.get(field)\n        if value is not None and (not isinstance(value, int) or value < 1):\n            problems.append(f\"{path}.{field}: must be a positive integer\")\n    return problems\n\n\ndef _check_resources(resources: dict[str, Any], path: str) -> list[str]:\n    problems: list[str] = []\n    parsed: dict[str, dict[str, float]] = {\"requests\": {}, \"limits\": {}}\n    for section in (\"requests\", \"limits\"):\n        for resource, value in as_dict(resources.get(section)).items():\n            try:\n                if resource == \"cpu\":\n                    parsed[section][\"cpu\"] = parse_cpu(value)\n                elif resource == \"memory\":\n                    parsed[section][\"memory\"] = float(parse_memory(value))\n            except QuantityError as exc:\n                problems.append(f\"{path}.{section}.{resource}: {exc}\")\n    for resource, request in parsed[\"requests\"].items():\n        limit = parsed[\"limits\"].get(resource)\n        if limit is not None and request > limit:\n            problems.append(f\"{path}: {resource} request is larger than its limit\")\n    return problems\n\n\ndef _check_workload(kind: str, spec: dict[str, Any]) -> list[str]:\n    problems: list[str] = []\n    selector = spec.get(\"selector\")\n    template = as_dict(spec.get(\"template\"))\n    labels = as_dict(template.get(\"metadata\")).get(\"labels\")\n    if not selector or not (as_dict(selector).get(\"matchLabels\") or as_dict(selector).get(\"matchExpressions\")):\n        problems.append(\"spec.selector: required and must not be empty\")\n    else:\n        try:\n            if not selector_matches(selector, labels):\n                problems.append(\"spec.selector: does not match spec.template.metadata.labels\")\n        except SelectorError as exc:\n            problems.append(f\"spec.selector: {exc}\")\n    problems += label_problems(labels, \"spec.template.metadata.labels\")\n    replicas = spec.get(\"replicas\")\n    if replicas is not None and (not isinstance(replicas, int) or isinstance(replicas, bool) or replicas < 0):\n        problems.append(f\"spec.replicas: {replicas!r} must be a non-negative integer\")\n    pod = as_dict(template.get(\"spec\"))\n    restart = pod.get(\"restartPolicy\")\n    if restart not in (None, \"Always\"):\n        problems.append(f\"spec.template.spec.restartPolicy: a {kind} only allows 'Always'\")\n    problems += check_pod_spec(pod, \"spec.template.spec\")\n    if kind == \"Deployment\":\n        problems += _check_strategy(as_dict(spec.get(\"strategy\")))\n    return problems\n\n\ndef _check_strategy(strategy: dict[str, Any]) -> list[str]:\n    kind = strategy.get(\"type\", \"RollingUpdate\")\n    rolling = strategy.get(\"rollingUpdate\")\n    if kind not in (\"RollingUpdate\", \"Recreate\"):\n        return [f\"spec.strategy.type: {kind!r} must be RollingUpdate or Recreate\"]\n    if kind == \"Recreate\":\n        return [\"spec.strategy.rollingUpdate: not allowed with type Recreate\"] if rolling else []\n    rolling = as_dict(rolling)\n    surge, unavailable = rolling.get(\"maxSurge\", \"25%\"), rolling.get(\"maxUnavailable\", \"25%\")\n    if str(surge) in (\"0\", \"0%\") and str(unavailable) in (\"0\", \"0%\"):\n        return [\"spec.strategy.rollingUpdate: maxSurge and maxUnavailable cannot both be 0\"]\n    return []\n\n\ndef _check_job(spec: dict[str, Any], where: str) -> list[str]:\n    problems: list[str] = []\n    pod = as_dict(as_dict(spec.get(\"template\")).get(\"spec\"))\n    if pod.get(\"restartPolicy\") not in (\"Never\", \"OnFailure\"):\n        problems.append(f\"{where}.template.spec.restartPolicy: a Job needs 'Never' or 'OnFailure'\")\n    backoff = spec.get(\"backoffLimit\")\n    if backoff is not None and (not isinstance(backoff, int) or backoff < 0):\n        problems.append(f\"{where}.backoffLimit: must be a non-negative integer\")\n    problems += check_pod_spec(pod, f\"{where}.template.spec\")\n    return problems\n\n\ndef _check_cronjob(spec: dict[str, Any]) -> list[str]:\n    problems: list[str] = []\n    schedule = str(spec.get(\"schedule\") or \"\")\n    if not schedule:\n        problems.append(\"spec.schedule: required\")\n    elif schedule not in _CRON_MACROS and len(schedule.split()) != 5:\n        problems.append(f\"spec.schedule: {schedule!r} needs five fields: minute hour day-of-month month day-of-week\")\n    policy = spec.get(\"concurrencyPolicy\")\n    if policy is not None and policy not in (\"Allow\", \"Forbid\", \"Replace\"):\n        problems.append(f\"spec.concurrencyPolicy: {policy!r} must be Allow, Forbid, or Replace\")\n    if \"jobTemplate\" not in spec:\n        problems.append(\"spec.jobTemplate: required\")\n    else:\n        problems += _check_job(as_dict(as_dict(spec[\"jobTemplate\"]).get(\"spec\")), \"spec.jobTemplate.spec\")\n    return problems\n\n\ndef _check_service(spec: dict[str, Any]) -> list[str]:\n    problems: list[str] = []\n    service_type = spec.get(\"type\", \"ClusterIP\")\n    if service_type not in (\"ClusterIP\", \"NodePort\", \"LoadBalancer\", \"ExternalName\"):\n        problems.append(f\"spec.type: {service_type!r} is not a Service type\")\n    ports = as_list(spec.get(\"ports\"))\n    if service_type != \"ExternalName\" and not ports:\n        problems.append(\"spec.ports: at least one port is required\")\n    for i, raw in enumerate(ports):\n        number = as_dict(raw).get(\"port\")\n        if not isinstance(number, int) or not 1 <= number <= 65535:\n            problems.append(f\"spec.ports[{i}].port: {number!r} must be an integer from 1 to 65535\")\n        if len(ports) > 1 and not as_dict(raw).get(\"name\"):\n            problems.append(f\"spec.ports[{i}].name: required when a Service has more than one port\")\n    return problems\n\n\ndef pod_containers(obj: dict[str, Any]) -> list[dict[str, Any]]:\n    \"\"\"Return every container (init first) of a Pod or a workload's Pod template.\n\n    Args:\n        obj: A manifest.\n\n    Returns:\n        Container mappings; empty for kinds without Pods.\n    \"\"\"\n    spec = pod_spec_of(obj)\n    return all_containers(spec) if spec is not None else []\n",
 "kubelab/workloads.py": "\"\"\"How the control plane reasons about workloads: QoS classes, rollout bounds, and why a Pod is unhappy.\"\"\"\n\nimport math\nfrom dataclasses import dataclass\nfrom typing import Any\n\nfrom kubelab._common import all_containers, as_dict, as_list\nfrom kubelab.quantity import parse_cpu, parse_memory\n\n\ndef qos_class(pod_spec: dict[str, Any]) -> str:\n    \"\"\"Compute the Pod's quality-of-service class the way the kubelet does.\n\n    * ``Guaranteed``: every container sets CPU and memory limits, and requests equal limits (a missing request\n      defaults to its limit).\n    * ``BestEffort``: no container sets any CPU or memory request or limit.\n    * ``Burstable``: anything else.\n\n    Args:\n        pod_spec: A Pod spec.\n\n    Returns:\n        ``\"Guaranteed\"``, ``\"Burstable\"``, or ``\"BestEffort\"``.\n    \"\"\"\n    containers = all_containers(pod_spec)\n    any_set = False\n    guaranteed = bool(containers)\n    for container in containers:\n        resources = as_dict(container.get(\"resources\"))\n        requests, limits = as_dict(resources.get(\"requests\")), as_dict(resources.get(\"limits\"))\n        if any(k in requests or k in limits for k in (\"cpu\", \"memory\")):\n            any_set = True\n        for resource in (\"cpu\", \"memory\"):\n            if resource not in limits:\n                guaranteed = False\n                continue\n            parse = parse_cpu if resource == \"cpu\" else parse_memory\n            request = requests.get(resource, limits[resource])\n            if parse(request) != parse(limits[resource]):\n                guaranteed = False\n    if guaranteed:\n        return \"Guaranteed\"\n    return \"Burstable\" if any_set else \"BestEffort\"\n\n\ndef _resolve(value: int | str, replicas: int, *, round_up: bool) -> int:\n    text = str(value).strip()\n    if text.endswith(\"%\"):\n        exact = replicas * float(text[:-1]) / 100\n        return math.ceil(exact) if round_up else math.floor(exact)\n    number = int(text)\n    if number < 0:\n        raise ValueError(f\"{value!r} must not be negative\")\n    return number\n\n\ndef rollout_bounds(replicas: int, max_surge: int | str = \"25%\", max_unavailable: int | str = \"25%\") -> tuple[int, int]:\n    \"\"\"Return the most Pods that may exist and the fewest that must stay available during a rolling update.\n\n    Percentages are of ``replicas``: ``maxSurge`` rounds **up** and ``maxUnavailable`` rounds **down**, exactly as\n    the Deployment controller does. Defaults are the Deployment defaults (25% each).\n\n    Args:\n        replicas: Desired replica count.\n        max_surge: Absolute number or percentage string such as ``\"25%\"``.\n        max_unavailable: Absolute number or percentage string.\n\n    Returns:\n        ``(max_pods, min_available)``.\n\n    Raises:\n        ValueError: If both resolve to zero (the rollout could never make progress) or a value is negative.\n    \"\"\"\n    if replicas < 0:\n        raise ValueError(\"replicas must not be negative\")\n    surge = _resolve(max_surge, replicas, round_up=True)\n    unavailable = _resolve(max_unavailable, replicas, round_up=False)\n    if surge == 0 and unavailable == 0 and replicas > 0:\n        raise ValueError(\"maxSurge and maxUnavailable cannot both be 0\")\n    return replicas + surge, max(0, replicas - unavailable)\n\n\n@dataclass(frozen=True, slots=True)\nclass PodIssue:\n    \"\"\"A diagnosis of what is wrong with a Pod.\n\n    Attributes:\n        reason: Short reason, such as ``ImagePullBackOff`` or ``OOMKilled``.\n        container: Container the reason applies to, or ``\"\"`` for Pod-level reasons.\n        hint: What to check or fix next.\n    \"\"\"\n\n    reason: str\n    container: str\n    hint: str\n\n\nHINTS: dict[str, str] = {\n    \"Unschedulable\": \"No node fits: read the FailedScheduling event (requests too big, taint, selector, or PVC).\",\n    \"ErrImagePull\": \"The image can't be pulled: check the name and tag, registry access, or kind load the image.\",\n    \"ImagePullBackOff\": \"The image can't be pulled: check the name and tag, registry access, or kind load the image.\",\n    \"CreateContainerConfigError\": \"A referenced ConfigMap, Secret, or key does not exist.\",\n    \"CreateContainerError\": \"The runtime could not create the container: read the event message.\",\n    \"OOMKilled\": \"The container went over its memory limit: raise the limit or fix the leak.\",\n    \"CrashLoopBackOff\": \"The process keeps exiting: read kubectl logs --previous for the reason.\",\n    \"Error\": \"The process exited with a non-zero code: read kubectl logs --previous.\",\n    \"NotReady\": \"Running but failing its readiness probe: check the probe path, port, and timing.\",\n    \"Completed\": \"Nothing is wrong: the Pod ran to completion.\",\n}\n\n\ndef pod_issue(pod: dict[str, Any]) -> PodIssue | None:\n    \"\"\"Diagnose a Pod from its ``status`` (as returned by ``kubectl get pod -o json``).\n\n    The most specific cause wins: an ``OOMKilled`` last state is reported instead of the ``CrashLoopBackOff`` it\n    causes, and a scheduling failure is reported before any container state.\n\n    Args:\n        pod: A Pod object including ``status``.\n\n    Returns:\n        The diagnosis, or ``None`` when the Pod is running and ready.\n    \"\"\"\n    status = as_dict(pod.get(\"status\"))\n    if status.get(\"phase\") == \"Succeeded\":\n        return PodIssue(\"Completed\", \"\", HINTS[\"Completed\"])\n    for condition in as_list(status.get(\"conditions\")):\n        condition = as_dict(condition)\n        if condition.get(\"type\") == \"PodScheduled\" and condition.get(\"status\") == \"False\":\n            return PodIssue(\"Unschedulable\", \"\", HINTS[\"Unschedulable\"])\n    statuses = [\n        as_dict(s) for s in [*as_list(status.get(\"initContainerStatuses\")), *as_list(status.get(\"containerStatuses\"))]\n    ]\n    for container in statuses:\n        name = str(container.get(\"name\", \"\"))\n        last = as_dict(as_dict(container.get(\"lastState\")).get(\"terminated\"))\n        now_terminated = as_dict(as_dict(container.get(\"state\")).get(\"terminated\"))\n        if \"OOMKilled\" in (last.get(\"reason\"), now_terminated.get(\"reason\")):\n            return PodIssue(\"OOMKilled\", name, HINTS[\"OOMKilled\"])\n        waiting = as_dict(as_dict(container.get(\"state\")).get(\"waiting\")).get(\"reason\")\n        if waiting in HINTS:\n            return PodIssue(str(waiting), name, HINTS[str(waiting)])\n        if now_terminated and now_terminated.get(\"exitCode\", 0) != 0:\n            return PodIssue(\"Error\", name, HINTS[\"Error\"])\n    if status.get(\"phase\") == \"Running\":\n        not_ready = [c for c in statuses if c.get(\"ready\") is False]\n        if not_ready:\n            return PodIssue(\"NotReady\", str(not_ready[0].get(\"name\", \"\")), HINTS[\"NotReady\"])\n    return None\n"
};

</script>
<script>
/* Kubernetes Practicum course runtime: layout, progress, Python-in-the-browser, exercises, quizzes, tracer. */
(() => {
  "use strict";

  const PYODIDE_URL = "https://cdn.jsdelivr.net/pyodide/v314.0.3/full/";
  const CDN = {
    prism: "https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/",
    codemirror: "https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/",
    mermaid: "https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js",
  };
  const STORE_KEY = "kubernetes-practicum:v1";
  const C = window.CURRICULUM || { parts: [], reference: [] };
  const body = document.body;
  const ROOT = body.dataset.root || "";
  const PAGE_ID = body.dataset.module || body.dataset.page || "";

  /* ---------------- utilities ---------------- */
  const $ = (sel, el = document) => el.querySelector(sel);
  const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));
  function h(tag, attrs = {}, ...children) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "html") el.innerHTML = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const c of children.flat()) {
      if (c === null || c === undefined || c === false) continue;
      el.append(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return el;
  }
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  function dedent(text) {
    const lines = text.replace(/\t/g, "    ").split("\n");
    while (lines.length && !lines[0].trim()) lines.shift();
    while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
    const indents = lines.filter((l) => l.trim()).map((l) => l.match(/^ */)[0].length);
    const min = indents.length ? Math.min(...indents) : 0;
    return lines.map((l) => l.slice(min)).join("\n");
  }
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const existing = document.querySelector(`script[data-src="${src}"]`);
      if (existing) {
        if (existing.dataset.loaded) resolve();
        else existing.addEventListener("load", () => resolve(), { once: true });
        return;
      }
      const s = h("script", { src, "data-src": src });
      s.addEventListener("load", () => { s.dataset.loaded = "1"; resolve(); }, { once: true });
      s.addEventListener("error", () => reject(new Error(`failed to load ${src}`)), { once: true });
      document.head.append(s);
    });
  }
  function loadCss(href) {
    if (document.querySelector(`link[href="${href}"]`)) return;
    // Library styles go before the page's own so course.css wins ties (e.g. CodeMirror's white background in dark mode).
    const link = h("link", { rel: "stylesheet", href });
    const first = document.head.querySelector("link[rel='stylesheet'], style");
    if (first) first.before(link);
    else document.head.append(link);
  }
  const icon = {
    menu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>',
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
    chev: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>',
    logo: '<svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="4" fill="#76b900"/><circle cx="16" cy="16" r="7" fill="none" stroke="#000" stroke-width="3.5"/></svg>',
    auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>',
  };

  /* ---------------- progress store ---------------- */
  const Store = {
    data: null,
    load() {
      if (this.data) return this.data;
      try { this.data = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { this.data = {}; }
      for (const k of ["items", "quizzes", "exercises", "checklists", "notes", "visits"]) this.data[k] ||= {};
      return this.data;
    },
    save() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(this.data)); } catch { /* storage unavailable: progress is session-only */ }
      document.dispatchEvent(new CustomEvent("pp:progress"));
    },
    get(section, key) { return this.load()[section][key]; },
    set(section, key, value) { this.load()[section][key] = value; this.save(); },
  };
  window.PPStore = Store;

  const allItems = () => C.parts.flatMap((p) => [...p.modules, ...p.projects].map((m) => ({ ...m, part: p })));
  const isDone = (id) => !!Store.get("items", id)?.done;

  /* ---------------- theme: auto (follow the system), light, or dark ---------------- */
  const THEMES = ["auto", "light", "dark"];
  let memoryTheme = "auto"; /* used when localStorage is unavailable */
  function themePref() {
    let saved = memoryTheme;
    try { saved = localStorage.getItem(STORE_KEY + ":theme") || "auto"; } catch { /* storage unavailable */ }
    return THEMES.includes(saved) ? saved : "auto";
  }
  function currentTheme() {
    const forced = document.documentElement.dataset.theme;
    if (forced) return forced;
    return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function applySavedTheme() {
    const pref = themePref();
    if (pref === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = pref;
  }
  function cycleTheme() {
    const next = THEMES[(THEMES.indexOf(themePref()) + 1) % THEMES.length];
    memoryTheme = next;
    try {
      if (next === "auto") localStorage.removeItem(STORE_KEY + ":theme");
      else localStorage.setItem(STORE_KEY + ":theme", next);
    } catch { /* storage unavailable: the choice lasts this visit only */ }
    applySavedTheme();
    document.dispatchEvent(new CustomEvent("pp:theme", { detail: currentTheme() }));
    updateThemeButton();
    return next;
  }
  const toggleTheme = cycleTheme;
  function themeButtonHtml() {
    const pref = themePref();
    return pref === "auto" ? icon.auto : pref === "dark" ? icon.moon : icon.sun;
  }
  function updateThemeButton() {
    const b = $("#pp-theme");
    if (!b) return;
    const pref = themePref();
    b.innerHTML = themeButtonHtml();
    b.setAttribute("aria-label", `Theme: ${pref}. Click to switch (auto, light, dark).`);
    b.title = `Theme: ${pref === "auto" ? "auto (follows your system)" : pref}`;
  }
  try {
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
      if (themePref() === "auto") document.dispatchEvent(new CustomEvent("pp:theme", { detail: currentTheme() }));
    });
  } catch { /* old browsers */ }

  /* ---------------- shell: header, sidebar, toc, pager ---------------- */
  function progressText() {
    const items = allItems();
    return `${items.filter((m) => isDone(m.id)).length} / ${items.length} complete`;
  }
  function addFavicon() {
    if (document.querySelector("link[rel~='icon']")) return;
    const svg = icon.logo.replace('class="logo" ', 'xmlns="http://www.w3.org/2000/svg" ');
    document.head.append(h("link", { rel: "icon", href: "data:image/svg+xml," + encodeURIComponent(svg) }));
  }
  function buildShell() {
    addFavicon();
    const main = $("main") || h("main");
    const header = h("header", { class: "pp-header" },
      h("button", { class: "icon-btn pp-menu-btn", "aria-label": "Toggle navigation", html: icon.menu, onclick: () => body.classList.toggle("nav-open") }),
      h("a", { class: "pp-brand", href: ROOT + "index.html", html: `${icon.logo}<span>${esc(C.title)} <small>${esc(C.badge || ("Python " + C.python))}</small></span>` }),
      h("span", { class: "spacer" }),
      h("span", { class: "pp-progress-pill", id: "pp-progress-pill", text: progressText() }),
      h("button", { class: "icon-btn", id: "pp-theme", "aria-label": "Colour theme", onclick: toggleTheme }),
    );
    const sidebar = h("nav", { class: "pp-sidebar", "aria-label": "Curriculum" });
    renderSidebar(sidebar);
    const contentWrap = h("div", { class: "pp-content-wrap" });
    const mainWrap = h("div", { class: "pp-main" }, contentWrap);
    main.replaceWith(h("div", { class: "pp-layout" }, sidebar, mainWrap));
    contentWrap.append(main);
    const toc = buildToc(main);
    if (toc) contentWrap.append(toc);
    body.prepend(header);
    updateThemeButton();
    document.addEventListener("pp:progress", () => {
      $("#pp-progress-pill").textContent = progressText();
      renderSidebar(sidebar);
    });
    mainWrap.addEventListener("click", () => body.classList.remove("nav-open"));
  }
  function renderSidebar(nav) {
    nav.innerHTML = "";
    const here = location.pathname.split("/").slice(-2).join("/");
    for (const part of C.parts) {
      const items = [...part.modules, ...part.projects];
      const containsCurrent = items.some((m) => m.id === PAGE_ID);
      const wrap = h("div", { class: "part" + (containsCurrent ? " open" : "") });
      const done = items.filter((m) => isDone(m.id)).length;
      wrap.append(h("button", {
        html: `<span class="num">${part.number}</span><span>${esc(part.title)} <span class="status">${done}/${items.length}</span></span><span class="chev">${icon.chev}</span>`,
        onclick: () => wrap.classList.toggle("open"),
      }));
      const ul = h("ul");
      for (const m of items) {
        const label = m.id.startsWith("m") ? m.id.slice(1) : m.id === "capstone" ? "★" : "P" + m.id.slice(1);
        ul.append(h("li", {}, h("a", {
          href: ROOT + m.href, class: m.id === PAGE_ID || m.href.endsWith(here) ? "current" : "",
          html: `<span class="mid">${esc(label)}</span><span>${esc(m.title.replace(/^Project \d+: /, ""))}</span>${isDone(m.id) ? '<span class="done">✓</span>' : ""}`,
        })));
      }
      wrap.append(ul);
      nav.append(wrap);
    }
    nav.append(h("div", { class: "side-title", text: "Reference" }));
    const ref = h("div", { class: "part open" });
    const ul = h("ul", { style: "padding-left:0" });
    for (const r of C.reference) {
      ul.append(h("li", {}, h("a", { href: ROOT + r.href, class: r.id === PAGE_ID ? "current" : "", html: `<span>${esc(r.title)}</span>` })));
    }
    ref.append(ul);
    nav.append(ref);
  }
  function buildToc(main) {
    const sections = $$(".lesson-section[id] > h2, .lesson-section[id] > header > h2", main);
    if (sections.length < 3) return null;
    const toc = h("aside", { class: "pp-toc" }, h("h4", { text: "On this page" }));
    const links = new Map();
    for (const h2 of sections) {
      const sec = h2.closest(".lesson-section");
      const a = h("a", { href: "#" + sec.id, text: h2.textContent });
      links.set(sec, a);
      toc.append(a);
    }
    const obs = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (e.isIntersecting) {
          links.forEach((a) => a.classList.remove("active"));
          links.get(e.target)?.classList.add("active");
        }
      }
    }, { rootMargin: "-20% 0px -70% 0px" });
    links.forEach((_, sec) => obs.observe(sec));
    return toc;
  }
  function buildModuleFooter(main) {
    const items = allItems();
    const idx = items.findIndex((m) => m.id === PAGE_ID);
    if (idx === -1) return;
    const item = items[idx];
    const footer = h("section", { class: "module-footer" });
    const box = h("div", { class: "complete-box" });
    const refresh = () => {
      const done = isDone(PAGE_ID);
      box.classList.toggle("is-done", done);
      const quizzes = $$(".quiz[data-id]", main).map((q) => Store.get("quizzes", q.dataset.id));
      const ex = $$(".exercise[data-id]", main);
      const solved = ex.filter((e) => Store.get("exercises", e.dataset.id)?.solved).length;
      const quizText = quizzes.length ? quizzes.map((q) => (q ? `${Math.round(q.best * 100)}%` : "not taken")).join(", ") : "none";
      box.innerHTML = "";
      box.append(
        h("div", { style: "flex:1;min-width:220px" },
          h("strong", { text: done ? "You completed this " + (item.id.startsWith("m") ? "module" : "project") + "." : "Finished? Mark it complete to track your progress." }),
          h("div", { class: "status", text: `Exercises solved: ${solved}/${ex.length} · Quiz best: ${quizText}` })),
        h("button", {
          class: "btn " + (done ? "" : "ok"), text: done ? "Mark as not complete" : "Mark complete",
          onclick: () => { Store.set("items", PAGE_ID, done ? { done: false } : { done: true, at: new Date().toISOString() }); refresh(); },
        }),
      );
    };
    refresh();

    except BaseException as e:

        except BaseException as e:

class _PPTraceLimit(Exception):
    pass

def _pp_trace(code, stdin="", max_steps=1500):
    steps = []
    out = io.StringIO()
    ids = {}
    _pp_register(code, "<trace>")
    def tag(obj):
        key = id(obj)
        if key not in ids:
            ids[key] = len(ids) + 1
        return ids[key]
    def snap(value):
        try:
            text = repr(value)
        except Exception as e:
            text = f"<repr failed: {type(e).__name__}>"
        if len(text) > 90:
            text = text[:87] + "..."
        item = {"r": text, "t": type(value).__name__}
        if isinstance(value, (list, dict, set, bytearray)) or (
            hasattr(value, "__dict__") and not isinstance(value, (type, types.FunctionType, types.ModuleType, types.BuiltinFunctionType))
        ):
            item["ref"] = tag(value)
        return item
    def frames(frame):
        stack = []
        f = frame
        while f is not None:
            if f.f_code.co_filename == "<trace>":
                local_vars = {}
                for k, v in list(f.f_locals.items()):
                    if (k.startswith("__") and k.endswith("__")) or isinstance(v, types.ModuleType):
                        continue
                    local_vars[k] = snap(v)
                stack.append({"name": f.f_code.co_name, "line": f.f_lineno, "locals": local_vars})
            f = f.f_back
        return stack[::-1]
    def tracer(frame, event, arg):
        if frame.f_code.co_filename != "<trace>":
            return None
        if len(steps) >= max_steps:
            raise _PPTraceLimit()
        if event in ("line", "return", "exception"):
            step = {"event": event, "line": frame.f_lineno, "stack": frames(frame), "out": out.getvalue()}
            if event == "return":
                step["ret"] = snap(arg)
            if event == "exception":
                step["exc"] = f"{arg[0].__name__}: {arg[1]}"
            steps.append(step)
        return tracer
    ns = _pp_new_ns()
    old_out, old_in = sys.stdout, sys.stdin
    sys.stdout, sys.stdin = out, io.StringIO(stdin)
    error = None
    try:
        compiled = compile(code, "<trace>", "exec")
        sys.settrace(tracer)
        exec(compiled, ns)
    except _PPTraceLimit:
        error = f"Stopped after {max_steps} steps (is there an infinite loop?)."
    except BaseException as e:
        error = "".join(traceback.format_exception_only(type(e), e)).strip()
    finally:
        sys.settrace(None)
        sys.stdout, sys.stdin = old_out, old_in
    return json.dumps({"steps": steps, "error": error, "out": out.getvalue()})
