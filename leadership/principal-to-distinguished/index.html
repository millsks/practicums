    h=h.replace(/(^|[\s(>])([A-Z][A-Z0-9]{1,6}s?)(?=[\s,.;:)<-]|$)/g,(x,p,ac)=>/^(I|A|OK|US|UK|CEO|CIO|COO|CFO|CTO|Q[1-4])$/.test(ac)?x:`${p}<span class="ac">${ac}</span>`);
    return a.sw[i]>25?`<span class="long">${h}</span>`:h; }).join(" ");

  catch(e){ document.getElementById(id)?.remove(); document.getElementById("d"+id)?.remove(); el.innerHTML = `<div class="err">${esc(String(e&&e.message||e).split("\n").slice(0,6).join("\n"))}</div>`; return false; }
}

function checklist(items, prefix, saved){ return `<ul class="reqs">${items.map((r,i)=>`<li><label><input type="checkbox" id="${prefix}-${i}" data-ck="${prefix}" data-i="${i}" ${saved&&saved.includes(i)?"checked":""}>${esc(r)}</label></li>`).join("")}</ul>`; }

function labHTML(m){

    return head + `<div data-alloc>${L.cats.map((c,i)=>`<div class="slider"><div class="lab"><b>${esc(c[0])}</b><small>${esc(c[1])} · typical ${c[2]}–${c[3]}%</small></div><input type="range" min="0" max="60" step="5" id="al-${i}" value="${a[i]}" aria-label="${esc(c[0])}"><span class="val" data-v="${i}"></span></div>`).join("")}</div>
      <div class="preview" data-allocout style="white-space:normal"></div>`;
  }
  if (L.type==="sort"){
    return head + `<div data-sort>${L.items.map((it,i)=>`<div class="sortrow" data-row="${i}"><span>${esc(it[0])}</span><select class="sel" id="so-${m.id}-${i}" aria-label="Classify"><option value="">Choose…</option>${L.buckets.map(b=>`<option>${b}</option>`).join("")}</select><div class="fb" hidden></div></div>`).join("")}</div>

  }
  if (L.type==="builder"){
    const v = S.build[m.id] || {};
    return head + `<div class="grid2"><div class="stack" style="gap:.7rem" data-build>${L.fields.map(f=>`<div class="field"><label for="b-${m.id}-${f[0]}">${esc(f[1])}</label><textarea id="b-${m.id}-${f[0]}" data-f="${f[0]}" rows="2" placeholder="${esc(f[2])}">${esc(v[f[0]]||"")}</textarea></div>`).join("")}
      <div class="btns"><button class="btn" data-example>Fill with Northbank example</button><button class="btn" data-clear>Clear</button></div></div>
      <div class="stack" style="gap:.5rem;min-width:0"><div class="edhead"><span class="eyebrow">Preview</span><button class="btn ghost" data-copyprev>Copy</button></div><div class="preview" data-prev></div>
      <span class="eyebrow" style="margin-top:.5rem">Self-check</span>${checklist(L.check, m.id+"-chk")}</div></div>`;
  }
  if (L.type==="mermaid"){
    const code = S.code[m.id] ?? L.starter;
    return head + `<div class="grid2"><div><span class="eyebrow">Your diagram must</span>${checklist(L.reqs, m.id+"-req")}</div><div class="notice">${esc(L.hint)}</div></div>
      <div class="editor"><div class="stack" style="gap:.4rem"><div class="edhead"><span class="eyebrow">Mermaid source</span><span class="status" data-st>…</span></div><textarea id="ed-${m.id}" spellcheck="false" aria-label="Mermaid source">${esc(code)}</textarea></div>
      <div class="stack" style="gap:.4rem"><div class="edhead"><span class="eyebrow">Live preview</span><button class="btn ghost" data-copyed>Copy source</button></div><div class="canvas" data-edprev><span class="loading">Rendering…</span></div></div></div>
      <div class="btns"><button class="btn" data-resetcode>Reset to starter</button></div>`;
  }
  if (L.type==="matrix"){
    const st = S.matrix[m.id] || {w:L.criteria.map(c=>c[1]), s:L.criteria.map(c=>c[2].slice())};
    return head + `<div class="tbl"><table data-matrix><thead><tr><th>Criterion</th><th>Weight</th>${L.options.map(o=>`<th>${esc(o)}</th>`).join("")}</tr></thead><tbody>
      ${L.criteria.map((c,ci)=>`<tr><td>${esc(c[0])}</td><td><input class="cell" type="number" min="0" max="5" id="mw-${ci}" data-w="${ci}" value="${st.w[ci]}" aria-label="Weight for ${esc(c[0])}"></td>${L.options.map((o,oi)=>`<td><input class="cell" type="number" min="1" max="5" id="ms-${ci}-${oi}" data-s="${ci}-${oi}" value="${st.s[ci][oi]}" aria-label="${esc(o)} score for ${esc(c[0])}"></td>`).join("")}</tr>`).join("")}
      <tr><td><b>Weighted total</b></td><td></td>${L.options.map((o,oi)=>`<td class="num" data-tot="${oi}"></td>`).join("")}</tr></tbody></table></div>
      <div class="preview" data-matout style="white-space:normal"></div><div class="btns"><button class="btn" data-matreset>Reset to example</button></div>`;
  }
  if (L.type==="wsjf"){
    const rows = S.wsjf[m.id] || L.items.map(r=>r.slice());
    return head + `<div class="tbl"><table data-wsjf><thead><tr><th>Item</th><th>Business value</th><th>Time criticality</th><th>Risk / opportunity</th><th>Job size</th><th>WSJF</th><th>Rank</th></tr></thead><tbody>
      ${rows.map((r,ri)=>`<tr data-r="${ri}"><td>${esc(r[0])}</td>${[1,2,3,4].map(k=>`<td><input class="cell" type="number" min="1" max="20" id="ws-${ri}-${k}" data-k="${k}" value="${r[k]}" aria-label="${esc(r[0])} score"></td>`).join("")}<td class="num" data-wv></td><td class="num" data-rank></td></tr>`).join("")}
      </tbody></table></div><div class="btns"><button class="btn" data-wsreset>Reset to example</button></div>
      <p class="muted" style="font-size:.88rem">Notice how the large, valuable item can rank below smaller ones. Splitting big items often raises their WSJF; ask whether a thin slice could go first.</p>`;
  }
  if (L.type==="quad"){
    const rows = S.quad[m.id] || L.items.map(r=>r.slice());
    return head + `<div data-quad>${rows.map((r,i)=>`<div class="qrow"><input type="text" class="qname" id="qn-${i}" value="${esc(r[0])}" placeholder="Activity ${i+1}" aria-label="Activity ${i+1}">
      <label class="rng"><span>Leverage <b data-qlv="${i}">${r[1]}</b></span><input type="range" min="1" max="5" step="1" id="ql-${i}" value="${r[1]}"></label>
      <label class="rng"><span>Energy <b data-qev="${i}">${r[2]}</b></span><input type="range" min="1" max="5" step="1" id="qe-${i}" value="${r[2]}"></label></div>`).join("")}</div>
      <p class="muted" style="font-size:.85rem">Leverage: 1 means only you benefit, 5 means many teams benefit. Energy: 1 drains you, 5 energises you. A rating of 3 counts as high.</p>
      <div data-quadout></div><div class="btns"><button class="btn" data-quadreset>Reset to examples</button></div>`;
  }
  if (L.type==="levels"){
    const st = S.lvl[m.id] || [];
    return head + `<div class="notice" style="font-size:.88rem"><b>The seven levels</b><ul>${LVLS.map(l=>`<li><b>${l[0]}</b>: ${l[1]}</li>`).join("")}</ul></div>
      <div data-levels>${L.items.map((it,i)=>`<div class="sortrow" data-lrow="${i}"><span>${esc(it[0])}</span><select class="sel" id="lv-${i}" aria-label="Delegation level for ${esc(it[0])}"><option value="">Choose…</option>${LVLS.map((l,k)=>`<option value="${k+1}" ${st[i]===k+1?"selected":""}>${l[0]}</option>`).join("")}</select><div class="fb" hidden></div></div>`).join("")}</div>
      <div class="btns" style="align-items:center"><button class="btn primary" data-lvcheck>Check against suggested ranges</button><span class="score" data-lvscore></span></div>
      <div class="stack" style="gap:.5rem"><div class="edhead"><span class="eyebrow">Your decision board</span><button class="btn ghost" data-copyboard>Copy board</button></div><div class="preview" data-board></div></div>`;
  }
  if (L.type==="scorecard"){
    const rows = S.score[m.id] || L.rows.map(r=>r.slice());
    return head + `<div class="tbl"><table data-score><thead><tr><th>Measure</th><th>Now</th><th>Target</th><th>Better when</th><th>Status</th></tr></thead><tbody>
      ${rows.map((r,i)=>`<tr data-r="${i}"><td>${esc(r[0])}<div class="muted" style="font-size:.78rem">${esc(r[1])}</div></td><td><input class="cell" type="number" step="any" id="scn-${i}" data-n="${i}" value="${r[2]}" aria-label="Current ${esc(r[0])}"></td><td><input class="cell" type="number" step="any" id="sct-${i}" data-t="${i}" value="${r[3]}" aria-label="Target ${esc(r[0])}"></td><td>${r[4]}</td><td data-st="${i}"></td></tr>`).join("")}
      </tbody></table></div><div class="preview" data-scoreout style="white-space:normal"></div><div class="btns"><button class="btn" data-screset>Reset to example</button></div>`;
  }
  if (L.type==="writing"){
    const w = S.wr[m.id] || {text:L.sample, ask:L.ask, titles:L.titles.slice()};
    return head + `<div class="stack" style="gap:.6rem"><span class="eyebrow">Part 1 · Plain-English checker</span>
      <div class="field"><label for="wr-text">Your paragraph or page</label><textarea id="wr-text" data-wtext rows="7" style="min-height:150px">${esc(w.text)}</textarea><span class="help">Targets for executive readers: average sentence 20 words or fewer, none over 25, reading grade 11 or lower, little passive voice, no jargon, acronyms defined or removed.</span></div>
      <div class="btns"><button class="btn" data-wsample>Load the sample</button><button class="btn" data-wclear>Clear</button></div>
      <div class="wrmetrics" data-wmetrics></div>
      <div class="stack" style="gap:.35rem"><div class="edhead"><span class="eyebrow">Your text, marked up</span><span class="legend"><span class="long">long sentence</span> <mark class="jg">jargon or filler</mark> <span class="pv">passive voice</span> <span class="ac">acronym</span></span></div><div class="preview wrhl" data-whl></div></div></div>
      <div class="stack" style="gap:.6rem;margin-top:1.4rem"><span class="eyebrow">Part 2 · Ghost-deck builder</span>
      <div class="field"><label for="wr-ask">The ask (decision and deadline)</label><input type="text" id="wr-ask" data-wask value="${esc(w.ask||"")}"></div>
      ${[0,1,2,3,4,5].map(i=>`<div class="field"><label for="wr-t${i}">Slide ${i+1} action title</label><input type="text" id="wr-t${i}" data-wt="${i}" value="${esc((w.titles||[])[i]||"")}" placeholder="${i===0?"State the situation as a sentence":i===5?"Restate the ask and next steps":"One point, as a full sentence"}"><span class="help" data-wtfb="${i}"></span></div>`).join("")}
      <div class="stack" style="gap:.35rem"><div class="edhead"><span class="eyebrow">Read the titles in order: do they tell the story?</span><button class="btn ghost" data-copydeck>Copy ghost deck</button></div><div class="preview" data-wdeck></div></div></div>`;
  }
  if (L.type==="scenario"){
    return head + L.scen.map((sc,si)=>`<div class="scen" data-scen="${si}"><span class="eyebrow">Situation ${si+1}</span><p><b>${esc(sc.s)}</b></p>
      ${sc.o.map((o,oi)=>`<label class="opt" data-o="${oi}"><input type="radio" name="sc${si}" id="sc-${si}-${oi}" value="${oi}">${esc(o[0])}</label>`).join("")}<div class="why" hidden></div></div>`).join("") +
      `<div class="btns" style="align-items:center"><button class="btn primary" data-sccheck>See feedback</button><span class="score" data-scscore></span></div>`;
  }
  if (L.type==="tco"){
    const st = S.tco[m.id] || {rows:L.options.map(r=>r.slice()), years:L.years, rate:L.rate};
    return head + `<div class="tbl"><table data-tco><thead><tr><th>Option</th><th>Upfront</th><th>Run / year</th><th>People / year</th><th>Exit</th><th>Nominal total</th><th>Present value</th></tr></thead><tbody>
      ${st.rows.map((r,ri)=>`<tr><td>${esc(r[0])}</td>${[1,2,3,4].map(k=>`<td><input class="cell" type="number" min="0" step="50" id="tc-${ri}-${k}" data-k="${k}" value="${r[k]}" aria-label="${esc(r[0])} cost"></td>`).join("")}<td class="num" data-nom></td><td class="num" data-pv></td></tr>`).join("")}
      </tbody></table></div>
      <div class="btns" style="align-items:center"><label class="field" style="flex-direction:row;align-items:center;gap:.5rem"><span>Years</span><input class="cell" type="number" min="1" max="10" id="tc-years" value="${st.years}"></label><label class="field" style="flex-direction:row;align-items:center;gap:.5rem"><span>Discount rate %</span><input class="cell" type="number" min="0" max="30" step="0.5" id="tc-rate" value="${st.rate}"></label></div>
      <div class="preview" data-tcoout style="white-space:normal"></div><div class="btns"><button class="btn" data-tcoreset>Reset to example</button></div>`;
  }
  return "";
}

const VIEWS = ["home", ...MODULES.map(m=>m.id), "capstones", "reference"];
let current = "home";
function renderTabs(){
  const b=(id,l,d)=>`<button data-go="${id}" aria-current="${current===id}">${d!==undefined?`<span class="dot ${d?"ok":""}"></span>`:""}${l}</button>`;
  document.getElementById("tabs").innerHTML = b("home","Overview")+`<span class="sep"></span>`+MODULES.map((m,i)=>b(m.id,`${i+1}. ${m.title}`,modDone(m))).join("")+`<span class="sep"></span>`+b("capstones","Capstones")+b("reference","Reference");
}
function go(id, top){
  if (!VIEWS.includes(id)) id="home";
  current=id; renderTabs(); CODE.length=0;
  const v=document.getElementById("view");
  v.innerHTML = id==="home"?viewHome(): id==="capstones"?viewCaps(): id==="reference"?viewRef(): viewModule(MODULES.find(m=>m.id===id));
  bind(v,id);
  v.querySelectorAll("[data-mmd]").forEach(el=>draw(el, CODE[+el.dataset.mmd]));
  try{ if(location.hash.slice(1)!==id) history.replaceState(null,"","#"+id); }catch(e){}
  if (top!==false) window.scrollTo({top:0});
  document.querySelector(`nav.tabs [data-go="${id}"]`)?.scrollIntoView({block:"nearest",inline:"center"});
}
const nextMod = () => (MODULES.find(m=>!modDone(m))||{id:"capstones"}).id;

    <div class="los"><span class="eyebrow">The scope ladder · tap each rung</span>

      <div class="loscard" id="loscard"></div></div>

  <section class="section" style="margin-top:2rem"><div class="sec-head"><h2>Learning path</h2></div>
    <div class="path">${stages.map(([k,n,d,idx])=>{ const done=idx.filter(i=>modDone(MODULES[i])).length;

  <section class="section"><div class="sec-head"><h2>Progress register</h2><span class="muted">Saved in this browser.</span></div>
    <div class="tbl"><table><thead><tr><th>Brief</th><th>Module</th><th>Stage</th><th>Read</th><th>Quiz</th><th>Lab</th><th>Project</th></tr></thead><tbody>
    ${MODULES.map(m=>`<tr><td class="num">${m.no}</td><td><button class="link" data-go="${m.id}">${m.title}</button><div class="muted" style="font-size:.8rem">${m.time}</div></td><td>${pill(m.lvl)}</td>

    ${CAPSTONES.map(c=>`<tr><td class="num">${c.code}</td><td><button class="link" data-go="capstones">${c.title}</button></td><td>${pill("e")}</td><td colspan="4" class="num">${(S.cap[c.id]||[]).length}/${c.rubric.length} rubric items</td></tr>`).join("")}

    <p class="muted" style="font-size:.88rem">A module is complete when you have read it, scored 4/5 or better, finished the lab, and met every item in its project rubric.</p></section>

  <section class="section"><div class="sec-head"><h2>How to work through it</h2></div><div class="prose"><ol>

  </article>
  <nav class="pager">${prev?`<button class="btn" data-go="${prev.id}">← ${prev.title}</button>`:"<span></span>"}${next?`<button class="btn primary" data-go="${next.id}">${next.title} →</button>`:`<button class="btn primary" data-go="capstones">Capstones →</button>`}</nav>`;
}

        <div class="stack" style="gap:.4rem"><h4>With finance</h4><ul class="reqs"><li>→ What discount rate and horizon should I use?</li><li>→ How will this show up as capex or opex?</li><li>→ Which unit cost would you track?</li><li>→ What would make you doubt these numbers?</li></ul></div>
        <div class="stack" style="gap:.4rem"><h4>Outside your domain</h4><ul class="reqs"><li>→ What have you tried that did not work?</li><li>→ Which decision is yours, and how can I help with it?</li><li>→ What would you want me to know before I offer a view?</li></ul></div>
        <div class="stack" style="gap:.4rem"><h4>With your sponsor</h4><ul class="reqs"><li>→ What would the committee question in my case today?</li><li>→ Where have you seen my work directly, and where not?</li><li>→ Who else should see it?</li></ul></div>
      </div></div>

    <div class="section" id="r-gloss"><div class="sec-head"><span class="tag">Glossary</span></div><dl class="gloss">${GLOSS.map(g=>`<dt>${g[0]}</dt><dd>${g[1]}</dd>`).join("")}</dl></div>

    <div class="section" id="r-read"><div class="sec-head"><span class="tag">Reading</span><h2>Books and links</h2></div>

/* ======== binding ======== */
function bind(v,id){
  v.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));
  v.querySelectorAll(".toc a").forEach(a=>a.addEventListener("click",e=>{ e.preventDefault(); document.getElementById(a.getAttribute("href").slice(1))?.scrollIntoView({behavior:"smooth"}); }));
  v.querySelectorAll("[data-src]").forEach(b=>b.addEventListener("click",()=>{ const x=b.closest(".fig").querySelector(".srcbox"); x.hidden=!x.hidden; b.textContent=x.hidden?"Source":"Hide source"; }));

  if (id==="home"){
    const card=v.querySelector("#loscard");
    const set=i=>{ const l=LOS[i]; v.querySelectorAll("[data-los]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.los===i));
      card.innerHTML=`<span class="eyebrow">Northbank example</span><div class="big">${esc(l.ex)}</div><div class="kv"><div><span class="k">Typical level</span>${esc(l.own)}</div><div><span class="k">Evidence looks like</span>${esc(l.art)}</div><div style="grid-column:1/-1"><span class="k">What the work is</span>${esc(l.you)}</div></div>`; };
    v.querySelectorAll("[data-los]").forEach(b=>b.addEventListener("click",()=>set(+b.dataset.los))); set(0);
  }

  if (id==="capstones"){
    v.querySelectorAll("[data-ck]").forEach(cb=>cb.addEventListener("change",()=>{ const cid=cb.dataset.ck.slice(4), c=CAPSTONES.find(x=>x.id===cid);
      const set=new Set(S.cap[cid]||[]); cb.checked?set.add(+cb.dataset.i):set.delete(+cb.dataset.i); S.cap[cid]=[...set]; save();
      v.querySelector(`[data-capmeter="${cid}"]`).innerHTML=`<div class="bar"><i style="width:${set.size/c.rubric.length*100}%"></i></div>${set.size}/${c.rubric.length}`; }));
  }

  if (id==="reference"){
    const out=v.querySelector("[data-compout]");
    const render=()=>{ const vals=COMP.map((c,i)=>S.comp[i]); const n=vals.filter(Boolean).length;
      if(!n){ out.innerHTML=`<span class="muted">Rate at least one competency to see your profile.</span>`; return; }
      const low=COMP.map((c,i)=>[c[0],vals[i]]).filter(x=>x[1]).sort((a,b)=>a[1]-b[1]).slice(0,2);
      const map=COMPMAP;
      out.innerHTML=`<div class="stack" style="gap:.4rem">${COMP.map((c,i)=>`<div style="display:grid;grid-template-columns:minmax(0,11rem) minmax(0,1fr) 1.5rem;gap:.6rem;align-items:center;font-size:.85rem"><span>${c[0]}</span><div class="bar" style="height:10px"><i style="width:${(vals[i]||0)*25}%"></i></div><span class="num">${vals[i]||"–"}</span></div>`).join("")}
      <p style="margin-top:.5rem"><b>Focus next:</b> ${low.map(x=>`${x[0]} (${map[x[0]]})`).join(" and ")}.</p></div>`; };
    v.querySelectorAll("[data-c]").forEach(b=>b.addEventListener("click",()=>{ const i=+b.dataset.c, l=+b.dataset.l; S.comp[i]=l; persist();
      v.querySelectorAll(`[data-c="${i}"]`).forEach(x=>x.setAttribute("aria-pressed",+x.dataset.l===l)); render(); }));
    render();
    v.querySelectorAll("[data-copytpl]").forEach(b=>b.addEventListener("click",()=>copyText(TEMPLATES[+b.dataset.copytpl][1], b.closest("details").querySelector("pre"))));
  }

  const m=MODULES.find(x=>x.id===id); if(!m) return;
  v.querySelector("[data-read]").addEventListener("click",e=>{ S.read[m.id]=!S.read[m.id]; save(); e.target.classList.toggle("done",!!S.read[m.id]); e.target.textContent=S.read[m.id]?"✓ Marked as read":"Mark as read"; });
  const lb=v.querySelector("[data-labdone]");
  const markLab=(on)=>{ S.lab[m.id]=on; save(); lb.classList.toggle("done",on); lb.textContent=on?"✓ Lab complete":"Mark lab complete"; };
  lb.addEventListener("click",()=>{ markLab(!S.lab[m.id]); if(S.lab[m.id]) toast("Lab recorded"); });

  const form=v.querySelector("[data-quiz]");
  form.addEventListener("submit",e=>{ e.preventDefault(); let sc=0;
    m.quiz.forEach((q,qi)=>{ const fs=form.querySelectorAll("fieldset")[qi], sel=form.querySelector(`input[name="q${qi}"]:checked`);
      fs.querySelectorAll(".opt").forEach((o,oi)=>{ o.classList.remove("right","wrong"); if(oi===q.a) o.classList.add("right"); else if(sel&&+sel.value===oi) o.classList.add("wrong"); });
      const ok=sel&&+sel.value===q.a; if(ok) sc++; const w=fs.querySelector(".why"); w.hidden=false; w.innerHTML=`<b>${ok?"Correct.":sel?"Not quite.":"No answer."}</b> ${esc(q.why)}`; });
    form.querySelector("[data-qscore]").textContent=`${sc} / 5`; S.quiz[m.id]=Math.max(S.quiz[m.id]||0,sc); save(); if(sc>=4) toast("Quiz passed"); });
  form.querySelector("[data-qreset]").addEventListener("click",()=>{ form.reset(); form.querySelectorAll(".opt").forEach(o=>o.classList.remove("right","wrong")); form.querySelectorAll(".why").forEach(w=>w.hidden=true); form.querySelector("[data-qscore]").textContent=""; });

  v.querySelectorAll(`[data-ck="pj-${m.id}"]`).forEach(cb=>cb.addEventListener("change",()=>{ const set=new Set(S.proj[m.id]||[]); cb.checked?set.add(+cb.dataset.i):set.delete(+cb.dataset.i); S.proj[m.id]=[...set]; save();
    v.querySelector("[data-pjmeter]").innerHTML=`<div class="bar"><i style="width:${set.size/m.project.rubric.length*100}%"></i></div>${set.size}/${m.project.rubric.length}`; }));

  const L=m.lab;
  if (L.type==="allocate"){
    const out=v.querySelector("[data-allocout]");
    const upd=()=>{ const vals=L.cats.map((c,i)=>+v.querySelector(`#al-${i}`).value); S.alloc[m.id]=vals; persist();
      const tot=vals.reduce((a,b)=>a+b,0)||1; const notes=[];
      L.cats.forEach((c,i)=>{ const p=Math.round(vals[i]/tot*100); const f=p<c[2]?"lo":p>c[3]?"hi":"ok";
        v.querySelector(`[data-v="${i}"]`).innerHTML=`${p}%`;
        if(f!=="ok") notes.push(`<li><b>${c[0]}</b> is ${p}%<span class="flag ${f}">${f==="lo"?"below range":"above range"}</span></li>`); });
      out.innerHTML=`<p><b>Raw total ${vals.reduce((a,b)=>a+b,0)}</b>, shown as shares of 100%.</p>${notes.length?`<ul style="margin:.4rem 0 0;padding-left:1.1rem">${notes.join("")}</ul><p style="margin-top:.5rem" class="muted">Pick one category to move toward its range next fortnight. Write down what you will delegate or decline to make room.</p>`:`<p style="margin-top:.4rem">Every category is inside its typical range.</p>`}`; };
    v.querySelectorAll("[data-alloc] input").forEach(r=>r.addEventListener("input",upd)); upd();
  }
  if (L.type==="sort"){
    v.querySelector("[data-sortcheck]").addEventListener("click",()=>{ let sc=0;
      L.items.forEach((it,i)=>{ const row=v.querySelector(`[data-row="${i}"]`), val=row.querySelector("select").value, fb=row.querySelector(".fb");
        row.classList.remove("right","wrong"); const ok=val===it[1]; if(ok) sc++; row.classList.add(ok?"right":"wrong"); fb.hidden=false; fb.textContent=(ok?"Correct. ":`Answer: ${it[1]}. `)+it[2]; });
      v.querySelector("[data-sortscore]").textContent=`${sc} / ${L.items.length}`; if(sc>=L.items.length-2){ markLab(true); toast("Lab recorded"); } });
  }
  if (L.type==="builder"){
    const prev=v.querySelector("[data-prev]");
    const vals=()=>{ const o={}; v.querySelectorAll("[data-build] [data-f]").forEach(t=>o[t.dataset.f]=t.value.trim()); return o; };
    const upd=()=>{ const o=vals(); S.build[m.id]=o; persist(); prev.textContent=L.template(o); };
    v.querySelectorAll("[data-build] [data-f]").forEach(t=>t.addEventListener("input",upd));
    v.querySelector("[data-example]").addEventListener("click",()=>{ L.fields.forEach(f=>v.querySelector(`[data-f="${f[0]}"]`).value=f[2]); upd(); });
    v.querySelector("[data-clear]").addEventListener("click",()=>{ v.querySelectorAll("[data-build] [data-f]").forEach(t=>t.value=""); upd(); });
    v.querySelector("[data-copyprev]").addEventListener("click",()=>copyText(prev.textContent, prev));
    upd();
  }
  if (L.type==="mermaid"){
    const ta=v.querySelector(`#ed-${m.id}`), pv=v.querySelector("[data-edprev]"), st=v.querySelector("[data-st]"); let t;
    const run=async()=>{ const ok=await draw(pv,ta.value); st.textContent=ok?"Renders":"Syntax error"; st.className="status "+(ok?"ok":"bad"); };
    ta.addEventListener("input",()=>{ S.code[m.id]=ta.value; persist(); clearTimeout(t); t=setTimeout(run,450); });
    v.querySelector("[data-resetcode]").addEventListener("click",()=>{ ta.value=L.starter; S.code[m.id]=ta.value; persist(); run(); });
    v.querySelector("[data-copyed]").addEventListener("click",()=>copyText(ta.value, ta));
    run();
  }
  if (L.type==="matrix"){
    const out=v.querySelector("[data-matout]");
    const upd=()=>{ const w=L.criteria.map((c,ci)=>Math.max(0,+v.querySelector(`#mw-${ci}`).value||0));
      const s=L.criteria.map((c,ci)=>L.options.map((o,oi)=>Math.min(5,Math.max(1,+v.querySelector(`#ms-${ci}-${oi}`).value||1))));
      S.matrix[m.id]={w,s}; persist();
      const tot=L.options.map((o,oi)=>s.reduce((a,row,ci)=>a+row[oi]*w[ci],0)); const max=Math.max(...tot), wsum=w.reduce((a,b)=>a+b,0)||1;
      tot.forEach((x,oi)=>{ const td=v.querySelector(`[data-tot="${oi}"]`); td.textContent=`${x} (${(x/wsum).toFixed(2)})`; td.classList.toggle("win",x===max); });
      const win=L.options[tot.indexOf(max)]; const sorted=[...tot].sort((a,b)=>b-a); const margin=sorted[0]-sorted[1];
      const sens=L.criteria.map((c,ci)=>c[0]).filter((c,ci)=>{ const t2=L.options.map((o,oi)=>s.reduce((a,row,k)=>a+row[oi]*(k===ci?w[k]+1:w[k]),0)); const t3=L.options.map((o,oi)=>s.reduce((a,row,k)=>a+row[oi]*(k===ci?Math.max(0,w[k]-1):w[k]),0));
        return t2.indexOf(Math.max(...t2))!==tot.indexOf(max) || t3.indexOf(Math.max(...t3))!==tot.indexOf(max); });
      out.innerHTML=`<p><b>Leading option: ${esc(win)}</b>, by ${margin} weighted points.</p><p style="margin-top:.35rem">${sens.length?`Sensitivity points: changing the weight of <b>${sens.map(esc).join("</b>, <b>")}</b> by one would change the winner. Focus the stakeholder discussion there.`:"No single one-point weight change flips the result. The recommendation is fairly robust."}</p>`; };
    v.querySelectorAll("[data-matrix] input").forEach(i=>i.addEventListener("input",upd));
    v.querySelector("[data-matreset]").addEventListener("click",()=>{ delete S.matrix[m.id]; persist(); go(m.id,false); document.getElementById("lab")?.scrollIntoView(); });
    upd();
  }
  if (L.type==="wsjf"){
    const upd=()=>{ const rows=[...v.querySelectorAll("[data-wsjf] tbody tr")].map((tr,ri)=>{ const vals=[1,2,3,4].map(k=>Math.max(1,+tr.querySelector(`[data-k="${k}"]`).value||1)); return [L.items[ri][0],...vals]; });
      S.wsjf[m.id]=rows; persist();
      const ws=rows.map(r=>(r[1]+r[2]+r[3])/r[4]); const order=ws.map((x,i)=>[x,i]).sort((a,b)=>b[0]-a[0]);
      v.querySelectorAll("[data-wsjf] tbody tr").forEach((tr,ri)=>{ tr.querySelector("[data-wv]").textContent=ws[ri].toFixed(1); const rk=order.findIndex(o=>o[1]===ri)+1; const c=tr.querySelector("[data-rank]"); c.textContent=rk; c.classList.toggle("win",rk===1); }); };
    v.querySelectorAll("[data-wsjf] input").forEach(i=>i.addEventListener("input",upd));
    v.querySelector("[data-wsreset]").addEventListener("click",()=>{ delete S.wsjf[m.id]; persist(); go(m.id,false); document.getElementById("lab")?.scrollIntoView(); });
    upd();
  }
  if (L.type==="quad"){
    const out=v.querySelector("[data-quadout]");
    const upd=()=>{ const rows=L.items.map((it,i)=>[v.querySelector(`#qn-${i}`).value.trim(), +v.querySelector(`#ql-${i}`).value, +v.querySelector(`#qe-${i}`).value]);
      S.quad[m.id]=rows; persist();
      rows.forEach((r,i)=>{ v.querySelector(`[data-qlv="${i}"]`).textContent=r[1]; v.querySelector(`[data-qev="${i}"]`).textContent=r[2]; });
      const Q={protect:[],lighter:[],ration:[],drop:[]};
      rows.filter(r=>r[0]).forEach(r=>{ const hl=r[1]>=3, he=r[2]>=3; Q[hl?(he?"protect":"lighter"):(he?"ration":"drop")].push(r[0]); });
      out.innerHTML=`<div class="quadwrap"><span class="axis-y">↑ More leverage</span><div class="quad">${QUADS.map(q=>`<div class="q-${q[0]}"><b>${q[1]}</b><span class="hint">${q[2]}</span><ul>${Q[q[0]].length?Q[q[0]].map(x=>`<li>${esc(x)}</li>`).join(""):`<li class="muted">None</li>`}</ul><span class="hint">${q[3]}</span></div>`).join("")}</div><span class="axis-x">More energising →</span></div>
        ${Q.drop.length?`<p style="margin-top:.6rem"><b>First move:</b> pick one item from "Delegate, automate or drop" and name who or what takes it over.</p>`:""}`; };
    v.querySelectorAll("[data-quad] input").forEach(i=>i.addEventListener("input",upd));
    v.querySelector("[data-quadreset]").addEventListener("click",()=>{ delete S.quad[m.id]; persist(); go(m.id,false); document.getElementById("lab")?.scrollIntoView(); });
    upd();
  }
  if (L.type==="levels"){
    const board=v.querySelector("[data-board]");
    const vals=()=>L.items.map((it,i)=>+v.querySelector(`#lv-${i}`).value||0);
    const render=()=>{ const s=vals(); S.lvl[m.id]=s; persist();
      const grp=[["TEAM DECIDES (Inquire or Delegate)",[6,7]],["TEAM DECIDES, I ADVISE (Advise)",[5]],["WE DECIDE TOGETHER (Consult or Agree)",[3,4]],["I DECIDE (Tell or Sell)",[1,2]]];
      const unset=L.items.filter((it,i)=>!s[i]).length;
      board.textContent=`DECISION BOARD: <team name>\n\n`+grp.map(([h,ls])=>{ const its=L.items.filter((it,i)=>ls.includes(s[i])); return `${h}\n${its.length?its.map((it,i)=>`- ${it[0]}`).join("\n"):"- (none yet)"}`; }).join("\n\n")+(unset?`\n\nNot yet set: ${unset}`:"")+`\n\nReviewed: <date>. Levels rise as trust grows.`; };
    v.querySelectorAll("[data-levels] select").forEach(sel=>sel.addEventListener("change",render));
    v.querySelector("[data-lvcheck]").addEventListener("click",()=>{ const s=vals(); let sc=0;
      L.items.forEach((it,i)=>{ const row=v.querySelector(`[data-lrow="${i}"]`), fb=row.querySelector(".fb"); const ok=s[i]>=it[1]&&s[i]<=it[2]; if(ok) sc++;
        row.classList.remove("right","wrong"); row.classList.add(ok?"right":"wrong"); fb.hidden=false;
        const rng=it[1]===it[2]?LVLS[it[1]-1][0]:`${LVLS[it[1]-1][0]} to ${LVLS[it[2]-1][0]}`;
        fb.textContent=(ok?"Within range. ":s[i]?`Suggested: ${rng}. `:`Not set. Suggested: ${rng}. `)+it[3]; });
      v.querySelector("[data-lvscore]").textContent=`${sc} / ${L.items.length}`; if(sc>=L.items.length-2){ markLab(true); toast("Lab recorded"); } });
    v.querySelector("[data-copyboard]").addEventListener("click",()=>copyText(board.textContent, board));
    render();
  }
  if (L.type==="scorecard"){
    const out=v.querySelector("[data-scoreout]");
    const rate=(cur,tgt,dir)=>{ if(dir==="lower"){ if(cur<=tgt) return "g"; if(tgt===0) return cur<=2?"a":"r"; return cur<=tgt*1.25?"a":"r"; } if(cur>=tgt) return "g"; return cur>=tgt*0.75?"a":"r"; };
    const upd=()=>{ const rows=L.rows.map((r,i)=>[r[0],r[1],+v.querySelector(`#scn-${i}`).value||0,+v.querySelector(`#sct-${i}`).value||0,r[4]]);
      S.score[m.id]=rows; persist(); const c={g:0,a:0,r:0}; const reds=[];
      rows.forEach((r,i)=>{ const st=rate(r[2],r[3],r[4]); c[st]++; if(st==="r") reds.push(r[0]);
        v.querySelector(`[data-st="${i}"]`).innerHTML=`<span class="flag ${st==="g"?"ok":st==="a"?"lo":"hi"}">${st==="g"?"Green":st==="a"?"Amber":"Red"}</span>`; });
      out.innerHTML=`<p><b>${c.g} green, ${c.a} amber, ${c.r} red.</b></p>${reds.length?`<p style="margin-top:.35rem">For each red, write an owner and one action before your next review: ${reds.map(r=>`<b>${esc(r)}</b>`).join(", ")}.</p>`:`<p style="margin-top:.35rem">Nothing is red. Check that your targets are ambitious enough to drive improvement.</p>`}<p class="muted" style="margin-top:.35rem;font-size:.85rem">Amber means within 25% of the target. Compare trends within your domain, not between teams.</p>`; };
    v.querySelectorAll("[data-score] input").forEach(i=>i.addEventListener("input",upd));
    v.querySelector("[data-screset]").addEventListener("click",()=>{ delete S.score[m.id]; persist(); go(m.id,false); document.getElementById("lab")?.scrollIntoView(); });
    upd();
  }
  if (L.type==="writing"){
    const ta=v.querySelector("[data-wtext]"), met=v.querySelector("[data-wmetrics]"), hl=v.querySelector("[data-whl]"), deck=v.querySelector("[data-wdeck]"), ask=v.querySelector("[data-wask]");
    const state=()=>({text:ta.value, ask:ask.value, titles:[0,1,2,3,4,5].map(i=>v.querySelector(`[data-wt="${i}"]`).value)});
    const runText=()=>{ const a=analyse(ta.value);
      if(!a){ met.innerHTML=`<p class="muted">Paste or type some text to check it.</p>`; hl.innerHTML=""; return; }
      const row=(k,val,ok,note)=>`<div class="wm ${ok?"ok":"bad"}"><span class="k">${k}</span><span class="v">${val}</span><span class="n">${ok?"✓ ":"✗ "}${note}</span></div>`;
      const pg=Math.round(a.passive/Math.max(1,a.sents.length)*100);
      met.innerHTML=`<div class="wmgrid">
        ${row("Average sentence",`${a.avg.toFixed(1)} words`,a.avg<=20,"target 20 or fewer")}
        ${row("Sentences over 25 words",a.long,a.long===0,"target none")}
        ${row("Reading grade",Math.max(0,a.grade).toFixed(1),a.grade<=11,"target 11 or lower")}
        ${row("Passive sentences",`${a.passive} (${pg}%)`,pg<=10,"target 1 in 10 or fewer")}
        ${row("Jargon and filler",a.jargon.length,a.jargon.length===0,a.jargon.length?a.jargon.slice(0,6).map(j=>`${j} → ${JARGON[j]}`).join("; "):"none found")}
        ${row("Acronyms",a.acr.length,a.acr.length===0,a.acr.length?`define or remove: ${a.acr.slice(0,8).join(", ")}`:"none found")}
        ${row("Opening sentence",a.opensWithAsk?"States an ask":"No ask found",a.opensWithAsk,a.opensWithAsk?"good":"lead with the ask or conclusion")}
        <div class="wm"><span class="k">Length</span><span class="v">${a.words} words</span><span class="n">about ${a.mins} min to read</span></div></div>`;
      hl.innerHTML=markup(a);
      const pass=a.avg<=20&&a.long===0&&a.grade<=11&&pg<=10&&a.jargon.length===0;
      if(pass&&!S.lab[m.id]&&ta.value!==L.sample){ markLab(true); toast("Meets every core target · lab recorded"); } };
    const runDeck=()=>{ const s=state(); const lines=[];
      s.titles.forEach((t,i)=>{ const [msg,cls]=titleCheck(t); const el=v.querySelector(`[data-wtfb="${i}"]`); el.textContent=msg; el.className="help tfb "+cls; if(t.trim()) lines.push(`${i+1}. ${t.trim()}`); });
      const askWords=/\b(need|approve|approval|decide|decision|ask|request|recommend|by \d|by (mon|tue|wed|thu|fri)|deadline)\b/i;
      const filled=s.titles.map(t=>t.trim()).filter(Boolean);
      const atStart=filled.slice(0,3).some(t=>askWords.test(t)), atEnd=filled.length&&askWords.test(filled[filled.length-1]);
      const labels=filled.filter(t=>titleCheck(t)[1]==="bad").length;
      deck.textContent=`ASK: ${s.ask.trim()||"(write the ask)"}\n\n${lines.join("\n")||"(write your titles)"}\n\nAPPENDIX: supporting detail\n\n— Checks —\n${labels?`✗ ${labels} title(s) read as labels`:"✓ No label titles"}\n${filled.length>6?"✗ More than six main slides":`✓ ${filled.length} main slide(s)`}\n${atStart?"✓ The ask or recommendation appears early":"✗ Put the ask or recommendation in the first three slides"}\n${atEnd?"✓ The last slide restates the ask":"✗ End by restating the ask"}`; };
    const saveAll=()=>{ S.wr[m.id]=state(); persist(); };
    let t; ta.addEventListener("input",()=>{ saveAll(); clearTimeout(t); t=setTimeout(runText,300); });
    v.querySelectorAll("[data-wt],[data-wask]").forEach(i=>i.addEventListener("input",()=>{ saveAll(); runDeck(); }));
    v.querySelector("[data-wsample]").addEventListener("click",()=>{ ta.value=L.sample; saveAll(); runText(); });
    v.querySelector("[data-wclear]").addEventListener("click",()=>{ ta.value=""; saveAll(); runText(); ta.focus(); });
    v.querySelector("[data-copydeck]").addEventListener("click",()=>copyText(deck.textContent, deck));
    runText(); runDeck();
  }
  if (L.type==="tco"){
    const out=v.querySelector("[data-tcoout]");
    const upd=()=>{ const trs=[...v.querySelectorAll("[data-tco] tbody tr")];
      const rows=trs.map((tr,ri)=>[L.options[ri][0],...[1,2,3,4].map(k=>Math.max(0,+tr.querySelector(`[data-k="${k}"]`).value||0))]);
      const years=Math.min(10,Math.max(1,+v.querySelector("#tc-years").value||1)), rate=Math.max(0,+v.querySelector("#tc-rate").value||0);
      S.tco[m.id]={rows,years,rate}; persist();
      const res=tcoCalc(rows,years,rate); const minPv=Math.min(...res.map(x=>x.pv));
      trs.forEach((tr,ri)=>{ tr.querySelector("[data-nom]").textContent=fmtK(res[ri].nom); const c=tr.querySelector("[data-pv]"); c.textContent=fmtK(res[ri].pv); c.classList.toggle("win",res[ri].pv===minPv); });
      const best=res.find(x=>x.pv===minPv);
      const labels=["upfront","run","people","exit"]; let top=null;
      rows.forEach((r,ri)=>[1,2,3,4].forEach(k=>{ const alt=rows.map(x=>x.slice()); alt[ri][k]=r[k]*1.3; const a=tcoCalc(alt,years,rate); const w=a.findIndex(x=>x.pv===Math.min(...a.map(y=>y.pv)));
        const delta=Math.abs(a[ri].pv-res[ri].pv); if(!top||delta>top.delta) top={delta,name:r[0],what:labels[k-1],flips:a[w].name!==best.name}; }));
      const people=rows.map((r,ri)=>r[3]*years/Math.max(1,res[ri].nom));
      out.innerHTML=`<p><b>Lowest present-value cost: ${esc(best.name)}</b> at ${fmtK(best.pv)} over ${years} years at ${rate}%.</p>
        <p style="margin-top:.35rem">Most sensitive input: <b>${esc(top.name)}, ${top.what} cost</b>. A 30% overrun moves its present value by ${fmtK(top.delta)}${top.flips?", <b>enough to change the cheapest option</b>":", without changing the cheapest option"}.</p>
        <p style="margin-top:.35rem">People costs are ${rows.map((r,ri)=>`${Math.round(people[ri]*100)}% of ${esc(r[0])}`).join(", ")} in nominal terms. Check that these estimates come from real staffing plans.</p>
        <p class="muted" style="margin-top:.35rem;font-size:.85rem">Cost only. Add benefits to get NPV, and ask finance for the firm's discount rate.</p>`; };
    v.querySelectorAll("[data-tco] input, #tc-years, #tc-rate").forEach(i=>i.addEventListener("input",upd));
    v.querySelector("[data-tcoreset]").addEventListener("click",()=>{ delete S.tco[m.id]; persist(); go(m.id,false); document.getElementById("lab")?.scrollIntoView(); });
    upd();
  }
  if (L.type==="scenario"){
    v.querySelector("[data-sccheck]").addEventListener("click",()=>{ let strong=0;
      L.scen.forEach((sc,si)=>{ const box=v.querySelector(`[data-scen="${si}"]`), sel=box.querySelector("input:checked"), why=box.querySelector(".why");
        box.querySelectorAll(".opt").forEach((o,oi)=>{ o.classList.remove("strong","ok","weak"); if(sel&&+sel.value===oi) o.classList.add(sc.o[oi][1]); else if(sc.o[oi][1]==="strong") o.classList.add("strong"); });
        why.hidden=false; if(!sel){ why.innerHTML=`<b>No answer.</b> Strongest: ${esc(sc.o.find(o=>o[1]==="strong")[0])}`; return; }
        const o=sc.o[+sel.value]; if(o[1]==="strong") strong++; why.innerHTML=`<b>${o[1]==="strong"?"Strong.":o[1]==="ok"?"Workable, with costs.":"Weak."}</b> ${esc(o[2])}`; });
      v.querySelector("[data-scscore]").textContent=`${strong} / ${L.scen.length} strong`; if(strong>=3){ markLab(true); toast("Lab recorded"); } });
  }
}

document.getElementById("tabs").addEventListener("click",e=>{ const b=e.target.closest("[data-go]"); if(b) go(b.dataset.go); });
updateMeter();
go((location.hash||"#home").slice(1), false);
</script>
</body></html>
